<!DOCTYPE html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "PDF",
  "category": "Tools",
  "fields": [
    { "key": "pdf", "label": "PDF file", "type": "file", "accept": ".pdf", "folder": "assets" },
    { "key": "title", "label": "Name",            "type": "text",   "placeholder": "Title bar and downloaded file" },
    { "key": "page",  "label": "Start page",      "type": "number", "min": 1, "step": 1, "default": 1 }
  ]
}
</script>
<!-- Standalone fallback. Inside Beamer+ the host injects the shared widget
     base (tokens, fonts, toolbar, buttons) ahead of everything else. Opened
     directly (a file in Edge, a plain web server) nothing does, so load the
     same stylesheet from the repo, relative to this file, at the same point in
     the cascade. Beamer+ is unaffected: its link is already present. -->
<script id="bw-standalone">
(function () {
  if (document.querySelector('link[href*="widget-base.css"]')) return;
  var head = document.head || document.getElementsByTagName('head')[0];
  [['preconnect', 'https://fonts.googleapis.com'],
   ['stylesheet', 'https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap'],
   ['stylesheet', '../static/css/widget-base.css']].forEach(function (l) {
    var el = document.createElement('link');
    el.rel = l[0]; el.href = l[1];
    head.appendChild(el);
  });
  document.documentElement.setAttribute('data-bw-standalone', '');
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Textbook — Beamer+</title>
<script src="/static/vendor/socket.io.min.js"></script>

<style>
/* Tokens, reset, toolbar and buttons come from the shared widget base
   (static/css/widget-base.css). What's left here is the reader: the page on
   its stage, and the few controls that belong beside it. */

html, body { height: 100%; overflow: hidden; }

/* The one colour this widget owns: the stage the page sits on, so a white
   page reads as paper rather than as the slide's background. */
#shell { --stage: #e6e6e3; }

/* ── Toolbar ─────────────────────────────────────────────── */
/* Fit Page / Fit Width as one segmented control, and the page box in
   figures big enough to read on a lectern. */
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; flex: 0 0 auto; }
.seg .bw-btn { border: 0; border-radius: 0; height: calc(var(--ctl-h) - 2px); }
.seg .bw-btn + .bw-btn { border-left: 1px solid var(--border); }

.page-nav { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }

#page-input {
  width: 46px;
  height: var(--ctl-h);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-subtle);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: var(--fs-chrome);
  font-variant-numeric: tabular-nums;
  text-align: center;
  outline: none;
  padding: 0 4px;
  -moz-appearance: textfield;
  transition: border-color var(--dur), background var(--dur);
}
#page-input::-webkit-inner-spin-button,
#page-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
#page-input:not([readonly]):focus { border-color: var(--border-med); background: var(--bg); }
#page-input[readonly] { cursor: default; }

.page-sep { font-family: var(--font-mono); font-size: var(--fs-chrome-sm); color: var(--text-3); user-select: none; }
#page-total {
  font-family: var(--font-mono);
  font-size: var(--fs-chrome);
  font-variant-numeric: tabular-nums;
  color: var(--text-2);
  min-width: 22px;
  user-select: none;
}
#zoom-val {
  font-family: var(--font-mono);
  font-size: var(--fs-chrome-sm);
  font-variant-numeric: tabular-nums;
  color: var(--text-2);
  min-width: 40px;
  text-align: center;
  user-select: none;
}

/* ── The page ────────────────────────────────────────────── */
#canvas-area {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  background: var(--stage);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

#page-wrap {
  flex-shrink: 0;
  display: none;
  border-radius: 2px;
  background: #fff;
  box-shadow: 0 2px 18px rgba(0, 0, 0, 0.18), 0 1px 4px rgba(0, 0, 0, 0.08);
  transform-origin: center center;
  will-change: transform;
  cursor: grab;
  touch-action: none;
  user-select: none;
}
#page-wrap.panning { cursor: grabbing; }
#pdf-canvas { display: block; border-radius: 2px; }

/* ── Waiting, or nothing to show ─────────────────────────── */
#state-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--stage);
  color: var(--text-3);
  font-size: var(--fs-small);
  z-index: 20;
  pointer-events: none;
}
#state-overlay.hidden { display: none; }
.spinner {
  width: 22px;
  height: 22px;
  border: 2px solid rgba(0, 0, 0, 0.12);
  border-top-color: var(--text-2);
  border-radius: 50%;
  animation: spin 0.65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* The audience sees the page, not a notice about it. */
#viewer-badge { display: none !important; }

/* Viewer role: strip every control, keep a quiet page readout. */
#page-readout {
  font-variant-numeric: tabular-nums;
  font-family: var(--font-mono);
  font-size: var(--fs-chrome-sm);
  color: var(--text-3);
}
body:not(.is-viewer) #page-readout { display: none; }
body.is-viewer .page-nav,
body.is-viewer .seg,
body.is-viewer #zoom-group,
body.is-viewer #btn-download,
body.is-viewer .bw-sep:not(:first-of-type) { display: none !important; }

/* A narrow slide region keeps the page turning and drops the rest. */
@media (max-width: 720px) { #btn-download { display: none !important; } }
@media (max-width: 600px) { #zoom-group { display: none !important; } }
@media (max-width: 480px) {
  .bw-toolbar-title, .bw-toolbar-title + .bw-sep { display: none !important; }
  .seg { display: none; }
}

@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
</style>
</head>
<body>
<div id="shell" class="bw-shell">

  <div id="toolbar" class="bw-toolbar" data-bw-topbar>
    <span class="bw-toolbar-title" id="doc-title">Textbook</span>
    <div class="bw-sep"></div>
    <div class="page-nav">
      <button class="bw-btn bw-btn--icon" id="btn-prev" disabled title="Previous page (←)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <input id="page-input" type="number" min="1" aria-label="Page">
      <span class="page-sep">/</span>
      <span id="page-total">—</span>
      <button class="bw-btn bw-btn--icon" id="btn-next" disabled title="Next page (→)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <span class="bw-status" id="page-readout"></span>
    <div class="bw-sep"></div>
    <div class="seg">
      <button class="bw-btn" id="btn-fit-page">Fit page</button>
      <button class="bw-btn" id="btn-fit-width">Fit width</button>
    </div>
    <div class="bw-spacer"></div>
    <span id="zoom-group" class="page-nav">
      <button class="bw-btn bw-btn--icon" id="btn-zoom-out" title="Zoom out (−)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.4"/><path d="M4.6 7h4.8M10.3 10.3l3 3"/></svg>
      </button>
      <span id="zoom-val">100%</span>
      <button class="bw-btn bw-btn--icon" id="btn-zoom-in" title="Zoom in (+)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.4"/><path d="M4.6 7h4.8M7 4.6v4.8M10.3 10.3l3 3"/></svg>
      </button>
    </span>
    <div class="bw-sep"></div>
    <button class="bw-btn" id="btn-download" disabled title="Download this PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span id="btn-download-label">Download</span>
    </button>
    <span class="bw-status" id="viewer-badge">view only</span>
  </div>

  <div id="canvas-area">
    <div id="state-overlay">
      <div>No PDF configured</div>
    </div>
    <div id="page-wrap">
      <canvas id="pdf-canvas"></canvas>
    </div>
  </div>

</div>

<script type="module">
// pdf.js 4.x is an ES module, so this whole script runs as a module; the
// import binding is visible inside the IIFE below.
import * as pdfjsLib from '/static/vendor/pdfjs/pdf.min.mjs';

(function () {
  'use strict';

  // ── PDF.js setup ──────────────────────────────────────────────────────────────
  pdfjsLib.GlobalWorkerOptions.workerSrc = '/static/vendor/pdfjs/pdf.worker.min.mjs';

  // cmaps are only needed for some CJK-encoded PDFs; they stay on the CDN
  // rather than vendoring several hundred files.
  const CMAP_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/cmaps/';

  // ── State ─────────────────────────────────────────────────────────────────────
  let pdfDoc      = null;
  let currentPage = 1;
  let rangeStart  = 1;
  let rangeEnd    = Infinity;
  let fitMode     = 'page';   // 'page' | 'width'
  let renderTask  = null;
  let resizeTimer = null;
  let isViewer    = false;
  let widgetId    = 'textbook';
  let socket      = null;

  // The PDF this widget is showing, kept for the download button.
  let sourceUrl   = '';
  /* The widget's Name setting (every widget has one — the settings kit adds it)
     is its title everywhere: the bar, the heading inside an exported PDF, and
     the downloaded file's name. Blank falls back to the widget's own default. */
  function wName(fallback){
    return (window.BeamerWidget && BeamerWidget.name) ? BeamerWidget.name(fallback) : fallback;
  }
  function wFile(fallback, ext){
    return (window.BeamerWidget && BeamerWidget.fileName) ? BeamerWidget.fileName(fallback, ext) : fallback + ext;
  }
  let sourceName  = 'document.pdf';

  // Pan / zoom
  let zoom = 1.0, panX = 0, panY = 0;

  function clampPan() {
    const aW = canvasArea.offsetWidth;
    const aH = canvasArea.offsetHeight;
    const pw = pageWrap.offsetWidth  * zoom;
    const ph = pageWrap.offsetHeight * zoom;
    // Keep at least 80px of the page visible on each axis
    const margin = 80;
    const maxX = (aW + pw) / 2 - margin;
    const maxY = (aH + ph) / 2 - margin;
    panX = Math.max(-maxX, Math.min(maxX, panX));
    panY = Math.max(-maxY, Math.min(maxY, panY));
  }

  function applyTransform() {
    clampPan();
    pageWrap.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  }

  function resetTransform() { zoom = 1.0; panX = 0; panY = 0; applyTransform(); }

  // ── DOM refs ──────────────────────────────────────────────────────────────────
  const canvasArea = document.getElementById('canvas-area');
  const pageWrap   = document.getElementById('page-wrap');
  const canvas     = document.getElementById('pdf-canvas');
  const ctx        = canvas.getContext('2d');
  const overlay    = document.getElementById('state-overlay');
  const pageInput  = document.getElementById('page-input');
  const pageTotalEl = document.getElementById('page-total');
  const btnPrev    = document.getElementById('btn-prev');
  const btnNext    = document.getElementById('btn-next');
  const btnFitPage = document.getElementById('btn-fit-page');
  const btnFitWid  = document.getElementById('btn-fit-width');
  const btnDownload = document.getElementById('btn-download');
  const zoomGroup  = document.getElementById('zoom-group');
  const zoomVal    = document.getElementById('zoom-val');
  const btnZoomIn  = document.getElementById('btn-zoom-in');
  const btnZoomOut = document.getElementById('btn-zoom-out');
  const docTitle   = document.getElementById('doc-title');
  const pageReadout = document.getElementById('page-readout');

  // ── Helpers ───────────────────────────────────────────────────────────────────

  function clampPage(n) {
    const end = pdfDoc ? Math.min(rangeEnd, pdfDoc.numPages) : rangeEnd;
    return Math.max(rangeStart, Math.min(isFinite(end) ? end : rangeStart, n));
  }

  function effectiveTotal() {
    if (!pdfDoc) return null;
    const end = Math.min(rangeEnd, pdfDoc.numPages);
    return Math.max(0, end - rangeStart + 1);
  }

  // ── Overlay ───────────────────────────────────────────────────────────────────

  function showOverlay(inner) {
    overlay.innerHTML = inner;
    overlay.classList.remove('hidden');
  }

  function hideOverlay() {
    overlay.classList.add('hidden');
  }

  // ── Toolbar ───────────────────────────────────────────────────────────────────

  function updateToolbar() {
    const total = effectiveTotal();
    const disp  = pdfDoc ? (currentPage - rangeStart + 1) : '';
    const endAbs = pdfDoc ? Math.min(rangeEnd, pdfDoc.numPages) : 0;

    pageInput.value = pdfDoc ? disp : '';
    pageInput.max   = total ?? 1;
    pageTotalEl.textContent = total !== null ? total : '—';

    btnPrev.disabled = isViewer || !pdfDoc || currentPage <= rangeStart;
    btnNext.disabled = isViewer || !pdfDoc || currentPage >= endAbs;

    btnFitPage.classList.toggle('is-active', fitMode === 'page');
    btnFitWid.classList.toggle('is-active',  fitMode === 'width');

    pageInput.readOnly = isViewer;
    // The audience gets the page and nothing to press.
    document.body.classList.toggle('is-viewer', isViewer);
    pageReadout.textContent = pdfDoc ? `${disp} / ${total !== null ? total : '?'}` : '';
    zoomVal.textContent = Math.round(zoom * 100) + '%';
  }

  // ── Render ────────────────────────────────────────────────────────────────────

  async function renderPage(num) {
    if (!pdfDoc) return;
    num = clampPage(num);

    if (renderTask) {
      try { renderTask.cancel(); } catch (_) {}
      renderTask = null;
    }

    showOverlay('<div class="spinner"></div>');

    let page;
    try { page = await pdfDoc.getPage(num); }
    catch (_) { showOverlay('<div style="color:var(--red)">Page error</div>'); return; }

    const areaRect = canvasArea.getBoundingClientRect();
    const aW = Math.max(areaRect.width  - 32, 100);
    const aH = Math.max(areaRect.height - 32, 100);
    const vp0 = page.getViewport({ scale: 1 });

    const scale = fitMode === 'width'
      ? aW / vp0.width
      : Math.min(aW / vp0.width, aH / vp0.height);

    const dpr = window.devicePixelRatio || 1;
    const vp  = page.getViewport({ scale });
    const w   = Math.round(vp.width);
    const h   = Math.round(vp.height);

    canvas.width  = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
    pageWrap.style.width  = w + 'px';
    pageWrap.style.height = h + 'px';
    pageWrap.style.display = 'block';

    const transform = dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null;

    try {
      renderTask = page.render({ canvasContext: ctx, viewport: vp, transform });
      await renderTask.promise;
    } catch (e) {
      if (e?.name === 'RenderingCancelledException') return;
      showOverlay('<div style="color:var(--red)">Render failed</div>');
      return;
    }

    renderTask  = null;
    currentPage = num;
    updateToolbar();
    hideOverlay();
  }

  // ── Navigation ────────────────────────────────────────────────────────────────

  async function goToPage(n) {
    if (!pdfDoc || isViewer) return;
    const target = clampPage(n);
    if (target === currentPage) return;
    resetTransform();
    await renderPage(target);
    emitState();
  }

  // ── Fit mode ─────────────────────────────────────────────────────────────────

  function setFitMode(mode) {
    fitMode = mode;
    if (pdfDoc) { resetTransform(); renderPage(currentPage); }
    updateToolbar();
  }

  // ── Load PDF ──────────────────────────────────────────────────────────────────

  async function loadPDF(url) {
    showOverlay('<div class="spinner"></div><div style="margin-top:6px">Loading PDF…</div>');
    pageWrap.style.display = 'none';
    pdfDoc = null;
    resetTransform();
    updateToolbar();

    try {
      const task = pdfjsLib.getDocument({
        url,
        cMapUrl:    CMAP_URL,
        cMapPacked: true,
        withCredentials: false,
      });
      pdfDoc = await task.promise;

      // Clamp range to actual page count
      rangeEnd   = Math.min(isFinite(rangeEnd) ? rangeEnd : pdfDoc.numPages, pdfDoc.numPages);
      rangeStart = Math.max(1, Math.min(rangeStart, rangeEnd));
      currentPage = clampPage(currentPage);

      updateToolbar();
      await renderPage(currentPage);
    } catch (e) {
      console.error('PDF load error:', e);
      showOverlay(
        `<div style="color:var(--red);font-weight:500">Could not load PDF</div>` +
        `<div style="font-size:11px;color:var(--text-3);margin-top:5px;max-width:280px;text-align:center">${e?.message ?? ''}</div>`
      );
    }
  }

  // ── Resize observer ───────────────────────────────────────────────────────────

  const ro = new ResizeObserver(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (pdfDoc) renderPage(currentPage); }, 130);
  });
  ro.observe(canvasArea);

  // ── Socket ────────────────────────────────────────────────────────────────────

  function initSocket(url) {
    if (socket) { socket.disconnect(); socket = null; }
    try {
      socket = io(url, { transports: ['websocket', 'polling'] });
      socket.on('widget_state', data => {
        if (!isViewer) return;
        if (data?.widgetId !== widgetId) return;
        const p = data?.state?.page;
        if (typeof p === 'number' && pdfDoc) {
          const target = clampPage(p);
          if (target !== currentPage) renderPage(target);
        }
      });
    } catch (_) { socket = null; }
  }

  function emitState() {
    if (!socket || isViewer) return;
    socket.emit('widget_state', { widgetId, state: { page: currentPage } });
  }

  // ── Config ────────────────────────────────────────────────────────────────────

  function applyConfig(cfg) {
    cfg = cfg || {};
    widgetId = cfg.id || cfg.widgetId || widgetId;
    isViewer = cfg.role === 'viewer';

    if (cfg.title) docTitle.textContent = cfg.title;

    // Page range: [startPage, endPage] (1-based, inclusive)
    if (Array.isArray(cfg.range) && cfg.range.length === 2) {
      rangeStart = Math.max(1, cfg.range[0]);
      rangeEnd   = Math.max(rangeStart, cfg.range[1]);
    } else {
      rangeStart = 1;
      rangeEnd   = Infinity;
    }

    // Starting page (1-based, absolute)
    currentPage = (typeof cfg.page === 'number' && cfg.page >= 1) ? cfg.page : rangeStart;

    updateToolbar();

    if (cfg.socketUrl) initSocket(cfg.socketUrl);

    // Resolve PDF URL — serve relative paths through /api/zip-asset/ so Flask
    // can extract them from _temp_assets (pre-save) or the loaded ZIP (saved).
    // That route is session-scoped (/s/<code>/api/zip-asset/...), so the base
    // must be serverUrl, NOT socketUrl — socketUrl is the bare origin for
    // socket.io and produces a 404 here.
    let url = cfg.pdf || '';
    // blob: means the renderer handed us a file the presenter added this
    // session, straight from the browser — already absolute, nothing to prefix.
    if (url && !/^(?:https?|blob):/i.test(url)) {
      const base = (window.BeamerWidget ? BeamerWidget.serverUrl() : '')
                || (cfg.serverUrl || cfg.publicBaseUrl || cfg.socketUrl || '').replace(/\/$/, '');
      if (base) url = base + '/api/zip-asset/' + url.replace(/^\//, '');
    }

    // Keep the resolved URL and a sensible filename for the download button —
    // the viewer is reading a real file, and being able to take it away is
    // most of the point of putting a textbook on a slide.
    sourceUrl  = url;
    sourceName = String(cfg.pdf || 'document.pdf').split(/[\\/]/).pop() || 'document.pdf';
    if (!/\.pdf$/i.test(sourceName)) sourceName += '.pdf';
    if (btnDownload) btnDownload.disabled = !url;

    if (url) loadPDF(url);
  }

  // ── Download ──────────────────────────────────────────────────────────────────
  // Fetched rather than linked: the file is served from the session's
  // zip-asset route, and a plain <a href> to it would open the browser's PDF
  // viewer in place of saving. Blob in hand, `download` does what it says.
  async function downloadSource() {
    if (!sourceUrl) return;
    const label = document.getElementById('btn-download-label');
    const was = label.textContent;
    try {
      btnDownload.disabled = true;
      label.textContent = 'Saving…';
      const resp = await fetch(sourceUrl);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const blob = await resp.blob();
      const href = URL.createObjectURL(blob);
      const a = Object.assign(document.createElement('a'), { href, download: wFile(sourceName.replace(/\.pdf$/i, ''), '.pdf') });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(href), 1000);
    } catch (e) {
      console.warn('PDF download failed:', e);
      label.textContent = 'Failed';
      setTimeout(() => { label.textContent = was; }, 1600);
      return;
    } finally {
      btnDownload.disabled = false;
    }
    label.textContent = was;
  }

  // ── Event handlers ────────────────────────────────────────────────────────────

  btnPrev.addEventListener('click', () => goToPage(currentPage - 1));
  btnNext.addEventListener('click', () => goToPage(currentPage + 1));

  pageInput.addEventListener('keydown', e => {
    e.stopPropagation(); // don't let arrow keys bubble to slide nav
    if (e.key === 'Enter') {
      const n = parseInt(pageInput.value, 10);
      if (!isNaN(n) && n >= 1) goToPage(rangeStart + n - 1);
    } else if (e.key === 'Escape') {
      pageInput.blur();
    }
  });

  // Restore display value if user abandons edit
  pageInput.addEventListener('blur', () => updateToolbar());

  btnFitPage.addEventListener('click', () => setFitMode('page'));
  btnFitWid.addEventListener('click',  () => setFitMode('width'));
  btnDownload.addEventListener('click', downloadSource);

  // Zoom about the centre of the stage, so the slide does not wander.
  function nudgeZoom(factor) {
    if (!pdfDoc) return;
    const newZ  = Math.max(0.25, Math.min(8, zoom * factor));
    const ratio = newZ / zoom;
    panX *= ratio; panY *= ratio;
    zoom = newZ;
    applyTransform();
    updateToolbar();
  }
  btnZoomIn.addEventListener('click',  () => nudgeZoom(1.25));
  btnZoomOut.addEventListener('click', () => nudgeZoom(1 / 1.25));

  // ── Wheel: pan or zoom (Ctrl/Meta + wheel) ────────────────────────────────
  canvasArea.addEventListener('wheel', e => {
    if (!pdfDoc) return;
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const rect  = canvasArea.getBoundingClientRect();
      const cx    = e.clientX - rect.left  - rect.width  / 2;
      const cy    = e.clientY - rect.top   - rect.height / 2;
      const delta = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      const newZ  = Math.max(0.25, Math.min(8, zoom * delta));
      const ratio = newZ / zoom;
      panX = cx * (1 - ratio) + panX * ratio;
      panY = cy * (1 - ratio) + panY * ratio;
      zoom = newZ;
      updateToolbar();
    } else {
      // Plain wheel = scroll; Shift+wheel = horizontal scroll
      panX -= e.shiftKey ? e.deltaY : e.deltaX;
      panY -= e.shiftKey ? 0        : e.deltaY;
    }
    applyTransform();
  }, { passive: false });

  // ── Pointer drag to pan ───────────────────────────────────────────────────
  let _isPanning = false, _panLX = 0, _panLY = 0;

  pageWrap.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    _isPanning = true; _panLX = e.clientX; _panLY = e.clientY;
    pageWrap.setPointerCapture(e.pointerId);
    pageWrap.classList.add('panning');
    e.preventDefault();
  });

  pageWrap.addEventListener('pointermove', e => {
    if (!_isPanning) return;
    panX += e.clientX - _panLX; panY += e.clientY - _panLY;
    _panLX = e.clientX; _panLY = e.clientY;
    applyTransform();
  });

  const _endPan = () => { _isPanning = false; pageWrap.classList.remove('panning'); };
  pageWrap.addEventListener('pointerup',     _endPan);
  pageWrap.addEventListener('pointercancel', _endPan);

  // Keyboard page navigation when not in the page input
  document.addEventListener('keydown', e => {
    if (isViewer || !pdfDoc) return;
    if (document.activeElement === pageInput) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault(); e.stopPropagation();
      goToPage(currentPage + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault(); e.stopPropagation();
      goToPage(currentPage - 1);
    } else if (e.key === '+' || e.key === '=') {
      e.preventDefault(); nudgeZoom(1.25);
    } else if (e.key === '-' || e.key === '_') {
      e.preventDefault(); nudgeZoom(1 / 1.25);
    } else if (e.key === '0') {
      e.preventDefault(); setFitMode(fitMode);
    }
  });

  // ── Message listener ──────────────────────────────────────────────────────────

  window.addEventListener('message', e => {
    if (e.data?.type === 'widget-config')  applyConfig(e.data.config);
    if (e.data?.type === 'widget-cleanup') {
      if (socket) { socket.disconnect(); socket = null; }
      ro.disconnect();
    }
  });

  updateToolbar();
})();
</script>
</body>
</html>
