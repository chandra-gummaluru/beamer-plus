<!DOCTYPE html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "Timer",
  "category": "Tools",
  "fields": [
    { "key": "mode",      "label": "Mode",               "type": "select", "options": [{"v":"countdown","l":"Countdown"},{"v":"stopwatch","l":"Stopwatch"}], "default": "countdown" },
    { "key": "duration",  "label": "Duration (seconds)", "type": "number", "min": 1, "step": 1, "placeholder": "60", "note": "countdown only" },
    { "key": "autoStart", "label": "Auto-start",         "type": "checkbox", "default": false }
  ]
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer — Beamer+</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap');

:root {
  --bg:         #ffffff;
  --bg-subtle:  #f9f9f8;
  --border:     #e9e9e6;
  --border-med: #d4d4cf;
  --text:       #1a1a18;
  --text-2:     #6b6b65;
  --text-3:     #aeaea5;
  --accent:     #52524e;
  --accent-bg:  #f0f0ee;
  --red:        #dc2626;
  --red-bg:     #fef2f2;
  --radius:     6px;
  --font-mono:  'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
  --font-ui:    'DM Sans', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; touch-action: manipulation; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13px;
  display: flex;
  flex-direction: column;
  transition: background 0.2s;
}
body.flash { background: var(--red-bg); }

/* ── Toolbar ─────────────────────────────────────────── */
#toolbar {
  flex-shrink: 0;
  height: 42px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 5px;
}

.toolbar-title { font-size: 13px; font-weight: 500; flex-shrink: 0; }
.sep { width: 1px; height: 18px; background: var(--border); margin: 0 3px; flex-shrink: 0; }
.spacer { flex: 1; }

/* Mode toggle buttons */
.tb-btn {
  display: inline-flex; align-items: center; gap: 4px;
  height: 28px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text);
  font-family: var(--font-ui); font-size: 12px; font-weight: 500;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: background 0.1s, border-color 0.1s;
}
.tb-btn:hover:not(:disabled) { background: var(--bg-subtle); border-color: var(--border-med); }
.tb-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.tb-btn.active { background: var(--accent-bg); color: var(--accent); border-color: #c8c8c4; }

/* Action buttons — right side of toolbar */
#btn-reset {
  height: 28px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text-2);
  font-family: var(--font-ui); font-size: 12px; font-weight: 500;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: background 0.1s, border-color 0.1s, color 0.1s;
}
#btn-reset:hover:not(:disabled) { background: var(--bg-subtle); border-color: var(--border-med); color: var(--text); }
#btn-reset:disabled { opacity: 0.35; cursor: not-allowed; }

#btn-start-pause {
  height: 28px; padding: 0 14px;
  border: 1px solid var(--text); border-radius: var(--radius);
  background: var(--text); color: #fff;
  font-family: var(--font-ui); font-size: 12px; font-weight: 500;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: background 0.1s;
}
#btn-start-pause:hover:not(:disabled) { background: #2d2d2a; }
#btn-start-pause:disabled { opacity: 0.35; cursor: not-allowed; }

/* ── Main area ───────────────────────────────────────── */
#app {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px 10%;   /* bias slightly above true centre */
  overflow: hidden;
  gap: 20px;
}

/* ── Time display ────────────────────────────────────── */
#time-display {
  font-family: var(--font-mono);
  font-size: clamp(2.8rem, 10vw, 5.5rem);
  font-weight: 400;
  letter-spacing: -0.01em;
  color: var(--text);
  line-height: 1;
  text-align: center;
  transition: color 0.2s;
  user-select: none;
}
#time-display.expired { color: var(--red); }

/* ── Duration stepper ────────────────────────────────── */
#duration-controls {
  display: none;
  align-items: center;
  gap: 6px;
}
#duration-controls.visible { display: flex; }

.dur-btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 28px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text-2);
  font-family: var(--font-mono); font-size: 11px;
  cursor: pointer; white-space: nowrap;
  transition: background 0.1s, border-color 0.1s;
}
.dur-btn:hover:not(:disabled) { background: var(--bg-subtle); border-color: var(--border-med); }
.dur-btn:active:not(:disabled) { background: var(--accent-bg); }
.dur-btn:disabled { opacity: 0.4; cursor: default; }

#duration-display {
  font-family: var(--font-mono); font-size: 12px; color: var(--text-2);
  min-width: 52px; text-align: center;
  padding: 4px 10px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-subtle);
  cursor: default; user-select: none;
}

/* Hidden compat shims */
#controls { display: none; }
#mode-label { display: none; }
#shell { display: contents; }
</style>
</head>
<body>

<div id="toolbar" data-bw-topbar>
  <span class="toolbar-title">Timer</span>
  <div class="sep"></div>
  <button class="tb-btn active" id="tb-stopwatch">Stopwatch</button>
  <button class="tb-btn"        id="tb-countdown">Countdown</button>
  <div class="spacer"></div>
  <button id="btn-reset">Reset</button>
  <button id="btn-start-pause">Start</button>
</div>

<div id="app">
  <div id="time-display">00:00.0</div>

  <div id="duration-controls">
    <button class="dur-btn" id="btn-minus-1m">−1m</button>
    <button class="dur-btn" id="btn-minus-10s">−10s</button>
    <div id="duration-display">5:00</div>
    <button class="dur-btn" id="btn-plus-10s">+10s</button>
    <button class="dur-btn" id="btn-plus-1m">+1m</button>
  </div>

  <!-- Kept for JS compat -->
  <div id="controls">
    <button id="btn-start-pause-compat">Start</button>
    <button id="btn-reset-compat">Reset</button>
  </div>
</div>

<script src="/static/vendor/socket.io.min.js"></script>
<script>
(function () {
  'use strict';

  const state = {
    mode:     'stopwatch',
    running:  false,
    elapsed:  0,
    duration: 300000,
    expired:  false,
  };

  let rafId      = null;
  let lastTick   = null;
  let socket     = null;
  let isViewer   = false;
  let widgetId   = 'timer-default';
  let syncTimer  = null;
  let flashTimer = null;

  const timeEl      = document.getElementById('time-display');
  const durControls = document.getElementById('duration-controls');
  const durDisplay  = document.getElementById('duration-display');
  const btnSP       = document.getElementById('btn-start-pause');
  const btnReset    = document.getElementById('btn-reset');
  const tbStopwatch = document.getElementById('tb-stopwatch');
  const tbCountdown = document.getElementById('tb-countdown');

  // ── Format helpers ────────────────────────────────────────────────────────────
  function fmtStopwatch(ms) {
    const m  = Math.floor(ms / 60000);
    const s  = Math.floor((ms % 60000) / 1000);
    const t  = Math.floor((ms % 1000) / 100);
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${t}`;
  }

  function fmtCountdown(ms) {
    const rem = Math.max(0, ms);
    const h   = Math.floor(rem / 3600000);
    const m   = Math.floor((rem % 3600000) / 60000);
    const s   = Math.floor((rem % 60000) / 1000);
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function fmtDuration(ms) {
    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (s > 0) return `${m}:${String(s).padStart(2,'0')}`;
    return `${m}:00`;
  }

  // ── Render ────────────────────────────────────────────────────────────────────
  function render() {
    if (state.mode === 'stopwatch') {
      timeEl.textContent = fmtStopwatch(state.elapsed);
      timeEl.classList.remove('expired');
    } else {
      const remaining = state.duration - state.elapsed;
      timeEl.textContent = fmtCountdown(remaining);
      timeEl.classList.toggle('expired', state.expired);
    }

    tbStopwatch.classList.toggle('active', state.mode === 'stopwatch');
    tbCountdown.classList.toggle('active', state.mode === 'countdown');

    btnSP.textContent = state.running ? 'Pause' : 'Start';

    const showStepper = state.mode === 'countdown' && !state.running && !state.expired;
    durControls.classList.toggle('visible', showStepper);
    if (showStepper) durDisplay.textContent = fmtDuration(state.duration);

    const canControl = !isViewer;
    btnSP.disabled    = !canControl;
    btnReset.disabled = !canControl;
    tbStopwatch.disabled = !canControl;
    tbCountdown.disabled = !canControl;
    document.querySelectorAll('.dur-btn').forEach(b => { b.disabled = !canControl; });
  }

  // ── Timer control ─────────────────────────────────────────────────────────────
  function tick(now) {
    if (!state.running) return;
    const delta = now - lastTick;
    lastTick = now;
    state.elapsed += delta;
    if (state.mode === 'countdown' && state.elapsed >= state.duration) {
      state.elapsed = state.duration;
      stopTimer();
      state.expired = true;
      doFlash(); render(); emitState();
      return;
    }
    render();
    rafId = requestAnimationFrame(tick);
  }

  function startTimer() {
    if (state.running || state.expired) return;
    state.running = true;
    lastTick = performance.now();
    rafId = requestAnimationFrame(tick);
    startSyncInterval();
    render(); emitState();
  }

  function stopTimer() {
    state.running = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    stopSyncInterval();
  }

  function pauseTimer() {
    if (!state.running) return;
    stopTimer(); render(); emitState();
  }

  function resetTimer() {
    stopTimer();
    state.elapsed = 0; state.expired = false;
    document.body.classList.remove('flash');
    if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; }
    render(); emitState();
  }

  function doFlash() {
    let count = 0;
    function step() {
      if (count >= 6) { document.body.classList.remove('flash'); return; }
      document.body.classList.toggle('flash');
      count++;
      flashTimer = setTimeout(step, 350);
    }
    step();
  }

  // ── Event listeners ───────────────────────────────────────────────────────────
  tbStopwatch.addEventListener('click', () => {
    if (isViewer || state.mode === 'stopwatch') return;
    state.mode = 'stopwatch'; resetTimer();
  });
  tbCountdown.addEventListener('click', () => {
    if (isViewer || state.mode === 'countdown') return;
    state.mode = 'countdown'; resetTimer();
  });

  btnSP.addEventListener('click', () => {
    if (isViewer) return;
    state.running ? pauseTimer() : startTimer();
  });
  btnReset.addEventListener('click', () => { if (!isViewer) resetTimer(); });

  document.getElementById('btn-plus-1m').addEventListener('click', () => {
    if (isViewer || state.running) return;
    state.duration = Math.min(state.duration + 60000, 6 * 3600000); render();
  });
  document.getElementById('btn-minus-1m').addEventListener('click', () => {
    if (isViewer || state.running) return;
    state.duration = Math.max(state.duration - 60000, 10000); render();
  });
  document.getElementById('btn-plus-10s').addEventListener('click', () => {
    if (isViewer || state.running) return;
    state.duration = Math.min(state.duration + 10000, 6 * 3600000); render();
  });
  document.getElementById('btn-minus-10s').addEventListener('click', () => {
    if (isViewer || state.running) return;
    state.duration = Math.max(state.duration - 10000, 10000); render();
  });

  // ── Sync ──────────────────────────────────────────────────────────────────────
  function emitState() {
    if (socket && !isViewer) {
      socket.emit('widget_state', { widgetId,
        state: { mode: state.mode, running: state.running, elapsed: state.elapsed, duration: state.duration } });
    }
  }

  function startSyncInterval() { if (!syncTimer) syncTimer = setInterval(emitState, 1000); }
  function stopSyncInterval()  { if (syncTimer) { clearInterval(syncTimer); syncTimer = null; } }

  function applyRemoteState(data) {
    if (!isViewer) return;
    const wasRunning = state.running;
    const wasExpired = state.expired;
    state.mode = data.mode || 'stopwatch';
    state.duration = data.duration || 300000;
    state.elapsed  = data.elapsed  || 0;
    state.expired  = false;
    if (data.running && !wasRunning) {
      stopTimer(); state.running = true;
      lastTick = performance.now();
      rafId = requestAnimationFrame(tick);
    } else if (!data.running && wasRunning) {
      stopTimer();
    }
    if (state.mode === 'countdown' && state.elapsed >= state.duration) {
      state.expired = true;
      if (!wasExpired) doFlash();
    }
    render();
  }

  function connectSocket(url) {
    if (socket) { socket.disconnect(); socket = null; }
    socket = io(url, { transports: ['websocket', 'polling'] });
    socket.on('widget_state', data => {
      if (!isViewer || data?.widgetId !== widgetId) return;
      applyRemoteState(data?.state || {});
    });
  }

  // ── Config ────────────────────────────────────────────────────────────────────
  function updateConfig(cfg) {
    cfg = cfg || {};
    widgetId = cfg.id || cfg.widgetId || widgetId;
    isViewer = cfg.role === 'viewer';
    if (cfg.mode === 'countdown' || cfg.mode === 'stopwatch') state.mode = cfg.mode;
    if (typeof cfg.duration === 'number' && cfg.duration > 0) state.duration = cfg.duration * 1000;
    resetTimer();
    if (cfg.autoStart && !isViewer) startTimer();
    if (cfg.socketUrl) connectSocket(cfg.socketUrl);
  }

  window.addEventListener('message', e => {
    if (e.data?.type === 'widget-config')  updateConfig(e.data.config);
    if (e.data?.type === 'widget-cleanup') { stopTimer(); socket?.disconnect(); if (flashTimer) clearTimeout(flashTimer); }
    // Beamer+ state persistence protocol
    if (e.data?.type === 'widget-get-state') {
      window.parent.postMessage({ type: 'widget-state', widgetId,
        state: { mode: state.mode, running: state.running, elapsed: state.elapsed, duration: state.duration } }, '*');
    }
    if (e.data?.type === 'widget-set-state' && e.data.state) {
      const s = e.data.state;
      state.mode     = s.mode     ?? state.mode;
      state.elapsed  = s.elapsed  ?? state.elapsed;
      state.duration = s.duration ?? state.duration;
      state.running  = false; // always start paused after restore
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
