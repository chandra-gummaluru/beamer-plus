<!DOCTYPE html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "Timer",
  "category": "Tools",
  "fields": [
    { "key": "mode",      "label": "Mode",               "type": "select", "options": [{"v":"countdown","l":"Countdown"},{"v":"stopwatch","l":"Stopwatch"}], "default": "countdown" },
    { "key": "duration",  "label": "Duration (seconds)", "type": "number", "min": 1, "step": 1, "placeholder": "60" },
    { "key": "autoStart", "label": "Auto-start",         "type": "checkbox", "default": false }
  ]
}
</script>
<!-- Standalone fallback. Inside Beamer+ the host injects the shared widget
     base (tokens, fonts, toolbar, buttons) ahead of everything else. Opened
     directly (a file in Edge, a plain web server) nothing does, so load the
     same stylesheet from the repo, relative to this file, at the same point in
     the cascade. Beamer+ is unaffected: its link is already present. -->
<script id="bw-standalone">
(function () {
  if (document.querySelector('link[href*="widget-base.css"]')) return;
  var head = document.head || document.getElementsByTagName('head')[0];
  [['preconnect', 'https://fonts.googleapis.com'],
   ['stylesheet', 'https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap'],
   ['stylesheet', '../static/css/widget-base.css']].forEach(function (l) {
    var el = document.createElement('link');
    el.rel = l[0]; el.href = l[1];
    head.appendChild(el);
  });
  document.documentElement.setAttribute('data-bw-standalone', '');
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer — Beamer+</title>

<!-- Vendored by the Beamer+ server. Never call io() bare. -->
<script src="/static/vendor/socket.io.min.js"></script>

<style>
/* Tokens, reset, toolbar and buttons come from the shared widget base
   (static/css/widget-base.css). What's left here is the clock: digits as
   large as the region allows, a hairline of progress under a countdown, and
   the few states the room needs to notice. */

html, body { height: 100%; overflow: hidden; touch-action: manipulation; }

/* ── Toolbar ────────────────────────────────────────────── */
/* Stopwatch / Countdown as one segmented control. */
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; flex: 0 0 auto; }
.seg .bw-btn { border: 0; border-radius: 0; height: calc(var(--ctl-h) - 2px); }
.seg .bw-btn + .bw-btn { border-left: 1px solid var(--border); }
.presets { display: contents; }
.presets[hidden] { display: none; }
.presets .bw-btn { font-family: var(--font-mono); padding: 0 9px; }
#btn-start { min-width: 64px; }

/* A small slide region keeps the controls that matter. */
#btn-start { min-width: 78px; justify-content: center; }
#btn-reset { min-width: 62px; justify-content: center; }

@media (max-width: 600px) { .presets { display: none !important; } }
@media (max-width: 460px) {
  .bw-toolbar-title, .bw-toolbar-title + .bw-sep { display: none !important; }
  .seg .bw-btn { padding: 0 8px; }
  /* The shared bar's own reset button does the same job. */
  #btn-reset { display: none !important; }
}

/* ── The clock ──────────────────────────────────────────── */
#app {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4% 6% 8%;          /* bias slightly above true centre */
  container-type: size;
  overflow: hidden;
}

#clock {
  display: flex;
  align-items: baseline;
  justify-content: center;
  /* The UI face with fixed-width figures: plain, open zeros that read from
     the back of the room, and digits that don't shuffle as they change. */
  font-family: var(--font-ui);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--text);
  white-space: nowrap;
  user-select: none;
  /* As big as the region allows, by width or by height, whichever runs out. */
  font-size: min(22cqw, 62cqh);
  transition: color 0.3s, font-size 0.18s ease;
}
#clock.is-long  { font-size: min(15.5cqw, 58cqh); }   /* h:mm:ss */

/* Reserved boxes: the fields never resize as their digits change, so the
   clock is dead still through a whole countdown. */
#clock .unit, #clock .colon, #clock .tenth {
  display: inline-block;
  text-align: center;
  flex: 0 0 auto;
}
#clock .unit  { width: 2ch; }
#clock .unit[data-u="h"] { width: 1ch; }   /* capped at 6 hours: one digit */
#clock .unit.wide { width: 3ch; }
#clock .colon { width: 0.62ch; color: var(--text-3); }
#clock .tenth { width: 1.3ch; font-size: 0.42em; color: var(--text-3); margin-left: 0.04em; }
#clock.is-idle { color: var(--text-2); }

/* Countdown digits can be set in place before starting: scroll, arrow keys,
   or type. They look like digits until pointed at. */
.unit { border-radius: 0.06em; outline: none; transition: background 0.15s; }
#clock.is-editable .unit { cursor: ns-resize; }
#clock.is-editable .unit:hover { background: var(--bg-subtle); }
#clock.is-editable .unit:focus { background: var(--accent-bg); box-shadow: inset 0 -0.04em 0 var(--text); }

/* The last stretch of a countdown, and the end of it. */
#clock.is-warn    { color: var(--warn); }
#clock.is-expired { color: var(--err); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
#clock.is-expired.is-pulsing { animation: pulse 0.9s ease-in-out 4; }

/* Progress: one hairline under the digits, emptying as time runs out. */
#bar {
  width: min(70cqw, 900px);
  height: max(3px, 0.8cqh);
  margin-top: 4cqh;
  border-radius: 99px;
  background: var(--border);
  overflow: hidden;
  opacity: 1;
  transition: opacity 0.3s;
}
#bar[hidden] { display: block; opacity: 0; }
#bar-fill {
  height: 100%;
  width: 100%;
  border-radius: inherit;
  background: var(--text);
  transform-origin: left center;
  transition: background 0.3s;
}
#clock.is-warn ~ #bar #bar-fill    { background: var(--warn); }
#clock.is-expired ~ #bar #bar-fill { background: var(--err); }

@media (prefers-reduced-motion: reduce) {
  #clock.is-expired.is-pulsing { animation: none; }
}
</style>
</head>
<body>
<div id="shell" class="bw-shell">

  <div id="toolbar" class="bw-toolbar" data-bw-topbar>
    <span class="bw-toolbar-title">Timer</span>
    <div class="bw-sep"></div>
    <div class="seg" id="mode-seg">
      <button class="bw-btn" id="tb-countdown">Countdown</button>
      <button class="bw-btn" id="tb-stopwatch">Stopwatch</button>
    </div>
    <span class="presets" id="presets">
      <div class="bw-sep"></div>
      <button class="bw-btn" data-min="1">1m</button>
      <button class="bw-btn" data-min="2">2m</button>
      <button class="bw-btn" data-min="5">5m</button>
      <button class="bw-btn" data-min="10">10m</button>
    </span>
    <div class="bw-spacer"></div>
    <button class="bw-btn" id="btn-reset" title="Reset (R)">Reset</button>
    <button class="bw-btn bw-btn--primary" id="btn-start" title="Start / pause (Space)">Start</button>
  </div>

  <div id="app">
    <div id="clock" aria-live="off"></div>
    <div id="bar" hidden><div id="bar-fill"></div></div>
  </div>

</div>
<script>
(function () {
  'use strict';

  // ── Config ──────────────────────────────────────────────────────────────────
  const _qs   = new URLSearchParams(location.search);
  const CFG0  = window.WIDGET_CONFIG || {};
  let   cfg   = { ...CFG0 };
  let   WIDGET_ID = CFG0.id || CFG0.widgetId || 'timer';
  let   IS_VIEWER = CFG0.role === 'viewer' || _qs.get('viewer') === '1';

  const MAX_MS = 6 * 3600000;
  const MIN_MS = 5000;

  // ── DOM ─────────────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const clock     = $('clock');
  const bar       = $('bar');
  const barFill   = $('bar-fill');
  const btnStart  = $('btn-start');
  const btnReset  = $('btn-reset');
  const tbCount   = $('tb-countdown');
  const tbWatch   = $('tb-stopwatch');
  const presets   = $('presets');
  const modeSeg   = $('mode-seg');

  // ── State ───────────────────────────────────────────────────────────────────
  const S = {
    mode:     'countdown',   // countdown | stopwatch
    running:  false,
    elapsed:  0,             // ms
    duration: 300000,        // ms, countdown only
    expired:  false,
  };
  let rafId = null, lastTick = 0;

  // ── Formatting ──────────────────────────────────────────────────────────────
  const pad = n => String(n).padStart(2, '0');

  // A countdown shows whole seconds rounded up, so it reads 5:00 when it
  // starts and 0:00 only when it has actually finished.
  function parts() {
    if (S.mode === 'countdown') {
      const rem = Math.max(0, S.duration - S.elapsed);
      const t = Math.ceil(rem / 1000);
      return { h: Math.floor(t / 3600), m: Math.floor(t / 60) % 60, s: t % 60, tenth: null, rem };
    }
    const t = Math.floor(S.elapsed / 1000);
    return { h: Math.floor(t / 3600), m: Math.floor(t / 60) % 60, s: t % 60,
             tenth: Math.floor(S.elapsed / 100) % 10, rem: 0 };
  }

  const isIdle = () => !S.running && S.elapsed === 0 && !S.expired;
  const editable = () => !IS_VIEWER && S.mode === 'countdown' && isIdle();

  // ── Render ──────────────────────────────────────────────────────────────────
  // The digits are rebuilt only when their shape changes, so a unit being
  // edited keeps its focus while its value updates.
  let shapeKey = '';
  function renderClock() {
    const p = parts();
    const long = S.mode === 'countdown' && S.duration >= 3600000;
    const bigMin = !long && (p.m + p.h * 60) >= 100;
    const key = [S.mode, long, bigMin, editable()].join('|');
    if (key !== shapeKey) {
      shapeKey = key;
      const unit = (u) => `<span class="unit${u === 'm' && bigMin ? ' wide' : ''}" data-u="${u}"`
        + `${editable() ? ' tabindex="0"' : ''}></span>`;
      const colon = '<span class="colon">:</span>';
      clock.innerHTML = (long ? unit('h') + colon : '') + unit('m') + colon + unit('s') +
        (S.mode === 'stopwatch' ? '<span class="tenth"></span>' : '');
      clock.classList.toggle('is-long', long);
      clock.classList.toggle('is-editable', editable());
    }
    const set = (u, v) => { const el = clock.querySelector(`[data-u="${u}"]`); if (el && el.textContent !== v) el.textContent = v; };
    set('h', String(p.h));
    set('m', long ? pad(p.m) : pad(p.m + p.h * 60));
    set('s', pad(p.s));
    const tenth = clock.querySelector('.tenth');
    if (tenth) tenth.textContent = '.' + p.tenth;

    const warnAt = Math.max(10000, S.duration * 0.1);
    clock.classList.toggle('is-warn', S.mode === 'countdown' && !S.expired && !isIdle() && p.rem <= warnAt);
    clock.classList.toggle('is-expired', S.expired);

    bar.hidden = S.mode !== 'countdown';
    barFill.style.transform = `scaleX(${S.mode === 'countdown' ? (p.rem / S.duration).toFixed(4) : 1})`;
  }

  function render() {
    renderClock();
    tbCount.classList.toggle('is-active', S.mode === 'countdown');
    tbWatch.classList.toggle('is-active', S.mode === 'stopwatch');
    presets.hidden = !(S.mode === 'countdown' && isIdle());
    btnStart.textContent = S.running ? 'Pause' : (S.elapsed > 0 && !S.expired ? 'Resume' : 'Start');
    btnStart.disabled = S.expired;
    btnReset.disabled = isIdle();
    // The audience sees the clock and nothing else.
    [modeSeg, presets, btnStart, btnReset].forEach(el => { el.style.display = IS_VIEWER ? 'none' : ''; });
    presets.querySelectorAll('[data-min]').forEach(b =>
      b.classList.toggle('is-active', S.duration === Number(b.dataset.min) * 60000));
  }

  // ── Running ─────────────────────────────────────────────────────────────────
  function tick(now) {
    if (!S.running) return;
    S.elapsed += now - lastTick;
    lastTick = now;
    if (S.mode === 'countdown' && S.elapsed >= S.duration) {
      S.elapsed = S.duration;
      stop();
      expire();
      render(); emitState(true);
      return;
    }
    renderClock();
    rafId = requestAnimationFrame(tick);
  }

  function run() {
    lastTick = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(tick);
  }

  function stop() {
    S.running = false;
    cancelAnimationFrame(rafId);
    rafId = null;
  }

  function expire() {
    S.expired = true;
    clock.classList.remove('is-pulsing');
    void clock.offsetWidth;
    clock.classList.add('is-pulsing');
  }

  function start() {
    if (IS_VIEWER || S.running || S.expired) return;
    if (document.activeElement && document.activeElement.classList.contains('unit')) document.activeElement.blur();
    S.running = true;
    run();
    render(); emitState(true);
  }

  function pause() {
    if (IS_VIEWER || !S.running) return;
    stop();
    render(); emitState(true);
  }

  function reset() {
    if (IS_VIEWER) return;
    stop();
    S.elapsed = 0;
    S.expired = false;
    clock.classList.remove('is-pulsing');
    render(); emitState(true);
  }

  function setMode(m) {
    if (IS_VIEWER || S.mode === m) return;
    S.mode = m;
    reset();
  }

  function setDuration(ms) {
    if (IS_VIEWER || !isIdle()) return;
    S.duration = Math.max(MIN_MS, Math.min(MAX_MS, Math.round(ms / 1000) * 1000));
    render(); emitState();
  }

  // ── Setting the countdown in place ──────────────────────────────────────────
  const UNIT_MS = { h: 3600000, m: 60000, s: 1000 };
  function nudge(u, dir, big) {
    setDuration(S.duration + dir * UNIT_MS[u] * (big ? 10 : 1));
  }

  // Typing into a unit: the last two digits typed are its value.
  let typed = { u: null, buf: '' };
  function typeDigit(u, d) {
    if (typed.u !== u) typed = { u, buf: '' };
    typed.buf = (typed.buf + d).slice(-2);
    const v = Number(typed.buf);
    const t = Math.ceil(S.duration / 1000);
    let h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
    const long = clock.classList.contains('is-long');
    if (u === 'h') h = Math.min(6, v);
    if (u === 'm') { if (long) m = Math.min(59, v); else { h = 0; m = Math.min(99, v); } }
    if (u === 's') s = Math.min(59, v);
    setDuration((h * 3600 + m * 60 + s) * 1000);
  }

  clock.addEventListener('wheel', e => {
    const unit = e.target.closest('.unit');
    if (!unit || !editable()) return;
    e.preventDefault();
    nudge(unit.dataset.u, e.deltaY < 0 ? 1 : -1, e.shiftKey);
  }, { passive: false });

  clock.addEventListener('keydown', e => {
    const unit = e.target.closest('.unit');
    if (!unit || !editable()) return;
    const u = unit.dataset.u;
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      nudge(u, e.key === 'ArrowUp' ? 1 : -1, e.shiftKey);
    } else if (/^[0-9]$/.test(e.key)) {
      e.preventDefault();
      typeDigit(u, e.key);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      start();
    } else if (e.key === 'Tab' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      typed = { u: null, buf: '' };
      if (e.key !== 'Tab') {
        e.preventDefault();
        const units = [...clock.querySelectorAll('.unit')];
        const i = units.indexOf(unit) + (e.key === 'ArrowRight' ? 1 : -1);
        if (units[i]) units[i].focus();
      }
    }
  });
  clock.addEventListener('focusout', () => { typed = { u: null, buf: '' }; });

  // ── Events ──────────────────────────────────────────────────────────────────
  btnStart.addEventListener('click', () => (S.running ? pause() : start()));
  btnReset.addEventListener('click', reset);
  tbCount .addEventListener('click', () => setMode('countdown'));
  tbWatch .addEventListener('click', () => setMode('stopwatch'));
  presets .addEventListener('click', e => {
    const b = e.target.closest('[data-min]');
    if (b) setDuration(Number(b.dataset.min) * 60000);
  });

  // Space starts and pauses, R resets — from anywhere in the widget except a
  // unit being typed into.
  document.addEventListener('keydown', e => {
    if (IS_VIEWER || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.closest && e.target.closest('.unit, input, textarea, select')) return;
    if (e.key === ' ') { e.preventDefault(); S.running ? pause() : start(); }
    else if (e.key === 'r' || e.key === 'R') reset();
  });

  // ── Sync ────────────────────────────────────────────────────────────────────
  // Presenter emits, viewers apply. While running, a heartbeat each second
  // keeps a viewer that joined late (or drifted) on the presenter's time.
  let socket = null, syncTimer = null, beat = null;

  function initSocket(url) {
    if (typeof io === 'undefined') { socket = { emit() {}, on() {} }; return; }
    try {
      const prev = socket;
      socket = io(url || (window.BeamerWidget ? BeamerWidget.serverOrigin() : ''),
                  { transports: ['websocket', 'polling'] });
      if (prev && prev.disconnect) prev.disconnect();
      socket.on('widget_state', data => {
        if (!IS_VIEWER || data?.widgetId !== WIDGET_ID) return;
        applyState(data.state || {}, true);
      });
    } catch (_) {
      socket = { emit() {}, on() {} };
    }
  }

  function getState() {
    return { mode: S.mode, running: S.running, elapsed: Math.round(S.elapsed),
             duration: S.duration, expired: S.expired };
  }

  function emitState(now) {
    if (!socket || IS_VIEWER) return;
    clearTimeout(syncTimer);
    const send = () => socket.emit('widget_state', { widgetId: WIDGET_ID, state: getState() });
    if (now) send(); else syncTimer = setTimeout(send, 150);
    clearInterval(beat);
    beat = S.running ? setInterval(send, 1000) : null;
  }

  function applyState(s, live) {
    if (!s) return;
    const wasExpired = S.expired;
    if (s.mode === 'countdown' || s.mode === 'stopwatch') S.mode = s.mode;
    if (typeof s.duration === 'number' && s.duration > 0) S.duration = s.duration;
    if (typeof s.elapsed === 'number') S.elapsed = s.elapsed;
    S.expired = !!s.expired || (S.mode === 'countdown' && S.elapsed >= S.duration && S.elapsed > 0);
    // A restored deck always comes back paused; a live viewer follows along.
    const shouldRun = live && !!s.running && !S.expired;
    if (shouldRun && !S.running) { S.running = true; run(); }
    else if (!shouldRun && S.running) stop();
    if (S.expired && !wasExpired && live) expire();
    render();
  }

  // ── Config ──────────────────────────────────────────────────────────────────
  let lastMode = null, lastDur = null;
  function applyConfig(c) {
    if (!c) return;
    const prevUrl = cfg.socketUrl;
    cfg = { ...cfg, ...c };
    WIDGET_ID = cfg.id || cfg.widgetId || WIDGET_ID;
    IS_VIEWER = cfg.role === 'viewer' || IS_VIEWER;
    // Only a changed setting is adopted, so re-sent config never interrupts
    // a running clock.
    if ((cfg.mode === 'countdown' || cfg.mode === 'stopwatch') && cfg.mode !== lastMode) {
      lastMode = cfg.mode;
      if (!S.running) { S.mode = cfg.mode; S.elapsed = 0; S.expired = false; }
    }
    const d = Number(cfg.duration);
    if (d > 0 && d !== lastDur) {
      lastDur = d;
      if (isIdle()) S.duration = Math.max(MIN_MS, Math.min(MAX_MS, d * 1000));
    }
    if (cfg.socketUrl && cfg.socketUrl !== prevUrl) initSocket(cfg.socketUrl);
    render();
  }

  function destroy() {
    stop();
    clearTimeout(syncTimer);
    clearInterval(beat);
    if (socket && socket.disconnect) socket.disconnect();
    socket = null;
  }

  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === 'widget-config')  applyConfig(d.config);
    if (d.type === 'widget-cleanup') destroy();
    if (d.type === 'widget-get-state') {
      window.parent.postMessage({ type: 'widget-state', widgetId: WIDGET_ID, state: getState() }, '*');
    }
    if (d.type === 'widget-set-state' && d.state) applyState(d.state, false);
  });

  // ── Boot ────────────────────────────────────────────────────────────────────
  initSocket(CFG0.socketUrl);
  applyConfig(CFG0);
  render();
  if (CFG0.autoStart && !IS_VIEWER) start();

  // The shared bar's reset means reset the clock, not reload the widget.
  (function wireReset(tries) {
    if (window.BeamerWidget && BeamerWidget.topbar) { BeamerWidget.topbar.onReset(reset); return; }
    if (tries > 0) setTimeout(() => wireReset(tries - 1), 120);
  })(20);
})();
</script>
</body>
</html>
