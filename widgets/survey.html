<!DOCTYPE html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "Open Survey",
  "category": "Audience Response",
  "fields": [
    { "key": "question",     "label": "Question",               "type": "textarea", "placeholder": "Enter survey question…", "rows": 3 },
    { "key": "autoStart",    "label": "Auto-start",             "type": "checkbox", "default": false },
    { "key": "minResponses", "label": "Min. responses to show", "type": "number",   "min": 1, "step": 1, "default": 1 },
    { "key": "numSummaries", "label": "AI summary count",       "type": "number",   "min": 0, "step": 1, "default": 3 },
    { "key": "model",        "label": "AI model",               "type": "ai-model" },
    { "key": "apiKey",       "label": "API key",                "type": "password", "placeholder": "Paste API key…" },
    { "key": "scale", "label": "Text size", "type": "select", "options": ["1", "1.4", "1.8", "2.2"], "default": "1.4" }
  ]
}
</script>
<meta charset="utf-8">
<title>Survey — Beamer+</title>
<script src="/static/vendor/qrcode.min.js"></script>
<script src="/static/vendor/socket.io.min.js"></script>
<style>
/* Tokens, reset, toolbar, buttons, cards and the spinner come from the shared
   widget base (static/css/widget-base.css). What's left here is the survey
   itself: the question, the QR panel, the summary carousel, the response list. */

/* Revealed by the JS once the poll is live, and only for the presenter. */
#close-btn { display: none; }

/* ── Collect view ────────────────────────────────────── */
#collect-view { flex: 1; display: none; flex-direction: column; overflow: hidden; min-height: 0; }

#question-area {
  flex-shrink: 0; padding: 22px 32px 16px;
  border-bottom: 1px solid var(--border); text-align: center;
}
#question-text { font-size: var(--fs-head); font-weight: 500; line-height: 1.35; }

/* QR panel — biased slightly above true centre */
#qr-area { padding-bottom: 10%; }
#qrcode-wrap {
  /* Stays white in dark mode too — a QR code has to keep its contrast to scan. */
  padding: 10px; background: #fff;
  border: 1px solid var(--border); border-radius: var(--radius); line-height: 0;
}
#join-url {
  font-family: var(--font-mono); font-size: var(--fs-chrome-sm); color: var(--text-3);
  text-align: center; max-width: 420px; word-break: break-all;
  cursor: pointer; padding: 3px 8px; border-radius: 4px;
  transition: color var(--dur), background var(--dur);
}
#join-url:hover { background: var(--bg-subtle); color: var(--text-2); }

/* ── Loading view ────────────────────────────────────── */
#loading-view { display: none; }

/* ── Summary carousel ────────────────────────────────── */
#results-view {
  flex: 1; display: none; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px; padding: 24px; overflow-y: auto; min-height: 0;
}
.summary-card { width: 100%; max-width: calc(420px * var(--u)); }
#summary-text { font-size: var(--fs-body); line-height: 1.75; color: var(--text-2); }
.carousel-nav { display: flex; align-items: center; gap: 12px; }
#nav-counter { font-family: var(--font-mono); font-size: var(--fs-chrome-sm); color: var(--text-3); }

/* ── Responses view ─────────────────────────────────── */
#responses-view { flex: 1; display: none; flex-direction: column; overflow: hidden; min-height: 0; }
#responses-list {
  flex: 1; overflow-y: auto;
  padding: 16px 20px; display: flex; flex-direction: column; gap: 8px;
}
.resp-card { font-size: var(--fs-body); line-height: 1.55; color: var(--text); }
#responses-empty {
  flex: 1; display: flex; align-items: center; justify-content: center;
}
</style>
</head>
<body>
<div id="shell" class="bw-shell">

  <div id="toolbar" class="bw-toolbar">
    <span class="bw-toolbar-title">Survey</span>
    <div class="bw-sep"></div>
    <span id="resp-count" class="bw-status"><strong id="resp-n">0</strong> responses</span>
    <div class="bw-sep"></div>
    <button class="bw-btn is-active" id="mode-responses" onclick="setMode('responses')">Responses</button>
    <button class="bw-btn"           id="mode-summary"   onclick="setMode('summary')">Summary</button>
    <div class="bw-spacer"></div>
    <button id="close-btn" class="bw-btn bw-btn--primary" onclick="closeAndReview()">Close &amp; Review</button>
  </div>

  <div id="collect-view">
    <div id="question-area"><div id="question-text"></div></div>
    <div id="qr-area" class="bw-center">
      <div class="bw-hint">Scan to respond</div>
      <div id="qrcode-wrap"><div id="qrcode"></div></div>
      <div id="join-url" onclick="copyUrl()" title="Click to copy"></div>
    </div>
  </div>

  <div id="loading-view" class="bw-center">
    <div class="bw-spinner"></div>
    <div id="loading-msg" class="bw-boot-sub">Loading…</div>
  </div>

  <div id="responses-view">
    <div id="responses-list"></div>
  </div>

  <div id="results-view">
    <div class="summary-card bw-card bw-card--lg">
      <div id="summary-text"></div>
      <div id="summary-meta" class="bw-card-meta"></div>
    </div>
    <div class="carousel-nav">
      <button class="bw-btn bw-btn--icon" id="prev-btn" onclick="prevSummary()" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
      <span id="nav-counter"></span>
      <button class="bw-btn bw-btn--icon" id="next-btn" onclick="nextSummary()" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
  </div>

</div>
<script>
(function () {

let cfg = {}, socket = null, role = 'presenter';
let widgetId = 'survey', serverUrl = '', publicBaseUrl = '';
let currentSurvey = null, currentResults = null, currentIdx = 0;
let respCount = 0, phase = 'idle', minResponses = 1;
let surveyMode = 'responses'; // 'responses' | 'summary'

function deriveServer() {
  try { return window.parent.location.origin; } catch (_) { return window.location.origin; }
}

function setRespCount(n) {
  respCount = n;
  document.getElementById('resp-n').textContent = n;
  document.getElementById('close-btn').disabled = n < minResponses;
}

function showPhase(p) {
  phase = p;
  document.getElementById('collect-view').style.display    = p === 'collect'   ? 'flex' : 'none';
  document.getElementById('loading-view').style.display    = p === 'loading'   ? 'flex' : 'none';
  document.getElementById('responses-view').style.display  = p === 'responses' ? 'flex' : 'none';
  document.getElementById('results-view').style.display    = p === 'results'   ? 'flex' : 'none';
  const btn = document.getElementById('close-btn');
  btn.style.display = (p === 'collect' && role === 'presenter') ? 'block' : 'none';
}

function setMode(m) {
  surveyMode = m;
  document.getElementById('mode-responses').classList.toggle('is-active', m === 'responses');
  document.getElementById('mode-summary').classList.toggle('is-active', m === 'summary');
}

function showQR(url) {
  document.getElementById('join-url').textContent = url || '';
  const el = document.getElementById('qrcode'); el.innerHTML = '';
  if (url) new QRCode(el, { text: url, width: 180, height: 180, colorDark: '#1a1a18', colorLight: '#ffffff' });
}

function copyUrl() {
  navigator.clipboard?.writeText(document.getElementById('join-url').textContent).catch(() => {});
}

function emitState() {
  if (!socket || role !== 'presenter') return;
  const state = { phase, question: currentSurvey?.question, surveyMode };
  if (phase === 'collect') { state.surveyId = currentSurvey?.survey_id; state.url = document.getElementById('join-url').textContent; state.count = respCount; }
  else if (phase === 'responses') { state.surveyId = currentSurvey?.survey_id; }
  else if (phase === 'results') { state.results = currentResults; state.idx = currentIdx; }
  socket.emit('widget_state', { widgetId, session_id: cfg.sessionId, state });
}

function applyState(s) {
  if (!s) return;
  if (s.surveyMode) setMode(s.surveyMode);
  if (s.phase === 'collect' && s.surveyId) {
    currentSurvey = { survey_id: s.surveyId, question: s.question };
    document.getElementById('question-text').textContent = s.question || '';
    setRespCount(s.count || 0); showQR(s.url); showPhase('collect');
  } else if (s.phase === 'responses' && s.surveyId) {
    currentSurvey = { ...(currentSurvey || {}), survey_id: s.surveyId, question: s.question };
    fetchAndShowResponses();
  } else if (s.phase === 'results' && s.results) {
    currentSurvey  = { ...(currentSurvey || {}), question: s.question };
    currentResults = s.results; currentIdx = s.idx || 0;
    renderSummary(); showPhase('results');
  }
}

function connectSocket() {
  if (socket) socket.disconnect();
  socket = io(cfg.socketUrl || serverUrl);
  socket.on('connect', () => {
    if (role === 'presenter') socket.emit('join_presenter', { session_id: cfg.sessionId });
  });
  socket.on('widget_state', data => { if (role !== 'viewer' || data?.widgetId !== widgetId) return; applyState(data.state); });
  socket.on('survey_response', data => {
    if (!currentSurvey || data.survey_id !== currentSurvey.survey_id) return;
    setRespCount(data.total);
    // Live-append to responses view if it's open
    if (phase === 'responses' && data.response) appendResponseCard(data.response);
    emitState();
  });
}

async function doLaunch(question, model, n, apiKey) {
  minResponses = n || 1;
  document.getElementById('loading-msg').textContent = 'Creating survey…';
  showPhase('loading');
  try {
    const body = { question, model, num_summaries: n };
    if (apiKey) body.api_key = apiKey;
    const res  = await fetch(`${serverUrl}/api/survey/create`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    currentSurvey = { ...data, question, model, num_summaries: n };
    setRespCount(0);
    document.getElementById('question-text').textContent = question;
    // data.url is a root-relative path (/s/<id>/survey/<sid>). location.origin
    // is "null" inside the srcdoc iframe, so use the origin the parent passed.
    showQR((cfg.socketUrl || deriveServer()) + data.url);
    showPhase('collect'); emitState();
  } catch (e) { console.error('doLaunch:', e); }
}

async function closeAndReview() {
  if (!currentSurvey) return;
  await fetch(`${serverUrl}/api/survey/${currentSurvey.survey_id}/close`, { method: 'POST' }).catch(() => {});
  if (surveyMode === 'summary') {
    await summarize();
  } else {
    await fetchAndShowResponses();
  }
}

async function fetchAndShowResponses() {
  document.getElementById('loading-msg').textContent = 'Loading responses…';
  showPhase('loading');
  try {
    const res = await fetch(`${serverUrl}/api/survey/${currentSurvey.survey_id}/responses`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderResponsesList(data.responses || []);
    showPhase('responses'); emitState();
  } catch (e) {
    console.error('fetchAndShowResponses:', e);
    showPhase('collect');
  }
}

function renderResponsesList(responses) {
  const list = document.getElementById('responses-list');
  list.innerHTML = '';
  if (!responses.length) {
    list.innerHTML = '<div id="responses-empty" class="bw-empty">No responses yet.</div>';
    return;
  }
  for (const r of responses) appendResponseCard(r, list);
}

function appendResponseCard(r, list) {
  list = list || document.getElementById('responses-list');
  const empty = list.querySelector('#responses-empty');
  if (empty) empty.remove();
  const card = document.createElement('div');
  card.className = 'resp-card bw-card';
  const text = document.createElement('div');
  text.textContent = typeof r === 'string' ? r : (r.response || r.text || JSON.stringify(r));
  card.appendChild(text);
  if (r.timestamp) {
    const meta = document.createElement('div');
    meta.className = 'bw-card-meta';
    meta.textContent = new Date(r.timestamp * 1000).toLocaleTimeString();
    card.appendChild(meta);
  }
  list.appendChild(card);
}

async function summarize() {
  if (!currentSurvey) return;
  document.getElementById('loading-msg').textContent = 'Summarizing responses…';
  showPhase('loading');
  try {
    const res = await fetch(`${serverUrl}/api/survey/${currentSurvey.survey_id}/analyze`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
    });
    if (!res.ok) { const d = await res.json(); throw new Error(d.error); }
    currentResults = await res.json(); currentIdx = 0;
    renderSummary(); showPhase('results'); emitState();
  } catch (e) { console.error('summarize:', e); showPhase('collect'); }
}

function renderSummary() {
  if (!currentResults?.summaries?.length) return;
  const s = currentResults.summaries[currentIdx];
  const tot = currentResults.summaries.length;
  document.getElementById('summary-text').textContent = s.summary;
  document.getElementById('summary-meta').textContent =
    `${s.num_respondents} respondent${s.num_respondents !== 1 ? 's' : ''} · ${currentResults.num_responses} total responses`;
  document.getElementById('nav-counter').textContent = `${currentIdx + 1} / ${tot}`;
  document.getElementById('prev-btn').disabled = currentIdx === 0;
  document.getElementById('next-btn').disabled = currentIdx === tot - 1;
  emitState();
}

function prevSummary() { if (currentIdx > 0) { currentIdx--; renderSummary(); } }
function nextSummary() { if (currentResults && currentIdx < currentResults.summaries.length - 1) { currentIdx++; renderSummary(); } }

document.addEventListener('keydown', e => {
  if (phase !== 'results') return;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); prevSummary(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); nextSummary(); }
});

async function updateConfig(c) {
  cfg = c || {}; role = cfg.role || 'presenter';
  widgetId = cfg.id || cfg.widgetId || widgetId;
  // REST calls are session-scoped (/s/<id>/api/…), so prefer serverUrl; the
  // socket connection separately uses cfg.socketUrl (the bare origin).
  serverUrl = cfg.serverUrl || cfg.socketUrl || deriveServer();
  publicBaseUrl = cfg.publicBaseUrl || serverUrl;
  minResponses = parseInt(cfg.minResponses) || 1;
  if (cfg.mode) setMode(cfg.mode);
  connectSocket();
  if (role === 'viewer') { showPhase('loading'); return; }
  if (cfg.question && cfg.autoStart !== false) {
    await doLaunch(cfg.question, cfg.model || null, parseInt(cfg.numSummaries) || 3, cfg.apiKey || null);
  }
}

window.addEventListener('message', e => {
  if (e.data?.type === 'widget-config')  updateConfig(e.data.config);
  if (e.data?.type === 'widget-cleanup') socket?.disconnect();
});
window.setMode      = setMode;
window.closeAndReview = closeAndReview;
window.prevSummary  = prevSummary;
window.nextSummary  = nextSummary;
window.copyUrl      = copyUrl;
})();
</script>
</body>
</html>
