<!DOCTYPE html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "Multiple Choice",
  "category": "Audience Response",
  "fields": [
    { "key": "question",      "label": "Question",                              "type": "textarea",        "placeholder": "Enter the question…", "rows": 3 },
    { "key": "options",       "label": "Answer options (one per line)",         "type": "textarea-lines",  "placeholder": "Option A\nOption B\nOption C", "rows": 4 },
    { "key": "correctAnswer", "label": "Correct option (1-based, blank=none)", "type": "number-nullable", "min": 1, "step": 1 },
    { "key": "scale", "label": "Text size", "type": "select", "options": ["1", "1.4", "1.8", "2.2"], "default": "1.4" }
  ]
}
</script>
<meta charset="utf-8">
<title>MCQ — Beamer+</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<script src="/static/vendor/qrcode.min.js"></script>
<script src="/static/vendor/socket.io.min.js"></script>
<style>
/* Tokens, reset, toolbar, buttons and status pills come from the shared
   widget base (static/css/widget-base.css). What's left here is the poll
   itself: the question, the choice pills, the QR panel, the result bars. */

/* Revealed by the JS once the poll is live, and only for the presenter. */
#close-btn { display: none; }

/* ── Collect view ────────────────────────────────────── */
#collect-view { flex: 1; display: none; flex-direction: column; overflow: hidden; min-height: 0; }

#question-area {
  flex-shrink: 0;
  padding: 22px 32px 16px;
  border-bottom: 1px solid var(--border);
  text-align: center;
}
#question-text { font-size: var(--fs-head); font-weight: 500; line-height: 1.35; }

/* ── Choices ─────────────────────────────────────────── */
#choices-row {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 14px 24px 0; flex-wrap: wrap;
}
.choice-pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 14px 6px 8px;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--bg-subtle);
  font-size: var(--fs-small); color: var(--text-2); line-height: 1.3;
}
.choice-pill .letter {
  display: inline-flex; align-items: center; justify-content: center;
  width: calc(15px * var(--u)); height: calc(15px * var(--u));
  border-radius: 50%;
  background: var(--accent-bg); border: 1px solid var(--border-med);
  color: var(--accent); font-size: calc(8px * var(--u)); font-weight: 700;
  font-family: var(--font-mono); flex-shrink: 0;
}
.choice-pill .choice-label { color: var(--text); }
.choice-pill .choice-label p { display: inline; }

/* ── QR panel — biased slightly above true centre ────── */
#qr-area { padding-bottom: 10%; }
#qrcode-wrap {
  /* Stays white in dark mode too — a QR code has to keep its contrast to scan. */
  padding: 10px; background: #fff;
  border: 1px solid var(--border); border-radius: var(--radius); line-height: 0;
}
#join-url {
  font-family: var(--font-mono); font-size: var(--fs-chrome-sm); color: var(--text-3);
  text-align: center; max-width: 420px; word-break: break-all;
  cursor: pointer; padding: 3px 8px; border-radius: 4px;
  transition: color var(--dur), background var(--dur);
}
#join-url:hover { background: var(--bg-subtle); color: var(--text-2); }

/* ── Results ─────────────────────────────────────────── */
#results-view {
  flex: 1; display: none; flex-direction: column;
  padding: 18px 24px; gap: 4px; overflow-y: auto; justify-content: center;
}
.bar-row { display: grid; grid-template-columns: calc(20px * var(--u)) 1fr calc(40px * var(--u)); align-items: center; gap: 8px; }
.bar-label { font-size: var(--fs-small); font-weight: 700; font-family: var(--font-mono); color: var(--text-2); text-align: center; }
.bar-label.correct { color: var(--ok); }
.bar-track { height: calc(20px * var(--u)); background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: width 0.65s cubic-bezier(.22,1,.36,1); }
.bar-fill.correct { background: var(--ok); }
.bar-meta { display: flex; flex-direction: column; align-items: flex-end; }
.bar-pct { font-size: var(--fs-small); font-weight: 600; font-family: var(--font-mono); color: var(--text); }
.bar-votes { font-size: calc(8px * var(--u)); color: var(--text-3); font-family: var(--font-mono); }
.bar-text-row { display: grid; grid-template-columns: calc(20px * var(--u)) 1fr calc(40px * var(--u)); gap: 8px; margin-top: -2px; margin-bottom: 4px; }
.bar-option-text { grid-column: 2; font-size: var(--fs-small); color: var(--text-3); line-height: 1.3; }
.bar-option-text p { margin: 0; }
</style>
</head>
<body>
<div id="shell" class="bw-shell">

  <div id="toolbar" class="bw-toolbar">
    <span class="bw-toolbar-title">Multiple Choice</span>
    <div class="bw-sep"></div>
    <span id="resp-count" class="bw-status"><strong id="resp-n">0</strong> responses</span>
    <div class="bw-spacer"></div>
    <button id="close-btn" class="bw-btn bw-btn--primary" onclick="closePoll()">Close &amp; Review</button>
  </div>

  <div id="collect-view">
    <div id="question-area">
      <div id="question-text" class="bw-md"></div>
    </div>
    <div id="choices-row"></div>
    <div id="qr-area" class="bw-center">
      <div class="bw-hint">Scan to respond</div>
      <div id="qrcode-wrap"><div id="qrcode"></div></div>
      <div id="join-url" onclick="copyUrl()" title="Click to copy"></div>
    </div>
  </div>

  <div id="results-view"></div>

</div>
<script>
(function () {

const LETTERS = ['A','B','C','D','E','F','G','H'];
const letter  = i => LETTERS[i] || String(i + 1);

let cfg = {}, socket = null, role = 'presenter';
let widgetId = 'mcq', serverUrl = '', publicBaseUrl = '';
let surveyId = null, pollInterval = null, pollClosed = false, revealed = false;
let votes = {}, options = [], correctAnswer = null;
let pollKey = null;   // question+options of the running poll, so a repeat config doesn't reopen it

function setMd(el, src) {
  if (!src) { el.textContent = ''; return; }
  el.innerHTML = marked.parse(src, { breaks: false });
  if (window.renderMathInElement) {
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$',  right: '$',  display: false },
        { left: '\\(', right: '\\)', display: false },
        { left: '\\[', right: '\\]', display: true },
      ], throwOnError: false,
    });
  }
}

function setRespCount(n) { document.getElementById('resp-n').textContent = n; }

function renderChoices() {
  const row = document.getElementById('choices-row');
  row.innerHTML = '';
  options.forEach((opt, i) => {
    const pill  = document.createElement('div');
    pill.className = 'choice-pill';
    const ls = document.createElement('span'); ls.className = 'letter'; ls.textContent = letter(i);
    const ts = document.createElement('span'); ts.className = 'choice-label bw-md';
    pill.appendChild(ls); pill.appendChild(ts); row.appendChild(pill);
    setMd(ts, opt);
  });
}

function renderChart() {
  const view  = document.getElementById('results-view');
  const total = Object.values(votes).reduce((s, v) => s + v, 0);
  view.innerHTML = '';
  options.forEach((opt, i) => {
    const k   = letter(i);
    const n   = votes[k] || 0;
    const pct = total > 0 ? Math.round(n / total * 100) : 0;
    const ok  = revealed && correctAnswer === i;
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <span class="bar-label${ok ? ' correct' : ''}">${k}</span>
      <div class="bar-track"><div class="bar-fill${ok ? ' correct' : ''}" data-pct="${pct}"></div></div>
      <div class="bar-meta"><span class="bar-pct">${pct}%</span><span class="bar-votes">${n}v</span></div>`;
    view.appendChild(row);
    const tr = document.createElement('div'); tr.className = 'bar-text-row';
    const te = document.createElement('span'); te.className = 'bar-option-text bw-md';
    tr.appendChild(document.createElement('span'));
    tr.appendChild(te);
    tr.appendChild(document.createElement('span'));
    view.appendChild(tr); setMd(te, opt);
  });
  requestAnimationFrame(() => {
    view.querySelectorAll('.bar-fill').forEach(el => { el.style.width = el.dataset.pct + '%'; });
  });
}

function showPhase(p) {
  document.getElementById('collect-view').style.display = p === 'collect' ? 'flex' : 'none';
  document.getElementById('results-view').style.display = p === 'results' ? 'flex' : 'none';
  const btn = document.getElementById('close-btn');
  btn.style.display = (p === 'collect' && role === 'presenter') ? 'block' : 'none';
  if (p === 'collect') renderChoices();
  if (p === 'results') renderChart();
}

function showQR(sid) {
  const base = (publicBaseUrl || serverUrl).replace(/\/$/, '');
  const url = `${base}/mcq/${sid}`;
  document.getElementById('join-url').textContent = url;
  const el = document.getElementById('qrcode');
  if (el.dataset.url === url) return;
  el.innerHTML = '';
  el.dataset.url = url;
  new QRCode(el, { text: url, width: 180, height: 180, colorDark: '#1a1a18', colorLight: '#ffffff' });
}

function copyUrl() {
  navigator.clipboard?.writeText(document.getElementById('join-url').textContent).catch(() => {});
}

function emitState() {
  if (!socket || role !== 'presenter') return;
  socket.emit('widget_state', { widgetId, session_id: cfg.sessionId,
    state: { question: cfg.question, options, votes, revealed, correctAnswer, surveyId, pollClosed } });
}

function applyState(s) {
  if (!s || !s.options?.length) return;
  options = s.options; votes = s.votes || {}; revealed = s.revealed || false;
  correctAnswer = s.correctAnswer ?? null; pollClosed = s.pollClosed || false;
  setMd(document.getElementById('question-text'), s.question || '');
  setRespCount(Object.values(votes).reduce((a, b) => a + b, 0));
  showPhase(pollClosed ? 'results' : 'collect');
  if (!pollClosed && s.surveyId) showQR(s.surveyId);
}

function initSocket() {
  const url = cfg.socketUrl || serverUrl;
  if (!url || socket || typeof io === 'undefined') return;
  socket = io(url);
  socket.on('connect', () => {
    if (role === 'presenter') socket.emit('join_presenter', { session_id: cfg.sessionId });
  });
  socket.on('widget_state', data => {
    if (role !== 'viewer' || data?.widgetId !== widgetId) return;
    applyState(data.state);
  });
}

async function startPoll() {
  if (!cfg.question || !options.length) return;
  stopPolling();
  try {
    const res = await fetch(`${serverUrl}/api/survey/create`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: cfg.question, options, model: null, num_summaries: 0 }),
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    surveyId = data.survey_id; votes = {}; revealed = false; pollClosed = false;
    setRespCount(0);
    setMd(document.getElementById('question-text'), cfg.question);
    showQR(surveyId); showPhase('collect');
    stopPolling();   // a second startPoll may have raced this one
    pollInterval = setInterval(fetchVotes, 3000);
    emitState();
  } catch (e) { console.error('startPoll:', e); }
}

async function fetchVotes() {
  if (!surveyId) return;
  const res = await fetch(`${serverUrl}/api/survey/${surveyId}/responses`).catch(() => null);
  if (!res?.ok) return;
  const data = await res.json();
  const nv = {};
  (data.responses || []).forEach(r => { const k = (r.text || '').trim().toUpperCase(); if (k) nv[k] = (nv[k] || 0) + 1; });
  votes = nv;
  setRespCount(Object.values(votes).reduce((a, b) => a + b, 0));
  if (pollClosed) renderChart();
  emitState();
}

function stopPolling() {
  if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
}

async function closePoll() {
  stopPolling();
  await fetchVotes(); pollClosed = true;
  if (surveyId) fetch(`${serverUrl}/api/survey/${surveyId}/close`, { method: 'POST' }).catch(() => {});
  showPhase('results'); emitState();
}

function init(c) {
  cfg = c || {}; role = cfg.role || 'presenter';
  widgetId = cfg.id || cfg.widgetId || widgetId;
  // REST calls are session-scoped (/s/<id>/api/…), so prefer serverUrl; the
  // socket connection separately uses cfg.socketUrl (the bare origin).
  serverUrl = cfg.serverUrl || cfg.socketUrl || (() => { try { return window.parent.location.origin; } catch (_) { return window.location.origin; } })();
  publicBaseUrl = cfg.publicBaseUrl || serverUrl;
  options = cfg.options || []; correctAnswer = cfg.correctAnswer ?? null;
  if (cfg.question) setMd(document.getElementById('question-text'), cfg.question);
  initSocket();
  const key = JSON.stringify([cfg.question, options]);
  if (role !== 'viewer' && cfg.question && options.length && key !== pollKey) {
    pollKey = key;
    if (surveyId) restartPoll(); else startPoll();
  }
}

// Restart: close the current poll on the server and open a fresh one with a
// new QR code, so old responses don't carry over.
function restartPoll() {
  if (role === 'viewer') return;
  stopPolling();
  if (surveyId && !pollClosed)
    fetch(`${serverUrl}/api/survey/${surveyId}/close`, { method: 'POST' }).catch(() => {});
  surveyId = null; votes = {}; revealed = false; pollClosed = false;
  setRespCount(0);
  startPoll();
}

window.addEventListener('message', e => {
  if (e.data?.type === 'widget-config')  init(e.data.config);
  if (e.data?.type === 'widget-cleanup') { stopPolling(); socket?.disconnect(); socket = null; }
});

// Without this the host's Reset reloads the iframe, and the reloaded page
// never receives a widget-config message (the host only sends it on first
// load) — so the poll never restarted.
window.BeamerWidget?.topbar?.onReset(restartPoll);

// Boot from the injected config as well, so a reload still comes up working.
// init() is idempotent: a later widget-config message re-runs it safely.
if (window.WIDGET_CONFIG) init(window.WIDGET_CONFIG);
window.closePoll = closePoll;
window.copyUrl   = copyUrl;
})();
</script>
</body>
</html>
