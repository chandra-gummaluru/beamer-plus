<!DOCTYPE html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "Web Browser",
  "category": "Tools",
  "fields": [
    { "key": "url",     "label": "Starting URL",        "type": "text",     "placeholder": "https://example.com" },
    { "key": "showNav", "label": "Show navigation bar", "type": "checkbox", "default": true }
  ]
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Widget</title>
<style>
:root {
  --bg:         oklch(99% 0.003 80);
  --bg-2:       oklch(97% 0.005 80);
  --bg-3:       oklch(94% 0.007 80);
  --bg-4:       oklch(90% 0.008 80);
  --ink-1:      oklch(22% 0.012 260);
  --ink-2:      oklch(38% 0.010 260);
  --ink-3:      oklch(55% 0.008 260);
  --ink-4:      oklch(72% 0.006 260);
  --accent:     oklch(45% 0.005 260);
  --accent-hi:  oklch(32% 0.006 260);
  --accent-lo:  oklch(92% 0.004 260);
  --ok:         oklch(52% 0.14 160);
  --err:        oklch(58% 0.18 25);
  --line:       1px solid oklch(85% 0.005 260);
  --r:          6px;
  --mono:       ui-monospace, "SF Mono", Menlo, monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: var(--font);
}

#shell {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
}

/* ── Toolbar ─────────────────────────────────────────────────────────────── */
#toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  background: var(--bg-3);
  border-bottom: var(--line);
  flex-shrink: 0;
}

#toolbar.hidden {
  display: none;
}

.nav-btn {
  background: none;
  border: var(--line);
  border-radius: var(--r);
  padding: 4px 7px;
  cursor: pointer;
  color: var(--ink-2);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.14s, color 0.14s;
  flex-shrink: 0;
}

.nav-btn:hover:not(:disabled) {
  background: var(--bg-4);
  color: var(--ink-1);
}

.nav-btn:disabled {
  opacity: 0.38;
  cursor: default;
}

.nav-btn svg {
  width: 15px;
  height: 15px;
  fill: currentColor;
  display: block;
}

#url-bar {
  flex: 1;
  font-family: var(--mono);
  font-size: 12px;
  padding: 5px 10px;
  border: var(--line);
  border-radius: var(--r);
  background: var(--bg-2);
  color: var(--ink-1);
  outline: none;
  transition: border-color 0.15s;
  min-width: 0;
}

#url-bar:focus {
  border-color: var(--accent);
  background: var(--bg);
}

#go-btn {
  font-family: var(--font);
  font-size: 14px;
  padding: 5px 14px;
  border: none;
  border-radius: var(--r);
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.14s;
}

#go-btn:hover {
  background: var(--accent-hi);
}

/* Loading indicator */
#loading-bar {
  height: 2px;
  background: var(--accent);
  width: 0%;
  flex-shrink: 0;
  transition: width 0.2s ease, opacity 0.3s ease;
  opacity: 0;
}

#loading-bar.active {
  opacity: 1;
  animation: load-pulse 1.4s ease-in-out infinite;
}

@keyframes load-pulse {
  0%   { width: 0%; }
  40%  { width: 65%; }
  80%  { width: 88%; }
  100% { width: 88%; }
}

/* ── Content area ────────────────────────────────────────────────────────── */
#content-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#content-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

#content-frame.hidden {
  display: none;
}

/* Overlay messages (placeholder, blocked, error) */
#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--bg);
  color: var(--ink-3);
  font-size: calc(15px * var(--u));
  padding: 32px;
  text-align: center;
}

#overlay.hidden {
  display: none;
}

#overlay svg {
  width: 40px;
  height: 40px;
  fill: var(--ink-4);
  margin-bottom: 4px;
}

#overlay .msg-title {
  font-size: calc(17px * var(--u));
  color: var(--ink-2);
  font-weight: 500;
}

#overlay .msg-sub {
  font-size: calc(13px * var(--u));
  color: var(--ink-4);
  font-family: var(--mono);
  word-break: break-all;
  max-width: 420px;
}

#overlay .msg-hint {
  font-size: calc(13px * var(--u));
  color: var(--ink-4);
  max-width: 360px;
  line-height: 1.5;
}

#overlay .open-btn {
  margin-top: 6px;
  font-family: var(--font);
  font-size: calc(14px * var(--u));
  padding: 7px 20px;
  border: none;
  border-radius: var(--r);
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  transition: background 0.14s;
  text-decoration: none;
}

#overlay .open-btn:hover {
  background: var(--accent-hi);
}
</style>
</head>
<body>
<div id="shell">
  <div id="toolbar" data-bw-topbar>
  </div>

  <div id="loading-bar"></div>

  <div id="content-wrap">
    <iframe
      id="content-frame"
      sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
      class="hidden"
    ></iframe>

    <div id="overlay">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7l5-8v4h4l-5 8z"/></svg>
      <span class="msg-title">Waiting for configured URL</span>
      <span class="msg-hint">Set the destination URL in this widget's slide config.</span>
    </div>
  </div>
</div>

<script src="/static/vendor/socket.io.min.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────────────────────
let cfg          = {};
let history      = [];   // array of URLs navigated
let historyIndex = -1;   // pointer into history
let isNavigating = false;
let socket       = null;
let widgetId     = 'browser-default';
let role         = 'presenter';

// ── DOM ───────────────────────────────────────────────────────────────────────
const toolbar      = document.getElementById('toolbar');
const urlBar       = document.getElementById('url-bar');
const goBtn        = document.getElementById('go-btn');
const loadingBar   = document.getElementById('loading-bar');
const contentFrame = document.getElementById('content-frame');
const overlay      = document.getElementById('overlay');

// ── Helpers ───────────────────────────────────────────────────────────────────
function normalizeUrl(raw) {
  raw = raw.trim();
  if (!raw) return '';
  if (/^https?:\/\//i.test(raw)) return raw;
  if (/^localhost|^\d{1,3}\.\d{1,3}/.test(raw)) return 'http://' + raw;
  return 'https://' + raw;
}

function isAllowed(url) {
  if (!cfg.allowedUrls || cfg.allowedUrls.length === 0) return true;
  return cfg.allowedUrls.some(prefix => url.startsWith(prefix));
}

function updateNavButtons() {
  // Browser widget is config-driven; no local nav controls.
}

function emitState() {
  if (!socket || role === 'viewer') return;
  socket.emit('widget_state', {
    widgetId,
    state: {
      url: history[historyIndex] || '',
      history,
      historyIndex,
    },
  });
}

function applyRemoteState(state) {
  if (!state) return;
  if (Array.isArray(state.history)) {
    history = state.history.slice();
    historyIndex = typeof state.historyIndex === 'number' ? state.historyIndex : history.length - 1;
    updateNavButtons();
  }
  if (state.url) navigate(state.url, false);
}

function connectSocket(url) {
  if (socket) { socket.disconnect(); socket = null; }
  if (!url) return;
  socket = io(url, { transports: ['websocket', 'polling'] });
  socket.on('widget_state', data => {
    if (role !== 'viewer') return;
    if (data?.widgetId !== widgetId) return;
    applyRemoteState(data?.state || {});
  });
}

function showOverlay(titleText, subText, hintText, iconPath, openUrl) {
  overlay.innerHTML = `
    <svg viewBox="0 0 24 24"><path d="${iconPath}"/></svg>
    <span class="msg-title">${titleText}</span>
    ${subText  ? `<span class="msg-sub">${subText}</span>` : ''}
    ${hintText ? `<span class="msg-hint">${hintText}</span>` : ''}
    ${openUrl  ? `<a class="open-btn" href="${openUrl}" target="_blank" rel="noopener">Open in new tab</a>` : ''}
  `;
  overlay.classList.remove('hidden');
  contentFrame.classList.add('hidden');
}

function showPlaceholder() {
  showOverlay(
    'Waiting for configured URL',
    '',
    'Set the destination URL in this widget\'s slide config.',
    'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7l5-8v4h4l-5 8z'
  );
}

function startLoading() {
  loadingBar.classList.remove('active');
  // Force reflow to restart animation
  void loadingBar.offsetWidth;
  loadingBar.classList.add('active');
}

function stopLoading() {
  loadingBar.style.transition = 'width 0.15s ease, opacity 0.3s ease';
  loadingBar.style.width = '100%';
  setTimeout(() => {
    loadingBar.classList.remove('active');
    loadingBar.style.width = '0%';
    loadingBar.style.transition = 'width 0.2s ease, opacity 0.3s ease';
  }, 200);
}

// ── Navigation ────────────────────────────────────────────────────────────────
async function navigate(url, pushHistory = true) {
  if (!url) return;

  if (!isAllowed(url)) {
    showOverlay(
      'Navigation blocked',
      url,
      'This URL is not in the list of allowed destinations.',
      'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z'
    );
    return;
  }

  if (pushHistory) {
    // Truncate forward history when navigating to a new URL
    history = history.slice(0, historyIndex + 1);
    history.push(url);
    historyIndex = history.length - 1;
  }

  updateNavButtons();
  if (urlBar) urlBar.value = url;
  startLoading();

  // Pre-check whether the page allows embedding before loading the iframe.
  // Skip check for viewer role (presenter already checked) or same-origin URLs.
  if (role !== 'viewer') {
    try {
      const res = await fetch(`/api/check-embeddable?url=${encodeURIComponent(url)}`);
      const data = await res.json();
      if (!data.embeddable) {
        stopLoading();
        showOverlay(
          'Page cannot be embedded',
          url,
          'This site blocks embedding via X-Frame-Options or Content-Security-Policy.',
          'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z',
          url
        );
        emitState();
        return;
      }
    } catch (_) {
      // If the check itself fails (no server, CORS, etc.) just try loading anyway.
    }
  }

  overlay.classList.add('hidden');
  contentFrame.classList.remove('hidden');
  contentFrame.src = url;
  emitState();
}

// ── Frame load events ─────────────────────────────────────────────────────────
contentFrame.addEventListener('load', () => {
  stopLoading();
  // Fallback detection: if Chrome replaced the page with an error frame, the
  // cross-origin check throws AND location.href will not be the expected URL.
  try {
    const loc = contentFrame.contentWindow?.location?.href;
    if (loc === 'about:blank' && contentFrame.src && contentFrame.src !== 'about:blank') {
      showOverlay(
        'Page cannot be embedded',
        contentFrame.src,
        'This site blocks embedding via X-Frame-Options or Content-Security-Policy.',
        'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z',
        contentFrame.src
      );
    }
  } catch (_) {
    // Cross-origin SecurityError is normal — page loaded correctly.
  }
});

contentFrame.addEventListener('error', () => {
  stopLoading();
  showOverlay(
    'Failed to load page',
    contentFrame.src,
    'The page could not be loaded. Check the URL and try again.',
    'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z',
    contentFrame.src
  );
});

// ── Toolbar interactions ──────────────────────────────────────────────────────
if (goBtn && urlBar) {
  goBtn.addEventListener('click', () => {
    const url = normalizeUrl(urlBar.value);
    if (url) navigate(url);
  });

  urlBar.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const url = normalizeUrl(urlBar.value);
      if (url) navigate(url);
    }
  });
}

// ── updateConfig ──────────────────────────────────────────────────────────────
function updateConfig(newCfg) {
  cfg = { ...cfg, ...newCfg };
  widgetId = cfg.id || cfg.widgetId || widgetId;
  role = cfg.role || role;

  // Toolbar visibility
  const showNav = role !== 'viewer' && cfg.showNav !== false;
  toolbar.classList.toggle('hidden', !showNav);

  if (cfg.socketUrl) connectSocket(cfg.socketUrl);

  if (cfg.url) {
    const url = normalizeUrl(cfg.url);
    navigate(url);
  } else {
    showPlaceholder();
  }
}

// ── Message listener ──────────────────────────────────────────────────────────
window.addEventListener('message', e => {
  if (e.data?.type === 'widget-config')  updateConfig(e.data.config);
  if (e.data?.type === 'widget-cleanup') destroy?.();
  // Beamer+ state persistence protocol
  if (e.data?.type === 'widget-get-state') {
    window.parent.postMessage({ type: 'widget-state', widgetId,
      state: { url: history[historyIndex] || '', history: history.slice(), historyIndex } }, '*');
  }
  if (e.data?.type === 'widget-set-state' && e.data.state) {
    applyRemoteState(e.data.state);
  }
});

// ── destroy ───────────────────────────────────────────────────────────────────
function destroy() {
  contentFrame.src = 'about:blank';
}

// ── Initial state ─────────────────────────────────────────────────────────────
showPlaceholder();
updateNavButtons();
</script>
</body>
</html>
