<!DOCTYPE html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "Python REPL",
  "category": "Computer Science",
  "fields": []
}
</script>
  <meta charset="utf-8">
  <title>Python REPL</title>
  <script src="/static/vendor/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
  <style>
    :root {
      --surface-paper:   oklch(99% 0.003 80);
      --surface-cream:   oklch(97% 0.005 80);
      --surface-cream-2: oklch(94% 0.007 80);
      --surface-cream-3: oklch(90% 0.008 80);
      --ink-1:  oklch(22% 0.012 260);
      --ink-2:  oklch(38% 0.010 260);
      --ink-3:  oklch(55% 0.008 260);
      --ink-4:  oklch(72% 0.006 260);
      --accent: oklch(45% 0.005 260);
      --accent-soft:   oklch(92% 0.004 260);
      --accent-strong: oklch(32% 0.006 260);
      --success: oklch(52% 0.14 160);
      --danger:  oklch(58% 0.18 25);
      --line:    1px solid oklch(85% 0.005 260);
      --r-sm: 6px; --r-md: 8px;
      --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
      --shadow-1: 0 1px 3px oklch(20% 0.01 260 / 0.06);

      /* Terminal palette — warm dark */
      --term-bg:   oklch(12% 0.008 260);
      --term-fg:   oklch(88% 0.006 80);
      --term-err:  oklch(70% 0.15 25);
      --term-ok:   oklch(68% 0.12 160);
      --term-info: oklch(65% 0.10 250);
      --term-dim:  oklch(48% 0.008 260);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      font-size: calc(14px * var(--u));
      color: var(--ink-1);
      background: var(--surface-paper);
    }

    #widget-container {
      display: flex;
      flex-direction: column;
      width: 100%; height: 100%;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--surface-cream-2);
      border-bottom: var(--line);
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      font-family: var(--font-sans);
      font-size: calc(13px * var(--u));
      color: var(--ink-2);
      background: var(--surface-paper);
      border: var(--line);
      border-radius: var(--r-sm);
      cursor: pointer;
      white-space: nowrap;
      transition: background 120ms, color 120ms;
      user-select: none;
    }
    .btn:hover:not(:disabled) { background: var(--surface-cream-3); }
    .btn:disabled { opacity: 0.45; cursor: default; }

    .btn.run {
      background: var(--accent);
      color: oklch(97% 0.003 80);
      border-color: var(--accent-strong);
    }
    .btn.run:hover:not(:disabled) { background: var(--accent-strong); }

    .btn.danger {
      color: var(--danger);
      border-color: var(--danger);
    }
    .btn.danger:hover:not(:disabled) {
      background: oklch(96% 0.01 25);
    }

    #status {
      margin-left: auto;
      font-size: 12px;
      color: var(--ink-4);
      font-style: italic;
    }
    #status.running { color: var(--accent); }
    #status.error   { color: var(--danger); }

    /* ── Main content: editor + terminal ── */
    #content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Editor pane ── */
    #editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: var(--line);
      min-width: 0;
    }

    .pane-header {
      padding: 5px 12px;
      font-size: calc(11px * var(--u));
      font-style: italic;
      color: var(--ink-4);
      background: var(--surface-cream);
      border-bottom: var(--line);
      flex-shrink: 0;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #editor {
      flex: 1;
      font-family: var(--font-mono);
      font-size: calc(13px * var(--u));
      line-height: 1.6;
      padding: 12px;
      border: none;
      resize: none;
      background: var(--surface-paper);
      color: var(--ink-1);
      overflow: auto;
    }
    #editor:focus { outline: none; }
    #editor:read-only {
      background: var(--surface-cream);
      color: var(--ink-3);
    }

    /* ── Terminal pane ── */
    #terminal-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #terminal {
      flex: 1;
      font-family: var(--font-mono);
      font-size: calc(12.5px * var(--u));
      line-height: 1.55;
      padding: 12px;
      background: var(--term-bg);
      color: var(--term-fg);
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .out-line { display: block; }
    .out-err  { color: var(--term-err); }
    .out-ok   { color: var(--term-ok); }
    .out-info { color: var(--term-info); }
    .out-dim  { color: var(--term-dim); }

    .running-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--term-info);
      font-style: italic;
    }
    .running-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--term-info);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* Viewer badge */
    #viewer-badge {
      display: none;
      font-size: 11px;
      color: var(--ink-4);
      font-style: italic;
      margin-left: 4px;
    }
    body.viewer-mode #viewer-badge { display: inline; }
    body.viewer-mode .pane-header:first-child::after {
      content: ' · read-only';
      color: var(--ink-4);
    }
  </style>
</head>
<body>
  <div id="widget-container">
    <div id="toolbar" data-bw-topbar>
      <button class="btn run" id="run-btn">Run</button>
      <button class="btn" id="example-btn">Example</button>
      <button class="btn danger" id="clear-btn">Clear output</button>
      <span id="status">Loading Python…</span>
      <span id="viewer-badge">live view</span>
    </div>

    <div id="content">
      <div id="editor-pane">
        <div class="pane-header">Editor</div>
        <textarea id="editor" spellcheck="false"># Write your Python code here
print("Hello from Python!")

for i in range(5):
    print(f"  {i}: {'*' * (i + 1)}")</textarea>
      </div>

      <div id="terminal-pane">
        <div class="pane-header">Output</div>
        <div id="terminal"></div>
      </div>
    </div>
  </div>

  <script>
    const EXAMPLES = [
`# Fibonacci sequence
def fib(n):
    a, b = 0, 1
    for _ in range(n):
        print(a, end=' ')
        a, b = b, a + b

fib(12)`,

`# List comprehensions
squares  = [x**2 for x in range(1, 11)]
evens    = [x for x in range(20) if x % 2 == 0]
print("Squares:", squares)
print("Evens:",   evens)`,

`# String operations
text = "Beamer+ is great!"
words = text.split()
print("Words:", words)
print("Reversed:", text[::-1])
print("Upper:", text.upper())
longest = max(words, key=len)
print("Longest word:", longest)`,

`# Statistics
import statistics
data = [12, 7, 23, 4, 18, 31, 9, 15, 27, 6]
print(f"Data:   {data}")
print(f"Mean:   {statistics.mean(data):.2f}")
print(f"Median: {statistics.median(data)}")
print(f"Stdev:  {statistics.stdev(data):.2f}")`
    ];

    class PythonREPL {
      constructor() {
        this.editorEl  = document.getElementById('editor');
        this.termEl    = document.getElementById('terminal');
        this.runBtn    = document.getElementById('run-btn');
        this.clearBtn  = document.getElementById('clear-btn');
        this.exampleBtn = document.getElementById('example-btn');
        this.statusEl  = document.getElementById('status');

        this.pyodide   = null;
        this.running   = false;

        // Sync
        this.widgetId  = null;
        this.role      = 'presenter';
        this.socket    = null;
        this.codeTimer = null;
        this.exampleIndex = 0;

        this.init();
      }

      async init() {
        this.setupEvents();
        await this.loadPyodide();
      }

      setupEvents() {
        this.runBtn.addEventListener('click', () => this.run());
        this.clearBtn.addEventListener('click', () => this.clearOutput());
        this.exampleBtn.addEventListener('click', () => this.loadExample());
        this.editorEl.addEventListener('keydown', e => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            this.run();
          }
        });
        this.editorEl.addEventListener('input', () => this.debouncedCodeSync());
      }

      async loadPyodide() {
        try {
          this.pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/' });
          this.setStatus('Ready');
          this.runBtn.disabled = false;
          this.writeLine('Python ready · Ctrl+Enter to run', 'info');
        } catch (err) {
          this.setStatus('Load error', 'error');
          this.writeLine('Failed to load Python: ' + err.message, 'err');
        }
      }

      async run() {
        if (!this.pyodide || this.running) return;
        const code = this.editorEl.value.trim();
        if (!code) return;

        this.running = true;
        this.runBtn.disabled = true;
        this.setStatus('Running…', 'running');
        this.clearOutput();
        this.showRunning();

        // Emit run-start to viewers
        this.emitState({ code, running: true });

        let stdout = '', stderr = '';
        try {
          await this.pyodide.runPythonAsync(`
import sys, io
sys.stdout = io.StringIO()
sys.stderr = io.StringIO()
`);
          await this.pyodide.runPythonAsync(code);
          stdout = await this.pyodide.runPythonAsync('sys.stdout.getvalue()');
          stderr = await this.pyodide.runPythonAsync('sys.stderr.getvalue()');
        } catch (err) {
          stderr = err.message;
        }

        this.clearOutput();
        if (stdout) this.writeLine(stdout.trimEnd(), 'ok');
        if (stderr)  this.writeLine(stderr.trimEnd(), 'err');
        if (!stdout && !stderr) this.writeLine('(no output)', 'dim');

        this.running = false;
        this.runBtn.disabled = false;
        this.setStatus(stderr ? 'Error' : 'Done', stderr ? 'error' : '');

        // Emit final output to viewers
        this.emitState({ code, running: false, stdout, stderr });
      }

      showRunning() {
        const el = document.createElement('div');
        el.className = 'running-indicator';
        el.innerHTML = '<div class="running-dot"></div><span>Executing…</span>';
        this.termEl.appendChild(el);
      }

      writeLine(text, type = '') {
        const el = document.createElement('span');
        el.className = 'out-line' + (type ? ` out-${type}` : '');
        el.textContent = text + '\n';
        this.termEl.appendChild(el);
        this.termEl.scrollTop = this.termEl.scrollHeight;
      }

      clearOutput() {
        this.termEl.innerHTML = '';
      }

      loadExample() {
        this.editorEl.value = EXAMPLES[this.exampleIndex % EXAMPLES.length].trim();
        this.exampleIndex++;
        this.clearOutput();
        this.debouncedCodeSync();
      }

      setStatus(text, cls = '') {
        this.statusEl.textContent = text;
        this.statusEl.className   = cls;
      }

      // ── Sync ──

      connectSocket(socketUrl) {
        this.socket = io(socketUrl);
        this.socket.on('widget_state', (data) => {
          if (data.widgetId !== this.widgetId) return;
          this.applyState(data.state);
        });
      }

      emitState(extra = {}) {
        if (!this.socket || this.role !== 'presenter') return;
        this.socket.emit('widget_state', {
          widgetId: this.widgetId,
          state: { code: this.editorEl.value, ...extra },
        });
      }

      debouncedCodeSync() {
        clearTimeout(this.codeTimer);
        this.codeTimer = setTimeout(() => this.emitState(), 400);
      }

      applyState(s) {
        if (s.code != null && s.code !== this.editorEl.value) {
          this.editorEl.value = s.code;
        }
        if (s.running) {
          this.clearOutput();
          this.showRunning();
          this.setStatus('Running…', 'running');
        } else if (s.running === false) {
          this.clearOutput();
          if (s.stdout) this.writeLine(s.stdout.trimEnd(), 'ok');
          if (s.stderr) this.writeLine(s.stderr.trimEnd(), 'err');
          if (!s.stdout && !s.stderr) this.writeLine('(no output)', 'dim');
          this.setStatus(s.stderr ? 'Error' : 'Done', s.stderr ? 'error' : '');
        }
      }

      setViewerMode() {
        this.role = 'viewer';
        document.body.classList.add('viewer-mode');
        this.editorEl.readOnly   = true;
        this.runBtn.disabled     = true;
        this.clearBtn.disabled   = true;
        this.exampleBtn.disabled = true;
        this.setStatus('Watching presenter', '');
        this.writeLine('Waiting for presenter…', 'dim');
      }

      // ── Config from Beamer+ ──

      updateConfig(cfg) {
        this.widgetId = cfg.id ?? cfg.widgetId ?? this.widgetId;
        if (cfg.role === 'viewer') this.setViewerMode();
        if (cfg.socketUrl) this.connectSocket(cfg.socketUrl);
        if (cfg.defaultCode) this.editorEl.value = cfg.defaultCode;
        if (cfg.autoRun && this.pyodide) setTimeout(() => this.run(), 600);
      }
    }

    const widget = new PythonREPL();

    window.addEventListener('message', e => {
      if (e.data?.type === 'widget-config')  widget.updateConfig(e.data.config);
      if (e.data?.type === 'widget-cleanup') { /* nothing persistent to clean up */ }
    });
  </script>
</body>
</html>
