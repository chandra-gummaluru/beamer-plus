<!DOCTYPE html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "Calculator",
  "category": "Mathematics",
  "fields": []
}
</script>
<!-- Standalone fallback. Inside Beamer+ the host injects the shared widget
     base (tokens, fonts, toolbar, buttons) ahead of everything else. Opened
     directly (a file in Edge, a plain web server) nothing does, so load the
     same stylesheet from the repo, relative to this file, at the same point in
     the cascade. Beamer+ is unaffected: its link is already present. -->
<script id="bw-standalone">
(function () {
  if (document.querySelector('link[href*="widget-base.css"]')) return;
  var head = document.head || document.getElementsByTagName('head')[0];
  [['preconnect', 'https://fonts.googleapis.com'],
   ['stylesheet', 'https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap'],
   ['stylesheet', '../static/css/widget-base.css']].forEach(function (l) {
    var el = document.createElement('link');
    el.rel = l[0]; el.href = l[1];
    head.appendChild(el);
  });
  document.documentElement.setAttribute('data-bw-standalone', '');
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator — Beamer+</title>
<style>
/* Tokens, reset, toolbar and buttons come from the shared widget base
   (static/css/widget-base.css). What's left here is the calculator: a display
   sized to be read from the back of the room, a keypad that fills whatever
   the slide gives it, and the running history beside it. */

html, body { height: 100%; overflow: hidden; touch-action: manipulation; }

#main {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  overflow: hidden;
}

/* ── The calculator ──────────────────────────────────── */
#calc-panel {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 14px 14px;
  overflow: hidden;
  container-type: size;
}

/* ── Display ─────────────────────────────────────────── */
/* The expression on top, its value underneath in the largest type the
   region allows: on a slide the answer is the thing being looked at. */
#display {
  flex: 0 0 auto;
  background: var(--bg-output);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: min(3.2cqh, 14px) 16px min(3.6cqh, 15px);
}

#expr-input {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--font-mono);
  font-size: clamp(15px, min(4.4cqw, 9cqh), 42px);
  line-height: 1.35;
  color: var(--text);
  caret-color: var(--accent);
}
#expr-input::placeholder { color: var(--text-3); opacity: 0.6; }
#expr-input:read-only { cursor: default; }

#display-sep { height: 1px; background: var(--border); margin: min(1.4cqh, 8px) 0; }

#result {
  font-family: var(--font-mono);
  font-size: clamp(22px, min(8cqw, 15cqh), 92px);
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--text-3);
  min-height: 1.1em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: color 0.12s;
}
#result.ok  { color: var(--text); }
#result.err {
  color: var(--err);
  font-size: clamp(13px, min(3.4cqw, 6cqh), 28px);
  font-weight: 400;
  letter-spacing: 0;
}

/* ── Keypad ──────────────────────────────────────────── */
/* Six rows that share the leftover height, so the keys are as big as the
   slide allows and never need scrolling. */
#buttons {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-auto-rows: 1fr;
  gap: min(1.2cqh, 7px) 7px;
}

.cbtn {
  font-family: var(--font-ui);
  font-size: clamp(12px, min(2.6cqw, 4.6cqh), 30px);
  font-weight: 500;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  min-height: 0;
  padding: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.08s, border-color 0.08s, color 0.08s;
}
.cbtn:hover:not(:disabled)  { background: var(--bg-subtle); border-color: var(--border-med); }
.cbtn:active:not(:disabled) { background: var(--accent-bg); border-color: var(--border-med); }
.cbtn:disabled { opacity: 0.4; cursor: default; }

/* Functions read as the quieter half of the keypad. */
.cbtn.fn {
  font-family: var(--font-mono);
  font-size: clamp(11px, min(2.2cqw, 3.9cqh), 24px);
  color: var(--text-2);
  background: var(--bg-subtle);
}
.cbtn.op   { color: var(--text-2); }
.cbtn.back { color: var(--text-2); }
.cbtn.primary {
  background: var(--text);
  border-color: var(--text);
  color: var(--bg);
}
.cbtn.primary:hover:not(:disabled) { background: var(--text-2); border-color: var(--text-2); }
.cbtn.danger { color: var(--err); }
.cbtn.danger:hover:not(:disabled) { background: var(--err-bg); border-color: var(--err); }
.cbtn sup { font-size: 0.66em; }

/* ── History ─────────────────────────────────────────── */
/* No header of its own: the top bar clears it, and each line says what it
   is. Hidden entirely when the presenter doesn't want it on the slide. */
#history-panel {
  width: 300px;
  flex: 0 0 auto;
  min-width: 0;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  container-type: inline-size;
}
body.no-history #history-panel,
body.no-history .split-handle { display: none; }

#history-list { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; }
#history-list::-webkit-scrollbar { width: 5px; }
#history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

.hist-empty { display: none; }

.hist-item {
  padding: min(2.6cqw, 12px) 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.1s;
}
.hist-item:hover { background: var(--bg-subtle); }
#shell.is-viewer .hist-item { cursor: default; }

.hist-expr {
  font-family: var(--font-mono);
  font-size: clamp(11px, 4.4cqw, 22px);
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hist-result {
  font-family: var(--font-mono);
  font-size: clamp(13px, 6cqw, 30px);
  font-weight: 500;
  color: var(--text);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Split handle ────────────────────────────────────── */
/* Zero-width in the layout; the hit area straddles the history border so
   dragging doesn't shift either pane by the handle's own width. */
.split-handle { flex: 0 0 0; position: relative; z-index: 20; }
.split-handle::before {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: -4px; width: 8px;
  cursor: col-resize;
}
.split-handle::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: -1px; width: 2px;
  background: var(--border-med);
  opacity: 0;
  transition: opacity 0.12s;
  pointer-events: none;
}
.split-handle:hover::after,
.split-handle.dragging::after { opacity: 1; }
body.splitting, body.splitting * { cursor: col-resize !important; user-select: none !important; }

/* The audience sees the numbers, not a notice about them. */
#viewer-toast, #viewer-badge { display: none !important; }

/* A narrow slide region keeps the keypad and drops the rest. */
@media (max-width: 620px) { #history-panel, .split-handle { display: none; } }
@media (max-width: 460px) { .bw-toolbar-title, .bw-toolbar-title + .bw-sep { display: none !important; } }
</style>
</head>
<body>
<div id="shell" class="bw-shell">

  <div id="toolbar" class="bw-toolbar" data-bw-topbar>
    <span class="bw-toolbar-title">Calculator</span>
    <div class="bw-sep"></div>
    <button class="bw-btn" id="btn-history" aria-pressed="true" title="Show or hide the history">History</button>
    <button class="bw-btn" id="btn-clear-hist" title="Empty the history">Clear history</button>
    <div class="bw-spacer"></div>
    <span class="bw-status" id="viewer-badge">view only</span>
  </div>

  <div id="main">

    <div id="calc-panel">
      <div id="display">
        <input id="expr-input" type="text" spellcheck="false"
               autocomplete="off" autocorrect="off" placeholder="Type or tap an expression" />
        <div id="display-sep"></div>
        <div id="result"></div>
      </div>

      <div id="buttons">
        <!-- Functions -->
        <button class="cbtn fn" data-insert="sin(">sin</button>
        <button class="cbtn fn" data-insert="cos(">cos</button>
        <button class="cbtn fn" data-insert="tan(">tan</button>
        <button class="cbtn fn" data-insert="ln(">ln</button>
        <button class="cbtn fn" data-insert="log(">log</button>

        <button class="cbtn fn" data-insert="exp(">exp</button>
        <button class="cbtn fn" data-insert="√(">√</button>
        <button class="cbtn fn" id="btn-ans">ans</button>
        <button class="cbtn fn" id="btn-frac">a/b</button>
        <button class="cbtn fn" data-insert="(">( )</button>

        <!-- Exactly five per row — a short row shifts every digit below it
             one cell and scrambles the keypad. -->
        <button class="cbtn fn" data-insert=")">)</button>
        <button class="cbtn fn" data-insert="^">x<sup>y</sup></button>
        <button class="cbtn fn" data-insert="π">π</button>
        <button class="cbtn fn" data-insert="e">e</button>
        <button class="cbtn op" data-insert="%">%</button>

        <button class="cbtn" data-insert="7">7</button>
        <button class="cbtn" data-insert="8">8</button>
        <button class="cbtn" data-insert="9">9</button>
        <button class="cbtn op" data-insert="×">×</button>
        <button class="cbtn op" data-insert="÷">÷</button>

        <button class="cbtn" data-insert="4">4</button>
        <button class="cbtn" data-insert="5">5</button>
        <button class="cbtn" data-insert="6">6</button>
        <button class="cbtn op" data-insert="+">+</button>
        <button class="cbtn op" data-insert="−">−</button>

        <button class="cbtn" data-insert="1">1</button>
        <button class="cbtn" data-insert="2">2</button>
        <button class="cbtn" data-insert="3">3</button>
        <button class="cbtn danger" id="btn-clear">C</button>
        <button class="cbtn back" id="btn-back">⌫</button>

        <!-- 0 sits under 2, like any keypad -->
        <button class="cbtn" data-insert="0" style="grid-column: 2">0</button>
        <button class="cbtn" data-insert=".">.</button>
        <button class="cbtn primary" id="btn-eq" style="grid-column: span 2">=</button>
      </div>
    </div>

    <div class="split-handle" id="split-handle" title="Drag to resize · double-click to reset"></div>

    <div id="history-panel">
      <div id="history-list"><div class="hist-empty"></div></div>
      <button id="history-clear" hidden></button>
    </div>
  </div>

  <div id="viewer-toast" hidden></div>
</div>

<script src="/static/vendor/socket.io.min.js"></script>

<script>
// ── Split handle — drag to resize the history panel ───────────────────────────
(function () {
  'use strict';
  const handle  = document.getElementById('split-handle');
  const panel   = document.getElementById('history-panel');
  const main    = document.getElementById('main');
  const DEFAULT = 300, MIN_HIST = 140, MIN_CALC = 240;

  function setWidth(w) {
    const max = Math.max(MIN_HIST, main.clientWidth - MIN_CALC);
    panel.style.width = Math.round(Math.min(max, Math.max(MIN_HIST, w))) + 'px';
  }

  handle.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    handle.classList.add('dragging');
    document.body.classList.add('splitting');
    // History sits on the right, so its width is measured from main's right edge.
    const right = main.getBoundingClientRect().right;
    const move  = ev => setWidth(right - ev.clientX);
    const up    = () => {
      handle.classList.remove('dragging');
      document.body.classList.remove('splitting');
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
      handle.removeEventListener('pointercancel', up);
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
    handle.addEventListener('pointercancel', up);
  });
  handle.addEventListener('dblclick', () => setWidth(DEFAULT));
})();
</script>

<script>
(function () {
  'use strict';

  // ── Config ──────────────────────────────────────────────────────────────────
  const _qs       = new URLSearchParams(location.search);
  const CFG       = window.WIDGET_CONFIG || {};
  const WIDGET_ID = CFG.id     || 'calculator';
  const IS_VIEWER = !!(CFG.viewer || _qs.get('viewer') === '1');

  // ── State ───────────────────────────────────────────────────────────────────
  const exprEl   = document.getElementById('expr-input');
  const resultEl = document.getElementById('result');
  let history    = [];   // [{ id, expr, result }]  newest first
  let histCtr    = 0;
  let lastAnswer = '0';

  // ── Socket.IO ────────────────────────────────────────────────────────────────
  let socket = null;

  function initSocket(url) {
    if (typeof io === 'undefined') {
      socket = { emit: () => {}, on: () => {} };
      return;
    }
    try {
      const prev = socket;
      // Never io() bare — inside the srcdoc iframe that resolves to
      // http://about/socket.io/, which an HTTPS deck blocks as mixed content.
      socket = io(url || (window.BeamerWidget ? BeamerWidget.serverOrigin() : ''));
      if (prev && prev.disconnect) prev.disconnect();
      socket.on('widget_event', ({ id, type, payload }) => {
        if (id !== WIDGET_ID) return;
        if (type === 'state') applyState(payload);
      });
    } catch (_) {
      socket = { emit: () => {}, on: () => {} };
    }
  }

  let syncTimer = null;
  function emitState() {
    if (IS_VIEWER) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => {
      socket.emit('widget_event', {
        id: WIDGET_ID,
        type: 'state',
        payload: {
          expression: exprEl.value,
          result:     resultEl.textContent,
          resultOk:   resultEl.classList.contains('ok'),
          history,
        }
      });
    }, 80);
  }

  function applyState({ expression, result, resultOk, history: h }) {
    if (expression != null) exprEl.value = expression;
    if (result     != null) showResult(result, !resultOk && !!result);
    if (h          != null) { history = h; histCtr = h.length ? h[0].id : 0; renderHistory(); }
  }

  // ── Evaluation ──────────────────────────────────────────────────────────────
  // One pass over the names, not a chain of replacements: replacing "ln("
  // with "Math.log(" and then "log(" with "Math.log10(" turned ln(e) into
  // "Math.Math.log10(...)", which read back as an invalid expression.
  const FN = {
    sin: 'Math.sin', cos: 'Math.cos', tan: 'Math.tan',
    asin: 'Math.asin', acos: 'Math.acos', atan: 'Math.atan',
    ln: 'Math.log', log: 'Math.log10', exp: 'Math.exp',
    sqrt: 'Math.sqrt', pi: 'Math.PI', e: 'Math.E',
  };
  const FN_RE = /\b(asin|acos|atan|sin|cos|tan|ln|log|exp|sqrt|pi|e)\b/g;

  function sanitize(raw) {
    return raw
      .replace(/×/g, '*')
      .replace(/÷/g, '/')
      .replace(/−/g, '-')
      // √ and π aren't word characters, so they become names first and go
      // through the same single pass as the rest.
      .replace(/√/g, 'sqrt')
      .replace(/π/g, 'pi')
      .replace(FN_RE, m => FN[m])
      .replace(/\^/g, '**')
      .replace(/%/g, '/100');
  }


  function evaluate(raw) {
    if (!raw.trim()) return { value: '', ok: true };
    try {
      const san = sanitize(raw);
      // Only allow safe math characters after sanitization
      // Case matters here: Math.PI and Math.E are the two capitalised names
      // the sanitiser produces, and a lower-case-only pattern left them in
      // place — which read as "invalid expression" for anything using π or e.
      const safe = san.replace(/Math\.[A-Za-z0-9]+/g, '').replace(/[\d\s\+\-\*\/\.\(\)\*\*]/g, '');
      if (safe.length) return { value: 'invalid expression', ok: false };
      // eslint-disable-next-line no-new-func
      const val = Function('"use strict"; return (' + san + ')')();
      if (typeof val !== 'number' || isNaN(val)) return { value: 'not a number', ok: false };
      if (!isFinite(val)) return { value: val > 0 ? 'Infinity' : '-Infinity', ok: true };
      const str = Number.isInteger(val)
        ? val.toString()
        : parseFloat(val.toPrecision(12)).toString();
      return { value: str, ok: true };
    } catch (_) {
      return { value: 'syntax error', ok: false };
    }
  }

  function showResult(value, isErr) {
    resultEl.textContent = value;
    resultEl.className   = !value ? '' : isErr ? 'err' : 'ok';
  }

  // ── UI actions ───────────────────────────────────────────────────────────────
  function insert(text) {
    if (IS_VIEWER) return;
    const s = exprEl.selectionStart, e = exprEl.selectionEnd, v = exprEl.value;
    exprEl.value = v.slice(0, s) + text + v.slice(e);
    const pos = s + text.length;
    exprEl.setSelectionRange(pos, pos);
    exprEl.focus();
    onInput();
  }

  function backspace() {
    if (IS_VIEWER) return;
    const s = exprEl.selectionStart, e = exprEl.selectionEnd, v = exprEl.value;
    if (s !== e) {
      exprEl.value = v.slice(0, s) + v.slice(e);
      exprEl.setSelectionRange(s, s);
    } else if (s > 0) {
      exprEl.value = v.slice(0, s - 1) + v.slice(s);
      exprEl.setSelectionRange(s - 1, s - 1);
    }
    exprEl.focus();
    onInput();
  }

  function clear() {
    if (IS_VIEWER) return;
    exprEl.value = '';
    showResult('', false);
    exprEl.focus();
    emitState();
  }

  function calculate() {
    if (IS_VIEWER) return;
    const expr = exprEl.value.trim();
    if (!expr) return;
    const { value, ok } = evaluate(expr);
    showResult(value, !ok);
    if (ok && value) {
      lastAnswer = value;
      addToHistory(expr, value);
      emitState();
    }
  }

  function onInput() {
    const expr = exprEl.value;
    if (!expr.trim()) { showResult('', false); emitState(); return; }
    const { value, ok } = evaluate(expr);
    if (ok && value) { showResult(value, false); } else { showResult('', false); }
    emitState();
  }

  // ── History ──────────────────────────────────────────────────────────────────
  function addToHistory(expr, result) {
    history.unshift({ id: ++histCtr, expr, result });
    if (history.length > 60) history.pop();
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    if (!history.length) {
      list.innerHTML = '<div class="hist-empty">No calculations yet.</div>';
      return;
    }
    list.innerHTML = history.map(h => `
      <div class="hist-item" data-id="${h.id}">
        <div class="hist-expr">${escHtml(h.expr)}</div>
        <div class="hist-result">= ${escHtml(h.result)}</div>
      </div>
    `).join('');

    list.querySelectorAll('.hist-item').forEach(el => {
      el.addEventListener('click', () => {
        if (IS_VIEWER) return;
        const entry = history.find(h => h.id === +el.dataset.id);
        if (!entry) return;
        exprEl.value = entry.expr;
        showResult(entry.result, false);
        exprEl.focus();
        exprEl.setSelectionRange(exprEl.value.length, exprEl.value.length);
        emitState();
      });
    });
  }

  function clearHistory() {
    history = [];
    renderHistory();
    emitState();
  }

  // ── Event wiring ─────────────────────────────────────────────────────────────
  document.querySelectorAll('.cbtn[data-insert]').forEach(btn => {
    btn.addEventListener('click', () => insert(btn.dataset.insert));
  });

  document.getElementById('btn-back').addEventListener('click', backspace);
  document.getElementById('btn-clear').addEventListener('click', clear);
  document.getElementById('btn-eq').addEventListener('click', calculate);
  document.getElementById('btn-ans').addEventListener('click', () => insert(lastAnswer));
  document.getElementById('btn-frac').addEventListener('click', () => {
    if (IS_VIEWER) return;
    const expr = exprEl.value.trim();
    const result = expr ? evaluate(expr) : null;
    const numerator = (result?.ok && result.value) ? result.value : (expr || '0');
    exprEl.value = '(' + numerator + ')÷(';
    exprEl.focus();
    exprEl.setSelectionRange(exprEl.value.length, exprEl.value.length);
    onInput();
  });
  document.getElementById('btn-clear-hist').addEventListener('click', clearHistory);

  // History on the slide or not: some lectures want the running record, some
  // want the keypad as wide as the region allows.
  const histBtn = document.getElementById('btn-history');
  histBtn.addEventListener('click', () => {
    const off = document.body.classList.toggle('no-history');
    histBtn.setAttribute('aria-pressed', String(!off));
    histBtn.classList.toggle('is-active', !off);
  });
  histBtn.classList.add('is-active');
  document.getElementById('history-clear').addEventListener('click', clearHistory);

  exprEl.addEventListener('input', onInput);
  exprEl.addEventListener('keydown', e => {
    if (IS_VIEWER) return;
    if (e.key === 'Enter') { e.preventDefault(); calculate(); }
  });

  // ── Viewer mode ───────────────────────────────────────────────────────────────
  function setViewerMode() {
    document.getElementById('shell').classList.add('is-viewer');
    exprEl.readOnly = true;
    document.getElementById('viewer-badge').style.display = 'block';
    document.getElementById('viewer-toast').style.display = 'block';
    document.getElementById('btn-clear-hist').style.display = 'none';
    document.getElementById('btn-history').style.display = 'none';
    document.querySelectorAll('.cbtn').forEach(b => b.disabled = true);
  }

  // ── Config / postMessage ──────────────────────────────────────────────────────
  function applyConfig(cfg) {
    if (!cfg) return;
    if (cfg.viewer || IS_VIEWER) setViewerMode();
    if (cfg.socketUrl) initSocket(cfg.socketUrl);
    if (cfg.defaultExpression && !IS_VIEWER) {
      exprEl.value = cfg.defaultExpression;
      onInput();
    }
  }

  window.addEventListener('message', e => {
    if (e.data?.type === 'widget-config')  applyConfig(e.data.config);
    if (e.data?.type === 'widget-cleanup') { if (socket) socket.disconnect?.(); }
    // Beamer+ state persistence protocol
    if (e.data?.type === 'widget-get-state') {
      window.parent.postMessage({ type: 'widget-state', widgetId: WIDGET_ID,
        state: { expression: exprEl.value, result: resultEl.textContent,
                 resultOk: resultEl.classList.contains('ok'), history, lastAnswer } }, '*');
    }
    if (e.data?.type === 'widget-set-state' && e.data.state) {
      applyState(e.data.state);
      if (e.data.state.lastAnswer != null) lastAnswer = e.data.state.lastAnswer;
      renderHistory();
    }
  });

  // ── Helpers ───────────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── Boot ──────────────────────────────────────────────────────────────────────
  // Wait a tick so socket.io.js script has a chance to load
  setTimeout(() => {
    initSocket();
    if (IS_VIEWER) setViewerMode();
    applyConfig(CFG);
    renderHistory();
  }, 50);

})();
</script>
</body>
</html>
