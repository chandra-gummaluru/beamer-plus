<!DOCTYPE html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "Calculator",
  "category": "Mathematics",
  "fields": []
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator — Beamer+</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap');

/* ── Tokens ──────────────────────────────────────────── */
:root {
  --bg:           #ffffff;
  --bg-subtle:    #f9f9f8;
  --bg-output:    #fafaf9;
  --border:       #e9e9e6;
  --border-med:   #d4d4cf;
  --text:         #1a1a18;
  --text-2:       #6b6b65;
  --text-3:       #aeaea5;
  --accent:       #52524e;
  --accent-bg:    #f0f0ee;
  --green:        #15803d;
  --amber:        #b45309;
  --red:          #dc2626;
  --red-bg:       #fef2f2;
  --radius:       6px;
  --font-mono:    'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
  --font-ui:      'DM Sans', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; touch-action: manipulation; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13px;
  display: flex;
  flex-direction: column;
}

/* ── Toolbar ─────────────────────────────────────────── */
#toolbar {
  flex-shrink: 0;
  height: 42px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 5px;
}

.toolbar-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}

.sep { width: 1px; height: 18px; background: var(--border); margin: 0 3px; flex-shrink: 0; }

.tb-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 28px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.1s, border-color 0.1s;
}
.tb-btn:hover:not(:disabled) { background: var(--bg-subtle); border-color: var(--border-med); }
.tb-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.viewer-badge {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-3);
  font-family: var(--font-mono);
  display: none;
}

/* ── Main layout ─────────────────────────────────────── */
#main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── Calculator panel ────────────────────────────────── */
#calc-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 12px;
  gap: 10px;
  overflow: hidden;
  min-width: 0;
}

/* ── Display ─────────────────────────────────────────── */
#display {
  flex-shrink: 0;
  background: var(--bg-output);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 13px 11px;
}

#expr-input {
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--font-mono);
  font-size: 15px;
  color: var(--text);
  caret-color: var(--accent);
  line-height: 1.5;
}
#expr-input::placeholder { color: var(--text-3); }
#expr-input:read-only { cursor: default; }

#display-sep {
  height: 1px;
  background: var(--border);
  margin: 8px 0 7px;
}

#result {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--text-3);
  min-height: 28px;
  line-height: 1.2;
  transition: color 0.12s;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#result.ok  { color: var(--text-2); }
#result.err { color: var(--red); font-size: 13px; padding-top: 4px; font-weight: 400; letter-spacing: 0; }

/* ── Button sections ─────────────────────────────────── */
#buttons {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  overflow-x: hidden;
}
#buttons::-webkit-scrollbar { width: 4px; }
#buttons::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

.section-label {
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 0 1px;
  user-select: none;
}

.btn-grid {
  display: grid;
  gap: 5px;
}
.btn-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }
.btn-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

/* ── Calc button base ────────────────────────────────── */
.cbtn {
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0;
  height: 40px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.08s, border-color 0.08s, color 0.08s;
  white-space: nowrap;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.cbtn:hover:not(:disabled)  { background: var(--bg-subtle); border-color: var(--border-med); }
.cbtn:active:not(:disabled) { background: var(--accent-bg); border-color: var(--border-med); }
.cbtn:disabled { opacity: 0.4; cursor: default; }

/* Function button — slightly muted */
.cbtn.fn {
  font-size: 12px;
  color: var(--text-2);
  background: var(--bg-subtle);
  font-family: var(--font-mono);
}
.cbtn.fn:hover:not(:disabled) { background: #f0f0ee; }

/* Operator buttons */
.cbtn.op {
  color: var(--text-2);
  font-size: 16px;
}

/* Primary: = */
.cbtn.primary {
  background: var(--text);
  color: #fff;
  border-color: var(--text);
  font-size: 18px;
}
.cbtn.primary:hover:not(:disabled) { background: #2d2d2a; border-color: #2d2d2a; }
.cbtn.primary:active:not(:disabled) { background: #111110; }

/* Clear */
.cbtn.danger {
  color: var(--red);
  background: var(--bg);
}
.cbtn.danger:hover:not(:disabled) { background: var(--red-bg); border-color: #fca5a5; }

/* Backspace */
.cbtn.back {
  color: var(--text-2);
  font-size: 16px;
}

/* ── History panel ───────────────────────────────────── */
#history-panel {
  width: 200px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

#history-header {
  flex-shrink: 0;
  height: 38px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 6px;
}

#history-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
  flex: 1;
}

#history-clear {
  background: none;
  border: none;
  padding: 2px 5px;
  font-size: 11px;
  color: var(--text-3);
  cursor: pointer;
  border-radius: 3px;
  font-family: var(--font-ui);
  transition: color 0.1s, background 0.1s;
}
#history-clear:hover { color: var(--red); background: var(--red-bg); }

#history-list {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}
#history-list::-webkit-scrollbar { width: 4px; }
#history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

.hist-empty {
  padding: 24px 12px;
  font-size: 12px;
  color: var(--text-3);
  text-align: center;
  line-height: 1.6;
}

.hist-item {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.1s;
}
.hist-item:hover { background: var(--bg-subtle); }
.hist-item:last-child { border-bottom: none; }

.hist-expr {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hist-result {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Viewer toast ────────────────────────────────────── */
#viewer-toast {
  position: fixed;
  bottom: 14px; right: 14px;
  background: var(--text);
  color: #fff;
  font-size: 11.5px;
  font-family: var(--font-ui);
  padding: 5px 12px;
  border-radius: 5px;
  opacity: 0.8;
  pointer-events: none;
  display: none;
  z-index: 100;
}
</style>
</head>
<body>

<!-- ── Toolbar ──────────────────────────────────────── -->
<div id="toolbar" data-bw-topbar>
  <span class="toolbar-title">Calculator</span>
  <div class="sep"></div>
  <button class="tb-btn" id="btn-clear-hist">Clear History</button>
  <span class="viewer-badge" id="viewer-badge">view only</span>
</div>

<!-- ── Main ─────────────────────────────────────────── -->
<div id="main">

  <!-- Left: calculator -->
  <div id="calc-panel">

    <!-- Display -->
    <div id="display">
      <input id="expr-input" type="text" spellcheck="false"
             autocomplete="off" autocorrect="off"
             placeholder="Enter expression…" />
      <div id="display-sep"></div>
      <div id="result"></div>
    </div>

    <!-- Buttons -->
    <div id="buttons">

      <!-- Functions section -->
      <div class="section-label">Functions</div>
      <div class="btn-grid cols-5">
        <button class="cbtn fn" data-insert="sin(">sin</button>
        <button class="cbtn fn" data-insert="cos(">cos</button>
        <button class="cbtn fn" data-insert="tan(">tan</button>
        <button class="cbtn fn" data-insert="ln(">ln</button>
        <button class="cbtn fn" data-insert="log(">log</button>

        <button class="cbtn fn" data-insert="exp(">exp</button>
        <button class="cbtn fn" data-insert="√(">√</button>
        <button class="cbtn fn" id="btn-ans">ans</button>
        <button class="cbtn fn" id="btn-frac">a/b</button>
        <button class="cbtn fn" data-insert="(">( )</button>
      </div>

      <!-- Numpad + operators -->
      <div class="section-label" style="margin-top:2px">Numpad</div>
      <div class="btn-grid cols-5">

        <!-- Row 1: modifiers -->
        <button class="cbtn fn" data-insert=")">)</button>
        <button class="cbtn fn" data-insert="^">x<sup>y</sup></button>
        <button class="cbtn fn" data-insert="π">π</button>
        <button class="cbtn fn" data-insert="e">e</button>

        <!-- Row 2 -->
        <button class="cbtn" data-insert="7">7</button>
        <button class="cbtn" data-insert="8">8</button>
        <button class="cbtn" data-insert="9">9</button>
        <button class="cbtn op" data-insert="×">×</button>
        <button class="cbtn op" data-insert="÷">÷</button>

        <!-- Row 3 -->
        <button class="cbtn" data-insert="4">4</button>
        <button class="cbtn" data-insert="5">5</button>
        <button class="cbtn" data-insert="6">6</button>
        <button class="cbtn op" data-insert="+">+</button>
        <button class="cbtn op" data-insert="−">−</button>

        <!-- Row 4 -->
        <button class="cbtn" data-insert="1">1</button>
        <button class="cbtn" data-insert="2">2</button>
        <button class="cbtn" data-insert="3">3</button>
        <button class="cbtn op" data-insert="%">%</button>
        <button class="cbtn back" id="btn-back">⌫</button>

        <!-- Row 5 -->
        <button class="cbtn" data-insert="0">0</button>
        <button class="cbtn" data-insert=".">.</button>
        <button class="cbtn danger" id="btn-clear">C</button>
        <button class="cbtn primary" id="btn-eq" style="grid-column: span 2">=</button>

      </div>
    </div>
  </div>

  <!-- Right: history -->
  <div id="history-panel">
    <div id="history-header">
      <span id="history-title">History</span>
      <button id="history-clear">Clear</button>
    </div>
    <div id="history-list">
      <div class="hist-empty">No calculations yet.<br>Press = to save.</div>
    </div>
  </div>
</div>

<div id="viewer-toast">View-only · synced with presenter</div>

<script src="/static/vendor/socket.io.min.js"></script>

<script>
(function () {
  'use strict';

  // ── Config ──────────────────────────────────────────────────────────────────
  const _qs       = new URLSearchParams(location.search);
  const CFG       = window.WIDGET_CONFIG || {};
  const WIDGET_ID = CFG.id     || 'calculator';
  const IS_VIEWER = !!(CFG.viewer || _qs.get('viewer') === '1');

  // ── State ───────────────────────────────────────────────────────────────────
  const exprEl   = document.getElementById('expr-input');
  const resultEl = document.getElementById('result');
  let history    = [];   // [{ id, expr, result }]  newest first
  let histCtr    = 0;
  let lastAnswer = '0';

  // ── Socket.IO ────────────────────────────────────────────────────────────────
  let socket = null;

  function initSocket(url) {
    if (typeof io === 'undefined') {
      socket = { emit: () => {}, on: () => {} };
      return;
    }
    try {
      const prev = socket;
      // Never io() bare — inside the srcdoc iframe that resolves to
      // http://about/socket.io/, which an HTTPS deck blocks as mixed content.
      socket = io(url || (window.BeamerWidget ? BeamerWidget.serverOrigin() : ''));
      if (prev && prev.disconnect) prev.disconnect();
      socket.on('widget_event', ({ id, type, payload }) => {
        if (id !== WIDGET_ID) return;
        if (type === 'state') applyState(payload);
      });
    } catch (_) {
      socket = { emit: () => {}, on: () => {} };
    }
  }

  let syncTimer = null;
  function emitState() {
    if (IS_VIEWER) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => {
      socket.emit('widget_event', {
        id: WIDGET_ID,
        type: 'state',
        payload: {
          expression: exprEl.value,
          result:     resultEl.textContent,
          resultOk:   resultEl.classList.contains('ok'),
          history,
        }
      });
    }, 80);
  }

  function applyState({ expression, result, resultOk, history: h }) {
    if (expression != null) exprEl.value = expression;
    if (result     != null) showResult(result, !resultOk && !!result);
    if (h          != null) { history = h; histCtr = h.length ? h[0].id : 0; renderHistory(); }
  }

  // ── Evaluation ──────────────────────────────────────────────────────────────
  function sanitize(raw) {
    return raw
      .replace(/×/g,       '*')
      .replace(/÷/g,       '/')
      .replace(/−/g,       '-')
      .replace(/\bsin\(/g,  'Math.sin(')
      .replace(/\bcos\(/g,  'Math.cos(')
      .replace(/\btan\(/g,  'Math.tan(')
      .replace(/\basin\(/g, 'Math.asin(')
      .replace(/\bacos\(/g, 'Math.acos(')
      .replace(/\batan\(/g, 'Math.atan(')
      .replace(/\bln\(/g,   'Math.log(')
      .replace(/\blog\(/g,  'Math.log10(')
      .replace(/\bexp\(/g,  'Math.exp(')
      .replace(/√\(/g,      'Math.sqrt(')
      .replace(/\bπ\b/g,    'Math.PI')
      .replace(/\be\b/g,    'Math.E')
      .replace(/\^/g,       '**')
      .replace(/%/g,        '/100');
  }

  function evaluate(raw) {
    if (!raw.trim()) return { value: '', ok: true };
    try {
      const san = sanitize(raw);
      // Only allow safe math characters after sanitization
      const safe = san.replace(/Math\.[a-z0-9]+/g, '').replace(/[\d\s\+\-\*\/\.\(\)\*\*]/g, '');
      if (safe.length) return { value: 'invalid expression', ok: false };
      // eslint-disable-next-line no-new-func
      const val = Function('"use strict"; return (' + san + ')')();
      if (typeof val !== 'number' || isNaN(val)) return { value: 'not a number', ok: false };
      if (!isFinite(val)) return { value: val > 0 ? 'Infinity' : '-Infinity', ok: true };
      const str = Number.isInteger(val)
        ? val.toString()
        : parseFloat(val.toPrecision(12)).toString();
      return { value: str, ok: true };
    } catch (_) {
      return { value: 'syntax error', ok: false };
    }
  }

  function showResult(value, isErr) {
    resultEl.textContent = value;
    resultEl.className   = !value ? '' : isErr ? 'err' : 'ok';
  }

  // ── UI actions ───────────────────────────────────────────────────────────────
  function insert(text) {
    if (IS_VIEWER) return;
    const s = exprEl.selectionStart, e = exprEl.selectionEnd, v = exprEl.value;
    exprEl.value = v.slice(0, s) + text + v.slice(e);
    const pos = s + text.length;
    exprEl.setSelectionRange(pos, pos);
    exprEl.focus();
    onInput();
  }

  function backspace() {
    if (IS_VIEWER) return;
    const s = exprEl.selectionStart, e = exprEl.selectionEnd, v = exprEl.value;
    if (s !== e) {
      exprEl.value = v.slice(0, s) + v.slice(e);
      exprEl.setSelectionRange(s, s);
    } else if (s > 0) {
      exprEl.value = v.slice(0, s - 1) + v.slice(s);
      exprEl.setSelectionRange(s - 1, s - 1);
    }
    exprEl.focus();
    onInput();
  }

  function clear() {
    if (IS_VIEWER) return;
    exprEl.value = '';
    showResult('', false);
    exprEl.focus();
    emitState();
  }

  function calculate() {
    if (IS_VIEWER) return;
    const expr = exprEl.value.trim();
    if (!expr) return;
    const { value, ok } = evaluate(expr);
    showResult(value, !ok);
    if (ok && value) {
      lastAnswer = value;
      addToHistory(expr, value);
      emitState();
    }
  }

  function onInput() {
    const expr = exprEl.value;
    if (!expr.trim()) { showResult('', false); emitState(); return; }
    const { value, ok } = evaluate(expr);
    if (ok && value) { showResult(value, false); } else { showResult('', false); }
    emitState();
  }

  // ── History ──────────────────────────────────────────────────────────────────
  function addToHistory(expr, result) {
    history.unshift({ id: ++histCtr, expr, result });
    if (history.length > 60) history.pop();
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    if (!history.length) {
      list.innerHTML = '<div class="hist-empty">No calculations yet.<br>Press = to save.</div>';
      return;
    }
    list.innerHTML = history.map(h => `
      <div class="hist-item" data-id="${h.id}">
        <div class="hist-expr">${escHtml(h.expr)}</div>
        <div class="hist-result">= ${escHtml(h.result)}</div>
      </div>
    `).join('');

    list.querySelectorAll('.hist-item').forEach(el => {
      el.addEventListener('click', () => {
        if (IS_VIEWER) return;
        const entry = history.find(h => h.id === +el.dataset.id);
        if (!entry) return;
        exprEl.value = entry.expr;
        showResult(entry.result, false);
        exprEl.focus();
        exprEl.setSelectionRange(exprEl.value.length, exprEl.value.length);
        emitState();
      });
    });
  }

  function clearHistory() {
    history = [];
    renderHistory();
    emitState();
  }

  // ── Event wiring ─────────────────────────────────────────────────────────────
  document.querySelectorAll('.cbtn[data-insert]').forEach(btn => {
    btn.addEventListener('click', () => insert(btn.dataset.insert));
  });

  document.getElementById('btn-back').addEventListener('click', backspace);
  document.getElementById('btn-clear').addEventListener('click', clear);
  document.getElementById('btn-eq').addEventListener('click', calculate);
  document.getElementById('btn-ans').addEventListener('click', () => insert(lastAnswer));
  document.getElementById('btn-frac').addEventListener('click', () => {
    if (IS_VIEWER) return;
    const expr = exprEl.value.trim();
    const result = expr ? evaluate(expr) : null;
    const numerator = (result?.ok && result.value) ? result.value : (expr || '0');
    exprEl.value = '(' + numerator + ')÷(';
    exprEl.focus();
    exprEl.setSelectionRange(exprEl.value.length, exprEl.value.length);
    onInput();
  });
  document.getElementById('btn-clear-hist').addEventListener('click', clearHistory);
  document.getElementById('history-clear').addEventListener('click', clearHistory);

  exprEl.addEventListener('input', onInput);
  exprEl.addEventListener('keydown', e => {
    if (IS_VIEWER) return;
    if (e.key === 'Enter') { e.preventDefault(); calculate(); }
  });

  // ── Viewer mode ───────────────────────────────────────────────────────────────
  function setViewerMode() {
    exprEl.readOnly = true;
    document.getElementById('viewer-badge').style.display = 'block';
    document.getElementById('viewer-toast').style.display = 'block';
    document.getElementById('btn-clear-hist').style.display = 'none';
    document.querySelectorAll('.cbtn').forEach(b => b.disabled = true);
  }

  // ── Config / postMessage ──────────────────────────────────────────────────────
  function applyConfig(cfg) {
    if (!cfg) return;
    if (cfg.viewer || IS_VIEWER) setViewerMode();
    if (cfg.socketUrl) initSocket(cfg.socketUrl);
    if (cfg.defaultExpression && !IS_VIEWER) {
      exprEl.value = cfg.defaultExpression;
      onInput();
    }
  }

  window.addEventListener('message', e => {
    if (e.data?.type === 'widget-config')  applyConfig(e.data.config);
    if (e.data?.type === 'widget-cleanup') { if (socket) socket.disconnect?.(); }
    // Beamer+ state persistence protocol
    if (e.data?.type === 'widget-get-state') {
      window.parent.postMessage({ type: 'widget-state', widgetId: WIDGET_ID,
        state: { expression: exprEl.value, result: resultEl.textContent,
                 resultOk: resultEl.classList.contains('ok'), history, lastAnswer } }, '*');
    }
    if (e.data?.type === 'widget-set-state' && e.data.state) {
      applyState(e.data.state);
      if (e.data.state.lastAnswer != null) lastAnswer = e.data.state.lastAnswer;
      renderHistory();
    }
  });

  // ── Helpers ───────────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── Boot ──────────────────────────────────────────────────────────────────────
  // Wait a tick so socket.io.js script has a chance to load
  setTimeout(() => {
