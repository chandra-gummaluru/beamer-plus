    return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }
  function polyHtml(i, v, sides) {
    const col = dieColor(sides), shape = polyShape(sides);
    const pts = ps => ps.map(p => p.map(n => n.toFixed(2)).join(',')).join(' ');
    let svg = `<polygon points="${pts(shape.outer)}" fill="${col.lo}" stroke="${col.lo}" stroke-width="2" stroke-linejoin="round"/>`;
    facets(shape).forEach(tri => {
      const cx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3 - 50, cy = (tri[0][1] + tri[1][1] + tri[2][1]) / 3 - 50;
      const len = Math.hypot(cx, cy) || 1, lit = (cx * -0.55 + cy * -0.83) / len;
      const fill = lit > 0 ? mixHex(col.face, col.hi, lit * 0.6) : mixHex(col.face, col.lo, -lit * 0.75);
      svg += `<polygon points="${pts(tri)}" fill="${fill}" stroke="rgba(255,255,255,0.22)" stroke-width="0.6" stroke-linejoin="round"/>`;
    });
    svg += `<polygon points="${pts(shape.inner)}" fill="${mixHex(col.face, col.hi, 0.18)}" stroke="rgba(255,255,255,0.3)" stroke-width="0.6" stroke-linejoin="round"/>`;
    const txt = v == null ? '?' : String(v);
    const fs = shape.fs * (txt.length > 2 ? 0.7 : txt.length > 1 ? 0.92 : 1.1);
    const strokeCol = col.ink === '#ffffff' ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.5)';
    svg += `<text class="pnum" x="50" y="${shape.ty}" font-size="${fs.toFixed(1)}" fill="${col.ink}" stroke="${strokeCol}">${txt}</text>`;
    // 6 and 9 are underlined on real polyhedral dice, so they can't be confused.
    const underline = (v === 6 || v === 9) && sides >= 8;
    svg += `<rect class="uline" x="${50 - fs * 0.28}" y="${shape.ty + fs * 0.5}" width="${fs * 0.56}" height="${fs * 0.07}" rx="${fs * 0.03}" fill="${col.ink}" style="display:${underline ? '' : 'none'}"/>`;
    if (!POLY[sides]) svg += `<text class="kind" x="50" y="${shape.outer.reduce((m, p) => Math.max(m, p[1]), 0) + 11}">d${sides}</text>`;
    return `<div class="poly" data-i="${i}"><svg viewBox="0 0 100 100">${svg}</svg></div>`;
  }
  function setPolyFace(el, v, sides) {
    const t = el.querySelector('.pnum'), u = el.querySelector('.uline');
    if (t) t.textContent = String(v);
    if (u) u.style.display = (v === 6 || v === 9) && sides >= 8 ? '' : 'none';
  }

  // ── 3D dice ─────────────────────────────────────────────────────────────────
  // Real polyhedra (three.js 0.160, vendored by the Beamer+ server and loaded
  // on first use): numbered faces, lit and shadowed on a table, thrown so
  // they tumble and come to rest showing the face that was rolled. Where
  // three.js or WebGL isn't available (the file opened on its own, an old
  // GPU), the flat dice above are used instead.
  const THREE_URL = '/static/vendor/three/three.module.min.js';
  const RBOX_URL  = '/static/vendor/three/RoundedBoxGeometry.js';
  let T3 = null, RBox = null, t3Loading = null, t3Failed = false;
  function loadThree() {
    if (T3 || t3Failed) return Promise.resolve(T3);
    if (!t3Loading) {
      t3Loading = Promise.all([import(THREE_URL), import(RBOX_URL)])
        .then(([m, r]) => {
          // WebGL can still be unavailable (old GPU, remote desktop).
          const probe = document.createElement('canvas');
          if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) throw new Error('no webgl');
          T3 = m; RBox = r.RoundedBoxGeometry; return m;
        })
        .catch(() => { t3Failed = true; return null; });
    }
    return t3Loading;
  }

  const DIE_LOOK = {
    poly: { body: 0xf3eee2, ink: '#17171a' },
    d6:   { body: 0xf3eee2, ink: '#17171a' },
  };

  // ── Geometry: each die as a list of flat faces ─────────────────────────────
  // A face: its polygon (outward winding), centre, normal, and which way is
  // "up" for the number printed on it.
  function facesFromGeometry(geo) {
    const T = T3, g = geo.index ? geo.toNonIndexed() : geo;
    const pos = g.getAttribute('position'), groups = [];
    const a = new T.Vector3(), b = new T.Vector3(), c = new T.Vector3();
    for (let i = 0; i < pos.count; i += 3) {
      a.fromBufferAttribute(pos, i); b.fromBufferAttribute(pos, i + 1); c.fromBufferAttribute(pos, i + 2);
      const n = new T.Vector3().subVectors(b, a).cross(new T.Vector3().subVectors(c, a)).normalize();
      let grp = groups.find(f => f.n.dot(n) > 0.999);
      if (!grp) groups.push(grp = { n, pts: [] });
      [a, b, c].forEach(p => { if (!grp.pts.some(q => q.distanceTo(p) < 1e-4)) grp.pts.push(p.clone()); });
    }
    return groups.map(({ n, pts }) => polyFace(pts, n));
  }
  function polyFace(pts, n) {
    const T = T3;
    const centre = pts.reduce((s, p) => s.add(p), new T.Vector3()).multiplyScalar(1 / pts.length);
    const u = new T.Vector3().subVectors(pts[0], centre).normalize(), v = new T.Vector3().crossVectors(n, u);
    pts = pts.slice().sort((p, q) => {
      const dp = new T.Vector3().subVectors(p, centre), dq = new T.Vector3().subVectors(q, centre);
      return Math.atan2(dp.dot(v), dp.dot(u)) - Math.atan2(dq.dot(v), dq.dot(u));
    });
    // Inradius: how big a label fits.
    let inr = Infinity;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      const edge = new T.Vector3().subVectors(q, p), w = new T.Vector3().subVectors(centre, p);
      const t = Math.max(0, Math.min(1, w.dot(edge) / edge.lengthSq()));
      inr = Math.min(inr, p.clone().addScaledVector(edge, t).distanceTo(centre));
    }
    const up = new T.Vector3().subVectors(pts[0], centre).normalize();
    return { pts, centre, n: n.clone(), up, inr };
  }
  // Pentagonal trapezohedron: ten kites, the shape of a real d10. The ring
  // height is solved so each kite is flat.
  function d10Faces() {
    const T = T3, H = 1;
    const ring = e => {
      const U = [], L = [];
      for (let k = 0; k < 5; k++) {
        const a1 = k * 2 * Math.PI / 5, a2 = a1 + Math.PI / 5;
        U.push(new T.Vector3(Math.cos(a1), e, Math.sin(a1)));
        L.push(new T.Vector3(Math.cos(a2), -e, Math.sin(a2)));
      }
      return { U, L };
    };
    const flatness = e => {
      const { U, L } = ring(e), top = new T.Vector3(0, H, 0);
      const n = new T.Vector3().subVectors(U[0], top).cross(new T.Vector3().subVectors(L[0], top));
      return n.dot(new T.Vector3().subVectors(U[1], top));
    };
    let lo = 0.001, hi = 0.9;
    for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; (flatness(lo) * flatness(mid) <= 0) ? (hi = mid) : (lo = mid); }
    const { U, L } = ring((lo + hi) / 2), top = new T.Vector3(0, H, 0), bot = new T.Vector3(0, -H, 0);
    const faces = [];
    for (let k = 0; k < 5; k++) {
      faces.push([top, U[(k + 1) % 5], L[k], U[k]]);
      faces.push([bot, L[k], U[(k + 1) % 5], L[(k + 1) % 5]]);
    }
    return faces.map(pts => {
      const c = pts.reduce((s, p) => s.add(p), new T.Vector3()).multiplyScalar(0.25);
      let n = new T.Vector3().subVectors(pts[1], pts[0]).cross(new T.Vector3().subVectors(pts[2], pts[0])).normalize();
      if (n.dot(c) < 0) n.negate();
      const f = polyFace(pts, n);
      // The number reads with its top toward the point of the kite.
      f.up = new T.Vector3().subVectors(pts[0], f.centre).normalize();
      return f;
    });
  }
  const faceCache = {};
  function dieFaces(sides) {
    if (faceCache[sides]) return faceCache[sides];
    const T = T3;
    let faces;
    if (sides === 4)       faces = facesFromGeometry(new T.TetrahedronGeometry(1.25));
    else if (sides === 8)  faces = facesFromGeometry(new T.OctahedronGeometry(1.15));
    else if (sides === 10) faces = d10Faces().map(f => scaleFace(f, 1.05));
    else if (sides === 12) faces = facesFromGeometry(new T.DodecahedronGeometry(1.12));
    else if (sides === 20) faces = facesFromGeometry(new T.IcosahedronGeometry(1.15));
    else {
      const ax = [[0, 0, 1], [0, 0, -1], [1, 0, 0], [-1, 0, 0], [0, 1, 0], [0, -1, 0]];
      faces = ax.map(([x, y, z]) => {
        const n = new T.Vector3(x, y, z), centre = n.clone().multiplyScalar(0.82);
        const up = Math.abs(y) ? new T.Vector3(0, 0, -1) : new T.Vector3(0, 1, 0);
        return { centre, n, up, inr: 0.82, pts: null };
      });
    }
    // Number the faces so opposite faces add up to sides + 1, as on real dice.
    const order = [];
    const left = faces.map((_, i) => i);
    let k = 1;
    while (left.length) {
      const i = left.shift();
      const opp = left.findIndex(j => faces[j].n.dot(faces[i].n) < -0.999);
      faces[i].value = k;
      if (opp >= 0 && sides !== 4) { faces[left[opp]].value = sides + 1 - k; left.splice(opp, 1); }
      order.push(i); k++;
      if (sides === 4) continue;
    }
    if (sides === 4) faces.forEach((f, i) => { f.value = i + 1; });
    return (faceCache[sides] = faces);
  }
  function scaleFace(f, s) {
    // Copies: the corners are shared between faces.
    f.pts = f.pts.map(p => p.clone().multiplyScalar(s)); f.centre = f.centre.clone().multiplyScalar(s); f.inr *= s; return f;
  }

  // ── Meshes ──────────────────────────────────────────────────────────────────
  function labelTexture(text, sides, ink) {
    const T = T3, cv = document.createElement('canvas');
    cv.width = cv.height = 256;
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, 256, 256);
    if (sides === 6) {
      // Pips, sunk into the face.
      const P = PIPS[text] || [];
      P.forEach(([x, y]) => {
        const cx = x / 100 * 256, cy = y / 100 * 256;
        const g = ctx.createRadialGradient(cx - 6, cy - 6, 2, cx, cy, 26);
        g.addColorStop(0, '#4a4a50'); g.addColorStop(1, ink);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, 25, 0, Math.PI * 2); ctx.fill();
      });
    } else {
      const s = String(text), fs = s.length > 1 ? 118 : 150;
      ctx.font = `700 ${fs}px "DM Sans", "Segoe UI", system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = ink; ctx.fillText(s, 128, 136);
      if ((text === 6 || text === 9) && sides >= 8) { ctx.fillRect(128 - 30, 136 + fs * 0.42, 60, 10); }
    }
    const tex = new T.CanvasTexture(cv);
    tex.colorSpace = T.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
  }

  function buildDie(sides) {
    const T = T3, faces = dieFaces(sides), group = new T.Group();
    const look = sides === 6 ? DIE_LOOK.d6 : DIE_LOOK.poly;
    const mat = new T.MeshPhysicalMaterial({ color: look.body, roughness: 0.42, clearcoat: 1, clearcoatRoughness: 0.25 });
    let body;
    if (sides === 6) body = new T.Mesh(new RBox(1.64, 1.64, 1.64, 5, 0.22), mat);
    else {
      const pos = [], nrm = [];
      faces.forEach(f => {
        for (let i = 1; i < f.pts.length - 1; i++) {
          [f.pts[0], f.pts[i], f.pts[i + 1]].forEach(p => { pos.push(p.x, p.y, p.z); nrm.push(f.n.x, f.n.y, f.n.z); });
        }
      });
      const geo = new T.BufferGeometry();
      geo.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
      geo.setAttribute('normal', new T.Float32BufferAttribute(nrm, 3));
      body = new T.Mesh(geo, mat);
      // Faint edges, so the facets read even when two are lit alike.
      const edges = new T.LineSegments(new T.EdgesGeometry(geo, 10), new T.LineBasicMaterial({ color: 0x8c8678, transparent: true, opacity: 0.35 }));
      group.add(edges);
    }
    body.castShadow = true;
    group.add(body);
    faces.forEach(f => {
      const size = f.inr * (sides === 6 ? 2 : sides === 4 ? 1.55 : 1.45);
      const plane = new T.Mesh(new T.PlaneGeometry(size, size),
        new T.MeshStandardMaterial({ map: labelTexture(f.value, sides, look.ink), transparent: true, roughness: 0.5, polygonOffset: true, polygonOffsetFactor: -2 }));
      const x = new T.Vector3().crossVectors(f.up, f.n).normalize();
      const up = new T.Vector3().crossVectors(f.n, x).normalize();
      plane.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(x, up, f.n));
      plane.position.copy(f.centre).addScaledVector(f.n, sides === 6 ? 0.003 : 0.004);
      group.add(plane);
    });
    group.userData = { sides, faces };
    return group;
  }

  // The orientation that puts face `value` facing up, its number reading
  // the right way for the camera.
  function restQuat(group, value, twist = 0) {
    const T = T3, f = group.userData.faces.find(x => x.value === value) || group.userData.faces[0];
    // A d4 shows its number on the face toward the room, not on top.
    const target = group.userData.sides === 4 ? new T.Vector3(0, 0.62, 0.78).normalize() : new T.Vector3(0, 1, 0);
    const q1 = new T.Quaternion().setFromUnitVectors(f.n, target);
    const up = f.up.clone().applyQuaternion(q1);
    const want = group.userData.sides === 4 ? new T.Vector3(0, 0.78, -0.62).normalize() : new T.Vector3(0, 0, -1);
    const ang = Math.atan2(new T.Vector3().crossVectors(up, want).dot(target), up.dot(want)) + twist;
    return new T.Quaternion().setFromAxisAngle(target, ang).multiply(q1);
  }
  // Height that puts the die's lowest point on the table.
  function restY(group, q) {
    const T = T3, faces = group.userData.faces;
    let min = Infinity;
    if (group.userData.sides === 6) {
      [-1, 1].forEach(x => [-1, 1].forEach(y => [-1, 1].forEach(z => {
        min = Math.min(min, new T.Vector3(x * 0.82, y * 0.82, z * 0.82).applyQuaternion(q).y);
      })));
    } else faces.forEach(f => f.pts.forEach(p => { min = Math.min(min, p.clone().applyQuaternion(q).y); }));
    return -min;
  }

  // ── Scene ───────────────────────────────────────────────────────────────────
  let D3 = null;   // { renderer, scene, camera, dice: [group], sig, raf }
  function ensureScene() {
    if (D3) return D3;
    const T = T3;
    const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    const scene = new T.Scene();
    scene.add(new T.HemisphereLight(0xffffff, 0x8a8a90, 1.25));
    const key = new T.DirectionalLight(0xffffff, 2.4);
    key.position.set(-4, 10, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = -12; key.shadow.camera.right = 12; key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
    key.shadow.radius = 6;
    scene.add(key);
    const fill = new T.DirectionalLight(0xbfd0ff, 0.6);
    fill.position.set(6, 4, -3);
    scene.add(fill);
    const ground = new T.Mesh(new T.PlaneGeometry(60, 40), new T.ShadowMaterial({ opacity: 0.22 }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    const camera = new T.PerspectiveCamera(28, 1, 0.1, 100);
    D3 = { renderer, scene, camera, dice: [], sig: '', raf: 0, slots: [] };
    return D3;
  }
  function layoutScene(sides, w, h) {
    const T = T3, d = ensureScene();
    d.renderer.setSize(w, h, false);
    d.renderer.domElement.style.width = w + 'px';
    d.renderer.domElement.style.height = h + 'px';
    const sig = sides.join(',');
    if (sig !== d.sig) {
      d.dice.forEach(g => d.scene.remove(g));
      d.dice = sides.map(buildDie);
      d.dice.forEach(g => d.scene.add(g));
      d.sig = sig;
    }
    // Side by side on the table, the camera pulled back to fit them all.
    const gap = 2.7, n = sides.length;
    d.slots = sides.map((_, i) => new T.Vector3((i - (n - 1) / 2) * gap, 0, 0));
    d.camera.aspect = w / h;
    const halfW = (n * gap) / 2 + 0.3, halfH = 1.75;
    const vf = T.MathUtils.degToRad(d.camera.fov) / 2, hf = Math.atan(Math.tan(vf) * d.camera.aspect);
    const dist = Math.max(halfW / Math.tan(hf), halfH / Math.tan(vf)) * 1.08;
    // Nearly straight down, as you'd look at dice on a table to read them:
    // the face that came up is the one facing the room.
    d.camera.position.set(0, dist * 0.96, dist * 0.28);
    d.camera.lookAt(0, 0.2, 0);
    d.camera.updateProjectionMatrix();
    return d;
  }
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  function renderDice3D(o, play, sides, faces, w, h) {
    const T = T3, d = layoutScene(sides, w, h);
    cancelAnimationFrame(d.raf);
    // Twist each die a little off square, the same way every time for a roll.
    const twistOf = i => ((S.rollId * 7 + i * 13) % 9 - 4) * 0.05;
    const rest = d.dice.map((g, i) => {
      const q = faces[i] ? restQuat(g, faces[i], twistOf(i)) : restQuat(g, g.userData.faces[(i * 3) % g.userData.faces.length].value, 0.3);
      return { q, y: restY(g, q), x: d.slots[i].x };
    });
    const draw = () => d.renderer.render(d.scene, d.camera);
    if (!play) {
      d.dice.forEach((g, i) => { g.quaternion.copy(rest[i].q); g.position.set(rest[i].x, rest[i].y, 0); });
      draw();
      return 0;
    }
    // The throw: in from the left and above, tumbling about a random axis,
    // bouncing, then settling onto the rolled face.
    const DUR = 1500, start = performance.now();
    const plan = d.dice.map((g, i) => {
      const axis = new T.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
      return { axis, spin: 14 + Math.random() * 6, q0: new T.Quaternion().setFromEuler(new T.Euler(Math.random() * 6, Math.random() * 6, Math.random() * 6)),
               x0: rest[i].x - 3.2 - Math.random(), z0: -1.2 + Math.random() * 0.6, delay: i * 90 };
    });
    const tumble = new T.Quaternion(), from = new T.Quaternion();
    const frame = now => {
      let busy = false;
      d.dice.forEach((g, i) => {
        const p = plan[i], R = rest[i];
        const t = Math.max(0, Math.min(1, (now - start - p.delay) / DUR));
        if (t < 1) busy = true;
        const SETTLE = 0.62;
        // Rotation: free tumble, then ease onto the rest orientation.
        const tt = Math.min(t, SETTLE) / SETTLE;
        tumble.setFromAxisAngle(p.axis, p.spin * (1 - Math.pow(1 - tt, 2)));
        from.copy(p.q0).premultiply(tumble);
        if (t <= SETTLE) g.quaternion.copy(from);
        else g.quaternion.copy(from).slerp(R.q, easeOut((t - SETTLE) / (1 - SETTLE)));

        g.position.set(p.x0 + (R.x - p.x0) * e, R.y + bounce + (1 - e) * 0.6, p.z0 * (1 - e));
      });
      draw();
      if (busy) d.raf = requestAnimationFrame(frame);
    };
    d.raf = requestAnimationFrame(frame);
    return DUR + (d.dice.length - 1) * 90;
  }

  function settleDice3D(faces) {
    if (!D3) return;
    cancelAnimationFrame(D3.raf);
    D3.dice.forEach((g, i) => {
      const q = restQuat(g, faces[i] || 1, ((S.rollId * 7 + i * 13) % 9 - 4) * 0.05);
      g.quaternion.copy(q); g.position.set(D3.slots[i].x, restY(g, q), 0);
    });
    D3.renderer.render(D3.scene, D3.camera);
  }

  function renderDice(o, play) {
    const sides = S.setup.dice.sides;
    // Outcomes from an older set of dice (the settings changed since) are
    // shown as blank dice rather than mismatched faces.
    const fresh = o && o.faces.length === sides.length;
    const faces = fresh ? o.faces : sides.map((s, i) => (s === 6 ? 1 + (i * 3) % 6 : null));
    const n = sides.length, anyCube = sides.includes(6);

    if (T3) {

      const h = Math.round(Math.max(140, Math.min(r.height - 40, sp.playW * 0.8)));
      resultEl.innerHTML = `<div class="play-row"><div class="play dice3" id="dice3" style="width:${sp.playW}px;height:${h}px"></div>` +

    resultEl.style.setProperty('--sz', sz + 'px');
    const col = dieColor(6);
    ['face', 'hi', 'lo', 'pip'].forEach(k => resultEl.style.setProperty(`--d-${k}`, col[k]));
    resultEl.style.setProperty('--d-pip-hi', col.pipHi);
    play = play && fresh;
    resultEl.innerHTML =
      `<div class="play-row"><div class="play" style="width:${sp.playW}px"><div class="items${fresh ? '' : ' ghost'}">${faces.map((f, i) => (sides[i] === 6 ? cubeHtml(i) : polyHtml(i, f, sides[i]))).join('')}</div></div>` +
      historyBoardHtml('dice', S.hist.dice, sp.bw, sp.bh) + '</div>';

    const cap = $('cap');
    const cubes = [...resultEl.querySelectorAll('.die3d')];
    cubes.forEach(el => {
      const i = +el.dataset.i, cube = el.querySelector('.cube');

      cube.style.transition = 'none';

      cube.style.transform = cubeTransform(t);
      reflow(cube);
      t.x += jiggle(2, 3); t.y += jiggle(1, 2); t.z += jiggle(0, 1); t.f = faces[i];
      cube.style.transition = '';

    const tick = polys.length ? setInterval(() => polys.forEach(el => { const s = sides[+el.dataset.i]; setPolyFace(el, jiggle(1, s), s); }), 75) : null;

  // ── Coins ───────────────────────────────────────────────────────────────────
  const METALS = {
    gold:   { hi: '#fbe7a1', mid: '#d8a83e', lo: '#8a5f12', ink: '#7a520c' },
    silver: { hi: '#ffffff', mid: '#c3c7cf', lo: '#6c717b', ink: '#5b606a' },

               `<path d="M50 66.5l1.4 2.9 3.2.4-2.3 2.2.6 3.1-2.9-1.5-2.9 1.5.6-3.1-2.3-2.2 3.2-.4z"/>`;

        }

      <radialGradient id="${id}f" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="${m.hi}"/><stop offset="0.55" stop-color="${m.mid}"/><stop offset="1" stop-color="${m.lo}"/></radialGradient>
      <linearGradient id="${id}r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${m.hi}"/><stop offset="0.5" stop-color="${m.mid}"/><stop offset="1" stop-color="${m.lo}"/></linearGradient>
      <linearGradient id="${id}e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${m.mid}"/><stop offset="1" stop-color="${mixHex(m.mid, m.lo, 0.35)}"/></linearGradient>

    <circle cx="50" cy="50" r="47.3" fill="none" stroke="${m.lo}" stroke-width="2" stroke-dasharray="0.7 1.1" opacity="0.55"/>
    <circle cx="50" cy="50" r="41.5" fill="url(#${id}f)" stroke="${m.lo}" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="${m.lo}" stroke-opacity="0.5" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="0.1 2.35"/>
    ${emboss(`<text font-family="Georgia, 'Times New Roman', serif" font-size="7.2" font-weight="700" letter-spacing="2.4"><textPath href="#${id}a" startOffset="50%" text-anchor="middle">${word}</textPath></text>`)}
    ${emboss(emblem)}

  }
  const coinTurns = [];
  const coinTransform = t => `rotateX(${t.turns * 360 + (t.heads ? 0 : 180)}deg)`;

  function renderCoins(o, play) {
    const st = S.setup.coin, n = o ? o.faces.length : 1;
    const sp = boardSplit();
    const sz = fitSize(n, 1.05, 0.42, 180, sp.playW);
    resultEl.style.setProperty('--sz', sz + 'px');
    const faces = o ? o.faces : [1];
    resultEl.innerHTML =
      `<div class="items${o ? '' : ' ghost'}">${faces.map((_, i) =>
        `<div class="coin3d" data-i="${i}"><div class="ground"></div><div class="coin"><div class="cface heads">${coinFace(true)}</div><div class="cedge"></div><div class="cface tails">${coinFace(false)}</div></div></div>`).join('')}</div>`;
    resultEl.innerHTML = `<div class="play-row"><div class="play" style="width:${sp.playW}px">${resultEl.innerHTML}</div>` +
      historyBoardHtml('coin', S.hist.coin, sp.bw, sp.bh) + '</div>';
    const els = [...resultEl.querySelectorAll('.coin3d')];
    els.forEach((el, i) => {
      const coin = el.querySelector('.coin');
      const t = coinTurns[i] || (coinTurns[i] = { turns: 0, heads: true });
      coin.style.transition = 'none';
      if (!play) { t.heads = !!faces[i]; coin.style.transform = coinTransform(t); return; }
      coin.style.transform = coinTransform(t);
      reflow(coin);
      t.turns += jiggle(4, 6); t.heads = !!faces[i];
      coin.style.transition = '';

      const cap = $('cap');

      const flip = 1300 + n * 60;
      const g = prepNewest(), w = writeNewest(g, flip + 120);
      hold(Math.max(flip, w.end) + 30, () => {
        w.anims.forEach(a => a.cancel()); settleNewest(g);

    }
  }

  // ── Jar of balls ────────────────────────────────────────────────────────────
  function jarSvg(dots) {

    // size that still fits them all.

    for (; r > 1.6; r -= 0.25) {
      const cols = Math.floor(W / (2 * r)), rows = Math.ceil(dots.length / Math.max(1, cols));
      if (cols >= 1 && 2 * r + (rows - 1) * r * 1.74 <= H) break;

      const row = Math.floor(i / cols), col = i % cols;
      const off = row % 2 ? r : 0;

      const y = yBottom - r - row * r * 1.74;
      balls += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${(r * 0.97).toFixed(2)}" fill="url(#jb${c})"/>`;
    });

      const base = getComputedStyle(document.documentElement).getPropertyValue(`--hue-${h}`).trim() || '#888888';

        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(160,190,220,0.22)"/><stop offset="0.5" stop-color="rgba(160,190,220,0.06)"/><stop offset="1" stop-color="rgba(160,190,220,0.18)"/></linearGradient>

      <path d="M30,20 L30,24 C12,28 9,38 9,50 L9,112 Q9,123 20,123 L80,123 Q91,123 91,112 L91,50 C91,38 88,28 70,24 L70,20 Z" fill="none" stroke="rgba(130,145,160,0.75)" stroke-width="1.3"/>
      <path d="M16,54 L16,104" stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round"/>
      <path d="M21,46 Q22,38 30,33" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M84,62 L84,96" stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>

  // A drawn ball's name: its row in the settings, else its colour.
  function ballName(o, i) {
    const j = o.idx ? o.idx[i] : -1, b = S.setup.bag.balls[j];
    return b && b.c === o.balls[i] ? b.label : HUE_NAMES[o.balls[i]];

  // An opaque cloth bag: you know how many are in it, not which.
  function sackSvg(left) {

      <path d="M33,38 C12,52 6,84 12,106 Q18,124 50,124 Q82,124 88,106 C94,84 88,52 67,38 Z" fill="url(#sackHi)"/>

      <path d="M41,46 C35,64 34,86 37,104" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

      <path d="M38,24 L39,38 M44,23 L44.5,38 M50,23 L50,38 M56,23 L55.5,38 M62,24 L61,38" stroke="rgba(0,0,0,0.25)" stroke-width="0.9"/>
      <ellipse cx="50" cy="21.5" rx="15" ry="4.2" fill="#130c24" stroke="#6d55b8" stroke-width="1.2"/>
      <path d="M32,36 Q50,41 68,36" stroke="url(#rope)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M62,37.5 C66,44 70,50 67,58 M63,38 C60,46 61,52 58,58" stroke="url(#rope)" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  // Where a ball leaves the container, in viewBox units (100 × 130): the
  // jar's neck or the bag's mouth, and where it starts from inside.
  const MOUTH = { jar: { from: [50, 96], out: [50, 6] }, bag: { from: [50, 26], out: [50, 2] } };

  // A hand-written sticky note taped to the container: how many are inside.
  function stickyHtml(left) {
    return `<div class="sticky"><span class="tape"></span><b>${left}</b><i>${left === 1 ? 'ball' : 'balls'}</i></div>`;
  }

  // Fly a copy of a ball between two points in #result coordinates, along a
  // list of [x, y, scale, opacity] waypoints. Resolves when it lands.
  // `behindUntil` / `behindFrom`: the waypoint at which the ball comes out
  // from behind the container, or goes back behind it — so it rises from
  // inside, behind the glass and the label, rather than in front of them.
  function flyBall(c, size, path, { duration = 1000, delay = 0, behindUntil = -1, behindFrom = Infinity, offsets = null } = {}) {
    const fly = document.createElement('span');
    fly.className = 'ball flying';
    fly.style.cssText = `--c:var(--hue-${c});--sz:${size}px;left:0;top:0;`;
    resultEl.appendChild(fly);
    const kf = [];
    path.forEach(([x, y, s, op], i) => {
      const k = { transform: `translate(${x - size / 2}px, ${y - size / 2}px) scale(${s})`, opacity: op == null ? 1 : op, offset: offsets ? offsets[i] : i / (path.length - 1) };
      const behind = i < behindUntil || i > behindFrom;
      if (i === behindUntil) kf.push({ ...k, zIndex: 2 });
      kf.push({ ...k, zIndex: behind ? 2 : 9 });
      if (i === behindFrom) kf.push({ ...k, zIndex: 2 });

    const a = fly.animate(kf, { duration, delay, easing: 'ease-in-out', fill: 'both' });
    a.onfinish = () => fly.remove();
    return { a, fly };
  }

  // ── Chalkboard ──────────────────────────────────────────────────────────────
  // Without replacement, each ball drawn is recorded on a chalkboard as a
  // chalk sketch in its colour: a hand-drawn ring, then a few strokes of
  // shading, as if someone at the board were keeping score.
  function hueHex(c) {
    return getComputedStyle(document.documentElement).getPropertyValue(`--hue-${c}`).trim() || '#888888';
  }
  // Small deterministic wobble, so a sketch looks the same on every redraw.
  const wob = (i, k) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x) - 0.5; };

  function sketchSvg(i, cx, cy, r, c) {
    const col = mixHex(hueHex(c), '#ffffff', 0.32);
    // The ring: a little over one turn, radius drifting, so the ends overlap
    // like a quick hand-drawn circle.
    const start = wob(i, 1) * Math.PI, turns = 1.1, N = 30;
    let d = '';
    for (let k = 0; k <= N; k++) {
      const a = start + (k / N) * turns * 2 * Math.PI;
      const rr = r * (1 + 0.06 * Math.sin(k * 0.9 + i) + 0.04 * wob(i, k));
      d += `${k ? 'L' : 'M'}${(cx + rr * Math.cos(a)).toFixed(1)},${(cy + rr * Math.sin(a)).toFixed(1)}`;
    }
    // Shading: diagonal strokes clipped to the ring.
    let hatch = '';
    const n = 5;
    for (let k = 0; k < n; k++) {
      const off = (k - (n - 1) / 2) * r * 0.36;
      const half = Math.sqrt(Math.max(0, (r * 0.8) ** 2 - off * off));
      const ux = Math.SQRT1_2, uy = -Math.SQRT1_2, vx = Math.SQRT1_2, vy = Math.SQRT1_2;
      const mx = cx + vx * off, my = cy + vy * off;
      const j = wob(i, k + 40) * r * 0.08;
      hatch += `<path class="hatch" d="M${(mx - ux * half + j).toFixed(1)},${(my - uy * half).toFixed(1)}L${(mx + ux * half).toFixed(1)},${(my + uy * half + j).toFixed(1)}" stroke="${col}" stroke-width="${Math.max(1.4, r * 0.09).toFixed(1)}"/>`;
    }
    return `<g class="sketch" data-i="${i}" data-cx="${cx.toFixed(1)}" data-cy="${cy.toFixed(1)}">` +
      `<path class="ring" d="${d}" stroke="${col}" stroke-width="${Math.max(2, r * 0.13).toFixed(1)}"/>${hatch}</g>`;
  }

  // `oneJar`: without replacement the board is laid out for exactly a jar's
  // worth. With replacement there's no end, so it's laid out in fixed
  // cells and wiped when full. Either way a sketch never moves once drawn.
  function boardHtml(all, W, H, oneJar) {
    const pad = 22, ledge = 16;
    const iw = W - pad * 2, ih = H - pad * 2 - ledge;
    const n = oneJar ? Math.max(1, all.length, fullBag().reduce((a, b) => a + b, 0)) : 24;
    let cell = 16;
    for (let s = Math.min(96, ih); s >= 16; s -= 1) {
      if (Math.floor(iw / s) * Math.floor(ih / s) >= n) { cell = s; break; }
    }
    const cols = Math.max(1, Math.floor(iw / cell));
    const rows = Math.ceil(n / cols);
    const cap = Math.max(1, cols * Math.max(rows, Math.floor(ih / cell)));
    const page = oneJar ? 0 : Math.floor(Math.max(0, all.length - 1) / cap);
    const out = all.slice(page * cap);
    const x0 = pad + (iw - Math.min(n, cols) * cell) / 2, y0 = pad + (ih - (oneJar ? rows : Math.floor(ih / cell)) * cell) / 2;
    const sketches = out.map((b, i) => {
      const cx = x0 + (i % cols + 0.5) * cell + wob(i, 7) * cell * 0.08;
      const cy = y0 + (Math.floor(i / cols) + 0.5) * cell + wob(i, 9) * cell * 0.08;
      return sketchSvg(i, cx, cy, cell * 0.34, b.c);
    }).join('');
    return `<div class="board" style="width:${W}px;height:${H}px"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
      <defs>
        <filter id="chalk" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="d"/>
          <feComposite in="d" in2="n" operator="arithmetic" k1="0" k2="1" k3="-0.25" k4="0.06"/>
        </filter>
        <radialGradient id="dust" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
        <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98652"/><stop offset="1" stop-color="#7f5530"/></linearGradient>
      </defs>
      <rect x="0" y="0" width="${W}" height="${H - ledge + 4}" rx="10" fill="url(#wood)"/>
      <rect x="9" y="9" width="${W - 18}" height="${H - ledge - 14}" rx="4" fill="#26332d"/>
      <ellipse cx="${W * 0.3}" cy="${H * 0.35}" rx="${W * 0.28}" ry="${H * 0.22}" fill="url(#dust)"/>
      <ellipse cx="${W * 0.72}" cy="${H * 0.62}" rx="${W * 0.24}" ry="${H * 0.18}" fill="url(#dust)"/>
      <g class="chalk" filter="url(#chalk)" fill="none" stroke-linecap="round" stroke-linejoin="round">${sketches}</g>
      <rect x="4" y="${H - ledge - 2}" width="${W - 8}" height="${ledge}" rx="3" fill="url(#wood)"/>
      <rect x="${W * 0.66}" y="${H - ledge - 6}" width="${Math.min(46, W * 0.12)}" height="6" rx="3" fill="#f4f1e8"/>
      <rect x="${W * 0.2}" y="${H - ledge - 7}" width="${Math.min(40, W * 0.1)}" height="7" rx="2" fill="#5a4a3a"/>
    </svg></div>`;
  }

  // Draw a sketch's strokes in, as if by hand: the ring, then each shading
  // stroke. Returns the running animations.
  function drawSketch(g, delay) {
    const anims = [];
    let t = delay;
    g.querySelectorAll('.ring, .hatch').forEach(p => {
      const len = p.getTotalLength();
      const dur = p.classList.contains('ring') ? 520 : 90;
      p.style.strokeDasharray = `${len} ${len}`;
      p.style.strokeDashoffset = String(len);
      anims.push(p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
        { duration: dur, delay: t, easing: 'ease-in-out', fill: 'both' }));
      t += dur + 25;
    });
    return { anims, end: t };
  }

  // A kraft-paper tag on a bit of twine, tied to the bag's drawstring.
  function bagTag(left) {
    return `<g class="bag-tag">
      <path d="M62.5,38.5 C66,46 69,50 71,57.5" stroke="#cdb57d" stroke-width="0.9" fill="none"/>
      <g transform="rotate(-9 71 70)">
        <path d="M60,60 L66,56.5 L76,56.5 L82,60 L82,84 L60,84 Z" fill="#d9bd8c" stroke="#a7875a" stroke-width="0.7" stroke-linejoin="round"/>
        <path d="M60,60 L66,56.5 L76,56.5 L82,60 L82,64 L60,64 Z" fill="#000" opacity="0.06"/>
        <circle cx="71" cy="59.6" r="1.5" fill="#3a2a1a" stroke="#f4ead2" stroke-width="0.8"/>
        <text x="71" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#3b2a18" font-family="'Segoe Print','Bradley Hand','Marker Felt','Comic Sans MS',cursive">${left}</text>
        <text x="71" y="81.6" text-anchor="middle" font-size="4" fill="#5a4630" font-family="'Segoe Print','Bradley Hand','Marker Felt','Comic Sans MS',cursive">${left === 1 ? 'ball' : 'balls'}</text>
      </g></g>`;
  }

  function renderBag(o, play) {
    const st = S.setup.bag, look = st.look === 'bag' ? 'bag' : 'jar';
    const pool = S.pool.bag;
    const drawnNow = o && !o.empty ? o.balls.length : 0;
    // While a draw is animating, the container still shows the balls about
    // to come out of it.
    const shown = pool.slice();
    if (play && !st.replace && o && o.idx) o.idx.forEach(j => { shown[j] = (shown[j] || 0) + 1; });
    const left = shown.reduce((s, x) => s + x, 0);
    // Shuffle the colours into the jar deterministically, so the same jar
    // looks the same on every screen and doesn't reshuffle on a resize.
    const dots = [];
    shown.forEach((n, j) => { for (let i = 0; i < n && dots.length < 200; i++) dots.push(st.balls[j].c); });
    dots.forEach((_, i) => { const j = (i * 7919 + 13) % dots.length; [dots[i], dots[j]] = [dots[j], dots[i]]; });

    const r = resultEl.getBoundingClientRect();
    const jar = Math.max(90, Math.min(r.height * 0.8, r.width * 0.36 / 0.77, 400));
    const sideW = Math.max(160, r.width - jar * 0.77 - jar * 0.5 - 70);
    resultEl.style.setProperty('--jar', jar + 'px');
    const sz = Math.max(26, Math.min(jar * 0.26, 100));
    resultEl.style.setProperty('--sz', sz + 'px');
    const bw = Math.round(Math.min(sideW, jar * 1.45)), bh = Math.round(Math.min(jar * 0.85, bw * 0.72));
    const svg = look === 'bag' ? sackSvg(left).replace('</svg>', bagTag(left) + '</svg>') : jarSvg(dots);
    resultEl.innerHTML =
      `<div class="bag-row" style="gap:${Math.round(jar * 0.45)}px"><div class="jar" id="container">${svg}${look === 'jar' ? stickyHtml(left) : ''}</div>` +
      `<div class="bag-side">${boardHtml(S.hist.bag || [], bw, bh, !st.replace)}</div></div>`;
    if (!play || !drawnNow) return;

    const host = resultEl.getBoundingClientRect(), box = $('container').getBoundingClientRect();
    const at = ([x, y]) => [box.left - host.left + x / 100 * box.width, box.top - host.top + y / 130 * box.height];
    const [fx, fy] = at(MOUTH[look].from), [ox, oy] = at(MOUTH[look].out);
    const board = resultEl.querySelector('.board').getBoundingClientRect();
    // Where a ball is held up for the room to see: between the container
    // and the board, a little above the middle.
    const hx = (box.right + board.left) / 2 - host.left, hy = box.top - host.top + box.height * 0.32;
    const sketches = [...resultEl.querySelectorAll('.board .sketch')];
    const fresh = sketches.slice(Math.max(0, sketches.length - drawnNow));
    fresh.forEach(g => g.querySelectorAll('.ring, .hatch').forEach(p => { p.style.strokeDasharray = '1 100000'; p.style.strokeDashoffset = '1'; }));
    const flights = [], extra = [];
    const small = Math.max(0.25, Math.min(0.6, jar * 0.12 / sz));
    const EACH = 2300, OUT = 0.3, SHOW = 0.66;
    o.balls.forEach((c, i) => {
      const delay = i * 1400;
      const peak = Math.max(sz * 0.6, Math.min(oy, hy) - sz * 0.8);
      let path, offsets, opts;
      if (st.replace) {
        // Out, held up, and back in.
        path = [[fx, fy, small], [ox, oy - sz * 0.1, small * 1.2], [(ox + hx) / 2, peak, 0.8], [hx, hy, 1], [hx, hy, 1], [(ox + hx) / 2, peak, 0.8], [ox, oy, small * 1.2], [fx, fy, small]];
        offsets = [0, 0.12, 0.22, OUT, SHOW, 0.78, 0.9, 1];
        opts = { behindUntil: 1, behindFrom: 6 };
      } else {
        // Out, held up, then tossed away: off and down, spinning out of play.
        const tx = hx + sz * 2.2, ty = host.height + sz;
        path = [[fx, fy, small], [ox, oy - sz * 0.1, small * 1.2], [(ox + hx) / 2, peak, 0.8], [hx, hy, 1], [hx, hy, 1], [hx + sz * 1.2, hy - sz * 0.7, 0.95], [tx, ty, 0.7, 0]];
        offsets = [0, 0.12, 0.22, OUT, SHOW, 0.76, 1];
        opts = { behindUntil: 1 };
      }
      flights.push(flyBall(c, sz, path, { duration: EACH, delay, offsets, ...opts }));
      if (fresh[i]) { const d = drawSketch(fresh[i], delay + EACH * OUT + 80); extra.push(...d.anims); }
    });
    hold((o.balls.length - 1) * 1400 + EACH + 40, () => {
      flights.forEach(f => { f.a.cancel(); f.fly.remove(); });
      extra.forEach(a => a.cancel());
      fresh.forEach(g => g.querySelectorAll('.ring, .hatch').forEach(p => { p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; }));
      // Without replacement the container is now one ball lighter.
      if (!st.replace) renderBag(o, false);
    });
  }

  // ── Cards ───────────────────────────────────────────────────────────────────
  const CARD_PIPS = {
    2: [[50, 0], [50, 100]], 3: [[50, 0], [50, 50], [50, 100]],
    4: [[0, 0], [100, 0], [0, 100], [100, 100]],
    5: [[0, 0], [100, 0], [50, 50], [0, 100], [100, 100]],
    6: [[0, 0], [100, 0], [0, 50], [100, 50], [0, 100], [100, 100]],
    7: [[0, 0], [100, 0], [50, 25], [0, 50], [100, 50], [0, 100], [100, 100]],
    8: [[0, 0], [100, 0], [50, 25], [0, 50], [100, 50], [50, 75], [0, 100], [100, 100]],
    9: [[0, 0], [100, 0], [0, 33.3], [100, 33.3], [50, 50], [0, 66.7], [100, 66.7], [0, 100], [100, 100]],
    10: [[0, 0], [100, 0], [50, 16.7], [0, 33.3], [100, 33.3], [0, 66.7], [100, 66.7], [50, 83.3], [0, 100], [100, 100]],
  };
  function cardFace(id) {
    const ri = id % 13, r = RANKS[ri], s = SUITS[Math.floor(id / 13)], red = s === '♥' || s === '♦';
    let mid;
    if (ri === 0) mid = `<div class="ace">${s}</div>`;
    else if (ri >= 10) mid = `<div class="court" data-s="${s}">${r}</div>`;
    else mid = `<div class="pips">${CARD_PIPS[ri + 1].map(([x, y]) =>
      `<span${y > 50 ? ' class="dn"' : ''} style="left:${x}%;top:${y}%">${s}</span>`).join('')}</div>`;
    const b = `<b${ri === 9 ? ' class="ten"' : ''}>${r}</b>`;
    return `<div class="pcard${red ? ' red' : ''}"><div class="ci tl">${b}<i>${s}</i></div>${mid}<div class="ci br">${b}<i>${s}</i></div></div>`;
  }

  function renderCards(o, play) {
    const st = S.setup.cards;
    const deck = S.pool.cards, drawn = S.pool.hand;
    const shuffling = pendingShuffle; pendingShuffle = false;
    const rr = resultEl.getBoundingClientRect();
    const W = rr.width - 50, H = rr.height - 30;
    const sz = Math.max(50, Math.min(260, H * 0.72, W / (0.714 * 3.6 + 0.5)));
    resultEl.style.setProperty('--sz', sz + 'px');
    const cw = sz * 0.714;

    // Every card drawn so far stays face up beside the deck. They overlap,
    // and then shrink into more rows, so a whole deck's worth still fits.
    const areaW = Math.max(cw, W - cw - sz * 0.5), areaH = H * 0.86;
    const n = drawn.length;
    let hs = sz, perRow = n || 1, rows = 1;
    for (let s = sz; s >= 34; s -= 2) {
      const w = s * 0.714;
      perRow = Math.max(1, Math.floor((areaW - w) / (w * 0.4)) + 1);
      rows = Math.ceil(Math.max(1, n) / perRow);
      hs = s;
      if (rows * s * 1.06 <= areaH) break;
    }
    const hw = hs * 0.714;
    const inRow = Math.min(perRow, Math.max(1, n));
    const step = inRow > 1 ? Math.min(hw + hs * 0.1, (areaW - hw) / (inRow - 1)) : 0;
    let drawnHtml = '';
    for (let r = 0; r < rows && n; r++) {
      const row = drawn.slice(r * perRow, (r + 1) * perRow);
      drawnHtml += `<div class="drawn-row">${row.map((id, i) =>
        `<div class="slot-card drawn-card" style="margin-left:${i ? (step - hw).toFixed(1) : 0}px;z-index:${i + 1}"><div class="flip">${cardFace(id)}<div class="pcard back"></div></div></div>`).join('')}</div>`;
    }

    const pile = Array.from({ length: Math.min(4, Math.ceil(deck.length / 13)) }, (_, i) =>
      `<div class="pcard back" style="transform:translate(${-i * 2}px, ${-i * 2}px)"></div>`).join('');
    const deckHtml = deck.length ? pile + `<span class="badge">${deck.length}</span>` : `<div class="deck-empty">empty</div>`;
    resultEl.innerHTML =
      `<div class="card-table"><div class="deck" id="deck">${deckHtml}</div>` +
      `<div class="drawn" id="drawn" style="width:${areaW}px;--sz:${hs}px">${drawnHtml}</div></div>`;
    if (shuffling && canAnimate()) return riffle();
    if (!play || !o || !o.cards.length) return;

    const host = resultEl.getBoundingClientRect();
    const topOf = () => { const cs = $('deck').querySelectorAll(':scope > .pcard'); return (cs[cs.length - 1] || $('deck')).getBoundingClientRect(); };
    const dk = topOf();
    const anims = [], clones = [];

    if (!st.replace) {
      // The deal: each card comes off the top of the deck face down, lifts,
      // and turns over as it lands with the others.
      const slots = [...resultEl.querySelectorAll('.drawn-card')].slice(-o.cards.length);
      slots.forEach((slot, i) => {
        const el = slot.querySelector('.flip'), t = el.getBoundingClientRect();
        // Centre to centre, scaled from the deck's card size to the hand's.
        const dx = dk.left + dk.width / 2 - (t.left + t.width / 2), dy = dk.top + dk.height / 2 - (t.top + t.height / 2);
        const k = dk.width / t.width;
        const tf = (x, y, a, sc) => `translate(${x}px, ${y}px) rotateY(${a}deg) scale(${sc})`;
        anims.push(el.animate([
          { transform: tf(dx, dy, 180, k), offset: 0 },
          { transform: tf(dx + dk.width * 0.12, dy - dk.height * 0.18, 180, k * 1.04), offset: 0.2 },
          { transform: tf(dx * 0.4, -t.height * 0.16, 150, (k + 1) / 2 * 1.06), offset: 0.6 },
          { transform: tf(0, 0, 0, 1), offset: 1 },
        ], { duration: 900, delay: i * 320, easing: 'cubic-bezier(0.3, 0.6, 0.3, 1)', fill: 'both' }));
      });
      hold(900 + (slots.length - 1) * 320 + 30, () => anims.forEach(a => a.cancel()));
      return;
    }

    // Put straight back: each card comes off the top, turns over so the
    // room can see it, waits a moment, then turns back down and slides into
    // the deck at a random depth.
    const show = 1500;
    o.cards.forEach((id, i) => {
      const c = document.createElement('div');
      c.className = 'slot-card flying-card';
      c.style.cssText = `left:${dk.left - host.left}px;top:${dk.top - host.top}px;`;
      c.innerHTML = `<div class="flip">${cardFace(id)}<div class="pcard back"></div></div>`;
      resultEl.appendChild(c);
      clones.push(c);
      const gap = cw * 1.15;
      const tx = dk.width * 1.4 + i * gap, ty = 0;
      const depth = -dk.height * 0.04;
      const tf = (x, y, a, sc) => `translate(${x}px, ${y}px) rotateY(${a}deg) scale(${sc})`;
      anims.push(c.querySelector('.flip').animate([
        { transform: tf(0, 0, 180, 1), offset: 0 },
        { transform: tf(dk.width * 0.15, -dk.height * 0.18, 180, 1.04), offset: 0.08 },
        { transform: tf(tx, ty, 0, 1.05), offset: 0.24 },
        { transform: tf(tx, ty, 0, 1.05), offset: 0.76 },
        { transform: tf(tx * 0.4, -dk.height * 0.12, 150, 1.03), offset: 0.9 },
        { transform: tf(dk.width * 0.06, depth, 180, 1), offset: 1 },
      ], { duration: 2400 + show - 1500, delay: i * 200, easing: 'cubic-bezier(0.3, 0.6, 0.3, 1)', fill: 'both' }));
    });
    hold(2400 + (o.cards.length - 1) * 200 + 40, () => { anims.forEach(a => a.cancel()); clones.forEach(c => c.remove()); });
  }

  // A riffle shuffle: cut the deck in two, pull the halves apart, let the
  // cards fall back in alternately, square it up.
  let pendingShuffle = false;
  function riffle() {
    const deck = $('deck');
    const statics = [...deck.querySelectorAll(':scope > .pcard')];
    statics.forEach(c => { c.style.visibility = 'hidden'; });
    const N = 14, anims = [], cards = [];
    for (let i = 0; i < N; i++) {
      const c = document.createElement('div');
      c.className = 'pcard back';
      c.style.zIndex = String(2 + i);
      deck.appendChild(c);
      cards.push(c);
    }
    const D = 1700;
    cards.forEach((c, i) => {
      const leftHalf = i % 2 === 0, side = leftHalf ? -1 : 1;
      const lift = -(i >> 1) * 1.2;
      const order = i;                       // falls back in the order they alternate
      const fall = 0.42 + order * (0.36 / N);
      anims.push(c.animate([
        { transform: `translate(0, ${-i * 0.6}px)`, offset: 0 },
        { transform: `translate(${side * 62}%, ${lift}px) rotate(${side * 9}deg)`, offset: 0.24 },
        { transform: `translate(${side * 62}%, ${lift}px) rotate(${side * 9}deg)`, offset: Math.max(0.25, fall - 0.04) },
        { transform: `translate(${side * 8}%, ${-i * 0.6}px) rotate(${side * 2}deg)`, offset: fall + 0.06 },
        { transform: `translate(0, ${-i * 0.6}px)`, offset: 0.9 },
        { transform: `translate(0, ${-i * 0.6}px)`, offset: 1 },
      ], { duration: D, easing: 'ease-in-out', fill: 'both' }));
    });
    hold(D + 30, () => {
      anims.forEach(a => a.cancel());
      cards.forEach(c => c.remove());
      statics.forEach(c => { c.style.visibility = ''; });
    });
  }

  function shuffleDeck() {
    if (IS_VIEWER) return;
    finishAnim();
    refill('cards');
    delete S.last.cards;
    S.shuffleId = (S.shuffleId || 0) + 1;
    pendingShuffle = true;
    S.rollId++;
    render(); emitState(true);
  }
  const cardName = id => `${['Ace', '2', '3', '4', '5', '6', '7', '8', '9', '10', 'Jack', 'Queen', 'King'][id % 13]} of ${['spades', 'hearts', 'diamonds', 'clubs'][Math.floor(id / 13)]}`;

  // ── Spinner ─────────────────────────────────────────────────────────────────
  // The wheel element persists across renders so its rotation can transition;
  // it is rebuilt only when the sectors (or the size) change.
  let wheelBuiltFor = '';
  function renderSpinner(play) {
    const sec = spinnerSectors(), sig = JSON.stringify(sec);
    const o = S.last.spinner;
    const sz = fitSize(1, 0.8, 0.02, 640);
    resultEl.style.setProperty('--sz', sz + 'px');
    if (wheelBuiltFor !== sig || !$('wheel')) {
      wheelBuiltFor = sig;
      const tot = sec.reduce((s, x) => s + x.w, 0);
      let a0 = 0, segs = '', pegs = '';
      sec.forEach((s, i) => {
        const a1 = a0 + s.w / tot * 360;
        segs += sectorPath(a0, a1, i, s.label, sec.length);
        if (sec.length > 1) pegs += pegAt(a0);
        a0 = a1;
      });
      resultEl.innerHTML =
        `<div id="wheel-wrap"><svg viewBox="-6 -16 112 140"><defs>
          <radialGradient id="sheen" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity="0.38"/><stop offset="0.55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.18"/></radialGradient>
          <radialGradient id="hubg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#c4c8cf"/><stop offset="1" stop-color="#5e636c"/></radialGradient>
          <linearGradient id="rimg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a52"/><stop offset="1" stop-color="#1c1c20"/></linearGradient>
          <linearGradient id="standg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2a2f"/><stop offset="0.5" stop-color="#55555d"/><stop offset="1" stop-color="#2a2a2f"/></linearGradient>
          <filter id="wsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#000" flood-opacity="0.32"/></filter>
        </defs>
        <ellipse cx="50" cy="121" rx="30" ry="2.6" fill="rgba(0,0,0,0.2)"/>
        <path d="M45,92 L41,118 L59,118 L55,92 Z" fill="url(#standg)"/>
        <rect x="28" y="116" width="44" height="5.5" rx="2.7" fill="url(#standg)"/>
        <circle cx="50" cy="50" r="50" fill="url(#rimg)" filter="url(#wsh)"/>
        <g id="wheel" style="transform:rotate(${-S.spin}deg)">${segs}${pegs}</g>
        <circle cx="50" cy="50" r="46" fill="url(#sheen)" pointer-events="none"/>
        <circle cx="50" cy="50" r="8.2" fill="url(#hubg)" stroke="#4a4e55" stroke-width="0.5" filter="url(#wsh)"/>
        <circle cx="50" cy="50" r="2.4" fill="#4a4e55"/>
        <g id="ptr" filter="url(#wsh)">
          <path d="M50,10 C46,3 43.2,-1 43.2,-6 A6.8,6.8 0 1 1 56.8,-6 C56.8,-1 54,3 50,10 Z" fill="#d7263d" stroke="#fff" stroke-width="1.1"/>
          <circle cx="50" cy="-6" r="2.1" fill="#fff"/>
        </g></svg></div>`;
    }
    const wheel = $('wheel');
    if (play) {
      wheel.classList.add('spinning');
      reflow(wheel);
      wheel.style.transform = `rotate(${-S.spin}deg)`;
      const stopTick = tickPointer(wheel, sec);
      const stop = () => { stopTick(); wheel.classList.remove('spinning'); };
      wheel.addEventListener('transitionend', function te(e) { if (e.target === wheel) { wheel.removeEventListener('transitionend', te); finishAnim(); } });
      hold(4700, stop, { kind: 'spin' });
    } else {
      wheel.classList.remove('spinning');
      wheel.style.transform = `rotate(${-S.spin}deg)`;
    }
  }

  // The pointer flicks each time a peg passes under it, which is most of
  // what makes a prize wheel feel like one.
  function tickPointer(wheel, sec) {
    const ptr = $('ptr'); if (!ptr) return () => {};
    const tot = sec.reduce((s, x) => s + x.w, 0);
    const bounds = []; let a = 0;
    sec.forEach(s => { bounds.push(a); a += s.w / tot * 360; });
    let last = null, raf = 0, alive = true;
    const angleNow = () => {
      const m = getComputedStyle(wheel).transform;
      if (!m || m === 'none') return 0;
      const v = m.match(/matrix\(([^)]+)\)/); if (!v) return 0;
      const [ma, mb] = v[1].split(',').map(parseFloat);
      return ((-Math.atan2(mb, ma) * 180 / Math.PI) % 360 + 360) % 360;
    };
    const sectorOf = ang => { let k = 0; for (let i = 0; i < bounds.length; i++) if (ang >= bounds[i]) k = i; return k; };
    const loop = () => {
      if (!alive) return;
      const k = sectorOf(angleNow());
      if (last !== null && k !== last && bounds.length > 1) {
        ptr.style.transition = 'none';
        ptr.style.transform = 'rotate(-24deg)';
        reflow(ptr);
        ptr.style.transition = '';
        ptr.style.transform = '';
      }
      last = k;
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => { alive = false; cancelAnimationFrame(raf); ptr.style.transform = ''; };
  }

  function sectorPath(a0, a1, i, label, n) {
    // Angles clockwise from 12 o'clock, so the pointer at the top reads the
    // sector the wheel stops under.
    const pt = (a, r) => [50 + r * Math.sin(a * Math.PI / 180), 50 - r * Math.cos(a * Math.PI / 180)];
    const [x0, y0] = pt(a0, 46), [x1, y1] = pt(a1, 46);
    const large = a1 - a0 > 180 ? 1 : 0;
    const d = a1 - a0 >= 359.99
      ? 'M50,4 A46,46 0 1,1 49.99,4 Z'
      : `M50,50 L${x0.toFixed(2)},${y0.toFixed(2)} A46,46 0 ${large},1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`;
    let text = '';
    if (n <= 20 && a1 - a0 >= 9) {
      // Labels run along the radius, reading outward, like a real wheel.
      const mid = (a0 + a1) / 2, [tx, ty] = pt(mid, 28);
      const short = label.length > 14 ? label.slice(0, 13) + '…' : label;
      const fs = Math.max(3.2, Math.min(8, 62 / Math.max(3.5, short.length + 1.5), (a1 - a0) / 3.6));
      const rot = mid <= 180 ? mid - 90 : mid + 90;
      text = `<text class="lbl" x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" font-size="${fs.toFixed(2)}" transform="rotate(${rot.toFixed(1)} ${tx.toFixed(2)} ${ty.toFixed(2)})">${escHtml(short)}</text>`;
    }
    return `<path d="${d}" style="fill:var(--hue-${i % HUES})" stroke="rgba(255,255,255,0.55)" stroke-width="0.5"/>${text}`;
  }
  function pegAt(a) {
    const x = 50 + 48 * Math.sin(a * Math.PI / 180), y = 50 - 48 * Math.cos(a * Math.PI / 180);
    return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.5" fill="#f1f1ee" stroke="#8b8b90" stroke-width="0.35"/>`;
  }
  // The wheel turns by -angle; the pointer then reads the sector at `angle`
  // (mod 360). Always spin forward several turns to land there.
  function targetAngle(o) {
    const sec = spinnerSectors(), tot = sec.reduce((s, x) => s + x.w, 0);
    let a0 = 0;
    for (let i = 0; i < o.i; i++) a0 += sec[i].w / tot * 360;
    const at = a0 + o.frac * sec[o.i].w / tot * 360;
    return Math.ceil(S.spin / 360) * 360 + 360 * 5 + at;
  }

  // ── Number: a bingo cage ────────────────────────────────────────────────────
  // A brass wire cage on a stand. Turning it tumbles the balls inside; one
  // rolls out down the chute and comes to rest beside it, number up.
  function cageSvg() {
    const cx = 78, cy = 60, R = 46;
    // A handful of balls resting in the bottom of the cage.
    const inside = [[-26, 30], [-12, 34], [3, 35], [18, 33], [31, 26], [-20, 20], [-5, 23], [10, 22], [24, 15], [-33, 17], [37, 10]];
    const ballsIn = inside.map(([dx, dy], k) =>
      `<circle class="cball" cx="${cx + dx}" cy="${cy + dy}" r="6.2" fill="url(#cb${k % 6})" style="animation-delay:${-k * 83}ms"/>`).join('');
    const grads = Array.from({ length: 6 }, (_, h) => {
      const base = hueHex(h);
      return `<radialGradient id="cb${h}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="${mixHex(base, '#ffffff', 0.6)}"/><stop offset="0.5" stop-color="${base}"/><stop offset="1" stop-color="${mixHex(base, '#000000', 0.4)}"/></radialGradient>`;
    }).join('');
    const wire = 'url(#brass)';
    return `<svg viewBox="0 0 160 150"><defs>${grads}
        <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e39b"/><stop offset="0.5" stop-color="#c99a2e"/><stop offset="1" stop-color="#7f5c12"/></linearGradient>
        <linearGradient id="baseWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9b6a3d"/><stop offset="1" stop-color="#5e3d20"/></linearGradient>
      </defs>
      <ellipse cx="80" cy="143" rx="64" ry="4" fill="rgba(0,0,0,0.22)"/>
      <rect x="16" y="127" width="128" height="13" rx="3" fill="url(#baseWood)"/>
      <path d="M36,128 L${cx - 4},${cy}" stroke="${wire}" stroke-width="4" stroke-linecap="round"/>
      <path d="M124,128 L${cx + 4},${cy}" stroke="${wire}" stroke-width="4" stroke-linecap="round"/>
      <g class="cballs">${ballsIn}</g>
      <g id="cage" style="transform-origin:${cx}px ${cy}px">
        <circle cx="${cx}" cy="${cy}" r="${R}" fill="rgba(255,240,200,0.05)" stroke="${wire}" stroke-width="2.6"/>
        <ellipse cx="${cx}" cy="${cy}" rx="${R * 0.66}" ry="${R}" fill="none" stroke="${wire}" stroke-width="1.3"/>
        <ellipse cx="${cx}" cy="${cy}" rx="${R * 0.28}" ry="${R}" fill="none" stroke="${wire}" stroke-width="1.3"/>
        <ellipse cx="${cx}" cy="${cy}" rx="${R}" ry="${R * 0.4}" fill="none" stroke="${wire}" stroke-width="1.3"/>
        <line x1="${cx - R}" y1="${cy}" x2="${cx + R}" y2="${cy}" stroke="${wire}" stroke-width="1.1"/>
        <path d="M${cx},${cy} L${cx - 30},${cy - 34}" stroke="#6e4f10" stroke-width="3" stroke-linecap="round"/>
        <circle cx="${cx - 30}" cy="${cy - 34}" r="4.2" fill="#b3261e" stroke="#6e1410" stroke-width="0.8"/>
      </g>
      <circle cx="${cx}" cy="${cy}" r="5" fill="${wire}" stroke="#6e4f10" stroke-width="0.8"/>
      <path d="M${cx + 30},${cy + 34} L150,108 L150,116 L${cx + 26},${cy + 41} Z" fill="${wire}" stroke="#7f5c12" stroke-width="0.6"/>
    </svg>`;
  }
  // Where a ball leaves the chute, in the cage's viewBox (160 × 150).
  const CHUTE = [146, 104];

  function bingoHtml(text, hue, D) {
    const fs = D * 0.3 * Math.min(1, 2.6 / Math.max(2, text.length));
    return `<div class="bingo" id="bingo" style="--c:var(--hue-${hue});--d:${D}px"><div class="bingo-face"><span style="font-size:${fs.toFixed(1)}px">${escHtml(text)}</span></div></div>`;
  }

  function renderNumber(o, play) {
    const st = S.setup.number;
    const r = resultEl.getBoundingClientRect();
    const W = r.width - 40, H = r.height - 30;
    const cageH = Math.max(120, Math.min(H * 0.86, W * 0.5 * 150 / 160));
    const cageW = cageH * 160 / 150;
    const D = Math.max(70, Math.min(H * 0.6, W - cageW - 70, 280));
    const text = o ? String(o.v).padStart(st.digits, '0') : '';
    const hue = o ? o.v % 6 : 0;
    resultEl.innerHTML =
      `<div class="num-row"><div class="cage-box" id="cage-box" style="width:${cageW}px;height:${cageH}px">${cageSvg()}` +
      (st.unique ? `<div class="cage-count">${S.pool.number.length} of ${st.max - st.min + 1} drawn</div>` : '') +
      `</div><div class="ball-spot" style="width:${D}px;height:${D}px">${o ? bingoHtml(text, hue, D) : ''}</div></div>`;
    if (!play || !o) return;

    // Turn the cage, tumble the balls, then one rolls out to its spot.
    const cage = $('cage'), anims = [];
    anims.push(cage.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(-720deg)' }],
      { duration: 1300, easing: 'cubic-bezier(0.45, 0, 0.3, 1)' }));
    resultEl.querySelector('.cballs').classList.add('tumbling');
    const ball = $('bingo'), box = $('cage-box').getBoundingClientRect(), b = ball.getBoundingClientRect();
    const sx = box.left + CHUTE[0] / 160 * box.width - (b.left + b.width / 2);
    const sy = box.top + CHUTE[1] / 150 * box.height - (b.top + b.height / 2);
    const k = (box.height * 0.085) / b.height;
    anims.push(ball.animate([
      { transform: `translate(${sx}px, ${sy}px) scale(${k}) rotate(-300deg)`, opacity: 0 },
      { transform: `translate(${sx}px, ${sy}px) scale(${k}) rotate(-300deg)`, opacity: 1, offset: 0.05 },
      { transform: `translate(${sx * 0.35}px, ${sy * 0.2}px) scale(${(k + 1) / 2}) rotate(-90deg)`, offset: 0.6 },
      { transform: 'translate(0, 0) scale(1.03) rotate(8deg)', offset: 0.85 },
      { transform: 'translate(0, 0) scale(1) rotate(0deg)' },
    ], { duration: 800, delay: 1150, easing: 'ease-out', fill: 'both' }));
    hold(1980, () => {
      anims.forEach(a => a.cancel());
      resultEl.querySelector('.cballs')?.classList.remove('tumbling');
    });
  }

  // ── Names: slips of paper from a hat ────────────────────────────────────────
  // A top hat, upside down, full of folded slips. Drawing pulls one out; it
  // rises, unfolds, and the name is there in handwriting.
  function hatSvg(left) {
    // Folded slips standing up in the hat, at odd angles, as they'd sit.
    const spots = [[72, -18, 0], [86, 9, 1], [100, -6, 0], [114, 14, 1], [128, -10, 0], [93, 22, 1], [108, -24, 0]];
    const slips = spots.slice(0, Math.max(0, Math.min(spots.length, left))).map(([x, rot, k], i) =>
      `<g class="hslip" style="animation-delay:${-i * 70}ms"><g transform="rotate(${rot} ${x} 60)">
         <rect x="${x - 9}" y="${44 + k * 3}" width="18" height="17" rx="1.2" fill="#fbf8ee" stroke="#d6cfbb" stroke-width="0.5"/>
         <path d="M${x - 9},${52.5 + k * 3} H${x + 9}" stroke="#d9d2bf" stroke-width="0.7"/>
         <rect x="${x - 9}" y="${44 + k * 3}" width="18" height="8.5" fill="#000" opacity="0.04"/>
       </g></g>`).join('');
    const hand = "'Segoe Print','Bradley Hand','Marker Felt','Comic Sans MS',cursive";
    return `<svg viewBox="0 0 200 190"><defs>
        <linearGradient id="felt" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#08080a"/><stop offset="0.28" stop-color="#2b2b31"/><stop offset="0.38" stop-color="#4a4a52"/>
          <stop offset="0.5" stop-color="#25252a"/><stop offset="0.85" stop-color="#121215"/><stop offset="1" stop-color="#040405"/>
        </linearGradient>
        <linearGradient id="brimTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26262b"/><stop offset="1" stop-color="#0b0b0d"/></linearGradient>
        <linearGradient id="brimFront" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#0a0a0c"/><stop offset="0.35" stop-color="#3a3a42"/><stop offset="0.55" stop-color="#1d1d22"/><stop offset="1" stop-color="#070708"/>
        </linearGradient>
        <radialGradient id="lining" cx="50%" cy="30%" r="75%"><stop offset="0" stop-color="#5a1424"/><stop offset="0.6" stop-color="#2a0710"/><stop offset="1" stop-color="#0c0204"/></radialGradient>
        <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8243a"/><stop offset="0.45" stop-color="#7c1427"/><stop offset="1" stop-color="#4e0b18"/></linearGradient>
        <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e4caa0"/><stop offset="1" stop-color="#c9a877"/></linearGradient>
      </defs>
      <ellipse cx="100" cy="180" rx="66" ry="6" fill="rgba(0,0,0,0.25)"/>
      <!-- Crown, upside down: flaring very slightly to its (now bottom) top. -->
      <path d="M52,58 C53,100 55,140 58,168 Q100,178 142,168 C145,140 147,100 148,58 Z" fill="url(#felt)"/>
      <path d="M78,62 C79,100 80,140 81,170" stroke="rgba(255,255,255,0.07)" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- Satin band and bow, just under the brim. -->
      <path d="M52.4,70 Q100,79 147.6,70 L147.2,86 Q100,95 52.8,86 Z" fill="url(#ribbon)"/>
      <path d="M52.6,72 Q100,81 147.4,72" stroke="rgba(255,255,255,0.18)" stroke-width="0.9" fill="none"/>
      <path d="M60,79 C50,70 44,74 46,80 C44,86 50,90 60,81 Z" fill="url(#ribbon)" stroke="#4e0b18" stroke-width="0.5"/>
      <path d="M60,81 C52,88 50,96 54,99 C57,94 60,88 62,83 Z" fill="#6d1122"/>
      <rect x="57.5" y="76" width="6" height="8" rx="1.5" fill="#8c1a2e" stroke="#4e0b18" stroke-width="0.5"/>
      <!-- Brim: top surface, the opening with its lining, then the front edge over the slips. -->
      <ellipse cx="100" cy="58" rx="94" ry="21" fill="url(#brimTop)"/>
      <ellipse cx="100" cy="56" rx="50" ry="11.5" fill="url(#lining)"/>
      <ellipse cx="100" cy="53" rx="40" ry="6" fill="rgba(255,120,150,0.06)"/>
      <g class="hat-slips">${slips}</g>
      <path d="M6,58 A94,21 0 0 0 194,58 L150,56 A50,11.5 0 0 1 50,56 Z" fill="url(#brimFront)"/>
      <path d="M9,61 A91,19 0 0 0 191,61" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" fill="none"/>
      <path d="M50,56 A50,11.5 0 0 0 150,56" stroke="rgba(255,255,255,0.1)" stroke-width="0.8" fill="none"/>
      <!-- Paper tag on a string, with how many names are left. -->
      <path d="M170,66 C175,80 177,92 176,104" stroke="#cdb57d" stroke-width="1" fill="none"/>
      <g transform="rotate(7 176 118)">
        <path d="M163,108 L170,104 L182,104 L189,108 L189,134 L163,134 Z" fill="url(#kraft)" stroke="#a7875a" stroke-width="0.8" stroke-linejoin="round"/>
        <circle cx="176" cy="107.6" r="1.8" fill="#3a2a1a" stroke="#f4ead2" stroke-width="0.9"/>
        <text x="176" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#3b2a18" font-family="${hand}">${left}</text>
        <text x="176" y="131.5" text-anchor="middle" font-size="4.4" fill="#5a4630" font-family="${hand}">${left === 1 ? 'name' : 'names'}</text>
      </g>
    </svg>`;
  }
  // The opening, in the hat's viewBox (200 × 190).
  const HAT_MOUTH = [100, 54];

  function slipHtml(name) {
    const t = escHtml(name);
    // A slip folded in half: the lower half is a flap folded up over the
    // upper, and unfolds downward to show the whole name.
    return `<div class="slip" id="slip"><div class="half top"><span>${t}</span></div>` +
      `<div class="half bot"><div class="face"><span>${t}</span></div><div class="back"></div></div></div>`;
  }

  function renderList(o, play) {
    const st = S.setup.list;
    if (o && o.type === 'order') {
      resultEl.innerHTML = `<ol class="order fade">${o.list.map((x, i) => `<li><span>${i + 1}</span>${escHtml(x)}</li>`).join('')}</ol>`;
      return;
    }
    if (o && o.type === 'groups') {
      resultEl.innerHTML = `<div class="groups fade">${o.groups.map((g, i) =>
        `<div class="group bw-card"><h4>Group ${i + 1}</h4>${g.map(x => `<div>${escHtml(x)}</div>`).join('')}</div>`).join('')}</div>`;
      return;
    }
    const left = st.remove ? S.pool.list.length : st.items.length;
    const r = resultEl.getBoundingClientRect();
    const W = r.width - 40, H = r.height - 30;
    const hatH = Math.max(130, Math.min(H * 0.86, W * 0.4 * 190 / 200));
    const hatW = hatH * 200 / 190;
    const slipW = Math.max(160, Math.min(W - hatW - 60, 560));
    resultEl.innerHTML =
      `<div class="num-row"><div class="hat-box" id="hat-box" style="width:${hatW}px;height:${hatH}px">${hatSvg(left + (play ? 1 : 0) * (st.remove ? 1 : 0))}</div>` +
      `<div class="slip-spot" style="width:${slipW}px">${o ? slipHtml(o.name) : ''}</div></div>`;
    if (!o) return;
    // The name as large as the slip allows; the slip sized to the name.
    const slip = $('slip'), spans = slip.querySelectorAll('span');
    let fs = Math.min(H * 0.2, 92);
    const measure = () => { spans.forEach(s => { s.style.fontSize = fs + 'px'; }); return spans[0].scrollWidth; };
    for (let i = 0; i < 16 && measure() > slipW - 60 && fs > 16; i++) fs *= 0.9;
    measure();
    slip.style.width = Math.ceil(Math.min(slipW, spans[0].scrollWidth + fs * 2)) + 'px';
    slip.style.height = Math.ceil(fs * 1.9) + 'px';
    if (!play) return;

    const hat = $('hat-box'), hb = hat.getBoundingClientRect(), sb = slip.getBoundingClientRect();
    const scale = hb.width / 200;
    const mx = hb.left + HAT_MOUTH[0] * scale - (sb.left + sb.width / 2);
    const my = hb.top + HAT_MOUTH[1] * scale - (sb.top + sb.height / 2);
    // Folded, the slip is about the size of the ones in the hat.
    const k = (18 * scale * 1.3) / sb.width;
    const flap = slip.querySelector('.bot');
    const anims = [];
    // 1. A hand in the hat: the slips rustle, the hat rocks.
    hat.querySelector('.hat-slips')?.classList.add('rustle');
    anims.push(hat.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-2.5deg)' }, { transform: 'rotate(2deg)' }, { transform: 'rotate(-1deg)' }, { transform: 'rotate(0)' }],
      { duration: 700, easing: 'ease-in-out' }));
    // 2. One slip is pulled up out of the opening (revealed from the top as
    //    it clears the brim), 3. carried over, 4. unfolded.
    const hh = sb.height * k / 2;
    anims.push(slip.animate([
      { transform: `translate(${mx}px, ${my + hh * 0.2}px) scale(${k}) rotate(-8deg)`, clipPath: 'inset(0 0 100% 0)', offset: 0 },
      { transform: `translate(${mx}px, ${my + hh * 0.2}px) scale(${k}) rotate(-8deg)`, clipPath: 'inset(0 0 100% 0)', offset: 0.28 },
      { transform: `translate(${mx}px, ${my - hh * 1.6}px) scale(${k * 1.05}) rotate(4deg)`, clipPath: 'inset(0 0 50% 0)', offset: 0.46 },
      { transform: `translate(${mx}px, ${my - hh * 2.4}px) scale(${k * 1.15}) rotate(-3deg)`, clipPath: 'inset(0 0 0 0)', offset: 0.52 },
      { transform: `translate(${mx * 0.45}px, ${my * 0.4 - hb.height * 0.3}px) scale(${(k + 1) / 2}) rotate(6deg)`, clipPath: 'inset(0 0 0 0)', offset: 0.75 },
      { transform: 'translate(0, 0) scale(1) rotate(-1.5deg)', clipPath: 'inset(0 0 0 0)', offset: 1 },
    ], { duration: 2000, easing: 'cubic-bezier(0.35, 0.1, 0.3, 1)', fill: 'both' }));
    anims.push(flap.animate([
      { transform: 'rotateX(178deg)' },
      { transform: 'rotateX(178deg)', offset: 0.55 },
      { transform: 'rotateX(-12deg)', offset: 0.88 },
      { transform: 'rotateX(0deg)' },
    ], { duration: 2000 + 700, easing: 'ease-out', fill: 'both' }));
    hold(2730, () => {
      anims.forEach(a => a.cancel());
      hat.querySelector('.hat-slips')?.classList.remove('rustle');
      // The hat now has one fewer slip in it.
      if (st.remove) hat.innerHTML = hatSvg(left);
    });
  }

  // ── Animation ───────────────────────────────────────────────────────────────
  // Purely cosmetic: the outcome is already decided and in S, so cutting an
  // animation short (a second press, a mode switch) just shows it sooner.
  let anim = null;
  function finishAnim(silent) {
    if (!anim) return;
    const a = anim; anim = null;
    clearTimeout(a.timer);
    if (silent && a.kind === 'spin') {
      const w = $('wheel');
      if (w) { w.classList.remove('spinning'); }
    }
    a.done && a.done();
  }

  // ── Socket.IO sync ──────────────────────────────────────────────────────────
  let socket = null, syncTimer = null;

  function initSocket(url) {
    if (typeof io === 'undefined') { socket = { emit() {}, on() {} }; return; }
    try {
      const prev = socket;
      socket = io(url || (window.BeamerWidget ? BeamerWidget.serverOrigin() : ''),
                  { transports: ['websocket', 'polling'] });
      if (prev && prev.disconnect) prev.disconnect();
      socket.on('widget_state', data => {
        if (!IS_VIEWER || data?.widgetId !== WIDGET_ID) return;
        applyState(data.state || {}, true);
      });
    } catch (_) {
      socket = { emit() {}, on() {} };
    }
  }

  // `now`: an outcome the room is waiting on goes straight out; setup typing
  // is debounced.
  function emitState(now) {
    if (!socket || IS_VIEWER) return;
    clearTimeout(syncTimer);
    const send = () => socket.emit('widget_state', { widgetId: WIDGET_ID, state: getState() });
    if (now) send(); else syncTimer = setTimeout(send, 200);
  }

  // ── State serialisation ─────────────────────────────────────────────────────
  function getState() {
    return JSON.parse(JSON.stringify({
      v: 2, mode: S.mode, runs: S.runs, setup: S.setup, pool: S.pool,
      last: S.last, stats: S.stats, hist: S.hist, rng: S.rng, rollId: S.rollId, spin: S.spin, shuffleId: S.shuffleId || 0,
    }));
  }

  function applyState(s, live) {
    if (!s || typeof s !== 'object') return;
    const prevRoll = S.rollId;
    // The settings own the setup. Only a live viewer takes the presenter's,
    // in case its own copy of the settings is behind.
    if (live) {
      if (MODES.includes(s.mode)) S.mode = s.mode;
      if (s.setup && typeof s.setup === 'object') {
        for (const k of MODES) if (s.setup[k] && typeof s.setup[k] === 'object') S.setup[k] = { ...S.setup[k], ...s.setup[k] };
      }
    }
    if ([1, 10, 100, 1000].includes(s.runs)) S.runs = s.runs;
    if (s.pool && typeof s.pool === 'object') S.pool = { ...S.pool, ...s.pool };
    if (s.last && typeof s.last === 'object') S.last = s.last;
    if (s.hist && typeof s.hist === 'object') S.hist = { dice: Array.isArray(s.hist.dice) ? s.hist.dice : [], coin: Array.isArray(s.hist.coin) ? s.hist.coin : [], bag: Array.isArray(s.hist.bag) ? s.hist.bag : [] };
    if (s.stats && typeof s.stats === 'object') S.stats = s.stats;
    if (typeof s.rng === 'number') S.rng = s.rng >>> 0;
    if (typeof s.spin === 'number') S.spin = s.spin;
    if (typeof s.rollId === 'number') S.rollId = s.rollId;
    if (typeof s.shuffleId === 'number') { if (live && s.shuffleId !== (S.shuffleId || 0) && S.mode === 'cards') pendingShuffle = true; S.shuffleId = s.shuffleId; }
    ensurePools();
    // A viewer animates a fresh outcome the way the presenter's screen did;
    // a restored slide just shows where it was.
    render(!!live && S.rollId !== prevRoll);
  }

  // ── Config ──────────────────────────────────────────────────────────────────
  let lastSeed = null;
  function applyConfig(c) {
    if (!c) return;
    const prevUrl = cfg.socketUrl;
    cfg = { ...cfg, ...c };
    WIDGET_ID = cfg.id || cfg.widgetId || WIDGET_ID;
    IS_VIEWER = cfg.role === 'viewer' || IS_VIEWER;
    const nextMode = MODES.includes(cfg.mode) ? cfg.mode : 'dice';
    if (nextMode !== S.mode) finishAnim(true);
    S.mode = nextMode;
    adoptSetup(setupFromConfig(cfg));
    // Only a changed seed re-seeds, so re-sent config doesn't restart a demo.
    const seed = String(cfg.seed || '');
    if (seed !== lastSeed) {
      if (lastSeed !== null || !S.rollId) S.rng = freshSeed();
      lastSeed = seed;
    }
    if (cfg.socketUrl && cfg.socketUrl !== prevUrl) initSocket(cfg.socketUrl);
    render();
    if (!IS_VIEWER && lastSeed !== null) emitState();
  }

  function destroy() {
    finishAnim(true);
    if (D3) { cancelAnimationFrame(D3.raf); try { D3.renderer.dispose(); } catch (_) { /* already gone */ } D3 = null; }
    clearTimeout(syncTimer);
    clearTimeout(resizeTimer);
    if (ro) ro.disconnect();
    if (socket && socket.disconnect) socket.disconnect();
    socket = null;
  }

  // ── Beamer+ message bridge ──────────────────────────────────────────────────
  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === 'widget-config')  applyConfig(d.config);
    if (d.type === 'widget-cleanup') destroy();
    if (d.type === 'widget-get-state') {
      window.parent.postMessage({ type: 'widget-state', widgetId: WIDGET_ID, state: getState() }, '*');
    }
    if (d.type === 'widget-set-state' && d.state) applyState(d.state, false);
  });

  // ── Event wiring ────────────────────────────────────────────────────────────
  resultEl.addEventListener('click', e => {
    if (IS_VIEWER) return;
    // The list views are for reading, not another pick.
    if (e.target.closest('.order, .groups') || isExhausted()) return;
    go();
  });
  deckBtn.addEventListener('click', shuffleDeck);
  shuffleBtn.addEventListener('click', shuffleList);
  groupsBtn.addEventListener('click', makeGroups);


  // Space / Enter goes, S toggles stats — from anywhere except a field.
  document.addEventListener('keydown', e => {
    if (IS_VIEWER || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!isExhausted()) go(); }
  });

  // Re-fit dice / wheel / numbers to the region, without replaying anything.
  let resizeTimer = null, ro = null;
  try {
    ro = new ResizeObserver(() => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (!anim) { wheelBuiltFor = ''; renderResult(false); } }, 60);
    });
    ro.observe(resultEl);
  } catch (_) { /* very old engines: fixed sizes are fine */ }

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Boot ────────────────────────────────────────────────────────────────────
  S.rng = freshSeed();
  initSocket(CFG0.socketUrl);
  applyConfig(CFG0);
  render();

  // The shared bar's reset means clear the results, not reload the widget.
  (function wireReset(tries) {
    if (window.BeamerWidget && BeamerWidget.topbar) { BeamerWidget.topbar.onReset(reset); return; }
    if (tries > 0) setTimeout(() => wireReset(tries - 1), 120);
  })(20);
})();
</script>
</body>
</html>
