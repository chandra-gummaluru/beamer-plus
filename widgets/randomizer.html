    const crown = [[0.0, 0.02], [1.02, 0.02], [1.08, 0.08], [1.07, 0.7], [1.04, 1.5], [1.01, 2.3], [1.0, HAT.brimY]].map(([x, y]) => new T.Vector2(x, y));
    mesh(new T.LatheGeometry(crown, 96), felt);
    mesh(new T.LatheGeometry(crown.slice(1).map(v => new T.Vector2(v.x * 0.965, Math.max(0.3, v.y))), 96), lining);
    const floor = mesh(new T.CircleGeometry(0.98, 64), new T.MeshStandardMaterial({ color: 0x4d0c18, roughness: 0.5 }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = 0.3;
    // Brim: a curled ring.
    const brim = [[0.99, 2.38], [1.4, 2.36], [1.66, 2.42], [1.8, 2.55], [1.83, 2.62], [1.78, 2.6], [1.64, 2.49], [1.4, 2.45], [0.99, 2.47], [0.99, 2.38]].map(([x, y]) => new T.Vector2(x, y));
    mesh(new T.LatheGeometry(brim, 128), felt);
    // Satin band next to the brim, and a bow.
    mesh(new T.CylinderGeometry(1.012, 1.02, 0.34, 96, 1, true), satin).position.y = 2.12;
    const bow = new T.Group();
    [-1, 1].forEach(s => {
      const loop = new T.Mesh(new T.SphereGeometry(1, 24, 16), satin);
      loop.scale.set(0.24, 0.13, 0.06); loop.position.set(s * 0.2, 0, 0); loop.rotation.z = s * 0.25; loop.castShadow = true;

    const target = group.userData.sides === 4 ? new T.Vector3(0, 0.62, 0.78).normalize() : new T.Vector3(0, 1, 0);
    const q1 = new T.Quaternion().setFromUnitVectors(f.n, target);
    const up = f.up.clone().applyQuaternion(q1);
    const want = group.userData.sides === 4 ? new T.Vector3(0, 0.78, -0.62).normalize() : new T.Vector3(0, 0, -1);
    const ang = Math.atan2(new T.Vector3().crossVectors(up, want).dot(target), up.dot(want)) + twist;
    return new T.Quaternion().setFromAxisAngle(target, ang).multiply(q1);
  }
  // Height that puts the die's lowest point on the table.
  function restY(group, q) {
    const T = T3, faces = group.userData.faces;
    let min = Infinity;
    if (group.userData.sides === 6) {
      [-1, 1].forEach(x => [-1, 1].forEach(y => [-1, 1].forEach(z => {
        min = Math.min(min, new T.Vector3(x * 0.82, y * 0.82, z * 0.82).applyQuaternion(q).y);
      })));
    } else faces.forEach(f => f.pts.forEach(p => { min = Math.min(min, p.clone().applyQuaternion(q).y); }));
    return -min;
  }

  // ── Scene ───────────────────────────────────────────────────────────────────
  let D3 = null;   // { renderer, scene, camera, dice: [group], sig, raf }
  function ensureScene() {
    if (D3) return D3;
    const T = T3;
    const renderer = getRenderer();
    const scene = new T.Scene();
    if (R3.env) { scene.environment = R3.env; scene.environmentIntensity = 0.35; }
    scene.add(new T.HemisphereLight(0xffffff, 0x8a8a90, 1.25));
    const key = new T.DirectionalLight(0xffffff, 2.4);
    key.position.set(-4, 10, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = -12; key.shadow.camera.right = 12; key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
    key.shadow.radius = 6;
    scene.add(key);
    const fill = new T.DirectionalLight(0xbfd0ff, 0.6);
    fill.position.set(6, 4, -3);
    scene.add(fill);
    const ground = new T.Mesh(new T.PlaneGeometry(60, 40), new T.ShadowMaterial({ opacity: 0.22 }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    const camera = new T.PerspectiveCamera(28, 1, 0.1, 100);
    D3 = { renderer, scene, camera, dice: [], sig: '', raf: 0, slots: [] };
    return D3;
  }
  function layoutScene(sides, w, h) {
    const T = T3, d = ensureScene();
    d.renderer.setSize(w, h, false);
    d.renderer.domElement.style.width = w + 'px';
    d.renderer.domElement.style.height = h + 'px';
    const sig = sides.join(',');
    if (sig !== d.sig) {
      d.dice.forEach(g => d.scene.remove(g));
      d.dice = sides.map(buildDie);
      d.dice.forEach(g => d.scene.add(g));
      d.sig = sig;
    }
    // Side by side on the table, the camera pulled back to fit them all.
    const gap = 2.7, n = sides.length;
    d.slots = sides.map((_, i) => new T.Vector3((i - (n - 1) / 2) * gap, 0, 0));
    d.camera.aspect = w / h;
    const halfW = (n * gap) / 2 + 0.3, halfH = 1.75;
    const vf = T.MathUtils.degToRad(d.camera.fov) / 2, hf = Math.atan(Math.tan(vf) * d.camera.aspect);
    const dist = Math.max(halfW / Math.tan(hf), halfH / Math.tan(vf)) * 1.08;
    // Nearly straight down, as you'd look at dice on a table to read them:
    // the face that came up is the one facing the room.
    d.camera.position.set(0, dist * 0.96, dist * 0.28);
    d.camera.lookAt(0, 0.2, 0);
    d.camera.updateProjectionMatrix();
    return d;
  }
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  function renderDice3D(o, play, sides, faces, w, h) {
    const T = T3, d = layoutScene(sides, w, h);
    cancelAnimationFrame(d.raf);
    // Twist each die a little off square, the same way every time for a roll.
    const twistOf = i => ((S.rollId * 7 + i * 13) % 9 - 4) * 0.05;
    const rest = d.dice.map((g, i) => {
      const q = faces[i] ? restQuat(g, faces[i], twistOf(i)) : restQuat(g, g.userData.faces[(i * 3) % g.userData.faces.length].value, 0.3);
      return { q, y: restY(g, q), x: d.slots[i].x };
    });
    const draw = () => d.renderer.render(d.scene, d.camera);
    if (!play) {
      d.dice.forEach((g, i) => { g.quaternion.copy(rest[i].q); g.position.set(rest[i].x, rest[i].y, 0); });
      draw();
      return 0;
    }
    // The throw: in from the left and above, tumbling about a random axis,
    // bouncing, then settling onto the rolled face.
    const DUR = 1500, start = performance.now();
    const plan = d.dice.map((g, i) => {
      const axis = new T.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
      return { axis, spin: 14 + Math.random() * 6, q0: new T.Quaternion().setFromEuler(new T.Euler(Math.random() * 6, Math.random() * 6, Math.random() * 6)),
               x0: rest[i].x - 3.2 - Math.random(), z0: -1.2 + Math.random() * 0.6, delay: i * 90 };
    });
    const tumble = new T.Quaternion(), from = new T.Quaternion();
    const frame = now => {
      let busy = false;
      d.dice.forEach((g, i) => {
        const p = plan[i], R = rest[i];
        const t = Math.max(0, Math.min(1, (now - start - p.delay) / DUR));
        if (t < 1) busy = true;
        const SETTLE = 0.62;
        // Rotation: free tumble, then ease onto the rest orientation.
        const tt = Math.min(t, SETTLE) / SETTLE;
        tumble.setFromAxisAngle(p.axis, p.spin * (1 - Math.pow(1 - tt, 2)));
        from.copy(p.q0).premultiply(tumble);
        if (t <= SETTLE) g.quaternion.copy(from);
        else g.quaternion.copy(from).slerp(R.q, easeOut((t - SETTLE) / (1 - SETTLE)));
        // Position: slide in, bouncing lower each time.
        const e = easeOut(t);
        const bounce = Math.abs(Math.cos(t * Math.PI * 2.6)) * 2.4 * Math.pow(1 - t, 2.2);
        g.position.set(p.x0 + (R.x - p.x0) * e, R.y + bounce + (1 - e) * 0.6, p.z0 * (1 - e));
      });
      draw();
      if (busy) d.raf = requestAnimationFrame(frame);
    };
    d.raf = requestAnimationFrame(frame);
    return DUR + (d.dice.length - 1) * 90;
  }

  function settleDice3D(faces) {
    if (!D3) return;
    cancelAnimationFrame(D3.raf);
    D3.dice.forEach((g, i) => {
      const q = restQuat(g, faces[i] || 1, ((S.rollId * 7 + i * 13) % 9 - 4) * 0.05);
      g.quaternion.copy(q); g.position.set(D3.slots[i].x, restY(g, q), 0);
    });
    D3.renderer.render(D3.scene, D3.camera);
  }

  function renderDice(o, play) {
    const sides = S.setup.dice.sides;
    // Outcomes from an older set of dice (the settings changed since) are

    const n = sides.length, anyCube = sides.includes(6);

    if (!T3 && !t3Failed) {

    const col = dieColor(6);

    resultEl.style.setProperty('--d-pip-hi', col.pipHi);

    resultEl.innerHTML =
      `<div class="play-row"><div class="play" style="width:${sp.playW}px"><div class="items${fresh ? '' : ' ghost'}">${faces.map((f, i) => (sides[i] === 6 ? cubeHtml(i) : polyHtml(i, f, sides[i]))).join('')}</div></div>` +
      historyBoardHtml('dice', S.hist.dice, sp.bw, sp.bh) + '</div>';

      cube.style.transform = cubeTransform(t);

      t.x += jiggle(2, 3); t.y += jiggle(1, 2); t.z += jiggle(0, 1); t.f = faces[i];

  // ── Coins ───────────────────────────────────────────────────────────────────
  const METALS = {

    silver: { hi: '#ffffff', mid: '#c3c7cf', lo: '#6c717b', ink: '#5b606a' },

      `<g fill="${m.hi}" opacity="0.9" transform="translate(-0.5 -0.6)">${shape}</g>` +
      `<g fill="url(#${id}e)">${shape}</g>`;

      <radialGradient id="${id}f" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="${m.hi}"/><stop offset="0.55" stop-color="${m.mid}"/><stop offset="1" stop-color="${m.lo}"/></radialGradient>

    <circle cx="50" cy="50" r="38" fill="none" stroke="${m.lo}" stroke-opacity="0.5" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="0.1 2.35"/>
    ${emboss(`<text font-family="Georgia, 'Times New Roman', serif" font-size="7.2" font-weight="700" letter-spacing="2.4"><textPath href="#${id}a" startOffset="50%" text-anchor="middle">${word}</textPath></text>`)}

  const coinTurns = [];

  function renderCoins(o, play) {
    const st = S.setup.coin, n = o ? o.faces.length : 1;
    const sp = boardSplit();

        `<div class="coin3d" data-i="${i}"><div class="ground"></div><div class="coin"><div class="cface heads">${coinFace(true)}</div><div class="cedge"></div><div class="cface tails">${coinFace(false)}</div></div></div>`).join('')}</div>`;

  // ── Jar of balls ────────────────────────────────────────────────────────────
  function jarSvg(dots) {
    // Pack the balls into the bottom of the jar in staggered rows, largest
    // size that still fits them all.
    const W = 74, H = 74, x0 = 13, yBottom = 119;
    let r = 9;
    for (; r > 1.6; r -= 0.25) {
      const cols = Math.floor(W / (2 * r)), rows = Math.ceil(dots.length / Math.max(1, cols));
      if (cols >= 1 && 2 * r + (rows - 1) * r * 1.74 <= H) break;
    }
    const cols = Math.max(1, Math.floor(W / (2 * r)));

      const row = Math.floor(i / cols), col = i % cols;
      const off = row % 2 ? r : 0;

      const y = yBottom - r - row * r * 1.74;
      balls += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${(r * 0.97).toFixed(2)}" fill="url(#jb${c})"/>`;
    });

      const base = getComputedStyle(document.documentElement).getPropertyValue(`--hue-${h}`).trim() || '#888888';

    }).join('');
    return `<svg viewBox="0 0 100 130"><defs>${grads}
        <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7adb6"/><stop offset="0.5" stop-color="#7b818b"/><stop offset="1" stop-color="#555a62"/></linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(160,190,220,0.22)"/><stop offset="0.5" stop-color="rgba(160,190,220,0.06)"/><stop offset="1" stop-color="rgba(160,190,220,0.18)"/></linearGradient>
        <clipPath id="jarclip"><path d="M30,20 L30,24 C12,28 9,38 9,50 L9,112 Q9,123 20,123 L80,123 Q91,123 91,112 L91,50 C91,38 88,28 70,24 L70,20 Z"/></clipPath>
      </defs>
      <ellipse cx="50" cy="126" rx="40" ry="3.2" fill="rgba(0,0,0,0.22)"/>
      <path d="M30,20 L30,24 C12,28 9,38 9,50 L9,112 Q9,123 20,123 L80,123 Q91,123 91,112 L91,50 C91,38 88,28 70,24 L70,20 Z" fill="url(#glass)"/>

      <path d="M16,54 L16,104" stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round"/>
      <path d="M21,46 Q22,38 30,33" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M84,62 L84,96" stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>

  }

  // A drawn ball's name: its row in the settings, else its colour.
  function ballName(o, i) {
    const j = o.idx ? o.idx[i] : -1, b = S.setup.bag.balls[j];
    return b && b.c === o.balls[i] ? b.label : HUE_NAMES[o.balls[i]];
  }

  // An opaque cloth bag: you know how many are in it, not which.
  // `front`: only the parts in front of the opening (the near lip and
  // everything below it), drawn over a ball coming out so it rises out of
  // the hole rather than from behind the bag.
  function sackSvg(left, front) {

        `<g clip-path="url(#nearSide)">${body.replace(/<ellipse cx="50" cy="21.5" rx="15" ry="4.2" fill="#130c24"/, '<ellipse cx="50" cy="21.5" rx="15" ry="4.2" fill="none"')}</g>${bagTag(left)}</svg>`;

  }
  const SACK_DEFS = `<linearGradient id="sack" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2d2150"/><stop offset="0.42" stop-color="#5b44a0"/><stop offset="0.6" stop-color="#4a3689"/><stop offset="1" stop-color="#221838"/></linearGradient>
        <radialGradient id="sackHi" cx="38%" cy="45%" r="55%"><stop offset="0" stop-color="#fff" stop-opacity="0.18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <linearGradient id="rope" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0dca6"/><stop offset="1" stop-color="#b8975a"/></linearGradient>`;
  function sackBody() {
    return `
      <ellipse cx="50" cy="125" rx="38" ry="3.5" fill="rgba(0,0,0,0.25)"/>
      <path d="M33,38 C12,52 6,84 12,106 Q18,124 50,124 Q82,124 88,106 C94,84 88,52 67,38 Z" fill="url(#sack)"/>
      <path d="M33,38 C12,52 6,84 12,106 Q18,124 50,124 Q82,124 88,106 C94,84 88,52 67,38 Z" fill="url(#sackHi)"/>
      <path d="M38,44 C30,62 28,88 32,112 M50,44 C49,70 49,96 50,120 M62,44 C70,62 72,88 68,112" stroke="rgba(0,0,0,0.22)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path d="M41,46 C35,64 34,86 37,104" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M33,39 L36,22 L64,22 L67,39 Z" fill="url(#sack)"/>
      <path d="M38,24 L39,38 M44,23 L44.5,38 M50,23 L50,38 M56,23 L55.5,38 M62,24 L61,38" stroke="rgba(0,0,0,0.25)" stroke-width="0.9"/>
      <ellipse cx="50" cy="21.5" rx="15" ry="4.2" fill="#130c24" stroke="#6d55b8" stroke-width="1.2"/>
      <path d="M32,36 Q50,41 68,36" stroke="url(#rope)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M62,37.5 C66,44 70,50 67,58 M63,38 C60,46 61,52 58,58" stroke="url(#rope)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <circle cx="62.5" cy="37.8" r="2.4" fill="url(#rope)"/>
      <circle cx="67" cy="58.5" r="1.6" fill="#b8975a"/><circle cx="58" cy="58.5" r="1.6" fill="#b8975a"/>`;
  }

  // Where a ball leaves the container, in viewBox units (100 × 130): the
  // jar's neck or the bag's mouth, and where it starts from inside.
  const MOUTH = { jar: { from: [50, 96], out: [50, 6] }, bag: { from: [50, 31], out: [50, 2] } };

  // A hand-written sticky note taped to the container: how many are inside.
  function stickyHtml(left) {
    return `<div class="sticky"><span class="tape"></span><b>${left}</b><i>${left === 1 ? 'ball' : 'balls'}</i></div>`;
  }

  // Fly a copy of a ball between two points in #result coordinates, along a
  // list of [x, y, scale, opacity] waypoints. Resolves when it lands.
  // `behindUntil` / `behindFrom`: the waypoint at which the ball comes out
  // from behind the container, or goes back behind it — so it rises from
  // inside, behind the glass and the label, rather than in front of them.
  function flyBall(c, size, path, { duration = 1000, delay = 0, behindUntil = -1, behindFrom = Infinity, offsets = null, behindZ = 2 } = {}) {
    const fly = document.createElement('span');
    fly.className = 'ball flying';
    fly.style.cssText = `--c:var(--hue-${c});--sz:${size}px;left:0;top:0;`;
    resultEl.appendChild(fly);
    const kf = [];
    path.forEach(([x, y, s, op], i) => {
      const k = { transform: `translate(${x - size / 2}px, ${y - size / 2}px) scale(${s})`, opacity: op == null ? 1 : op, offset: offsets ? offsets[i] : i / (path.length - 1) };
      const behind = i < behindUntil || i > behindFrom;
      if (i === behindUntil) kf.push({ ...k, zIndex: behindZ });
      kf.push({ ...k, zIndex: behind ? behindZ : 9 });
      if (i === behindFrom) kf.push({ ...k, zIndex: behindZ });
    });
    const a = fly.animate(kf, { duration, delay, easing: 'ease-in-out', fill: 'both' });
    a.onfinish = () => fly.remove();
    return { a, fly };
  }

  // A kraft-paper tag on a bit of twine, tied to the bag's drawstring.
  function bagTag(left) {
    return `<g class="bag-tag">
      <path d="M62.5,38.5 C66,46 69,50 71,57.5" stroke="#cdb57d" stroke-width="0.9" fill="none"/>
      <g transform="rotate(-9 71 70)">
        <path d="M60,60 L66,56.5 L76,56.5 L82,60 L82,84 L60,84 Z" fill="#d9bd8c" stroke="#a7875a" stroke-width="0.7" stroke-linejoin="round"/>
        <path d="M60,60 L66,56.5 L76,56.5 L82,60 L82,64 L60,64 Z" fill="#000" opacity="0.06"/>
        <circle cx="71" cy="59.6" r="1.5" fill="#3a2a1a" stroke="#f4ead2" stroke-width="0.8"/>
        <text x="71" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#3b2a18" font-family="'Segoe Print','Bradley Hand','Marker Felt','Comic Sans MS',cursive">${left}</text>
        <text x="71" y="81.6" text-anchor="middle" font-size="4" fill="#5a4630" font-family="'Segoe Print','Bradley Hand','Marker Felt','Comic Sans MS',cursive">${left === 1 ? 'ball' : 'balls'}</text>
      </g></g>`;
  }

  function renderBag(o, play) {
    const st = S.setup.bag, look = st.look === 'bag' ? 'bag' : 'jar';
    const pool = S.pool.bag;
    const drawnNow = o && !o.empty ? o.balls.length : 0;
    // While a draw is animating, the container still shows the balls about
    // to come out of it.
    const shown = pool.slice();
    if (play && !st.replace && o && o.idx) o.idx.forEach(j => { shown[j] = (shown[j] || 0) + 1; });
    const left = shown.reduce((s, x) => s + x, 0);
    // Shuffle the colours into the jar deterministically, so the same jar
    // looks the same on every screen and doesn't reshuffle on a resize.
    const dots = [];
    shown.forEach((n, j) => { for (let i = 0; i < n && dots.length < 200; i++) dots.push(st.balls[j].c); });
    dots.forEach((_, i) => { const j = (i * 7919 + 13) % dots.length; [dots[i], dots[j]] = [dots[j], dots[i]]; });

    const r = resultEl.getBoundingClientRect();
    const jar = Math.max(90, Math.min(r.height * 0.8, r.width * 0.36 / 0.77, 400));
    const sideW = Math.max(160, r.width - jar * 0.77 - jar * 0.5 - 70);
    resultEl.style.setProperty('--jar', jar + 'px');
    const sz = Math.max(26, Math.min(jar * 0.26, 100));
    resultEl.style.setProperty('--sz', sz + 'px');
    const bw = Math.round(Math.min(sideW, jar * 1.45)), bh = Math.round(Math.min(jar * 0.85, bw * 0.72));
    const svg = look === 'bag' ? sackSvg(left) + `<div class="bag-front">${sackSvg(left, true)}</div>` : jarSvg(dots);
    resultEl.innerHTML =
      `<div class="bag-row" style="gap:${Math.round(jar * 0.45)}px"><div class="jar${look === 'bag' ? ' sack' : ''}" id="container">${svg}${look === 'jar' ? stickyHtml(left) : ''}</div>` +
      `<div class="bag-side">${boardHtml(S.hist.bag || [], bw, bh, !st.replace)}</div></div>`;
    if (!play || !drawnNow) return;

    const host = resultEl.getBoundingClientRect(), box = $('container').getBoundingClientRect();
    const at = ([x, y]) => [box.left - host.left + x / 100 * box.width, box.top - host.top + y / 130 * box.height];
    const [fx, fy] = at(MOUTH[look].from), [ox, oy] = at(MOUTH[look].out);
    const board = resultEl.querySelector('.board').getBoundingClientRect();
    // Where a ball is held up for the room to see: between the container
    // and the board, a little above the middle.
    const hx = (box.right + board.left) / 2 - host.left, hy = box.top - host.top + box.height * 0.32;
    const sketches = [...resultEl.querySelectorAll('.board .sketch')];
    const fresh = sketches.slice(Math.max(0, sketches.length - drawnNow));
    fresh.forEach(hideSketch);
    const flights = [], extra = [];
    const small = Math.max(0.25, Math.min(0.6, jar * 0.12 / sz));
    const EACH = 2300, OUT = 0.3, SHOW = 0.66;
    o.balls.forEach((c, i) => {
      const delay = i * 1400;
      const peak = Math.max(sz * 0.6, Math.min(oy, hy) - sz * 0.8);
      let path, offsets, opts;
      if (st.replace) {
        // Out, held up, and back in.
        path = [[fx, fy, small], [ox, oy - sz * 0.1, small * 1.2], [(ox + hx) / 2, peak, 0.8], [hx, hy, 1], [hx, hy, 1], [(ox + hx) / 2, peak, 0.8], [ox, oy, small * 1.2], [fx, fy, small]];
        offsets = [0, 0.12, 0.22, OUT, SHOW, 0.78, 0.9, 1];
        opts = { behindUntil: 1, behindFrom: 6, behindZ: look === 'bag' ? 3 : 2 };
      } else {
        // Out, held up, then tossed away: off and down, spinning out of play.
        const tx = hx + sz * 2.2, ty = host.height + sz;
        path = [[fx, fy, small], [ox, oy - sz * 0.1, small * 1.2], [(ox + hx) / 2, peak, 0.8], [hx, hy, 1], [hx, hy, 1], [hx + sz * 1.2, hy - sz * 0.7, 0.95], [tx, ty, 0.9]];
        offsets = [0, 0.12, 0.22, OUT, SHOW, 0.76, 1];
        opts = { behindUntil: 1, behindZ: look === 'bag' ? 3 : 2 };
      }
      flights.push(flyBall(c, sz, path, { duration: EACH, delay, offsets, ...opts }));
      if (fresh[i]) { const d = drawSketch(fresh[i], delay + EACH * OUT + 80); extra.push(...d.anims); }
    });
    hold((o.balls.length - 1) * 1400 + EACH + 40, () => {
      flights.forEach(f => { f.a.cancel(); f.fly.remove(); });
      extra.forEach(a => a.cancel());
      fresh.forEach(settleNewest);
      // Without replacement the container is now one ball lighter.
      if (!st.replace) renderBag(o, false);
    });
  }

  // ── Cards ───────────────────────────────────────────────────────────────────
  const CARD_PIPS = {
    2: [[50, 0], [50, 100]], 3: [[50, 0], [50, 50], [50, 100]],
    4: [[0, 0], [100, 0], [0, 100], [100, 100]],
    5: [[0, 0], [100, 0], [50, 50], [0, 100], [100, 100]],
    6: [[0, 0], [100, 0], [0, 50], [100, 50], [0, 100], [100, 100]],
    7: [[0, 0], [100, 0], [50, 25], [0, 50], [100, 50], [0, 100], [100, 100]],
    8: [[0, 0], [100, 0], [50, 25], [0, 50], [100, 50], [50, 75], [0, 100], [100, 100]],
    9: [[0, 0], [100, 0], [0, 33.3], [100, 33.3], [50, 50], [0, 66.7], [100, 66.7], [0, 100], [100, 100]],
    10: [[0, 0], [100, 0], [50, 16.7], [0, 33.3], [100, 33.3], [0, 66.7], [100, 66.7], [50, 83.3], [0, 100], [100, 100]],
  };
  function cardFace(id) {
    const ri = id % 13, r = RANKS[ri], s = SUITS[Math.floor(id / 13)], red = s === '♥' || s === '♦';
    let mid;
    if (ri === 0) mid = `<div class="ace">${s}</div>`;
    else if (ri >= 10) mid = `<div class="court" data-s="${s}">${r}</div>`;
    else mid = `<div class="pips">${CARD_PIPS[ri + 1].map(([x, y]) =>
      `<span${y > 50 ? ' class="dn"' : ''} style="left:${x}%;top:${y}%">${s}</span>`).join('')}</div>`;
    const b = `<b${ri === 9 ? ' class="ten"' : ''}>${r}</b>`;
    return `<div class="pcard${red ? ' red' : ''}"><div class="ci tl">${b}<i>${s}</i></div>${mid}<div class="ci br">${b}<i>${s}</i></div></div>`;
  }

  function renderCards(o, play) {
    const st = S.setup.cards;
    const deck = S.pool.cards, drawn = S.pool.hand;
    const shuffling = pendingShuffle; pendingShuffle = false;
    const rr = resultEl.getBoundingClientRect();
    const W = rr.width - 50, H = rr.height - 30;
    const sz = Math.max(50, Math.min(260, H * 0.72, W / (0.714 * 3.6 + 0.5)));
    resultEl.style.setProperty('--sz', sz + 'px');
    const cw = sz * 0.714;

    // Every card drawn so far stays face up beside the deck. The places are
    // worked out once, for the whole deck, from the size of the widget alone
    // — so a new card is only ever added, and nothing already down moves,
    // not even when a new row starts. Cards overlap enough to fit 52, each
    // still showing its corner.
    const areaW = Math.max(cw, W - cw - sz * 0.5), areaH = H * 0.86;
    // Four rows of thirteen, like a hand of patience laid out: each row
    // overlaps the one above it, leaving its corners showing, so the cards
    // can be big and there's still room for the whole deck.
    const n = drawn.length, perRow = 13, rows = 4;
    const hs = Math.max(40, Math.min(sz, areaH / (1 + (rows - 1) * 0.36), areaW / (0.714 * (1 + (perRow - 1) * 0.3))));
    const hw = hs * 0.714;
    const stepX = Math.min(hw * 1.08, (areaW - hw) / (perRow - 1));
    const stepY = Math.min(hs * 1.05, (areaH - hs) / (rows - 1));
    const gridW = hw + stepX * (perRow - 1), gridH = hs + stepY * (rows - 1);
    const drawnHtml = drawn.map((id, i) =>
      `<div class="slot-card drawn-card" style="left:${((i % perRow) * stepX).toFixed(1)}px;top:${(Math.floor(i / perRow) * stepY).toFixed(1)}px;z-index:${i + 1}"><div class="flip">${cardFace(id)}<div class="pcard back"></div></div></div>`).join('');

    // The deck's thickness shows how much is left: one layer of card edge
    // for every few cards, and a quiet count underneath.
    const layers = deck.length ? Math.max(1, Math.ceil(deck.length / 4)) : 0;
    const pile = Array.from({ length: layers }, (_, i) =>
      `<div class="pcard ${i === layers - 1 ? 'back' : 'edge'}" style="transform:translate(${(-i * 0.55).toFixed(2)}px, ${(-i * 0.7).toFixed(2)}px)"></div>`).join('');
    const deckHtml = (deck.length ? pile : `<div class="deck-empty"></div>`) +
      `<div class="deck-note"><b>${deck.length}</b> ${deck.length === 1 ? 'card' : 'cards'}</div>`;
    resultEl.innerHTML =
      `<div class="card-table"><div class="deck" id="deck">${deckHtml}</div>` +
      `<div class="drawn" id="drawn" style="width:${gridW.toFixed(1)}px;height:${gridH.toFixed(1)}px;--sz:${hs}px">${drawnHtml}</div></div>`;
    if (shuffling && canAnimate()) return riffle();
    if (!play || !o || !o.cards.length) return;

    const host = resultEl.getBoundingClientRect();
    const topOf = () => { const cs = $('deck').querySelectorAll(':scope > .pcard'); return (cs[cs.length - 1] || $('deck')).getBoundingClientRect(); };
    const dk = topOf();
    const anims = [], clones = [];

    if (!st.replace) {
      // The deal: each card comes off the top of the deck face down, lifts,
      // and turns over as it lands with the others.
      const slots = [...resultEl.querySelectorAll('.drawn-card')].slice(-o.cards.length);
      slots.forEach((slot, i) => {
        const el = slot.querySelector('.flip'), t = el.getBoundingClientRect();
        // Centre to centre, scaled from the deck's card size to the hand's.
        const dx = dk.left + dk.width / 2 - (t.left + t.width / 2), dy = dk.top + dk.height / 2 - (t.top + t.height / 2);
        const k = dk.width / t.width;
        const tf = (x, y, a, sc) => `translate(${x}px, ${y}px) rotateY(${a}deg) scale(${sc})`;
        anims.push(el.animate([
          { transform: tf(dx, dy, 180, k), offset: 0 },
          { transform: tf(dx + dk.width * 0.12, dy - dk.height * 0.18, 180, k * 1.04), offset: 0.2 },
          { transform: tf(dx * 0.4, -t.height * 0.16, 150, (k + 1) / 2 * 1.06), offset: 0.6 },
          { transform: tf(0, 0, 0, 1), offset: 1 },
        ], { duration: 900, delay: i * 320, easing: 'cubic-bezier(0.3, 0.6, 0.3, 1)', fill: 'both' }));
      });
      hold(900 + (slots.length - 1) * 320 + 30, () => anims.forEach(a => a.cancel()));
      return;
    }

    // Put straight back: each card comes off the top, turns over so the
    // room can see it, waits a moment, then turns back down and slides into
    // the deck at a random depth.
    const show = 1500;
    o.cards.forEach((id, i) => {
      const c = document.createElement('div');
      c.className = 'slot-card flying-card';
      c.style.cssText = `left:${dk.left - host.left}px;top:${dk.top - host.top}px;`;
      c.innerHTML = `<div class="flip">${cardFace(id)}<div class="pcard back"></div></div>`;
      resultEl.appendChild(c);
      clones.push(c);
      const gap = cw * 1.15;
      const tx = dk.width * 1.4 + i * gap, ty = 0;
      const depth = -dk.height * 0.04;
      const tf = (x, y, a, sc) => `translate(${x}px, ${y}px) rotateY(${a}deg) scale(${sc})`;
      anims.push(c.querySelector('.flip').animate([
        { transform: tf(0, 0, 180, 1), offset: 0 },
        { transform: tf(dk.width * 0.15, -dk.height * 0.18, 180, 1.04), offset: 0.08 },
        { transform: tf(tx, ty, 0, 1.05), offset: 0.24 },
        { transform: tf(tx, ty, 0, 1.05), offset: 0.76 },
        { transform: tf(tx * 0.4, -dk.height * 0.12, 150, 1.03), offset: 0.9 },
        { transform: tf(dk.width * 0.06, depth, 180, 1), offset: 1 },
      ], { duration: 2400 + show - 1500, delay: i * 200, easing: 'cubic-bezier(0.3, 0.6, 0.3, 1)', fill: 'both' }));
    });
    hold(2400 + (o.cards.length - 1) * 200 + 40, () => { anims.forEach(a => a.cancel()); clones.forEach(c => c.remove()); });
  }

  // A riffle shuffle: cut the deck in two, pull the halves apart, let the
  // cards fall back in alternately, square it up.
  let pendingShuffle = false;
  function riffle() {
    const deck = $('deck');
    const statics = [...deck.querySelectorAll(':scope > .pcard')];
    statics.forEach(c => { c.style.visibility = 'hidden'; });
    const N = 14, anims = [], cards = [];
    for (let i = 0; i < N; i++) {
      const c = document.createElement('div');
      c.className = 'pcard back';
      c.style.zIndex = String(2 + i);
      deck.appendChild(c);
      cards.push(c);
    }
    const D = 1700;
    cards.forEach((c, i) => {
      const leftHalf = i % 2 === 0, side = leftHalf ? -1 : 1;
      const lift = -(i >> 1) * 1.2;
      const order = i;                       // falls back in the order they alternate
      const fall = 0.42 + order * (0.36 / N);
      anims.push(c.animate([
        { transform: `translate(0, ${-i * 0.6}px)`, offset: 0 },
        { transform: `translate(${side * 62}%, ${lift}px) rotate(${side * 9}deg)`, offset: 0.24 },
        { transform: `translate(${side * 62}%, ${lift}px) rotate(${side * 9}deg)`, offset: Math.max(0.25, fall - 0.04) },
        { transform: `translate(${side * 8}%, ${-i * 0.6}px) rotate(${side * 2}deg)`, offset: fall + 0.06 },
        { transform: `translate(0, ${-i * 0.6}px)`, offset: 0.9 },
        { transform: `translate(0, ${-i * 0.6}px)`, offset: 1 },
      ], { duration: D, easing: 'ease-in-out', fill: 'both' }));
    });
    hold(D + 30, () => {
      anims.forEach(a => a.cancel());
      cards.forEach(c => c.remove());
      statics.forEach(c => { c.style.visibility = ''; });
    });
  }

  function shuffleDeck() {
    if (IS_VIEWER) return;
    finishAnim();
    refill('cards');
    delete S.last.cards;
    S.shuffleId = (S.shuffleId || 0) + 1;
    pendingShuffle = true;
    S.rollId++;
    render(); emitState(true);
  }
  const cardName = id => `${['Ace', '2', '3', '4', '5', '6', '7', '8', '9', '10', 'Jack', 'Queen', 'King'][id % 13]} of ${['spades', 'hearts', 'diamonds', 'clubs'][Math.floor(id / 13)]}`;

  // ── Spinner ─────────────────────────────────────────────────────────────────
  // The wheel element persists across renders so its rotation can transition;
  // it is rebuilt only when the sectors (or the size) change.
  let wheelBuiltFor = '';
  function renderSpinner(play) {
    const sec = spinnerSectors(), sig = JSON.stringify(sec);
    const o = S.last.spinner;
    const sz = fitSize(1, 0.8, 0.02, 640);
    resultEl.style.setProperty('--sz', sz + 'px');
    if (wheelBuiltFor !== sig || !$('wheel')) {
      wheelBuiltFor = sig;
      const tot = sec.reduce((s, x) => s + x.w, 0);
      let a0 = 0, segs = '', pegs = '';
      sec.forEach((s, i) => {
        const a1 = a0 + s.w / tot * 360;
        segs += sectorPath(a0, a1, i, s.label, sec.length);
        if (sec.length > 1) pegs += pegAt(a0);
        a0 = a1;
      });
      resultEl.innerHTML =
        `<div id="wheel-wrap"><svg viewBox="-6 -16 112 140"><defs>
          <radialGradient id="sheen" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity="0.38"/><stop offset="0.55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.18"/></radialGradient>
          <radialGradient id="hubg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#c4c8cf"/><stop offset="1" stop-color="#5e636c"/></radialGradient>
          <linearGradient id="rimg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a52"/><stop offset="1" stop-color="#1c1c20"/></linearGradient>
          <linearGradient id="standg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2a2f"/><stop offset="0.5" stop-color="#55555d"/><stop offset="1" stop-color="#2a2a2f"/></linearGradient>
          <filter id="wsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#000" flood-opacity="0.32"/></filter>
        </defs>
        <ellipse cx="50" cy="121" rx="30" ry="2.6" fill="rgba(0,0,0,0.2)"/>
        <path d="M45,92 L41,118 L59,118 L55,92 Z" fill="url(#standg)"/>
        <rect x="28" y="116" width="44" height="5.5" rx="2.7" fill="url(#standg)"/>
        <circle cx="50" cy="50" r="50" fill="url(#rimg)" filter="url(#wsh)"/>
        <g id="wheel" style="transform:rotate(${-S.spin}deg)">${segs}${pegs}</g>
        <circle cx="50" cy="50" r="46" fill="url(#sheen)" pointer-events="none"/>
        <circle cx="50" cy="50" r="8.2" fill="url(#hubg)" stroke="#4a4e55" stroke-width="0.5" filter="url(#wsh)"/>

    const scale = hb.width / 200;
    const mx = hb.left + HAT_MOUTH[0] * scale - (sb.left + sb.width / 2);
    const my = hb.top + HAT_MOUTH[1] * scale - (sb.top + sb.height / 2);
    // Folded, the slip is about the size of the ones in the hat.
    const k = (18 * scale * 1.3) / sb.width;
    const flap = slip.querySelector('.bot');
    const anims = [];
    // 1. A hand in the hat: the slips rustle, the hat rocks.
    hat.querySelector('.hat-slips')?.classList.add('rustle');
    anims.push(hat.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-2.5deg)' }, { transform: 'rotate(2deg)' }, { transform: 'rotate(-1deg)' }, { transform: 'rotate(0)' }],
      { duration: 700, easing: 'ease-in-out' }));
    // 2. One slip is pulled up out of the opening (revealed from the top as
    //    it clears the brim), 3. carried over, 4. unfolded.
    const hh = sb.height * k / 2;
    anims.push(slip.animate([
      { transform: `translate(${mx}px, ${my + hh * 0.2}px) scale(${k}) rotate(-8deg)`, clipPath: 'inset(0 0 100% 0)', offset: 0 },
      { transform: `translate(${mx}px, ${my + hh * 0.2}px) scale(${k}) rotate(-8deg)`, clipPath: 'inset(0 0 100% 0)', offset: 0.28 },
      { transform: `translate(${mx}px, ${my - hh * 1.6}px) scale(${k * 1.05}) rotate(4deg)`, clipPath: 'inset(0 0 50% 0)', offset: 0.46 },
      { transform: `translate(${mx}px, ${my - hh * 2.4}px) scale(${k * 1.15}) rotate(-3deg)`, clipPath: 'inset(0 0 0 0)', offset: 0.52 },
      { transform: `translate(${mx * 0.45}px, ${my * 0.4 - hb.height * 0.3}px) scale(${(k + 1) / 2}) rotate(6deg)`, clipPath: 'inset(0 0 0 0)', offset: 0.75 },
      { transform: 'translate(0, 0) scale(1) rotate(-1.5deg)', clipPath: 'inset(0 0 0 0)', offset: 1 },
    ], { duration: 2000, easing: 'cubic-bezier(0.35, 0.1, 0.3, 1)', fill: 'both' }));
    anims.push(flap.animate([
      { transform: 'rotateX(178deg)' },
      { transform: 'rotateX(178deg)', offset: 0.55 },
      { transform: 'rotateX(-12deg)', offset: 0.88 },
      { transform: 'rotateX(0deg)' },
    ], { duration: 2000 + 700, easing: 'ease-out', fill: 'both' }));
    hold(2730, () => {
      anims.forEach(a => a.cancel());
      hat.querySelector('.hat-slips')?.classList.remove('rustle');
      // The hat now has one fewer slip in it.
      if (st.remove) hat.innerHTML = hatSvg(left);
    });
  }

  // ── Animation ───────────────────────────────────────────────────────────────
  // Purely cosmetic: the outcome is already decided and in S, so cutting an
  // animation short (a second press, a mode switch) just shows it sooner.
  let anim = null;
  function finishAnim(silent) {
    if (!anim) return;
    const a = anim; anim = null;
    clearTimeout(a.timer);
    if (silent && a.kind === 'spin') {
      const w = $('wheel');
      if (w) { w.classList.remove('spinning'); }
    }
    a.done && a.done();
  }

  // ── Socket.IO sync ──────────────────────────────────────────────────────────
  let socket = null, syncTimer = null;

  function initSocket(url) {
    if (typeof io === 'undefined') { socket = { emit() {}, on() {} }; return; }
    try {
      const prev = socket;
      socket = io(url || (window.BeamerWidget ? BeamerWidget.serverOrigin() : ''),
                  { transports: ['websocket', 'polling'] });
      if (prev && prev.disconnect) prev.disconnect();
      socket.on('widget_state', data => {
        if (!IS_VIEWER || data?.widgetId !== WIDGET_ID) return;
        applyState(data.state || {}, true);
      });
    } catch (_) {
      socket = { emit() {}, on() {} };
    }
  }

  // `now`: an outcome the room is waiting on goes straight out; setup typing
  // is debounced.
  function emitState(now) {
    if (!socket || IS_VIEWER) return;
    clearTimeout(syncTimer);
    const send = () => socket.emit('widget_state', { widgetId: WIDGET_ID, state: getState() });
    if (now) send(); else syncTimer = setTimeout(send, 200);
  }

  // ── State serialisation ─────────────────────────────────────────────────────
  function getState() {
    return JSON.parse(JSON.stringify({
      v: 2, mode: S.mode, runs: S.runs, setup: S.setup, pool: S.pool,
      last: S.last, stats: S.stats, hist: S.hist, rng: S.rng, rollId: S.rollId, spin: S.spin, shuffleId: S.shuffleId || 0,
    }));
  }

  function applyState(s, live) {
    if (!s || typeof s !== 'object') return;
    const prevRoll = S.rollId;
    // The settings own the setup. Only a live viewer takes the presenter's,
    // in case its own copy of the settings is behind.
    if (live) {
      if (MODES.includes(s.mode)) S.mode = s.mode;
      if (s.setup && typeof s.setup === 'object') {
        for (const k of MODES) if (s.setup[k] && typeof s.setup[k] === 'object') S.setup[k] = { ...S.setup[k], ...s.setup[k] };
      }
    }
    if ([1, 10, 100, 1000].includes(s.runs)) S.runs = s.runs;
    if (s.pool && typeof s.pool === 'object') S.pool = { ...S.pool, ...s.pool };
    if (s.last && typeof s.last === 'object') S.last = s.last;
    if (s.hist && typeof s.hist === 'object') S.hist = { dice: Array.isArray(s.hist.dice) ? s.hist.dice : [], coin: Array.isArray(s.hist.coin) ? s.hist.coin : [], bag: Array.isArray(s.hist.bag) ? s.hist.bag : [] };
    if (s.stats && typeof s.stats === 'object') S.stats = s.stats;
    if (typeof s.rng === 'number') S.rng = s.rng >>> 0;
    if (typeof s.spin === 'number') S.spin = s.spin;
    if (typeof s.rollId === 'number') S.rollId = s.rollId;
    if (typeof s.shuffleId === 'number') { if (live && s.shuffleId !== (S.shuffleId || 0) && S.mode === 'cards') pendingShuffle = true; S.shuffleId = s.shuffleId; }
    ensurePools();
    // A viewer animates a fresh outcome the way the presenter's screen did;
    // a restored slide just shows where it was.
    render(!!live && S.rollId !== prevRoll);
  }

  // ── Config ──────────────────────────────────────────────────────────────────
  let lastSeed = null;
  function applyConfig(c) {
    if (!c) return;
    const prevUrl = cfg.socketUrl;
    cfg = { ...cfg, ...c };
    WIDGET_ID = cfg.id || cfg.widgetId || WIDGET_ID;
    IS_VIEWER = cfg.role === 'viewer' || IS_VIEWER;
    const nextMode = MODES.includes(cfg.mode) ? cfg.mode : 'dice';
    if (nextMode !== S.mode) finishAnim(true);
    S.mode = nextMode;
    adoptSetup(setupFromConfig(cfg));
    // Only a changed seed re-seeds, so re-sent config doesn't restart a demo.
    const seed = String(cfg.seed || '');
    if (seed !== lastSeed) {
      if (lastSeed !== null || !S.rollId) S.rng = freshSeed();
      lastSeed = seed;
    }
    if (cfg.socketUrl && cfg.socketUrl !== prevUrl) initSocket(cfg.socketUrl);
    render();
    if (!IS_VIEWER && lastSeed !== null) emitState();
  }

  function destroy() {
    finishAnim(true);
    if (D3) cancelAnimationFrame(D3.raf);
    if (CG) cancelAnimationFrame(CG.raf);
    if (HT) cancelAnimationFrame(HT.raf);
    if (R3) { try { R3.renderer.dispose(); } catch (_) { /* already gone */ } }
    D3 = CG = HT = R3 = null;
    clearTimeout(syncTimer);
    clearTimeout(resizeTimer);
    if (ro) ro.disconnect();
    if (socket && socket.disconnect) socket.disconnect();
    socket = null;
  }

  // ── Beamer+ message bridge ──────────────────────────────────────────────────
  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === 'widget-config')  applyConfig(d.config);
    if (d.type === 'widget-cleanup') destroy();
    if (d.type === 'widget-get-state') {
      window.parent.postMessage({ type: 'widget-state', widgetId: WIDGET_ID, state: getState() }, '*');
    }
    if (d.type === 'widget-set-state' && d.state) applyState(d.state, false);
  });

  // ── Event wiring ────────────────────────────────────────────────────────────
  resultEl.addEventListener('click', e => {
    if (IS_VIEWER) return;
    // The list views are for reading, not another pick.
    if (e.target.closest('.lineup, .groupset') || isExhausted()) return;
    go();
  });
  deckBtn.addEventListener('click', shuffleDeck);
  shuffleBtn.addEventListener('click', shuffleList);
  groupsBtn.addEventListener('click', makeGroups);


  // Space / Enter goes, S toggles stats — from anywhere except a field.
  document.addEventListener('keydown', e => {
    if (IS_VIEWER || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!isExhausted()) go(); }
  });

  // Re-fit dice / wheel / numbers to the region, without replaying anything.
  let resizeTimer = null, ro = null;
  try {
    ro = new ResizeObserver(() => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (!anim) { wheelBuiltFor = ''; renderResult(false); } }, 60);
    });
    ro.observe(resultEl);
  } catch (_) { /* very old engines: fixed sizes are fine */ }

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Boot ────────────────────────────────────────────────────────────────────
  // Start fetching the 3D engine straight away, so it's ready by the time
  // anyone looks at dice, the cage or the hat.
  loadThree();
  S.rng = freshSeed();
  initSocket(CFG0.socketUrl);
  applyConfig(CFG0);
  render();

  // The shared bar's reset means clear the results, not reload the widget.
  (function wireReset(tries) {
    if (window.BeamerWidget && BeamerWidget.topbar) { BeamerWidget.topbar.onReset(reset); return; }
    if (tries > 0) setTimeout(() => wireReset(tries - 1), 120);
  })(20);
})();
</script>
</body>
</html>
