          `<div class="pcard back" style="transform:translate(${-i * 2}px, ${-i * 2}px)"></div>`).join('')
      : '<div class="deck-empty"></div>';
    const hand = o
      ? cards.map((id, i) => `<div class="slot-card${play ? ' dealing' : ''}"><div class="flip" style="animation-delay:${i * 130}ms;--from:${-(i + 1) * 105 - 30}%">${cardFace(id)}<div class="pcard back"></div></div></div>`).join('')
      : `<div class="slot-card ghost"><div class="pcard back"></div></div>`;
    resultEl.innerHTML =
      `<div class="table-row"><div class="deck">${stack}<div class="deck-count">${st.replace ? 'full deck · with replacement' : `${left} left`}</div></div>` +
      `<div class="items hand">${hand}</div></div>` +
      (o ? `<div class="caption" id="cap" style="margin-top:calc(var(--sz) * 0.12)">${cards.length === 1 ? `<strong>${cardName(cards[0])}</strong>` : `${cards.length} cards`}${runsNote(o)}</div>`
         : `<div style="margin-top:calc(var(--sz) * 0.12)">${placeholder('Press Draw')}</div>`);
    if (play) hold(600 + cards.length * 130, () => resultEl.querySelectorAll('.dealing').forEach(c => c.classList.remove('dealing')));
  }
  const cardName = id => `${['Ace', '2', '3', '4', '5', '6', '7', '8', '9', '10', 'Jack', 'Queen', 'King'][id % 13]} of ${['spades', 'hearts', 'diamonds', 'clubs'][Math.floor(id / 13)]}`;

  // ── Spinner ─────────────────────────────────────────────────────────────────
  // The wheel element persists across renders so its rotation can transition;
  // it is rebuilt only when the sectors (or the size) change.
  let wheelBuiltFor = '';
  function renderSpinner(play) {
    const sec = spinnerSectors(), sig = JSON.stringify(sec);
    const o = S.last.spinner;
    const sz = fitSize(1, 0.8, 0.02, 640);
    resultEl.style.setProperty('--sz', sz + 'px');
    if (wheelBuiltFor !== sig || !$('wheel')) {
      wheelBuiltFor = sig;
      const tot = sec.reduce((s, x) => s + x.w, 0);
      let a0 = 0, segs = '', pegs = '';
      sec.forEach((s, i) => {
        const a1 = a0 + s.w / tot * 360;
        segs += sectorPath(a0, a1, i, s.label, sec.length);
        if (sec.length > 1) pegs += pegAt(a0);
        a0 = a1;
      });
      resultEl.innerHTML =
        `<div id="wheel-wrap"><svg viewBox="-6 -16 112 140"><defs>
          <radialGradient id="sheen" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity="0.38"/><stop offset="0.55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.18"/></radialGradient>
          <radialGradient id="hubg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#c4c8cf"/><stop offset="1" stop-color="#5e636c"/></radialGradient>
          <linearGradient id="rimg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a52"/><stop offset="1" stop-color="#1c1c20"/></linearGradient>
          <linearGradient id="standg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2a2f"/><stop offset="0.5" stop-color="#55555d"/><stop offset="1" stop-color="#2a2a2f"/></linearGradient>
          <filter id="wsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#000" flood-opacity="0.32"/></filter>
        </defs>
        <ellipse cx="50" cy="121" rx="30" ry="2.6" fill="rgba(0,0,0,0.2)"/>
        <path d="M45,92 L41,118 L59,118 L55,92 Z" fill="url(#standg)"/>
        <rect x="28" y="116" width="44" height="5.5" rx="2.7" fill="url(#standg)"/>
        <circle cx="50" cy="50" r="50" fill="url(#rimg)" filter="url(#wsh)"/>
        <g id="wheel" style="transform:rotate(${-S.spin}deg)">${segs}${pegs}</g>
        <circle cx="50" cy="50" r="46" fill="url(#sheen)" pointer-events="none"/>
        <circle cx="50" cy="50" r="8.2" fill="url(#hubg)" stroke="#4a4e55" stroke-width="0.5" filter="url(#wsh)"/>
        <circle cx="50" cy="50" r="2.4" fill="#4a4e55"/>
        <g id="ptr" filter="url(#wsh)">
          <path d="M50,10 C46,3 43.2,-1 43.2,-6 A6.8,6.8 0 1 1 56.8,-6 C56.8,-1 54,3 50,10 Z" fill="#d7263d" stroke="#fff" stroke-width="1.1"/>
          <circle cx="50" cy="-6" r="2.1" fill="#fff"/>
        </g></svg></div>` +
        `<div class="caption" id="spin-label"></div>`;
    }
    const wheel = $('wheel'), label = $('spin-label');
    const showLabel = () => {
      label.innerHTML = o && !o.empty
        ? `<span class="spin-result"><i style="background:var(--hue-${o.i % HUES})"></i><strong>${escHtml(o.label)}</strong></span>${runsNote(o)}`
        : placeholder('Press Spin');
    };
    if (play) {
      label.innerHTML = '&nbsp;';
      wheel.classList.add('spinning');
      reflow(wheel);
      wheel.style.transform = `rotate(${-S.spin}deg)`;
      const stopTick = tickPointer(wheel, sec);
      const stop = () => { stopTick(); wheel.classList.remove('spinning'); showLabel(); label.classList.add('fade'); };
      wheel.addEventListener('transitionend', function te(e) { if (e.target === wheel) { wheel.removeEventListener('transitionend', te); finishAnim(); } });
      hold(4700, stop, { kind: 'spin' });
    } else {
      wheel.classList.remove('spinning');
      wheel.style.transform = `rotate(${-S.spin}deg)`;
      showLabel();
    }
  }

  // The pointer flicks each time a peg passes under it, which is most of
  // what makes a prize wheel feel like one.
  function tickPointer(wheel, sec) {
    const ptr = $('ptr'); if (!ptr) return () => {};
    const tot = sec.reduce((s, x) => s + x.w, 0);
    const bounds = []; let a = 0;
    sec.forEach(s => { bounds.push(a); a += s.w / tot * 360; });
    let last = null, raf = 0, alive = true;
    const angleNow = () => {
      const m = getComputedStyle(wheel).transform;
      if (!m || m === 'none') return 0;
      const v = m.match(/matrix\(([^)]+)\)/); if (!v) return 0;
      const [ma, mb] = v[1].split(',').map(parseFloat);
      return ((-Math.atan2(mb, ma) * 180 / Math.PI) % 360 + 360) % 360;
    };
    const sectorOf = ang => { let k = 0; for (let i = 0; i < bounds.length; i++) if (ang >= bounds[i]) k = i; return k; };
    const loop = () => {
      if (!alive) return;
      const k = sectorOf(angleNow());
      if (last !== null && k !== last && bounds.length > 1) {
        ptr.style.transition = 'none';
        ptr.style.transform = 'rotate(-24deg)';
        reflow(ptr);
        ptr.style.transition = '';
        ptr.style.transform = '';
      }
      last = k;
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => { alive = false; cancelAnimationFrame(raf); ptr.style.transform = ''; };
  }

  function sectorPath(a0, a1, i, label, n) {
    // Angles clockwise from 12 o'clock, so the pointer at the top reads the
    // sector the wheel stops under.
    const pt = (a, r) => [50 + r * Math.sin(a * Math.PI / 180), 50 - r * Math.cos(a * Math.PI / 180)];
    const [x0, y0] = pt(a0, 46), [x1, y1] = pt(a1, 46);
    const large = a1 - a0 > 180 ? 1 : 0;
    const d = a1 - a0 >= 359.99
      ? 'M50,4 A46,46 0 1,1 49.99,4 Z'
      : `M50,50 L${x0.toFixed(2)},${y0.toFixed(2)} A46,46 0 ${large},1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`;
    let text = '';
    if (n <= 20 && a1 - a0 >= 9) {
      // Labels run along the radius, reading outward, like a real wheel.
      const mid = (a0 + a1) / 2, [tx, ty] = pt(mid, 28);
      const short = label.length > 14 ? label.slice(0, 13) + '…' : label;
      const fs = Math.max(3.2, Math.min(8, 62 / Math.max(3.5, short.length + 1.5), (a1 - a0) / 3.6));
      const rot = mid <= 180 ? mid - 90 : mid + 90;
      text = `<text class="lbl" x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" font-size="${fs.toFixed(2)}" transform="rotate(${rot.toFixed(1)} ${tx.toFixed(2)} ${ty.toFixed(2)})">${escHtml(short)}</text>`;
    }
    return `<path d="${d}" style="fill:var(--hue-${i % HUES})" stroke="rgba(255,255,255,0.55)" stroke-width="0.5"/>${text}`;
  }
  function pegAt(a) {
    const x = 50 + 48 * Math.sin(a * Math.PI / 180), y = 50 - 48 * Math.cos(a * Math.PI / 180);
    return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.5" fill="#f1f1ee" stroke="#8b8b90" stroke-width="0.35"/>`;
  }
  // The wheel turns by -angle; the pointer then reads the sector at `angle`
  // (mod 360). Always spin forward several turns to land there.
  function targetAngle(o) {
    const sec = spinnerSectors(), tot = sec.reduce((s, x) => s + x.w, 0);
    let a0 = 0;
    for (let i = 0; i < o.i; i++) a0 += sec[i].w / tot * 360;
    const at = a0 + o.frac * sec[o.i].w / tot * 360;
    return Math.ceil(S.spin / 360) * 360 + 360 * 5 + at;
  }

  // ── Number reels ────────────────────────────────────────────────────────────
  function odoHtml(text) {
    return `<div class="odo" id="odo">${[...text].map(ch => /\d/.test(ch)
      ? `<span class="reel"><span class="strip" data-d="${ch}">${'0123456789'.repeat(3).split('').map(d => `<span>${d}</span>`).join('')}</span></span>`
      : `<span class="sym">${escHtml(ch)}</span>`).join('')}</div>`;
  }
  function fitOdo(len) {
    const r = resultEl.getBoundingClientRect();
    const units = len * 0.88 + 0.4;
    const fs = Math.max(20, Math.min(r.height * 0.36, (r.width - 60) / units, 190));
    $('odo').style.fontSize = fs + 'px';
  }
  function spinReels(play) {
    const strips = [...resultEl.querySelectorAll('.reel .strip')];
    let longest = 0;
    strips.forEach((s, i) => {
      const d = +s.dataset.d;
      if (!play) { s.style.transition = 'none'; s.style.transform = `translateY(-${(20 + d) * 1.2}em)`; return; }
      s.style.transition = 'none';
      s.style.transform = `translateY(-${jiggle(0, 9) * 1.2}em)`;
      reflow(s);
      const dur = 0.9 + i * 0.16;
      longest = Math.max(longest, dur);
      s.style.transition = `transform ${dur}s cubic-bezier(0.15, 0.8, 0.25, 1)`;
      s.style.transform = `translateY(-${(20 + d) * 1.2}em)`;
    });
    return longest * 1000;
  }
  function renderReelValue(text, captionHtml, play, emptyHint) {
    if (text == null) {
      resultEl.innerHTML = `<div class="ghost">${odoHtml('0')}</div>${emptyHint}`;
      fitOdo(3);
      spinReels(false);
      return;
    }
    resultEl.innerHTML = odoHtml(text) + (captionHtml ? `<div class="caption" id="cap">${captionHtml}</div>` : '');
    fitOdo(text.length);
    const ms = spinReels(play);
    if (play) hold(ms + 50, () => resultEl.querySelectorAll('.reel .strip').forEach(s => { s.style.transition = 'none'; }));
  }

  function renderNumber(o, play) {
    const st = S.setup.number;
    let note = o && o.runs > 1 ? `<span class="note">last of ${o.runs}</span>` : '';
    if (st.unique && st.decimals === 0) note += `${note ? ' ' : ''}<span class="note">${S.pool.number.length} of ${st.max - st.min + 1} used</span>`;
    renderReelValue(o ? String(o.v) : null, note, play, placeholder(`${st.min} – ${st.max}`));
  }

  function renderDist(o, play) {
    const m = model('dist');
    renderReelValue(o ? fmtDist(o.v) : null, `${escHtml(m.title)}${o && o.runs > 1 ? ` <span class="note">· last of ${o.runs}</span>` : ''}`,
                    play, `<div class="caption">${escHtml(m.title)}</div>`);
  }

  // ── Name slot ───────────────────────────────────────────────────────────────
  function renderList(o, play) {
    const st = S.setup.list;
    if (o && o.type === 'order') {
      resultEl.innerHTML = `<ol class="order fade">${o.list.map((x, i) => `<li><span>${i + 1}</span>${escHtml(x)}</li>`).join('')}</ol>`;
      return;
    }
    if (o && o.type === 'groups') {
      resultEl.innerHTML = `<div class="groups fade">${o.groups.map((g, i) =>
        `<div class="group bw-card"><h4>Group ${i + 1}</h4>${g.map(x => `<div>${escHtml(x)}</div>`).join('')}</div>`).join('')}</div>`;
      return;
    }
    const name = o ? o.name : '?';
    const reel = play && st.items.length > 1
      ? Array.from({ length: 26 }, () => st.items[jiggle(0, st.items.length - 1)]).concat([name])
      : [name];
    resultEl.innerHTML =
      `<div class="slot${o ? '' : ' ghost'}" id="slot"><div class="strip">${reel.map(x => `<div>${escHtml(x)}</div>`).join('')}</div></div>` +
      (o ? (st.remove ? `<div class="bw-hint">${S.pool.list.length} left to pick</div>` : '')
         : placeholder(`${st.items.length} names · press Pick`));
    // Size by the longest name the reel will show, so it doesn't jump.
    const slot = $('slot'), r = resultEl.getBoundingClientRect();
    let fs = Math.min(r.height * 0.3, 150);
    slot.style.fontSize = fs + 'px';
    for (let i = 0; i < 14 && slot.getBoundingClientRect().width > r.width - 50 && fs > 18; i++) { fs *= 0.88; slot.style.fontSize = fs + 'px'; }
    const strip = slot.querySelector('.strip');
    strip.style.transform = `translateY(-${(reel.length - 1) * 1.3}em)`;
    if (play && reel.length > 1) {
      strip.style.transition = 'none';
      strip.style.transform = 'translateY(0)';
      reflow(strip);
      strip.style.transition = 'transform 1.7s cubic-bezier(0.12, 0.75, 0.18, 1)';
      strip.style.transform = `translateY(-${(reel.length - 1) * 1.3}em)`;
      hold(1750, () => { strip.style.transition = 'none'; });
    }
  }

  // ── Animation ───────────────────────────────────────────────────────────────
  // Purely cosmetic: the outcome is already decided and in S, so cutting an
  // animation short (a second press, a mode switch) just shows it sooner.
  let anim = null;
  function finishAnim(silent) {
    if (!anim) return;
    const a = anim; anim = null;
    clearTimeout(a.timer);
    if (silent && a.kind === 'spin') {
      const w = $('wheel');
      if (w) { w.classList.remove('spinning'); }
    }
    a.done && a.done();
  }

  // ── History ─────────────────────────────────────────────────────────────────
  function renderHistory() {
    const h = S.history[S.mode] || [];
    if (!h.length || (S.mode === 'list' && S.last.list && S.last.list.type !== 'pick' && !h.length)) {
      historyEl.innerHTML = `<span class="bw-hint">History</span><span class="h-item" style="color:var(--text-3);font-weight:400">—</span>`;
      return;
    }
    historyEl.innerHTML = `<span class="bw-hint">History</span>` + h.slice(0, 30).map(x =>
      x.dots ? `<span class="h-item">${x.dots.map(c => `<span class="dot" style="--c:var(--hue-${c})"></span>`).join('')}</span>`
             : `<span class="h-item">${x.c != null ? `<span class="dot" style="--c:var(--hue-${x.c})"></span>` : ''}${escHtml(x.t)}</span>`).join('');
  }

  // ── Stats chart ─────────────────────────────────────────────────────────────
  function renderStats() {
    const show = S.showStats && S.mode !== 'list';
    statsEl.hidden = !show;
    if (!show) return;
    const m = model(), st = statsFor(S.mode);
    statsTtl.textContent = m.title;
    let sum = `n = <strong>${st.total}</strong>`;
    if (m.mean != null && st.total) {
      sum += ` · mean <strong>${fmt(st.sum / st.total)}</strong> (exp. ${fmt(m.mean)})`;
    }
    statsSum.innerHTML = sum;
    legendEl.querySelector('.l-exp').style.display = m.probs ? '' : 'none';
    drawChart(m, st);
  }

  function drawChart(m, st) {
    const r = chartEl.getBoundingClientRect();
    const W = Math.max(120, r.width), H = Math.max(80, r.height);
    const padL = 34, padB = 18, padT = 6, padR = 4;
    const n = m.labels.length;
    const obs = st.counts.map(c => st.total ? c / st.total : 0);
    const exp = m.probs || [];
    const top = Math.max(0.0001, ...obs, ...exp) * 1.08;
    const bw = (W - padL - padR) / n;
    const y = p => padT + (H - padT - padB) * (1 - p / top);
    const lastBin = (() => {
      const o = S.last[S.mode];
      if (!o || o.empty || o.runs > 1) return -1;
      try {
        if (S.mode === 'dice')    return m.bin(o.faces.reduce((s, x) => s + x, 0));
        if (S.mode === 'coin')    return m.bin(o.faces.length === 1 ? o.faces[0] : o.faces.reduce((s, x) => s + x, 0));
        if (S.mode === 'spinner') return o.i;
        if (S.mode === 'number' || S.mode === 'dist') return m.bin(o.v);
      } catch (_) { /* a stale outcome from an older setup — no highlight */ }
      return -1;
    })();
    let svg = `<line class="axis" x1="${padL}" x2="${W - padR}" y1="${H - padB}" y2="${H - padB}"/>`;
    // y gridline labels at 0 and the top value, as percentages.
    svg += `<text x="${padL - 5}" y="${y(0) + 3}" text-anchor="end">0%</text>`;
    svg += `<text x="${padL - 5}" y="${padT + 8}" text-anchor="end">${fmt(top * 100, top < 0.1 ? 1 : 0)}%</text>`;
    const gap = Math.min(4, bw * 0.18);
    for (let i = 0; i < n; i++) {
      const x = padL + i * bw + gap / 2, w = Math.max(1, bw - gap);
      const h = (H - padT - padB) * obs[i] / top;
      const col = m.colors ? ` style="fill:${m.colors[i]}${i === lastBin ? '' : ';opacity:0.75'}"` : '';
      svg += `<rect class="bar${i === lastBin ? ' hl' : ''}" x="${x.toFixed(1)}" y="${(H - padB - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"${col}/>`;
      if (m.probs) svg += `<line class="exp" x1="${(x + 1).toFixed(1)}" x2="${(x + w - 1).toFixed(1)}" y1="${y(exp[i]).toFixed(1)}" y2="${y(exp[i]).toFixed(1)}"/>`;
    }
    // Axis labels: as many as fit without colliding.
    const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor((W - padL) / 34))));
    for (let i = 0; i < n; i += every) {
      svg += `<text x="${(padL + (i + 0.5) * bw).toFixed(1)}" y="${H - 4}" text-anchor="middle">${escHtml(String(m.labels[i]).slice(0, 8))}</text>`;
    }
    chartEl.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${svg}</svg>`;
  }

  // ── Socket.IO sync ──────────────────────────────────────────────────────────
  let socket = null, syncTimer = null;

  function initSocket(url) {
    if (typeof io === 'undefined') { socket = { emit() {}, on() {} }; return; }
    try {
      const prev = socket;
      socket = io(url || (window.BeamerWidget ? BeamerWidget.serverOrigin() : ''),
                  { transports: ['websocket', 'polling'] });
      if (prev && prev.disconnect) prev.disconnect();
      socket.on('widget_state', data => {
        if (!IS_VIEWER || data?.widgetId !== WIDGET_ID) return;
        applyState(data.state || {}, true);
      });
    } catch (_) {
      socket = { emit() {}, on() {} };
    }
  }

  // `now`: an outcome the room is waiting on goes straight out; setup typing
  // is debounced.
  function emitState(now) {
    if (!socket || IS_VIEWER) return;
    clearTimeout(syncTimer);
    const send = () => socket.emit('widget_state', { widgetId: WIDGET_ID, state: getState() });
    if (now) send(); else syncTimer = setTimeout(send, 200);
  }

  // ── State serialisation ─────────────────────────────────────────────────────
  function getState() {
    return JSON.parse(JSON.stringify({
      v: 1, mode: S.mode, runs: S.runs, showStats: S.showStats, setup: S.setup, pool: S.pool,
      last: S.last, history: S.history, stats: S.stats, rng: S.rng, rollId: S.rollId, spin: S.spin,
    }));
  }

  function applyState(s, live) {
    if (!s || typeof s !== 'object') return;
    const prevRoll = S.rollId;
    if (MODES.includes(s.mode)) S.mode = s.mode;
    if ([1, 10, 100, 1000].includes(s.runs)) S.runs = s.runs;
    if (typeof s.showStats === 'boolean') S.showStats = s.showStats;
    if (s.setup && typeof s.setup === 'object') {
      for (const k of MODES) if (s.setup[k] && typeof s.setup[k] === 'object') S.setup[k] = { ...S.setup[k], ...s.setup[k] };
    }
    if (s.pool && typeof s.pool === 'object') S.pool = { ...S.pool, ...s.pool };
    if (s.last && typeof s.last === 'object') S.last = s.last;
    if (s.history && typeof s.history === 'object') S.history = s.history;
    if (s.stats && typeof s.stats === 'object') S.stats = s.stats;
    if (typeof s.rng === 'number') S.rng = s.rng >>> 0;
    if (typeof s.spin === 'number') S.spin = s.spin;
    if (typeof s.rollId === 'number') S.rollId = s.rollId;
    ensurePools();
    setupFor = '';
    // A viewer animates a fresh outcome the way the presenter's screen did;
    // a restored slide just shows where it was.
    render(!!live && S.rollId !== prevRoll);
  }

  // ── Config ──────────────────────────────────────────────────────────────────
  // Only a changed setting is adopted, so re-sent config never undoes what
  // the presenter has done in the widget since.
  let lastCfgMode = null, lastItems = null, lastSeed = null;
  function applyConfig(c) {
    if (!c) return;
    const prevUrl = cfg.socketUrl;
    cfg = { ...cfg, ...c };
    WIDGET_ID = cfg.id || cfg.widgetId || WIDGET_ID;
    IS_VIEWER = cfg.role === 'viewer' || IS_VIEWER;
    if (MODES.includes(cfg.mode) && cfg.mode !== lastCfgMode) {
      if (lastCfgMode !== null || !S.rollId) S.mode = cfg.mode;
      lastCfgMode = cfg.mode;
    }
    const items = Array.isArray(cfg.items) ? cfg.items : typeof cfg.items === 'string' ? cfg.items.split('\n') : null;
    const itemsSig = items ? JSON.stringify(items) : null;
    if (itemsSig && itemsSig !== lastItems) {
      if (lastItems !== null || !S.rollId) setListItems(items);
      lastItems = itemsSig;
    }
    const seed = String(cfg.seed || '');
    if (seed !== lastSeed) {
      if (lastSeed !== null || !S.rollId) S.rng = freshSeed();
      lastSeed = seed;
    }
    if (cfg.socketUrl && cfg.socketUrl !== prevUrl) initSocket(cfg.socketUrl);
    setupFor = '';
    render();
  }

  function destroy() {
    finishAnim(true);
    clearTimeout(syncTimer);
    clearTimeout(resizeTimer);
    if (ro) ro.disconnect();
    if (socket && socket.disconnect) socket.disconnect();
    socket = null;
  }

  // ── Beamer+ message bridge ──────────────────────────────────────────────────
  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === 'widget-config')  applyConfig(d.config);
    if (d.type === 'widget-cleanup') destroy();
    if (d.type === 'widget-get-state') {
      window.parent.postMessage({ type: 'widget-state', widgetId: WIDGET_ID, state: getState() }, '*');
    }
    if (d.type === 'widget-set-state' && d.state) applyState(d.state, false);
  });

  // ── Event wiring ────────────────────────────────────────────────────────────
  goBtn.addEventListener('click', go);
  modeSel.addEventListener('change', () => setMode(modeSel.value));
  runsSel.addEventListener('change', () => { if (IS_VIEWER) return; S.runs = +runsSel.value || 1; emitState(); });
  statsBtn.addEventListener('click', () => {
    if (IS_VIEWER) return;
    S.showStats = !S.showStats;
    render(); emitState();
  });
  setupEl.addEventListener('input', e => { if (e.target.dataset.k && e.target.type !== 'checkbox' && e.target.tagName !== 'SELECT') onSetupChange(e.target); });
  setupEl.addEventListener('change', e => { if (e.target.dataset.k) onSetupChange(e.target); });
  setupEl.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (b) onSetupAction(b.dataset.act, +b.dataset.i);
  });
  listText.addEventListener('input', updateListCount);
  $('list-done').addEventListener('click', () => closeListEditor(true));
  $('list-cancel').addEventListener('click', () => closeListEditor(false));
  listText.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.stopPropagation(); closeListEditor(false); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) closeListEditor(true);
  });

  // Space / Enter goes, S toggles stats — from anywhere except a field.
  document.addEventListener('keydown', e => {
    if (IS_VIEWER || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.closest && e.target.closest('input, textarea, select, #list-editor')) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!goBtn.disabled) go(); }
    else if ((e.key === 's' || e.key === 'S') && S.mode !== 'list') statsBtn.click();
  });

  // Re-fit dice / wheel / numbers to the region, without replaying anything.
  let resizeTimer = null, ro = null;
  try {
    ro = new ResizeObserver(() => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (!anim) { wheelBuiltFor = ''; renderResult(false); } renderStats(); }, 60);
    });
    ro.observe(resultEl); ro.observe(chartEl);
  } catch (_) { /* very old engines: fixed sizes are fine */ }

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Boot ────────────────────────────────────────────────────────────────────
  S.rng = freshSeed();
  ensurePools();
  initSocket(CFG0.socketUrl);
  applyConfig(CFG0);
  render();

  // The shared bar's reset means clear the results, not reload the widget.
  (function wireReset(tries) {
    if (window.BeamerWidget && BeamerWidget.topbar) { BeamerWidget.topbar.onReset(reset); return; }
    if (tries > 0) setTimeout(() => wireReset(tries - 1), 120);
  })(20);
})();
</script>
</body>
</html>
