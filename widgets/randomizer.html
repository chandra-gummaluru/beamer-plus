  }

  // ── Dice ────────────────────────────────────────────────────────────────────
  const DIE_COLORS = {
    ivory:    { face: '#f7f3ea', hi: '#ffffff', lo: '#d9d0bd', ink: '#1c1c1e', pip: '#151517', pipHi: '#4a4a4f' },
    ruby:     { face: '#c92a3a', hi: '#f0606c', lo: '#7d1220', ink: '#ffffff', pip: '#fbf7ef', pipHi: '#ffffff' },
    sapphire: { face: '#2f5fd0', hi: '#6c95f0', lo: '#173581', ink: '#ffffff', pip: '#fbf7ef', pipHi: '#ffffff' },
    emerald:  { face: '#1d9461', hi: '#4fcb91', lo: '#0c5636', ink: '#ffffff', pip: '#fbf7ef', pipHi: '#ffffff' },
    onyx:     { face: '#2e2e33', hi: '#5a5a62', lo: '#111114', ink: '#ffffff', pip: '#f2efe6', pipHi: '#ffffff' },
  };
  // Classic dice: an ivory d6, blue polyhedra.
  function dieColor(sides) {
    return sides === 6 ? DIE_COLORS.ivory : DIE_COLORS.sapphire;
  }

  const PIPS = { 1: [[50, 50]], 2: [[27, 27], [73, 73]], 3: [[27, 27], [50, 50], [73, 73]],
                 4: [[27, 27], [73, 27], [27, 73], [73, 73]], 5: [[27, 27], [73, 27], [50, 50], [27, 73], [73, 73]],
                 6: [[27, 25], [73, 25], [27, 50], [73, 50], [27, 75], [73, 75]] };
  // Cube rotation that brings each face to the front. Opposite faces sum to
  // seven, as on a real die.
  const CUBE_ROT = { 1: [0, 0], 6: [0, 180], 2: [0, -90], 5: [0, 90], 3: [-90, 0], 4: [90, 0] };
  const diceTurns = [];

  function cubeHtml(i) {
    const faces = [1, 2, 3, 4, 5, 6].map(v =>
      `<div class="face f${v}">${PIPS[v].map(([x, y]) => `<span class="pip" style="left:${x}%;top:${y}%"></span>`).join('')}</div>`).join('');
    return `<div class="die3d" data-i="${i}"><div class="ground"></div><div class="cube">${faces}<div class="core"></div><div class="core cx"></div><div class="core cy"></div></div></div>`;
  }
  function cubeTransform(t) {
    const [fx, fy] = CUBE_ROT[t.f] || [0, 0];
    // A slight three-quarter view, so it reads as a cube rather than a square.
    return `rotateX(-11deg) rotateY(13deg) rotateX(${t.x * 360 + fx}deg) rotateY(${t.y * 360 + fy}deg) rotateZ(${t.z * 360}deg)`;
  }

  // Facets for a polyhedral die seen face-on: the face that carries the
  // number in the middle, the neighbouring faces around it, each shaded by
  // which way it leans relative to a light from the top left.
  const ngon = (n, r, rot = -90, cy = 50) => Array.from({ length: n }, (_, i) => {
    const a = (rot + i * 360 / n) * Math.PI / 180;
    return [50 + r * Math.cos(a), cy + r * Math.sin(a)];
  });
  const POLY = {
    4:  { outer: [[50, 4], [96, 88], [4, 88]],                         inner: [[50, 34], [74, 78], [26, 78]], ty: 63, fs: 24 },
    8:  { outer: ngon(6, 47),                                         inner: ngon(3, 31, -90, 55),          ty: 60, fs: 24 },
    10: { outer: [[50, 2], [94, 40], [87, 67], [50, 98], [13, 67], [6, 40]], inner: [[50, 15], [74, 47], [50, 80], [26, 47]], ty: 48, fs: 22 },
    12: { outer: ngon(10, 48),                                        inner: ngon(5, 26, -90, 52),          ty: 53, fs: 20 },
    20: { outer: ngon(6, 48),                                         inner: ngon(3, 30, -90, 54),          ty: 59, fs: 20 },
  };
  function polyShape(sides) {
    if (POLY[sides]) return POLY[sides];
    return POLY[sides <= 4 ? 4 : sides <= 8 ? 8 : sides <= 10 ? 10 : sides <= 12 ? 12 : 20];
  }
  function facets(shape) {
    const { outer, inner } = shape, out = [];
    const near = (p, set) => set.reduce((b, q) => (Math.hypot(q[0] - p[0], q[1] - p[1]) < Math.hypot(b[0] - p[0], b[1] - p[1]) ? q : b));
    for (let i = 0; i < outer.length; i++) {
      const a = outer[i], b = outer[(i + 1) % outer.length];
      out.push([a, b, near([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], inner)]);
    }
    for (let i = 0; i < inner.length; i++) {
      const a = inner[i], b = inner[(i + 1) % inner.length];
      out.push([a, b, near([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], outer)]);
    }
    return out;
  }
  function mixHex(a, b, t) {
    const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const A = p(a), B = p(b);
    return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }
  function polyHtml(i, v, sides) {
    const col = dieColor(sides), shape = polyShape(sides);
    const pts = ps => ps.map(p => p.map(n => n.toFixed(2)).join(',')).join(' ');
    let svg = `<polygon points="${pts(shape.outer)}" fill="${col.lo}" stroke="${col.lo}" stroke-width="2" stroke-linejoin="round"/>`;
    facets(shape).forEach(tri => {
      const cx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3 - 50, cy = (tri[0][1] + tri[1][1] + tri[2][1]) / 3 - 50;
      const len = Math.hypot(cx, cy) || 1, lit = (cx * -0.55 + cy * -0.83) / len;
      const fill = lit > 0 ? mixHex(col.face, col.hi, lit * 0.6) : mixHex(col.face, col.lo, -lit * 0.75);
      svg += `<polygon points="${pts(tri)}" fill="${fill}" stroke="rgba(255,255,255,0.22)" stroke-width="0.6" stroke-linejoin="round"/>`;
    });
    svg += `<polygon points="${pts(shape.inner)}" fill="${mixHex(col.face, col.hi, 0.18)}" stroke="rgba(255,255,255,0.3)" stroke-width="0.6" stroke-linejoin="round"/>`;
    const txt = v == null ? '?' : String(v);
    const fs = shape.fs * (txt.length > 2 ? 0.7 : txt.length > 1 ? 0.92 : 1.1);
    const strokeCol = col.ink === '#ffffff' ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.5)';
    svg += `<text class="pnum" x="50" y="${shape.ty}" font-size="${fs.toFixed(1)}" fill="${col.ink}" stroke="${strokeCol}">${txt}</text>`;
    // 6 and 9 are underlined on real polyhedral dice, so they can't be confused.
    const underline = (v === 6 || v === 9) && sides >= 8;
    svg += `<rect class="uline" x="${50 - fs * 0.28}" y="${shape.ty + fs * 0.5}" width="${fs * 0.56}" height="${fs * 0.07}" rx="${fs * 0.03}" fill="${col.ink}" style="display:${underline ? '' : 'none'}"/>`;
    if (!POLY[sides]) svg += `<text class="kind" x="50" y="${shape.outer.reduce((m, p) => Math.max(m, p[1]), 0) + 11}">d${sides}</text>`;
    return `<div class="poly" data-i="${i}"><svg viewBox="0 0 100 100">${svg}</svg></div>`;
  }
  function setPolyFace(el, v, sides) {
    const t = el.querySelector('.pnum'), u = el.querySelector('.uline');
    if (t) t.textContent = String(v);
    if (u) u.style.display = (v === 6 || v === 9) && sides >= 8 ? '' : 'none';
  }

  function renderDice(o, play) {
    const sides = S.setup.dice.sides;
    // Outcomes from an older set of dice (the settings changed since) are
    // shown as blank dice rather than mismatched faces.
    const fresh = o && o.faces.length === sides.length;
    const faces = fresh ? o.faces : sides.map((s, i) => (s === 6 ? 1 + (i * 3) % 6 : null));
    const n = sides.length, anyCube = sides.includes(6);
    // A cube in perspective, tilted, takes more room than its face size,
    // and it needs headroom to be thrown into.
    const sp = boardSplit();
    const sz = anyCube ? fitSize(n, 1.3, 0.42, 150, sp.playW) : fitSize(n, 1.05, 0.34, 170, sp.playW);
    resultEl.style.setProperty('--sz', sz + 'px');
    const col = dieColor(6);
    ['face', 'hi', 'lo', 'pip'].forEach(k => resultEl.style.setProperty(`--d-${k}`, col[k]));
    resultEl.style.setProperty('--d-pip-hi', col.pipHi);
    play = play && fresh;
    resultEl.innerHTML =
      `<div class="play-row"><div class="play" style="width:${sp.playW}px"><div class="items${fresh ? '' : ' ghost'}">${faces.map((f, i) => (sides[i] === 6 ? cubeHtml(i) : polyHtml(i, f, sides[i]))).join('')}</div></div>` +
      historyBoardHtml('dice', S.hist.dice, sp.bw, sp.bh) + '</div>';

    const cap = $('cap');
    const cubes = [...resultEl.querySelectorAll('.die3d')];
    cubes.forEach(el => {
      const i = +el.dataset.i, cube = el.querySelector('.cube');
      const t = diceTurns[i] || (diceTurns[i] = { x: 0, y: 0, z: 0, f: faces[i] || 1 });
      cube.style.transition = 'none';
      if (!play) { t.f = faces[i] || 1; cube.style.transform = cubeTransform(t); return; }
      cube.style.transform = cubeTransform(t);
      reflow(cube);
      t.x += jiggle(2, 3); t.y += jiggle(1, 2); t.z += jiggle(0, 1); t.f = faces[i];
      cube.style.transition = '';
      cube.style.transitionDelay = el.style.animationDelay = (i * 70) + 'ms';
      cube.style.transform = cubeTransform(t);
      el.classList.add('tossing');
    });
    if (!play) return;
    const polys = [...resultEl.querySelectorAll('.poly')];
    polys.forEach(el => { el.classList.add('tossing'); el.querySelector('svg').style.animationDelay = (+el.dataset.i * 70) + 'ms'; });
    const tick = polys.length ? setInterval(() => polys.forEach(el => { const s = sides[+el.dataset.i]; setPolyFace(el, jiggle(1, s), s); }), 75) : null;
    if (cap) cap.style.visibility = 'hidden';
    const roll = (cubes.length ? 1150 : 900) + n * 70;
    const g = prepNewest(), w = writeNewest(g, roll - 150);
    hold(Math.max(roll, w.end) + 30, () => {
      clearInterval(tick);
      w.anims.forEach(a => a.cancel()); settleNewest(g);
      cubes.forEach(el => { el.classList.remove('tossing'); el.querySelector('.cube').style.transition = 'none'; });
      polys.forEach(el => { const i = +el.dataset.i; el.classList.remove('tossing'); setPolyFace(el, faces[i], sides[i]); });
      if (cap) { cap.style.visibility = ''; cap.classList.add('fade'); }
    });
  }

  // ── Coins ───────────────────────────────────────────────────────────────────
  const METALS = {
    gold:   { hi: '#fbe7a1', mid: '#d8a83e', lo: '#8a5f12', ink: '#7a520c' },
    silver: { hi: '#ffffff', mid: '#c3c7cf', lo: '#6c717b', ink: '#5b606a' },
    copper: { hi: '#ffd2b0', mid: '#c77b4a', lo: '#7a3e1d', ink: '#6e3416' },
  };
  let coinUid = 0;
  function coinFace(heads) {
    const m = METALS.silver, id = 'cn' + (++coinUid);
    // Relief: the same shape three times — shadow down-right, highlight
    // up-left, metal on top — reads as struck into the coin.
    const emboss = (shape) =>
      `<g fill="${m.lo}" opacity="0.55" transform="translate(0.7 0.9)">${shape}</g>` +
      `<g fill="${m.hi}" opacity="0.9" transform="translate(-0.5 -0.6)">${shape}</g>` +
      `<g fill="url(#${id}e)">${shape}</g>`;
    let emblem;
    if (heads) {
      emblem = `<text x="50" y="59" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" text-anchor="middle">H</text>` +
               `<path d="M50 66.5l1.4 2.9 3.2.4-2.3 2.2.6 3.1-2.9-1.5-2.9 1.5.6-3.1-2.3-2.2 3.2-.4z"/>`;
    } else {
      let leaves = '';
      for (const side of [-1, 1]) {
        for (let k = 0; k < 7; k++) {
          const th = (side < 0 ? 112 + k * 19 : 68 - k * 19) * Math.PI / 180;
          const x = 50 + 25 * Math.cos(th), y = 51 + 25 * Math.sin(th);
          const rot = th * 180 / Math.PI + (side < 0 ? 60 : 120);
          leaves += `<ellipse cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" rx="4.6" ry="1.9" transform="rotate(${rot.toFixed(1)} ${x.toFixed(2)} ${y.toFixed(2)})"/>`;
        }
      }
      emblem = leaves + `<text x="50" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" text-anchor="middle">T</text>`;
    }
    const word = heads ? 'HEADS' : 'TAILS';
    return `<svg viewBox="0 0 100 100"><defs>
      <radialGradient id="${id}f" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="${m.hi}"/><stop offset="0.55" stop-color="${m.mid}"/><stop offset="1" stop-color="${m.lo}"/></radialGradient>
      <linearGradient id="${id}r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${m.hi}"/><stop offset="0.5" stop-color="${m.mid}"/><stop offset="1" stop-color="${m.lo}"/></linearGradient>
      <linearGradient id="${id}e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${m.mid}"/><stop offset="1" stop-color="${mixHex(m.mid, m.lo, 0.35)}"/></linearGradient>
      <path id="${id}a" d="M 20.5,50 A 29.5,29.5 0 0,1 79.5,50"/>
    </defs>
    <circle cx="50" cy="50" r="49.6" fill="${m.lo}"/>
    <circle cx="50" cy="50" r="48.4" fill="url(#${id}r)"/>
    <circle cx="50" cy="50" r="47.3" fill="none" stroke="${m.lo}" stroke-width="2" stroke-dasharray="0.7 1.1" opacity="0.55"/>
    <circle cx="50" cy="50" r="41.5" fill="url(#${id}f)" stroke="${m.lo}" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="${m.lo}" stroke-opacity="0.5" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="0.1 2.35"/>
    ${emboss(`<text font-family="Georgia, 'Times New Roman', serif" font-size="7.2" font-weight="700" letter-spacing="2.4"><textPath href="#${id}a" startOffset="50%" text-anchor="middle">${word}</textPath></text>`)}
    ${emboss(emblem)}
    </svg>`;
  }
  const coinTurns = [];
  const coinTransform = t => `rotateX(${t.turns * 360 + (t.heads ? 0 : 180)}deg)`;

  function renderCoins(o, play) {
    const st = S.setup.coin, n = o ? o.faces.length : 1;
    const sp = boardSplit();
    const sz = fitSize(n, 1.05, 0.42, 180, sp.playW);
    resultEl.style.setProperty('--sz', sz + 'px');
    const faces = o ? o.faces : [1];
    resultEl.innerHTML =
      `<div class="items${o ? '' : ' ghost'}">${faces.map((_, i) =>
        `<div class="coin3d" data-i="${i}"><div class="ground"></div><div class="coin"><div class="cface heads">${coinFace(true)}</div><div class="cedge"></div><div class="cface tails">${coinFace(false)}</div></div></div>`).join('')}</div>`;
    resultEl.innerHTML = `<div class="play-row"><div class="play" style="width:${sp.playW}px">${resultEl.innerHTML}</div>` +
      historyBoardHtml('coin', S.hist.coin, sp.bw, sp.bh) + '</div>';
    const els = [...resultEl.querySelectorAll('.coin3d')];
    els.forEach((el, i) => {
      const coin = el.querySelector('.coin');
      const t = coinTurns[i] || (coinTurns[i] = { turns: 0, heads: true });
      coin.style.transition = 'none';
      if (!play) { t.heads = !!faces[i]; coin.style.transform = coinTransform(t); return; }
      coin.style.transform = coinTransform(t);
      reflow(coin);
      t.turns += jiggle(4, 6); t.heads = !!faces[i];
      coin.style.transition = '';
      coin.style.transitionDelay = el.style.animationDelay = (i * 60) + 'ms';
      coin.style.transform = coinTransform(t);
      el.classList.add('tossing');
    });
    if (play) {
      const cap = $('cap');
      if (cap) cap.style.visibility = 'hidden';
      const flip = 1300 + n * 60;
      const g = prepNewest(), w = writeNewest(g, flip - 150);
      hold(Math.max(flip, w.end) + 30, () => {
        w.anims.forEach(a => a.cancel()); settleNewest(g);
        els.forEach(el => { el.classList.remove('tossing'); el.querySelector('.coin').style.transition = 'none'; });
        if (cap) { cap.style.visibility = ''; cap.classList.add('fade'); }
      });
    }
  }

  // ── Jar of balls ────────────────────────────────────────────────────────────
  function jarSvg(dots) {
    // Pack the balls into the bottom of the jar in staggered rows, largest
    // size that still fits them all.
    const W = 74, H = 74, x0 = 13, yBottom = 119;
    let r = 9;
    for (; r > 1.6; r -= 0.25) {
      const cols = Math.floor(W / (2 * r)), rows = Math.ceil(dots.length / Math.max(1, cols));
      if (cols >= 1 && 2 * r + (rows - 1) * r * 1.74 <= H) break;
    }
    const cols = Math.max(1, Math.floor(W / (2 * r)));
    let balls = '';
    dots.forEach((c, i) => {
      const row = Math.floor(i / cols), col = i % cols;
      const off = row % 2 ? r : 0;
      const usable = row % 2 ? cols - 1 : cols;
      if (row % 2 && col >= usable) return;
      const x = x0 + r + off + col * 2 * r + ((i * 37) % 7 - 3) * 0.08;
      const y = yBottom - r - row * r * 1.74;
      balls += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${(r * 0.97).toFixed(2)}" fill="url(#jb${c})"/>`;
    });
    const grads = Array.from({ length: HUES }, (_, h) => {
      const base = getComputedStyle(document.documentElement).getPropertyValue(`--hue-${h}`).trim() || '#888888';
      return `<radialGradient id="jb${h}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="${mixHex(base, '#ffffff', 0.6)}"/><stop offset="0.45" stop-color="${base}"/><stop offset="1" stop-color="${mixHex(base, '#000000', 0.45)}"/></radialGradient>`;
    }).join('');
    return `<svg viewBox="0 0 100 130"><defs>${grads}
        <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7adb6"/><stop offset="0.5" stop-color="#7b818b"/><stop offset="1" stop-color="#555a62"/></linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(160,190,220,0.22)"/><stop offset="0.5" stop-color="rgba(160,190,220,0.06)"/><stop offset="1" stop-color="rgba(160,190,220,0.18)"/></linearGradient>
        <clipPath id="jarclip"><path d="M30,20 L30,24 C12,28 9,38 9,50 L9,112 Q9,123 20,123 L80,123 Q91,123 91,112 L91,50 C91,38 88,28 70,24 L70,20 Z"/></clipPath>
      </defs>
      <ellipse cx="50" cy="126" rx="40" ry="3.2" fill="rgba(0,0,0,0.22)"/>
      <path d="M30,20 L30,24 C12,28 9,38 9,50 L9,112 Q9,123 20,123 L80,123 Q91,123 91,112 L91,50 C91,38 88,28 70,24 L70,20 Z" fill="url(#glass)"/>
      <g clip-path="url(#jarclip)">${balls}</g>
      <path d="M30,20 L30,24 C12,28 9,38 9,50 L9,112 Q9,123 20,123 L80,123 Q91,123 91,112 L91,50 C91,38 88,28 70,24 L70,20 Z" fill="none" stroke="rgba(130,145,160,0.75)" stroke-width="1.3"/>
      <path d="M16,54 L16,104" stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round"/>
      <path d="M21,46 Q22,38 30,33" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M84,62 L84,96" stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="50" cy="20" rx="20" ry="3" fill="rgba(160,190,220,0.18)" stroke="rgba(130,145,160,0.75)" stroke-width="1.3"/>
    </svg>`;
  }

  // A drawn ball's name: its row in the settings, else its colour.
  function ballName(o, i) {
    const j = o.idx ? o.idx[i] : -1, b = S.setup.bag.balls[j];
    return b && b.c === o.balls[i] ? b.label : HUE_NAMES[o.balls[i]];
  }

  // An opaque cloth bag: you know how many are in it, not which.
  function sackSvg(left) {
    return `<svg viewBox="0 0 100 130"><defs>
        <linearGradient id="sack" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2d2150"/><stop offset="0.42" stop-color="#5b44a0"/><stop offset="0.6" stop-color="#4a3689"/><stop offset="1" stop-color="#221838"/></linearGradient>
        <radialGradient id="sackHi" cx="38%" cy="45%" r="55%"><stop offset="0" stop-color="#fff" stop-opacity="0.18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <linearGradient id="rope" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0dca6"/><stop offset="1" stop-color="#b8975a"/></linearGradient>
      </defs>
      <ellipse cx="50" cy="125" rx="38" ry="3.5" fill="rgba(0,0,0,0.25)"/>
      <path d="M33,38 C12,52 6,84 12,106 Q18,124 50,124 Q82,124 88,106 C94,84 88,52 67,38 Z" fill="url(#sack)"/>
      <path d="M33,38 C12,52 6,84 12,106 Q18,124 50,124 Q82,124 88,106 C94,84 88,52 67,38 Z" fill="url(#sackHi)"/>
      <path d="M38,44 C30,62 28,88 32,112 M50,44 C49,70 49,96 50,120 M62,44 C70,62 72,88 68,112" stroke="rgba(0,0,0,0.22)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path d="M41,46 C35,64 34,86 37,104" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M33,39 L36,22 L64,22 L67,39 Z" fill="url(#sack)"/>
      <path d="M38,24 L39,38 M44,23 L44.5,38 M50,23 L50,38 M56,23 L55.5,38 M62,24 L61,38" stroke="rgba(0,0,0,0.25)" stroke-width="0.9"/>
      <ellipse cx="50" cy="21.5" rx="15" ry="4.2" fill="#130c24" stroke="#6d55b8" stroke-width="1.2"/>
      <path d="M32,36 Q50,41 68,36" stroke="url(#rope)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M62,37.5 C66,44 70,50 67,58 M63,38 C60,46 61,52 58,58" stroke="url(#rope)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <circle cx="62.5" cy="37.8" r="2.4" fill="url(#rope)"/>
      <circle cx="67" cy="58.5" r="1.6" fill="#b8975a"/><circle cx="58" cy="58.5" r="1.6" fill="#b8975a"/>
    </svg>`;
  }

  // Where a ball leaves the container, in viewBox units (100 × 130): the
  // jar's neck or the bag's mouth, and where it starts from inside.
  const MOUTH = { jar: { from: [50, 96], out: [50, 6] }, bag: { from: [50, 26], out: [50, 2] } };

  // A hand-written sticky note taped to the container: how many are inside.
  function stickyHtml(left) {
    return `<div class="sticky"><span class="tape"></span><b>${left}</b><i>${left === 1 ? 'ball' : 'balls'}</i></div>`;
  }

  // Fly a copy of a ball between two points in #result coordinates, along a
  // list of [x, y, scale, opacity] waypoints. Resolves when it lands.
  function flyBall(c, size, path, { duration = 1000, delay = 0 } = {}) {
    const fly = document.createElement('span');
    fly.className = 'ball flying';
    fly.style.cssText = `--c:var(--hue-${c});--sz:${size}px;left:0;top:0;`;
    resultEl.appendChild(fly);
    const kf = path.map(([x, y, s, op], i) => ({
      transform: `translate(${x - size / 2}px, ${y - size / 2}px) scale(${s})`,
      opacity: op == null ? 1 : op,
      offset: i / (path.length - 1),
    }));
    const a = fly.animate(kf, { duration, delay, easing: 'ease-in-out', fill: 'both' });
    a.onfinish = () => fly.remove();
    return { a, fly };
  }

  // ── Chalkboard ──────────────────────────────────────────────────────────────
  // Without replacement, each ball drawn is recorded on a chalkboard as a
  // chalk sketch in its colour: a hand-drawn ring, then a few strokes of
  // shading, as if someone at the board were keeping score.
  function hueHex(c) {
    return getComputedStyle(document.documentElement).getPropertyValue(`--hue-${c}`).trim() || '#888888';
  }
  // Small deterministic wobble, so a sketch looks the same on every redraw.
  const wob = (i, k) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x) - 0.5; };

  function sketchSvg(i, cx, cy, r, c) {
    const col = mixHex(hueHex(c), '#ffffff', 0.32);
    // The ring: a little over one turn, radius drifting, so the ends overlap
    // like a quick hand-drawn circle.
    const start = wob(i, 1) * Math.PI, turns = 1.1, N = 30;
    let d = '';
    for (let k = 0; k <= N; k++) {
      const a = start + (k / N) * turns * 2 * Math.PI;
      const rr = r * (1 + 0.06 * Math.sin(k * 0.9 + i) + 0.04 * wob(i, k));
      d += `${k ? 'L' : 'M'}${(cx + rr * Math.cos(a)).toFixed(1)},${(cy + rr * Math.sin(a)).toFixed(1)}`;
    }
    // Shading: diagonal strokes clipped to the ring.
    let hatch = '';
    const n = 5;
    for (let k = 0; k < n; k++) {
      const off = (k - (n - 1) / 2) * r * 0.36;
      const half = Math.sqrt(Math.max(0, (r * 0.8) ** 2 - off * off));
      const ux = Math.SQRT1_2, uy = -Math.SQRT1_2, vx = Math.SQRT1_2, vy = Math.SQRT1_2;
      const mx = cx + vx * off, my = cy + vy * off;
      const j = wob(i, k + 40) * r * 0.08;
      hatch += `<path class="hatch" d="M${(mx - ux * half + j).toFixed(1)},${(my - uy * half).toFixed(1)}L${(mx + ux * half).toFixed(1)},${(my + uy * half + j).toFixed(1)}" stroke="${col}" stroke-width="${Math.max(1.4, r * 0.09).toFixed(1)}"/>`;
    }
    return `<g class="sketch" data-i="${i}" data-cx="${cx.toFixed(1)}" data-cy="${cy.toFixed(1)}">` +
      `<path class="ring" d="${d}" stroke="${col}" stroke-width="${Math.max(2, r * 0.13).toFixed(1)}"/>${hatch}</g>`;
  }

  function boardHtml(out, W, H) {
    const pad = 22, ledge = 16;
    const iw = W - pad * 2, ih = H - pad * 2 - ledge;
    // Laid out for a jar's worth from the start, so a sketch never moves
    // once it's drawn.
    const n = Math.max(1, out.length, fullBag().reduce((a, b) => a + b, 0));
    let cell = 16;
    for (let s = Math.min(96, ih); s >= 16; s -= 1) {
      if (Math.floor(iw / s) * Math.floor(ih / s) >= n) { cell = s; break; }
    }
    const cols = Math.max(1, Math.floor(iw / cell));
    const rows = Math.ceil(n / cols);
    const x0 = pad + (iw - Math.min(n, cols) * cell) / 2, y0 = pad + (ih - rows * cell) / 2;
    const sketches = out.map((b, i) => {
      const cx = x0 + (i % cols + 0.5) * cell + wob(i, 7) * cell * 0.08;
      const cy = y0 + (Math.floor(i / cols) + 0.5) * cell + wob(i, 9) * cell * 0.08;
      return sketchSvg(i, cx, cy, cell * 0.34, b.c);
    }).join('');
    return `<div class="board" style="width:${W}px;height:${H}px"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
      <defs>
        <filter id="chalk" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="d"/>
          <feComposite in="d" in2="n" operator="arithmetic" k1="0" k2="1" k3="-0.25" k4="0.06"/>
        </filter>
        <radialGradient id="dust" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
        <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98652"/><stop offset="1" stop-color="#7f5530"/></linearGradient>
      </defs>
      <rect x="0" y="0" width="${W}" height="${H - ledge + 4}" rx="10" fill="url(#wood)"/>
      <rect x="9" y="9" width="${W - 18}" height="${H - ledge - 14}" rx="4" fill="#26332d"/>
      <ellipse cx="${W * 0.3}" cy="${H * 0.35}" rx="${W * 0.28}" ry="${H * 0.22}" fill="url(#dust)"/>
      <ellipse cx="${W * 0.72}" cy="${H * 0.62}" rx="${W * 0.24}" ry="${H * 0.18}" fill="url(#dust)"/>
      <g class="chalk" filter="url(#chalk)" fill="none" stroke-linecap="round" stroke-linejoin="round">${sketches}</g>
      <rect x="4" y="${H - ledge - 2}" width="${W - 8}" height="${ledge}" rx="3" fill="url(#wood)"/>
      <rect x="${W * 0.66}" y="${H - ledge - 6}" width="${Math.min(46, W * 0.12)}" height="6" rx="3" fill="#f4f1e8"/>
      <rect x="${W * 0.2}" y="${H - ledge - 7}" width="${Math.min(40, W * 0.1)}" height="7" rx="2" fill="#5a4a3a"/>
    </svg></div>`;
  }

  // Draw a sketch's strokes in, as if by hand: the ring, then each shading
  // stroke. Returns the running animations.
  function drawSketch(g, delay) {
    const anims = [];
    let t = delay;
    g.querySelectorAll('.ring, .hatch').forEach(p => {
      const len = p.getTotalLength();
      const dur = p.classList.contains('ring') ? 520 : 90;
      p.style.strokeDasharray = `${len} ${len}`;
      p.style.strokeDashoffset = String(len);
      anims.push(p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
        { duration: dur, delay: t, easing: 'ease-in-out', fill: 'both' }));
      t += dur + 25;
    });
    return { anims, end: t };
  }

  // A kraft-paper tag on a bit of twine, tied to the bag's drawstring.
  function bagTag(left) {
    return `<g class="bag-tag">
      <path d="M62.5,38.5 C66,46 69,50 71,57.5" stroke="#cdb57d" stroke-width="0.9" fill="none"/>
      <g transform="rotate(-9 71 70)">
        <path d="M60,60 L66,56.5 L76,56.5 L82,60 L82,84 L60,84 Z" fill="#d9bd8c" stroke="#a7875a" stroke-width="0.7" stroke-linejoin="round"/>
        <path d="M60,60 L66,56.5 L76,56.5 L82,60 L82,64 L60,64 Z" fill="#000" opacity="0.06"/>
        <circle cx="71" cy="59.6" r="1.5" fill="#3a2a1a" stroke="#f4ead2" stroke-width="0.8"/>
        <text x="71" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#3b2a18" font-family="'Segoe Print','Bradley Hand','Marker Felt','Comic Sans MS',cursive">${left}</text>
        <text x="71" y="81.6" text-anchor="middle" font-size="4" fill="#5a4630" font-family="'Segoe Print','Bradley Hand','Marker Felt','Comic Sans MS',cursive">${left === 1 ? 'ball' : 'balls'}</text>
      </g></g>`;
  }

  function renderBag(o, play) {
    const st = S.setup.bag, look = st.look === 'bag' ? 'bag' : 'jar';
    const pool = S.pool.bag, out = S.pool.bagOut;
    const left = pool.reduce((s, x) => s + x, 0);
    // Shuffle the colours into the jar deterministically, so the same jar
    // looks the same on every screen and doesn't reshuffle on a resize.
    const dots = [];
    pool.forEach((n, j) => { for (let i = 0; i < n && dots.length < 200; i++) dots.push(st.balls[j].c); });
    dots.forEach((_, i) => { const j = (i * 7919 + 13) % dots.length; [dots[i], dots[j]] = [dots[j], dots[i]]; });

    const r = resultEl.getBoundingClientRect();
    const jar = Math.max(90, Math.min(r.height * 0.82, r.width * 0.4 / 0.77, 420));
    const sideW = Math.max(140, r.width - jar * 0.77 - jar * 0.2 - 70);
    resultEl.style.setProperty('--jar', jar + 'px');

    // Beside the container: with replacement, the balls just drawn sit out
    // until the next draw puts them back; without, each is recorded on a
    // chalkboard.
    let side, sz;
    if (st.replace) {
      sz = Math.max(30, Math.min(jar * 0.36, sideW / (Math.max(1, out.length) * 1.25), 150));
      side = `<div class="spot">${out.map((b, i) => `<span class="ball" data-i="${i}" style="--c:var(--hue-${b.c})"></span>`).join('')}</div>`;
    } else {
      const bw = Math.min(sideW, jar * 1.45), bh = Math.min(jar * 0.85, bw * 0.72);
      sz = Math.max(24, Math.min(jar * 0.3, 110));
      side = boardHtml(out, Math.round(bw), Math.round(bh));
    }
    resultEl.style.setProperty('--sz', sz + 'px');
    const svg = look === 'bag' ? sackSvg(left).replace('</svg>', bagTag(left) + '</svg>') : jarSvg(dots);
    resultEl.innerHTML =
      `<div class="bag-row"><div class="jar" id="container">${svg}${look === 'jar' ? stickyHtml(left) : ''}</div>` +
      `<div class="bag-side">${side}</div></div>`;
    if (!play || !o) return;

    const box = $('container').getBoundingClientRect(), host = resultEl.getBoundingClientRect();
    const at = ([x, y]) => [box.left - host.left + x / 100 * box.width, box.top - host.top + y / 130 * box.height];
    const [fx, fy] = at(MOUTH[look].from), [ox, oy] = at(MOUTH[look].out);
    const flights = [], extra = [];

    if (st.replace) {
      const outEls = [...resultEl.querySelectorAll('.spot .ball')];
      const fresh = outEls.slice(outEls.length - o.balls.length);
      const centre = el => { const t = el.getBoundingClientRect(); return [t.left - host.left + t.width / 2, t.top - host.top + t.height / 2, t.width]; };

      // First, the last draw goes back in: up off the table, over, and down
      // into the container.
      const back = o.back || [];
      back.forEach((c, i) => {
        const ref = fresh[i] || fresh[0] || outEls[0];
        const [x, y, w] = ref ? centre(ref) : [ox + 120, oy + 80, sz];
        const small = Math.max(0.3, jar * 0.065 / w);
        const peak = Math.max(w * 0.4 + 6, Math.min(oy, y) - w * 0.6);
        flights.push(flyBall(c, w, [
          [x, y, 1], [x, y - w * 0.15, 1.02], [(x + ox) / 2, peak, 0.75], [ox, oy, small], [fx, fy, small, look === 'bag' ? 0 : 1],
        ], { duration: 900, delay: i * 220 }));
      });
      const after = back.length ? 900 + (back.length - 1) * 220 + 80 : 0;

      // Then the new draw: out of the mouth, over, and down beside it.
      fresh.forEach((el, i) => {
        el.style.visibility = 'hidden';
        const [x, y, w] = centre(el);
        const peak = Math.max(w * 0.4 + 6, Math.min(oy, y) - w * 0.7);
        const small = Math.max(0.25, Math.min(0.6, jar * 0.12 / w));
        const f = flyBall(o.balls[i], w, [
          [fx, fy, small, look === 'bag' ? 0 : 1], [ox, oy - w * 0.1, small * 1.2], [(ox + x) / 2, peak, 0.85], [x, y, 1],
        ], { duration: 1000, delay: after + i * 600 });
        f.a.onfinish = () => { el.style.visibility = ''; f.fly.remove(); };
        flights.push(f);
      });
      const total = after + (fresh.length ? 1000 + (fresh.length - 1) * 600 : 0) + 30;
      hold(total, () => {
        flights.forEach(f => { f.a.cancel(); f.fly.remove(); });
        fresh.forEach(el => { el.style.visibility = ''; });
      });
      return;
    }

    // Without replacement: the ball comes up out of the container, travels
    // to its place on the board and fades into the chalk sketch of it,
    // which draws itself in.
    const svgEl = resultEl.querySelector('.board svg'), sb = svgEl.getBoundingClientRect();
    const sketches = [...svgEl.querySelectorAll('.sketch')];
    const fresh = sketches.slice(sketches.length - o.balls.length);
    fresh.forEach(g => g.querySelectorAll('.ring, .hatch').forEach(p => { p.style.strokeDasharray = '1 100000'; p.style.strokeDashoffset = '1'; }));
    let lastEnd = 0;
    fresh.forEach((g, i) => {
      const x = sb.left - host.left + +g.dataset.cx, y = sb.top - host.top + +g.dataset.cy;
      const delay = i * 1300;
      const small = Math.max(0.25, Math.min(0.6, jar * 0.12 / sz));
      const peak = Math.max(sz * 0.4 + 6, Math.min(oy, y) - sz * 0.6);
      flights.push(flyBall(o.balls[i], sz, [
        [fx, fy, small, look === 'bag' ? 0 : 1], [ox, oy - sz * 0.1, small * 1.2], [(ox + x) / 2, peak, 0.9], [x, y, 0.75, 1], [x, y, 0.6, 0],
      ], { duration: 950, delay }));
      const d = drawSketch(g, delay + 780);
      extra.push(...d.anims);
      lastEnd = Math.max(lastEnd, d.end);
    });
    hold(Math.max(lastEnd, 950) + 40, () => {
      flights.forEach(f => { f.a.cancel(); f.fly.remove(); });
      extra.forEach(a => a.cancel());
      fresh.forEach(g => g.querySelectorAll('.ring, .hatch').forEach(p => { p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; }));
    });
  }

  // ── Cards ───────────────────────────────────────────────────────────────────
  const CARD_PIPS = {
    2: [[50, 0], [50, 100]], 3: [[50, 0], [50, 50], [50, 100]],
    4: [[0, 0], [100, 0], [0, 100], [100, 100]],
    5: [[0, 0], [100, 0], [50, 50], [0, 100], [100, 100]],
    6: [[0, 0], [100, 0], [0, 50], [100, 50], [0, 100], [100, 100]],
    7: [[0, 0], [100, 0], [50, 25], [0, 50], [100, 50], [0, 100], [100, 100]],
    8: [[0, 0], [100, 0], [50, 25], [0, 50], [100, 50], [50, 75], [0, 100], [100, 100]],
    9: [[0, 0], [100, 0], [0, 33.3], [100, 33.3], [50, 50], [0, 66.7], [100, 66.7], [0, 100], [100, 100]],
    10: [[0, 0], [100, 0], [50, 16.7], [0, 33.3], [100, 33.3], [0, 66.7], [100, 66.7], [50, 83.3], [0, 100], [100, 100]],
  };
  function cardFace(id) {
    const ri = id % 13, r = RANKS[ri], s = SUITS[Math.floor(id / 13)], red = s === '♥' || s === '♦';
    let mid;
    if (ri === 0) mid = `<div class="ace">${s}</div>`;
    else if (ri >= 10) mid = `<div class="court" data-s="${s}">${r}</div>`;
    else mid = `<div class="pips">${CARD_PIPS[ri + 1].map(([x, y]) =>
      `<span${y > 50 ? ' class="dn"' : ''} style="left:${x}%;top:${y}%">${s}</span>`).join('')}</div>`;
    const b = `<b${ri === 9 ? ' class="ten"' : ''}>${r}</b>`;
    return `<div class="pcard${red ? ' red' : ''}"><div class="ci tl">${b}<i>${s}</i></div>${mid}<div class="ci br">${b}<i>${s}</i></div></div>`;
  }

  function renderCards(o, play) {
    const st = S.setup.cards;
    const deck = S.pool.cards, drawn = S.pool.hand;
    const shuffling = pendingShuffle; pendingShuffle = false;
    const rr = resultEl.getBoundingClientRect();
    const W = rr.width - 50, H = rr.height - 30;
    const sz = Math.max(50, Math.min(260, H * 0.72, W / (0.714 * 3.6 + 0.5)));
    resultEl.style.setProperty('--sz', sz + 'px');
    const cw = sz * 0.714;

    // Every card drawn so far stays face up beside the deck. They overlap,
    // and then shrink into more rows, so a whole deck's worth still fits.
    const areaW = Math.max(cw, W - cw - sz * 0.5), areaH = H * 0.86;
    const n = drawn.length;
    let hs = sz, perRow = n || 1, rows = 1;
    for (let s = sz; s >= 34; s -= 2) {
      const w = s * 0.714;
      perRow = Math.max(1, Math.floor((areaW - w) / (w * 0.4)) + 1);
      rows = Math.ceil(Math.max(1, n) / perRow);
      hs = s;
      if (rows * s * 1.06 <= areaH) break;
    }
    const hw = hs * 0.714;
    const inRow = Math.min(perRow, Math.max(1, n));
    const step = inRow > 1 ? Math.min(hw + hs * 0.1, (areaW - hw) / (inRow - 1)) : 0;
    let drawnHtml = '';
    for (let r = 0; r < rows && n; r++) {
      const row = drawn.slice(r * perRow, (r + 1) * perRow);
      drawnHtml += `<div class="drawn-row">${row.map((id, i) =>
        `<div class="slot-card drawn-card" style="margin-left:${i ? (step - hw).toFixed(1) : 0}px;z-index:${i + 1}"><div class="flip">${cardFace(id)}<div class="pcard back"></div></div></div>`).join('')}</div>`;
    }

    const pile = Array.from({ length: Math.min(4, Math.ceil(deck.length / 13)) }, (_, i) =>
      `<div class="pcard back" style="transform:translate(${-i * 2}px, ${-i * 2}px)"></div>`).join('');
    const deckHtml = deck.length ? pile + `<span class="badge">${deck.length}</span>` : `<div class="deck-empty">empty</div>`;
    resultEl.innerHTML =
      `<div class="card-table"><div class="deck" id="deck">${deckHtml}</div>` +
      `<div class="drawn" id="drawn" style="width:${areaW}px;--sz:${hs}px">${drawnHtml}</div></div>`;
    if (shuffling && canAnimate()) return riffle();
    if (!play || !o || !o.cards.length) return;

    const host = resultEl.getBoundingClientRect();
    const topOf = () => { const cs = $('deck').querySelectorAll(':scope > .pcard'); return (cs[cs.length - 1] || $('deck')).getBoundingClientRect(); };
    const dk = topOf();
    const anims = [], clones = [];

    if (!st.replace) {
      // The deal: each card comes off the top of the deck face down, lifts,
      // and turns over as it lands with the others.
      const slots = [...resultEl.querySelectorAll('.drawn-card')].slice(-o.cards.length);
      slots.forEach((slot, i) => {
        const el = slot.querySelector('.flip'), t = el.getBoundingClientRect();
        // Centre to centre, scaled from the deck's card size to the hand's.
        const dx = dk.left + dk.width / 2 - (t.left + t.width / 2), dy = dk.top + dk.height / 2 - (t.top + t.height / 2);
        const k = dk.width / t.width;
        const tf = (x, y, a, sc) => `translate(${x}px, ${y}px) rotateY(${a}deg) scale(${sc})`;
        anims.push(el.animate([
          { transform: tf(dx, dy, 180, k), offset: 0 },
          { transform: tf(dx + dk.width * 0.12, dy - dk.height * 0.18, 180, k * 1.04), offset: 0.2 },
          { transform: tf(dx * 0.4, -t.height * 0.16, 150, (k + 1) / 2 * 1.06), offset: 0.6 },
          { transform: tf(0, 0, 0, 1), offset: 1 },
        ], { duration: 900, delay: i * 320, easing: 'cubic-bezier(0.3, 0.6, 0.3, 1)', fill: 'both' }));
      });
      hold(900 + (slots.length - 1) * 320 + 30, () => anims.forEach(a => a.cancel()));
      return;
    }

    // Put straight back: each card comes off the top, turns over so the
    // room can see it, waits a moment, then turns back down and slides into
    // the deck at a random depth.
    const show = 1500;
    o.cards.forEach((id, i) => {
      const c = document.createElement('div');
      c.className = 'slot-card flying-card';
      c.style.cssText = `left:${dk.left - host.left}px;top:${dk.top - host.top}px;`;
      c.innerHTML = `<div class="flip">${cardFace(id)}<div class="pcard back"></div></div>`;
      resultEl.appendChild(c);
      clones.push(c);
      const gap = cw * 1.15;
      const tx = dk.width * 1.4 + i * gap, ty = 0;
      const depth = -dk.height * 0.04;
      const tf = (x, y, a, sc) => `translate(${x}px, ${y}px) rotateY(${a}deg) scale(${sc})`;
      anims.push(c.querySelector('.flip').animate([
        { transform: tf(0, 0, 180, 1), offset: 0 },
        { transform: tf(dk.width * 0.15, -dk.height * 0.18, 180, 1.04), offset: 0.08 },
        { transform: tf(tx, ty, 0, 1.05), offset: 0.24 },
        { transform: tf(tx, ty, 0, 1.05), offset: 0.76 },
        { transform: tf(tx * 0.4, -dk.height * 0.12, 150, 1.03), offset: 0.9 },
        { transform: tf(dk.width * 0.06, depth, 180, 1), offset: 1 },
      ], { duration: 2400 + show - 1500, delay: i * 200, easing: 'cubic-bezier(0.3, 0.6, 0.3, 1)', fill: 'both' }));
    });
    hold(2400 + (o.cards.length - 1) * 200 + 40, () => { anims.forEach(a => a.cancel()); clones.forEach(c => c.remove()); });
  }

  // A riffle shuffle: cut the deck in two, pull the halves apart, let the
  // cards fall back in alternately, square it up.
  let pendingShuffle = false;
  function riffle() {
    const deck = $('deck');
    const statics = [...deck.querySelectorAll(':scope > .pcard')];
    statics.forEach(c => { c.style.visibility = 'hidden'; });
    const N = 14, anims = [], cards = [];
    for (let i = 0; i < N; i++) {
      const c = document.createElement('div');
      c.className = 'pcard back';
      c.style.zIndex = String(2 + i);
      deck.appendChild(c);
      cards.push(c);
    }
    const D = 1700;
    cards.forEach((c, i) => {
      const leftHalf = i % 2 === 0, side = leftHalf ? -1 : 1;
      const lift = -(i >> 1) * 1.2;
      const order = i;                       // falls back in the order they alternate
      const fall = 0.42 + order * (0.36 / N);
      anims.push(c.animate([
        { transform: `translate(0, ${-i * 0.6}px)`, offset: 0 },
        { transform: `translate(${side * 62}%, ${lift}px) rotate(${side * 9}deg)`, offset: 0.24 },
        { transform: `translate(${side * 62}%, ${lift}px) rotate(${side * 9}deg)`, offset: Math.max(0.25, fall - 0.04) },
        { transform: `translate(${side * 8}%, ${-i * 0.6}px) rotate(${side * 2}deg)`, offset: fall + 0.06 },
        { transform: `translate(0, ${-i * 0.6}px)`, offset: 0.9 },
        { transform: `translate(0, ${-i * 0.6}px)`, offset: 1 },
      ], { duration: D, easing: 'ease-in-out', fill: 'both' }));
    });
    hold(D + 30, () => {
      anims.forEach(a => a.cancel());
      cards.forEach(c => c.remove());
      statics.forEach(c => { c.style.visibility = ''; });
    });
  }

  function shuffleDeck() {
    if (IS_VIEWER) return;
    finishAnim();
    refill('cards');
    delete S.last.cards;
    S.shuffleId = (S.shuffleId || 0) + 1;
    pendingShuffle = true;
    S.rollId++;
    render(); emitState(true);
  }
  const cardName = id => `${['Ace', '2', '3', '4', '5', '6', '7', '8', '9', '10', 'Jack', 'Queen', 'King'][id % 13]} of ${['spades', 'hearts', 'diamonds', 'clubs'][Math.floor(id / 13)]}`;

  // ── Spinner ─────────────────────────────────────────────────────────────────
  // The wheel element persists across renders so its rotation can transition;
  // it is rebuilt only when the sectors (or the size) change.
  let wheelBuiltFor = '';
  function renderSpinner(play) {
    const sec = spinnerSectors(), sig = JSON.stringify(sec);
    const o = S.last.spinner;
    const sz = fitSize(1, 0.8, 0.02, 640);
    resultEl.style.setProperty('--sz', sz + 'px');
    if (wheelBuiltFor !== sig || !$('wheel')) {
      wheelBuiltFor = sig;
      const tot = sec.reduce((s, x) => s + x.w, 0);
      let a0 = 0, segs = '', pegs = '';
      sec.forEach((s, i) => {
        const a1 = a0 + s.w / tot * 360;
        segs += sectorPath(a0, a1, i, s.label, sec.length);
        if (sec.length > 1) pegs += pegAt(a0);
        a0 = a1;
      });
      resultEl.innerHTML =
        `<div id="wheel-wrap"><svg viewBox="-6 -16 112 140"><defs>
          <radialGradient id="sheen" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity="0.38"/><stop offset="0.55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.18"/></radialGradient>
          <radialGradient id="hubg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#c4c8cf"/><stop offset="1" stop-color="#5e636c"/></radialGradient>
          <linearGradient id="rimg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a52"/><stop offset="1" stop-color="#1c1c20"/></linearGradient>
          <linearGradient id="standg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2a2f"/><stop offset="0.5" stop-color="#55555d"/><stop offset="1" stop-color="#2a2a2f"/></linearGradient>
          <filter id="wsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#000" flood-opacity="0.32"/></filter>
        </defs>
        <ellipse cx="50" cy="121" rx="30" ry="2.6" fill="rgba(0,0,0,0.2)"/>
        <path d="M45,92 L41,118 L59,118 L55,92 Z" fill="url(#standg)"/>
        <rect x="28" y="116" width="44" height="5.5" rx="2.7" fill="url(#standg)"/>
        <circle cx="50" cy="50" r="50" fill="url(#rimg)" filter="url(#wsh)"/>
        <g id="wheel" style="transform:rotate(${-S.spin}deg)">${segs}${pegs}</g>
        <circle cx="50" cy="50" r="46" fill="url(#sheen)" pointer-events="none"/>
        <circle cx="50" cy="50" r="8.2" fill="url(#hubg)" stroke="#4a4e55" stroke-width="0.5" filter="url(#wsh)"/>
        <circle cx="50" cy="50" r="2.4" fill="#4a4e55"/>
        <g id="ptr" filter="url(#wsh)">
          <path d="M50,10 C46,3 43.2,-1 43.2,-6 A6.8,6.8 0 1 1 56.8,-6 C56.8,-1 54,3 50,10 Z" fill="#d7263d" stroke="#fff" stroke-width="1.1"/>
          <circle cx="50" cy="-6" r="2.1" fill="#fff"/>
        </g></svg></div>` +
        `<div class="caption" id="spin-label"></div>`;
    }
    const wheel = $('wheel'), label = $('spin-label');
    const showLabel = () => {
      label.innerHTML = '';
    };
    if (play) {
      label.innerHTML = '&nbsp;';
      wheel.classList.add('spinning');
      reflow(wheel);
      wheel.style.transform = `rotate(${-S.spin}deg)`;
      const stopTick = tickPointer(wheel, sec);
      const stop = () => { stopTick(); wheel.classList.remove('spinning'); showLabel(); label.classList.add('fade'); };
      wheel.addEventListener('transitionend', function te(e) { if (e.target === wheel) { wheel.removeEventListener('transitionend', te); finishAnim(); } });
      hold(4700, stop, { kind: 'spin' });
    } else {
      wheel.classList.remove('spinning');
      wheel.style.transform = `rotate(${-S.spin}deg)`;
      showLabel();
    }
  }

  // The pointer flicks each time a peg passes under it, which is most of
  // what makes a prize wheel feel like one.
  function tickPointer(wheel, sec) {
    const ptr = $('ptr'); if (!ptr) return () => {};
    const tot = sec.reduce((s, x) => s + x.w, 0);
    const bounds = []; let a = 0;
    sec.forEach(s => { bounds.push(a); a += s.w / tot * 360; });
    let last = null, raf = 0, alive = true;
    const angleNow = () => {
      const m = getComputedStyle(wheel).transform;
      if (!m || m === 'none') return 0;
      const v = m.match(/matrix\(([^)]+)\)/); if (!v) return 0;
      const [ma, mb] = v[1].split(',').map(parseFloat);
      return ((-Math.atan2(mb, ma) * 180 / Math.PI) % 360 + 360) % 360;
    };
    const sectorOf = ang => { let k = 0; for (let i = 0; i < bounds.length; i++) if (ang >= bounds[i]) k = i; return k; };
    const loop = () => {
      if (!alive) return;
      const k = sectorOf(angleNow());
      if (last !== null && k !== last && bounds.length > 1) {
        ptr.style.transition = 'none';
        ptr.style.transform = 'rotate(-24deg)';
        reflow(ptr);
        ptr.style.transition = '';
        ptr.style.transform = '';
      }
      last = k;
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => { alive = false; cancelAnimationFrame(raf); ptr.style.transform = ''; };
  }

  function sectorPath(a0, a1, i, label, n) {
    // Angles clockwise from 12 o'clock, so the pointer at the top reads the
    // sector the wheel stops under.
    const pt = (a, r) => [50 + r * Math.sin(a * Math.PI / 180), 50 - r * Math.cos(a * Math.PI / 180)];
    const [x0, y0] = pt(a0, 46), [x1, y1] = pt(a1, 46);
    const large = a1 - a0 > 180 ? 1 : 0;
    const d = a1 - a0 >= 359.99
      ? 'M50,4 A46,46 0 1,1 49.99,4 Z'
      : `M50,50 L${x0.toFixed(2)},${y0.toFixed(2)} A46,46 0 ${large},1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`;
    let text = '';
    if (n <= 20 && a1 - a0 >= 9) {
      // Labels run along the radius, reading outward, like a real wheel.
      const mid = (a0 + a1) / 2, [tx, ty] = pt(mid, 28);
      const short = label.length > 14 ? label.slice(0, 13) + '…' : label;
      const fs = Math.max(3.2, Math.min(8, 62 / Math.max(3.5, short.length + 1.5), (a1 - a0) / 3.6));
      const rot = mid <= 180 ? mid - 90 : mid + 90;
      text = `<text class="lbl" x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" font-size="${fs.toFixed(2)}" transform="rotate(${rot.toFixed(1)} ${tx.toFixed(2)} ${ty.toFixed(2)})">${escHtml(short)}</text>`;
    }
    return `<path d="${d}" style="fill:var(--hue-${i % HUES})" stroke="rgba(255,255,255,0.55)" stroke-width="0.5"/>${text}`;
  }
  function pegAt(a) {
    const x = 50 + 48 * Math.sin(a * Math.PI / 180), y = 50 - 48 * Math.cos(a * Math.PI / 180);
    return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.5" fill="#f1f1ee" stroke="#8b8b90" stroke-width="0.35"/>`;
  }
  // The wheel turns by -angle; the pointer then reads the sector at `angle`
  // (mod 360). Always spin forward several turns to land there.
  function targetAngle(o) {
    const sec = spinnerSectors(), tot = sec.reduce((s, x) => s + x.w, 0);
    let a0 = 0;
    for (let i = 0; i < o.i; i++) a0 += sec[i].w / tot * 360;
    const at = a0 + o.frac * sec[o.i].w / tot * 360;
    return Math.ceil(S.spin / 360) * 360 + 360 * 5 + at;
  }

  // ── Number reels ────────────────────────────────────────────────────────────
  function odoHtml(text) {
    return `<div class="odo" id="odo">${[...text].map(ch => /\d/.test(ch)
      ? `<span class="reel"><span class="strip" data-d="${ch}">${'0123456789'.repeat(3).split('').map(d => `<span>${d}</span>`).join('')}</span></span>`
      : `<span class="sym">${escHtml(ch)}</span>`).join('')}</div>`;
  }
  function fitOdo(len) {
    const r = resultEl.getBoundingClientRect();
    const units = len * 0.88 + 0.4;
    const fs = Math.max(20, Math.min(r.height * 0.36, (r.width - 60) / units, 190));
    $('odo').style.fontSize = fs + 'px';
  }
  function spinReels(play) {
    const strips = [...resultEl.querySelectorAll('.reel .strip')];
    let longest = 0;
    strips.forEach((s, i) => {
      const d = +s.dataset.d;
      if (!play) { s.style.transition = 'none'; s.style.transform = `translateY(-${(20 + d) * 1.2}em)`; return; }
      s.style.transition = 'none';
      s.style.transform = `translateY(-${jiggle(0, 9) * 1.2}em)`;
      reflow(s);
      const dur = 0.9 + i * 0.16;
      longest = Math.max(longest, dur);
      s.style.transition = `transform ${dur}s cubic-bezier(0.15, 0.8, 0.25, 1)`;
      s.style.transform = `translateY(-${(20 + d) * 1.2}em)`;
    });
    return longest * 1000;
  }
  function renderReelValue(text, captionHtml, play, emptyHint, digits) {
    if (text == null) {
      const blank = '0'.repeat(digits || 1);
      resultEl.innerHTML = `<div class="ghost">${odoHtml(blank)}</div>${emptyHint}`;
      fitOdo(blank.length);
      spinReels(false);
      return;
    }
    resultEl.innerHTML = odoHtml(text) + (captionHtml ? `<div class="caption" id="cap">${captionHtml}</div>` : '');
    fitOdo(text.length);
    const ms = spinReels(play);
    if (play) hold(ms + 50, () => resultEl.querySelectorAll('.reel .strip').forEach(s => { s.style.transition = 'none'; }));
  }

  function renderNumber(o, play) {
    const st = S.setup.number;
    let note = '';
    if (st.unique) note = `<span class="note">${S.pool.number.length} of ${st.max - st.min + 1} used</span>`;
    const pad = v => String(v).padStart(st.digits, '0');
    renderReelValue(o ? pad(o.v) : null, note, play, '', st.digits);
  }

  // ── Name slot ───────────────────────────────────────────────────────────────
  function renderList(o, play) {
    const st = S.setup.list;
    if (o && o.type === 'order') {
      resultEl.innerHTML = `<ol class="order fade">${o.list.map((x, i) => `<li><span>${i + 1}</span>${escHtml(x)}</li>`).join('')}</ol>`;
      return;
    }
    if (o && o.type === 'groups') {
      resultEl.innerHTML = `<div class="groups fade">${o.groups.map((g, i) =>
        `<div class="group bw-card"><h4>Group ${i + 1}</h4>${g.map(x => `<div>${escHtml(x)}</div>`).join('')}</div>`).join('')}</div>`;
      return;
    }
    const name = o ? o.name : '?';
    const reel = play && st.items.length > 1
      ? Array.from({ length: 26 }, () => st.items[jiggle(0, st.items.length - 1)]).concat([name])
      : [name];
    resultEl.innerHTML =
      `<div class="slot${o ? '' : ' ghost'}" id="slot"><div class="strip">${reel.map(x => `<div>${escHtml(x)}</div>`).join('')}</div></div>` +
      (o && st.remove ? `<div class="bw-hint">${S.pool.list.length} left to pick</div>` : '');
    // Size by the longest name the reel will show, so it doesn't jump.
    const slot = $('slot'), r = resultEl.getBoundingClientRect();
    let fs = Math.min(r.height * 0.3, 150);
    slot.style.fontSize = fs + 'px';
    for (let i = 0; i < 14 && slot.getBoundingClientRect().width > r.width - 50 && fs > 18; i++) { fs *= 0.88; slot.style.fontSize = fs + 'px'; }
    const strip = slot.querySelector('.strip');
    strip.style.transform = `translateY(-${(reel.length - 1) * 1.3}em)`;
    if (play && reel.length > 1) {
      strip.style.transition = 'none';
      strip.style.transform = 'translateY(0)';
      reflow(strip);
      strip.style.transition = 'transform 1.7s cubic-bezier(0.12, 0.75, 0.18, 1)';
      strip.style.transform = `translateY(-${(reel.length - 1) * 1.3}em)`;
      hold(1750, () => { strip.style.transition = 'none'; });
    }
  }

  // ── Animation ───────────────────────────────────────────────────────────────
  // Purely cosmetic: the outcome is already decided and in S, so cutting an
  // animation short (a second press, a mode switch) just shows it sooner.
  let anim = null;
  function finishAnim(silent) {
    if (!anim) return;
    const a = anim; anim = null;
    clearTimeout(a.timer);
    if (silent && a.kind === 'spin') {
      const w = $('wheel');
      if (w) { w.classList.remove('spinning'); }
    }
    a.done && a.done();
  }

  // ── Socket.IO sync ──────────────────────────────────────────────────────────
  let socket = null, syncTimer = null;

  function initSocket(url) {
    if (typeof io === 'undefined') { socket = { emit() {}, on() {} }; return; }
    try {
      const prev = socket;
      socket = io(url || (window.BeamerWidget ? BeamerWidget.serverOrigin() : ''),
                  { transports: ['websocket', 'polling'] });
      if (prev && prev.disconnect) prev.disconnect();
      socket.on('widget_state', data => {
        if (!IS_VIEWER || data?.widgetId !== WIDGET_ID) return;
        applyState(data.state || {}, true);
      });
    } catch (_) {
      socket = { emit() {}, on() {} };
    }
  }

  // `now`: an outcome the room is waiting on goes straight out; setup typing
  // is debounced.
  function emitState(now) {
    if (!socket || IS_VIEWER) return;
    clearTimeout(syncTimer);
    const send = () => socket.emit('widget_state', { widgetId: WIDGET_ID, state: getState() });
    if (now) send(); else syncTimer = setTimeout(send, 200);
  }

  // ── State serialisation ─────────────────────────────────────────────────────
  function getState() {
    return JSON.parse(JSON.stringify({
      v: 2, mode: S.mode, runs: S.runs, setup: S.setup, pool: S.pool,
      last: S.last, stats: S.stats, hist: S.hist, rng: S.rng, rollId: S.rollId, spin: S.spin, shuffleId: S.shuffleId || 0,
    }));
  }

  function applyState(s, live) {
    if (!s || typeof s !== 'object') return;
    const prevRoll = S.rollId;
    // The settings own the setup. Only a live viewer takes the presenter's,
    // in case its own copy of the settings is behind.
    if (live) {
      if (MODES.includes(s.mode)) S.mode = s.mode;
      if (s.setup && typeof s.setup === 'object') {
        for (const k of MODES) if (s.setup[k] && typeof s.setup[k] === 'object') S.setup[k] = { ...S.setup[k], ...s.setup[k] };
      }
    }
    if ([1, 10, 100, 1000].includes(s.runs)) S.runs = s.runs;
    if (s.pool && typeof s.pool === 'object') S.pool = { ...S.pool, ...s.pool };
    if (s.last && typeof s.last === 'object') S.last = s.last;
    if (s.hist && typeof s.hist === 'object') S.hist = { dice: Array.isArray(s.hist.dice) ? s.hist.dice : [], coin: Array.isArray(s.hist.coin) ? s.hist.coin : [] };
    if (s.stats && typeof s.stats === 'object') S.stats = s.stats;
    if (typeof s.rng === 'number') S.rng = s.rng >>> 0;
    if (typeof s.spin === 'number') S.spin = s.spin;
    if (typeof s.rollId === 'number') S.rollId = s.rollId;
    if (typeof s.shuffleId === 'number') { if (live && s.shuffleId !== (S.shuffleId || 0) && S.mode === 'cards') pendingShuffle = true; S.shuffleId = s.shuffleId; }
    ensurePools();
    // A viewer animates a fresh outcome the way the presenter's screen did;
    // a restored slide just shows where it was.
    render(!!live && S.rollId !== prevRoll);
  }

  // ── Config ──────────────────────────────────────────────────────────────────
  let lastSeed = null;
  function applyConfig(c) {
    if (!c) return;
    const prevUrl = cfg.socketUrl;
    cfg = { ...cfg, ...c };
    WIDGET_ID = cfg.id || cfg.widgetId || WIDGET_ID;
    IS_VIEWER = cfg.role === 'viewer' || IS_VIEWER;
    const nextMode = MODES.includes(cfg.mode) ? cfg.mode : 'dice';
    if (nextMode !== S.mode) finishAnim(true);
    S.mode = nextMode;
    adoptSetup(setupFromConfig(cfg));
    // Only a changed seed re-seeds, so re-sent config doesn't restart a demo.
    const seed = String(cfg.seed || '');
    if (seed !== lastSeed) {
      if (lastSeed !== null || !S.rollId) S.rng = freshSeed();
      lastSeed = seed;
    }
    if (cfg.socketUrl && cfg.socketUrl !== prevUrl) initSocket(cfg.socketUrl);
    render();
    if (!IS_VIEWER && lastSeed !== null) emitState();
  }

  function destroy() {
    finishAnim(true);
    clearTimeout(syncTimer);
    clearTimeout(resizeTimer);
    if (ro) ro.disconnect();
    if (socket && socket.disconnect) socket.disconnect();
    socket = null;
  }

  // ── Beamer+ message bridge ──────────────────────────────────────────────────
  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === 'widget-config')  applyConfig(d.config);
    if (d.type === 'widget-cleanup') destroy();
    if (d.type === 'widget-get-state') {
      window.parent.postMessage({ type: 'widget-state', widgetId: WIDGET_ID, state: getState() }, '*');
    }
    if (d.type === 'widget-set-state' && d.state) applyState(d.state, false);
  });

  // ── Event wiring ────────────────────────────────────────────────────────────
  resultEl.addEventListener('click', e => {
    if (IS_VIEWER) return;
    // The list views are for reading, not another pick.
    if (e.target.closest('.order, .groups') || isExhausted()) return;
    go();
  });
  deckBtn.addEventListener('click', shuffleDeck);
  shuffleBtn.addEventListener('click', shuffleList);
  groupsBtn.addEventListener('click', makeGroups);


  // Space / Enter goes, S toggles stats — from anywhere except a field.
  document.addEventListener('keydown', e => {
    if (IS_VIEWER || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!isExhausted()) go(); }
  });

  // Re-fit dice / wheel / numbers to the region, without replaying anything.
  let resizeTimer = null, ro = null;
  try {
    ro = new ResizeObserver(() => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (!anim) { wheelBuiltFor = ''; renderResult(false); } }, 60);
    });
    ro.observe(resultEl);
  } catch (_) { /* very old engines: fixed sizes are fine */ }

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Boot ────────────────────────────────────────────────────────────────────
  S.rng = freshSeed();
  initSocket(CFG0.socketUrl);
  applyConfig(CFG0);
  render();

  // The shared bar's reset means clear the results, not reload the widget.
  (function wireReset(tries) {
    if (window.BeamerWidget && BeamerWidget.topbar) { BeamerWidget.topbar.onReset(reset); return; }
    if (tries > 0) setTimeout(() => wireReset(tries - 1), 120);
  })(20);
})();
</script>
</body>
</html>
