<!DOCTYPE html>
<!--
  Beamer+ Camera Widget
  =====================
  IMPORTANT: The iframe hosting this widget must have:
    allow="camera; autoplay; fullscreen"
  The default iframe-widget-renderer.js sets "autoplay; fullscreen" only.
  You must also add "camera" to the allow attribute for getUserMedia to work.
-->
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "Camera",
  "category": "Tools",
  "fields": []
}
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="permissions-policy" content="camera=*" />
  <title>Camera — Beamer+</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap');

/* ── Light mode (default) ── */
:root {
  --red:       #dc2626;
  --radius:    6px;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --font-ui:   'DM Sans', system-ui, sans-serif;

  --idle-bg:          #f5f5f4;
  --idle-icon-color:  #1a1a18;
  --idle-icon-opacity: 0.18;
  --idle-label-color: rgba(26,26,24,0.32);

  --error-bg:         #f5f5f4;
  --error-icon-color: #1a1a18;
  --error-text-color: rgba(26,26,24,0.5);
  --retry-bg:         rgba(0,0,0,0.06);
  --retry-border:     rgba(0,0,0,0.12);
  --retry-text:       rgba(26,26,24,0.6);
  --retry-bg-hover:   rgba(0,0,0,0.11);
}

/* ── Dark mode ── */
@media (prefers-color-scheme: dark) {
  :root {
    --idle-bg:          #111;
    --idle-icon-color:  #fff;
    --idle-icon-opacity: 0.25;
    --idle-label-color: rgba(255,255,255,0.25);

    --error-bg:         #111;
    --error-icon-color: #fff;
    --error-text-color: rgba(255,255,255,0.45);
    --retry-bg:         rgba(255,255,255,0.08);
    --retry-border:     rgba(255,255,255,0.15);
    --retry-text:       rgba(255,255,255,0.55);
    --retry-bg-hover:   rgba(255,255,255,0.14);
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }

#root {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--idle-bg);
  overflow: hidden;
  cursor: pointer;
}

/* ── Idle screen (camera off) ── */
#idle-screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: var(--idle-bg);
  pointer-events: none;
}
#idle-screen svg {
  opacity: var(--idle-icon-opacity);
  color: var(--idle-icon-color);
}
#idle-screen .idle-label {
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--idle-label-color);
}
#idle-screen.hidden { display: none; }

/* ── Live video ── */
#video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}
#video.visible { display: block; }
#video.mirrored { transform: scaleX(-1); }

/* ── Snapshot flash ── */
#flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.05s ease;
}
#flash.active { opacity: 0.85; }

/* ── LIVE badge ── */
#live-badge {
  position: absolute;
  top: 12px; right: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  padding: 4px 8px;
  border-radius: var(--radius);
  backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
#live-badge.visible { opacity: 1; }
#live-badge .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--red);
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.4; transform: scale(0.8); }
}

/* ── Bottom control bar ── */
#bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 100%);
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}
#root.live:hover #bar { opacity: 1; pointer-events: auto; }

#device-select {
  flex: 1; min-width: 0;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  font-family: var(--font-ui);
  font-size: 13px;
  padding: 5px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  appearance: none;
  backdrop-filter: blur(4px);
  outline: none;
}
#device-select:focus { border-color: rgba(255,255,255,0.5); }
#device-select option { background: #222; color: #fff; }

.bar-btn {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: var(--radius);
  color: #fff;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  backdrop-filter: blur(4px);
  padding: 0;
}
.bar-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
.bar-btn.active { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
.bar-btn svg { display: block; }

/* ── Error screen ── */
#error-screen {
  position: absolute; inset: 0;
  display: none;
  flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px;
  background: var(--error-bg);
  text-align: center;
  padding: 24px;
}
#error-screen.visible { display: flex; }
#error-screen svg { color: var(--error-icon-color); }
#error-msg {
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--error-text-color);
  max-width: 260px;
  line-height: 1.5;
}
#retry-btn {
  padding: 7px 20px;
  background: var(--retry-bg);
  border: 1px solid var(--retry-border);
  border-radius: var(--radius);
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--retry-text);
  cursor: pointer;
  transition: background 0.15s;
}
#retry-btn:hover { background: var(--retry-bg-hover); }
  </style>
</head>
<body>
  <div id="root">
    <!-- Idle screen (camera off) -->
    <div id="idle-screen">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 7l-7 5 7 5V7z"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      <div class="idle-label">Click to start camera</div>
    </div>

    <!-- Live video -->
    <video id="video" autoplay playsinline muted></video>

    <!-- Snapshot flash -->
    <div id="flash"></div>

    <!-- LIVE badge -->
    <div id="live-badge"><span class="dot"></span> LIVE</div>

    <!-- Bottom control bar -->
    <div id="bar" data-bw-topbar>
      <select id="device-select" title="Camera device"></select>

      <button class="bar-btn" id="snapshot-btn" title="Snapshot">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="16" height="12" rx="2"/>
          <circle cx="9" cy="10" r="3"/>
          <path d="M6 4l1.5-2h3L12 4"/>
        </svg>
      </button>

      <button class="bar-btn" id="mirror-btn" title="Mirror">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 2v14"/>
          <path d="M3 5l4 4-4 4"/>
          <path d="M15 5l-4 4 4 4"/>
        </svg>
      </button>
    </div>

    <!-- Error screen -->
    <div id="error-screen">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.22">
        <path d="M23 7l-7 5 7 5V7z"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        <line x1="1" y1="1" x2="23" y2="23" stroke-width="2"/>
      </svg>
      <div id="error-msg">Camera unavailable</div>
      <button id="retry-btn">Retry</button>
    </div>
  </div>

  <script>
  (function () {
    const root        = document.getElementById('root');
    const idleScreen  = document.getElementById('idle-screen');
    const video       = document.getElementById('video');
    const flash       = document.getElementById('flash');
    const liveBadge   = document.getElementById('live-badge');
    const deviceSel   = document.getElementById('device-select');
    const snapshotBtn = document.getElementById('snapshot-btn');
    const mirrorBtn   = document.getElementById('mirror-btn');
    const errorScreen = document.getElementById('error-screen');
    const errorMsg    = document.getElementById('error-msg');
    const retryBtn    = document.getElementById('retry-btn');

    let currentStream = null;
    let mirrored      = false;
    let devicesListed = false;
    let cameraOn      = false;
    let expandTimer   = null;
    let cfg           = {};

    // ── UI state ──────────────────────────────────────────────────────────────

    function showIdle() {
      idleScreen.classList.remove('hidden');
      video.classList.remove('visible');
      liveBadge.classList.remove('visible');
      root.classList.remove('live');
      errorScreen.classList.remove('visible');
    }

    function showLive() {
      idleScreen.classList.add('hidden');
      video.classList.add('visible');
      liveBadge.classList.add('visible');
      root.classList.add('live');
      errorScreen.classList.remove('visible');
    }

    function showError(msg) {
      errorMsg.textContent = msg || 'Camera unavailable';
      idleScreen.classList.add('hidden');
      video.classList.remove('visible');
      liveBadge.classList.remove('visible');
      root.classList.remove('live');
      errorScreen.classList.add('visible');
    }

    // ── Camera control ────────────────────────────────────────────────────────

    function stopStream() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }
    }

    function clearExpandTimer() {
      if (expandTimer) { clearTimeout(expandTimer); expandTimer = null; }
    }

    async function listDevices() {
      if (devicesListed) return;
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const inputs  = devices.filter(d => d.kind === 'videoinput');
        deviceSel.innerHTML = '';
        inputs.forEach((d, i) => {
          const opt = document.createElement('option');
          opt.value = d.deviceId;
          opt.textContent = d.label || `Camera ${i + 1}`;
          deviceSel.appendChild(opt);
        });
        devicesListed = true;
      } catch (_) {}
    }

    async function startCamera(deviceId) {
      stopStream();
      clearExpandTimer();
      try {
        const constraints = {
          video: deviceId ? { deviceId: { exact: deviceId } } : true,
          audio: false,
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream;
        video.srcObject = stream;
        await video.play();
        cameraOn = true;
        showLive();
        await listDevices();
        const track = stream.getVideoTracks()[0];
        if (track?.getSettings()?.deviceId) {
          deviceSel.value = track.getSettings().deviceId;
        }
        // Auto-expand after configured delay
        const delay = cfg.expandDelay;
        if (delay != null && delay >= 0) {
          expandTimer = setTimeout(() => {
            expandTimer = null;
            window.parent.postMessage(
              { type: 'widget-expand', widgetId: cfg.id || cfg.widgetId },
              '*'
            );
          }, delay * 1000);
        }
      } catch (err) {
        cameraOn = false;
        let msg = 'Camera unavailable';
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')
          msg = 'Camera access denied. Allow camera permission and retry.';
        else if (err.name === 'NotFoundError')
          msg = 'No camera found on this device.';
        else if (err.name === 'NotReadableError')
          msg = 'Camera is in use by another application.';
        showError(msg);
      }
    }

    function stopCamera() {
      clearExpandTimer();
      stopStream();
      cameraOn = false;
      showIdle();
      window.parent.postMessage(
        { type: 'widget-collapse', widgetId: cfg.id || cfg.widgetId },
        '*'
      );
    }

    function toggleCamera() {
      if (cameraOn) stopCamera();
      else startCamera(deviceSel.value || cfg.deviceId || null);
    }

    function setMirror(val) {
      mirrored = !!val;
      video.classList.toggle('mirrored', mirrored);
      mirrorBtn.classList.toggle('active', mirrored);
    }

    function doSnapshot() {
      if (!currentStream) return;
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 200);
      const c = document.createElement('canvas');
      c.width  = video.videoWidth  || 1280;
      c.height = video.videoHeight || 720;
      const ctx = c.getContext('2d');
      if (mirrored) { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
      ctx.drawImage(video, 0, 0, c.width, c.height);
      c.toBlob(blob => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `snapshot-${Date.now()}.jpg`; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }, 'image/jpeg', 0.92);
    }

    // ── Events ────────────────────────────────────────────────────────────────

    root.addEventListener('click', toggleCamera);
    // Bar clicks must not bubble up to root (would toggle camera off)
    document.getElementById('bar').addEventListener('click', e => e.stopPropagation());

    deviceSel.addEventListener('change', () => {
      if (cameraOn) startCamera(deviceSel.value);
    });
    snapshotBtn.addEventListener('click', doSnapshot);
    mirrorBtn.addEventListener('click', () => setMirror(!mirrored));
    retryBtn.addEventListener('click', e => {
      e.stopPropagation();
      startCamera(deviceSel.value || cfg.deviceId || null);
    });

    // ── Messages ──────────────────────────────────────────────────────────────

    window.addEventListener('message', e => {
      if (e.data?.type === 'widget-config') {
        cfg = { ...cfg, ...(e.data.config || {}) };
        if (typeof cfg.mirror === 'boolean') setMirror(cfg.mirror);
      }
      if (e.data?.type === 'widget-cleanup') {
        clearExpandTimer();
        stopStream();
        window.parent.postMessage(
          { type: 'widget-collapse', widgetId: cfg.id || cfg.widgetId },
          '*'
        );
      }
    });

    showIdle();

    // getUserMedia requires a secure context (https or localhost)
    if (!window.isSecureContext) {
      showError('Camera requires HTTPS. Open via localhost or use launch.py which enables HTTPS.');
    }
  })();
  </script>
</body>
</html>
