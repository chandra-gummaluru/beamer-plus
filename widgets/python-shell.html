<!DOCTYPE html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "Python Shell",
  "category": "Computer Science",
  "fields": [
    { "key": "startup",    "label": "Startup lines (run at boot)",     "type": "textarea-lines", "rows": 4, "placeholder": "import numpy as np\nimport math" },
    { "key": "packages",   "label": "Preload packages (one per line)", "type": "textarea-lines", "rows": 3, "placeholder": "numpy\nsympy" },
    { "key": "autoImport", "label": "Auto-load packages from imports", "type": "checkbox", "default": true },
    { "key": "banner",     "label": "Show version banner",             "type": "checkbox", "default": true }
  ]
}
</script>
  <meta charset="UTF-8">
  <title>Python Shell — Beamer+</title>

  <!-- Real CPython, compiled to WebAssembly, running in this iframe. Same
       runtime and version the Coding Notebook widget uses, so a deck that has
       both downloads it once. Needs the network on first load; after that the
       browser cache carries it. -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

  <style>
    /* Tokens, reset and the .bw-* furniture come from the injected base
       stylesheet — what's here is the one thing this widget owns: a
       transcript that reads like a terminal but in the deck's own ink. */

    body { display: flex; flex-direction: column; }

    #term {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 16px 16px;
      background: var(--bg-output);
      font-family: var(--font-mono);
      font-size: var(--fs-code);
      line-height: 1.5;
      cursor: text;
      -webkit-user-select: text;
      user-select: text;
    }

    /* Every transcript entry and the live input line share this shape, so the
       caret sits exactly where the echoed text above it does. */
    .row {
      display: flex;
      align-items: flex-start;
      gap: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .ps {
      flex: 0 0 auto;
      color: var(--text-3);
      user-select: none;
      /* 4 mono characters: ">>> " and "... " line up, and so does the
         continuation body the user types after them. */
      width: 4ch;
    }

    .body { flex: 1 1 auto; min-width: 0; }

    .out  { white-space: pre-wrap; overflow-wrap: anywhere; }
    .val  { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
    .err  { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--err); }
    .note { color: var(--text-3); font-style: italic; }

    /* The input is a textarea, not a contenteditable: it gets paste, IME and
       undo for free, and grows to fit a pasted block. */
    #input {
      display: block;
      width: 100%;
      border: none;
      outline: none;
      padding: 0;
      margin: 0;
      resize: none;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      caret-color: var(--text);
    }

    #inputrow[hidden] { display: none; }

    /* Boot / fatal states reuse the shared loading furniture. */
    #boot { padding: 48px 20px; }
    #fatal { margin: 16px; }
  </style>
</head>
<body>
  <div id="term">
    <div id="out"></div>

    <div class="row" id="inputrow" hidden>
      <span class="ps" id="ps">&gt;&gt;&gt;&nbsp;</span>
      <div class="body"><textarea id="input" rows="1" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Python input"></textarea></div>
    </div>

    <div class="bw-boot" id="boot">
      <div class="bw-spinner"></div>
      <div class="bw-boot-msg" id="boot-msg">Starting Python…</div>
      <div class="bw-boot-sub" id="boot-sub">First load downloads the runtime</div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var CFG       = window.WIDGET_CONFIG || {};
  var WIDGET_ID = CFG.id;
  var IS_VIEWER = CFG.role === 'viewer';
  var INDEX_URL = 'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/';

  var PS1 = '>>> ';
  var PS2 = '... ';

  var termEl  = document.getElementById('term');
  var outEl   = document.getElementById('out');
  var rowEl   = document.getElementById('inputrow');
  var psEl    = document.getElementById('ps');
  var inputEl = document.getElementById('input');
  var bootEl  = document.getElementById('boot');

  // Python side, filled in by boot().
  var pyodide = null, pyconsole = null, awaitFut = null, reprShorten = null;
  var newConsole = null, clearBuffer = null;

  var busy = false;           // a statement is running — input is parked
  var continuation = false;   // the console wants more lines before it runs

  var history = [];           // submitted lines, oldest first
  var histIdx = -1;           // -1 = editing a fresh line
  var histDraft = '';         // what was typed before arrowing into history

  // Everything the transcript holds, so it can be saved with the deck and put
  // back the way it was. Kept alongside the DOM rather than scraped from it.
  var entries = [];

  /* ─── transcript ──────────────────────────────────────────────── */

  function atBottom() {
    return termEl.scrollHeight - termEl.scrollTop - termEl.clientHeight < 40;
  }

  function scrollDown() { termEl.scrollTop = termEl.scrollHeight; }

  // Append one entry. `kind` is what it is, not how it looks, so a restored
  // transcript renders identically to a live one.
  //   echo → a line the user submitted, with its prompt
  //   out / err / val / note → everything the console said back
  function write(kind, text, record) {
    if (record !== false) entries.push({ kind: kind, text: text });

    var stick = atBottom();
    var node;

    if (kind === 'echo') {
      node = document.createElement('div');
      node.className = 'row';
      var ps = document.createElement('span');
      ps.className = 'ps';
      ps.textContent = text.ps;
      var body = document.createElement('div');
      body.className = 'body';
      body.textContent = text.line;
      node.appendChild(ps);
      node.appendChild(body);
    } else {
      node = document.createElement('div');
      node.className = kind;
      node.textContent = text;
    }

    outEl.appendChild(node);
    if (stick) scrollDown();
    return node;
  }

  // stdout and stderr arrive in chunks, not lines, so consecutive chunks of the
  // same stream are merged into the node already on screen — otherwise
  // `print("a", end="")` twice would break across two blocks.
  var lastStream = null, lastStreamNode = null;

  function stream(kind, text) {
    if (!text) return;
    if (lastStream === kind && lastStreamNode) {
      lastStreamNode.textContent += text;
      entries[entries.length - 1].text += text;
      if (atBottom()) scrollDown();
      return;
    }
    lastStreamNode = write(kind, text);
    lastStream = kind;
  }

  function endStream() { lastStream = null; lastStreamNode = null; }

  function clearTranscript() {
    entries = [];
    outEl.textContent = '';
    endStream();
  }

  /* ─── input line ──────────────────────────────────────────────── */

  function setPrompt(p) {
    continuation = (p === PS2);
    psEl.textContent = p;
  }

  function currentPrompt() { return continuation ? PS2 : PS1; }

  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = inputEl.scrollHeight + 'px';
  }

  function setInput(v) {
    inputEl.value = v;
    autoGrow();
    // Caret to the end — arrowing through history should leave you ready to
    // edit the line, not in the middle of it.
    inputEl.selectionStart = inputEl.selectionEnd = v.length;
  }

  function setBusy(on) {
    busy = on;
    rowEl.hidden = on;
    if (!on) {
      autoGrow();
      focusInput();
    }
  }

  function focusInput() {
    if (IS_VIEWER || busy) return;
    try { inputEl.focus({ preventScroll: true }); } catch (e) { inputEl.focus(); }
  }

  // Clicking anywhere in the transcript puts the caret back in the input —
  // but not when a selection is being made, or copying output would be
  // impossible.
  termEl.addEventListener('mouseup', function () {
    var sel = window.getSelection();
    if (sel && String(sel).length) return;
    focusInput();
  });

  /* ─── indentation ─────────────────────────────────────────────── */
  // The console decides when a block is finished; what it can't do is type the
  // indentation for you. These two rules cover what a presenter actually does
  // at a prompt: keep the current indent, and step in after a colon.

  function nextIndent(line) {
    var indent = (line.match(/^[ \t]*/) || [''])[0];
    if (/:\s*(#.*)?$/.test(line)) indent += '    ';
    return indent;
  }

  /* ─── running ─────────────────────────────────────────────────── */

  function isPyProxy(v) {
    try {
      if (pyodide && pyodide.ffi && pyodide.ffi.PyProxy) return v instanceof pyodide.ffi.PyProxy;
      return !!(pyodide && pyodide.isPyProxy && pyodide.isPyProxy(v));
    } catch (e) { return false; }
  }

  /**
   * Push one source line at the console, exactly as CPython's REPL would:
   * an incomplete block asks for more, a complete one runs, and a non-None
   * result is echoed as its repr (and bound to `_`).
   */
  async function push(line, opts) {
    opts = opts || {};
    if (opts.echo !== false) write('echo', { ps: currentPrompt(), line: line });
    endStream();

    var fut;
    try {
      fut = pyconsole.push(line);
    } catch (e) {
      write('err', String(e && e.message || e));
      setPrompt(PS1);
      return;
    }

    if (fut.syntax_check === 'incomplete') {
      setPrompt(PS2);
      // The console knows the block isn't finished; what it can't do is type
      // the indentation, so the next line starts where Python expects it.
      if (opts.typed) setInput(nextIndent(line));
      fut.destroy();
      return;
    }
    if (fut.syntax_check === 'syntax-error') {
      write('err', String(fut.formatted_error || '').replace(/\s+$/, ''));
      setPrompt(PS1);
      fut.destroy();
      return;
    }

    setPrompt(PS1);
    setBusy(true);

    // `import numpy` at the prompt should just work. The fetch needs the
    // network, so a failure here is reported by the import itself rather than
    // as a separate error the presenter can't act on.
    if (CFG.autoImport !== false) {
      try { await pyodide.loadPackagesFromImports(line); } catch (e) {}
    }

    var wrapped = null;
    try {
      wrapped = awaitFut(fut);
      var res = await wrapped;
      var value = res[0];
      if (value !== undefined) {
        write('val', reprShorten.callKwargs(value, { separator: '\n<…long output truncated…>\n' }));
      }
      if (isPyProxy(value)) value.destroy();
    } catch (e) {
      // A Python-level failure carries the traceback the console formatted;
      // anything else is a bug in the widget and is shown raw.
      var msg = fut.formatted_error || (e && e.message) || String(e);
      write('err', String(msg).replace(/\s+$/, ''));
    } finally {
      endStream();
      if (wrapped && wrapped.destroy) { try { wrapped.destroy(); } catch (e) {} }
      fut.destroy();
      setBusy(false);
      scrollDown();
    }
  }

  // A pasted block is a sequence of lines, not one line with newlines in it —
  // run them in order so `def` bodies and loops behave as if typed.
  async function pushMany(lines, opts) {
    for (var i = 0; i < lines.length; i++) {
      await push(lines[i], opts);
    }
    // A block left open by the paste needs its blank line to close, the same
    // way it would if the presenter had typed it.
    if (continuation) await push('', opts);
  }

  function submit() {
    var raw = inputEl.value;
    // A line the presenter left blank ends an open block — even though the
    // prompt pre-filled it with indentation, which Python would otherwise
    // read as "the block continues".
    if (!raw.trim()) raw = '';
    var lines = raw.split('\n');

    setInput('');
    if (raw.trim()) {
      history.push(raw);
      if (history.length > 500) history.shift();
    }
    histIdx = -1;
    histDraft = '';

    if (lines.length === 1) return push(lines[0], { typed: true });
    return pushMany(lines);
  }

  /* ─── keys ────────────────────────────────────────────────────── */

  function caretOnFirstLine() {
    return inputEl.value.lastIndexOf('\n', Math.max(0, inputEl.selectionStart - 1)) === -1;
  }

  function caretOnLastLine() {
    return inputEl.value.indexOf('\n', inputEl.selectionStart) === -1;
  }

  function recallHistory(delta) {
    if (!history.length) return;
    if (histIdx === -1) {
      if (delta > 0) return;          // already at the newest line
      histDraft = inputEl.value;
      histIdx = history.length - 1;
    } else {
      histIdx += delta;
      if (histIdx >= history.length) { histIdx = -1; setInput(histDraft); return; }
      if (histIdx < 0) histIdx = 0;
    }
    setInput(history[histIdx]);
  }

  inputEl.addEventListener('keydown', function (e) {
    if (busy) { e.preventDefault(); return; }

    // Enter runs; Shift+Enter adds a line to the same submission, for typing a
    // block out in full before running it.
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submit();
      return;
    }
    if (e.key === 'Enter' && e.shiftKey) {
      e.preventDefault();
      var v = inputEl.value;
      var at = inputEl.selectionStart;
      var lineStart = v.lastIndexOf('\n', at - 1) + 1;
      var indent = nextIndent(v.slice(lineStart, at));
      inputEl.value = v.slice(0, at) + '\n' + indent + v.slice(inputEl.selectionEnd);
      inputEl.selectionStart = inputEl.selectionEnd = at + 1 + indent.length;
      autoGrow();
      return;
    }

    if (e.key === 'ArrowUp' && caretOnFirstLine()) { e.preventDefault(); recallHistory(-1); return; }
    if (e.key === 'ArrowDown' && caretOnLastLine()) { e.preventDefault(); recallHistory(+1); return; }

    // Ctrl+L clears the screen, Ctrl+C abandons what's typed and drops any
    // half-finished block — both as they behave in a real shell.
    if ((e.ctrlKey || e.metaKey) && (e.key === 'l' || e.key === 'L')) {
      e.preventDefault();
      clearTranscript();
      return;
    }
    if (e.ctrlKey && (e.key === 'c' || e.key === 'C') && !String(window.getSelection() || '')) {
      e.preventDefault();
      abandonInput();
      return;
    }

    if (e.key === 'Tab') {
      e.preventDefault();
      complete();
      return;
    }
  });

  inputEl.addEventListener('input', autoGrow);

  function abandonInput() {
    if (inputEl.value.trim()) write('echo', { ps: currentPrompt(), line: inputEl.value + '  ^C' });
    setInput('');
    try { if (pyconsole && clearBuffer) clearBuffer(pyconsole); } catch (e) {}
    setPrompt(PS1);
  }

  /* ─── completion ──────────────────────────────────────────────── */
  // The console knows the namespace, so Tab asks it rather than guessing. One
  // match completes in place; several are listed the way a shell lists them.

  function complete() {
    if (!pyconsole) return;
    var upto = inputEl.value.slice(0, inputEl.selectionStart);
    var matches, start;
    try {
      var res = pyconsole.complete(upto).toJs();
      matches = res[0];
      start = res[1];
    } catch (e) { return; }
    if (!matches || !matches.length) return;

    if (matches.length === 1) {
      var rest = inputEl.value.slice(inputEl.selectionStart);
      var head = upto.slice(0, start);
      setInput(head + matches[0] + rest);
      inputEl.selectionStart = inputEl.selectionEnd = (head + matches[0]).length;
      return;
    }

    write('echo', { ps: currentPrompt(), line: inputEl.value });
    write('note', matches.join('    '));
    scrollDown();
  }

  /* ─── boot ────────────────────────────────────────────────────── */

  function setBoot(msg, sub) {
    var m = document.getElementById('boot-msg');
    var s = document.getElementById('boot-sub');
    if (m) m.textContent = msg;
    if (s && sub !== undefined) s.textContent = sub;
  }

  function removeBoot() {
    if (bootEl && bootEl.parentNode) bootEl.parentNode.removeChild(bootEl);
    bootEl = null;
  }

  function fatal(message) {
    removeBoot();
    var b = document.createElement('div');
    b.className = 'bw-banner bw-banner--error';
    b.id = 'fatal';
    b.innerHTML = '<div><strong>Python couldn\'t start.</strong> ' + message + '</div>';
    termEl.insertBefore(b, rowEl);
  }

  function asList(v) {
    if (Array.isArray(v)) return v.filter(Boolean);
    if (typeof v === 'string') return v.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    return [];
  }

  // Packages ship either inside the Pyodide distribution or as a wheel on
  // PyPI; try the fast local path first and fall back to micropip, so a
  // presenter can name either kind without knowing which it is.
  async function loadPackages(names) {
    var failed = [];
    var micropip = null;
    for (var i = 0; i < names.length; i++) {
      var name = names[i];
      setBoot('Loading ' + name + '…');
      try {
        await pyodide.loadPackage(name);
        continue;
      } catch (e) {}
      try {
        if (!micropip) {
          await pyodide.loadPackage('micropip');
          micropip = pyodide.pyimport('micropip');
        }
        await micropip.install(name);
      } catch (e) {
        failed.push(name);
      }
    }
    return failed;
  }

  function makeConsole() {
    var c = newConsole();
    c.stdout_callback = function (s) { stream('out', s); };
    c.stderr_callback = function (s) { stream('err', s); };
    return c;
  }

  async function boot() {
    if (typeof loadPyodide !== 'function') {
      fatal('The Pyodide runtime could not be fetched. This widget needs an internet ' +
            'connection the first time it runs; afterwards the browser cache serves it.');
      return;
    }

    try {
      pyodide = await loadPyodide({ indexURL: INDEX_URL });
    } catch (e) {
      fatal('Loading the runtime failed: ' + (e && e.message ? e.message : String(e)));
      return;
    }

    var failed = await loadPackages(asList(CFG.packages));

    setBoot('Starting the interpreter…');

    // One namespace holds the helpers this widget needs on the Python side;
    // the console itself gets a clean __main__-shaped dict so the presenter's
    // names are the only ones `dir()` shows.
    var helpers = pyodide.globals.get('dict')();
    pyodide.runPython([
      'import builtins, sys',
      'from pyodide.console import PyodideConsole, repr_shorten',
      'from pyodide.ffi import to_js',
      '',
      '# A half-typed block lives in the console\'s buffer; Ctrl+C drops it.',
      'def clear_buffer(console):',
      '    console.buffer = []',
      '',
      'def new_console():',
      '    ns = {"__name__": "__main__", "__doc__": None, "__builtins__": builtins}',
      '    return PyodideConsole(ns)',
      '',
      '# The console hands back a Python future. Awaiting it here (rather than',
      '# from JS) keeps CPython\'s own rule that the last displayed value is _.',
      'async def await_fut(fut):',
      '    res = await fut',
      '    if res is not None:',
      '        builtins._ = res',
      '    return to_js([res], depth=1)',
      '',
      'version = sys.version.split()[0]',
    ].join('\n'), { globals: helpers });

    newConsole  = helpers.get('new_console');
    clearBuffer = helpers.get('clear_buffer');
    awaitFut    = helpers.get('await_fut');
    reprShorten = helpers.get('repr_shorten');
    var version = helpers.get('version');
    helpers.destroy();

    pyconsole = makeConsole();

    removeBoot();

    if (CFG.banner !== false) {
      write('note', 'Python ' + version + ' · Pyodide ' + (pyodide.version || '') +
                    ' — real CPython, in this browser tab.');
    }
    if (failed.length) {
      write('err', 'Could not install: ' + failed.join(', '));
    }

    rowEl.hidden = false;
    setPrompt(PS1);

    // Startup lines run through the prompt rather than behind it, so the room
    // sees what the shell was handed before the talk starts.
    var startup = asList(CFG.startup);
    if (startup.length) await pushMany(startup);

    if (IS_VIEWER) {
      inputEl.readOnly = true;
      inputEl.placeholder = 'The presenter is driving this shell';
    }

    wireTopbar();
    focusInput();
    ready = true;
    if (pendingState) { applyState(pendingState); pendingState = null; }
  }

  /* ─── top bar ─────────────────────────────────────────────────── */

  var topbarTries = 0;

  function wireTopbar() {
    var bw = window.BeamerWidget;
    if (!bw || !bw.topbar || IS_VIEWER) return;

    // The shared bar is built when the document finishes parsing. With the
    // runtime already in the browser cache, boot() can reach here first —
    // adding buttons then would silently drop them, so wait for the bar.
    if (!bw.topbar.el) {
      if (topbarTries++ > 40) return;
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', wireTopbar, { once: true });
      } else {
        setTimeout(wireTopbar, 50);
      }
      return;
    }

    bw.topbar.addButton({
      label: 'Clear',
      title: 'Clear the screen (Ctrl+L)',
      onClick: function () { clearTranscript(); focusInput(); },
    });

    bw.topbar.addButton({
      label: 'Restart',
      title: 'Throw away every name and start a fresh interpreter',
      onClick: restart,
    });

    // Reset means the same thing here as restarting: an empty screen and an
    // empty namespace, without the reload that would re-download the runtime.
    bw.topbar.onReset(restart);
  }

  function restart() {
    if (!pyconsole) return;
    try { pyconsole.destroy(); } catch (e) {}
    pyconsole = makeConsole();
    clearTranscript();
    history = [];
    histIdx = -1;
    setPrompt(PS1);
    setInput('');
    setBusy(false);
    write('note', 'Fresh interpreter — every name from before is gone.');
    focusInput();
  }

  /* ─── state ───────────────────────────────────────────────────── */
  // What travels with the deck is the transcript and the history, not the
  // namespace: re-running a saved session's code on load would repeat its side
  // effects, which is the last thing a presenter wants a slide to do.

  var ready = false, pendingState = null;

  function getState() {
    return {
      entries: entries.slice(-400),
      history: history.slice(-100),
    };
  }

  function applyState(state) {
    if (!state || !Array.isArray(state.entries)) return;
    // Only a shell that hasn't been used takes a saved transcript — otherwise
    // a re-render mid-talk would replace what's on screen with an older copy.
    if (entries.length) return;

    for (var i = 0; i < state.entries.length; i++) {
      var e = state.entries[i];
      if (!e || !e.kind) continue;
      write(e.kind, e.text);
    }
    history = Array.isArray(state.history) ? state.history.slice() : [];
    histIdx = -1;
    if (state.entries.length) {
      write('note', '— restored from the saved deck; the interpreter itself starts empty —');
    }
    scrollDown();
  }

  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'widget-get-state') {
      try {
        window.parent.postMessage({ type: 'widget-state', widgetId: WIDGET_ID, state: getState() }, '*');
      } catch (err) {}
      return;
    }
    if (d.type === 'widget-set-state' && d.state != null) {
      if (ready) applyState(d.state);
      else pendingState = d.state;      // still booting — apply once there's a prompt
      return;
    }
    if (d.type === 'widget-config' && d.config) {
      CFG = d.config;
      WIDGET_ID = CFG.id;
      return;
    }
    if (d.type === 'widget-cleanup') {
      try { pyconsole && pyconsole.destroy(); } catch (err) {}
      pyconsole = null;
      return;
    }
  });

  boot();
})();
</script>
</body>
</html>
