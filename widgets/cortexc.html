/* ============================================================================
   CortexC — Beamer+ widget stylesheet

   Beamer+ injects its design tokens (--bg, --text, --border, --radius,
   --font-ui, --font-mono, …) into every widget iframe BEFORE this stylesheet.

   So we never redefine those tokens — we consume them through `var(--token,
   fallback)`. In Beamer+ the host values win; opened standalone via index.html
   the fallbacks kick in and it still looks right.
   ========================================================================= */

:root {
  /* ── Inherited from Beamer+, with standalone fallbacks ── */
  --cx-bg: var(--bg, #ffffff);
  --cx-bg-subtle: var(--bg-subtle, #f9f9f8);
  --cx-bg-output: var(--bg-output, #fafaf9);
  --cx-border: var(--border, #e9e9e6);
  --cx-border-med: var(--border-med, #d4d4cf);
  --cx-text: var(--text, #1a1a18);
  --cx-text-2: var(--text-2, #6b6b65);
  --cx-text-3: var(--text-3, #aeaea5);
  --cx-accent: var(--accent, #52524e);
  --cx-accent-bg: var(--accent-bg, #f0f0ee);
  --cx-ok: var(--ok, #15803d);
  --cx-err: var(--err, #c0392b);
  --cx-radius: var(--radius, 6px);
  --cx-ui: var(--font-ui, "DM Sans", system-ui, sans-serif);
  --cx-mono: var(--font-mono, "JetBrains Mono", "Fira Code", ui-monospace, monospace);

  /* ── CortexC region accents ── */
  --cx-stack: #1e40af;
  --cx-stack-line: #93c5fd;
  --cx-stack-bg: #eff6ff;
  --cx-heap: #15803d;
  --cx-heap-line: #86efac;
  --cx-heap-bg: #f0fdf4;
  --cx-global: #6d28d9;
  --cx-global-line: #c4b5fd;
  --cx-global-bg: #f5f3ff;
  --cx-warn: #b45309;
  --cx-warn-bg: #fffbeb;
  --cx-ptr: #b45309;
  --cx-ptr-line: #fcd34d;
  --cx-ptr-bg: #fffbeb;
  --cx-err-bg: #fef2f2;
  --cx-ok-bg: #f0fdf4;

  /* ── Allocation-tint alphas (hue supplied inline by the visualizer) ── */
  --alloc-row-alpha: 0.07;
  --alloc-row-border-alpha: 0.2;
  --alloc-chip-alpha: 0.08;
  --alloc-chip-strong-alpha: 0.14;

/* ── Status strip ── */
.editor-statusbar {

/* Severity now colours the message itself rather than a separate pill. Warnings

/* ===========================================================================
   MEMORY PANEL
   ======================================================================== */

.memory-panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

.memory-regions {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) minmax(0, 0.55fr);
  position: relative;
  isolation: isolate;
  overflow: hidden;
}

.memory-region {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  position: relative;
  z-index: 1;
  border-top: 1px solid var(--cx-border);
}

.stack-region {
  grid-column: 1;
  grid-row: 1;
  border-top: 0;
  border-right: 1px solid var(--cx-border);
}

.heap-region {
  grid-column: 2;
  grid-row: 1;
  border-top: 0;
}

.global-region {
  grid-column: 1 / -1;
  grid-row: 2;
}

.region-header {
  flex-shrink: 0;
  padding: 6px 12px;
  font-size: calc(10px * var(--u));
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--cx-border);
}

/* Region headers are neutral chrome — colour in this widget is reserved for
   pointers and errors, so it means something when it appears. */
.stack-header,
.heap-header,
.global-header {
  color: var(--cx-text-2);
  background: var(--cx-bg-subtle);
  border-bottom-color: var(--cx-border);
}

.region-content {
  flex: 1;
  min-height: 0;
  padding: 8px;
  overflow-y: auto;
  background: var(--cx-bg);
  font-family: var(--cx-mono);
  font-size: calc(11.5px * var(--u));
}

/* ── Pointer arrows ── */
.pointer-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 4;
  overflow: visible;
}

.pointer-link-path {
  fill: none;
  stroke: var(--cx-ptr);
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.pointer-link-underlay {
  fill: none;
  stroke: var(--cx-bg);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.pointer-link-path.freed-link {
  stroke: var(--cx-err);
  stroke-dasharray: 5 4;
}

.pointer-arrow-head {
  fill: var(--cx-ptr);
}

.pointer-arrow-head.freed-arrow {
  fill: var(--cx-err);
}

/* ===========================================================================
   STACK FRAMES
   ======================================================================== */

/* Frames are not boxes. A caption line names the frame and its rows carry a
   shared left accent, so variables sit in the same grid as the unfilled slots
   and a new variable simply fills an address that was already on screen. */

/* No frame boxes, no captions, no left accent — a stack row looks exactly like
   the unfilled slot it replaced. The frame-* classes are still emitted so
   frame membership is inspectable, but nothing renders from them. */
.frame-row {
  animation: slideIn 0.18s ease;
}

/* ===========================================================================
   MEMORY CELLS
   ======================================================================== */

.mem-cell,
.global-cell {
  display: grid;
  /* Trailing spacer soaks up leftover width so name / value / address pack to
     the left instead of being stretched apart across the pane. */
  grid-template-columns: 78px 62px 54px minmax(0, 1fr);
  gap: 4px;
  align-items: center;
  padding: 3px 9px;
  transition: background 0.15s ease;
}

.global-cell {
  width: 100%;
}

.mem-cell:hover,
.global-cell:hover {
  background: var(--cx-bg-subtle);
}

.mem-cell.highlight {
  background: var(--cx-stack-bg);
}

/* Allocation membership reads from the background tint alone — no left bar. */
.mem-cell.allocation-linked,
.global-cell.allocation-linked {
  background: hsl(var(--alloc-hue) 70% 50% / var(--alloc-row-alpha));
}

.mem-cell.new-cell {
  animation: flashIn 0.45s ease;
}

.mem-cell.freed-cell {
  opacity: 0.45;
  text-decoration: line-through;
}

.mem-name {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  color: var(--cx-text);
  font-weight: 500;
}

.mem-name-label {
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mem-type {
  font-size: calc(9.5px * var(--u));
  color: var(--cx-text-3);
}

.mem-addr {
  font-size: calc(10px * var(--u));
  color: var(--cx-text-3);
  text-align: right;
  white-space: nowrap;
}

.mem-value {
  min-width: 28px;
  padding: 1px 6px;
  border: 1px solid var(--cx-border);
  border-radius: 3px;
  background: var(--cx-bg-subtle);
  color: var(--cx-text);
  font-weight: 500;
  text-align: center;
}

/* Everything pointer-related is amber, and amber is used for nothing else. */
.mem-value.pointer-val {
  color: var(--cx-ptr);
  border-color: var(--cx-ptr-line);
}

.mem-value.pointer-val.allocation-linked {
  color: hsl(var(--alloc-hue) 70% var(--alloc-text-lightness));
  border-color: hsl(var(--alloc-hue) 70% 50% / var(--alloc-chip-border-alpha));
  background: hsl(var(--alloc-hue) 70% 50% / var(--alloc-chip-alpha));
}

.mem-value.pointer-val.allocation-freed {
  color: var(--cx-err);
  border-color: color-mix(in srgb, var(--cx-err) 30%, transparent);
  background: var(--cx-err-bg);
}

/* ── Values spanning more than one slot ───────────────────────────────────
   One row scaled to the number of slots it covers, with a value box that
   stretches the full height so it reads as a single wide-in-memory cell. */

/* Compound selectors on purpose: `.memory-row` sets min-height and
   align-items further down this file, and at equal specificity the later rule
   would win — leaving a "spanning" row exactly one slot tall. */
.memory-row.memory-row-multi {
  min-height: calc(var(--row-slots, 1) * var(--cx-row-h));
  align-items: stretch;
}

.memory-row.memory-row-multi .mem-name,
.memory-row.memory-row-multi .memory-row-items {
  align-self: center;
}

.memory-row.memory-row-multi .mem-value {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  align-self: stretch;
  margin: 4px 0;
}

/* Every covered address stays listed, stacked down the address column. */
.memory-row.memory-row-multi .mem-addr {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  align-self: stretch;
  padding: 4px 0;
  line-height: 1.2;
}

.mem-value.null-val {
  color: var(--cx-text-3);
  background: var(--cx-bg-subtle);
  border-style: dashed;
}

.mem-value.freed {
  color: var(--cx-err);
  text-decoration: line-through;
}

/* ===========================================================================
   HEAP ALLOCATIONS
   ========================================================================
   Allocations are flat rows sharing a hue, not boxes with headers. The hue is
   set inline per row by the visualizer. */

/* A freed allocation is carried by the struck-through value, not a bar. */
.memory-row.allocation-freed .mem-value {
  color: var(--cx-err);
  text-decoration: line-through;
}

/* ===========================================================================
   GLOBAL REGION / MEMORY ROWS
   ======================================================================== */

.global-region .region-content {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
}

.memory-row {
  /* Fixed widths, not auto: every row is its own grid container, so content-
     sized columns would differ row to row and the addresses would stop lining
     up. These are sized to the content that actually appears — a short
     declaration, a number or an address, and a 6-digit hex address — with a
     trailing spacer taking the slack so the row packs left. */
  grid-template-columns: 78px 62px 54px minmax(0, 1fr);
  gap: 4px;
  min-height: var(--cx-row-h);
  padding: 4px 9px;
  border-bottom: 1px solid var(--cx-border);
}

.memory-row:last-child {
  border-bottom: 0;
}

.memory-row.memory-row-grouped {
  background: hsl(var(--row-group-hue) 65% 50% / 0.07);
  border-bottom-color: hsl(var(--row-group-hue) 65% 50% / 0.18);
}

.memory-row.memory-row-grouped:hover {
  background: hsl(var(--row-group-hue) 65% 50% / 0.11);
}

.memory-row-blank {
  min-width: 0;
}

/* ── Unallocated slots ───────────────────────────────────────────────────
   Rendered ahead of time so the address space is visible from the start and
   rows don't shift as the program allocates. Deliberately low-contrast: they
   are scaffolding, not data. */

.memory-row-unfilled {
  border-bottom-color: color-mix(in srgb, var(--cx-border) 55%, transparent);
  pointer-events: none;
}

.memory-row-unfilled .mem-addr {
  color: color-mix(in srgb, var(--cx-text-3) 62%, transparent);
}

.mem-value-empty {
  justify-self: start;
  min-width: 44px;
  height: 18px;
  padding: 0;
  border: 1px dashed color-mix(in srgb, var(--cx-border-med) 70%, transparent);
  border-radius: 3px;
  background: transparent;
}

.mem-value-garbage {
  justify-self: start;
  padding: 1px 6px;
  border: 1px dashed color-mix(in srgb, var(--cx-border-med) 70%, transparent);
  border-radius: 3px;
  background: transparent;
  color: color-mix(in srgb, var(--cx-text-3) 78%, transparent);
  font-size: calc(10px * var(--u));
  font-weight: 400;
  letter-spacing: -0.01em;
}

.memory-row-items {
  display: flex;
  align-items: stretch;
  gap: 3px;
  min-width: 0;
  overflow-x: auto;
}

.memory-row-item {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 30px;
  padding: 1px 5px;

  border-radius: 3px;
  background: var(--cx-bg-subtle);
}

.memory-row-item-label {

  color: var(--cx-text-3);
  white-space: nowrap;
}

.memory-row-item-value {
  font-size: calc(10.5px * var(--u));
  font-weight: 500;
  color: var(--cx-text);
  white-space: nowrap;
}

.memory-row-continuation {
  font-size: calc(9.5px * var(--u));
  font-style: italic;
  color: var(--cx-text-3);
}

.memory-row .mem-value {
  justify-self: start;
}


/* ===========================================================================
   ARRAYS
   ======================================================================== */

.array-cells {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  padding: 4px 9px;
}

.array-cell {
  display: flex;
  flex-direction: column;
  align-items: center;

  color: var(--cx-text);
  font-size: calc(10.5px * var(--u));
  font-weight: 500;
}

   CONSOLE
   ======================================================================== */

.console-panel {
  flex-shrink: 0;
  height: 128px;
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--cx-border);
}

.console-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  overflow-y: auto;
  white-space: pre-wrap;
}

.console-error {
  color: var(--cx-err) !important;
}

  color: var(--cx-text-3) !important;
}

/* ===========================================================================
   EMPTY STATE
   ======================================================================== */

.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 12px;
  font-family: var(--cx-ui);
  font-size: calc(11.5px * var(--u));
  font-style: italic;
  text-align: center;
  color: var(--cx-text-3);
}

/* ===========================================================================
   CRASH OVERLAY
   ======================================================================== */

.crash-overlay[hidden] {
  display: none;
}

.crash-overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: color-mix(in srgb, var(--cx-bg) 82%, transparent);
  backdrop-filter: blur(3px);
}

/* Same vocabulary as the rest of the widget: flat surface, hairline border,
   an uppercase label like a region header, mono for the source reference, and
   a toolbar-style button. No pill, no oversized heading, no accent bar. */
.crash-card {
  width: min(420px, 100%);
  border: 1px solid var(--cx-border);
  border-radius: var(--cx-radius);
  background: var(--cx-bg);
  box-shadow: 0 4px 16px rgb(0 0 0 / 0.08);
  overflow: hidden;
}

.crash-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  background: var(--cx-bg-subtle);
  border-bottom: 1px solid var(--cx-border);
}

.crash-title {
  font-size: calc(10px * var(--u));
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--cx-err);
}

.crash-line {
  margin-left: auto;
  font-family: var(--cx-mono);
  font-size: calc(10px * var(--u));
  color: var(--cx-text-3);
}

.crash-reason {
  padding: 14px;
  font-size: calc(12.5px * var(--u));
  line-height: 1.5;
  color: var(--cx-text);
}

.crash-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px 14px;
}

.crash-actions button {
  height: 28px;
  padding: 0 12px;
  border: 1px solid var(--cx-border);
  border-radius: var(--cx-radius);
  background: var(--cx-bg);
  color: var(--cx-text-2);
  font: 500 12px var(--cx-ui);
  cursor: pointer;
  transition:
    color 0.12s,
    border-color 0.12s;
}

.crash-actions button:hover {
  color: var(--cx-text);
  border-color: var(--cx-border-med);
}

.crash-actions button:focus-visible {
  outline: 2px solid var(--cx-text-3);
  outline-offset: 1px;
}

.crash-hint {
  font-size: calc(11px * var(--u));
  color: var(--cx-text-3);
}

/* ===========================================================================
   ANIMATIONS
   ======================================================================== */

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideOut {
  from {
    opacity: 1;
    transform: translateY(0);
  }
  to {
    opacity: 0;
    transform: translateY(-10px);
  }
}

@keyframes flashIn {
  0% {
    background: var(--cx-accent-bg);
  }
  100% {
    background: transparent;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ===========================================================================
   SCROLLBARS
   ======================================================================== */

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--cx-border);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--cx-border-med);
}

/* The memory panes hide their scrollbars but stay scrollable — a visible bar
   competes with the address grid, and because the slot count is derived from
   the pane's width and height, a bar appearing mid-render would change the
   measurement it was just computed from. Wheel, trackpad and keyboard
   scrolling all still work. */
.region-content,
.memory-row-items {
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.region-content::-webkit-scrollbar,
.memory-row-items::-webkit-scrollbar {
  width: 0;
  height: 0;
}

/* ===========================================================================
   RESPONSIVE — widgets are often placed in a narrow slide region
   ======================================================================== */

@media (max-width: 820px) {
  main {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  }

  .code-panel {
    border-right: none;
    border-bottom: 1px solid var(--cx-border);
  }
}

@media (max-height: 460px) {
  .console-panel {
    height: 92px;
  }
}

    <div id="crashOverlay" class="crash-overlay" hidden>
      <div class="crash-card" role="alertdialog" aria-live="assertive" aria-labelledby="crashTitle">
        <div class="crash-head">
          <span id="crashTitle" class="crash-title">Runtime error</span>
          <span id="crashLine" class="crash-line"></span>
        </div>
        <p id="crashReason" class="crash-reason">Execution stopped because of a runtime error.</p>
        <div class="crash-actions">
          <button id="crashCloseBtn" type="button">Dismiss</button>
          <span class="crash-hint">or press Reset to start over</span>
        </div>
      </div>
    </div>

    <div id="toolbar" data-bw-topbar>
      <div class="controls">
        <button id="runBtn" type="button">Run</button>
        <button id="stepBtn" type="button">&#9197; Step</button>
        <button id="resetBtn" type="button">&#8634; Reset</button>
      </div>
      <div class="spacer"></div>
      <div class="controls">
        <select id="speedSelect" aria-label="Step speed">
          <option value="1000">Slow</option>
          <option value="500" selected>Normal</option>
          <option value="150">Fast</option>
        </select>
        <span class="step-counter" id="stepCounter">Step 0</span>
      </div>
    </div>

    <main>
      <section class="code-panel">
        <div class="panel-header">Code</div>
        <div class="code-editor">
          <div class="line-numbers" id="lineNumbers"></div>
          <textarea id="codeInput" spellcheck="false" aria-label="C source code">
int main() {
    // place code here
    return 0;
}</textarea
          >
        </div>
        <div class="editor-statusbar" id="editorStatus" data-severity="ok" aria-live="polite">
          <span id="syntaxMessage" class="syntax-message">Ready to edit and run.</span>
        </div>
      </section>

      <section class="memory-panel">

    <script>
"use strict";

const TOKENTYPES = Object.freeze({
  KEYWORD: "KW",
  IDENT: "ID",
  NUMBER: "NUM",
  STRING: "STR",
  CHAR_LIT: "CHR",
  OP: "OP",
  PUNC: "PN",
  EOF: "EOF",
});

const KEYWORDS = new Set([
  "int",
  "char",
  "float",
  "double",
  "void",
  "long",
  "short",
  "unsigned",
  "return",
  "if",
  "else",
  "while",
  "for",
  "sizeof",
  "malloc",
  "free",
  "printf",
  "NULL",
  "const",
  "static",
  "struct",
]);

const OPERATIONS = new Set([
  "==",
  "!=",
  "<=",
  ">=",
  "&&",
  "||",
  "++",
  "--",
  "+=",
  "-=",
  "*=",
  "/=",
  "->",
]);

const STRING_ESCAPE_SEQUENCE = Object.freeze({
  n: "\n",
  t: "\t",
  "\\": "\\",
  '"': '"',
});

const CHAR_ESCAPE_SEQUENCE = Object.freeze({
  n: "\n",
  t: "\t",
  0: "\0",
  "\\": "\\",
  "'": "'",
});

/**
 * Represents one token produced by the tokenizer.
 *
 * Examples:
 *  - int : { type: "KW", value: "int", line: 1, col: 1 }
 *  - x   : { type: "ID", value: "x", line: 1, col: 5 }
 *  - 123 : { type: "NUM", value: 123, line: 1, col: 9 }
 *  - ;   : { type: "PN", value: ";", line: 1, col: 12 }
 *
 * @typedef {Object} Token
 * @property {string} type - Token type from TOKENTYPES
 * @property {*} value - Token value, such as "int", "x", 123, or ";"
 * @property {number} line - Source line number where the token starts
 * @property {number} col - Source column number where the token starts
 */

/**
 * Converts raw C source code into a list of tokens.
 *
 * The tokenizer recognizes:
 *  - keywords: int, return, malloc
 *  - identifiers: 'x', 'ptr', 'main'
 *  - numbers: 123
 *  - strings: "hello"
 *  - char literals: 'A', 'a'
 *  - operators: '+', '-', '*', '/', '=', '==', '+=', '&&'
 *  - punctuation: ';', '(', ')', '{', '}'
 *
 * Whitespace and comments are skipped.
 *
 * @param {string} src - Raw source code from the editor
 * @returns {Token[]} Tokens for the parser, ending with an EOF token
 */
function tokenize(src) {
  const tokens = [];
  let i = 0;
  let line = 1;
  let col = 1;

  /**
   * Moves to the next source character while updating current line
   * and column position.
   *
   * @returns {void}
   */
  function advance() {
    if (src[i] === "\n") {
      line += 1;
      col = 1;
    } else {
      col += 1;
    }
    i += 1;
  }

  /**
   * Checks whether a character is whitespace.
   *
   * Whitespace includes:
   * - tabs
   * - spaces
   * - newlines
   *
   * @param {string} char - Character to check
   * @returns {boolean} True if the character is whitespace
   */
  function isWhiteSpace(char) {
    return /\s/.test(char);
  }

  /**
   * Checks whether the current source position starts a line comment.
   *
   * @returns {boolean} True if the current position starts a line comment
   */
  function isLineCommentStart() {
    return src[i] === "/" && src[i + 1] === "/";
  }

  /**
   * Checks whether the current source position starts a block comment.
   *
   * @returns {boolean} True if the current position starts a block comment
   */
  function isBlockCommentStart() {
    return src[i] === "/" && src[i + 1] === "*";
  }

  /**
   * Skips characters until the end of the current line comment.
   *
   * @returns {void}
   */
  function skipLineComment() {
    while (i < src.length && src[i] !== "\n") {
      advance();
    }
  }

  /**
   * Skips characters until the end of the current block comment.
   *
   * @returns {void}
   */
  function skipBlockComment() {
    advance();
    advance();
    while (i < src.length - 1 && !(src[i] === "*" && src[i + 1] === "/")) {
      advance();
    }
    if (i < src.length - 1) {
      advance();
      advance();
    }
  }

  /**
   * Skips characters that should not become tokens.
   *
   * Skipped characters include:
   *  - Whitespace
   *  - Line comments
   *  - Block comments
   *
   * @returns {void}
   */
  function skipIgnored() {
    while (i < src.length) {
      if (isWhiteSpace(src[i])) {
        advance();
      } else if (isLineCommentStart()) {
        skipLineComment();
      } else if (isBlockCommentStart()) {
        skipBlockComment();
      } else {
        break;
      }
    }
  }

  /**
   * Adds a token to the token list.
   *
   * tokenLine and tokenCol default to the current source position.
   *
   * @param {string} type - Token type from TOKENTYPES
   * @param {*} value - Token value
   * @param {number} tokenLine - Source line where the token starts
   * @param {number} tokenCol - Source column where the token starts
   *
   * @returns {void}
   */
  function pushToken(type, value, tokenLine = line, tokenCol = col) {
    tokens.push({
      type: type,
      value: value,
      line: tokenLine,
      col: tokenCol,
    });
  }

  /**
   * Checks whether a character can start a string token.
   *
   * @param {string} char - The character to check
   *
   * @returns {boolean} True if the character can start a string
   */
  function isStringStart(char) {
    return char === '"';
  }

  /**
   * Reads a double-quoted string literal and pushes a string token.
   *
   * @param {number} startLine - Line where the string starts
   * @param {number} startCol - Column where the string starts
   *
   * @returns {void}
   */
  function readStringLiteral(startLine, startCol) {
    // skip opening "
    advance();

    let string = "";

    while (i < src.length && src[i] !== '"') {
      if (src[i] === "\\") {
        advance();
        string += STRING_ESCAPE_SEQUENCE[src[i]] || src[i];
      } else {
        string += src[i];
      }

      advance();
    }

    if (i < src.length) {
      // skip closing "
      advance();
    }

    pushToken(TOKENTYPES.STRING, string, startLine, startCol);
  }

  /**
   * Checks whether a character can start a char token.
   *
   * @param {string} char - The character to check
   *
   * @returns {boolean} True if the character can start an char literal
   */
  function isCharStart(char) {
    return char === "'";
  }

  /**
   * Reads a single-quoted character literal and pushes a character token.
   *
   * @param {number} startLine - Line where the char literal starts
   * @param {number} startCol - Column where the char literal starts
   *
   * @returns {void}
   */
  function readCharLiteral(startLine, startCol) {
    // skip opening '
    advance();

    let char = src[i];

    if (char === "\\") {
      advance();
      char = CHAR_ESCAPE_SEQUENCE[src[i]] || src[i];
    }

    // skip character
    advance();

    if (i < src.length && src[i] === "'") {
      // skip closing '
      advance();
    }

    pushToken(TOKENTYPES.CHAR_LIT, char.charCodeAt(0), startLine, startCol);
  }

  /**
   * Checks whether a character can start a digit
   *
   * @param {string} char - The character to check
   *
   * @returns {boolean} True if the character is a digit, otherwise false
   */
  function isDigitStart(char) {
    return /[0-9]/.test(char);
  }

  /**
   * Checks whether a character can appear inside a number literal.
   *
   * Examples:
   *  - 123
   *  - 3.14
   *  - 0xff
   *  - 0xFF
   *
   * @param {string} char - The character to check
   *
   * @returns {boolean} True if the character can appear in a number literal, otherwise false
   */
  function isNumberLiteralChar(char) {
    return /[0-9.xXa-fA-F]/.test(char);
  }

  /**
   * Reads a numeric literal and pushes a number token.
   *
   * @param {number} startLine - Line where the number literal starts
   * @param {number} startCol - Column where the number literal starts
   *
   * @returns {void}
   */
  function readNumberLiteral(startLine, startCol) {
    let number = "";

    while (i < src.length && isNumberLiteralChar(src[i])) {
      number += src[i];
      advance();
    }

    pushToken(TOKENTYPES.NUMBER, Number(number), startLine, startCol);
  }

  /**
   * Checks whether a character can start an operator token.
   *
   * @param {string} char - The character to check
   *
   * @returns {boolean} True if the character can start an operator
   */
  function isOperatorStart(char) {
    return "+-*/%=!<>&|^~".includes(char);
  }

  /**
   * Reads an operator token and pushes a operator token.
   *
   * @param {number} startLine - Line where the operator starts
   * @param {number} startCol - Column where the operator starts
   *
   * @returns {void}
   */
  function readOperator(startLine, startCol) {
    let operator = src[i];
    advance();

    if (i < src.length && OPERATIONS.has(operator + src[i])) {
      operator += src[i];
      advance();
    }

    pushToken(TOKENTYPES.OP, operator, startLine, startCol);
  }

  /**
   * Checks whether a character is a punctuation symbol.
   *
   * @param {string} char - The character to check
   *
   * @returns {boolean} True if the character is punctuation, otherwise false
   */
  function isPunctuation(char) {
    return "(){}[];,.".includes(char);
  }

  /**
   * Reads a punctuation token and pushes a punctuation token.
   *
   * @param {number} startLine - Line where the punctuation starts.
   * @param {number} startCol - Column where the punctuation starts.
   *
   * @returns {void}
   */
  function readPunctuation(startLine, startCol) {
    pushToken(TOKENTYPES.PUNC, src[i], startLine, startCol);
    advance();
  }

  /**
   * Checks whether a character can start a word (identifier or keyword).
   * @param {string} char - The character to check
   *
   * @returns {boolean} True if the character can start a word (identifier or keyword)
   */
  function isWordStart(char) {
    return /[a-zA-Z_]/.test(char);
  }

  /**
   * Checks whether a character can appear in a word (identifier or keyword).
   *
   * @param {string} char - The character to check
   *
   * @returns {boolean} True if the character can appear in a word, otherwise false
   */
  function isWordChar(char) {
    return /[a-zA-Z0-9_]/.test(char);
  }

  /**
   * Reads a word (identifier or keyword) and pushes the matching token.
   *
   * Reads the full word, then checks if the word is reserved. Reserved
   * keywords become KEYWORD tokens and all other words become IDENT tokens.
   *
   * Example:
   * - int: KEYWORD token
   * - main: IDENT token
   * - x: IDENT token
   *
   * @param {number} startLine - Line where the word starts
   * @param {number} startCol - Column where the word starts
   *
   * @returns {void}
   */
  function readWord(startLine, startCol) {
    let word = "";

    while (i < src.length && isWordChar(src[i])) {
      word += src[i];
      advance();
    }

    const tokenType = KEYWORDS.has(word) ? TOKENTYPES.KEYWORD : TOKENTYPES.IDENT;

    pushToken(tokenType, word, startLine, startCol);
  }

  while (i < src.length) {
    skipIgnored();
    if (i >= src.length) {
      break;
    }

    // Store where this token begins
    const startLine = line;
    const startCol = col;
    const currentChar = src[i];

    if (isStringStart(currentChar)) {
      readStringLiteral(startLine, startCol);
    } else if (isCharStart(currentChar)) {
      readCharLiteral(startLine, startCol);
    } else if (isWordStart(currentChar)) {
      readWord(startLine, startCol);
    } else if (isDigitStart(currentChar)) {
      readNumberLiteral(startLine, startCol);
    } else if (isOperatorStart(currentChar)) {
      readOperator(startLine, startCol);
    } else if (isPunctuation(currentChar)) {
      readPunctuation(startLine, startCol);
    } else {
      // Unknown character, skip it
      advance();
    }
  }

  pushToken(TOKENTYPES.EOF, "", line, col);
  return tokens;
}

// Expose tokenizer utilities for Node-based tests.
//
// This file is also loaded as a classic browser script, where `module` is
// undefined — hence the guard. The bundler inlines the file verbatim, so this
// block is inert in the built widget.
if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    TOKENTYPES,
    KEYWORDS,
    OPERATIONS,
    STRING_ESCAPE_SEQUENCE,
    CHAR_ESCAPE_SEQUENCE,
    tokenize,
  };
}

    <script>
/**
 * Represents the full parsed program.
 *
 * @typedef {Object} ProgramNode
 * @property {GlobalDeclarationNode[]} globals - Global variable declarations
 * @property {Object<string, FunctionNode>} functions - Function definitions indexed by function name
 */

/**
 * Represents one function parameter.
 *
 * @typedef {Object} ParameterNode
 * @property {CType} type - Parameter type
 * @property {string} name - Parameter name
 */

/**
 * Represents a parsed function definition.
 *
 * @typedef {Object} FunctionNode
 * @property {"func"} kind - Node kind
 * @property {CType} returnType - Function return type
 * @property {string} name - Function name
 * @property {ParameterNode[]} params - Function parameters
 * @property {StatementNode[]} body - Function body statements
 * @property {number} line - Source line where the function starts
 */

/**
 * Represents a parsed global variable declaration.
 *
 * @typedef {Object} GlobalDeclarationNode
 * @property {"global_decl"} kind - Node kind
 * @property {CType} type - Variable type
 * @property {string} name - Variable name
 * @property {ExpressionNode | null} [value] - Initial scalar value expression
 * @property {number | null} [arraySize] - Array size, if this is an array
 * @property {ExpressionNode[] | null} [arrayInit] - Array initializer expressions
 * @property {number} line - Source line where the declaration starts
 */

/**
 * Represents a parsed statement inside a function body.
 *
 * Statement kinds:
 * - "local_decl": local variable or local array declaration
 * - "return": return statement
 * - "printf": printf statement
 * - "free": free(ptr) statement
 * - "deref_assign": pointer dereference assignment, such as *ptr = 42;
 * - "deref_compound_assign": pointer dereference compound assignment, such as *ptr += 1; 
 * - "array_assign": array element assignment, such as arr[2] = 99;
 * - "assign": scalar variable assignment, such as x = 5;
 * - "compound_assign": compound assignment, such as x += 1;
 * - "unary_stmt": unary update statement, such as x++ or x--;
 * - "expr_stmt": expression used as a statement, usually a function call.
 * - "if": conditional statement with an optional else branch
 *
 * @typedef {Object} StatementNode
 * @property {
 *  "local_decl" | 
 *  "return" | 
 *  "printf" | 
 *  "free" | 
 *  "deref_assign" | 
 *  "deref_compound_assign" | 
 *  "array_assign" | 
 *  "assign" | 
 *  "compound_assign" | 
 *  "unary_stmt" | 
 *  "expr_stmt | 
 *  if"
 * } kind - Statement kind
 * @property {number} line - Source line where the statement starts
 * @property {ExpressionNode} [condition] - Condition used by an if statement
 * @property {StatementNode[]} [thenBranch] - Statements executed when the condition is true
 * @property {StatementNode[] | null} [elseBranch] - Statements executed when the condition is false
 */

/**
 * Represents a parsed expression.
 *
 * Expression kinds:
 * - "num": numeric value, including number literals, char literals, and NULL
 * - "str": string literal
 * - "var": variable reference
 * - "binop": binary operation, such as a + b or a == b
 * - "addr_of": address-of expression, such as &x
 * - "deref": pointer dereference expression, such as *ptr
 * - "negate": numeric negation, such as -x
 * - "not": logical not, such as !x
 * - "sizeof": sizeof(type)
 * - "cast": type cast, such as (int*)ptr
 * - "malloc": malloc(size)
 * - "call": function call, such as add(x, y)
 * - "array_access": array access, such as arr[2]
 *
 * Note: expression nodes currently do not store source line/column positions.
 * Runtime errors usually use the containing statement's line instead.
 *
 * @typedef {Object} ExpressionNode
 * @property {"num" | "str" | "var" | "binop" | "addr_of" | "deref" | "negate" | "not" | "sizeof" | "cast" | "malloc" | "call" | "array_access"} kind - Expression kind
 */

class Parser {
  /**
   * Creates a parser for a list of tokens.
   *
   * @param {Token[]} tokens - Tokens produced by tokenizer
   */
  constructor(tokens) {
    this.tokens = tokens;
    this.pos = 0;
    this.structs = {};
  }

  /**
   * Looks ahead at a token without consuming it.
   *
   * The offset depends on the current parser position,
   * offset 0 means the current token, offset 1 means next token.
   *
   * @param {number} offset - Number of tokens ahead to inspect
   *
   * @returns {Token} Token at the requested position
   */
  peek(offset = 0) {
    return this.tokens[Math.min(this.pos + offset, this.tokens.length - 1)];
  }

  /**
   * Returns the current token without consuming it.
   *
   * Wrapper around peek(0)
   *
   * @returns {Token} Current token
   */
  at() {
    return this.peek();
  }

  /**
   * Consumes and returns the current token.
   *
   * If an expected type or value is provided, this validates the current token
   * before consuming it. If token does not match, a parse error is thrown.
   *
   * @param {string} [type] - Expected token type (TOKENTYPES)
   * @param {*} [value] - Expected token value
   *
   * @returns {Token} Consumed token
   */
  eat(type, value) {
    const currentToken = this.at();
    if (type && currentToken.type !== type)
      this.err(`Expected ${type} but got ${currentToken.type} (${currentToken.value})`);
    if (value !== undefined && currentToken.value !== value)
      this.err(`Expected '${value}' but got '${currentToken.value}'`);
    this.pos++;
    return currentToken;
  }

  /**
   * Throws a parser error at the current token's source line
   *
   * @param {string} msg - Error message
   *
   * @throws {Error} Parse error with line information
   */
  err(msg) {
    const currentToken = this.at();
    throw new Error(`Parse error at line ${currentToken.line}: ${msg}`);
  }

  /**
   * Checks whether the current token matches an expected type and optional value.
   *
   * Doesn't consume the token.
   *
   * @param {string} type - Token type to match
   * @param {*} [value] - Optional token value to match
   *
   * @returns {boolean} True if the current token matches
   */
  match(type, value) {
    const currentToken = this.at();
    return currentToken.type === type && (value === undefined || currentToken.value === value);
  }

  /**
   * Checks whether the current token matches one of several possible values.
   *
   * @param {string} type - Token type to match
   * @param {Array<*>} values - Allowed token values
   *
   * @returns {boolean} True if the current token matches one of the values
   */
  matchAny(type, values) {
    return values.some((value) => this.match(type, value));
  }

  /**
   * Parses the full token list into a program node.
   *
   * Parser repeatedly reads top-level declarations until it reaches EOF.
   * Each top-level declaration:
   * - function definition stored in program.functions
   * - global declaration stored in program.globals
   *
   * @returns {ProgramNode} Parsed program
   */
  parse() {
    const program = { globals: [], functions: {}, structs: this.structs };

    while (!this.match(TOKENTYPES.EOF)) {
      if (
        this.match(TOKENTYPES.KEYWORD, "struct") &&
        this.peek(1).type === TOKENTYPES.IDENT &&
        this.peek(2).type === TOKENTYPES.PUNC &&
        this.peek(2).value === "{"
      ) {
        const definition = this.parseStructDefinition();
        this.structs[definition.name] = definition;
        continue;
      }
      const decl = this.parseTopLevel();
      if (decl.kind === "func") program.functions[decl.name] = decl;
      else program.globals.push(decl);
    }
    return program;
  }

  /**
   * Parses an if statement with an optional else or else-if branch
   * 
   * @param {number} startLine - Source line wher the if statement starts
   * @param {StatementNode} Parsed if statement
  */
  parseIf(startLine) {
    this.eat(TOKENTYPES.KEYWORD, "if");
    this.eat(TOKENTYPES.PUNC, "(");

    const condition = this.parseExpr();

    this.eat(TOKENTYPES.PUNC, ")");

    const thenBranch = this.parseStatementBody();
    let elseBranch = null;

    if (this.match(TOKENTYPES.KEYWORD, "else")) {
      this.eat(TOKENTYPES.KEYWORD, "else");

      if (this.match(TOKENTYPES.KEYWORD, "if")) {
        elseBranch = [this.parseIf(this.at().line)];
      } else {
        elseBranch = this.parseStatementBody();
      }
    }

    return {
      kind: "if",
      condition,
      thenBranch,
      elseBranch,
      line: startLine,
    };
  }

  /**
   * Parses the body controlled by an if or else statement
   * 
   * @returns {StatementNode[]} Parsed statements
   */
  parseStatementBody() {
    if (this.match(TOKENTYPES.PUNC, "{")) {
      return this.parseBlock(); 
    }

    return [this.parseStmt()]; 
  }

  /**
   * Checks whether the current token can start a C type.
   *
   * @returns {boolean} True if the current token starts a type
   */
  isTypeStart() {
    return this.matchAny(TOKENTYPES.KEYWORD, [
      "int",
      "char",
      "float",
      "double",
      "void",
      "long",
      "short",
      "unsigned",
      "const",
      "static",
      "struct",
    ]);
  }

  /**
   * Parses a C type into a CType object.
   *
   * Example:
   * - int: { base: "int", pointer: 0 }
   *
   * @returns {CType} Parsed C type
   */
  parseType() {
    let base = "";
    let storageClass = null;
    while (this.matchAny(TOKENTYPES.KEYWORD, ["const", "static", "unsigned", "long", "short"])) {
      const modifier = this.eat().value;
      if (modifier === "static") storageClass = "static";
      base += modifier + " ";
    }
    let structName = null;
    if (this.match(TOKENTYPES.KEYWORD, "struct")) {
      this.eat();
      structName = this.eat(TOKENTYPES.IDENT).value;
      base += `struct ${structName}`;
    } else {
      base += this.eat(TOKENTYPES.KEYWORD).value;
    }
    let pointer = 0;
    while (this.match(TOKENTYPES.OP, "*")) {
      this.eat();
      pointer++;
    }
    const type = { base: base.trim(), pointer, storageClass, structName };
    if (structName && this.structs[structName]) {
      type.size = this.structs[structName].size;
      type.alignment = this.structs[structName].alignment;
    }
    return type;
  }

  getTypeLayout(type) {
    if (type.pointer > 0) return { size: 8, alignment: 8 };
    if (type.structName) {
      const definition = this.structs[type.structName];
      return definition
        ? { size: definition.size, alignment: definition.alignment }
        : { size: 0, alignment: 1 };
    }
    const sizes = {
      char: 1,
      short: 2,
      int: 4,
      float: 4,
      long: 8,
      double: 8,
      void: 0,
    };
    const base = type.base.replace(/unsigned |const |static /g, "").trim();
    const size = sizes[base] || 4;
    return { size, alignment: Math.min(size, 8) || 1 };
  }

  parseStructDefinition() {
    this.eat(TOKENTYPES.KEYWORD, "struct");
    const name = this.eat(TOKENTYPES.IDENT).value;
    const definition = { kind: "struct_def", name, fields: [], size: 0, alignment: 1 };
    this.structs[name] = definition;
    this.eat(TOKENTYPES.PUNC, "{");

    let offset = 0;
    let structAlignment = 1;
    while (!this.match(TOKENTYPES.PUNC, "}")) {
      const type = this.parseType();
      const fieldName = this.eat(TOKENTYPES.IDENT).value;
      const arrayDimensions = this.parseArrayDimensions();
      this.eat(TOKENTYPES.PUNC, ";");
      const layout = this.getTypeLayout(type);
      const arraySize = arrayDimensions.length
        ? arrayDimensions.reduce((total, size) => total * size, 1)
        : null;
      const size = layout.size * (arraySize || 1);
      offset += (layout.alignment - (offset % layout.alignment)) % layout.alignment;
      definition.fields.push({
        name: fieldName,
        type,
        offset,
        size,
        arrayDimensions: arrayDimensions.length ? arrayDimensions : null,
        arraySize,
      });
      offset += size;
      structAlignment = Math.max(structAlignment, layout.alignment);
    }

    this.eat(TOKENTYPES.PUNC, "}");
    this.eat(TOKENTYPES.PUNC, ";");
    definition.alignment = structAlignment;
    definition.size =
      offset + (structAlignment - (offset % structAlignment)) % structAlignment;
    for (const field of definition.fields) {
      if (field.type.structName === name) {
        field.type.size = definition.size;
        field.type.alignment = definition.alignment;
      }
    }
    return definition;
  }

  parseArrayDimensions(allowExpressions = false) {
    const dimensions = [];
    while (this.match(TOKENTYPES.PUNC, "[")) {
      this.eat();
      let dimension = null;
      if (this.match(TOKENTYPES.NUMBER)) {
        dimension = this.eat().value;
      } else if (allowExpressions && !this.match(TOKENTYPES.PUNC, "]")) {
        const expression = this.parseExpr();
        if (expression.kind === "num") dimension = expression.value;
      }
      this.eat(TOKENTYPES.PUNC, "]");
      dimensions.push(dimension);
    }
    return dimensions;
  }

  flattenArrayInitializer(initializer) {
    if (!Array.isArray(initializer)) return [initializer];
    return initializer.flatMap((value) => this.flattenArrayInitializer(value));
  }

  normalizeArrayInitializer(initializer, dimensions, depth = 0) {
    if (!initializer) return null;
    const totalSize = dimensions.slice(depth).reduce((total, size) => total * size, 1);
    const values = Array.isArray(initializer) ? initializer : [initializer];
    const hasNestedValues = values.some((value) => Array.isArray(value));

    if (depth === dimensions.length - 1 || !hasNestedValues) {
      const flattened = this.flattenArrayInitializer(values).slice(0, totalSize);
      while (flattened.length < totalSize) flattened.push({ kind: "num", value: 0 });
      return flattened;
    }

    const normalized = [];
    const childSize = dimensions
      .slice(depth + 1)
      .reduce((total, size) => total * size, 1);
    for (let i = 0; i < dimensions[depth]; i++) {
      if (i < values.length) {
        normalized.push(
          ...this.normalizeArrayInitializer(values[i], dimensions, depth + 1),
        );
      } else {
        for (let j = 0; j < childSize; j++) {
          normalized.push({ kind: "num", value: 0 });
        }
      }
    }
    return normalized;
  }

  resolveArrayDeclaration(dimensions, initializer) {
    const resolvedDimensions = [...dimensions];
    if (resolvedDimensions[0] === null && initializer) {
      const innerSize = resolvedDimensions
        .slice(1)
        .reduce((total, size) => total * size, 1);
      const topLevelSize = initializer.some((value) => Array.isArray(value))
        ? initializer.length
        : Math.ceil(this.flattenArrayInitializer(initializer).length / innerSize);
      resolvedDimensions[0] = topLevelSize;
    }
    const arraySize = resolvedDimensions.includes(null)
      ? null
      : resolvedDimensions.reduce((total, size) => total * size, 1);
    const arrayInit = arraySize
      ? this.normalizeArrayInitializer(initializer, resolvedDimensions)
      : initializer;
    return { arrayDimensions: resolvedDimensions, arraySize, arrayInit };
  }

  /**
   * Parses one top-level declaration.
   *
   * @returns {FunctionNode | GlobalDeclarationNode} Parsed top-level node
   */
  parseTopLevel() {
    const startLine = this.at().line;
    const type = this.parseType();
    const name = this.eat(TOKENTYPES.IDENT).value;

    if (this.match(TOKENTYPES.PUNC, "(")) return this.parseFuncDef(type, name, startLine);

    let value = null;
    const arrayDimensions = this.parseArrayDimensions();

    if (arrayDimensions.length > 0) {
      let arrayInit = null;
      if (this.match(TOKENTYPES.OP, "=")) {
        this.eat();
        arrayInit = this.parseArrayInit();
      }
      const layout = this.resolveArrayDeclaration(arrayDimensions, arrayInit);
      this.eat(TOKENTYPES.PUNC, ";");
      return {
        kind: "global_decl",
        type,
        name,
        arraySize: layout.arraySize,
        arrayDimensions: layout.arrayDimensions,
        arrayInit: layout.arrayInit,
        line: startLine,
      };
    }

    if (this.match(TOKENTYPES.OP, "=")) {
      this.eat();
      value = this.parseExpr();
    }
    this.eat(TOKENTYPES.PUNC, ";");
    return { kind: "global_decl", type, name, value, line: startLine };
  }

  /**
   * Parses a function definition after the return type and name are known.
   *
   * @param {CType} type - Function return type
   * @param {string} name - Function name
   * @param {number} startLine - Source line where the function starts
   *
   * @returns {FunctionNode} - Parsed function node
   */
  parseFuncDef(type, name, startLine) {
    this.eat(TOKENTYPES.PUNC, "(");
    const params = [];
    while (!this.match(TOKENTYPES.PUNC, ")")) {
      if (params.length > 0) this.eat(TOKENTYPES.PUNC, ",");
      let ptype = this.parseType();
      const pname = this.eat(TOKENTYPES.IDENT).value;
      const arrayDimensions = this.parseArrayDimensions(true);
      if (arrayDimensions.length > 0) {
        ptype = { ...ptype, pointer: ptype.pointer + 1 };
      }
      params.push({
        type: ptype,
        name: pname,
        arrayDimensions: arrayDimensions.length > 0 ? arrayDimensions : null,
      });
    }
    this.eat(TOKENTYPES.PUNC, ")");
    const body = this.parseBlock();
    return {
      kind: "func",
      returnType: type,
      name,
      params,
      body,
      line: startLine,
    };
  }

  /**
   * Parses a block of statements surrounded by braces
   *
   * @returns {StatementNode[]} Parsed statements inside the block
   */
  parseBlock() {
    this.eat(TOKENTYPES.PUNC, "{");
    const stmts = [];
    while (!this.match(TOKENTYPES.PUNC, "}")) stmts.push(this.parseStmt());
    this.eat(TOKENTYPES.PUNC, "}");
    return stmts;
  }

  /**
   * Parses one statement inside a function body.
   *
   * @returns {StatementNode} Parsed statement node
   */
  parseStmt() {
    const startLine = this.at().line;

    if (this.match(TOKENTYPES.KEYWORD, "if")) {
      return this.parseIf(startLine);
    }

    if (this.match(TOKENTYPES.KEYWORD, "while")) {
      return this.parseWhile(startLine);
    }

    if (this.match(TOKENTYPES.KEYWORD, "for")) {
      return this.parseFor(startLine);
    }

    if (this.match(TOKENTYPES.KEYWORD, "return")) {
      this.eat();
      let value = null;
      if (!this.match(TOKENTYPES.PUNC, ";")) value = this.parseExpr();
      this.eat(TOKENTYPES.PUNC, ";");
      return { kind: "return", value, line: startLine };
    }

    if (this.match(TOKENTYPES.KEYWORD, "printf")) return this.parsePrintf(startLine);

    if (this.match(TOKENTYPES.KEYWORD, "free")) {
      this.eat();
      this.eat(TOKENTYPES.PUNC, "(");
      const arg = this.parseExpr();
      this.eat(TOKENTYPES.PUNC, ")");
      this.eat(TOKENTYPES.PUNC, ";");
      return { kind: "free", arg, line: startLine };
    }

    if (this.isTypeStart()) return this.parseLocalDecl(startLine);

    return this.parseSimpleStatement(startLine, ";");
  }

  /**
   * Parses a simple statement.
   *
   * Simple statements:
   * - pointer dereference assignments: *ptr = 5
   * - pointer compound assignments: *ptr += 1
   * - array element assignments: arr[0] = 5
   * - variable assignments: x = 5
   * - compound assignments: x += 1
   * - increment and decrement statements: x++ or x--
   * - function-call statements: foo()
   *
   * @param {number} startLine - Source line where the statement starts
   * @param {string} terminator - Punctuation that ends the statement
   * @returns {StatementNode} Parsed simple statement
 */
  parseSimpleStatement(startLine, terminator = ";") {
    const checkpoint = this.pos;
    const parsedTarget = this.parseExpr();

    if (this.matchAny(TOKENTYPES.OP, ["=", "+=", "-=", "*=", "/="])) {
      const op = this.eat().value;
      const value = this.parseExpr();
      this.eat(TOKENTYPES.PUNC, terminator);
      return {
        kind: "lvalue_assign",
        target: parsedTarget,
        op,
        value,
        line: startLine,
      };
    }

    if (this.matchAny(TOKENTYPES.OP, ["++", "--"])) {
      const op = this.eat().value;
      this.eat(TOKENTYPES.PUNC, terminator);
      return {
        kind: "lvalue_update",
        target: parsedTarget,
        op,
        line: startLine,
      };
    }

    if (this.match(TOKENTYPES.PUNC, terminator)) {
      this.eat();
      return {
        kind: "expr_stmt",
        expr: parsedTarget,
        line: startLine,
      };
    }

    this.pos = checkpoint;
    // Pointer dereference statements:
    if (this.match(TOKENTYPES.OP, "*")) {
      this.eat(TOKENTYPES.OP, "*");

      const target = this.eat(TOKENTYPES.IDENT).value;

      if (this.match(TOKENTYPES.OP, "=")) {
        this.eat(TOKENTYPES.OP, "=");

        const value = this.parseExpr();

        this.eat(TOKENTYPES.PUNC, terminator);

        return {
          kind: "deref_assign",
          target,
          value,
          line: startLine,
        };
      }

      if (
        this.matchAny(
          TOKENTYPES.OP,
          ["+=", "-=", "*=", "/="],
        )
      ) {
        const op = this.eat().value;
        const value = this.parseExpr();

        this.eat(TOKENTYPES.PUNC, terminator);

        return {
          kind: "deref_compound_assign",
          target,
          op,
          value,
          line: startLine,
        };
      }

      this.err(
        `Expected an assignment operator after '*${target}'`,
      );
    }

    if (!this.match(TOKENTYPES.IDENT)) {
      this.err(`Unexpected token: ${this.at().value}`);
    }

    const name = this.eat(TOKENTYPES.IDENT).value;

    // Array element assign
    if (this.match(TOKENTYPES.PUNC, "[")) {
      this.eat(TOKENTYPES.PUNC, "[");

      const index = this.parseExpr();

      this.eat(TOKENTYPES.PUNC, "]");
      this.eat(TOKENTYPES.OP, "=");

      const value = this.parseExpr();

      this.eat(TOKENTYPES.PUNC, terminator);

      return {
        kind: "array_assign",
        name,
        index,
        value,
        line: startLine,
      };
    }

    // Ordinary assignment
    if (this.match(TOKENTYPES.OP, "=")) {
      this.eat(TOKENTYPES.OP, "=");

      const value = this.parseExpr();

      this.eat(TOKENTYPES.PUNC, terminator);

      return {
        kind: "assign",
        name,
        value,
        line: startLine,
      };
    }

    // Compound assignment
    if (
      this.matchAny(
        TOKENTYPES.OP,
        ["+=", "-=", "*=", "/="],
      )
    ) {
      const op = this.eat().value;
      const value = this.parseExpr();

      this.eat(TOKENTYPES.PUNC, terminator);

      return {
        kind: "compound_assign",
        name,
        op,
        value,
        line: startLine,
      };
    }

    // Postfix increment or decrement
    if (
      this.matchAny(
        TOKENTYPES.OP,
        ["++", "--"],
      )
    ) {
      const op = this.eat().value;

      this.eat(TOKENTYPES.PUNC, terminator);

      return {
        kind: "unary_stmt",
        name,
        op,
        line: startLine,
      };
    }

    // Function call
    if (this.match(TOKENTYPES.PUNC, "(")) {
      this.pos--;

      const expr = this.parseExpr();

      this.eat(TOKENTYPES.PUNC, terminator);

      return {
        kind: "expr_stmt",
        expr,
        line: startLine,
      };
    }

    this.err(
      `Unexpected token after identifier '${name}': ${this.at().value}`,
    );
  }

  /** 
   * Parses a while loop.
   * 
   * @param {number} startLine - Source line where the loop starts
   * @returns {StatementNode} Parsed while-loop statement
   */
  parseWhile(startLine) {
    this.eat(TOKENTYPES.KEYWORD, "while");
    this.eat(TOKENTYPES.PUNC, "(");

    const condition = this.parseExpr();

    this.eat(TOKENTYPES.PUNC, ")");

    return {
      kind: "while",
      condition,
      body: this.parseStatementBody(),
      line: startLine,
    };
  }

/**
 * Parses a for loop.
 *
 * @param {number} startLine - Source line where the loop starts
 * @returns {StatementNode} Parsed for-loop statement
 */
  parseFor(startLine) {
    this.eat(TOKENTYPES.KEYWORD, "for");
    this.eat(TOKENTYPES.PUNC, "(");

    let initializer = null;

    if (this.match(TOKENTYPES.PUNC, ";")) {
      this.eat(TOKENTYPES.PUNC, ";");
    } else if (this.isTypeStart()) {
      initializer = this.parseLocalDecl(this.at().line);
    } else {
      initializer = this.parseSimpleStatement(
        this.at().line,
        ";",
      );
    }

    let condition = null;

    if (!this.match(TOKENTYPES.PUNC, ";")) {
      condition = this.parseExpr();
    }

    this.eat(TOKENTYPES.PUNC, ";");

    let update = null;

    if (this.match(TOKENTYPES.PUNC, ")")) {
      this.eat(TOKENTYPES.PUNC, ")");
    } else {
      update = this.parseSimpleStatement(
        this.at().line,
        ")",
      );
    }

    return {
      kind: "for",
      initializer,
      condition,
      update,
      body: this.parseStatementBody(),
      line: startLine,
    };
  }

  /**
   * Parses a local variable or local array declaration.
   *
   * Note: local declarations appear inside function bodies.
   * Returns: a "local_decl" statement node.
   *
   * @param {number} startLine = Source line where the declaration starts
   *
   * @returns {StatementNode} Parsed local declaration statement
   */
  parseLocalDecl(startLine) {
    const type = this.parseType();
    const name = this.eat(TOKENTYPES.IDENT).value;
    const arrayDimensions = this.parseArrayDimensions();

    if (arrayDimensions.length > 0) {
      let arrayInit = null;
      if (this.match(TOKENTYPES.OP, "=")) {
        this.eat();
        arrayInit = this.parseArrayInit();
      }
      const layout = this.resolveArrayDeclaration(arrayDimensions, arrayInit);
      this.eat(TOKENTYPES.PUNC, ";");
      return {
        kind: "local_decl",
        type,
        name,
        arraySize: layout.arraySize,
        arrayDimensions: layout.arrayDimensions,
        arrayInit: layout.arrayInit,
        isArray: true,
        line: startLine,
      };
    }

    let value = null;
    if (this.match(TOKENTYPES.OP, "=")) {
      this.eat();
      value = this.parseExpr();
    }
    this.eat(TOKENTYPES.PUNC, ";");
    return {
      kind: "local_decl",
      type,
      name,
      value,
      isArray: false,
      line: startLine,
    };
  }

  /**
   * Parsed an array initializer.
   *  
   * Supports both:
   * - int arr[3] = {1, 2, 3};
   * - char word[6] = "Hello";
   * 
   * Note: each element is parsed as an expression
   *
   * @returns {ExpressionNode[]} Parsed array initializer expressions
   */
  parseArrayInit() {
    if (this.match(TOKENTYPES.STRING)) {
      const stringValue = this.eat(TOKENTYPES.STRING).value;
      return this.convertStringToCharInitializer(stringValue);
    } else {
      this.eat(TOKENTYPES.PUNC, "{");
      const elems = [];

   *

    while (this.matchAny(TOKENTYPES.OP, ["==", "!="])) {

      left = { kind: "binop", op, left, right: this.parseComparison() };

  /**
   * Parses relational comparison expressions.
   *
   * Supported operators:
   * - <
   * - >
   * - <=
   * - >=
   *
   * @returns {ExpressionNode} Parsed expression node
   */
  parseComparison() {
    let left = this.parseAddSub();
    while (this.matchAny(TOKENTYPES.OP, ["<", ">", "<=", ">="])) {
      const op = this.eat().value;
      left = { kind: "binop", op, left, right: this.parseAddSub() };

  }

  /**
   * Parses addition and subtraction expressions.
   *
   * Supported operators:
   * - +
   * - -
   *
   * @returns {ExpressionNode} Parsed expression node
   */
  parseAddSub() {
    let left = this.parseMulDiv();
    while (this.matchAny(TOKENTYPES.OP, ["+", "-"])) {
      const op = this.eat().value;
      left = { kind: "binop", op, left, right: this.parseMulDiv() };
    }
    return left;
  }

  /**
   * Parses multiplication, division, and modulo expresions
   *
   * Supported operators:
   * - *
   * - /
   * - %
   *
   * @returns {ExpressionNode} Parsed expression node
   */
  parseMulDiv() {
    let left = this.parseUnary();
    while (this.matchAny(TOKENTYPES.OP, ["*", "/", "%"])) {
      const op = this.eat().value;
      left = { kind: "binop", op, left, right: this.parseUnary() };

    return left;
  }

  /**
   * Parses unary expressions.
   *
   * Supported unary operators:
   * - &x: address of
   * - *ptr: pointer dereference
   * - -x: numeric negation
   * - !x: logical not
   *
   * @returns {ExpressionNode} Parsed expression node
   */
  parseUnary() {
    if (this.match(TOKENTYPES.OP, "&")) {
      this.eat();
      const expr = this.parseUnary();
      return { kind: "addr_of", expr };
    }
    if (this.match(TOKENTYPES.OP, "*")) {
      this.eat();
      const expr = this.parseUnary();
      return { kind: "deref", expr };
    }
    if (this.match(TOKENTYPES.OP, "-")) {
      this.eat();
      const expr = this.parseUnary();
      return { kind: "negate", expr };
    }
    if (this.match(TOKENTYPES.OP, "!")) {
      this.eat();
      const expr = this.parseUnary();
      return { kind: "not", expr };
    }
    return this.parsePrimary();
  }

    let result = expression;
    while (
      this.match(TOKENTYPES.PUNC, ".") ||
      this.match(TOKENTYPES.OP, "->")
    ) {
      const throughPointer = this.eat().value === "->";
      const field = this.eat(TOKENTYPES.IDENT).value;
      result = {
        kind: "member_access",
        object: result,
        field,
        throughPointer,
      };
    }
    return result;
  }

  /**
   * Parses primary expressions
   *
   * Supported forms:
   * - number literal: 123
   * - char literal: 'A'
   * - string literal: "hello"
   * - NULL
   * - sizeof(type)
   * - cast expression: (int*)ptr
   * - parenthesized expression: (a + b)
   * - malloc(size)
   * - function call: add(x, y)
   * - array access: arr[2]
   * - variable reference: x
   *
   * @returns {ExpressionNode} Parsed expression node
   */
  parsePrimary() {
    if (this.match(TOKENTYPES.NUMBER)) return { kind: "num", value: this.eat().value };
    if (this.match(TOKENTYPES.CHAR_LIT)) return { kind: "num", value: this.eat().value };
    if (this.match(TOKENTYPES.STRING)) return { kind: "str", value: this.eat().value };
    if (this.match(TOKENTYPES.KEYWORD, "NULL")) {
      this.eat();
      return { kind: "num", value: 0 };
    }

    if (this.match(TOKENTYPES.KEYWORD, "sizeof")) {
      this.eat();
      this.eat(TOKENTYPES.PUNC, "(");
      const type = this.parseType();
      this.eat(TOKENTYPES.PUNC, ")");
      return { kind: "sizeof", type };
    }

    if (this.match(TOKENTYPES.PUNC, "(")) {
      this.eat();
      if (this.isTypeStart()) {
        const castType = this.parseType();
        this.eat(TOKENTYPES.PUNC, ")");
        const expr = this.parseUnary();
        return { kind: "cast", castType, expr };
      }
      const expr = this.parseExpr();
      this.eat(TOKENTYPES.PUNC, ")");
      return this.parseMemberAccess(expr);
    }

    if (this.match(TOKENTYPES.KEYWORD, "malloc")) {
      this.eat();
      this.eat(TOKENTYPES.PUNC, "(");
      const size = this.parseExpr();
      this.eat(TOKENTYPES.PUNC, ")");
      return { kind: "malloc", size };
    }

    if (this.match(TOKENTYPES.IDENT)) {
      const name = this.eat().value;
      let expression = { kind: "var", name };
      if (this.match(TOKENTYPES.PUNC, "(")) {
        this.eat();
        const args = [];
        while (!this.match(TOKENTYPES.PUNC, ")")) {
          if (args.length > 0) this.eat(TOKENTYPES.PUNC, ",");
          args.push(this.parseExpr());
        }
        this.eat(TOKENTYPES.PUNC, ")");
        expression = { kind: "call", name, args };
      }
      if (expression.kind === "var" && this.match(TOKENTYPES.PUNC, "[")) {
        const indices = [];
        while (this.match(TOKENTYPES.PUNC, "[")) {
          this.eat();
          indices.push(this.parseExpr());
          this.eat(TOKENTYPES.PUNC, "]");
        }
        expression = { kind: "array_access", name, index: indices[0], indices };
      }
      return this.parseMemberAccess(expression);
    }

    this.err(`Unexpected token in expression: ${this.at().type} '${this.at().value}'`);
  }

const TYPE_SIZES_BYTES = {
  int: 4,
  char: 1,
  float: 4,
  double: 8,
  void: 0,
  long: 8,
  short: 2,
};

const POINTER_SIZE_BYTES = 8;
const DEFAULT_TYPE_SIZE_BYTES = 4;

function getAllocatedSize(size) {
  return size + ((4 - (size % 4)) % 4);
}

/**
 * A parsed C type object produced by Parser.parseType().
 *
 * Examples:
 * int      : { base: "int", pointer: 0 }
 * int *    : { base: "int", pointer: 1 }
 * char **  : { base: "char", pointer: 2 }
 *
 * @typedef {Object} CType
 * @property {string} base - Base C type, including supported modifiers
 * @property {number} pointer - Number of pointer stars after the base type
 */

/**
 * Returns the number of bytes needed to store a value of this C type.
 *
 * Pointer types are simulated as 8-byte addresses.
 * Non-pointer types use their cleaned base type name.
 *
 * @param {CType} type - Parsed C type object
 * @returns {number} Number of bytes used by this type
 */
function getTypeSize(type) {
  if (type.pointer > 0) {
    return POINTER_SIZE_BYTES;
  }

  if (Number.isFinite(type.size)) {
    return type.size;
  }

  const baseType = getBaseTypeName(type.base);
  return TYPE_SIZES_BYTES[baseType] || DEFAULT_TYPE_SIZE_BYTES;
}

/**
 * Removes supported C modifiers from a base type string.
 *
 * Examples:
 * "unsigned int"   : "int"
 * "const char"     : "char"
 * "static int"     : "int"
 *
 * @param {string} typeBase - Raw base type string from parser
 * @returns {string} Base type name without supported modifiers
 */
function getBaseTypeName(typeBase) {
  return typeBase.replace(/unsigned |const |static /g, "").trim();
}

/**
 * Returns the default simulated value for a C type.
 *
 * Default values for scalar values and pointer values are 0.
 * For pointers, 0 represents NULL.
 *
 * @param {CType} type - Parsed C type object
 * @returns {number} Default value for this type
 */
function getDefaultValueForType(type) {
  return 0;
}

/**
 * Represents one simulated function call stack frame.
 *
 * A new stack frame is created whenever the interpreter enters a function.
 * Local variables and function parameters are stored inside the object.
 *
 * Example:
 * {
 *    name: "main",
 *    base: 0x7ff0,
 *    vars: Map {
 *      "x" : { type, addr, value, isArray }
 *    }
 * }
 *
 * @typedef {Object} StackFrame
 * @property {string} name - Function name for this stack frame
 * @property {number} base  - Base address of this stack frame
 * @property {Map<string, MemoryVariable>} vars - Variables declared in this frame
 * @property {number} currentAddr - Next available stack address
 */

/**
 * Represents one variable stored in simulated memory.
 *
 * Scalar example:
 * {
 *    type: { base: "int", pointer: 0 },
 *    addr: 0x7fec,
 *    value: 5,
 *    isArray: false
 * }
 *
 * Array example:
 * {
 *    type: { base: "int", pointer: 0 },
 *    addr: 0x7fe0,
 *    isArray: true,
 *    size: 4,
 *    values: [10, 20, 30 , 40],
 *    elemType: { base: "int", pointer: 0 }
 * }
 *
 * @typedef {Object} MemoryVariable
 * @property {CType} type - Parsed C type object
 * @property {number} addr - Simulated memory address
 * @property {boolean} isArray - Whether this variable is an array
 * @property {*} [value] - Scalar value, used when isArray is false
 * @property {number} [size] - Number of elements, used when isArray is true
 * @property {Array<*>} [values] - Array element values, used when isArray is true

 * @property {number} elemCount - Number of simulated 4-byte slots in this block
 * @property {Array<*>} values - Stored values inside the heap block
 * @property {CType} type - Type associated with the allocated block
 * @property {boolean} freed - Whether this block has been freed
 */

/**
 * Represents the result of resolving a memory address.
 *
 * The resolved object tells us which memory region owns the address:

 *
 * @typedef {Object} ResolvedAddress
 * @property {string} kind - Memory location kind

 * @property {HeapBlock} [block] - Heap block, used when kind is "heap"

class MemoryModel {
  /**

      type,
      addr,
      isArray: true,
      size,
      values: chars,
      elemType: type,

            ? this.evalLiteral(arrayInit[i])

        addr,

        elemType: type,

        type,
        addr,

    this.declareGlobal(globalName, type, value, arraySize, arrayInit);

        addr,
        isArray: true,
        size: arraySize,
        values,
        elemType: type,
        byteSize: size,
        allocatedSize,
      });
    } else {
      frame.vars.set(name, {
        type,
        addr,
        value: value !== null && value !== undefined ? value : getDefaultValueForType(type),
        isArray: false,
        byteSize: size,
        allocatedSize,

   * Searching from the newest stack frame to the oldest stack frame,

   */
  getVar(name) {
    for (let i = this.stack.length - 1; i >= 0; i--) {
      if (this.stack[i].vars.has(name)) return this.stack[i].vars.get(name);
      const staticVariable = this.getStatic(this.stack[i].name, name);
      if (staticVariable) return staticVariable;
    }
    if (this.globals.has(name)) return this.globals.get(name);
    return null;
  }

   * Returns the simulated memory address of a variable.
   *
   * @param {string} name - Variable name
   * @returns {number} Variable address, or 0 if the variable does not exist
   */
  getVarAddr(name) {
    const v = this.getVar(name);
    return v ? v.addr : 0;
  }

  /**
   * Updates one element in an array variable.
   *
   * @param {string} name - Array variable name
   * @param {number} index - Array index to update
   * @param {*} value - New element value
   * @returns {boolean} True if the array element was updated
   */
  setArrayElem(name, index, value) {

      elemCount,

   * Writes a value to a heap address.
   *
   * @param {number} addr - Heap address to write to
   * @param {*} value - Value to store
   * @returns {boolean} True if the address was inside a live heap block

    for (const [base, block] of this.heap) {

        if (idx < block.elemCount) {

        }
        return true;
      }
    }
    return false;
  }

  /**
   * Reads a value from a heap address.
   *
   * @param {number} addr - Heap address to read from
   * @returns {*} Stored heap value, or 0 if the address is invalid
   */
  getHeapValue(addr) {
    for (const [base, block] of this.heap) {
      if (addr >= base && addr < base + block.size) {
        const idx = Math.floor((addr - base) / 4);
        return idx < block.elemCount ? block.values[idx] : 0;
      }
    }
    return 0;
  }

  /**
   * Resolves a raw memory address to the simulated memory object it belongs to.
   *
   * Checks heap blocks first, then stack variables, then global variables.
   * Used for pointer dereferencing logic.
   *
   * @param {number} addr - Simulated memory address
   * @returns {ResolvedAddress | null} Description of the resolved address, or null if invalid
   */
  resolveAddress(addr) {
    for (const [base, block] of this.heap) {
      if (addr >= base && addr < base + block.size) {
        const idx = Math.floor((addr - base) / 4);
        if (idx < block.elemCount) return { kind: "heap", base, block, index: idx };

    for (const frame of this.stack) {
      for (const [name, v] of frame.vars) {

            (candidate) => v.addr + candidate.offset === addr,
          );
          if (field) {

              kind: "stack_struct_field",
              frame,
              name,
              variable: v,
              field,
            };
          }
        }
        if (!v.isArray && v.addr === addr)
          return { kind: "stack_scalar", frame, name, variable: v };
        if (v.isArray) {
          const elemSize = getTypeSize(v.elemType || v.type);
          const idx = Math.floor((addr - v.addr) / elemSize);
          if (addr >= v.addr && idx >= 0 && idx < v.size)
            return {
              kind: "stack_array",
              frame,
              name,
              variable: v,
              index: idx,
            };
        }
      }
    }
    for (const [name, v] of this.globals) {
      if (v.isStruct) {
        const field = v.structDef.fields.find(
          (candidate) => v.addr + candidate.offset === addr,
        );
        if (field) {
          return { kind: "global_struct_field", name, variable: v, field };
        }
      }
      if (!v.isArray && v.addr === addr) return { kind: "global_scalar", name, variable: v };
      if (v.isArray) {
        const elemSize = getTypeSize(v.elemType || v.type);
        const idx = Math.floor((addr - v.addr) / elemSize);
        if (addr >= v.addr && idx >= 0 && idx < v.size)
          return { kind: "global_array", name, variable: v, index: idx };
      }
    }
    return null;
  }

  /**
   * Reads the value stored at a simulated memory address.
   *
   * @param {number} addr - Address to read from
   * @returns {*} Value at that address, or 0 if the address cannot be resolved
   */
  deref(addr) {
    const resolved = this.resolveAddress(addr);
    if (!resolved) return 0;
    if (resolved.kind === "heap") return resolved.block.values[resolved.index];
    if (resolved.field) return resolved.variable.fields[resolved.field.name].value;
    if (resolved.kind.endsWith("_array")) return resolved.variable.values[resolved.index];
    return resolved.variable.value;
  }

  /**
   * Writes a value to a simulated memory address.
   *
   * @param {number} addr - Address to write to
   * @param {*} value - Value to store
   * @returns {boolean} True if the write succeeded
   */
  setDeref(addr, value) {
    const resolved = this.resolveAddress(addr);
    if (!resolved) return false;
    if (resolved.kind === "heap") {
      if (resolved.block.freed) return false;
      resolved.block.values[resolved.index] = value;
      return true;
    }
    if (resolved.field) {
      resolved.variable.fields[resolved.field.name].value = value;
      return true;
    }
    if (resolved.kind.endsWith("_array")) {
      resolved.variable.values[resolved.index] = value;
      return true;
    }
    resolved.variable.value = value;
    return true;

/**

 */

/**

/**

 * @property {string} name - Global variable name

/**

 * @typedef {Object} CallFrame
 * @property {FunctionNode} func - Function currently executing
 * @property {number} pc - Program counter/index of the next statement to execute
 * @property {ExecutionBlock[]} blockStack - Active nested statement blocks

/**

 * @property {number} pc - Index of the next statement inside the block
 */

/**

 * - `compound_assign`
 * - `unary_stmt`

 * - `array_assign`
 * - `printf`
 * - `free`
 * - `return`
 * - `expr_stmt`

 * @property {string} kind - Statement kind
 * @property {?number} line - Source-code line where this statement appears
 * @property {string} [name] - Variable or array name used by this statement
 * @property {CType} [type] - Declared C type for declaration statements
 * @property {?ExprNode} [value] - Value expression used by declarations, assignments, and returns
 * @property {boolean} [isArray] - Whether a local declaration declares an array
 * @property {?number} [arraySize] - Number of elements for array declarations
 * @property {?Array<ExprNode>} [arrayInit] - Array initializer expressions
 * @property {string} [op] - Operator used by compound or unary statements
 * @property {string} [target] - Pointer variable name used by dereference assignments
 * @property {ExprNode} [index] - Array index expression
 * @property {string} [fmt] - `printf` format string
 * @property {Array<ExprNode>} [args] - `printf` argument expressions
 * @property {ExprNode} [arg] - Single argument expression, such as the argument to `free`
 * @property {ExprNode} [expr] - Expression used by expression statements
 */

/**
 * Generic parsed expression node.
 *
 * Expression nodes are produced by the parser. The exact properties depend on
 * the expression kind.
 *
 * Supported expression kinds include:
 * - `num`
 * - `str`
 * - `var`
 * - `binop`
 * - `negate`
 * - `not`
 * - `addr_of`
 * - `deref`

 * @property {string} [name] - Variable, function, or array name

 * @property {ExprNode} [right] - Right operand for binary expressions
 * @property {ExprNode} [expr] - Inner expression for unary, cast, or dereference expressions

/**
 * Special control-flow signal used when a function call starts during

 * to pause the current statement until the called function returns.

class CallPending {
  /**
   * Creates a function-call pause signal.

  constructor() {

/**
 * Represents a runtime crash/error inside the simulated C program.
 *
 * Errors include:
 * - undefined variables
 * - invalid pointer dereferences
 * - division by zero
 * - use after free
 * - array index out of bounds
 *
 * @extends Error
 */
class RuntimeCrash extends Error {
  /**
   * Creates a runtime crash error.
   *
   * @param {string} message - Human-readable crash message
   * @param {?number} [line=null] - Source-code line where the crash happened, if known
   */
  constructor(message, line = null) {
    super(message);
    this.name = "RuntimeCrash";
    this.line = line;

/**
 * Executes a parsed C-like program one statement at a time.
 *
 * The interpreter coordinates:
 * - memory operations through `MemoryModel`
 * - function calls and returns
 * - statement execution
 * - expression evaluation
 * - runtime crash handling
 * - printf-style output
 */
class Interpreter {
  /**
   * Creates a new interpreter instance.
   *
   * @param {MemoryModel} memory - Simulated memory model used for stack, heap, and globals
   * @param {(output: string) => void} [onOutput] - Callback fired when `printf` produces output
   * @param {(message: string) => void} [onError] - Callback for non-crashing interpreter errors
   * @param {(message: string, line: ?number) => void} [onCrash] - Callback fired when execution crashes
   */
  constructor(memory, onOutput, onError, onCrash) {
    this.mem = memory;
    /** @type {?Program} */
    this.program = null;
    /** @type {Array<CallFrame>} */
    this.callStack = [];
    this.finished = false;
    this.stepCount = 0;
    this.currentLine = -1;
    this.onOutput = onOutput || (() => {});
    this.onError = onError || (() => {});
    this.onCrash = onCrash || (() => {});
    this.callResults = [];
    this.callIndex = 0;

   * Throws a runtime crash with an optional source line.

   *

   * @param {?number} [line] - Source-code line where the crash happened

   */

   * @param {ExprNode} valueExpr - Initialiser or assigned expression.

    if (declaredType.pointer > 0) return;

    if (valueExpr.kind === "cast") return;

    const valueType = this.inferExprType(valueExpr);
    if (!valueType || valueType.pointer < 1) return;

   *

   */
  load(program) {
    this.program = program;
    this.mem.reset();
    this.callStack = [];
    this.finished = false;
    this.stepCount = 0;
    this.currentLine = -1;
    this.callResults = [];
    this.callIndex = 0;

    for (const g of program.globals) {
      const val = g.value ? this.evalExpr(g.value) : null;
      this.mem.declareGlobal(
        g.name,
        g.type,
        val,
        g.arraySize,
        g.arrayInit ? g.arrayInit.map((e) => this.evalExpr(e)) : null,

   * Starts execution by calling the program's `main()` function.
   *
   * @throws {RuntimeCrash} If the program does not contain a `main` function
   */
