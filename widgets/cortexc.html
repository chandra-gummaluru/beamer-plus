    this.callFunction("main", []);
  }

  /**
   * Calls a function and creates a new stack frame for it.
   *
   * Each function parameter is declared as a local variable in the new frame.
   * If an argument is missing, its parameter value defaults to `0`.
   *
   * The current function-call result state is saved so it can be restored after
   * the called function returns.
   *
   * @param {string} name - Name of the function to call
   * @param {Array<*>} argValues - Evaluated argument values passed to the function
   * @throws {RuntimeCrash} If the function is not defined
   */
  callFunction(name, argValues, returnTarget = null) {
    const func = this.program.functions[name];
    if (!func) this.crash(`Undefined function '${name}'.`);
    this.mem.pushFrame(name);
    for (let i = 0; i < func.params.length; i++) {
      const val = i < argValues.length ? argValues[i] : 0;
      const param = func.params[i];
      this.mem.declareLocal(param.name, param.type, val);
      this.initializeStructVariable(
        this.mem.getCurrentStackFrame().vars.get(param.name),
        param.type,
      );
      if (param.arrayDimensions) {
        this.mem.getCurrentStackFrame().vars.get(param.name).dimensions = [
          ...param.arrayDimensions,
        ];
      }
    }
    this.callStack.push({
      func,
      pc: 0,
      blockStack: [],
      savedCallResults: this.callResults,
      savedCallIndex: this.callIndex,
      expressionResults: new Map(),
      returnTarget,
    });
    this.callResults = [];
    this.callIndex = 0;
  }

  /**
   * Removes nested blocks that have finished executing.
   *
   * Once a block is removed, execution continues in its parent block
   * or in the top-level function body.
   *
   * @param {CallFrame} ctx - Function call frame being executed
   * @returns {void}
   */
  discardCompletedBlocks(ctx) {
    while (ctx.blockStack.length > 0) {
      const block = ctx.blockStack[ctx.blockStack.length - 1];

      if (block.pc < block.statements.length) {
        break;
      }

      ctx.blockStack.pop();
    }

  /**
   * Returns the next statement that would execute in a call frame.
   *
   * @param {CallFrame} ctx - Call frame to inspect
   * @returns {StmtNode | null} Next statement, or null if complete
   */
  getNextStatement(ctx) {
    this.discardCompletedBlocks(ctx);

    const activeBlock =
      ctx.blockStack.length > 0
        ? ctx.blockStack[ctx.blockStack.length - 1]
        : null;

    if (activeBlock) {
      return activeBlock.statements[activeBlock.pc] ?? null;
    }

    return ctx.func.body[ctx.pc] ?? null;
  }

  /**

   * If the current function reaches the end of its body, it returns `0`.

   * Function calls inside expressions pause the current statement by throwing

  step() {
    if (this.finished) return false;
    if (this.callStack.length === 0) {

      return canContinue;

    const completedForHeaderPart =
      executedStmt?.kind === "for" ||
      executedStmt?.autoRunForConditionAfter === true;

    if (!completedForHeaderPart) {

    const nextStmt = this.getNextStatement(startingFrame);
    if (nextStmt?.syntheticForCondition === true) {
      this.stepOnce(false);
    }

    return !this.finished;
  }

  /**
 * Executes exactly one AST statement.
 *
 * @param {boolean} countVisibleStep - Whether to increment stepCount
 * @returns {boolean} True if execution can continue
 */
  stepOnce(countVisibleStep = true) {
    if (this.finished) return false;
    if (this.callStack.length === 0) {
      this.finished = true;
      return false;
    }

    const ctx = this.callStack[this.callStack.length - 1];
    this.discardCompletedBlocks(ctx);

    const functionFinished =
      ctx.blockStack.length === 0 &&
      ctx.pc >= ctx.func.body.length;

    if (functionFinished) {
      this.doReturn(0);
      return !this.finished;
    }

    const activeBlock =
      ctx.blockStack.length > 0
        ? ctx.blockStack[ctx.blockStack.length - 1]
        : null;

    const stmt = activeBlock
      ? activeBlock.statements[activeBlock.pc]
      : ctx.func.body[ctx.pc];

    this.currentLine = stmt.line;

    if (countVisibleStep) {
      this.stepCount++;
    }

    this.callIndex = 0;
    const depthBefore = this.callStack.length;

    try {
      if (activeBlock) {
        activeBlock.pc++;
      } else {
        ctx.pc++;
      }

      this.execStmt(stmt);
    } catch (error) {
      if (error instanceof CallPending) {
        if (activeBlock) {
          activeBlock.pc--;
        } else {
          ctx.pc--;
        }

        return true;
      }

      const message =
        error instanceof Error
          ? error.message
          : String(error);

      const line =
        error instanceof RuntimeCrash
          ? error.line
          : this.currentLine;

      this.currentLine = line ?? this.currentLine;
      this.onCrash(message, line ?? null);
      this.finished = true;
      return false;
    }

    if (this.callStack.length >= depthBefore) {
      this.callResults = [];
    }

    if (this.callStack.includes(ctx)) {
      ctx.expressionResults.clear();
    }

    if (this.callStack.length > 0) {
      const top = this.callStack[this.callStack.length - 1];

      this.discardCompletedBlocks(top);

      const mainFinished =
        top.func.name === "main" &&
        top.blockStack.length === 0 &&
        top.pc >= top.func.body.length;

      if (mainFinished) {
        this.doReturn(0);
      }
    }

    return !this.finished;
  }

  /**
   * Returns from the current function.
   *
   * This pops the current memory frame, removes the current call-stack entry,
   * and sends the return value back to the caller.
   *
   * If there is no caller, program execution is marked as finished.
   *
   * @param {*} value - Runtime return value from the current function
   */
  doReturn(value) {
    this.mem.popFrame();
    const entry = this.callStack.pop();
    if (this.callStack.length === 0) {
      this.finished = true;
      this.currentLine = -1;
    } else {
      this.callResults = entry.savedCallResults;
      this.callResults.push(value);
      this.callIndex = entry.savedCallIndex;
      if (entry.returnTarget) {
        entry.returnTarget.frame.expressionResults.set(entry.returnTarget.node, value);
      }
    }
  }

  inferExprType(node) {
    if (!node) return { base: "int", pointer: 0 };
    if (node.kind === "str") return { base: "char", pointer: 1 };
    if (node.kind === "var") {
      const variable = this.mem.getVar(node.name);
      if (!variable) this.crash(`Undefined variable '${node.name}'.`);
      return variable.type;
    }
    if (node.kind === "deref") {
      const type = this.inferExprType(node.expr);
      if (!type || type.pointer <= 0) this.crash("Cannot dereference a non-pointer value.");
      return { ...type, pointer: type.pointer - 1 };
    }
    if (node.kind === "array_access") {
      const variable = this.mem.getVar(node.name);
      if (!variable) this.crash(`Undefined variable '${node.name}'.`);
      const dimensions = this.getArrayDimensions(variable);
      const indices = this.getArrayIndices(node);
      const elementType = this.getArrayElementType(variable);
      if (!elementType) this.crash(`'${node.name}' is not an array or pointer.`);
      return indices.length < dimensions.length
        ? { ...elementType, pointer: elementType.pointer + 1 }
        : elementType;
    }
    if (node.kind === "member_access") {
      return this.getStructMember(node).field.type;
    }
    if (node.kind === "addr_of") {
      const type = this.inferExprType(node.expr || { kind: "var", name: node.name });
      return { ...type, pointer: type.pointer + 1 };
    }
    if (node.kind === "cast") return node.castType;
    if (node.kind === "call") {
      const func = this.program.functions[node.name];
      return func ? func.returnType : { base: "int", pointer: 0 };
    }
    if (node.kind === "malloc") return { base: "void", pointer: 1 };
    if (node.kind === "binop") {
      const pointerInfo = this.getPointerInfo(node);
      return pointerInfo ? pointerInfo.type : { base: "int", pointer: 0 };
    }
    return { base: "int", pointer: 0 };
  }

  getStructDefinition(type) {
    if (!type || !type.structName) return null;
    return this.program.structs ? this.program.structs[type.structName] : null;
  }

  isStructType(type) {
    return Boolean(type && type.pointer === 0 && this.getStructDefinition(type));
  }

  initializeStructVariable(variable, type) {
    const definition = this.getStructDefinition(type);
    if (variable && definition && type.pointer === 0 && !variable.isArray) {
      this.mem.initializeStruct(variable, definition);
    }
  }

  getStructMember(node) {
    let objectType = this.inferExprType(node.object);
    if (node.throughPointer) {
      if (!objectType || objectType.pointer <= 0) {
        this.crash(`Operator '->' requires a pointer to a struct.`);
      }
      objectType = { ...objectType, pointer: objectType.pointer - 1 };
    }
    const definition = this.getStructDefinition(objectType);
    if (!definition || objectType.pointer > 0) {
      this.crash(`Member access requires a struct value.`);
    }
    const field = definition.fields.find((candidate) => candidate.name === node.field);
    if (!field) {
      this.crash(`Struct '${definition.name}' has no member named '${node.field}'.`);
    }
    return { definition, field, objectType };
  }

  getPointerStride(type) {
    if (!type || type.pointer <= 0) return 1;
    const stride = getTypeSize({ ...type, pointer: type.pointer - 1 });
    if (stride <= 0) this.crash("Pointer arithmetic requires a complete pointee type.");
    return stride;
  }

  getArrayIndices(node) {
    return node.indices || [node.index];
  }

  getArrayDimensions(variable) {
    if (variable.dimensions) return variable.dimensions;
    if (variable.isArray) return [variable.size];
    if (variable.type && variable.type.pointer > 0) return [null];
    return [];
  }

  getArrayElementType(variable) {
    if (variable.isArray) return variable.elemType || variable.type;
    if (variable.type && variable.type.pointer > 0) {
      return { ...variable.type, pointer: variable.type.pointer - 1 };
    }
    return null;
  }

  getArrayStride(variable, startDimension) {
    const dimensions = this.getArrayDimensions(variable);
    const elementType = this.getArrayElementType(variable);
    const remainingSize = dimensions
      .slice(startDimension)
      .reduce((total, size) => total * (size ?? 1), 1);
    return getTypeSize(elementType) * remainingSize;
  }

  getPointerInfo(node) {
    if (!node) return null;

    if (node.kind === "var") {
      const variable = this.mem.getVar(node.name);
      if (!variable) this.crash(`Undefined variable '${node.name}'.`);
      if (variable.isArray) {
        const elementType = variable.elemType || variable.type;
        return {
          type: { ...elementType, pointer: elementType.pointer + 1 },
          stride: this.getArrayStride(variable, 1),
        };
      }
      if (variable.type && variable.type.pointer > 0) {
        return {
          type: variable.type,
          stride: variable.dimensions ? this.getArrayStride(variable, 1) : null,
        };
      }
      return null;
    }

    if (node.kind === "array_access") {
      const variable = this.mem.getVar(node.name);
      if (!variable) this.crash(`Undefined variable '${node.name}'.`);
      const type = this.inferExprType(node);
      if (!type || type.pointer <= 0) return null;
      const indexCount = this.getArrayIndices(node).length;
      const dimensions = this.getArrayDimensions(variable);
      return {
        type,
        stride:
          indexCount < dimensions.length
            ? this.getArrayStride(variable, indexCount + 1)
            : null,
      };
    }

    if (node.kind === "binop") {
      const left = this.getPointerInfo(node.left);
      const right = this.getPointerInfo(node.right);
      if (node.op === "+") return left || right;
      if (node.op === "-" && left && !right) return left;
      return null;
    }

    const type = this.inferExprType(node);
    if (!type || type.pointer <= 0) return null;
    return { type };
  }

  resolveLValue(node) {
    if (node.kind === "var") {
      const variable = this.mem.getVar(node.name);
      if (!variable) this.crash(`Undefined variable '${node.name}'.`);
      return {
        address: variable.addr,
        type: variable.type,
        variable,
        isAggregate: variable.isArray || variable.isStruct,
      };
    }

    if (node.kind === "deref") {
      const address = this.evalExpr(node.expr);
      if (address === 0) this.crash("Null pointer dereference.");
      const resolved = this.mem.resolveAddress(address);
      if (!resolved) {
        this.crash(`Invalid pointer dereference at 0x${address.toString(16).toUpperCase()}.`);
      }
      if (resolved.kind === "heap" && resolved.block.freed) {
        this.crash(`Use after free at 0x${address.toString(16).toUpperCase()}.`);
      }
      return {
        address,
        type: this.inferExprType(node),
        variable: resolved.variable,
        resolved,
        isAggregate: this.isStructType(this.inferExprType(node)),
      };
    }

    if (node.kind === "array_access") {
      const variable = this.mem.getVar(node.name);
      if (!variable) this.crash(`Undefined variable '${node.name}'.`);
      const indices = this.getArrayIndices(node);
      const dimensions = this.getArrayDimensions(variable);
      const elementType = this.getArrayElementType(variable);
      if (!elementType) this.crash(`'${node.name}' is not an array or pointer.`);
      if (indices.length > dimensions.length) {
        this.crash(`Too many indices for '${node.name}'.`);
      }
      let flatIndex = 0;
      for (let i = 0; i < indices.length; i++) {
        const index = this.evalExpr(indices[i]);
        if (!Number.isInteger(index)) {
          this.crash(`Array index for '${node.name}' must be an integer.`);
        }
        if (index < 0 || (dimensions[i] !== null && index >= dimensions[i])) {
          this.crash(`Array index ${index} is out of bounds for '${node.name}'.`);
        }
        const stride = dimensions
          .slice(i + 1)
          .reduce((total, size) => total * (size ?? 1), 1);
        flatIndex += index * stride;
      }
      const type = this.inferExprType(node);
      const base = variable.isArray ? variable.addr : variable.value;
      if (base === 0) this.crash(`Null pointer dereference through '${node.name}'.`);
      const address = base + flatIndex * getTypeSize(elementType);
      const resolved = this.mem.resolveAddress(address);
      if (!resolved) {
        this.crash(`Invalid pointer dereference at 0x${address.toString(16).toUpperCase()}.`);
      }
      if (resolved.kind === "heap" && resolved.block.freed) {
        this.crash(`Use after free at 0x${address.toString(16).toUpperCase()}.`);
      }
      return {
        address,
        type,
        variable: resolved.variable,
        resolved,
        isAggregate: indices.length < dimensions.length,
      };
    }

    if (node.kind === "member_access") {
      const member = this.getStructMember(node);
      const baseAddress = node.throughPointer
        ? this.evalExpr(node.object)
        : this.resolveLValue(node.object).address;
      if (baseAddress === 0) this.crash("Null struct pointer dereference.");
      const address = baseAddress + member.field.offset;
      const resolved = this.mem.resolveAddress(address);
      if (!resolved) {
        this.crash(`Invalid struct member address 0x${address.toString(16).toUpperCase()}.`);
      }
      if (resolved.kind === "heap" && resolved.block.freed) {
        this.crash(`Use after free at 0x${address.toString(16).toUpperCase()}.`);
      }
      return {
        address,
        type: member.field.type,
        variable: resolved.variable,
        resolved,
        isAggregate:
          Boolean(member.field.arraySize) || this.isStructType(member.field.type),
      };
    }

    this.crash("Expression is not assignable.");
  }

  readLValue(target) {
    if (target.isAggregate) return target.address;
    return this.mem.deref(target.address);
  }

  writeLValue(target, value) {
    if (target.isAggregate) this.crash("Expression is not assignable.");
    if (!this.mem.setDeref(target.address, value)) {
      this.crash(`Invalid pointer write at 0x${target.address.toString(16).toUpperCase()}.`);
    }
  }

  /**
   * Executes one statement AST node.
   *
   * This method handles local declarations, assignments, pointer writes,
   * array writes, `printf`, `free`, returns, and expression statements.
   *
   * @param {StmtNode} stmt - Statement AST node to execute
   * @throws {RuntimeCrash} If the statement performs an invalid runtime operation
   * @throws {CallPending} If the statement evaluates a function call that pauses execution
   */
  execStmt(stmt) {
    switch (stmt.kind) {
      case "lvalue_assign": {
        const target = this.resolveLValue(stmt.target);
        const value = this.evalExpr(stmt.value);
        if (stmt.op === "=") {
          this.writeLValue(target, value);
          break;
        }
        const current = this.readLValue(target);
        let operand = value;
        if (target.type && target.type.pointer > 0) {
          if (stmt.op !== "+=" && stmt.op !== "-=") {
            this.crash(`Invalid pointer compound assignment '${stmt.op}'.`, stmt.line);
          }
          operand *= this.getPointerStride(target.type);
        }
        if (stmt.op === "/=" && operand === 0) this.crash("Division by zero.", stmt.line);
        const operations = {
          "+=": (left, right) => left + right,
          "-=": (left, right) => left - right,
          "*=": (left, right) => left * right,
          "/=": (left, right) => Math.trunc(left / right),
        };
        this.writeLValue(target, operations[stmt.op](current, operand));
        break;
      }
      case "lvalue_update": {
        const target = this.resolveLValue(stmt.target);
        const current = this.readLValue(target);
        const amount =
          target.type && target.type.pointer > 0
            ? this.getPointerStride(target.type)
            : 1;
        this.writeLValue(target, stmt.op === "++" ? current + amount : current - amount);
        break;
      }
      case "while": {
        const condition = this.evalExpr(stmt.condition);

        if (condition === 0) {
          break;
        }

        const ctx =
          this.callStack[this.callStack.length - 1];

        const activeBlock =
          ctx.blockStack[ctx.blockStack.length - 1];

        const repeatingCurrentLoop =
          activeBlock?.kind === "while" &&
          activeBlock.loop === stmt;

        if (repeatingCurrentLoop) {
          activeBlock.pc = 0;
        } else {
          ctx.blockStack.push({
            kind: "while",
            loop: stmt,
            statements: [
              ...stmt.body,
              stmt,
            ],
            pc: 0,
          });
        }

        break;
      }
      case "for": {
        const condition =
          stmt.condition ??
          {
            kind: "num",
            value: 1,
          };

        const update = stmt.update
          ? {
              ...stmt.update,
              autoRunForConditionAfter: true,
            }
          : null;

        const loopBody = update
          ? [...stmt.body, update]
          : [...stmt.body];

        const loop = {
          kind: "while",
          condition,
          body: loopBody,
          line: stmt.line,
          syntheticForCondition: true,
        };

        if (stmt.initializer) {
          this.execStmt(stmt.initializer);
        }

        const ctx =
          this.callStack[this.callStack.length - 1];

        ctx.blockStack.push({
          kind: "block",
          statements: [loop],
          pc: 0,
        });

        break;
      }
      case "if": {
        const condition = this.evalExpr(stmt.condition);

        const selectedBranch =
          condition !== 0
            ? stmt.thenBranch
            : stmt.elseBranch;

        if (selectedBranch && selectedBranch.length > 0) {
          const ctx = this.callStack[this.callStack.length - 1];

          ctx.blockStack.push({
            statements: selectedBranch,
            pc: 0,
          });
        }

        break;
      }
      case "local_decl": {
        const currentFunction = this.callStack[this.callStack.length - 1].func.name;
        if (stmt.type.storageClass === "static") {
          if (this.mem.getStatic(currentFunction, stmt.name)) break;
          const initVals = stmt.isArray
            ? stmt.arrayInit
              ? stmt.arrayInit.map((e) => this.evalExpr(e))
              : null
            : null;
          if (!stmt.isArray && stmt.value !== null) {
            this.checkPointerAssignment(stmt.type, stmt.value, stmt.name, stmt.line);
          }
          const val = !stmt.isArray && stmt.value !== null ? this.evalExpr(stmt.value) : null;
          const variable = this.mem.declareStatic(
            currentFunction,
            stmt.name,
            stmt.line,
            stmt.type,
            val,
            stmt.arraySize,
            initVals,
          );
          if (stmt.arrayDimensions) {
            variable.dimensions = [...stmt.arrayDimensions];
          }
          this.initializeStructVariable(variable, stmt.type);
          break;
        }
        if (stmt.isArray) {
          const initVals = stmt.arrayInit ? stmt.arrayInit.map((e) => this.evalExpr(e)) : null;
          this.mem.declareLocal(stmt.name, stmt.type, null, stmt.arraySize, initVals);
          if (stmt.arrayDimensions) {
            this.mem.getVar(stmt.name).dimensions = [...stmt.arrayDimensions];
          }
        } else {
          if (stmt.value !== null) {
            this.checkPointerAssignment(stmt.type, stmt.value, stmt.name, stmt.line);
          }
          const val = stmt.value !== null ? this.evalExpr(stmt.value) : null;
          this.mem.declareLocal(stmt.name, stmt.type, val);
          this.initializeStructVariable(this.mem.getVar(stmt.name), stmt.type);
        }
        break;
      }
      case "assign": {
        const val = this.evalExpr(stmt.value);
        if (!this.mem.setLocal(stmt.name, val))
          this.crash(`Undefined variable '${stmt.name}'.`, stmt.line);
        break;
      }
      case "compound_assign": {
        const v = this.mem.getVar(stmt.name);
        if (!v) this.crash(`Undefined variable '${stmt.name}'.`, stmt.line);
        const rhs = this.evalExpr(stmt.value);
        const ops = {
          "+=": (a, b) => a + b,
          "-=": (a, b) => a - b,
          "*=": (a, b) => a * b,
          "/=": (a, b) => Math.trunc(a / b),
        };
        if (stmt.op === "/=" && rhs === 0)
          this.crash(`Division by zero while updating '${stmt.name}'.`, stmt.line);
        this.mem.setLocal(stmt.name, ops[stmt.op](v.value, rhs));
        break;
      }
      case "unary_stmt": {
        const v = this.mem.getVar(stmt.name);
        if (!v) this.crash(`Undefined variable '${stmt.name}'.`, stmt.line);
        this.mem.setLocal(stmt.name, stmt.op === "++" ? v.value + 1 : v.value - 1);
        break;
      }
      case "deref_assign": {
        const ptr = this.mem.getVar(stmt.target);
        if (!ptr) this.crash(`Undefined variable '${stmt.target}'.`, stmt.line);
        if (ptr.value === 0) this.crash(`Null pointer write through '${stmt.target}'.`, stmt.line);
        const target = this.mem.resolveAddress(ptr.value);
        if (!target)
          this.crash(
            `Invalid pointer write at 0x${ptr.value.toString(16).toUpperCase()}.`,
            stmt.line,
          );
        if (target.kind === "heap" && target.block.freed)
          this.crash(`Write after free at 0x${ptr.value.toString(16).toUpperCase()}.`, stmt.line);
        const val = this.evalExpr(stmt.value);
        if (!this.mem.setDeref(ptr.value, val))
          this.crash(
            `Invalid pointer write at 0x${ptr.value.toString(16).toUpperCase()}.`,
            stmt.line,
          );
        break;
      }
      case "deref_compound_assign": {
        const ptr = this.mem.getVar(stmt.target);
        if (!ptr) this.crash(`Undefined variable '${stmt.target}'.`, stmt.line);
        if (ptr.value === 0) this.crash(`Null pointer write through '${stmt.target}'.`, stmt.line);

        const target = this.mem.resolveAddress(ptr.value);
        if (!target) 
          this.crash(
            `Invalid pointer write at 0x${ptr.value.toString(16).toUpperCase()}.`,
            stmt.line,
          );
        if (target.kind === "heap" && target.block.freed)
          this.crash(`Write after free at 0x${ptr.value.toString(16).toUpperCase()}.`, stmt.line);

        const currentValue = this.mem.deref(ptr.value); 
        const rhs = this.evalExpr(stmt.value)
        if (stmt.op === "/=" && rhs === 0) {
          this.crash(`Division by zero while updating '*${stmt.target}'.`, stmt.line);
        }

        const ops = {
          "+=": (a, b) => a + b,
          "-=": (a, b) => a - b,
          "*=": (a, b) => a * b,
          "/=": (a, b) => Math.trunc(a / b),
        };

        const nextValue = ops[stmt.op](currentValue, rhs); 
        if (!this.mem.setDeref(ptr.value, nextValue)) {
          this.crash(
            `Invalid pointer write at 0x${ptr.value.toString(16).toUpperCase()}.`,
            stmt.line,
          );
        }

        break;
      }
      case "array_assign": {
        const arrayVar = this.mem.getVar(stmt.name);
        if (!arrayVar) this.crash(`Undefined array '${stmt.name}'.`, stmt.line);
        if (!arrayVar.isArray) this.crash(`'${stmt.name}' is not an array.`, stmt.line);
        const idx = this.evalExpr(stmt.index);
        if (idx < 0 || idx >= arrayVar.size)
          this.crash(`Array index ${idx} is out of bounds for '${stmt.name}'.`, stmt.line);
        this.mem.setArrayElem(stmt.name, idx, this.evalExpr(stmt.value));
        break;
      }
      case "printf": {
        const vals = stmt.args.map((arg) => this.evalExpr(arg));

        let valueIndex = 0;

        const output = stmt.fmt.replace(/%[difsc%]/g, (match) => {
          if (match === "%%") return "%";
          if (valueIndex >= vals.length) return match;

          const value = vals[valueIndex++];

          if (match === "%s") return this.mem.readCString(value);
          if (match === "%c") return String.fromCharCode(value);

          return String(value);
        });

        this.onOutput(output);
        break;
      }
      case "free": {
        const addr = this.evalExpr(stmt.arg);
        if (addr === 0) break;
        if (!this.mem.freeHeap(addr))
          this.crash(`Invalid free() address 0x${addr.toString(16).toUpperCase()}.`, stmt.line);
        break;
      }
      case "return": {
        const val = stmt.value ? this.evalExpr(stmt.value) : 0;
        this.doReturn(val);
        break;
      }
      case "expr_stmt": {
        this.evalExpr(stmt.expr);
        break;
      }
    }
  }

  /**
   * Evaluates an expression AST node and returns its runtime value.
   *
   * This method handles literals, variables, binary operations, unary operations,
   * address-of, pointer dereference, `sizeof`, casts, `malloc`, function calls,
   * and array access.
   *
   * For function calls, this may start a new function call and throw
   * `CallPending` so the step-based interpreter can pause the current statement.
   *
   * @param {?ExprNode} node - Expression AST node to evaluate
   * @returns {*} Runtime value produced by the expression
   * @throws {RuntimeCrash} If the expression performs an invalid runtime operation
   * @throws {CallPending} If evaluating a function call pauses the current statement
   */
  evalExpr(node) {
    if (!node) return 0;
    switch (node.kind) {
      case "num":
        return node.value;
      case "str":
        return this.mem.addStringLiteral(node.value);
      case "var": {
        const v = this.mem.getVar(node.name);
        if (!v) this.crash(`Undefined variable '${node.name}'.`);
        if (v.isArray) return v.addr;
        return v.value;
      }
      case "binop": {
        const left = this.evalExpr(node.left);

        if (node.op === "&&") {
          if (left === 0) {
            return 0;
          }

          return this.evalExpr(node.right) !== 0 ? 1 : 0;
        }

        if (node.op === "||") {
          if (left !== 0) {
            return 1;
          }

          return this.evalExpr(node.right) !== 0 ? 1 : 0;
        }

        const right = this.evalExpr(node.right);
        const leftPointer = this.getPointerInfo(node.left);
        const rightPointer = this.getPointerInfo(node.right);

        if (node.op === "+") {
          if (leftPointer && rightPointer) this.crash("Cannot add two pointers.");
          if (leftPointer) {
            return left + right * (leftPointer.stride ?? this.getPointerStride(leftPointer.type));
          }
          if (rightPointer) {
            return right + left * (rightPointer.stride ?? this.getPointerStride(rightPointer.type));
          }
        }

        if (node.op === "-") {
          if (leftPointer && rightPointer) {
            const leftStride = leftPointer.stride ?? this.getPointerStride(leftPointer.type);
            const rightStride = rightPointer.stride ?? this.getPointerStride(rightPointer.type);
            if (leftStride !== rightStride) {
              this.crash("Cannot subtract pointers with different element sizes.");
            }
            return Math.trunc((left - right) / leftStride);
          }
          if (leftPointer) {
            return left - right * (leftPointer.stride ?? this.getPointerStride(leftPointer.type));
          }
          if (rightPointer) this.crash("Cannot subtract a pointer from a non-pointer value.");
        }

        if (
          (leftPointer || rightPointer) &&
          !["==", "!=", "<", ">", "<=", ">="].includes(node.op)
        ) {
          this.crash(`Invalid pointer arithmetic operator '${node.op}'.`);
        }

        if (
          (node.op === "/" || node.op === "%") &&
          right === 0
        ) {
          this.crash("Division by zero.");
        }

        const ops = {
          "+": (a, b) => a + b,
          "-": (a, b) => a - b,
          "*": (a, b) => a * b,
          "/": (a, b) => Math.trunc(a / b),
          "%": (a, b) => a % b,
          "==": (a, b) => (a === b ? 1 : 0),
          "!=": (a, b) => (a !== b ? 1 : 0),
          "<": (a, b) => (a < b ? 1 : 0),
          ">": (a, b) => (a > b ? 1 : 0),
          "<=": (a, b) => (a <= b ? 1 : 0),
          ">=": (a, b) => (a >= b ? 1 : 0),
        };

        return (ops[node.op] || (() => 0))(left, right);
      }
      case "negate":
        return -this.evalExpr(node.expr);
      case "not":
        return this.evalExpr(node.expr) ? 0 : 1;
      case "addr_of": {
        return this.resolveLValue(node.expr || { kind: "var", name: node.name }).address;
      }
      case "deref": {
        return this.readLValue(this.resolveLValue(node));
      }
      case "sizeof":
        return getTypeSize(node.type);
      case "cast":
        return this.evalExpr(node.expr);
      case "malloc": {
        const size = this.evalExpr(node.size);
        return this.mem.allocHeap(size);
      }
      case "call": {
        const context = this.callStack[this.callStack.length - 1];
        if (context.expressionResults.has(node)) return context.expressionResults.get(node);
        const func = this.program.functions[node.name];
        if (!func) this.crash(`Undefined function '${node.name}'.`);
        const args = node.args.map((a) => this.evalExpr(a));
        this.callFunction(node.name, args, { frame: context, node });

/** Bytes per rendered memory slot. Everything is 4-byte aligned. */
const SLOT_BYTES = 4;

/**
 * Where each region's address space begins, mirroring MemoryModel:
 * globals grow up from 0x1000, heap up from 0x4000, stack down from 0x7ff0.
 */
const REGION_ORIGIN = { stack: 0x7fec, heap: 0x4000, global: 0x1000 };

/** Fallback row height if we can't measure a real row (matches --cx-row-h). */
const FALLBACK_ROW_H = 32;

/**
 * Slots an empty region shows even when measurement fails — a pane that's
 * hidden, still loading fonts, or laid out at zero height would otherwise show
 * nothing at all, which is the one state this feature exists to prevent.
 */
const MIN_EMPTY_SLOTS = 8;

/** Hue used for every pointer/allocation tint, matching --cx-ptr (#b45309). */
const POINTER_HUE = 32;

class Visualizer {
  constructor() {
    this.stackEl = document.getElementById("stackViz");
    this.heapEl = document.getElementById("heapViz");
    this.globalEl = document.getElementById("globalViz");
    this.prevState = null;

    /** Last memory model rendered, so a mode change can repaint from it. */
    this.lastMem = null;

    /** @type {"empty"|"garbage"|"hidden"} How unallocated slots are drawn. */
    this.unfilledMode = "empty";

    // The number of blank slots depends on the pane's pixel height, which
    // changes when the slide is resized or the widget expands to full screen.
    if (typeof ResizeObserver === "function") {
      const ro = new ResizeObserver(() => this.padRegions());
      [this.stackEl, this.heapEl, this.globalEl].forEach((el) => el && ro.observe(el));
    }
  }

  /**
   * @param {"empty"|"garbage"|"hidden"} mode - Unfilled-slot presentation.
   */
  setUnfilledMode(mode) {
    if (!["empty", "garbage", "hidden"].includes(mode)) return;
    if (mode === this.unfilledMode) return;
    this.unfilledMode = mode;

    // A full repaint, not just re-padding: the mode also decides whether the
    // "no heap allocations"-style hints are drawn, and padRegions only adds and
    // removes blank rows.
    this.repaint();
  }

  /** Redraw at the current mode, from live memory if there is any. */
  repaint() {
    if (this.lastMem) this.render(this.lastMem);
    else this.clear();
  }

  hex(n) {
    return "0x" + (n >>> 0).toString(16).toUpperCase().padStart(4, "0");
  }

  /**
   * Deterministic stand-in for the indeterminate bytes a real uninitialised
   * slot would hold. Derived from the address so a slot shows the same junk on
   * every re-render — flickering values would read as the program changing
   * something, which is the opposite of the point.
   *
   * @param {number} addr - Slot address.
   * @returns {string} A plausible garbage word.
   */
  garbageFor(addr) {
    let h = (addr >>> 0) * 2654435761;
    h ^= h >>> 15;
    h = (h * 2246822519) >>> 0;
    h ^= h >>> 13;
    return "0x" + (h >>> 0).toString(16).toUpperCase().padStart(8, "0").slice(0, 8);
  }

  formatVal(v, type) {
    if (v === null || v === undefined) return "???";
    if (type && type.pointer > 0) {
      if (v === 0) return "NULL";
      return this.hex(v);
    }
    return String(v);

  isPointer(type) {
    return type && type.pointer > 0;

  render(mem) {
    this.lastMem = mem;
    this.renderStack(mem);
    this.renderHeap(mem);
    this.renderGlobals(mem);
    this.padRegions();
    this.prevState = this.snapshot(mem);

  /**
   * Markup for a single unallocated slot.

   * @param {string} cellClass - Base cell class for the owning region.
   * @returns {string} Row HTML.
   */
  blankRowHtml(addr, cellClass) {

      this.unfilledMode === "garbage"
        ? `<span class="mem-value mem-value-garbage">${this.garbageFor(addr)}</span>`
        : `<span class="mem-value mem-value-empty"></span>`;

      `<div class="${cellClass} memory-row memory-row-unfilled" data-addr="${addr}" aria-hidden="true">` +

    this.padRegion(this.heapEl, "heap", "mem-cell");
    this.padRegion(this.globalEl, "global", "global-cell");

  /**
   * @param {HTMLElement} el - Region content element.
   * @param {"stack"|"heap"|"global"} region - Which address space.
   * @param {string} cellClass - Base cell class for this region.
   */
  padRegion(el, region, cellClass) {
    if (!el) return;

    el.querySelectorAll(".memory-row-unfilled").forEach((n) => n.remove());
    if (this.unfilledMode === "hidden") return;

    // clientHeight is 0 while the widget is hidden (Beamer+ parks off-slide
    // panes) or before first layout. We don't bail on that: an empty region
    // falls back to MIN_EMPTY_SLOTS below, and the ResizeObserver re-pads once
    // the pane has a real height.

      el.querySelector(".memory-row")?.getBoundingClientRect().height || FALLBACK_ROW_H;
    if (rowH <= 0) return;

    // scrollHeight is clamped to at least clientHeight, so an empty pane reports
    // itself as full and we'd never draw a single slot.
    const cs = getComputedStyle(el);
    const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);

    let used = 0;
    for (const child of el.children) {
      const rect = child.getBoundingClientRect();
      const margin = parseFloat(getComputedStyle(child).marginBottom) || 0;
      used += rect.height + margin;
    }

    let count = Math.floor((box - padY - used) / rowH);

    // A region with nothing in it must always show some address space, even if
    // the measurement came back unusable (hidden pane, fonts still loading).
    // Keyed on real children rather than the pixel sum — a single child's
    // margin is enough to make `used` non-zero on an otherwise empty measure.
    if (el.children.length === 0) count = Math.max(count, MIN_EMPTY_SLOTS);
    if (count < 1) return;

    // Continue from the addresses already in use: the stack grows down toward
    // lower addresses, the heap and globals up toward higher ones.
    const occupied = [...el.querySelectorAll("[data-addr]")]
      .map((n) => Number(n.dataset.addr))
      .filter(Number.isFinite);

    const down = region === "stack";
    let addr;
    if (occupied.length === 0) {
      addr = REGION_ORIGIN[region];
    } else {
      addr = down ? Math.min(...occupied) - SLOT_BYTES : Math.max(...occupied) + SLOT_BYTES;
    }

    let html = "";
    for (let i = 0; i < count && addr >= 0; i++) {

      .map((size, dimensionIndex) => {

          .slice(dimensionIndex + 1)

  }

  renderStructFields(variable) {
    let html = `<div class="array-cells">`;
    for (const field of variable.structDef.fields) {
      const storedField = variable.fields[field.name];
      html += `<div class="array-cell"><span class="array-index">${this.formatType(field.type)} .${field.name} @ ${this.hex(variable.addr + field.offset)}</span><span class="array-val">${this.formatVal(storedField.value, field.type)}</span></div>`;

    if (extraClasses) classes.push(extraClasses);
    if (allocation) classes.push("allocation-linked");

      this.isPointer(variable.type) &&
      mem.heap.has(variable.value)
        ? this.allocationMeta(variable.value, mem.heap.get(variable.value).freed)

    const rows = [];

    for (let offset = 0; offset < allocatedSize; offset += 4) {

          : getTypeSize(field.type);
        this.addRowItem(rows, field.offset, fieldSize, {
          label: `${this.formatType(field.type)} .${field.name}`,
          value: this.formatVal(storedField.value, field.type),

          value: this.formatVal(variable.values[i], elemType),

    if (visibleItems.length === 0) {
      return `<span class="memory-row-continuation" aria-hidden="true"></span>`;
    }

    if (visibleItems.length === 1 && visibleItems[0].scalar) {

        ? "null-val"
        : "";
      if (this.isPointer(row.variable.type)) {
        return this.renderPointerValue(
          "",
          row.variable.value,
          row.variable.type,
          nullClass,
          row.allocation,
        );
      }
      return `<span class="mem-value">${visibleItems[0].value}</span>`;
    }

    return `<span class="memory-row-items">${visibleItems
      .map(
        (item) =>
          `<span class="memory-row-item"><span class="memory-row-item-label">${item.label}</span><span class="memory-row-item-value">${item.value}</span></span>`,
      )
      .join("")}</span>`;
  }

  renderMemoryRow(row, regionClass) {
    const classes = [regionClass, "memory-row"];
    if (row.isNew) classes.push("new-cell");
    if (row.allocation) classes.push("allocation-linked");
    if (row.allocation && row.allocation.freed) classes.push("allocation-freed");
    if (Number.isFinite(row.groupHue)) classes.push("memory-row-grouped");
    const name = row.declaration
      ? this.renderMemName(row.declaration)
      : `<span class="memory-row-blank" aria-hidden="true"></span>`;
    const styles = [];
    if (row.allocation) styles.push(`--alloc-hue:${row.allocation.hue}`);
    if (Number.isFinite(row.groupHue)) styles.push(`--row-group-hue:${row.groupHue}`);

    // A value spanning several slots gets one row scaled to that many slots,
    // with every address it covers still listed.
    let addr;
    if (row.slots > 1) {
      classes.push("memory-row-multi");
      styles.push(`--row-slots:${row.slots}`);
      addr = row.slotAddresses
        .slice()
        .sort((a, b) => b - a)
        .map((a) => `<span>${this.hex(a)}</span>`)
        .join("");
    } else {
      addr = this.hex(row.address);
    }

    const styleAttr = styles.length > 0 ? ` style="${styles.join(";")}"` : "";
    return `<div class="${classes.join(" ")}" data-addr="${row.address}" data-base="${row.base}"${styleAttr}>${name}${this.renderRowItems(row)}<span class="mem-addr">${addr}</span></div>`;
  }

  /**
   * The hint shown when a region holds nothing. Suppressed unless unfilled
   * slots are hidden — otherwise the blank address grid already communicates
   * "this space exists but is empty", and a message on top of it just adds noise.
   *
   * @param {string} text - Hint to display.
   * @returns {string} Row HTML, possibly empty.
   */
  emptyStateHtml(text) {
    return this.unfilledMode === "hidden" ? `<div class="empty-state">${text}</div>` : "";
  }

  renderStack(mem) {
    if (mem.stack.length === 0) {
      this.stackEl.innerHTML = this.emptyStateHtml("Run code to see stack");
      return;
    }

    // Frames are not drawn as boxes and carry no caption. Variables are plain
    // rows in the same grid as the unfilled slots, so one appearing simply
    // fills an address that was already on screen. The only trace of frame
    // membership is the left accent its rows share.
    let html = "";

    // Oldest frame first. The stack grows toward lower addresses, so main()
    // holds the highest ones — walking frames in call order makes the whole
    // pane read as one descending address range, with the unfilled slots
    // continuing straight on from the innermost frame.
    for (let i = 0; i < mem.stack.length; i++) {
      const frame = mem.stack[i];
      const colorKey = this.frameColorClass(frame, i);
      const rows = [];
      for (const [name, v] of frame.vars) {
        rows.push(...this.buildVariableRows(name, v, mem, this.isNewVar(frame.name, name)));
      }
      rows.sort((a, b) => b.address - a.address);
      html += rows
        .map((row) => this.renderMemoryRow(row, `mem-cell frame-row frame-${colorKey}`))
        .join("");
    }
    this.stackEl.innerHTML = html;
  }

  renderHeap(mem) {
    if (mem.heap.size === 0) {
      this.heapEl.innerHTML = this.emptyStateHtml("No heap allocations");
      return;
    }

    // Flat rows, like the stack: no block wrapper and no header. An allocation
    // is identified by the hue its rows share, and a freed one by the struck
    // value, so the pane stays a plain address grid.
    let html = "";
    for (const [addr, block] of mem.heap) {
      const allocation = this.allocationMeta(addr, block.freed);
      const rowClasses = ["mem-cell", "memory-row", "allocation-linked"];
      if (block.freed) rowClasses.push("allocation-freed");

      for (let j = 0; j < block.elemCount; j++) {
        const cellAddr = addr + j * 4;
        html += `<div class="${rowClasses.join(" ")}" data-addr="${cellAddr}" data-base="${addr}"${this.allocationStyleAttr(allocation)}>`;
        html += this.renderMemName(`[${j}]`);
        html += `<span class="mem-value ${block.freed ? "freed" : ""}">${block.values[j]}</span>`;
        html += `<span class="mem-addr">${this.hex(cellAddr)}</span></div>`;
      }
    }
    this.heapEl.innerHTML = html;
  }

  renderGlobals(mem) {
    if (mem.globals.size === 0) {
      this.globalEl.innerHTML = this.emptyStateHtml("No global variables");
      return;
    }

    let html = "";
    const rows = [];
    for (const [name, v] of mem.globals) {
      const displayName = v.displayName || name;
      rows.push(...this.buildVariableRows(displayName, v, mem));
    }
    rows.sort((a, b) => a.address - b.address);
    html += rows.map((row) => this.renderMemoryRow(row, "global-cell")).join("");
    this.globalEl.innerHTML = html;
  }

  clear() {
    this.lastMem = null;
    this.stackEl.innerHTML = this.emptyStateHtml("Run code to see stack");
    this.heapEl.innerHTML = this.emptyStateHtml("No heap allocations");
    this.globalEl.innerHTML = this.emptyStateHtml("No global variables");
    this.padRegions();
    this.prevState = null;
  }
}

    <script>
const INDENT_UNIT = "    ";

function getLineStart(text, index) {
  const safeIndex = Math.max(0, Math.min(index, text.length));
  return text.lastIndexOf("\n", safeIndex - 1) + 1;
}

function getLineEnd(text, index) {
  const safeIndex = Math.max(0, Math.min(index, text.length));
  const nextBreak = text.indexOf("\n", safeIndex);
  return nextBreak === -1 ? text.length : nextBreak;
}

function getLineIndent(line) {
  return (line.match(/^[ \t]*/) || [""])[0];
}

function initEditor(codeInput, onCommit) {
  function commitEditorChange(nextValue, selectionStart, selectionEnd = selectionStart) {
    codeInput.value = nextValue;
    codeInput.selectionStart = selectionStart;
    codeInput.selectionEnd = selectionEnd;
    onCommit();
  }

  function indentSelection() {
    const text = codeInput.value;
    const start = codeInput.selectionStart;
    const end = codeInput.selectionEnd;

    if (start === end) {
      commitEditorChange(
        text.slice(0, start) + INDENT_UNIT + text.slice(end),
        start + INDENT_UNIT.length,
      );
      return;
    }

    const firstLineStart = getLineStart(text, start);
    const selectionEndIndex = end > start && text[end - 1] === "\n" ? end - 1 : end;
    const lastLineEnd = getLineEnd(text, selectionEndIndex);
    const lines = text.slice(firstLineStart, lastLineEnd).split("\n");
    const indentedBlock = lines.map((line) => INDENT_UNIT + line).join("\n");
    commitEditorChange(
      text.slice(0, firstLineStart) + indentedBlock + text.slice(lastLineEnd),
      start + INDENT_UNIT.length,
      end + INDENT_UNIT.length * lines.length,
    );
  }

  function outdentSelection() {
    const text = codeInput.value;
    const start = codeInput.selectionStart;
    const end = codeInput.selectionEnd;
    const firstLineStart = getLineStart(text, start);
    const selectionEndIndex = end > start && text[end - 1] === "\n" ? end - 1 : end;
    const lastLineEnd = getLineEnd(text, selectionEndIndex);
    const lines = text.slice(firstLineStart, lastLineEnd).split("\n");

    let removedFromFirstLine = 0,
      removedTotal = 0;
    const outdentedBlock = lines
      .map((line, index) => {
        let removed = 0;
        if (line.startsWith(INDENT_UNIT)) {
          removed = INDENT_UNIT.length;
          line = line.slice(INDENT_UNIT.length);
        } else {
          const partial = line.match(/^[ \t]{1,4}/);
          if (partial) {
            removed = partial[0].length;
            line = line.slice(removed);
          }
        }
        if (index === 0) removedFromFirstLine = removed;
        removedTotal += removed;
        return line;
      })
      .join("\n");

    if (removedTotal === 0) return;

    const nextValue = text.slice(0, firstLineStart) + outdentedBlock + text.slice(lastLineEnd);
    if (start === end) {
      commitEditorChange(nextValue, Math.max(firstLineStart, start - removedFromFirstLine));
      return;
    }
    commitEditorChange(
      nextValue,
      Math.max(firstLineStart, start - removedFromFirstLine),
      Math.max(firstLineStart, end - removedTotal),
    );
  }

  function insertIndentedNewline() {
    const text = codeInput.value;
    const start = codeInput.selectionStart;
    const end = codeInput.selectionEnd;
    const lineStart = getLineStart(text, start);
    const lineEnd = getLineEnd(text, end);
    const lineText = text.slice(lineStart, lineEnd);
    const beforeCaret = text.slice(lineStart, start);
    const afterCaret = text.slice(end, lineEnd);
    const baseIndent = getLineIndent(lineText);
    const shouldIncreaseIndent = /{$/.test(beforeCaret.trimEnd());
    const shouldFormatBraceBlock = shouldIncreaseIndent && afterCaret.trimStart().startsWith("}");

    if (shouldFormatBraceBlock) {
      const insertion = `\n${baseIndent}${INDENT_UNIT}\n${baseIndent}`;
      commitEditorChange(
        text.slice(0, start) + insertion + text.slice(end),
        start + 1 + baseIndent.length + INDENT_UNIT.length,
      );
      return;
    }

    const nextIndent = shouldIncreaseIndent ? baseIndent + INDENT_UNIT : baseIndent;
    const insertion = `\n${nextIndent}`;
    commitEditorChange(
      text.slice(0, start) + insertion + text.slice(end),
      start + insertion.length,
    );
  }

  function insertClosingBraceWithOutdent() {
    const text = codeInput.value;
    const start = codeInput.selectionStart;
    const end = codeInput.selectionEnd;
    if (start !== end) return false;

    const lineStart = getLineStart(text, start);
    const beforeCaret = text.slice(lineStart, start);
    if (!/^\s+$/.test(beforeCaret)) return false;

    const nextIndent =
      beforeCaret.length >= INDENT_UNIT.length
        ? beforeCaret.slice(0, beforeCaret.length - INDENT_UNIT.length)
        : "";
    commitEditorChange(
      text.slice(0, lineStart) + nextIndent + "}" + text.slice(end),
      lineStart + nextIndent.length + 1,
    );
    return true;
  }

  return {
    indentSelection,
    outdentSelection,
    insertIndentedNewline,
    insertClosingBraceWithOutdent,
  };
}
    </script>
    <script>
/**
 * Wires the DOM controls to the interpreter and visualizer.
 *
 * Theming is deliberately NOT handled here. Beamer+ injects its own design
 * tokens into every widget iframe and cortexc.css consumes them, so a local
 * theme toggle would only fight the host.
 *
 * @returns {Object} A control surface used by the Beamer+ bridge.
 */
function initController(mem, viz) {
  const codeInput = document.getElementById("codeInput");
  const lineNumbers = document.getElementById("lineNumbers");
  const consoleOutput = document.getElementById("consoleOutput");
  const runBtn = document.getElementById("runBtn");
  const stepBtn = document.getElementById("stepBtn");
  const resetBtn = document.getElementById("resetBtn");
  const speedSelect = document.getElementById("speedSelect");
  const stepCounter = document.getElementById("stepCounter");
  const editorStatus = document.getElementById("editorStatus");
  const syntaxMessage = document.getElementById("syntaxMessage");
  const crashOverlay = document.getElementById("crashOverlay");
  const crashReason = document.getElementById("crashReason");
  const crashLine = document.getElementById("crashLine");
  const crashCloseBtn = document.getElementById("crashCloseBtn");

  let interp = null;
  let running = false;
  let runTimer = null;
  let highlightEl = null;
  let errorHighlightEl = null;
  let runtimeCrash = null;
  let editorDiagnostic = {
    severity: "ok",
    label: "Syntax OK",
    message: "Ready to edit and run.",
    line: null,
  };

  const {
    indentSelection,
    outdentSelection,
    insertIndentedNewline,
    insertClosingBraceWithOutdent,
  } = initEditor(codeInput, handleEditorContentChange);

  function appendConsole(text, type = "") {
    const span = document.createElement("span");
    if (type) span.className = type;
    span.textContent = text;
    consoleOutput.appendChild(span);
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
  }

  function showCrashOverlay(reason, line = null) {
    runtimeCrash = { reason, line };
    crashReason.textContent = reason;
    // Sits in the card header next to the label, so keep it terse.
    crashLine.textContent = line ? `line ${line}` : "";
    crashOverlay.hidden = false;
    updateSyntaxStatus();
    refreshEditorDecorations();
  }

  function clearCrashOverlay() {
    runtimeCrash = null;
    crashOverlay.hidden = true;
    crashReason.textContent = "Execution stopped because of a runtime error.";
    crashLine.textContent = "";
    updateSyntaxStatus();
  }

  function dismissCrashOverlay() {
    clearCrashOverlay();
    codeInput.focus();
  }

  function handleRuntimeCrash(reason, line = null) {
    clearInterval(runTimer);
    running = false;
    if (interp) interp.finished = true;
    setRunButtonState(false);
    appendConsole("\n=== PROGRAM CRASHED ===\n", "console-error");
    appendConsole((line ? `Line ${line}: ` : "") + reason + "\n", "console-error");
    showCrashOverlay(reason, line);
  }

  /**
   * Update the status strip.
   *
   * Severity is carried on the container as a data attribute rather than by a
   * badge, so the message itself colours to match. `editorDiagnostic.label`
   * ("Syntax OK", "Syntax Error") is unused here — it only existed to fill the
   * pill — but stays on the diagnostic for callers that want a short form.
   */
  function updateSyntaxStatus() {
    if (runtimeCrash) {
      editorStatus.dataset.severity = "error";
      syntaxMessage.textContent = runtimeCrash.line
        ? `Runtime crash on line ${runtimeCrash.line}: ${runtimeCrash.reason}`
        : `Runtime crash: ${runtimeCrash.reason}`;
      return;
    }
    editorStatus.dataset.severity = editorDiagnostic.severity;
    syntaxMessage.textContent = editorDiagnostic.message;
  }

  function analyzeEditorCode() {
    const code = codeInput.value;
    if (code.trim() === "")
      return {
        severity: "warning",
        label: "Empty",
        message: "Editor is empty.",
        line: null,
      };
    try {
      const tokens = tokenize(code);
      const parser = new Parser(tokens);
      const program = parser.parse();
      if (!program.functions.main)
        return {
          severity: "warning",
          label: "Warning",
          message: "Syntax OK. Add a main() function to run the program.",
          line: null,
        };
      return {
        severity: "ok",
        label: "Syntax OK",
        message: "No syntax errors detected.",
        line: null,
      };
    } catch (e) {
      const message = String(e.message || e);
      const lineMatch = message.match(/line\s+(\d+)/i);
      return {
        severity: "error",
        label: "Syntax Error",
        message,
        line: lineMatch ? Number(lineMatch[1]) : null,
      };
    }
  }

  function validateEditorCode() {
    editorDiagnostic = analyzeEditorCode();
    updateSyntaxStatus();
    return editorDiagnostic;
  }

  function getCaretLine() {
    return codeInput.value.slice(0, codeInput.selectionStart).split("\n").length;
  }

  function getActiveEditorLine() {
    if (interp && interp.currentLine > 0) return interp.currentLine;
    return getCaretLine();
  }

  function setLineOverlay(existingEl, lineNum, className) {
    if (existingEl) existingEl.remove();
    const totalLines = codeInput.value.split("\n").length;
    if (!lineNum || lineNum < 1 || lineNum > totalLines) return null;
    const lineHeight = parseFloat(getComputedStyle(codeInput).lineHeight);
    const paddingTop = parseFloat(getComputedStyle(codeInput).paddingTop);
    const top = paddingTop + (lineNum - 1) * lineHeight - codeInput.scrollTop;
    const el = document.createElement("div");
    el.className = className;
    el.style.top = top + "px";
    el.style.height = lineHeight + "px";
    codeInput.parentElement.appendChild(el);
    return el;
  }

  function updateLineNumbers(
    activeLine = getActiveEditorLine(),
    errorLine = editorDiagnostic.severity === "error" ? editorDiagnostic.line : null,
  ) {
    const lines = codeInput.value.split("\n");
    lineNumbers.innerHTML = lines
      .map((_, i) => {
        const n = i + 1;
        const classes = [];
        if (n === activeLine) classes.push("active-line");
        if (n === errorLine) classes.push("error-line");
        return `<div${classes.length ? ` class="${classes.join(" ")}"` : ""}>${n}</div>`;
      })
      .join("");
  }

  function refreshEditorDecorations() {
    const activeLine = getActiveEditorLine();
    const errorLine =
      runtimeCrash?.line ?? (editorDiagnostic.severity === "error" ? editorDiagnostic.line : null);
    if (activeLine && errorLine && activeLine === errorLine) {
      if (errorHighlightEl) {
        errorHighlightEl.remove();
        errorHighlightEl = null;
      }
      highlightEl = setLineOverlay(highlightEl, activeLine, "line-highlight line-highlight-error");
    } else {
      errorHighlightEl = setLineOverlay(errorHighlightEl, errorLine, "diagnostic-line-highlight");
      highlightEl = setLineOverlay(highlightEl, activeLine, "line-highlight");
    }
    updateLineNumbers(activeLine, errorLine);
  }

  function handleEditorContentChange() {
    if (interp) {
      doReset();
      return;
    }
    clearCrashOverlay();
    validateEditorCode();
    refreshEditorDecorations();
  }

  function setRunButtonState(isRunning) {
    runBtn.textContent = isRunning ? "Pause" : "Run";
    runBtn.classList.toggle("running", isRunning);
  }

  function initInterpreter() {
    consoleOutput.textContent = "";
    clearCrashOverlay();
    try {
      const tokens = tokenize(codeInput.value);
      const parser = new Parser(tokens);
      const program = parser.parse();
      interp = new Interpreter(
        mem,
        (msg) => appendConsole(msg),
        (msg) => appendConsole(msg + "\n", "console-error"),
        (reason, line) => handleRuntimeCrash(reason, line),
      );
      interp.load(program);
      interp.start();
      if (runtimeCrash) return false;
      viz.render(mem);
      stepCounter.textContent = "Step 0";
      refreshEditorDecorations();
      return true;
    } catch (e) {
      if (e instanceof RuntimeCrash) {
        handleRuntimeCrash(e.message, e.line ?? null);
        return false;
      }
      appendConsole(e.message + "\n", "console-error");
      validateEditorCode();
      refreshEditorDecorations();
      return false;
    }
  }

  function doStep() {
    if (!interp || interp.finished) return false;
    const cont = interp.step();
    viz.render(mem);
    stepCounter.textContent = `Step ${interp.stepCount}`;
    if (interp.finished) {
      appendConsole("\n--- Program finished ---\n", "console-info");
      setRunButtonState(false);
      running = false;
    }
    refreshEditorDecorations();
    return cont;
  }

  function doRun() {
    if (running) {
      clearInterval(runTimer);
      running = false;
      setRunButtonState(false);
      return;
    }
    if (!interp || interp.finished) {
      if (!initInterpreter()) return;
    }
    running = true;
    setRunButtonState(true);
    runTimer = setInterval(() => {
      if (!doStep()) {
        clearInterval(runTimer);
        running = false;
        setRunButtonState(false);
      }
    }, parseInt(speedSelect.value, 10));
  }

  /**
   * Fast-forward to a given step count with no animation. Used to restore the
   * widget's position when Beamer+ sends widget-set-state after the presenter
   * navigates back to the slide.
   *
   * @param {number} targetStep - Step index to replay up to.
   */
  function replayTo(targetStep) {
    doReset();
    if (!targetStep || targetStep < 1) return;
    if (!initInterpreter()) return;
    for (let i = 0; i < targetStep; i++) {
      if (!doStep()) break;
    }
  }

  function doReset() {
    clearInterval(runTimer);
    running = false;
    interp = null;
    mem.reset();
    viz.clear();
    clearCrashOverlay();
    consoleOutput.textContent = "";
    setRunButtonState(false);
    stepCounter.textContent = "Step 0";
    validateEditorCode();
    updateSyntaxStatus();
    refreshEditorDecorations();
  }

  runBtn.addEventListener("click", doRun);
  stepBtn.addEventListener("click", () => {
    if (!interp || interp.finished) {
      if (!initInterpreter()) return;
    }
    doStep();
  });
  resetBtn.addEventListener("click", doReset);
  crashCloseBtn.addEventListener("click", dismissCrashOverlay);
  codeInput.addEventListener("input", handleEditorContentChange);
  codeInput.addEventListener("scroll", () => {
    lineNumbers.scrollTop = codeInput.scrollTop;
    refreshEditorDecorations();
  });
  codeInput.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      e.preventDefault();
      if (e.shiftKey) outdentSelection();
      else indentSelection();
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      insertIndentedNewline();
      return;
    }
    if (e.key === "}" && insertClosingBraceWithOutdent()) e.preventDefault();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !crashOverlay.hidden) {
      e.preventDefault();
      dismissCrashOverlay();
    }
  });
  ["click", "focus", "mouseup", "keyup", "select"].forEach((evt) =>
    codeInput.addEventListener(evt, refreshEditorDecorations),
  );

  validateEditorCode();
  refreshEditorDecorations();

  // Paint the regions through the same path a reset uses. Without this the
  // panes keep the placeholder markup from index.html until the first Run or
  // Step, so the pre-drawn address grid wouldn't appear on load.
  viz.clear();

  // ── Control surface consumed by the Beamer+ bridge ──────────────────────
  return {
    run: doRun,
    step: () => {
      if (!interp || interp.finished) {
        if (!initInterpreter()) return;
      }
      doStep();
    },
    reset: doReset,

    getCode: () => codeInput.value,
    setCode(code) {
      if (typeof code !== "string") return;
      codeInput.value = code;
      handleEditorContentChange();
    },

    getSpeed: () => parseInt(speedSelect.value, 10),
    setSpeed(ms) {
      const wanted = String(ms);
      if (![...speedSelect.options].some((o) => o.value === wanted)) return;
      speedSelect.value = wanted;
    },

    setReadOnly(readOnly) {
      codeInput.readOnly = !!readOnly;
    },

    /** @param {"empty"|"garbage"|"hidden"} mode - Unfilled-slot presentation. */
    setUnfilledMode(mode) {
      viz.setUnfilledMode(mode);
    },

    /** @returns {{code: string, speed: number, steps: number}} Serialisable state. */
    getState: () => ({
      code: codeInput.value,
      speed: parseInt(speedSelect.value, 10),
      steps: interp ? interp.stepCount : 0,
    }),

    setState(state) {
      if (!state || typeof state !== "object") return;
      if (typeof state.code === "string") codeInput.value = state.code;
      if (state.speed != null) this.setSpeed(state.speed);
      replayTo(Number(state.steps) || 0);
    },

    /** Stop all timers and release the interpreter. */
    destroy() {
      clearInterval(runTimer);
      runTimer = null;
      running = false;
      interp = null;
    },
  };
}
    </script>
    <script>
/**
 * Beamer+ integration layer.
 *
 * Beamer+ loads each widget into an isolated iframe via `srcdoc`, injects
 * `window.WIDGET_CONFIG` before the widget's own scripts run, and then talks
 * to it over postMessage. This module is the only part of CortexC that knows
 * any of that — everything else stays host-agnostic, so index.html still works
 * when opened directly in a browser.
 *
 * Protocol (see the Widgets section of the Beamer+ in-app help):
 *   ← widget-config     presenter's field values, sent again on every edit
 *   ← widget-get-state  reply with widget-state before the slide is parked
 *   ← widget-set-state  restore from a previously reported state
 *   ← widget-cleanup    stop timers, release resources
 *   → widget-state      our serialisable state
 *
 * Beamer+ also accepts widget-expand / widget-collapse for full-slide resizing.
 * We don't send them: the widget is sized by whoever places it on the slide.
 */

function initBeamerBridge(controls) {
  const inBeamer = window.parent !== window;

  let widgetId = null;
  let applied = false;

  /**
   * The last starter program the host handed us.
   *
   * Beamer+ resends widget-config on every Properties edit, so we can't just
   * apply `code` each time — that would wipe whatever the presenter has typed
   * into the editor mid-lesson. But we also can't apply it only once, or edits
   * to the starter-code field in edit mode would appear to do nothing.
   *
   * Comparing against the last value the host sent separates the two: a value
   * that changed means someone edited the field, so apply it. An identical
   * resend is just Beamer+ re-announcing config, so leave the editor alone.
   *
   * @type {?string}
   */
  let hostCode = null;

  /**
   * Apply a Beamer+ config payload to the widget.
   *
   * Sent once on load and again whenever the presenter edits a field in the
   * Properties panel, so this must be idempotent. `code` is only applied on
   * the first pass — re-applying it later would wipe out edits the presenter
   * made live in the editor.
   *
   * @param {Object} cfg - Field values plus Beamer+ layout/session metadata.
   */
  function applyConfig(cfg) {
    if (!cfg || typeof cfg !== "object") return;

    widgetId = cfg.id ?? cfg.widgetId ?? widgetId;

    if (cfg.speed != null) controls.setSpeed(cfg.speed);
    if (cfg.unfilled != null) controls.setUnfilledMode(cfg.unfilled);
    controls.setReadOnly(cfg.readOnly === true || cfg.role === "viewer");

    // Apply the starter program on first load, and again whenever the host
    // sends a different one — which is what editing the field produces.
    const code = normaliseCode(cfg.code);
    if (code && code !== hostCode) {
      hostCode = code;
      controls.setCode(code);
    }

    // Autorun stays first-load-only: re-running every time a field changes
    // would make the widget unusable to configure.
    if (!applied) {
      if (cfg.autorun === true && cfg.role !== "viewer") controls.run();
      applied = true;
    }
  }

  /**
   * Accept the starting program either as a plain string (what the Properties
   * textarea produces) or as an array of lines.
   *
   * The array form exists for hand-written slide configs: a C program written
   * as a JSON string needs every newline escaped, which is miserable to read
   * and easy to get wrong. As a list, each line is just a list entry.
   *
   *   "code": "int main() {\n    return 0;\n}"
   *   "code": ["int main() {", "    return 0;", "}"]
   *
   * @param {string|string[]|undefined} value - Raw config value.
   * @returns {string} Source text, or "" if there is nothing usable.
   */
  function normaliseCode(value) {
    if (Array.isArray(value)) {
      const lines = value.filter((line) => typeof line === "string");
      return lines.length > 0 ? lines.join("\n") : "";
    }
    return typeof value === "string" && value.trim() ? value : "";
  }

  function post(type, extra) {
    if (!inBeamer) return;
    try {
      window.parent.postMessage(Object.assign({ type }, extra || {}), "*");
    } catch {
      /* cross-origin parent — nothing we can do, and nothing we need to do */
    }
  }

  window.addEventListener("message", (e) => {
    const data = e.data;
    if (!data || typeof data !== "object") return;

    switch (data.type) {
      case "widget-config":
        applyConfig(data.config);
        break;

      case "widget-get-state":
        post("widget-state", { widgetId, state: controls.getState() });
        break;

      case "widget-set-state":
        controls.setState(data.state);
        break;

      case "widget-cleanup":
        controls.destroy();
        break;

      default:
        break;
    }
  });

  // Beamer+ injects WIDGET_CONFIG before our scripts run, so apply it
  // immediately rather than waiting for the widget-config message. The
  // message still arrives afterwards and is handled idempotently.
  applyConfig(window.WIDGET_CONFIG);
}
    </script>
    <script>
/**
 * Entry point.
 *
 * The bundled widget is injected into an iframe via `srcdoc`, so we can't rely
 * on the scripts being parsed after the body — guard on readyState rather than
 * assuming the DOM is already built.
 */
function initializeApp() {
  const memoryModel = new MemoryModel();
  const memoryVisualizer = new Visualizer();

  const controls = initController(memoryModel, memoryVisualizer);
  initBeamerBridge(controls);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initializeApp, { once: true });
} else {
  initializeApp();
}
    </script>
