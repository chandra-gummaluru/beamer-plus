<!DOCTYPE html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "YouTube Video",
  "category": "Tools",
  "fields": [
    { "key": "videoId",        "label": "YouTube URL or Video ID", "type": "text",     "placeholder": "https://youtube.com/watch?v=…" },
    { "key": "autoplay",       "label": "Autoplay on slide load",  "type": "checkbox", "default": false },
    { "key": "startTime",      "label": "Start time (seconds)",    "type": "number",   "min": 0, "step": 1, "placeholder": "0" },
    { "key": "allowManualUrl", "label": "Allow URL input box",     "type": "checkbox", "default": false }
  ]
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Widget</title>
<style>
:root {
  --bg:         oklch(99% 0.003 80);
  --bg-2:       oklch(97% 0.005 80);
  --bg-3:       oklch(94% 0.007 80);
  --bg-4:       oklch(90% 0.008 80);
  --ink-1:      oklch(22% 0.012 260);
  --ink-2:      oklch(38% 0.010 260);
  --ink-3:      oklch(55% 0.008 260);
  --ink-4:      oklch(72% 0.006 260);
  --accent:     oklch(45% 0.005 260);
  --accent-hi:  oklch(32% 0.006 260);
  --accent-lo:  oklch(92% 0.004 260);
  --ok:         oklch(52% 0.14 160);
  --err:        oklch(58% 0.18 25);
  --line:       1px solid oklch(85% 0.005 260);
  --r:          6px;
  --mono:       ui-monospace, "SF Mono", Menlo, monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: var(--font);
}

#container {
  position: relative;
  width: 100%;
  height: 100%;
  background: #000;
}

#player-wrap {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

#player-wrap iframe,
#player-wrap > div {
  width: 100% !important;
  height: 100% !important;
}

#click-layer {
  position: absolute;
  inset: 0;
  z-index: 5;
  cursor: pointer;
}

/* Bottom controls overlay */
#controls {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 10;
  background: linear-gradient(transparent, rgba(0,0,0,0.80));
  padding: 32px 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  transition: opacity 0.3s ease;
}

#controls.hidden {
  opacity: 0;
  pointer-events: none;
}

#controls.viewer-mode {
  display: none !important;
}

#progress-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

#time-display {
  font-family: var(--mono);
  font-size: calc(11px * var(--u));
  color: rgba(255,255,255,0.82);
  white-space: nowrap;
  min-width: 84px;
  text-align: right;
}

#scrubber {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,0.25);
  outline: none;
  cursor: pointer;
}

#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 0 3px rgba(0,0,0,0.5);
}

#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  border: none;
  box-shadow: 0 0 3px rgba(0,0,0,0.5);
}

#buttons-row {
  display: flex;
  align-items: center;
  gap: 2px;
}

.ctrl-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 5px;
  border-radius: var(--r);
  color: rgba(255,255,255,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  flex-shrink: 0;
}

.ctrl-btn:hover {
  background: rgba(255,255,255,0.14);
}

.ctrl-btn svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

#spacer { flex: 1; }

#vol-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
}

#vol-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 68px;
  height: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,0.25);
  outline: none;
  cursor: pointer;
}

#vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
}

#vol-slider::-moz-range-thumb {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  border: none;
}

/* Placeholder */
#placeholder {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  gap: 14px;
  color: var(--ink-2);
  font-family: var(--font);
}

#placeholder.hidden { display: none; }

#placeholder svg {
  width: 44px;
  height: 44px;
  fill: var(--ink-4);
}

#placeholder p {
  font-size: calc(15px * var(--u));
  color: var(--ink-3);
}

#url-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

#url-input {
  font-family: var(--mono);
  font-size: calc(13px * var(--u));
  padding: 7px 10px;
  border: var(--line);
  border-radius: var(--r);
  background: var(--bg-2);
  color: var(--ink-1);
  width: 280px;
  outline: none;
  transition: border-color 0.15s;
}

#url-input:focus {
  border-color: var(--accent);
}

#load-btn {
  font-family: var(--font);
  font-size: calc(14px * var(--u));
  padding: 7px 16px;
  border: none;
  border-radius: var(--r);
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  transition: background 0.15s;
}

#load-btn:hover {
  background: var(--accent-hi);
}
</style>
</head>
<body>
<div id="container">
  <div id="player-wrap">
    <div id="yt-player"></div>
  </div>

  <div id="click-layer"></div>

  <div id="controls" class="hidden">
    <div id="progress-row">
      <input type="range" id="scrubber" min="0" max="100" value="0" step="0.1">
      <span id="time-display">0:00 / 0:00</span>
    </div>
    <div id="buttons-row">
      <button class="ctrl-btn" id="btn-play" title="Play/Pause (Space)">
        <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <div id="vol-wrap">
        <button class="ctrl-btn" id="btn-mute" title="Mute (M)">
          <svg id="icon-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          <svg id="icon-muted" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <input type="range" id="vol-slider" min="0" max="100" value="80">
      </div>

      <div id="spacer"></div>

      <button class="ctrl-btn" id="btn-fs" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>

  <div id="placeholder">
    <svg viewBox="0 0 24 24"><path d="M21.58 7.19c-.23-.86-.91-1.54-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42c-.86.23-1.54.91-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.91 1.54 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42c.86-.23 1.54-.91 1.77-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></svg>
    <p>No video loaded</p>
    <div id="url-row">
      <input type="text" id="url-input" placeholder="YouTube URL or video ID…">
      <button id="load-btn">Load</button>
    </div>
  </div>
</div>

<script src="/static/vendor/socket.io.min.js"></script>
<script>
// ── State ────────────────────────────────────────────────────────────────────
let player       = null;
let cfg          = {};
let socket       = null;
let hideTimer    = null;
let progressTimer = null;
let isScrubbing  = false;
let isMuted      = false;
let lastVolume   = 80;
let isPlaying    = false;

// ── DOM ──────────────────────────────────────────────────────────────────────
const container  = document.getElementById('container');
const controls   = document.getElementById('controls');
const placeholder = document.getElementById('placeholder');
const scrubber   = document.getElementById('scrubber');
const timeDisp   = document.getElementById('time-display');
const btnPlay    = document.getElementById('btn-play');
const iconPlay   = document.getElementById('icon-play');
const iconPause  = document.getElementById('icon-pause');
const btnMute    = document.getElementById('btn-mute');
const iconVol    = document.getElementById('icon-vol');
const iconMuted  = document.getElementById('icon-muted');
const volSlider  = document.getElementById('vol-slider');
const btnFs      = document.getElementById('btn-fs');
const clickLayer = document.getElementById('click-layer');
const urlInput   = document.getElementById('url-input');
const loadBtn    = document.getElementById('load-btn');
const urlRow     = document.getElementById('url-row');

// ── Helpers ──────────────────────────────────────────────────────────────────
function extractVideoId(input) {
  if (!input) return null;
  input = input.trim();
  let m;
  m = input.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  m = input.match(/[?&]v=([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  m = input.match(/\/embed\/([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  if (/^[A-Za-z0-9_-]{11}$/.test(input)) return input;
  return null;
}

function fmtTime(secs) {
  if (!secs || isNaN(secs)) return '0:00';
  secs = Math.floor(secs);
  const m = Math.floor(secs / 60);
  const s = String(secs % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function setPlayIcon(playing) {
  isPlaying = playing;
  iconPlay.style.display  = playing ? 'none' : '';
  iconPause.style.display = playing ? '' : 'none';
}

function setMuteIcon(muted) {
  isMuted = muted;
  iconVol.style.display   = muted ? 'none' : '';
  iconMuted.style.display = muted ? '' : 'none';
}

function updateScrubberFill(pct) {
  scrubber.style.background =
    `linear-gradient(to right, rgba(255,255,255,0.85) ${pct}%, rgba(255,255,255,0.25) ${pct}%)`;
}

// ── Controls visibility ──────────────────────────────────────────────────────
function showControls() {
  if (cfg.role === 'viewer') return;
  controls.classList.remove('hidden');
  resetHideTimer();
}

function resetHideTimer() {
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (isPlaying) controls.classList.add('hidden');
  }, 3000);
}

container.addEventListener('mousemove', showControls);
container.addEventListener('mouseenter', showControls);

// ── Progress loop ────────────────────────────────────────────────────────────
function startProgressLoop() {
  stopProgressLoop();
  progressTimer = setInterval(() => {
    if (!player || isScrubbing) return;
    try {
      const cur = player.getCurrentTime?.() || 0;
      const dur = player.getDuration?.() || 0;
      if (dur > 0) {
        const pct = (cur / dur) * 100;
        scrubber.value = pct;
        updateScrubberFill(pct);
      }
      timeDisp.textContent = `${fmtTime(cur)} / ${fmtTime(dur)}`;
    } catch (_) {}
  }, 500);
}

function stopProgressLoop() {
  clearInterval(progressTimer);
}

// ── Socket sync ──────────────────────────────────────────────────────────────
function connectSocket(url, widgetId) {
  if (socket) { socket.disconnect(); socket = null; }
  if (!url) return;
  try {
    socket = io(url, { transports: ['websocket', 'polling'] });
    socket.on('connect', () => console.log('[yt-widget] socket connected'));
    socket.on('widget_state', (data) => {
      if (!player || data?.widgetId !== widgetId) return;
      if (cfg.role !== 'viewer') return;
      const state = data?.state || {};
      try {
        if (state.videoId && state.videoId !== cfg.videoId) {
          cfg.videoId = state.videoId;
          player.loadVideoById({ videoId: state.videoId, startSeconds: state.time || 0 });
          return;
        }
        if (state.action === 'seek' && state.time != null) player.seekTo(state.time, true);
        if (state.action === 'play')  { player.playVideo?.();  setPlayIcon(true); }
        if (state.action === 'pause') { player.pauseVideo?.(); setPlayIcon(false); }
      } catch (_) {}
    });
  } catch (_) {}
}

function emitState(action, extra = {}) {
  if (!socket || cfg.role === 'viewer') return;
  try {
    socket.emit('widget_state', {
      widgetId: cfg.widgetId || 'yt-default',
      state: {
        videoId: cfg.videoId,
        action,
        time: player?.getCurrentTime?.() || 0,
        ...extra,
      },
    });
  } catch (_) {}
}

// ── YouTube IFrame API ───────────────────────────────────────────────────────
function loadYouTubeAPI() {
  return new Promise(resolve => {
    if (window.YT && window.YT.Player) { resolve(); return; }
    window.onYouTubeIframeAPIReady = resolve;
    if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) {
      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    }
  });
}

async function createPlayer(videoId, startTime) {
  await loadYouTubeAPI();
  if (player) {
    try { player.destroy(); } catch (_) {}
    player = null;
  }
  const wrap = document.getElementById('player-wrap');
  wrap.innerHTML = '<div id="yt-player"></div>';

  return new Promise(resolve => {
    player = new YT.Player('yt-player', {
      videoId,
      playerVars: {
        enablejsapi: 1,
        controls: 0,
        modestbranding: 1,
        rel: 0,
        start: Math.floor(startTime || 0),
        playsinline: 1,
        fs: 0,
      },
      events: {
        onReady(e) {
          e.target.setVolume(lastVolume);
          if (cfg.autoplay) e.target.playVideo();
          startProgressLoop();
          placeholder.classList.add('hidden');
          controls.classList.remove('hidden');
          resolve();
        },
        onStateChange(e) {
          const S = YT.PlayerState;
          if (e.data === S.PLAYING) {
            setPlayIcon(true);
            startProgressLoop();
            resetHideTimer();
          } else if (e.data === S.PAUSED || e.data === S.ENDED) {
            setPlayIcon(false);
            stopProgressLoop();
            showControls();
          }
        }
      }
    });
  });
}

// ── updateConfig ─────────────────────────────────────────────────────────────
async function updateConfig(newCfg) {
  cfg = { ...cfg, ...newCfg };
  cfg.widgetId = cfg.id || cfg.widgetId || 'yt-default';
  const allowManualUrl = cfg.allowManualUrl === true && cfg.role !== 'viewer';
  if (urlRow) urlRow.style.display = allowManualUrl ? 'flex' : 'none';

  if (cfg.socketUrl) {
    connectSocket(cfg.socketUrl, cfg.widgetId);
  }

  if (cfg.role === 'viewer') {
    controls.classList.add('viewer-mode');
    if (urlRow) urlRow.style.display = 'none';
  }

  const videoId = extractVideoId(cfg.videoId || cfg.url || '');
  if (videoId) {
    cfg.videoId = videoId;
    await createPlayer(videoId, cfg.startTime || 0);
  }
}

// ── destroy ───────────────────────────────────────────────────────────────────
function destroy() {
  stopProgressLoop();
  clearTimeout(hideTimer);
  if (socket) { socket.disconnect(); socket = null; }
  if (player) { try { player.destroy(); } catch (_) {} player = null; }
}

// ── Message listener ─────────────────────────────────────────────────────────
window.addEventListener('message', e => {
  if (e.data?.type === 'widget-config')  updateConfig(e.data.config);
  if (e.data?.type === 'widget-cleanup') destroy?.();
  // Beamer+ state persistence protocol
  if (e.data?.type === 'widget-get-state') {
    const currentTime = player?.getCurrentTime?.() || 0;
    window.parent.postMessage({ type: 'widget-state', widgetId: cfg.widgetId,
      state: { videoId: cfg.videoId, time: currentTime } }, '*');
  }
  if (e.data?.type === 'widget-set-state' && e.data.state) {
    const s = e.data.state;
    if (s.videoId && s.videoId !== cfg.videoId) {
      cfg.videoId = s.videoId;
      player?.loadVideoById?.({ videoId: s.videoId, startSeconds: s.time || 0 });
    } else if (s.time != null && player?.seekTo) {
      player.seekTo(s.time, true);
    }
  }
});

// ── Control interactions ──────────────────────────────────────────────────────
function togglePlayPause() {
  if (!player) return;
  try {
    if (player.getPlayerState() === YT.PlayerState.PLAYING) {
      player.pauseVideo();
      emitState('pause');
    } else {
      player.playVideo();
      emitState('play');
    }
  } catch (_) {}
}

clickLayer.addEventListener('click', togglePlayPause);
btnPlay.addEventListener('click', (e) => { e.stopPropagation(); togglePlayPause(); });

scrubber.addEventListener('mousedown', () => { isScrubbing = true; });
scrubber.addEventListener('input', () => {
  if (!player) return;
  try {
    const dur = player.getDuration() || 0;
    const pct = parseFloat(scrubber.value);
    updateScrubberFill(pct);
    timeDisp.textContent = `${fmtTime((pct / 100) * dur)} / ${fmtTime(dur)}`;
  } catch (_) {}
});
scrubber.addEventListener('change', () => {
  if (!player) return;
  try {
    const dur = player.getDuration() || 0;
    const t = (parseFloat(scrubber.value) / 100) * dur;
    player.seekTo(t, true);
    emitState('seek', { time: t });
  } catch (_) {}
  isScrubbing = false;
});

volSlider.addEventListener('input', () => {
  if (!player) return;
  lastVolume = parseInt(volSlider.value);
  try {
    player.setVolume(lastVolume);
    if (lastVolume === 0) { player.mute(); setMuteIcon(true); }
    else { player.unMute(); setMuteIcon(false); }
  } catch (_) {}
});

btnMute.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!player) return;
  try {
    if (isMuted) {
      player.unMute();
      player.setVolume(lastVolume || 80);
      volSlider.value = lastVolume || 80;
      setMuteIcon(false);
    } else {
      lastVolume = player.getVolume?.() || 80;
      player.mute();
      volSlider.value = 0;
      setMuteIcon(true);
    }
  } catch (_) {}
});

btnFs.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
});

loadBtn.addEventListener('click', () => {
  const vid = extractVideoId(urlInput.value);
  if (vid) {
    cfg.videoId = vid;
    createPlayer(vid, 0);
    emitState('seek', { videoId: vid, time: 0 });
  }
});

urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loadBtn.click();
});

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (!player || cfg.role === 'viewer') return;
  if (document.activeElement === urlInput) return;
  try {
    switch (e.key) {
      case ' ':
        e.preventDefault();
        togglePlayPause();
        break;
      case 'ArrowLeft': {
        e.preventDefault();
        const t = Math.max(0, (player.getCurrentTime() || 0) - 10);
        player.seekTo(t, true);
        emitState('seek', { time: t });
        break;
      }
      case 'ArrowRight': {
        e.preventDefault();
        const t = Math.min(player.getDuration() || 0, (player.getCurrentTime() || 0) + 10);
        player.seekTo(t, true);
        emitState('seek', { time: t });
        break;
      }
      case 'm':
      case 'M':
        btnMute.click();
        break;
      case 'f':
      case 'F':
        btnFs.click();
        break;
    }
  } catch (_) {}
});
</script>
</body>
</html>
