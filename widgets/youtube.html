<script src="/static/vendor/socket.io.min.js"></script>
<script>
// ── State ────────────────────────────────────────────────────────────────────
let player        = null;
let playerReady   = false;
let cfg           = {};
let socket        = null;
let socketUrl     = null;
let hideTimer     = null;
let progressTimer = null;
let isScrubbing   = false;
let isMuted       = false;
let lastVolume    = 80;
let isPlaying     = false;
let trimMode      = false;
let currentVid    = null;
let pendingState  = null;   // a widget-set-state that arrived before onReady
let started       = false;  // has this player ever played — drives the poster

// ── DOM ──────────────────────────────────────────────────────────────────────
const container   = document.getElementById('container');
const wrap        = document.getElementById('player-wrap');
const cover       = document.getElementById('cover');
const coverPlay   = document.getElementById('cover-play');
const coverReplay = document.getElementById('cover-replay');
const controls    = document.getElementById('controls');
const placeholder = document.getElementById('placeholder');
const scrubber    = document.getElementById('scrubber');
const timeDisp    = document.getElementById('time-display');
const btnPlay     = document.getElementById('btn-play');
const iconPlay    = document.getElementById('icon-play');
const iconPause   = document.getElementById('icon-pause');
const btnMute     = document.getElementById('btn-mute');
const iconVol     = document.getElementById('icon-vol');
const iconMuted   = document.getElementById('icon-muted');
const volSlider   = document.getElementById('vol-slider');
const btnFs       = document.getElementById('btn-fs');
const btnTrim     = document.getElementById('btn-trim');
const trimRow     = document.getElementById('trim-row');
const trimStartV  = document.getElementById('trim-start-val');
const trimEndV    = document.getElementById('trim-end-val');
const trimMsg     = document.getElementById('trim-msg');
const clickLayer  = document.getElementById('click-layer');
const urlInput    = document.getElementById('url-input');
const loadBtn     = document.getElementById('load-btn');
const urlRow      = document.getElementById('url-row');

// ── Helpers ──────────────────────────────────────────────────────────────────
const isViewer     = () => cfg.role === 'viewer';
const hideUI       = () => cfg.hideYouTubeUI !== false;
const wantControls = () => cfg.showControls !== false;

function extractVideoId(input) {
  if (!input) return null;
  input = String(input).trim();
  let m;
  m = input.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  m = input.match(/[?&]v=([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  m = input.match(/\/(?:embed|shorts|live)\/([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  if (/^[A-Za-z0-9_-]{11}$/.test(input)) return input;
  return null;
}

function fmtTime(secs) {
  if (!secs || isNaN(secs) || secs < 0) return '0:00';
  secs = Math.floor(secs);
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = String(secs % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
}

function setPlayIcon(playing) {
  isPlaying = playing;
  iconPlay.style.display  = playing ? 'none' : '';
  iconPause.style.display = playing ? '' : 'none';
}

function setMuteIcon(muted) {
  isMuted = muted;
  iconVol.style.display   = muted ? 'none' : '';
  iconMuted.style.display = muted ? '' : 'none';
}

const ytState = () => { try { return player?.getPlayerState?.(); } catch (_) { return undefined; } };
const curTime = () => { try { return player?.getCurrentTime?.() || 0; } catch (_) { return 0; } };
const duration = () => { try { return player?.getDuration?.() || 0; } catch (_) { return 0; } };

// ── Clip (trim) ──────────────────────────────────────────────────────────────
// Start/end are stored in whole seconds by the settings panel's duration
// field. An end at or before the start means "no end": play to the finish.
function clipStart() { return Math.max(0, Number(cfg.startTime) || 0); }
function clipEndSet() {
  const e = Number(cfg.endTime) || 0;
  return e > clipStart() ? e : 0;
}
function clipEnd() {
  const d = duration();
  const e = clipEndSet();
  if (e) return d ? Math.min(e, d) : e;
  return d;
}

// The scrubber spans the clip normally, and the whole video while trimming
// so the presenter can find points outside the current clip.
function scrubRange() {
  if (trimMode) return [0, duration()];
  return [clipStart(), clipEnd()];
}

// ── Layout: crop away YouTube's chrome ───────────────────────────────────────
function layoutPlayer() {
  const W = container.clientWidth, H = container.clientHeight;
  if (!hideUI() || !W || !H) {
    Object.assign(wrap.style, { left: '0px', top: '0px', width: '100%', height: '100%' });
    return;
  }
  // Fit a 16:9 box, then pad it above and below. The pads are generous: they
  // are letterbox black that gets clipped, and YouTube's overlays grow with
  // the player (its "big mode" kicks in on large screens).
  let vw = W, vh = W * 9 / 16;
  if (vh > H) { vh = H; vw = H * 16 / 9; }
  const pad = Math.round(Math.max(160, vh * 0.35));
  Object.assign(wrap.style, {
    left:   Math.round((W - vw) / 2) + 'px',
    top:    Math.round((H - vh) / 2 - pad) + 'px',
    width:  Math.round(vw) + 'px',
    height: Math.round(vh + 2 * pad) + 'px',
  });
}

window.addEventListener('resize', layoutPlayer);
if (window.ResizeObserver) new ResizeObserver(layoutPlayer).observe(container);

// ── Poster cover ─────────────────────────────────────────────────────────────
function setPoster(vid) {
  // maxres doesn't exist for every video; YouTube answers with a 120×90 grey
  // stand-in rather than a clean 404, so check the size too.
  const img = new Image();
  const fallback = () => { cover.style.backgroundImage = `url("https://i.ytimg.com/vi/${vid}/hqdefault.jpg")`; };
  img.onload  = () => {
    if (img.naturalWidth <= 120) fallback();
    else cover.style.backgroundImage = `url("${img.src}")`;
  };
  img.onerror = fallback;
  img.src = `https://i.ytimg.com/vi/${vid}/maxresdefault.jpg`;
}

function showCover(kind) {   // 'play' | 'replay' | null
  if (!kind || !hideUI()) { cover.classList.remove('shown'); return; }
  coverPlay.style.display   = kind === 'play'   ? '' : 'none';
  coverReplay.style.display = kind === 'replay' ? '' : 'none';
  cover.classList.add('shown');
}

// ── Controls visibility ──────────────────────────────────────────────────────
function applyControlsVisibility() {
  controls.classList.toggle('viewer-mode', isViewer());
  controls.classList.toggle('off', !wantControls());
  btnTrim.style.display = isViewer() ? 'none' : '';
}

function showControls() {
  if (isViewer() || !wantControls() || !playerReady) return;
  controls.classList.remove('hidden');
  resetHideTimer();
}

function resetHideTimer() {
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (isPlaying && !trimMode) controls.classList.add('hidden');
  }, 3000);
}

container.addEventListener('mousemove', showControls);
container.addEventListener('mouseenter', showControls);

// Buttons and sliders must not keep keyboard focus: a focused range input
// swallows the arrow keys (the host's nav bridge leaves inputs alone), which
// is what made ←/→ seek the video instead of changing slides.
controls.addEventListener('pointerup', () => {
  setTimeout(() => {
    const a = document.activeElement;
    if (a && a !== document.body && a !== urlInput) a.blur?.();
  }, 0);
});

// ── Progress loop ────────────────────────────────────────────────────────────
function updateProgress() {
  if (!player || isScrubbing) return;
  const cur = curTime();
  const [lo, hi] = scrubRange();
  const span = hi - lo;
  const pct = span > 0 ? Math.min(100, Math.max(0, ((cur - lo) / span) * 100)) : 0;
  scrubber.value = pct;
  paintScrubber(pct);
  timeDisp.textContent = trimMode
    ? `${fmtTime(cur)} / ${fmtTime(duration())}`
    : `${fmtTime(cur - lo)} / ${fmtTime(span)}`;
}

function paintScrubber(pct) {
  const hi = 'rgba(255,255,255,0.85)', lo = 'rgba(255,255,255,0.25)';
  if (!trimMode) {
    scrubber.style.background = `linear-gradient(to right, ${hi} ${pct}%, ${lo} ${pct}%)`;
    return;
  }
  // While trimming, show the kept region against the whole video.
  const d = duration() || 1;
  const s = (clipStart() / d) * 100;
  const e = ((clipEndSet() || d) / d) * 100;
  const out = 'rgba(255,255,255,0.12)', keep = 'rgba(255,255,255,0.55)';
  scrubber.style.background =
    `linear-gradient(to right, ${out} ${s}%, ${keep} ${s}%, ${keep} ${e}%, ${out} ${e}%)`;
}

function tick() {
  if (!player) return;
  // Enforce the clip end ourselves rather than with YouTube's `end` param:
  // that one only applies to the first play and ends in YouTube's end screen.
  if (!trimMode && isPlaying && clipEndSet() && curTime() >= clipEnd() - 0.15) {
    try { player.pauseVideo(); } catch (_) {}
    setPlayIcon(false);
    showCover('replay');
    emitState('pause');
  }
  updateProgress();
}

function startProgressLoop() {
  stopProgressLoop();
  progressTimer = setInterval(tick, 200);
}

function stopProgressLoop() {
  clearInterval(progressTimer);
  progressTimer = null;
}

// ── Socket sync ──────────────────────────────────────────────────────────────
function connectSocket(url) {
  if (url === socketUrl && socket) return;
  if (socket) { socket.disconnect(); socket = null; }
  socketUrl = url;
  if (!url || typeof io === 'undefined') return;
  try {
    socket = io(url, { transports: ['websocket', 'polling'] });
    socket.on('widget_state', (data) => {
      if (!player || !isViewer() || data?.widgetId !== cfg.widgetId) return;
      const state = data?.state || {};
      try {
        if (state.clip) { cfg.startTime = state.clip[0]; cfg.endTime = state.clip[1]; }
        if (state.videoId && state.videoId !== currentVid) {
          currentVid = state.videoId;
          setPoster(currentVid);
          player.loadVideoById({ videoId: state.videoId, startSeconds: state.time || 0 });
          return;
        }
        if (state.action === 'seek' && state.time != null) player.seekTo(state.time, true);
        if (state.action === 'play')  { player.playVideo?.();  setPlayIcon(true); }
        if (state.action === 'pause') { player.pauseVideo?.(); setPlayIcon(false); }
        updateProgress();
      } catch (_) {}
    });
  } catch (_) { socket = null; }
}

function emitState(action, extra = {}) {
  if (!socket || isViewer()) return;
  try {
    socket.emit('widget_state', {
      widgetId: cfg.widgetId || 'yt-default',
      state: {
        videoId: currentVid,
        action,
        time: curTime(),
        clip: [clipStart(), clipEndSet()],
        ...extra,
      },
    });
  } catch (_) {}
}

// ── YouTube IFrame API ───────────────────────────────────────────────────────
function loadYouTubeAPI() {
  return new Promise(resolve => {
    if (window.YT && window.YT.Player) { resolve(); return; }
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { prev?.(); resolve(); };
    if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) {
      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    }
  });
}

async function createPlayer(videoId) {
  currentVid = videoId;
  await loadYouTubeAPI();
  if (currentVid !== videoId) return;   // superseded while the API loaded
  if (player) {
    try { player.destroy(); } catch (_) {}
    player = null;
  }
  playerReady = false;
  started     = false;
  wrap.innerHTML = '<div id="yt-player"></div>';
  setPoster(videoId);
  showCover('play');
  layoutPlayer();

  return new Promise(resolve => {
    player = new YT.Player('yt-player', {
      videoId,
      playerVars: {
        enablejsapi:    1,
        controls:       0,
        disablekb:      1,
        modestbranding: 1,
        rel:            0,
        iv_load_policy: 3,   // no annotations / info cards
        start:          Math.floor(clipStart()),
        playsinline:    1,
        fs:             0,
      },
      events: {
        onReady(e) {
          playerReady = true;
          e.target.setVolume(lastVolume);
          placeholder.classList.add('hidden');
          if (pendingState) { const s = pendingState; pendingState = null; restoreState(s); }
          if (cfg.autoplay && !isViewer()) e.target.playVideo();
          updateProgress();
          showControls();
          resolve();
        },
        onStateChange(e) {
          const S = YT.PlayerState;
          if (e.data === S.PLAYING) {
            started = true;
            setPlayIcon(true);
            showCover(null);
            startProgressLoop();
            resetHideTimer();
          } else if (e.data === S.PAUSED) {
            setPlayIcon(false);
            stopProgressLoop();
            updateProgress();
            showControls();
          } else if (e.data === S.ENDED) {
            setPlayIcon(false);
            stopProgressLoop();
            updateProgress();
            showCover('replay');   // hides YouTube's end-screen suggestions
            showControls();
          }
        }
      }
    });
  });
}

// ── Play / pause / seek ──────────────────────────────────────────────────────
function play() {
  if (!player || !playerReady) return;
  try {
    // Outside the clip (or sitting at its end): start the clip over.
    if (!trimMode) {
      const t = curTime();
      const outside = t < clipStart() - 0.5 || (clipEnd() && t >= clipEnd() - 0.25);
      if (outside || ytState() === YT.PlayerState.ENDED) player.seekTo(clipStart(), true);
    }
    player.playVideo();
    emitState('play');
  } catch (_) {}
}

function pause() {
  if (!player || !playerReady) return;
  try { player.pauseVideo(); } catch (_) {}
  setPlayIcon(false);
  emitState('pause');
}

function togglePlayPause() {
  if (!player || isViewer()) return;
  if (ytState() === YT.PlayerState.PLAYING || ytState() === YT.PlayerState.BUFFERING) pause();
  else play();
}

// seekTo() on a video that hasn't started yet starts it playing, so a cued
// player is re-cued at the new time instead.
function seekQuiet(t) {
  if (!player || !playerReady) return;
  const st = ytState();
  try {
    if (!started || st === YT.PlayerState.UNSTARTED || st === YT.PlayerState.CUED) {
      player.cueVideoById({ videoId: currentVid, startSeconds: t });
      showCover('play');
    } else {
      player.seekTo(t, true);
      if (st === YT.PlayerState.ENDED) { player.pauseVideo(); }
    }
  } catch (_) {}
  setTimeout(updateProgress, 120);
}

function seekBy(dt) {
  if (!player || !playerReady) return;
  const [lo, hi] = scrubRange();
  const t = Math.min(hi || Infinity, Math.max(lo, curTime() + dt));
  seekQuiet(t);
  emitState('seek', { time: t });
}

// ── Trim ─────────────────────────────────────────────────────────────────────
function saveSettings(patch, remove = []) {
  Object.assign(cfg, patch);
  remove.forEach(k => { delete cfg[k]; });
  // Written into this widget's slide config item, so the trim saves with the
  // deck exactly as if it had been typed into the settings panel.
  try {
    window.parent.postMessage({ type: 'widget-settings', widgetId: cfg.id ?? cfg.widgetId,
                                patch, remove }, '*');
  } catch (_) {}
  emitState('seek', { time: curTime() });
}

function renderTrim() {
  trimRow.classList.toggle('shown', trimMode);
  btnTrim.classList.toggle('is-active', trimMode);
  trimStartV.textContent = fmtTime(clipStart());
  trimEndV.textContent   = clipEndSet() ? fmtTime(clipEndSet()) : 'end';
  updateProgress();
}

function flashTrim(msg) {
  trimMsg.textContent = msg;
  clearTimeout(flashTrim._t);
  flashTrim._t = setTimeout(() => { trimMsg.textContent = ''; }, 2500);
}

function setTrimMode(on) {
  if (isViewer()) return;
  trimMode = on;
  if (on) showControls();
  else {
    // Leaving trim mode outside the clip would put the scrubber off its ends.
    const t = curTime();
    if (t < clipStart() || (clipEndSet() && t > clipEnd())) seekQuiet(clipStart());
    resetHideTimer();
  }
  renderTrim();
}

function setStartHere() {
  const t = Math.floor(curTime());
  const patch = { startTime: t }, remove = [];
  if (clipEndSet() && clipEndSet() <= t) { remove.push('endTime'); flashTrim('End cleared — it was before the new start'); }
  saveSettings(patch, remove);
  renderTrim();
}

function setEndHere() {
  const t = Math.ceil(curTime());
  if (t <= clipStart()) { flashTrim('End must be after the start'); return; }
  saveSettings({ endTime: t });
  renderTrim();
}

function clearTrim() {
  saveSettings({}, ['startTime', 'endTime']);
  renderTrim();
}

btnTrim.addEventListener('click', (e) => { e.stopPropagation(); setTrimMode(!trimMode); });
document.getElementById('trim-set-start').addEventListener('click', setStartHere);
document.getElementById('trim-set-end').addEventListener('click', setEndHere);
document.getElementById('trim-clear').addEventListener('click', clearTrim);
document.getElementById('trim-done').addEventListener('click', () => setTrimMode(false));

// ── updateConfig ─────────────────────────────────────────────────────────────
// Re-called whenever settings change (the settings panel dispatches a fresh
// widget-config on every edit), so it only rebuilds what actually changed.
const LIVE_KEYS = ['startTime', 'endTime', 'autoplay', 'hideYouTubeUI', 'showControls', 'allowManualUrl'];

async function updateConfig(newCfg) {
  if (!newCfg) return;
  const prevStart = clipStart(), prevEnd = clipEndSet();
  const full = newCfg.id != null || newCfg.widgetId != null;
  cfg = { ...cfg, ...newCfg };
  // A full config is authoritative: a field cleared in the panel is simply
  // absent from it, and merging would otherwise keep the old value.
  if (full) LIVE_KEYS.forEach(k => { if (!(k in newCfg)) delete cfg[k]; });
  cfg.widgetId = cfg.id || cfg.widgetId || 'yt-default';

  const allowManualUrl = cfg.allowManualUrl === true && !isViewer();
  if (urlRow) urlRow.style.display = allowManualUrl ? 'flex' : 'none';

  if (cfg.socketUrl) connectSocket(cfg.socketUrl);
  applyControlsVisibility();
  layoutPlayer();

  const vid = extractVideoId(newCfg.videoId || newCfg.url || '') || currentVid;
  if (vid && vid !== currentVid) {
    await createPlayer(vid);
    return;
  }

  if (!hideUI()) showCover(null);
  else if (!started) showCover('play');

  // Trim edited from the settings panel: show the new start (or end) frame.
  if (playerReady && !isPlaying) {
    if (clipStart() !== prevStart)    seekQuiet(clipStart());
    else if (clipEndSet() !== prevEnd && clipEndSet() && started) seekQuiet(Math.max(clipStart(), clipEndSet() - 0.1));
  }
  renderTrim();
}

// ── Hidden / shown / destroy ─────────────────────────────────────────────────
function onHidden() {
  // The host parks this iframe rather than unloading it — without this the
  // video carried on (with sound) on the next slide.
  if (player && playerReady) {
    try { player.pauseVideo(); } catch (_) {}
    setPlayIcon(false);
    emitState('pause');
  }
  if (trimMode) setTrimMode(false);
}

function onShown() {
  layoutPlayer();
  if (cfg.autoplay && !isViewer() && playerReady) play();
}

function destroy() {
  stopProgressLoop();
  clearTimeout(hideTimer);
  if (socket) { socket.disconnect(); socket = null; socketUrl = null; }
  if (player) { try { player.destroy(); } catch (_) {} player = null; }
  playerReady = false;
}

// ── State persistence ────────────────────────────────────────────────────────
function restoreState(s) {
  if (!s) return;
  if (s.videoId && s.videoId !== currentVid) { createPlayer(s.videoId); return; }
  if (!playerReady) { pendingState = s; return; }
  if (s.time == null) return;
  const t = Number(s.time) || 0;
  if (Math.abs(t - curTime()) < 0.75) return;
  if (t < clipStart() || (clipEndSet() && t > clipEnd())) return;
  seekQuiet(t);
}

// ── Message listener ─────────────────────────────────────────────────────────
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'widget-config')  updateConfig(d.config);
  if (d.type === 'widget-cleanup') destroy();
  if (d.type === 'widget-hidden')  onHidden();
  if (d.type === 'widget-shown')   onShown();
  if (d.type === 'widget-get-state') {
    window.parent.postMessage({ type: 'widget-state', widgetId: cfg.widgetId,
      state: { videoId: currentVid, time: curTime() } }, '*');
  }
  if (d.type === 'widget-set-state' && d.state) restoreState(d.state);
});

// ── Control interactions ──────────────────────────────────────────────────────
clickLayer.addEventListener('click', togglePlayPause);
btnPlay.addEventListener('click', (e) => { e.stopPropagation(); togglePlayPause(); });

scrubber.addEventListener('pointerdown', () => { isScrubbing = true; });
scrubber.addEventListener('input', () => {
  if (!player) return;
  const [lo, hi] = scrubRange();
  const pct = parseFloat(scrubber.value);
  if (!trimMode) paintScrubber(pct);
  const t = lo + (pct / 100) * (hi - lo);
  timeDisp.textContent = trimMode
    ? `${fmtTime(t)} / ${fmtTime(duration())}`
    : `${fmtTime(t - lo)} / ${fmtTime(hi - lo)}`;
});
scrubber.addEventListener('change', () => {
  isScrubbing = false;
  if (!player) return;
  const [lo, hi] = scrubRange();
  const t = lo + (parseFloat(scrubber.value) / 100) * (hi - lo);
  seekQuiet(t);
  emitState('seek', { time: t });
});

volSlider.addEventListener('input', () => {
  if (!player) return;
  lastVolume = parseInt(volSlider.value, 10);
  try {
    player.setVolume(lastVolume);
    if (lastVolume === 0) { player.mute(); setMuteIcon(true); }
    else { player.unMute(); setMuteIcon(false); }
  } catch (_) {}
});

btnMute.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!player) return;
  try {
    if (isMuted) {
      player.unMute();
      player.setVolume(lastVolume || 80);
      volSlider.value = lastVolume || 80;
      setMuteIcon(false);
    } else {
      lastVolume = player.getVolume?.() || 80;
      player.mute();
      volSlider.value = 0;
      setMuteIcon(true);
    }
  } catch (_) {}
});

btnFs.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});

loadBtn.addEventListener('click', () => {
  const vid = extractVideoId(urlInput.value);
  if (vid) {
    createPlayer(vid);
    emitState('seek', { videoId: vid, time: 0 });
  }
});

urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loadBtn.click();
});

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
// ←/→ and PageUp/PageDown are deliberately NOT handled here: the host's nav
// bridge forwards them to the deck, so the arrows change slides even when
// the video has focus. Seeking uses YouTube's own J / L instead.
document.addEventListener('keydown', (e) => {
  if (!player || isViewer()) return;
  if (document.activeElement === urlInput) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  switch (e.key) {
    case ' ':
    case 'k': case 'K':
      e.preventDefault();
      togglePlayPause();
      break;
    case 'j': case 'J':
      e.preventDefault(); seekBy(-10); break;
    case 'l': case 'L':
      e.preventDefault(); seekBy(10); break;
    case 'm': case 'M':
      btnMute.click(); break;
    case 'f': case 'F':
      btnFs.click(); break;
    case 'i': case 'I':
      if (trimMode) { e.preventDefault(); setStartHere(); }
      break;
    case 'o': case 'O':
      if (trimMode) { e.preventDefault(); setEndHere(); }
      break;
    case 'Escape':
      if (trimMode) setTrimMode(false);
      break;
  }
});

// ── Boot ─────────────────────────────────────────────────────────────────────
if (window.WIDGET_CONFIG) updateConfig(window.WIDGET_CONFIG);
</script>
</body>
</html>
