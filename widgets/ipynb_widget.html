/* ============================================================================
   Beamer+ widget base — the shared design language for every widget.

   Injected into every widget iframe ahead of the widget's own <style>, so a
   widget can still override anything, but shouldn't need to: if two widgets
   both draw a toolbar, they should draw the same toolbar.

   What belongs here: tokens, the reset, and any furniture more than one
   widget needs — toolbars, buttons, status pills, inputs, banners, empty and
   loading states. What stays in a widget: whatever is genuinely its own
   (a keypad, a plot, a QR panel).

   ── Presentation scale ──────────────────────────────────────────────────
   These widgets are read from the back of a room, not from a desk. --u is
   the scale for everything the room has to READ; chrome (toolbars, small
   buttons, meta text) is deliberately fixed, so raising the scale makes the
   content bigger without inflating the furniture around it.

   A widget opts in by declaring a `scale` field in its schema — the settings
   kit applies the presenter's choice to --u automatically.
   ========================================================================= */

:root {
  /* Palette — light */
  --bg:         #ffffff;
  --bg-subtle:  #f9f9f8;
  --bg-output:  #fafaf9;
  --border:     #e9e9e6;
  --border-med: #d4d4cf;
  --text:       #1a1a18;
  --text-2:     #6b6b65;
  --text-3:     #aeaea5;
  --accent:     #52524e;
  --accent-bg:  #f0f0ee;
  --on-accent:  #ffffff;

  /* Status */
  --ok:     #15803d;
  --green:  #15803d;
  --warn:   #b45309;
  --amber:  #b45309;
  --err:    #c0392b;
  --red:    #dc2626;
  --err-bg: #fef2f2;

  /* Data colours — for anything a widget draws itself: word clouds, plots,
     result bars. Ordered so the first few carry the most weight, and defined
     for both themes so a canvas can read them instead of hardcoding ink. */
  --chart-1: #1a1a18;
  --chart-2: #3d3d3a;
  --chart-3: #52524e;
  --chart-4: #6b6b65;
  --chart-5: #85857d;
  --chart-6: #9c9c94;

  /* Shape & motion */
  --radius:    6px;
  --radius-lg: 10px;
  --dur:       0.12s;

  /* Type */
  /* Computer Modern, as on the slides (see "Slide-native look" below). */
  --font-ui:   'BW CM Sans', 'CMU Sans Serif', 'Latin Modern Sans', 'DM Sans', system-ui, -apple-system, sans-serif;
  /* Chrome — the bar's buttons, the settings sheet — in the slides' face
     too, in one weight (see the end of this file). */
  --font-chrome: 'BW CM Sans', 'CMU Sans Serif', 'Latin Modern Sans', 'DM Sans', system-ui, -apple-system, sans-serif;
  --font-chrome-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
  --font-mono: 'BW CM Typewriter', 'CMU Typewriter Text', 'Latin Modern Mono', 'JetBrains Mono', ui-monospace, monospace;

  /* Presentation scale — see the note above. */
  --u: 1.4;

  /* Chrome: fixed, whatever --u is. */
  --fs-chrome:    12px;
  --fs-chrome-sm: 11px;
  --fs-title:     13px;

  /* Content: scales with the room. */
  --fs-body:  calc(14px * var(--u));
  --fs-lead:  calc(18px * var(--u));
  --fs-head:  calc(24px * var(--u));
  --fs-code:  calc(13px * var(--u));
  --fs-small: calc(11.5px * var(--u));

  /* Edit mode — yellow, so a widget being set up reads as "being edited",
     not as live content. Yellow is too light to carry text or a thin line on
     white, hence five tokens rather than three:
       --edit       fill (the chosen segment, Done)
       --on-edit    ink on that fill — dark, never white
       --edit-line  outlines and borders, a deeper yellow that still shows
       --edit-soft  wash behind something being typed into
       --edit-ink   text: hints, "+ Add", the type picker */
  --edit:      #f7c548;   /* the deck's highlighter yellow */
  --on-edit:   oklch(28% 0.05 80);
  --edit-line: oklch(74% 0.16 80);
  --edit-soft: oklch(97% 0.05 98);
  --edit-ink:  oklch(48% 0.11 70);

  /* Slide-native drawing — widgets are drawn the way the deck's own figures
     are: TikZ-style nodes (an ink outline round a pale fill), grey captions,
     and one colour, the highlighter yellow the slides put behind key words.
     It marks what the room should look at: the right answer, the result. */
  --sn-ink:   var(--text);
  --sn-node:  color-mix(in srgb, var(--text) 4%, var(--bg));
  --sn-cap:   color-mix(in srgb, var(--text) 52%, var(--bg));
  --sn-faint: color-mix(in srgb, var(--text) 28%, var(--bg));
  --sn-hl:    #f7c548;
  --sn-on-hl: #111111;
  --sn-line:  2px;
  --sn-r:     7px;

  /* Furniture metrics — shared so two widgets' toolbars line up. */
  --bar-h:  42px;
  --ctl-h:  28px;
  --pad-x:  14px;

  /* Aliases kept for widgets written against the older names. */
  --font:  var(--font-ui);
  --mono:  var(--font-mono);
  --r:     var(--radius);
  --ink-1: var(--text);
  --ink-2: var(--text-2);
  --ink-3: var(--text-3);
  --ink-4: var(--text-3);
}

/* ── Reset ────────────────────────────────────────────────────────────── */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: var(--fs-chrome);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* The usual widget shape: a fixed bar on top, everything else filling the rest. */
.bw-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* ── Toolbar ──────────────────────────────────────────────────────────── */

.bw-toolbar {
  flex: 0 0 auto;
  height: var(--bar-h);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 var(--pad-x);
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

.bw-toolbar-title {
  font-size: var(--fs-title);
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 240px;
  flex-shrink: 0;
}

.bw-sep {
  width: 1px;
  height: 18px;
  background: var(--border);
  margin: 0 3px;
  flex-shrink: 0;
}

.bw-spacer { flex: 1 1 auto; }

/* ── Buttons ──────────────────────────────────────────────────────────── */

.bw-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: var(--ctl-h);
  padding: 0 11px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-chrome);
  font-size: var(--fs-chrome);
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
  transition: background var(--dur), border-color var(--dur), color var(--dur);
}
.bw-btn:hover:not(:disabled) {
  background: var(--bg-subtle);
  border-color: var(--border-med);
}
.bw-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.bw-btn--primary {
  background: var(--text);
  border-color: var(--text);
  color: var(--bg);
}
.bw-btn--primary:hover:not(:disabled) {
  background: var(--text-2);
  border-color: var(--text-2);
}

.bw-btn--quiet {
  border-color: transparent;
  background: none;
  color: var(--text-2);
}
.bw-btn--quiet:hover:not(:disabled) { background: var(--accent-bg); color: var(--text); }

/* Selected member of a toggle group — view switchers, mode pickers. */
.bw-btn.is-active {
  background: var(--text);
  border-color: var(--text);
  color: var(--bg);
}
.bw-btn.is-active:hover:not(:disabled) { background: var(--text-2); border-color: var(--text-2); }

.bw-btn--icon { width: var(--ctl-h); padding: 0; }
.bw-btn svg   { width: 14px; height: 14px; flex-shrink: 0; }

/* ── Status pill ──────────────────────────────────────────────────────── */

.bw-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: var(--fs-chrome-sm);
  color: var(--text-2);
  flex-shrink: 0;
}
.bw-status strong { color: var(--text-2); font-weight: 500; }

.bw-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-3);
  flex-shrink: 0;
  transition: background 0.3s;
}
.bw-dot.is-ready { background: var(--ok); }
.bw-dot.is-warn  { background: var(--warn); }
.bw-dot.is-busy  { background: var(--err); animation: bw-blink 0.9s ease-in-out infinite; }
.bw-dot.is-idle  { background: var(--text-3); }

/* ── Content areas ────────────────────────────────────────────────────── */

.bw-main {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 0;
}

/* A readable measure that grows with the room rather than the viewport. */
.bw-stage {
  max-width: calc(760px * var(--u));
  margin: 0 auto;
  padding: 0 24px;
}

/* Centred single-focus content — a question, a timer, a result. */
.bw-center {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px 24px;
  text-align: center;
}

/* ── Typography helpers ───────────────────────────────────────────────── */

.bw-head  { font-size: var(--fs-head); font-weight: 500; line-height: 1.3; letter-spacing: -0.01em; }
.bw-lead  { font-size: var(--fs-lead); font-weight: 500; line-height: 1.35; }
.bw-body  { font-size: var(--fs-body); line-height: 1.55; }
.bw-small { font-size: var(--fs-small); color: var(--text-2); }
.bw-mono  { font-family: var(--font-mono); }

/* Micro caps label — "scan to respond", "waiting for responses". */
.bw-hint {
  font-size: var(--fs-chrome-sm);
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  user-select: none;
}

/* Markdown-rendered content shouldn't inherit the reset's stripped margins. */
.bw-md p { margin: 0; }
.bw-md p + p { margin-top: 0.6em; }
.bw-md code { font-family: var(--font-mono); font-size: 0.92em; }
.bw-md .katex { font-size: 1em; }

/* ── Form controls ────────────────────────────────────────────────────── */

.bw-input,
.bw-select,
.bw-textarea {
  width: 100%;
  padding: 6px 9px;
  font-family: var(--font-ui);
  font-size: var(--fs-chrome);
  color: var(--text);
  background: var(--bg-subtle);
  border: 1px solid var(--border-med);
  border-radius: var(--radius);
  transition: border-color var(--dur);
}
.bw-input:focus,
.bw-select:focus,
.bw-textarea:focus { outline: none; border-color: var(--accent); }
.bw-textarea { font-family: var(--font-mono); line-height: 1.45; resize: vertical; }

/* ── Card ─────────────────────────────────────────────────────────────── */
/* A block of content set off from the page: a summary, a response, a result. */

.bw-card {
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 15px;
}
.bw-card--lg { padding: 22px 26px; border-radius: var(--radius-lg); }
.bw-card-meta {
  font-family: var(--font-mono);
  font-size: var(--fs-chrome-sm);
  color: var(--text-3);
  margin-top: 8px;
}

/* ── Banner ───────────────────────────────────────────────────────────── */

.bw-banner {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 10px 8px 12px;
  border: 1px solid var(--border-med);
  border-left: 3px solid var(--text-3);
  border-radius: var(--radius);
  background: var(--bg-subtle);
  font-size: var(--fs-chrome);
  line-height: 1.5;
  color: var(--text-2);
}
.bw-banner--warn  { border-left-color: var(--warn); }
.bw-banner--error { border-left-color: var(--err); background: var(--err-bg); }
.bw-banner strong { color: var(--text); font-weight: 600; }
.bw-banner code   { font-family: var(--font-mono); font-size: 0.92em; color: var(--text); }

/* ── Loading & empty states ───────────────────────────────────────────── */

.bw-boot {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 64px 20px;
  color: var(--text-2);
  text-align: center;
}
.bw-boot-msg { font-size: var(--fs-body); }
.bw-boot-sub { font-size: var(--fs-chrome-sm); color: var(--text-3); }

.bw-spinner {
  width: 26px;
  height: 26px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: bw-spin 0.65s linear infinite;
}

.bw-empty {
  font-size: var(--fs-body);
  color: var(--text-2);
  line-height: 1.5;
  text-align: center;
}

/* ── Scrollbars ───────────────────────────────────────────────────────── */

.bw-main::-webkit-scrollbar { width: 10px; height: 10px; }
.bw-main::-webkit-scrollbar-thumb {
  background: var(--border-med);
  border: 3px solid var(--bg);
  border-radius: 5px;
}
.bw-main::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
.bw-main::-webkit-scrollbar-track { background: transparent; }

/* ── Motion ───────────────────────────────────────────────────────────── */

@keyframes bw-spin  { to { transform: rotate(360deg); } }
@keyframes bw-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

@media (prefers-reduced-motion: reduce) {
  .bw-spinner { animation-duration: 2s; }
  .bw-dot.is-busy { animation: none; }
}

/* ── Injected top bar ─────────────────────────────────────────────────────
   Built by the settings kit inside every widget iframe (see
   widget-settings-kit.js), so every widget carries the same bar without
   drawing one itself — title on the left, the widget's own controls next to
   it, shared utilities pinned right.

   The kit also wraps whatever the widget rendered into .bw-topbar-body, so
   the bar can never overlap it. Everything here is chrome: fixed size
   whatever --u is, so raising the presentation scale grows the content and
   leaves the furniture alone.
   ====================================================================== */

body.bw-has-topbar {
  display: flex;
  flex-direction: column;
  padding: 0;
}

.bw-topbar {
  flex: 0 0 auto;
  height: var(--bar-h);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 var(--pad-x);
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  font-size: var(--fs-chrome);
  user-select: none;
  /* A widget with more controls than its box is wide scrolls its bar
     sideways (trackpad, or the mouse wheel — the kit maps it) rather than
     squashing or clipping them. No scrollbar: it would eat the bar. */
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}
.bw-topbar::-webkit-scrollbar { display: none; }
.bw-topbar > * { flex-shrink: 0; }

.bw-topbar-title {
  font-size: var(--fs-title);
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 40%;
  flex-shrink: 0;
}

/* Where a widget's own buttons land (BeamerWidget.topbar.addButton). Takes the
   slack so the utilities stay pinned right however many buttons there are. */
.bw-topbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1 0 auto;
}
.bw-topbar-actions > * { flex-shrink: 0; }

/* Shared utilities — same controls, same place, in every widget. They stay
   put at the bar's right end while a crowded bar scrolls under them. */
.bw-topbar-utils {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 0 0 auto;
  position: sticky;
  right: calc(-1 * var(--pad-x));
  margin-right: calc(-1 * var(--pad-x));
  padding: 0 var(--pad-x) 0 10px;
  background: var(--bg);
  box-shadow: -12px 0 10px -8px var(--bg);
  z-index: 2;
  align-self: stretch;
}

/* Partial-slide mode (the widget is an inset on part of the slide, set by the
   kit as body.bw-partial): no title and no shared utilities — only the
   widget's own controls stay, as a strip, and with none there's no bar. */
body.bw-partial .bw-topbar-utils {
  display: none;
}

/* The pencil for a widget's own settings when there's no bar to hold it
   (an overlay, or an inset without the utilities): top-right corner, faint,
   and only while the pointer is over the widget, so a box on a content slide
   stays clean. In full view it lives in the bar, always shown. */
.bw-edit-float {
  position: fixed;
  top: 6px;
  right: 6px;
  z-index: 50;
  display: none;
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  opacity: 0;
  transition: opacity 0.15s;
}
body.bw-overlay .bw-edit-float,
body.bw-partial .bw-edit-float { display: inline-flex; }
body.bw-overlay:hover .bw-edit-float,
body.bw-partial:hover .bw-edit-float { opacity: 0.45; }
.bw-edit-float:hover,
.bw-edit-float:focus-visible { opacity: 1; }
.bw-edit-float.bw-btn:hover:not(:disabled) { background: transparent; border-color: transparent; }
@media (hover: none) { .bw-edit-float { opacity: 0.45; } }

/* Widgets no longer show a title in the top-left of their bar.
   The title node stays in the DOM (widgets and setTitle() still write to it)
   but is never drawn, and neither is the separator that used to follow it.
   Matched by class rather than removed in the kit so a widget's own
   .bw-toolbar-title is caught too, adopted or standalone. */
.bw-topbar-title,
.bw-toolbar-title,
.bw-toolbar-title + .bw-sep,
.bw-topbar-actions > .bw-sep:first-child,
.bw-adopted-bar > .bw-topbar-title + .bw-sep {
  display: none !important;
}
body.bw-partial .bw-topbar.bw-topbar--no-controls {
  display: none;
}

/* Overlay mode (body.bw-overlay — the widget's display is "overlay"): a
   small tool laid over part of a slide. No bar at all; the widget shows its
   own simplified view, straight on the slide: no frame around it. */
body.bw-overlay .bw-topbar { display: none !important; }

/* Show a piece of UI in one display only. */
body:not(.bw-overlay) .bw-overlay-only { display: none !important; }
body.bw-overlay .bw-full-only { display: none !important; }

/* Overlay controls: a small cluster of icon buttons, centred along the
   bottom, that appears while the
   pointer is over the widget (or one of them has focus), so the overlay is
   just its content the rest of the time. */
.bw-overlay-controls {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  z-index: 5;
  display: flex;
  gap: 4px;
  padding: 3px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
}
body.bw-overlay:hover .bw-overlay-controls,
.bw-overlay-controls:focus-within {
  opacity: 1;
  pointer-events: auto;
}
.bw-overlay-controls[hidden] { display: none !important; }
.bw-overlay-controls .bw-btn { height: 26px; min-width: 26px; padding: 0 6px; }
.bw-overlay-controls .bw-btn--icon { width: 26px; padding: 0; }
@media (hover: none) {
  .bw-overlay-controls { opacity: 1; pointer-events: auto; }
}

/* The widget's own content, below the bar. */
.bw-topbar-body {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  overflow: hidden;
}

/* ── Edit mode ────────────────────────────────────────────────────────────
   body.bw-editing, set by the kit while a widget is being set up on itself
   (BeamerWidget.edit). The widget's own content is the form: anything marked
   .bw-editable gets a dashed yellow outline, the bar gets a highlighter line
   along its bottom edge, and Edit becomes Done. The bar's buttons keep the
   live bar's one style (below): being edited changes what's in the bar, not
   how its buttons look.
   ====================================================================== */

/* Edit / Done: the last thing in the bar, the top-right corner. */
.bw-edit-btn { gap: 6px; }
/* Edit and Done are the same size, so the bar doesn't shift when editing
   starts or ends. */
.bw-edit-btn { width: 80px; min-width: 80px; justify-content: center; flex: 0 0 80px; }
/* Done: an ordinary bar button, in bold — the way out, not a loud one. */
body.bw-editing .bw-edit-btn.bw-btn--primary,
body.bw-editing .bw-edit-btn.bw-btn--primary:hover:not(:disabled) {
  background: var(--bg); border-color: var(--text); color: var(--text); font-weight: 700;
}
body.bw-editing .bw-edit-btn.bw-btn--primary:hover:not(:disabled) { background: var(--sn-node); }
body.bw-editing .bw-topbar {
  border-bottom: 2px solid var(--sn-hl);
  box-shadow: none;
}

/* Show a piece of UI only while editing, or only while not. */
body:not(.bw-editing) .bw-edit-only { display: none !important; }
body.bw-editing .bw-run-only { display: none !important; }

/* The Name is never on the bar, not even while editing: it is set in the
   editor's panel. */
body.bw-editing .bw-topbar-title,
body.bw-editing .bw-topbar-title + .bw-sep,
body.bw-editing .bw-adopted-bar > .bw-topbar-title + .bw-sep { display: none !important; }

/* Anything set by clicking or typing on it. */
body.bw-editing .bw-editable {
  outline: 1.5px dashed color-mix(in oklab, var(--edit-line) 75%, transparent);
  outline-offset: 4px;
  border-radius: 4px;
  cursor: text;
  transition: outline-color var(--dur), background var(--dur);
}
body.bw-editing .bw-editable:hover { outline-color: var(--edit-line); }
body.bw-editing .bw-editable:focus,
body.bw-editing .bw-editable:focus-within {
  outline: 2px solid var(--edit-line);
  background: color-mix(in oklab, var(--edit-soft) 70%, transparent);
}
body.bw-editing button.bw-editable,
body.bw-editing .bw-editable[role="button"] { cursor: pointer; }

/* An empty editable shows what goes there. */
[data-bw-placeholder]:empty::before {
  content: attr(data-bw-placeholder);
  color: var(--text-3);
  pointer-events: none;
}

/* A quiet line saying what can be done here. */
.bw-edit-hint {
  font-size: var(--fs-chrome-sm);
  color: var(--edit-ink);
  white-space: nowrap;
}

/* Segmented choice: one of a few. Members are .bw-btn, the chosen one
   .is-active. Used for settings picked on the widget in edit mode. */
.bw-seg {
  display: inline-flex;
  flex: 0 0 auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.bw-seg > .bw-btn { border: 0; border-radius: 0; height: calc(var(--ctl-h) - 2px); }
.bw-seg > .bw-btn + .bw-btn { border-left: 1px solid var(--border); }
/* The chosen one: as a chosen button anywhere — ink, pale fill, bold. */
.bw-seg > .bw-btn.is-active,
.bw-toggle[aria-pressed="true"] {
  background: var(--sn-node); color: var(--text); font-weight: 700;
}

/* On / off, with its state drawn as a tick box. */
.bw-toggle { gap: 7px; }
.bw-toggle::before {
  content: '';
  width: 12px; height: 12px;
  border: 1.5px solid currentColor;
  border-radius: 3px;
  opacity: 0.7;
  flex: 0 0 auto;
}
.bw-toggle[aria-pressed="true"]::before {
  opacity: 1;
  background: currentColor;
  box-shadow: inset 0 0 0 2px var(--edit);
}

/* A small number typed in place, inside a sentence or a control. */
.bw-inline-num {
  width: 5.5ch;
  height: calc(var(--ctl-h) - 4px);
  padding: 0 6px;
  border: 1px solid var(--border-med);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  font: inherit;
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.bw-inline-num:focus { outline: 2px solid var(--edit-line); outline-offset: -1px; border-color: var(--edit-line); }

/* "+ Add …" at the end of a list being edited. */
.bw-add {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border: 1.5px dashed color-mix(in oklab, var(--edit-line) 75%, transparent);
  border-radius: var(--radius);
  background: none;
  color: var(--edit-ink);
  font: inherit;
  cursor: pointer;
}
.bw-add:hover { border-color: var(--sn-ink); background: var(--sn-hl); }

/* Font size stepper — drives --u, which every content-sized token is built on. */
.bw-fontsize {
  display: flex;
  align-items: center;
  gap: 2px;
}
.bw-fontsize .bw-btn { font-variant-numeric: tabular-nums; }
.bw-fontsize-a-sm { font-size: 10px; font-weight: 600; }
.bw-fontsize-a-lg { font-size: 14px; font-weight: 600; }

/* ── No native control ornaments ──────────────────────────────────────────
   Spinner arrows on number inputs and the chevron on a select are drawn by
   the browser at its own size and colour. Next to flat chrome on a projected
   slide they read as clutter, so they're removed everywhere rather than
   per widget.
   ====================================================================== */

select,
.bw-select {
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  background-image: none;
}
select::-ms-expand { display: none; }

input[type="number"] {
  -moz-appearance: textfield;
  appearance: textfield;
}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* The disclosure triangle on <details>, for the same reason. */
summary { list-style: none; cursor: pointer; }
summary::-webkit-details-marker { display: none; }

/* Search inputs get a cancel "x" and decoration in WebKit. */
input[type="search"]::-webkit-search-decoration,
input[type="search"]::-webkit-search-cancel-button,
input[type="search"]::-webkit-search-results-button { -webkit-appearance: none; }

/* ── Printing (notes PDF) ───────────────────────────────────────────────────
   Set on <html> by the settings kit while a widget is being captured for the
   notes PDF. Captures read computed styles at one instant, so anything still
   mid-transition would be printed half-way; and a widget can mark chrome that
   means nothing on paper (a "view only" toast, a hover hint) to leave out. */
.bw-printing *,
.bw-printing *::before,
.bw-printing *::after {
  transition: none !important;
  animation: none !important;
}
.bw-printing [data-bw-print-hide] { display: none !important; }

/* ── Slide-native look ────────────────────────────────────────────────────
   The furniture, drawn to sit on a LaTeX slide rather than in an app.

   The bar and its buttons are left as they are: they are chrome, not part
   of the slide. (A widget may still restyle its own bar, as Audience
   Response does.)
   ====================================================================== */

/* The bar keeps the app's faces, whatever the slide uses. */
:is(.bw-topbar, .bw-toolbar) {
  /* One face on the bar: even its numbers (a page number, a zoom level) are
     in the chrome sans, with fixed-width figures, not a second, mono face. */
  --font-ui:   var(--font-chrome);
  --font-mono: var(--font-chrome);
  font-family: var(--font-chrome);
  font-variant-numeric: tabular-nums;
}

::selection { background: color-mix(in srgb, #f7c548 60%, transparent); color: inherit; }

/* Content furniture as TikZ nodes. */
.bw-card {
  background: var(--sn-node);
  border: var(--sn-line) solid var(--sn-ink);
  border-radius: var(--sn-r);
}
.bw-card-meta { color: var(--sn-cap); }
.bw-input,
.bw-select,
.bw-textarea {
  background: var(--bg);
  border: 1.5px solid var(--sn-faint);
  border-radius: var(--sn-r);
}
.bw-input:focus,
.bw-select:focus,
.bw-textarea:focus { border-color: var(--sn-ink); }
.bw-spinner { border-color: var(--sn-node); border-top-color: var(--sn-ink); }
.bw-banner { border-radius: var(--sn-r); }
.bw-hint { color: var(--sn-cap); }
.bw-empty, .bw-boot { color: var(--sn-cap); }

/* The settings sheet (the kit's panel, for widgets not yet edited in
   place): a highlighter strip on top and plain, quiet fields under it. */
.bws-root .bws-head { background: var(--edit-soft); border-bottom: 2px solid var(--sn-hl); }
.bws-root .bws-title { font-weight: 700; letter-spacing: 0; }
.bws-root .bws-label { text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 400; color: var(--sn-cap); }
.bws-root :is(.bws-input, .bws-select, .bws-area, .bws-check, .bws-btn) {
  background: var(--bg);
  border: 1.5px solid var(--sn-faint);
  border-radius: var(--sn-r);
}
.bws-root :is(.bws-input, .bws-select, .bws-area):focus { border-color: var(--sn-ink); }
.bws-root .bws-btn:hover { background: var(--sn-node); }
.bws-root .bws-switch { background: var(--sn-faint); }
.bws-root .bws-switch:checked { background: var(--sn-hl); }
.bws-root .bws-switch::after { box-shadow: 0 0 0 1px rgba(0, 0, 0, .25); }
.bws-root { font-family: var(--font-chrome); }
:is(.bw-topbar, .bw-toolbar) :is(.bw-input, .bw-select, .bw-textarea) {
  background: var(--bg-subtle);
  border: 1px solid var(--border-med);
  border-radius: var(--radius);
}
:is(.bw-topbar, .bw-toolbar) :is(.bw-input, .bw-select, .bw-textarea):focus { border-color: var(--accent); }

/* ── The live bar's buttons: one style ─────────────────────────────────────
   Every button in a widget's top bar, while it is live (not being edited),
   looks the same: a light grey outline round ink text. Hovered, the outline
   goes ink over a pale fill; a chosen view or mode keeps that look, in bold.
   A widget's "primary" (Start, Run All, the poll's next step) is no louder
   than the rest. The same in edit mode, so a bar being set up looks like
   the bar it will be. */
:is(.bw-topbar, .bw-toolbar) .bw-btn {
  border: 1px solid var(--border-med);
  background: var(--bg);
  color: var(--text);
}
:is(.bw-topbar, .bw-toolbar) .bw-btn:hover:not(:disabled),
:is(.bw-topbar, .bw-toolbar) .bw-btn:focus-visible {
  border-color: var(--text);
  background: var(--sn-node);
  color: var(--text);
}
:is(.bw-topbar, .bw-toolbar) .bw-btn.is-active,
:is(.bw-topbar, .bw-toolbar) .bw-btn[aria-pressed="true"] {
  border-color: var(--text);
  background: var(--sn-node);
  color: var(--text);
  font-weight: 700;
}
/* A segmented group: the group is one outline, its members split by rules. */
:is(.bw-topbar, .bw-toolbar) .bw-seg { border-color: var(--border-med); }
:is(.bw-topbar, .bw-toolbar) .bw-seg > .bw-btn { border: 0; }
:is(.bw-topbar, .bw-toolbar) .bw-seg > .bw-btn + .bw-btn { border-left: 1px solid var(--border-med); }
:is(.bw-topbar, .bw-toolbar) .bw-seg > .bw-btn:hover:not(:disabled) { border-color: var(--border-med); }

/* ── Toggles: one style everywhere ────────────────────────────────────────────
   Every one-of-a-few switch (.bw-seg, and the widgets' own .seg and
   .modeswitch), on the bar or on the slide, is drawn like the slide: the
   slide's face, an ink outline like an answer box's, the chosen one in the
   deck's yellow. Last in the file, and firm, so it wins over each widget's
   own older rules. */
:is(.bw-seg, .seg, .modeswitch) {
  display: inline-flex !important;
  border: 1.5px solid var(--sn-ink) !important;
  border-radius: var(--sn-r) !important;
  background: var(--bg) !important;
  overflow: hidden;
  box-shadow: none !important;
}
:is(.bw-seg, .seg, .modeswitch) > :is(.bw-btn, button) {
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  color: var(--sn-ink) !important;
  font-family: var(--font-ui) !important;
  font-weight: 400 !important;
}
:is(.bw-seg, .seg, .modeswitch) > :is(.bw-btn, button) + :is(.bw-btn, button) {
  border-left: 1.5px solid var(--sn-ink) !important;
}
:is(.bw-seg, .seg, .modeswitch) > :is(.bw-btn, button):hover:not(:disabled):not(.is-active):not([aria-pressed="true"]) {
  background: var(--sn-node) !important;
}
:is(.bw-seg, .seg, .modeswitch) > :is(.bw-btn, button):is(.is-active, [aria-pressed="true"]) {
  background: var(--sn-hl) !important;
  color: var(--sn-ink) !important;
}

/* ════════════════════════════════════════════════════════════════════════
   Shared in-widget controls — one look for the same job in every widget.
   ════════════════════════════════════════════════════════════════════════ */

/* View controls floating on the content (zoom, fit, page turning): the PDF,
   the plotter, the map. A faint node in a corner; icon buttons that get an
   ink outline when pointed at; a grey readout between them. */
.bw-float {
  position: absolute; z-index: 20;
  display: flex; align-items: center; gap: 4px;
  padding: 4px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  border: 1.5px solid var(--sn-faint);
  border-radius: var(--sn-r);
  font-family: 'BW CM Sans', 'CMU Sans Serif', 'Latin Modern Sans', 'DM Sans', system-ui, sans-serif;   /* in the widget: the slide's face */
  font-size: 12px;
  color: var(--sn-ink);
}
.bw-float--br { right: 12px; bottom: 12px; }
.bw-float--bl { left: 12px; bottom: 12px; }
.bw-float--tr { right: 12px; top: 12px; }
.bw-float .bw-btn { height: 28px; }
.bw-float .bw-btn--icon,
.bw-float > .bw-btn:not(.bw-seg *) {
  width: 28px; padding: 0;
  border: 1.5px solid transparent; border-radius: 5px;
  background: none; color: var(--sn-ink);
}
.bw-float .bw-btn--icon:hover:not(:disabled) { border-color: var(--sn-ink); background: var(--sn-node); }
.bw-float .bw-btn--icon:disabled { color: var(--sn-faint); background: none; border-color: transparent; }
.bw-float .bw-btn--icon svg { width: 16px; height: 16px; }
.bw-float-val {
  min-width: 3.4em; text-align: center;
  font-variant-numeric: tabular-nums; color: var(--sn-cap); user-select: none;
}
.bw-float-sep { flex: 0 0 auto; width: 1px; height: 18px; margin: 0 2px; background: var(--sn-faint); }

/* Where a widget's content comes from (a link, an address, a file): one row
   at the top of the widget while it's edited. An ink-outlined field with an
   icon, what's chosen (or a box to type into), and a button. */
.bw-source {
  display: flex; align-items: center; gap: 8px;
  width: 100%; max-width: 760px; margin: 0 auto;
  min-height: 38px; padding: 4px 4px 4px 12px;
  background: var(--bg);
  border: 1.5px solid var(--sn-ink);
  border-radius: var(--sn-r);
  font-family: 'BW CM Sans', 'CMU Sans Serif', 'Latin Modern Sans', 'DM Sans', system-ui, sans-serif;   /* in the widget: the slide's face */ font-size: 14px;
  color: var(--sn-ink);
}
.bw-source > svg { flex: 0 0 auto; width: 16px; height: 16px; color: var(--sn-cap); }
.bw-source:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--sn-hl) 55%, transparent); }
.bw-source:has(.is-bad) { border-color: #d93a2b; }
.bw-source.is-over { border-style: dashed; background: color-mix(in srgb, var(--sn-hl) 22%, var(--bg)); }
.bw-source-input {
  flex: 1 1 auto; min-width: 0; height: 28px;
  border: 0; outline: 0; background: none; padding: 0;
