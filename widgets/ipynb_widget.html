</style>
</head>
<body>

<!-- ── Toolbar ─────────────────────────────────────────────────────────── -->
<div id="toolbar" data-bw-topbar>
  <!-- data-bw-title hands this element to the shared bar as its title, so the
       open file's name replaces the generic widget name rather than sitting
       next to it. The kit adopts the element itself, so the updates this
       widget writes to it still land. -->
  <span id="notebook-title" data-bw-title>Untitled.ipynb</span>

  <button class="tb-btn primary" id="btn-run-all" disabled onclick="runAll()">
    Run All
  </button>

  <div class="sep"></div>

  <button class="tb-btn" id="btn-download" disabled onclick="downloadNotebook()"
          title="Download this notebook as a .ipynb file">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Notebook
  </button>
</div>

<!-- ── Notebook ───────────────────────────────────────────────────────── -->
<div id="notebook-area">
  <!-- Edit mode only: which notebook (also dropped on the page). The same
       source row as every widget's. -->
  <div class="bw-edit-only bw-source nb-ed">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>
    <span class="bw-source-name" id="nb-ed-name" data-empty="Untitled.ipynb — a blank notebook"></span>
    <span class="bw-source-msg" id="nb-ed-msg"></span>
    <button class="bw-btn" type="button" id="nb-choose">Choose Notebook…</button>
  </div>
  <!-- Paper only. Filled in just before printing: see fillPrintHeader(). -->
  <div id="print-header" aria-hidden="true">
    <div class="ph-row">
      <div>
        <div class="ph-eyebrow">Python Notebook</div>
        <div class="ph-title" id="ph-title"></div>
      </div>
      <div class="ph-meta">
        <div class="ph-date" id="ph-date"></div>
      </div>
    </div>
    <hr class="ph-rule">
    <div class="ph-section">Cells</div>
  </div>
  <div id="notebook">
    <div id="boot-state">
      <div class="boot-spinner"></div>
      <span id="boot-msg">Loading Python…</span>
    </div>
  </div>
</div>

<!-- ── Viewer overlay ─────────────────────────────────────────────────── -->
<div id="viewer-toast" data-bw-print-hide>View-only · synced with presenter</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONFIG
// Beamer+ injects window.WIDGET_CONFIG before loading this widget.
// Falls back to URL params for standalone testing:
//   ?viewer=1          → viewer mode
//   ?notebook=path     → load notebook file
//   ?packages=a,b,c    → extra packages to install at boot
//   ?autoImport=0      → disable per-cell import detection
// ─────────────────────────────────────────────────────────────────────────────
const _qs      = new URLSearchParams(location.search);
const CFG      = window.WIDGET_CONFIG || {};
const WIDGET_ID      = CFG.id              || 'jupyter-notebook';
const NOTEBOOK_PATH  = CFG.notebook        || _qs.get('notebook') || null;
const NOTEBOOK_OBJ   = CFG.notebookContent || null;  // pre-loaded by renderer
const IS_VIEWER      = !!(CFG.viewer || CFG.role === 'viewer' || _qs.get('viewer') === '1');

// ── Package configuration ───────────────────────────────────────────────────
// Always loaded — the widget's matplotlib capture helper depends on them.
const BASE_PACKAGES = ['numpy', 'matplotlib'];

// `packages` arrives as an array (the editor's textarea-lines field) but a
// comma/newline-separated string is accepted too, for hand-written configs
// and the ?packages= URL param.
function parsePackageList(v) {
  let list;
  if (Array.isArray(v))            list = v;
  else if (typeof v === 'string')  list = v.split(/[\n,]/);
  else                             list = [];
  return list.map(s => String(s).trim()).filter(Boolean);
}

// `let`, not const: both are settings that apply live (see the widget-config
// handler), and initPyodide reads them when it gets there, so an edit made
// while the kernel is still booting is picked up too. A different notebook
// file is the one setting that rebuilds the widget instead (`rebuild` in the
// schema) — it replaces the whole document, which is what a fresh load is.
let EXTRA_PACKAGES = parsePackageList(
  CFG.packages != null ? CFG.packages : _qs.get('packages')
);
// Default on; only an explicit false / ?autoImport=0 turns it off.
let AUTO_IMPORT = CFG.autoImport != null
  ? CFG.autoImport !== false
  : _qs.get('autoImport') !== '0';

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
let pyodide     = null;
let bpRunCell   = null;   // PyProxy of _bp_run_cell (see initPyodide)
let pythonVersion = '3';  // "3.11.3" once the kernel is up
let isBusy      = false;
let execCounter = 0;
let selectedId  = null;
const cellMeta  = new Map(); // id → { type: 'code'|'markdown' }
// The open file's name. Kept apart from the title element: the shared top
// bar adopts that element and rewrites it with the widget's own name until a
// notebook is actually loaded, which is not what a download should be called.
let notebookName = 'Untitled.ipynb';
// The file as it arrived. Only the parts the widget doesn't model are kept —
// see buildIpynb(), which merges them back when the notebook is written out.
let originalMetadata = null;
// True once a real file's name is on screen, so a re-sent config can't put
// the generic widget name back over it (see the widget-config handler).
let notebookTitleSet = false;
let originalNbformat = { major: 4, minor: 5 };
// Cells can arrive from two places: the notebook file (after the kernel
// boots, which takes seconds) and the host's saved state (widget-set-state,
// usually much sooner). Whichever lands first owns the notebook; the other is
// dropped. Without this the two were appended one after the other.
let contentLoaded = false;
// The empty starter cell shown when there's no notebook. It isn't content,
// so restored state may still replace it — as long as nobody typed in it.
let placeholderId = null;

// ─────────────────────────────────────────────────────────────────────────────
// MARKDOWN  —  configure marked.js for Jupyter-style rendering
// ─────────────────────────────────────────────────────────────────────────────
if (typeof marked !== 'undefined') {
  marked.use({
    breaks: true,   // single newlines → <br> (matches Jupyter behaviour)
    gfm:    true,   // GitHub-flavoured markdown (tables, strikethrough, etc.)
  });
}

// A path stored in the deck (`assets/diagram.png`) → a URL this iframe can
// actually load. Absolute URLs, data: and blob: are already fine.
function assetUrl(p) {
  if (!p || /^(https?:|data:|blob:|#|\/\/)/i.test(p)) return p;
  const base = (window.BeamerWidget ? BeamerWidget.serverUrl() : '')
            || String(CFG.serverUrl || CFG.publicBaseUrl || '').replace(/\/+$/, '');
  return base ? base + '/api/zip-asset/' + String(p).replace(/^\/+/, '') : p;
}

// A line starting with ">>>" is a Python prompt (a doctest, a pasted REPL
// session), but to markdown it's three nested blockquotes — the arrows vanish
// and only "sq(3)" is left. Escaping the first ">" keeps the line as text.
// Fenced blocks are skipped (marked already shows them verbatim), and so are
// lines indented 4+ spaces: that's an indented code block, where a "\" would
// show up literally — and 4 spaces can't open a blockquote anyway.
function protectPythonPrompts(src) {
  let fence = null;
  return src.split('\n').map(line => {
    const f = line.match(/^ {0,3}(`{3,}|~{3,})/);
    if (f) {
      if (!fence) fence = f[1];
      else if (f[1][0] === fence[0] && f[1].length >= fence.length) fence = null;
      return line;
    }
    if (fence) return line;
    return line.replace(/^( {0,3})>>>/, '$1\\>>>');
  }).join('\n');
}

function mdParse(src) {
  if (!src) return '';

  // ── Step 1: protect math expressions from marked's parser ──────────────
  // We extract $$...$$ and $...$ before passing to marked, then restore them
  // afterwards rendered by KaTeX.  Using a private sentinel unlikely to appear
  // in real notebook content.
  const mathParts = [];
  let s = protectPythonPrompts(src);

  if (typeof katex !== 'undefined') {
    // Display math  $$...$$  (multi-line OK) — process before inline
    s = s.replace(/\$\$([\s\S]+?)\$\$/g, (_, math) => {
      const idx = mathParts.push({ math, display: true }) - 1;
      return `§BMATH§${idx}§`;
    });
    // Inline math  $...$  (single line, no nested $)
    s = s.replace(/\$([^\n$]+?)\$/g, (_, math) => {
      const idx = mathParts.push({ math, display: false }) - 1;
      return `§BMATH§${idx}§`;
    });
  }

  // ── Step 2: render markdown ─────────────────────────────────────────────
  let html;
  if (typeof marked === 'undefined') {
    html = '<pre>' + s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</pre>';
  } else {
    html = marked.parse(s);
  }

  // ── Step 2b: point deck-relative images at the asset route ─────────────
  // A pasted or notebook-referenced image is stored in the presentation as
  // `assets/…`. Inside a srcdoc iframe a bare relative URL resolves against
  // the parent page, not the deck, so every such src is rewritten to the
  // session's zip-asset route.
  if (html.indexOf('<img') !== -1) {
    const tpl = document.createElement('template');
    tpl.innerHTML = html;
    tpl.content.querySelectorAll('img[src]').forEach(img => {
      img.setAttribute('src', assetUrl(img.getAttribute('src')));
    });
    html = tpl.innerHTML;
  }

  // ── Step 3: restore math as KaTeX HTML ─────────────────────────────────
  if (mathParts.length) {
    html = html.replace(/§BMATH§(\d+)§/g, (_, i) => {
      const { math, display } = mathParts[+i];
      try {
        return katex.renderToString(math, { displayMode: display, throwOnError: false });
      } catch {
        return display ? `$$${math}$$` : `$${math}$`;
      }
    });
  }

  return html;
}

// ─────────────────────────────────────────────────────────────────────────────
// SOCKET.IO  —  graceful fallback if not running inside Beamer+
// ─────────────────────────────────────────────────────────────────────────────
let socket = null;

function initSocket() {
  if (window.__noSocketIO || typeof io === 'undefined') {
    socket = { emit: () => {}, on: () => {} };
    return;
  }
  try {
    // Never io() bare — inside the srcdoc iframe that resolves to
    // http://about/socket.io/, which an HTTPS deck blocks as mixed content.
    socket = io(window.BeamerWidget ? BeamerWidget.serverOrigin() : (CFG.socketUrl || ''));
    // Incoming sync events (viewer receives output from presenter)
    socket.on('widget_event', (data) => {
      if (data.id !== WIDGET_ID) return;
      if (data.type === 'cell_output')   handleSyncedOutput(data.payload);
      if (data.type === 'clear_outputs') clearAllOutputs(false);
    });
  } catch (e) {
    socket = { emit: () => {}, on: () => {} };
  }
}

// Presenter → viewers
function emitCellOutput(payload) {
  socket.emit('widget_event', { id: WIDGET_ID, type: 'cell_output', payload });
}

// ─────────────────────────────────────────────────────────────────────────────
// PACKAGE INSTALLATION
//
// Two sources, tried in order for each name:
//   1. pyodide.loadPackage()  — packages shipped in the Pyodide distribution
//                               (numpy, pandas, scipy, sympy, scikit-learn, …)
//   2. micropip.install()     — pure-Python wheels from PyPI, plus anything
//                               with a version specifier or an explicit
//                               .whl URL, which loadPackage can't express.
// Names that look like a requirement spec ("pandas==2.0.1", "pkg[extra]") or a
// URL skip straight to micropip.
// ─────────────────────────────────────────────────────────────────────────────
const SPEC_LIKE = /[=<>!~\[\]\s]|\.whl$|^https?:\/\//i;

const loadedPackages = [];   // successfully installed, for the kernel tooltip
const failedPackages = [];   // reported to the user in a banner

let _micropip = null;
async function getMicropip() {
  if (_micropip) return _micropip;
  await pyodide.loadPackage('micropip');
  _micropip = pyodide.pyimport('micropip');
  return _micropip;
}

async function installPackage(name) {
  if (SPEC_LIKE.test(name)) {
    const mp = await getMicropip();
    await mp.install(name);
    return;
  }
  try {
    await pyodide.loadPackage(name);
  } catch (_) {
    // Not in the Pyodide distribution — try PyPI.
    const mp = await getMicropip();
    await mp.install(name);
  }
}

// "pandas==2.0.1" → "pandas"; a wheel URL keeps its full string.
// Used so a pinned spec and a bare name are recognised as the same package.
function packageKey(spec) {
  const s = String(spec).trim();
  if (/^https?:\/\//i.test(s) || /\.whl$/i.test(s)) return s.toLowerCase();
  return s.split(/[=<>!~\[;\s]/)[0].toLowerCase();
}

// Merge package lists, first occurrence winning. Callers pass the widget
// config's list first, so a pin there beats an unpinned notebook entry.
function mergePackageLists(...lists) {
  const seen = new Set();
  const out  = [];
  for (const spec of [].concat(...lists)) {
    const key = packageKey(spec);
    if (!key || seen.has(key)) continue;
    seen.add(key);
    out.push(spec);
  }
  return out;
}

async function installExtraPackages(names) {
  // Skip what's already in, so a live settings edit only installs the new names.
  const seen = new Set([...BASE_PACKAGES, ...loadedPackages].map(packageKey));
  for (const name of names) {
    const key = packageKey(name);
    if (seen.has(key)) continue;
    seen.add(key);
    try {
      await installPackage(name);
      loadedPackages.push(name);
    } catch (e) {
      console.warn(`[Beamer+] package install failed: ${name}`, e);
      failedPackages.push(name);
    }
  }
}

function showPackageWarning(failed) {
  if (!failed.length) return;
  const nb = document.getElementById('notebook');
  if (!nb || document.getElementById('pkg-warning')) return;

  const div = document.createElement('div');
  div.id = 'pkg-warning';
  div.innerHTML =
    `<div><strong>Could not install:</strong> <code>${escHtml(failed.join(', '))}</code><br>` +
    `They aren't available for Python in the browser. ` +
    `Cells importing them will fail.</div>` +
    `<button class="pkg-warn-x" title="Dismiss">✕</button>`;
  div.querySelector('.pkg-warn-x').addEventListener('click', () => div.remove());
  nb.prepend(div);
}

// ─────────────────────────────────────────────────────────────────────────────
// PYODIDE INIT  (presenter only)
// ─────────────────────────────────────────────────────────────────────────────
async function initPyodide() {
  // Start the notebook fetch alongside the runtime download — the two are
  // independent, and we need the notebook's metadata before installing
  // packages so it can contribute to the list.
  const nbPromise = resolveNotebook();

  pyodide = await loadPyodide();
  const { nb, filename, error: nbError } = await nbPromise;

  await pyodide.loadPackage(BASE_PACKAGES);
  loadedPackages.push(...BASE_PACKAGES);

  // Widget config first, then whatever the notebook declares for itself.
  const requested = mergePackageLists(
    EXTRA_PACKAGES,
    nb ? packagesFromNotebook(nb) : []
  );
  if (requested.length) {
    await installExtraPackages(requested);
  }

  // Set Agg backend; patch plt.show(); expose figure-capture helper
  await pyodide.runPythonAsync(`
import matplotlib
matplotlib.use('Agg')
import matplotlib.pyplot as plt
import io as _io
import base64 as _b64

# Suppress plt.show() — we capture figures after execution instead
plt.show = lambda *a, **kw: None

def _bp_capture_figures():
    """Render all open matplotlib figures to base64 PNG and return a list."""
    imgs = []
    for n in plt.get_fignums():
        buf = _io.BytesIO()
        plt.figure(n).savefig(buf, format='png', bbox_inches='tight', dpi=150)
        buf.seek(0)
        imgs.append(_b64.b64encode(buf.read()).decode())
    plt.close('all')
    return imgs

# Running a cell — and saying what its result looks like — is Python's job.
# Handing the value to JavaScript instead loses the type on the way across:
# a float 2.0 arrives as the JS number 2 and shows as "2", where print() and
# Jupyter both say 2.0. True of every scalar — True became "true", 'hi' lost
# its quotes. So the value never leaves Python; only its repr does.
import builtins as _bp_builtins
from pyodide.code import eval_code_async as _bp_eval

async def _bp_run_cell(src):
    # globals() is __main__'s dict, so names defined in one cell are still
    # there in the next, exactly as before.
    value = await _bp_eval(src, globals=globals())
    if value is None:
        return None
    _bp_builtins._ = value      # the last result, as at any Python prompt
    return repr(value)
`);

  bpRunCell = pyodide.globals.get('_bp_run_cell');

  removeBoot();
  pythonVersion = pyodide.runPython('import sys; sys.version.split()[0]');
  setKernel('ready', 'Python ' + pythonVersion);
  enablePresenterToolbar();
  showPackageWarning(failedPackages);

  // Saved state may already have built the cells while the kernel booted.
  if (contentLoaded) return;
  if (nb)           renderNotebook(nb, filename);
  else if (nbError) addCodeCell('# Could not load notebook: ' + nbError, null, { focus: false });
  else              addPlaceholderCell();
}

function addPlaceholderCell() {
  if (document.querySelector('.cell-block')) return;
  placeholderId = addCodeCell('', null, { focus: false });
}

// Once a notebook is on screen, start at its top — a load is not an edit,
// so it has no business moving the view. 'instant' overrides the pane's
// smooth scroll-behavior, which would otherwise animate the jump.
function scrollNotebookToTop() {
  const area = document.getElementById('notebook-area');
  if (area) area.scrollTo({ top: 0, behavior: 'instant' });
}

// ─────────────────────────────────────────────────────────────────────────────
// .ipynb LOADING
//
// Resolving (fetch + parse) is split from rendering (building the cells) so
// the notebook can be read BEFORE the kernel installs packages — that's what
// lets a notebook declare its own dependencies and travel with them.  They go
// in the notebook's top-level metadata, in any of:
//
//   "metadata": { "beamerplus": { "packages": ["pandas", "sympy"] } }
//   "metadata": { "pyodide":    { "packages": [ … ] } }
//   "metadata": { "packages":   [ … ] }
//
// A newline/comma-separated string works there too.  Widget-config packages
// are installed first and win on version conflicts.
// ─────────────────────────────────────────────────────────────────────────────

// Never throws. Returns { nb, filename, error } — nb is null if there is no
// notebook configured, or if it could not be loaded (error then explains why).
async function resolveNotebook() {
  const filename = NOTEBOOK_PATH ? NOTEBOOK_PATH.split('/').pop() : 'Untitled.ipynb';

  // Pre-loaded from the deck ZIP by the renderer — nothing to fetch.
  if (NOTEBOOK_OBJ)   return { nb: NOTEBOOK_OBJ, filename, error: null };
  if (!NOTEBOOK_PATH) return { nb: null, filename, error: null };

  try {
    // A deck-relative path (assets/lecture.ipynb) is served out of the
    // presentation ZIP; an http(s) URL passes straight through.
    const resp = await fetch(assetUrl(NOTEBOOK_PATH));
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return { nb: await resp.json(), filename, error: null };
  } catch (e) {
    console.warn('Notebook load failed:', e);
    return { nb: null, filename, error: e.message || String(e) };
  }
}

// Packages the notebook itself asks for, from its metadata.
function packagesFromNotebook(nb) {
  const md = nb?.metadata;
  if (!md) return [];
  const src = md.beamerplus?.packages ?? md.pyodide?.packages ?? md.packages;
  return parsePackageList(src);
}

// Build the cells from a resolved notebook.
// `withOutputs` is false in viewer mode, where outputs come from the presenter
// over Socket.IO rather than from the file.
function renderNotebook(nb, filename, withOutputs = true) {
  if (contentLoaded) return;
  contentLoaded = true;
  try {
    if (filename) {
      notebookName = filename.split('/').pop();
      document.getElementById('notebook-title').textContent = wName(notebookName);
      notebookTitleSet = true;
    }
    if (nb.metadata) originalMetadata = nb.metadata;
    if (Number.isInteger(nb.nbformat)) {
      originalNbformat = {
        major: nb.nbformat,
        minor: Number.isInteger(nb.nbformat_minor) ? nb.nbformat_minor : 0,
      };
    }
    for (const cell of nb.cells || []) {
      const src = Array.isArray(cell.source) ? cell.source.join('') : (cell.source || '');

      if (cell.cell_type === 'markdown') { addMarkdownCell(src); continue; }
      if (cell.cell_type !== 'code') continue;

      const id = addCodeCell(src, null, { focus: false });
      // Restore saved outputs from the file (don't re-execute)
      if (withOutputs && cell.outputs?.length) {
        renderOutputs(id, parseIpynbOutputs(cell.outputs), cell.execution_count);
        if (cell.execution_count != null) {
          const en = document.getElementById(`enum-${id}`);
          if (en) { en.textContent = `[${cell.execution_count}]`; en.classList.add('ran'); }
        }
      }
    }
  } catch (e) {
    console.warn('Notebook render failed:', e);
    addCodeCell('# Could not load notebook: ' + (e.message || e), null, { focus: false });
  }
  scrollNotebookToTop();
}

// Convert .ipynb output objects → our internal format
function parseIpynbOutputs(raw) {
  const out = [];
  for (const o of raw) {
    const joinText = (v) => Array.isArray(v) ? v.join('') : (v || '');

    if (o.output_type === 'stream') {
      out.push({ type: o.name === 'stderr' ? 'stderr' : 'stream', text: joinText(o.text) });

    } else if (o.output_type === 'error') {
      const tb = (o.traceback || []).join('\n').replace(/\x1b\[[0-9;]*m/g, '');
      out.push({ type: 'error', text: `${o.ename}: ${o.evalue}\n${tb}` });

    } else if (o.output_type === 'display_data' || o.output_type === 'execute_result') {
      if (o.data?.['image/png']) {
        out.push({ type: 'image', data: o.data['image/png'] });
      } else if (o.data?.['text/plain']) {
        out.push({ type: 'result', text: joinText(o.data['text/plain']) });
      }
    }
  }
  return out;
}

// ─────────────────────────────────────────────────────────────────────────────
// CELL CREATION
// ─────────────────────────────────────────────────────────────────────────────
function uid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

// `focus: false` for cells built by a load: focusing a textarea scrolls it
// into view, so focusing each cell in turn left the view at the last one.
function addCodeCell(code = '', insertAfterId = null, { focus = true } = {}) {
  const id = uid();

  const block = document.createElement('div');
  block.className = 'cell-block';
  block.dataset.id = id;
  block.dataset.cellType = 'code';

  const ctrlsHtml = IS_VIEWER ? '' : `
    <div class="cell-controls">
      <button class="cc-btn"        title="Run (Shift+Enter)"  onclick="runCell('${id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="cc-btn"        title="Move up"            onclick="moveCellUp('${id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg></button>
      <button class="cc-btn"        title="Move down"          onclick="moveCellDown('${id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></button>
      <button class="cc-btn danger" title="Delete cell"        onclick="deleteCell('${id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>`;

  block.innerHTML = `
    <div class="cell-row">
      <div class="cell-gutter">
        <span class="exec-num" id="enum-${id}">[ ]</span>
      </div>
      <div class="cell-card" id="card-${id}">
        ${ctrlsHtml}
        <div class="code-area has-hl">
          <pre class="code-ln" aria-hidden="true">1</pre>
          <pre class="code-hl" aria-hidden="true"></pre>
          <textarea
            class="code-ta"
            id="ta-${id}"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            placeholder="Python…"
            ${IS_VIEWER ? 'disabled' : ''}
          >${escHtml(code)}</textarea>
        </div>
        <div class="cell-output" id="out-${id}">
          <div id="out-items-${id}"></div>
        </div>
      </div>
    </div>`;

  placeCell(block, insertAfterId);
  cellMeta.set(id, { type: 'code' });

  const ta = document.getElementById(`ta-${id}`);
  autoResize(ta);

  if (!IS_VIEWER) {
    ta.addEventListener('input',   () => autoResize(ta));
    ta.addEventListener('focus',   () => selectCell(id));
    ta.addEventListener('keydown', (e) => onCellKey(e, id));
  }

  refreshAddRows();
  if (!IS_VIEWER && focus) { ta.focus(); selectCell(id); }
  return id;
}

function addMarkdownCell(src = '', insertAfterId = null) {
  const id = uid();
  const isEmpty = !src.trim();

  const block = document.createElement('div');
  block.className = 'cell-block';
  block.dataset.id = id;
  block.dataset.cellType = 'markdown';

  const ctrlsHtml = IS_VIEWER ? '' : `
    <div class="cell-controls">
      <button class="cc-btn"        title="Move up"   onclick="moveCellUp('${id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg></button>
      <button class="cc-btn"        title="Move down" onclick="moveCellDown('${id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></button>
      <button class="cc-btn danger" title="Delete"    onclick="deleteCell('${id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>`;

  block.innerHTML = `
    <div class="cell-row">
      <div class="cell-gutter">
        <span class="md-gutter-label">M</span>
      </div>
      <div class="cell-card" id="card-${id}">
        ${ctrlsHtml}
        <!-- edit mode (hidden by default) -->
        <div id="md-edit-${id}" style="display:none">
          <textarea
            class="code-ta"
            id="ta-${id}"
            spellcheck="false"
            placeholder="Markdown…"
          >${escHtml(src)}</textarea>
        </div>
        <!-- render mode -->
        <div class="md-view${isEmpty ? ' placeholder-md' : ''}" id="md-view-${id}">
          ${isEmpty ? 'Double-click to edit…' : mdParse(src)}
        </div>
      </div>
    </div>`;

  placeCell(block, insertAfterId);
  cellMeta.set(id, { type: 'markdown' });
  refreshAddRows();

  if (!IS_VIEWER) {
    const view = document.getElementById(`md-view-${id}`);
    view.addEventListener('dblclick', () => enterMarkdownEdit(id));

    const ta = document.getElementById(`ta-${id}`);
    autoResize(ta);
    ta.addEventListener('input', () => autoResize(ta));
    ta.addEventListener('focus', () => selectCell(id));
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = ta.selectionStart, end = ta.selectionEnd;
        const indent = '    '; // 4 spaces
        ta.value = ta.value.slice(0, start) + indent + ta.value.slice(end);
        ta.selectionStart = ta.selectionEnd = start + indent.length;
        autoResize(ta);
        return;
      }
      if (e.key === 'Escape' || (e.key === 'Enter' && e.shiftKey)) {
        e.preventDefault();
        commitMarkdown(id);
      }
    });
    ta.addEventListener('blur', () => commitMarkdown(id));
    ta.addEventListener('paste', (e) => onMarkdownPaste(e, ta));
  }
  return id;
}

// ─────────────────────────────────────────────────────────────────────────────
// PASTING IMAGES INTO MARKDOWN
//
// A screenshot on the clipboard becomes a file in the deck and a plain
// markdown image reference to it — not a base64 blob inlined in the cell.
// That keeps the notebook readable, keeps the deck's images where every other
// asset lives, and means the same file can be reused from another cell.
//
// Beamer+ takes the bytes through saveFile(), which stores them for the
// presentation ZIP and records the path under the config key we give it; the
// keys are per-image so two screenshots never overwrite each other.
// ─────────────────────────────────────────────────────────────────────────────
let _pastedImages = 0;

function insertAtCaret(ta, text) {
  const start = ta.selectionStart ?? ta.value.length;
  const end   = ta.selectionEnd   ?? start;
  ta.value = ta.value.slice(0, start) + text + ta.value.slice(end);
  ta.selectionStart = ta.selectionEnd = start + text.length;
  autoResize(ta);
}

function replaceInTextarea(ta, find, replaceWith) {
  const at = ta.value.indexOf(find);
  if (at === -1) return;
  ta.value = ta.value.slice(0, at) + replaceWith + ta.value.slice(at + find.length);
  ta.selectionStart = ta.selectionEnd = at + replaceWith.length;
  autoResize(ta);
}

function onMarkdownPaste(e, ta) {
  const items = e.clipboardData?.items;
  if (!items) return;
  const images = [];
  for (const item of items) {
    if (item.kind !== 'file' || !item.type.startsWith('image/')) continue;
    const file = item.getAsFile();
    if (file) images.push(file);
  }
  // Nothing but text on the clipboard — leave the default paste alone.
  if (!images.length) return;
  e.preventDefault();
  images.reduce((chain, file) => chain.then(() => insertPastedImage(file, ta)), Promise.resolve());
}

async function insertPastedImage(file, ta) {
  const n     = ++_pastedImages;
  const ext   = (file.type.split('/')[1] || 'png').toLowerCase()
                  .replace('jpeg', 'jpg').replace(/[^a-z0-9]/g, '') || 'png';
  const stamp = new Date().toISOString().replace(/\D/g, '').slice(0, 14);
  const name  = `pasted-${stamp}-${n}.${ext}`;

  // A placeholder goes in straight away: the upload is a round trip to the
  // server, and a cell that looks like nothing happened invites a second paste.
  const token = `![uploading ${name}…]()`;
  insertAtCaret(ta, token);

  try {
    const buffer = await file.arrayBuffer();
    let path;
    if (window.BeamerWidget?.saveFile) {
      path = await BeamerWidget.saveFile({
        key: `pastedImage${stamp}${n}`,
        name,
        folder: 'assets',
        buffer,
      });
    } else {
      // Standalone (outside Beamer+): no deck to save into, so inline it.
      path = await new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(fr.result);
        fr.onerror = () => reject(fr.error);
        fr.readAsDataURL(file);
      });
    }
    replaceInTextarea(ta, token, `![](${path})`);
  } catch (err) {
    console.warn('Image paste failed:', err);
    replaceInTextarea(ta, token, `<!-- image paste failed: ${String(err.message || err)} -->`);
  }
}

function enterMarkdownEdit(id) {
  document.getElementById(`md-edit-${id}`).style.display = '';
  document.getElementById(`md-view-${id}`).style.display = 'none';
  const ta = document.getElementById(`ta-${id}`);
  autoResize(ta);
  ta.focus();
  selectCell(id);
}

function commitMarkdown(id) {
  const ta   = document.getElementById(`ta-${id}`);
  const edit = document.getElementById(`md-edit-${id}`);
  const view = document.getElementById(`md-view-${id}`);
  if (!ta || !edit || !view) return;
  const val = ta.value.trim();
  view.innerHTML = val ? mdParse(val) : 'Double-click to edit…';
  view.className = 'md-view' + (val ? '' : ' placeholder-md');
  edit.style.display = 'none';
  view.style.display = '';
}

// ─────────────────────────────────────────────────────────────────────────────
// CELL EXECUTION
// ─────────────────────────────────────────────────────────────────────────────
async function runCell(id) {
  if (!pyodide || isBusy || IS_VIEWER) return;
  if (cellMeta.get(id)?.type !== 'code') return;

  const ta   = document.getElementById(`ta-${id}`);
  const code = ta?.value?.trim();
  if (!code) return;

  isBusy = true;
  execCounter++;
  const n = execCounter;

  setKernel('busy', 'Busy');
  document.getElementById(`enum-${id}`).textContent = '[*]';
  document.getElementById(`card-${id}`).classList.add('running');
  clearOutputArea(id);

  let stdoutBuf = '';
  let stderrBuf = '';
  pyodide.setStdout({ batched: (s) => { stdoutBuf += s + '\n'; } });
  pyodide.setStderr({ batched: (s) => { stderrBuf += s + '\n'; } });

  const outputs = [];

  try {
    // Pull in any Pyodide-distributed package this cell imports but that isn't
    // loaded yet (unknown imports are ignored here and raise normally below).
    if (AUTO_IMPORT) {
      try {
        await pyodide.loadPackagesFromImports(code);
      } catch (e) {
        console.warn('[Beamer+] auto-import failed:', e);
      }
    }

    // Calling the Python coroutine from JS gives back a promise for its
    // return value: the repr of the cell's last expression, or None.
    const resultRepr = bpRunCell
      ? await bpRunCell(code)
      : await pyodide.runPythonAsync(code);

    // Capture matplotlib figures
    const figsProxy = await pyodide.runPythonAsync('_bp_capture_figures()');
    let figList = [];
    try {
      figList = figsProxy?.toJs ? figsProxy.toJs({ depth: 1 }) : [];
      figsProxy?.destroy?.();
    } catch (_) { figList = []; }

    if (stdoutBuf.trim()) outputs.push({ type: 'stream', text: stdoutBuf.trimEnd() });
    if (stderrBuf.trim()) outputs.push({ type: 'stderr', text: stderrBuf.trimEnd() });
    for (const img of figList) outputs.push({ type: 'image', data: img });

    // The last expression's repr, if it had one. A cell ending in None — or
    // in a statement, or a trailing semicolon — returns nothing and shows no
    // result line, which is what a notebook does.
    if (typeof resultRepr === 'string' && resultRepr !== '') {
      outputs.push({ type: 'result', text: resultRepr });
    }

  } catch (e) {
    const msg = (e.message || String(e))
      .replace(/\x1b\[[0-9;]*m/g, '')
      // The cell is run through _bp_run_cell, whose frame is ours, not the
      // presenter's — drop it so the traceback reads as it would in Jupyter.
      .replace(/^ *File "<exec>", line \d+, in _bp_run_cell\n(?: +.*\n)?/gm, '');
    if (stdoutBuf.trim()) outputs.push({ type: 'stream', text: stdoutBuf.trimEnd() });
    outputs.push({ type: 'error', text: msg });
  }

  renderOutputs(id, outputs, n);

  // ← Sync outputs to all viewers via Socket.IO
  emitCellOutput({ cellId: id, outputs, execCount: n });

  const en = document.getElementById(`enum-${id}`);
  if (en) { en.textContent = `[${n}]`; en.classList.add('ran'); }
  document.getElementById(`card-${id}`).classList.remove('running');
  setKernel('ready', 'Python ' + pythonVersion);
  isBusy = false;
}

async function runAll() {
  const blocks = [...document.querySelectorAll('.cell-block[data-cell-type="code"]')];
  for (const b of blocks) await runCell(b.dataset.id);
}

function runSelected() {
  if (selectedId) runCell(selectedId);
}

// ─────────────────────────────────────────────────────────────────────────────
// OUTPUT RENDERING
// ─────────────────────────────────────────────────────────────────────────────
function renderOutputs(cellId, outputs, execCount) {
  if (!outputs.length) return;
  const outEl   = document.getElementById(`out-${cellId}`);
  const itemsEl = document.getElementById(`out-items-${cellId}`);
  if (!outEl || !itemsEl) return;

  itemsEl.innerHTML = '';
  let resultLabelled = false;

  for (const o of outputs) {
    const row = document.createElement('div');
    row.className = 'out-row';

    // Gutter — only labelled for 'result' output type
    const gutter = document.createElement('div');
    gutter.className = 'out-gutter';
    if (o.type === 'result' && !resultLabelled) {
      gutter.innerHTML = `<span class="out-num">[${execCount}]</span>`;
      resultLabelled = true;
    }
    row.appendChild(gutter);

    const content = document.createElement('div');
    content.className = 'out-content';

    if (o.type === 'image') {
      content.className += ' out-image';
      const img = document.createElement('img');
      img.src = `data:image/png;base64,${o.data}`;
      img.alt = 'matplotlib figure';
      content.appendChild(img);
    } else {
      const pre = document.createElement('div');
      pre.className = 'out-text';
      if (o.type === 'error')  pre.classList.add('is-error');
      if (o.type === 'stderr') pre.classList.add('is-stderr');
      pre.textContent = o.text || '';
      content.appendChild(pre);
    }

    row.appendChild(content);
    itemsEl.appendChild(row);
  }

  outEl.classList.add('has-output');
}

function clearOutputArea(id) {
  const outEl   = document.getElementById(`out-${id}`);
  const itemsEl = document.getElementById(`out-items-${id}`);
  if (outEl)   outEl.classList.remove('has-output');
  if (itemsEl) itemsEl.innerHTML = '';
}

function clearAllOutputs(emit = true) {
  document.querySelectorAll('.cell-block[data-cell-type="code"]').forEach(b => {
    const id = b.dataset.id;
    clearOutputArea(id);
    const en = document.getElementById(`enum-${id}`);
    if (en) { en.textContent = '[ ]'; en.classList.remove('ran'); }
  });
  execCounter = 0;
  if (emit) socket.emit('widget_event', { id: WIDGET_ID, type: 'clear_outputs', payload: {} });
}

// ─────────────────────────────────────────────────────────────────────────────
// VIEWER SYNC  —  handle outputs pushed from presenter
// ─────────────────────────────────────────────────────────────────────────────
function handleSyncedOutput({ cellId, outputs, execCount }) {
  if (!cellId || !outputs) return;
  clearOutputArea(cellId);
  renderOutputs(cellId, outputs, execCount);
  const en = document.getElementById(`enum-${cellId}`);
  if (en) { en.textContent = `[${execCount}]`; en.classList.add('ran'); }
}

// ─────────────────────────────────────────────────────────────────────────────
// DOM HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function placeCell(block, afterId) {
  const nb = document.getElementById('notebook');
  if (afterId) {
    const ref = nb.querySelector(`.cell-block[data-id="${afterId}"]`);
    if (ref) { ref.after(block); return; }
  }
  nb.appendChild(block);
}

function deleteCell(id) {
  document.querySelector(`.cell-block[data-id="${id}"]`)?.remove();
  cellMeta.delete(id);
  if (selectedId === id) selectedId = null;
  refreshAddRows();
}

// The neighbouring cell, skipping the "+ Code / + Markdown" rows that sit
// between cells for the presenter — the immediate sibling is usually one of
// those, which is why moving used to do nothing.
function siblingCell(b, dir) {
  let el = dir < 0 ? b.previousElementSibling : b.nextElementSibling;
  while (el && !el.classList.contains('cell-block')) {
    el = dir < 0 ? el.previousElementSibling : el.nextElementSibling;
  }
  return el;
}

function moveCell(id, dir) {
  const b = document.querySelector(`.cell-block[data-id="${id}"]`);
  const other = b && siblingCell(b, dir);
  if (!other) return;
  if (dir < 0) other.before(b); else other.after(b);
  refreshAddRows();
  selectCell(id);
  b.scrollIntoView({ block: 'nearest' });
}

function moveCellUp(id)   { moveCell(id, -1); }
function moveCellDown(id) { moveCell(id, +1); }

function selectCell(id) {
  if (selectedId) document.getElementById(`card-${selectedId}`)?.classList.remove('focused');
  selectedId = id;
  document.getElementById(`card-${id}`)?.classList.add('focused');
}

function onCellKey(e, id) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const start = ta.selectionStart, end = ta.selectionEnd;
    const indent = '    '; // 4 spaces
    if (e.shiftKey) {
      // un-indent: remove up to 4 leading spaces from each selected line
      const before = ta.value.slice(0, start);
      const selected = ta.value.slice(start, end);
      const after = ta.value.slice(end);
      const lineStart = before.lastIndexOf('\n') + 1;
      const fullSel = ta.value.slice(lineStart, end);
      const dedented = fullSel.replace(/^    /gm, '');
      const removed = fullSel.length - dedented.length;
      ta.value = ta.value.slice(0, lineStart) + dedented + after;
      ta.selectionStart = Math.max(lineStart, start - Math.min(4, start - lineStart));
      ta.selectionEnd = lineStart + dedented.length;
    } else if (start !== end && ta.value.slice(start, end).includes('\n')) {
      // multi-line selection: indent each line
      const before = ta.value.slice(0, start);
      const selected = ta.value.slice(start, end);
      const after = ta.value.slice(end);
      const lineStart = before.lastIndexOf('\n') + 1;
      const fullSel = ta.value.slice(lineStart, end);
      const indented = fullSel.replace(/^/gm, indent);
      ta.value = ta.value.slice(0, lineStart) + indented + after;
      ta.selectionStart = lineStart + indent.length;
      ta.selectionEnd = lineStart + indented.length;
    } else {
      // single cursor or single-line selection: insert 4 spaces
      ta.value = ta.value.slice(0, start) + indent + ta.value.slice(end);
      ta.selectionStart = ta.selectionEnd = start + indent.length;
    }
    autoResize(ta);
    return;
  }
  if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); runCell(id); }
  if (e.key === 'Enter' && e.ctrlKey)  { e.preventDefault(); addCodeCell('', id); }
}

function autoResize(ta) {
  if (!ta) return;
  ta.style.height = 'auto';
  ta.style.height = Math.max(40, ta.scrollHeight) + 'px';
  paintCode(ta);
}

// The coloured copy under a code cell's textarea (every change to a cell's
// text ends in autoResize, so it is repainted from there). A trailing newline
// gets a space after it, or the copy would drop the textarea's last line.
function paintCode(ta) {
  // Line numbers in the gutter, one per line of source.
  const ln = ta.parentElement?.querySelector('.code-ln');
  if (ln) {
    const n = ta.value.split('\n').length;
    if (ln.dataset.n !== String(n)) {
      ln.dataset.n = String(n);
      ln.textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n');
    }
    ta.parentElement.style.setProperty('--ln-ch', String(String(n).length));
  }
  const pre = ta.parentElement?.classList.contains('has-hl') ? ta.previousElementSibling : null;
  if (!pre || !pre.classList.contains('code-hl')) return;
  const src = ta.value;
  try {
    pre.innerHTML = printHighlight(src) + (src.endsWith('\n') ? ' ' : '');
  } catch (_) {
    // At boot, before the highlighter's tables exist: plain now, colour next tick.
    pre.textContent = src;
    queueMicrotask(() => paintCode(ta));
  }
}

// The gap between two cells is where a new one goes, and the only thing left
// to say is which kind — so the row offers both rather than assuming code and
// making the presenter convert it afterwards.
function refreshAddRows() {
  document.querySelectorAll('.add-row').forEach(r => r.remove());
  if (IS_VIEWER) return;
  document.querySelectorAll('#notebook .cell-block').forEach(b => {
    const row = document.createElement('div');
    row.className = 'add-row';
    for (const [label, add] of [['+ Code', addCodeCell], ['+ Markdown', addMarkdownCell]]) {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.textContent = label;
      btn.onclick = () => add('', b.dataset.id);
      row.appendChild(btn);
    }
    b.after(row);
  });
}

// The kernel's status used to sit in a pill in the toolbar. The bar is for
// things you act on, and the state it reported is already visible where it
// matters — the boot overlay while Python loads, [*] on a running cell — so
// the pill is gone and what's left is the record of what the kernel has:
// the notebook title carries it as a tooltip, out of the way until asked for.
function setKernel(state, label) {
  const title = document.getElementById('notebook-title');
  if (!title) return;
  title.title = (label || '')
    + (loadedPackages.length ? '\nPackages: ' + loadedPackages.join(', ') : '')
    + (failedPackages.length ? `\nFailed: ${failedPackages.join(', ')}` : '');
}

function setBoot(msg) {
  const el = document.getElementById('boot-msg');
  if (el) el.textContent = msg;
}

function removeBoot() {
  document.getElementById('boot-state')?.remove();
}

function enablePresenterToolbar() {
  ['btn-run-all',
   'btn-download'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = false;
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// DOWNLOAD
//
// The .ipynb is rebuilt from what's on screen — sources, outputs and
// execution counts — so it opens in Jupyter with the results of the talk
// still in it. For paper there is the deck's notes PDF (see the print
// handler below) and Ctrl+P (the @media print block).
// ─────────────────────────────────────────────────────────────────────────────

/* The widget's Name setting (every widget has one — the settings kit adds it)
   is its title everywhere: the bar, the heading inside an exported PDF, and
   the downloaded file's name. Blank falls back to the widget's own default. */
function wName(fallback){
  return (window.BeamerWidget && BeamerWidget.name) ? BeamerWidget.name(fallback) : fallback;
}
function wFile(fallback, ext){
  return (window.BeamerWidget && BeamerWidget.fileName) ? BeamerWidget.fileName(fallback, ext) : fallback + ext;
}

function notebookFilename() {
  const raw = (notebookName || 'Untitled.ipynb').trim().replace(/\.ipynb$/i, '');
  return wFile(raw.replace(/[\\/:*?"<>|]/g, '_') || 'Untitled', '.ipynb');
}

// nbformat wants source as a list of lines, each keeping its newline except
// the last — a single string is legal but reads badly in diffs and in Jupyter.
function splitSource(src) {
  if (!src) return [];
  const lines = src.split('\n');
  return lines.map((l, i) => (i === lines.length - 1 ? l : l + '\n'))
              .filter((l, i) => !(i === lines.length - 1 && l === ''));
}

// Our internal output objects → the nbformat 4 shapes Jupyter expects.
function toIpynbOutputs(outputs, execCount) {
  const out = [];
  for (const o of (outputs || [])) {
    if (o.type === 'image') {
      out.push({
        output_type: 'display_data',
        data: { 'image/png': o.data },
        metadata: {},
      });
    } else if (o.type === 'result') {
      out.push({
        output_type: 'execute_result',
        execution_count: o.execution_count ?? execCount ?? null,
        data: { 'text/plain': splitSource(o.text || '') },
        metadata: {},
      });
    } else if (o.type === 'error') {
      // We only keep the formatted traceback, not the structured exception —
      // which is all Jupyter renders anyway.
      out.push({
        output_type: 'error',
        ename: 'Error',
        evalue: '',
        traceback: splitSource(o.text || ''),
      });
    } else {
      out.push({
        output_type: 'stream',
        name: o.type === 'stderr' ? 'stderr' : 'stdout',
        text: splitSource(o.text || ''),
      });
    }
  }
  return out;
}

function buildIpynb() {
  const state = _nbGetState();
  const cells = state.cells.map(c => (c.cell_type === 'markdown'
    ? { cell_type: 'markdown', metadata: {}, source: splitSource(c.source) }
    : {
        cell_type: 'code',
        metadata: {},
        execution_count: c.execution_count ?? null,
        source: splitSource(c.source),
        outputs: toIpynbOutputs(c.outputs, c.execution_count),
      }));

  // Start from whatever the file arrived with, so the parts this widget
  // doesn't model — kernelspec, language_info, anything the presenter's own
  // tools wrote at the top level — survive a round trip through Beamer+.
  const metadata = Object.assign({
    kernelspec: { name: 'python3', display_name: 'Python 3', language: 'python' },
    language_info: { name: 'python' },
  }, originalMetadata || {});

  // Keep whatever packages this notebook was set up with, so the file brings
  // them along when it's opened again.
  const packages = [...EXTRA_PACKAGES];
  if (packages.length) {
    metadata.beamerplus = Object.assign({}, metadata.beamerplus, { packages });
  }

  return {
    cells,
    metadata,
    nbformat: originalNbformat.major,
    nbformat_minor: originalNbformat.minor,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// WRITING THE NOTEBOOK BACK INTO THE DECK
//
// Beamer+ asks every widget for the files it owns just before it builds the
// save ZIP. Answering with the current notebook is what makes an edit made
// during the talk — a new cell, a corrected line, a fresh output — part of the
// presentation, instead of something that lived only in this browser tab until
// the page was closed.
//
// What does NOT come back is anything the widget never showed: a notebook with
// raw cells, or outputs in formats it doesn't render, loses them here, because
// what gets written is the notebook as it is on screen.
// ─────────────────────────────────────────────────────────────────────────────
function flushNotebookToDeck() {
  if (IS_VIEWER) return;
  // A notebook fetched from a URL belongs to whoever published it. We show it,
  // and it can still be downloaded, but we don't write a local copy over the
  // reference the presenter configured.
  if (NOTEBOOK_PATH && /^https?:\/\//i.test(NOTEBOOK_PATH)) return;

  let name = notebookFilename();
  if (!/\.ipynb$/i.test(name)) name += '.ipynb';

  // Nothing was configured, so this notebook is being created here. Two
  // untitled notebooks on two slides would both claim assets/Untitled.ipynb
  // and overwrite each other, so the widget's own id makes the name unique —
  // once, and the title follows it so the deck and the bar agree.
  if (!NOTEBOOK_PATH && /^untitled\.ipynb$/i.test(name)) {
    const suffix = String(WIDGET_ID).replace(/[^a-z0-9]/gi, '').slice(-4) || '1';
    name = `Untitled-${suffix}.ipynb`;
    notebookName = name;
    const title = document.getElementById('notebook-title');
    if (title) title.textContent = name;
  }

  try {
    const json = JSON.stringify(buildIpynb(), null, 1);
    BeamerWidget.saveFile({
      key:    'notebook',   // the config key the path is recorded under
      name,
      folder: 'assets',
      buffer: new TextEncoder().encode(json).buffer,
      serve:  false,        // we already hold the content; nothing to fetch back
    }).catch(e => console.warn('Could not write the notebook into the deck:', e));
  } catch (e) {
    console.warn('Could not serialise the notebook:', e);
  }
}

if (window.BeamerWidget?.onFlushFiles) {
  BeamerWidget.onFlushFiles(flushNotebookToDeck);
}

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function downloadNotebook() {
  let name = notebookFilename();
  if (!/\.ipynb$/i.test(name)) name += '.ipynb';
  saveBlob(new Blob([JSON.stringify(buildIpynb(), null, 1)], { type: 'application/json' }), name);
}

// ── Print styling ────────────────────────────────────────────────────────────
// A textarea prints in one colour, so each code cell gets a highlighted copy
// for paper. Same tokens and palette as the Python Workspace's PDF.
const PK_KW = 'False|None|True|and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield|match|case';
const PK_BI = 'print|input|len|range|int|float|str|list|dict|set|tuple|bool|type|isinstance|enumerate|zip|map|filter|sorted|reversed|sum|min|max|abs|round|open|super|self|object|any|all|repr|chr|ord|iter|next';
const PK_TOK = new RegExp(
  '(#[^\\n]*)' +
  '|([rbfuRBFU]{0,2}(?:"""[\\s\\S]*?(?:"""|(?![\\s\\S]))|\'\'\'[\\s\\S]*?(?:\'\'\'|(?![\\s\\S]))|"(?:\\\\.|[^"\\\\\\n])*"?|\'(?:\\\\.|[^\'\\\\\\n])*\'?))' +
  '|\\b(def|class)(\\s+)([A-Za-z_]\\w*)' +
  '|\\b(' + PK_KW + ')\\b' +
  '|\\b(' + PK_BI + ')\\b' +
  '|(@[A-Za-z_][\\w.]*)' +
  '|\\b(0[xXoObB][\\da-fA-F_]+|\\d[\\d_]*\\.?\\d*(?:[eE][+-]?\\d+)?j?)\\b',
  'g');

function printHighlight(src) {
  const sp = (c, t) => `<span class="pk-${c}">${escHtml(t)}</span>`;
  let out = '', last = 0, m;
  PK_TOK.lastIndex = 0;
  while ((m = PK_TOK.exec(src))) {
    out += escHtml(src.slice(last, m.index));
    if      (m[1]) out += sp('com', m[1]);
    else if (m[2]) out += sp('str', m[2]);
    else if (m[3]) out += sp('kw', m[3]) + m[4] + sp('def', m[5]);
    else if (m[6]) out += sp('kw', m[6]);
    else if (m[7]) out += sp('bi', m[7]);
    else if (m[8]) out += sp('dec', m[8]);
    else if (m[9]) out += sp('num', m[9]);
    last = PK_TOK.lastIndex;
    if (m[0] === '') PK_TOK.lastIndex++;
  }
  return out + escHtml(src.slice(last));
}

function fillPrintHeader() {
  const name  = wName(notebookName || 'Untitled.ipynb');
  let date;
  try { date = new Date().toLocaleDateString('en-CA', { year: 'numeric', month: 'long', day: 'numeric' }); }
  catch (_) { date = new Date().toDateString(); }
  document.getElementById('ph-title').textContent  = name;
  document.getElementById('ph-date').textContent   = date;
}

function preparePrint() {
  document.querySelectorAll('#notebook .cell-block[data-cell-type="code"]').forEach(b => {
    const ta = b.querySelector('.code-ta');
    if (!ta) return;
    let pre = b.querySelector('.print-code');
    if (!pre) {
      pre = document.createElement('pre');
      pre.className = 'print-code';
      ta.after(pre);
    }
    pre.innerHTML = printHighlight(ta.value.replace(/\s+$/, '')) || ' ';
  });
  fillPrintHeader();
}

// Ctrl+P gets the same page as the PDF, styled for as long as the dialog is up.
window.addEventListener('beforeprint', () => {
  preparePrint();
  document.getElementById('notebook-area').classList.add('paper');
});
window.addEventListener('afterprint', () => {
  document.getElementById('notebook-area').classList.remove('paper');
});


// Close every markdown editor — one left open would print its textarea
// instead of its rendered form.
function commitOpenMarkdown() {
  document.querySelectorAll('.cell-block[data-cell-type="markdown"]').forEach(b => {
    const edit = document.getElementById('md-edit-' + b.dataset.id);
    if (edit && edit.style.display !== 'none') commitMarkdown(b.dataset.id);
  });
}

/**
 * Capture every cell in its paper style, top to bottom: an offscreen copy of
 * the notebook, one html2canvas pass per cell, for the deck's notes export.
 * html2canvas must already be loaded.
 * @returns {Promise<{ canvases: HTMLCanvasElement[], widthPx: number, scale: number }>}
 */
async function captureCellsOnPaper(scale) {
  commitOpenMarkdown();
  preparePrint();
  if (document.fonts?.ready) await document.fonts.ready;
  const stage = document.createElement('div');
  stage.className = 'paper pdf-stage';
  stage.setAttribute('aria-hidden', 'true');
  // The copy keeps id="notebook" (the paper rules key on it); it only
  // exists for the moment the cells are being captured.
  const nb = document.getElementById('notebook').cloneNode(true);
  stage.appendChild(nb);
  document.body.appendChild(stage);
  try {
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const widthPx = stage.getBoundingClientRect().width;
    const canvases = [];
    for (const block of nb.querySelectorAll(':scope > .cell-block')) {
      canvases.push(await html2canvas(block, {
        scale, backgroundColor: '#ffffff', logging: false, useCORS: true,
      }));
    }
    return { canvases, widthPx, scale };
  } finally {
    stage.remove();
  }
}

// ── Notes PDF (Beamer+ deck export) ──────────────────────────────────────────
// On the slide: the notebook as the room saw it. After the slide: every cell,
// in the paper style (the same one Ctrl+P uses), flowed over as many pages as
// it takes. The host hands us a viewer copy already set to the live state.
if (window.BeamerWidget?.print) {
  BeamerWidget.print.register(async ({ scale }) => {
    const image = await BeamerWidget.print.snapshot('#notebook-area', { ignore: '#print-header' });
    if (!window.html2canvas) await BeamerWidget.print.html2canvas();
    const S = Math.max(2, scale || 2);
    const { canvases, widthPx } = await captureCellsOnPaper(S);
    if (!canvases.length) return { image };
    return {
      image,
      pages: [{
        title: wName(notebookName || 'Untitled.ipynb'),
        columnWidth: widthPx,
        blocks: canvases.map(c => ({ type: 'image', src: c, width: c.width / S, height: c.height / S })),
      }],
    };
  });
}


function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ─────────────────────────────────────────────────────────────────────────────
// VIEWER MODE UI ADJUSTMENTS
// ─────────────────────────────────────────────────────────────────────────────
if (IS_VIEWER) {
  document.addEventListener('DOMContentLoaded', () => {
    ['btn-run-all',
   'btn-download'].forEach(id => {
      document.getElementById(id)?.remove();
    });
    document.getElementById('viewer-toast').style.display = 'block';
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────────────────────────
initSocket();

if (IS_VIEWER) {
  // Viewer: notebook skeleton only — no kernel, so no packages to install.
  // Outputs arrive from the presenter via Socket.IO.
  removeBoot();
  setKernel('viewer', 'View only');
  resolveNotebook().then(({ nb, filename }) => {
    if (contentLoaded) return;
    if (nb) renderNotebook(nb, filename, false);
    else    addPlaceholderCell();
  });
} else {
  // No notebook chosen: start a blank one at once, rather than an empty page
  // while Python downloads. Typing in it makes it this slide's notebook.
  if (!NOTEBOOK_PATH && !contentLoaded) addPlaceholderCell();
  // Presenter: full Pyodide kernel
  initPyodide().catch(e => {
    removeBoot();
    setKernel('busy', 'Kernel error');
    console.warn('[notebook] load failed:', e);
    addCodeCell('# Python failed to load. Check the network connection, then reload the slide.');
    console.error(e);
  });
}

// ── Beamer+ state persistence protocol ──────────────────────────────────────
function _nbGetState() {
  const cells = [];
  document.querySelectorAll('.cell-block').forEach(block => {
    const id       = block.dataset.id;
    const cellType = block.dataset.cellType;
    const ta       = document.getElementById('ta-' + id);
    const source   = ta ? ta.value : '';
    if (cellType === 'code') {
      // Capture rendered outputs — outputs are .out-row elements inside #out-{id}
      const outputs = [];
      const outEl = document.getElementById('out-' + id);
      if (outEl && outEl.classList.contains('has-output')) {
        outEl.querySelectorAll('.out-row').forEach(row => {
          const img = row.querySelector('img');
          if (img && img.src.startsWith('data:')) {
            // matplotlib / image output
            outputs.push({ type: 'image', data: img.src.split(',')[1] });
          } else {
            const textEl = row.querySelector('.out-text');
            if (textEl) {
              let type = 'stream';
              if      (textEl.classList.contains('is-error'))  type = 'error';
              else if (textEl.classList.contains('is-stderr')) type = 'stderr';
              else if (row.querySelector('.out-num'))          type = 'result';
              outputs.push({ type, text: textEl.textContent });
            }
          }
        });
      }
      const enumEl  = document.getElementById('enum-' + id);
      const execRaw = enumEl ? enumEl.textContent.replace(/[\[\]\s]/g, '') : '';
      const execCount = execRaw && execRaw !== '*' ? (parseInt(execRaw) || null) : null;
      cells.push({ cell_type: 'code', source, outputs, execution_count: execCount });
    } else {
      cells.push({ cell_type: 'markdown', source });
    }
  });
  return { cells, title: notebookName };
}

function _nbSetState(s) {
  if (!s || !Array.isArray(s.cells)) return;
  // If content is already on screen the iframe is live (opacity-based
  // navigation keeps iframes in the DOM), or the notebook file got there
  // first. Either way the DOM — including outputs — is intact, so skip.
  // (A print copy is the exception: it must show the state it was handed,
  // even if the notebook file rendered first.)
  if (contentLoaded && !window.BEAMER_PRINT) return;
  // An untouched starter cell doesn't count; anything else someone typed does.
  const blocks = document.querySelectorAll('.cell-block');
  const onlyPlaceholder = blocks.length === 1
    && blocks[0].dataset.id === placeholderId
    && !document.getElementById('ta-' + placeholderId)?.value;
  if (blocks.length && !onlyPlaceholder && !window.BEAMER_PRINT) return;
  contentLoaded = true;
  placeholderId = null;
  // Fresh iframe (restoring from saved ZIP state) — rebuild from scratch.
  document.querySelectorAll('.cell-block, .add-row').forEach(el => el.remove());
  cellMeta.clear();
  selectedId = null;
  if (s.title) {
    notebookName = s.title;
    document.getElementById('notebook-title').textContent = s.title;
    notebookTitleSet = true;
  }
  for (const cell of s.cells) {
    const src = cell.source || '';
    if (cell.cell_type === 'markdown') {
      addMarkdownCell(src);
    } else {
      const id = addCodeCell(src, null, { focus: false });
      if (cell.outputs?.length) {
        // cell.outputs is already in our internal format — pass directly to renderOutputs
        renderOutputs(id, cell.outputs, cell.execution_count);
        if (cell.execution_count != null) {
          const en = document.getElementById('enum-' + id);
          if (en) { en.textContent = '[' + cell.execution_count + ']'; en.classList.add('ran'); }
        }
      }
    }
  }
  refreshAddRows?.();
  scrollNotebookToTop();
}

// Settings edited while the notebook is open. Cells, outputs and the kernel's
// namespace all stay; a package added to the list is installed into the
// running kernel (before it is up, initPyodide picks the new list up itself).
let _liveInstall = Promise.resolve();
function applyLiveSettings(c) {
  if (c.autoImport != null) AUTO_IMPORT = c.autoImport !== false;
  if (c.packages === undefined) return;
  const next = parsePackageList(c.packages);
  if (next.join('\n') === EXTRA_PACKAGES.join('\n')) return;
  EXTRA_PACKAGES = next;
  if (IS_VIEWER || !bpRunCell) return;
  // Chained, so two quick edits don't install the same package twice.
  _liveInstall = _liveInstall.then(async () => {
    const before = failedPackages.length;
    await installExtraPackages(EXTRA_PACKAGES);
    const failed = failedPackages.slice(before);
    if (failed.length) {
      document.getElementById('pkg-warning')?.remove();
      showPackageWarning(failed);
    }
  }).catch(err => console.warn('[Beamer+] live package install failed', err));
}

window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'widget-get-state') {
    window.parent.postMessage({ type: 'widget-state', widgetId: WIDGET_ID, state: _nbGetState() }, '*');
  } else if (e.data.type === 'widget-set-state' && e.data.state != null) {
    _nbSetState(e.data.state);
  } else if (e.data.type === 'widget-config') {
    applyLiveSettings(e.data.config || {});
    // The shared top bar rewrites its title from the widget's own name each
    // time the host re-sends the config. Once a file is open, its name is the
    // more useful thing to show, so put it back. The settings kit registered
    // its listener first (it is injected into <head>), so this runs after.
    if (notebookTitleSet) {
      const title = document.getElementById('notebook-title');
      if (title) title.textContent = wName(notebookName);
    }
  }
});

// ── Edit mode: choosing the notebook ─────────────────────────────────────────
// Edit (top right) shows "Choose Notebook…" in the bar; a .ipynb can also be
// dropped on the page while editing. It is opened here at once and saved into
// the deck as this widget's notebook.
(function () {
  const btn = document.getElementById('nb-choose');
  const msg = document.getElementById('nb-ed-msg');
  const area = document.getElementById('notebook-area');
  if (!btn) return;
  const editing = () => !!(window.BeamerWidget && BeamerWidget.edit && BeamerWidget.edit.active);
  const say = (t, err) => { msg.textContent = t || ''; msg.classList.toggle('is-err', !!err); };
  const picker = document.createElement('input');
  picker.type = 'file'; picker.accept = '.ipynb,application/x-ipynb+json,application/json';
  picker.addEventListener('change', () => { if (picker.files[0]) useFile(picker.files[0]); picker.value = ''; });
  btn.addEventListener('click', () => picker.click());

  async function useFile(file) {
    let nb;
    try { nb = JSON.parse(await file.text()); }
    catch (_) { say('That isn’t a notebook (.ipynb)', true); return; }
    if (!nb || !Array.isArray(nb.cells)) { say('That isn’t a notebook (.ipynb)', true); return; }
    // Replace what's on the page with the new notebook's cells.
    document.querySelectorAll('.cell-block').forEach(b => b.remove());
    cellMeta.clear();
    contentLoaded = false;
    renderNotebook(nb, file.name);
    nameEl.textContent = file.name;
    say('');
    const hosted = window.parent !== window && (window.WIDGET_CONFIG || {}).id != null;
    if (hosted && window.BeamerWidget && BeamerWidget.saveFile) {
      try {
        const buffer = await file.arrayBuffer();
        const path = await BeamerWidget.saveFile({ key: 'notebook', name: file.name, folder: 'assets', buffer });
        BeamerWidget.edit.set({ notebook: path }, [], { silent: true });
      } catch (_) { say('Opened, but couldn’t be saved into the deck', true); }
    }
    try { window.parent.postMessage({ type: 'widget-state', widgetId: WIDGET_ID, state: _nbGetState() }, '*'); } catch (_) {}
  }

  area.addEventListener('dragover', e => { if (!editing()) return; e.preventDefault(); area.classList.add('is-over'); });
  area.addEventListener('dragleave', e => { if (!area.contains(e.relatedTarget)) area.classList.remove('is-over'); });
  area.addEventListener('drop', e => {
    area.classList.remove('is-over');
    if (!editing()) return;
    e.preventDefault();
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) useFile(f);
  });
  const nameEl = document.getElementById('nb-ed-name');
  const showName = () => { nameEl.textContent = notebookTitleSet ? (document.getElementById('notebook-title')?.textContent || '') : ''; };
  window.addEventListener('bw-edit', e => { if (e.detail.editing) { showName(); say('or drop a .ipynb anywhere here'); } });
})();
</script>
