      "placeholder": ">>> f(BLANK, BLANK)\nTrue\n>>> f(BLANK, BLANK)\nFalse",
      "showIf": { "responseType": "fill" } },

    { "key": "question", "label": "Question (Markdown, $LaTeX$, ```code``` blocks)", "type": "textarea", "rows": 5,
      "placeholder": "Consider the following code:\n\n```python\nx = 5\nif x > 2:\n    x = -3\n```\n\nWhat is `x`?" },

    { "key": "options", "label": "Answer options (one per line)", "type": "textarea-lines", "rows": 4,
      "placeholder": "Option A\nOption B\nOption C", "showIf": { "responseType": "choice" } },
    { "key": "correctAnswer", "label": "Correct option (1-based, blank = none)", "type": "number-nullable",
      "min": 1, "step": 1, "showIf": { "responseType": "choice" } },

    { "key": "correctTF", "label": "Correct answer", "type": "select", "default": "",
      "options": [ { "v": "", "l": "None" }, { "v": "true", "l": "True" }, { "v": "false", "l": "False" } ],
      "showIf": { "responseType": "truefalse" } },

    { "key": "ratingMax", "label": "Scale", "type": "select", "default": "5",
      "options": [ { "v": "5", "l": "1 – 5" }, { "v": "7", "l": "1 – 7" }, { "v": "10", "l": "1 – 10" } ],
      "showIf": { "responseType": "rating" } },
    { "key": "ratingLow",  "label": "Label for the low end",  "type": "text", "placeholder": "Strongly disagree",
      "showIf": { "responseType": "rating" } },
    { "key": "ratingHigh", "label": "Label for the high end", "type": "text", "placeholder": "Strongly agree",
      "showIf": { "responseType": "rating" } },

    { "key": "numericAnswer", "label": "Actual value (revealed on click, optional)", "type": "number-nullable",
      "showIf": { "responseType": "numeric" } },
    { "key": "numericUnit", "label": "Unit (optional)", "type": "text", "placeholder": "ms",
      "showIf": { "responseType": "numeric" } },

    { "key": "wordsPerResponse", "label": "Each response counts as", "type": "select", "default": "1",
      "options": [ { "v": "1", "l": "One word" }, { "v": "2", "l": "Up to two words" }, { "v": "3", "l": "Up to three words" } ],
      "showIf": { "responseType": "wordcloud" } },

    { "key": "autoStart", "label": "Start collecting when the slide opens", "type": "checkbox", "default": true },

    { "key": "minResponses", "label": "Min. responses before closing", "type": "number",
      "min": 1, "step": 1, "default": 1, "showIf": { "responseType": "open" } },

    { "key": "scale", "label": "Text size", "type": "select", "options": ["1", "1.4", "1.8", "2.2"], "default": "1.4" }
  ]
}

<!-- Standalone fallback. Inside Beamer+ the host injects the shared widget
     base (tokens, fonts, toolbar, buttons) ahead of everything else. Opened
     directly (a file in Edge, a plain web server) nothing does, so load the
     same stylesheet from the repo, relative to this file, at the same point in
     the cascade. Beamer+ is unaffected: its link is already present. -->
<script id="bw-standalone">
(function () {
  if (document.querySelector('link[href*="widget-base.css"]')) return;
  var head = document.head || document.getElementsByTagName('head')[0];
  [['preconnect', 'https://fonts.googleapis.com'],
   ['stylesheet', 'https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap'],
   ['stylesheet', '../static/css/widget-base.css']].forEach(function (l) {
    var el = document.createElement('link');
    el.rel = l[0]; el.href = l[1];
    head.appendChild(el);
  });
  document.documentElement.setAttribute('data-bw-standalone', '');
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audience Response — Beamer+</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<script src="/static/vendor/qrcode.min.js"></script>
<!-- Vendored by the Beamer+ server. Never load socket.io from a CDN, and never
     call io() bare — inside the srcdoc iframe that resolves to
     http://about/socket.io/, which an HTTPS deck blocks as mixed content. -->
<script src="/static/vendor/socket.io.min.js"></script>
<style>
/* Tokens, reset, toolbar, buttons, cards, banners and the spinner come from
   the shared widget base (static/css/widget-base.css). What's left here is the
   poll itself: the question, the join panel, and one results view per
   question type — answer bars, a column chart (rating and numeric share it),
   a word cloud, a response wall with its spotlight, and the AI summary card.

   Everything the room reads is sized off --u, so the host's text-size control
   grows the results without inflating the toolbar. */

/* ── Toolbar extras ──────────────────────────────────── */
#start-btn, #close-btn, #show-btn, #reveal-btn, #view-seg, #viewer-badge { display: none; }
.ar-seg { display: inline-flex; }
.ar-seg .bw-btn { border-radius: 0; margin-left: -1px; }
.ar-seg .bw-btn:first-child { border-radius: var(--radius) 0 0 var(--radius); margin-left: 0; }
.ar-seg .bw-btn:last-child  { border-radius: 0 var(--radius) var(--radius) 0; }

/* ── Stage ───────────────────────────────────────────
   One column by default: the question, and whatever the question produced,
   down the middle. A multiple-choice question splits instead — question and
   options on the left, and on the right the one thing that changes as the
   poll moves along: the QR code, then "poll closed", then the pie. */
#stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;
  gap: calc(20px * var(--u)) calc(28px * var(--u));
  padding: calc(18px * var(--u)) calc(28px * var(--u));
}
#stage.is-split {
  grid-template-columns: minmax(0, 1fr) minmax(0, 0.72fr);
  grid-template-rows: minmax(0, 1fr);
  align-items: center;
}
#stage.is-split #side { grid-column: 2; grid-row: 1; }

/* The right-hand column: exactly one of these at a time. */
#side {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(12px * var(--u));
  min-height: 0;
}
#side:empty, #side.is-empty { display: none; }

#prompt {
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: calc(14px * var(--u));
  padding-bottom: 6%;           /* bias slightly above true centre */
}
/* Views that fill the space want the top edge, not the middle. */
#stage.is-fill #prompt { justify-content: flex-start; padding-bottom: calc(6px * var(--u)); }
/* A choice question sits at the top whatever phase it's in: centring it would
   drop the question down the slide the moment the QR column goes away. */
#stage.is-top #prompt { justify-content: flex-start; padding-bottom: 0; }
/* Split view: the whole left column scrolls as one, rather than the question
   and the answers each keeping their own scrollbar. */
#stage.is-split #prompt {
  padding-bottom: 0;
  /* Stretch to the row and scroll inside it: centred, a column taller than
     the slide overflows upwards and loses its own first line. */
  align-self: stretch;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: thin;
  /* Top-aligned, not centred: a question with a listing is taller than the
     slide, and a centred column clips its own first line when it overflows. */
  justify-content: flex-start;
}
/* Natural height, no shrinking: inside a scrolling column a flex child that
   shrinks squeezes its own listing instead of letting the column scroll. */
#stage.is-split #question,
#stage.is-split #choices { flex: 0 0 auto; overflow: visible; max-height: none; }

/* The count keeps its line whatever it says, so closing the poll can't nudge
   the question down — it is the one thing on the slide that must not move. */
#kicker { min-height: 1.5em; }
#question {
  font-size: var(--fs-head);
  font-weight: 500;
  line-height: 1.3;
  letter-spacing: -0.01em;
  color: var(--text);
  overflow-wrap: anywhere;
  /* A question carrying a code listing can be tall; it gets the space it
     needs and scrolls rather than pushing the answers off the slide. */
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: thin;
}

/* ── Code and maths inside the question ─────────────── */
/* Listings are the point of the question, not decoration: a quiet panel,
   mono type sized off --u so it's readable from the back, and its own
   scrollbar when a long line refuses to wrap. */
#question pre {
  margin: calc(12px * var(--u)) 0;
  padding: calc(12px * var(--u)) calc(16px * var(--u)) calc(12px * var(--u)) 0;
  background: var(--bg-subtle);
  border-radius: var(--radius-lg);
  overflow-x: auto;
  scrollbar-width: thin;
}
#question pre code {
  display: block;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  font-weight: 400;
  line-height: 1.55;
  letter-spacing: 0;
  color: var(--text);
  white-space: pre;
  tab-size: 4;
}
/* One line, one row, numbered in the gutter — so a question can say
   "look at line 3" and the room knows which line that is. */
.cl {
  display: block;
  position: relative;
  padding-left: calc(46px * var(--u));
}
.cl::before {
  content: attr(data-n);
  position: absolute;
  left: 0;
  width: calc(32px * var(--u));
  text-align: right;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  user-select: none;
}
.cl::after { content: '\200b'; }   /* keeps a blank line's height */

/* Token colours. Two sets, because the deck can be light or dark and the
   host's theme isn't a media query — syncCodeTheme() reads --bg and picks. */
:root {
  --pk-kw:  #8250df;
  --pk-str: #0a7a68;
  --pk-num: #1257c9;
  --pk-bi:  #9a3d84;
  --pk-com: #8a938e;
}
html.ar-dark {
  --pk-kw:  #c9a6ff;
  --pk-str: #54c8a8;
  --pk-num: #8bb9ff;
  --pk-bi:  #eda6d8;
  --pk-com: #8a938e;
}
.pk-kw  { color: var(--pk-kw); font-weight: 600; }
.pk-str { color: var(--pk-str); }
.pk-num { color: var(--pk-num); }
.pk-bi  { color: var(--pk-bi); }
.pk-com { color: var(--pk-com); font-style: italic; }
/* Inline `code`, in a question or an answer option. */
#question :not(pre) > code,
.choice-label code,
#spot-text code {
  padding: 0.1em 0.35em;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 0.88em;
  white-space: pre-wrap;
}
#question blockquote {
  margin: calc(8px * var(--u)) 0;
  padding-left: calc(12px * var(--u));
  border-left: 2px solid var(--border-med);
  color: var(--text-2);
}
#question ul, #question ol { margin: calc(6px * var(--u)) 0 calc(6px * var(--u)) 1.2em; }
#question li { margin: 0.15em 0; }
#question .katex-display { margin: calc(10px * var(--u)) 0; }
#question h1, #question h2, #question h3 { font-size: 1em; font-weight: 600; }
#question img { max-width: 100%; }

/* A listing makes the question the main event, so the prose around it steps
   down and the block itself carries the size. */
#question.has-code { font-size: var(--fs-body); font-weight: 400; line-height: 1.45; }
#question.has-code > p:first-child { font-weight: 500; }

/* Every results view starts hidden; render() shows the one that applies. */
#choices, #chart, #stats, #cloud, #wall, #summary, #fill { display: none; }

/* ── Preview (not configured yet) ───────────────────── */
/* Sample data, faded, so the presenter sees the finished layout before
   typing anything — rather than a bare instruction on an empty slide. */
#stage.is-preview #prompt,
#stage.is-preview #side { opacity: 0.38; filter: grayscale(1); pointer-events: none; user-select: none; }
#preview-tag {
  position: absolute;
  left: 50%;
  bottom: calc(18px * var(--u));
  transform: translateX(-50%);
  z-index: 4;
  display: none;
  align-items: center;
  gap: 12px;
  max-width: calc(100% - 32px);
  padding: 8px 8px 8px 14px;
  background: var(--bg);
  border: 1px solid var(--border-med);
  border-radius: 999px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
  font-size: var(--fs-chrome);
  color: var(--text-2);
  white-space: nowrap;
}
#preview-tag .bw-hint { color: var(--text); }
#preview-msg { overflow: hidden; text-overflow: ellipsis; }
#stage.is-preview #preview-tag { display: flex; }
#stage.is-preview { padding-bottom: calc(18px * var(--u) + 56px); }
#preview-open { height: 26px; border-radius: 999px; }

/* ── Answer rows (choice, true/false) ───────────────── */
/* A grid, not a list: layoutChoices() picks the number of columns from how
   many answers there are and how long they run, so four short answers sit in
   one line, four long ones stack, and six middling ones make a block —
   whatever keeps them all on the slide without a scrollbar. */
#choices {
  list-style: none;
  flex: 0 1 auto;
  grid-auto-rows: min-content;
  align-content: start;
  gap: calc(8px * var(--u));
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: thin;
}
.choice {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  column-gap: calc(12px * var(--u));
  padding: calc(9px * var(--u)) calc(14px * var(--u)) calc(9px * var(--u)) calc(10px * var(--u));
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  transition: border-color 0.2s, background 0.2s, opacity 0.3s;
}
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: calc(26px * var(--u)); height: calc(26px * var(--u));
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--border-med);
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  font-weight: 600;
  flex-shrink: 0;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.badge svg { width: 58%; height: 58%; }
.choice-body { min-width: 0; }
.choice-label { font-size: var(--fs-body); line-height: 1.35; color: var(--text); overflow-wrap: anywhere; }
.figure {
  display: none;
  flex-direction: column;
  align-items: flex-end;
  /* Fixed, not auto: each row is its own grid, so a content-sized column
     would give "1 vote" a longer track than "12 votes" and the bars would
     stop sharing a scale. */
  width: calc(58px * var(--u));
}
.pct {
  font-family: var(--font-mono);
  font-size: var(--fs-lead);
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.votes {
  margin-top: 4px;
  font-family: var(--font-mono);
  font-size: var(--fs-chrome-sm);
  color: var(--text-3);
  white-space: nowrap;
}
#choices.show-results .figure { display: flex; }

/* True / False: two answers, so they land side by side, and they get the
   room to be read as tiles rather than rows. */
#choices.is-tf { gap: calc(12px * var(--u)); }
#choices.is-tf .choice { padding: calc(16px * var(--u)) calc(18px * var(--u)); }
#choices.is-tf .choice-label { font-size: var(--fs-lead); font-weight: 500; }

/* Leader(s): full ink. Ties all lead. */
.choice.is-lead { border-color: var(--border-med); background: var(--bg); }

/* Revealed answer: green carries the one piece of meaning on the slide. */
.choice.is-correct {
  border-color: var(--ok);
  background: color-mix(in srgb, var(--ok) 8%, var(--bg));
}
.choice.is-correct .badge { background: var(--ok) !important; border-color: var(--ok) !important; color: #fff !important; }
.choice.is-correct .pct   { color: var(--ok); }
.choice.is-dim { opacity: 0.45; }

/* ── Share shades ────────────────────────────────────
   A ramp mixed from the deck's own ink, so the pie and the letter badges say
   the same thing in any theme: the more votes, the more ink. */
.s0 { --share: color-mix(in srgb, var(--text) 92%, var(--bg)); }
.s1 { --share: color-mix(in srgb, var(--text) 74%, var(--bg)); }
.s2 { --share: color-mix(in srgb, var(--text) 56%, var(--bg)); }
.s3 { --share: color-mix(in srgb, var(--text) 40%, var(--bg)); }
.s4 { --share: color-mix(in srgb, var(--text) 27%, var(--bg)); }
.s5 { --share: color-mix(in srgb, var(--text) 17%, var(--bg)); }
.badge.s0, .badge.s1, .badge.s2, .badge.s3, .badge.s4, .badge.s5 {
  background: var(--share); border-color: var(--share);
}
.badge.s0, .badge.s1, .badge.s2 { color: var(--bg); }
.badge.s3, .badge.s4, .badge.s5 { color: var(--text); }

/* ── Headline numbers (rating, numeric) ─────────────── */
#stats {
  flex-shrink: 0;
  flex-wrap: wrap;
  gap: calc(10px * var(--u)) calc(34px * var(--u));
}
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat-v {
  font-family: var(--font-mono);
  font-size: var(--fs-head);
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  white-space: nowrap;
}
.stat-v small { font-size: 0.5em; font-weight: 500; color: var(--text-3); margin-left: 4px; }
.stat.is-minor .stat-v { font-size: var(--fs-lead); color: var(--text-2); }
.stat.is-answer .stat-v { color: var(--ok); }

/* ── Column chart (rating, numeric) ─────────────────── */
#chart {
  flex: 1 1 auto;
  min-height: calc(110px * var(--u));
  flex-direction: column;
}
.hist-plot {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  gap: calc(6px * var(--u));
  border-bottom: 1px solid var(--border-med);
}
.hcol { position: relative; flex: 1 1 0; min-width: 0; }
.hbar {
  position: absolute;
  left: 8%; right: 8%; bottom: 0;
  height: 0;
  max-width: calc(80px * var(--u));
  margin: 0 auto;
  background: var(--text-3);
  border-radius: 5px 5px 1px 1px;
  transition: height 0.7s cubic-bezier(.22, 1, .36, 1), background 0.2s;
}
.hn {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  text-align: center;
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
  transition: bottom 0.7s cubic-bezier(.22, 1, .36, 1);
}
.hcol.is-top .hbar { background: var(--text); }
.hcol.is-top .hn   { color: var(--text); }
.hcol.is-hit .hbar { background: var(--ok); }
/* Numeric bins are labelled by their lower edge, so the label sits under it. */
#chart.is-edges .hlab { text-align: left; }
.hist-axis { display: flex; gap: calc(6px * var(--u)); padding-top: calc(6px * var(--u)); }
.hlab {
  flex: 1 1 0;
  min-width: 0;
  text-align: center;
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
}
.hist-ends {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding-top: calc(4px * var(--u));
  font-size: var(--fs-small);
  color: var(--text-3);
}
.hist-ends:empty { display: none; }
/* The actual value, dropped onto the histogram when revealed. */
.marker {
  position: absolute;
  top: 0; bottom: -1px;
  width: 2px;
  margin-left: -1px;
  background: var(--ok);
  display: none;
}
.marker span {
  position: absolute;
  top: 0;
  left: 6px;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--ok);
  color: #fff;
  font-family: var(--font-mono);
  font-size: var(--fs-chrome-sm);
  font-weight: 600;
  white-space: nowrap;
}
.marker.flip span { left: auto; right: 6px; }

/* ── Word cloud ─────────────────────────────────────── */
#cloud {
  flex: 1 1 auto;
  min-height: 0;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 0 4% 3%;
}
#cloud-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: calc(4px * var(--u) * var(--ck, 1)) calc(18px * var(--u) * var(--ck, 1));
  max-width: 100%;
}
.word {
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -0.01em;
  color: var(--text);
  white-space: nowrap;
  transition: opacity 0.3s;    /* not font-size: the fit loop measures sizes synchronously */
}
.word.is-new { animation: ar-pop 0.45s cubic-bezier(.22, 1, .36, 1); }
#cloud-empty { display: none; margin: auto; }

/* ── Fill in the blanks ─────────────────────────────── */
/* The presenter's template with a slot per BLANK: empty while the room is
   answering, then one student's answers at a time as they step through. */
#fill {
  flex: 0 1 auto;
  min-height: 0;
  flex-direction: column;
  gap: calc(10px * var(--u));
}
#fill-tpl {
  padding: calc(14px * var(--u)) calc(18px * var(--u));
  background: var(--bg-subtle);
  border-radius: var(--radius-lg);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 2.1;
  white-space: pre-wrap;
  overflow: auto;
  scrollbar-width: thin;
  color: var(--text);
}
.blank {
  display: inline-block;
  min-width: 5ch;
  margin: 0 2px;
  padding: 0 6px;
  border-bottom: 2px solid var(--border-med);
  text-align: center;
  color: var(--text-3);
}
.blank.is-filled {
  border-bottom-color: transparent;
  border-radius: 5px;
  background: color-mix(in srgb, var(--text) 10%, transparent);
  color: var(--text);
  font-weight: 600;
  animation: ar-pop 0.25s cubic-bezier(.22, 1, .36, 1);
}
#fill-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: var(--fs-chrome-sm);
  color: var(--text-3);
}
#fill-stats { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#fill-foot .bw-spacer { flex: 1; }

/* ── Response wall (open-ended) ─────────────────────── */
#wall {
  flex: 1 1 auto;
  min-height: 0;
  flex-wrap: wrap;
  align-content: flex-start;
  justify-content: center;
  gap: calc(10px * var(--u));
  overflow-y: auto;
  padding: 2px 2px calc(12px * var(--u));
  scrollbar-width: thin;
}
.resp {
  max-width: min(100%, calc(340px * var(--u)));
  padding: calc(10px * var(--u)) calc(14px * var(--u));
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  font-size: var(--fs-body);
  line-height: 1.4;
  color: var(--text);
  overflow-wrap: anywhere;
  transition: border-color var(--dur), background var(--dur);
}
.resp.is-many { border-color: var(--border-med); background: var(--bg); }
.resp .times {
  display: inline-block;
  margin-left: 8px;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--text);
  color: var(--bg);
  font-family: var(--font-mono);
  font-size: var(--fs-chrome-sm);
  font-weight: 600;
  vertical-align: 0.15em;
}
.resp.is-new { animation: ar-in 0.45s cubic-bezier(.22, 1, .36, 1); }
body.is-presenter .resp { cursor: pointer; }
body.is-presenter .resp:hover { border-color: var(--text-3); }
#wall-empty { display: none; margin: auto; }

/* ── Spotlight: one response, big, for discussion ───── */
#spot {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 5% 8% 9%;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(2px);
}
#spot.is-open { display: flex; animation: ar-fade 0.2s ease-out; }
#spot-card {
  width: 100%;
  max-width: calc(640px * var(--u));
  max-height: 100%;
  overflow-y: auto;
  padding: calc(26px * var(--u)) calc(30px * var(--u)) calc(18px * var(--u));
  background: var(--bg);
  border: 1px solid var(--border-med);
  border-radius: var(--radius-lg);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.14);
}
#spot-text {
  font-size: var(--fs-head);
  font-weight: 500;
  line-height: 1.35;
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}
#spot-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: calc(18px * var(--u));
  font-family: var(--font-mono);
  font-size: var(--fs-chrome-sm);
  color: var(--text-3);
}
#spot-foot .bw-spacer { flex: 1; }

/* ── AI summary ─────────────────────────────────────── */
#summary {
  flex: 1 1 auto;
  min-height: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(16px * var(--u));
  padding-bottom: 6%;
}
#sum-card { width: 100%; max-width: calc(620px * var(--u)); }
#sum-text { font-size: var(--fs-lead); line-height: 1.5; color: var(--text); }
.meter {
  height: calc(6px * var(--u));
  margin-top: calc(18px * var(--u));
  border-radius: 999px;
  background: color-mix(in srgb, var(--text) 7%, transparent);
  overflow: hidden;
}
.meter-fill {
  height: 100%;
  width: 0;
  background: var(--text);
  border-radius: 999px;
  transition: width 0.6s cubic-bezier(.22, 1, .36, 1);
}
#sum-nav { display: flex; align-items: center; gap: 12px; }
#sum-dots { display: flex; gap: 6px; }
#sum-dots span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--border-med);
  transition: background var(--dur), transform var(--dur);
}
#sum-dots span.is-on { background: var(--text); transform: scale(1.2); }
#sum-busy { display: none; }

/* ── Join panel ─────────────────────────────────────── */
#join {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: calc(10px * var(--u));
}
#qr-wrap {
  /* Stays white in dark mode too — a QR code has to keep its contrast to scan. */
  width: min(34vh, 26vw, 260px);
  padding: 10px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  line-height: 0;
}
#qr img, #qr canvas { width: 100% !important; height: auto !important; }
/* The count reads as one phrase — "12 responses" — in the deck's own type,
   both here and above the question once the poll is closed. */
#kicker {
  font-size: var(--fs-body);
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
#kicker.bump { animation: ar-bump 0.35s ease-out; }

/* ── Motion ─────────────────────────────────────────── */
@keyframes ar-in   { from { opacity: 0; transform: translateY(8px) scale(0.97); } }
@keyframes ar-pop  { from { opacity: 0; transform: scale(0.6); } }
@keyframes ar-fade { from { opacity: 0; } }
@keyframes ar-bump { 40% { transform: scale(1.18); } }

@media (prefers-reduced-motion: reduce) {
  .fill, .meter-fill, .choice, .hbar, .hn { transition: none; }
  .resp.is-new, .word.is-new, #spot.is-open, #kicker.bump { animation: none; }
}

/* ── Narrow or tall regions: stack, join panel becomes a strip ─ */
@media (max-width: 620px), (max-aspect-ratio: 1/1) {
  #stage, #stage.is-split {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto;
    gap: 14px;
  }
  #stage.is-split #side { grid-column: 1; grid-row: 2; }
  #join { flex-direction: row; flex-wrap: wrap; gap: 12px; }
  #qr-wrap { width: min(22vh, 40vw, 180px); padding: 6px; }
  #pie svg { width: min(100%, 200px); }

}

/* Scrollbars: hairline, never louder than the content. */
#choices::-webkit-scrollbar, #wall::-webkit-scrollbar, #spot-card::-webkit-scrollbar { width: 6px; }
#choices::-webkit-scrollbar-thumb, #wall::-webkit-scrollbar-thumb, #spot-card::-webkit-scrollbar-thumb {
  background: var(--border); border-radius: 3px;
}
#choices::-webkit-scrollbar-thumb:hover, #wall::-webkit-scrollbar-thumb:hover { background: var(--border-med); }
</style>
</head>
<body>
<div id="shell" class="bw-shell">

  <div id="toolbar" class="bw-toolbar" data-bw-topbar>
    <span class="bw-toolbar-title" id="wtitle">Audience Response</span>
    <div class="bw-spacer"></div>
    <span class="bw-status" id="viewer-badge">View only · synced with presenter</span>
    <div class="ar-seg" id="view-seg">
      <button class="bw-btn" id="view-wall">Responses</button>
      <button class="bw-btn" id="view-summary">AI summary</button>
    </div>
    <button class="bw-btn" id="start-btn">Start</button>
    <button class="bw-btn" id="close-btn">Close</button>
    <button class="bw-btn" id="show-btn">Show results</button>

  </div>

  <div id="stage">
    <section id="prompt">
      <div id="banner" class="bw-banner bw-banner--error"></div>

      <div id="question" class="bw-md"></div>
      <div id="stats"></div>
      <ol id="choices"></ol>
      <div id="chart">

        <div class="hist-axis" id="hist-axis"></div>
        <div class="hist-ends" id="hist-ends"></div>
      </div>
      <div id="cloud"><div id="cloud-inner"></div><div id="cloud-empty" class="bw-empty">Words will appear here.</div></div>

      <div id="fill">
        <div id="fill-tpl"></div>
        <div id="fill-foot">
          <span id="fill-stats"></span>
          <span class="bw-spacer"></span>
          <button class="bw-btn bw-btn--icon" id="fill-prev" title="Previous response (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
          <span id="fill-pos"></span>
          <button class="bw-btn bw-btn--icon" id="fill-next" title="Next response (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
      </div>
      <div id="wall"><div id="wall-empty" class="bw-empty">Responses will appear here.</div></div>
      <div id="summary">
        <div id="sum-busy" class="bw-center"><div class="bw-spinner"></div><div class="bw-boot-sub">Summarising responses…</div></div>
        <div id="sum-card" class="bw-card bw-card--lg">
          <div id="sum-text"></div>
