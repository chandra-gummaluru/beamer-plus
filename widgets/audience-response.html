        </div>
        <div id="sum-nav">
          <button class="bw-btn bw-btn--icon" id="sum-prev" title="Previous summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
          <div id="sum-dots"></div>
          <button class="bw-btn bw-btn--icon" id="sum-next" title="Next summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
      </div>
    </section>

    <aside id="side">
      <div id="join">
        <div id="qr-wrap"><div id="qr"></div></div>
      </div>
    </aside>

    <div id="preview-tag">
      <span class="bw-hint">Preview</span>
      <span id="preview-msg">Sample data — add a question in the settings to start.</span>
      <button class="bw-btn" id="preview-open">Open settings</button>
    </div>

    <div id="spot">
      <div id="spot-card">
        <div id="spot-text"></div>
        <div id="spot-foot">
          <span id="spot-count"></span>
          <span class="bw-spacer"></span>
          <button class="bw-btn bw-btn--icon" id="spot-prev" title="Previous (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
          <span id="spot-pos"></span>
          <button class="bw-btn bw-btn--icon" id="spot-next" title="Next (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
          <button class="bw-btn bw-btn--icon" id="spot-close" title="Close (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ── Config ──────────────────────────────────────────────────────────────────
  const _qs       = new URLSearchParams(location.search);
  const CFG0      = window.WIDGET_CONFIG || {};
  let   cfg       = { ...CFG0 };
  let   WIDGET_ID = CFG0.id || CFG0.widgetId || 'audience-response';
  let   IS_VIEWER = CFG0.role === 'viewer' || _qs.get('viewer') === '1';

  const LETTERS  = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const letter   = i => LETTERS[i] || String(i + 1);
  const POLL_MS  = 3000;
  const CAP      = { groups: 400, nums: 2000, words: 150 };   // what travels to viewers / the deck

  const BLANK_RE = /\bBLANK\b|_{3,}/g;

  const TYPES = {
    choice:    { title: 'Multiple Choice',  kicker: 'Multiple choice' },
    truefalse: { title: 'True or False',    kicker: 'True or false' },
    rating:    { title: 'Rating Scale',     kicker: 'Rating' },
    numeric:   { title: 'Numeric Estimate', kicker: 'Estimate' },
    wordcloud: { title: 'Word Cloud',       kicker: 'Word cloud' },
    fill:      { title: 'Fill in the Blanks', kicker: 'Fill in the blanks' },
    open:      { title: 'Open Response',    kicker: 'Open question' },
  };
  const isChoiceLike = t => t === 'choice' || t === 'truefalse';

  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';

  const STOP = new Set(('the a an is are was were be been being it in on at to of and or but for with this that ' +
    'these those i we you he she they my your our its not so if as by do did has have had will would can ' +
    'could should may might shall very just also up out about than then there here what which who how when where')
    .split(' '));

  // ── DOM ─────────────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const stage       = $('stage');
  const titleEl     = $('wtitle');
  const viewerBadge = $('viewer-badge');
  const startBtn    = $('start-btn');
  const closeBtn    = $('close-btn');
  const showBtn     = $('show-btn');
  const revealBtn   = $('reveal-btn');
  const viewSeg     = $('view-seg');
  const viewWall    = $('view-wall');
  const viewSum     = $('view-summary');
  const bannerEl    = $('banner');
  const kickerEl    = $('kicker');
  const promptEl    = $('prompt');
  const questionEl  = $('question');
  const statsEl     = $('stats');
  const choicesEl   = $('choices');
  const chartEl     = $('chart');
  const plotEl      = $('hist-plot');
  const axisEl      = $('hist-axis');
  const endsEl      = $('hist-ends');
  const markerEl    = $('marker');
  const markerLabel = $('marker-label');
  const cloudEl     = $('cloud');
  const cloudEmpty  = $('cloud-empty');
  const fillEl      = $('fill');
  const fillTpl     = $('fill-tpl');
  const fillStats   = $('fill-stats');
  const fillPos     = $('fill-pos');
  const cloudInner  = $('cloud-inner');
  const wallEl      = $('wall');
  const wallEmpty   = $('wall-empty');
  const sideEl      = $('side');
  const joinEl      = $('join');
  const qrEl        = $('qr');
  const previewMsg  = $('preview-msg');
  const previewBtn  = $('preview-open');
  const spotEl      = $('spot');
  const spotText    = $('spot-text');
  const spotCount   = $('spot-count');
  const spotPos     = $('spot-pos');
  const summaryEl   = $('summary');
  const sumBusy     = $('sum-busy');
  const sumCard     = $('sum-card');
  const sumText     = $('sum-text');
  const sumMeter    = $('sum-meter');
  const sumMeta     = $('sum-meta');
  const sumDots     = $('sum-dots');
  const sumNav      = $('sum-nav');

  // ── State ───────────────────────────────────────────────────────────────────
  // Everything a viewer needs to draw the same picture lives in S; the DOM is a
  // projection of it. `responses` is presenter-only raw data — viewers get the
  // derived tallies instead, which are far smaller.
  const S = {
    type:      'choice',
    question:  '',
    options:   [],           // choice / truefalse
    correct:   null,         // 0-based index, or null
    scale:     { min: 1, max: 5, low: '', high: '' },   // rating
    unit:      '',           // numeric
    answer:    null,         // numeric: the actual value, or null
    words:     1,            // wordcloud: words kept per response
    template:  '',           // fill: the text, with a BLANK per slot
    fills:     [],           // fill: [[answer, answer, …], …] one per response
    fillIdx:   0,            // fill: whose answers are on screen
    // idle → collect (QR up) → closed (no more answers) → results (on screen)
    phase:     'idle',
    surveyId:  null,
    joinUrl:   '',
    responses: [],
    total:     0,
    votes:     {},           // choice-like: { A: 3, B: 1 }
    ratings:   {},           // rating: { 1: 2, 4: 7 }
    nums:      [],           // numeric: every valid estimate
    cloud:     [],           // wordcloud: [{ text, n }]
    groups:    [],           // open: [{ text, n }] in order of first appearance
    revealed:  false,
    view:      'wall',       // open results: 'wall' | 'summary'
    summaries: null,
    sIdx:      0,
    sumBusy:   false,
    sumError:  '',
    spotlight: -1,
    error:     '',
  };

  let pollKey    = null;     // identity of the running poll; a change starts a new one
  let startToken = 0;        // bumped to discard a create() that lost a race
  let pollTimer  = null;
  let inflight   = null;

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function parentOrigin() {
    // location.origin is "null" inside a srcdoc iframe, hence the parent first.
    try { return window.parent.location.origin; } catch (_) { return window.location.origin; }
  }
  function serverUrl() {
    return (cfg.serverUrl || cfg.socketUrl || parentOrigin()).replace(/\/+$/, '');
  }
  function publicOrigin() {
    try { return new URL(cfg.publicBaseUrl || cfg.serverUrl || cfg.socketUrl).origin; }
    catch (_) { return parentOrigin(); }
  }

  // Markdown + KaTeX for the question and answer options. Falls back to plain
  // text when the CDN is unreachable, rather than showing nothing.
  function setMd(el, src) {
    src = src == null ? '' : String(src);
    if (el._md === src && el._mdKatex === !!window.renderMathInElement) return;
    el._md = src; el._mdKatex = !!window.renderMathInElement;
    if (!src) { el.textContent = ''; el.classList.remove('has-code'); return; }
    if (!window.marked) { el.textContent = src; return; }
    // Presenter-authored config, not audience input — responses never come
    // through here; they're set with textContent.
    el.innerHTML = marked.parse(src, { breaks: false });
    decorateCode(el);
    el.classList.toggle('has-code', !!el.querySelector('pre'));
    if (window.renderMathInElement) {
      renderMathInElement(el, {
        delimiters: [
          { left: '$$',  right: '$$',  display: true  },
          { left: '$',   right: '$',   display: false },
          { left: '\\(', right: '\\)', display: false },
          { left: '\\[', right: '\\]', display: true  },
        ], throwOnError: false,
      });
    }
  }

  // Count a number up (or down) to its new value instead of snapping — reads
  // as "the results are coming in" from the back of a room.
  const REDUCED = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  function countTo(el, to, suffix) {
    const from = el._v ?? 0;
    el._v = to;
    cancelAnimationFrame(el._raf);
    if (REDUCED || from === to) { el.textContent = to + suffix; return; }
    const t0 = performance.now(), dur = 650;
    const step = t => {
      const k = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(from + (to - from) * e) + suffix;
      if (k < 1) el._raf = requestAnimationFrame(step);
    };
    el._raf = requestAnimationFrame(step);
  }

  function normaliseOptions(o) {
    const arr = Array.isArray(o) ? o : String(o || '').split('\n');
    return arr.map(s => String(s).trim()).filter(Boolean).slice(0, 10);   // the phone page letters to J
  }

  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

  function fmtNum(x) {
    if (x == null || !Number.isFinite(x)) return '–';
    const a = Math.abs(x);
    const digits = a >= 1000 ? 0 : a >= 100 ? 1 : a >= 1 ? 2 : 3;
    return x.toLocaleString(undefined, { maximumFractionDigits: digits });
  }

  function quantile(sorted, q) {
    if (!sorted.length) return NaN;
    const i = (sorted.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
  }

  function niceStep(raw) {
    if (!(raw > 0)) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }

  // "Hash Tables!" and "hash tables" are the same answer in a cloud.
  function toPhrase(text, k) {
    const tokens = String(text || '').toLowerCase()
      .replace(/[^\p{L}\p{N}\s'-]/gu, ' ')
      .split(/\s+/)
      .map(t => t.replace(/^['-]+|['-]+$/g, ''))
      .filter(t => t.length > 1 && !STOP.has(t));
    return tokens.slice(0, k).join(' ');
  }

  // ── Code blocks ─────────────────────────────────────────────────────────────
  // A listing in a question is read from the back of a room, so it gets what a
  // listing needs and nothing more: line numbers and colour for the three
  // things that carry meaning — keywords, literals and comments. Highlighting
  // is per line (a string can't span lines here), which is all a slide needs.
  const KW_PY = 'def class lambda if elif else for while break continue return yield pass import from as with ' +
    'try except finally raise assert del global nonlocal in is not and or None True False async await';
  const KW_C  = 'function var let const class new delete return if else for while do switch case default break ' +
    'continue try catch finally throw typeof instanceof struct enum union typedef public private protected static ' +
    'void int long short float double char bool string true false null nullptr this super import export from ' +
    'extends implements interface package async await sizeof';
  const BI_PY = 'print len range str int float bool list dict set tuple sum min max abs sorted enumerate zip map ' +
    'filter type input open round isinstance append';

  const CLIKE = new Set(['js', 'javascript', 'ts', 'typescript', 'java', 'c', 'cpp', 'c++', 'cs', 'csharp',
                         'go', 'rust', 'php', 'swift', 'kotlin', 'scala', 'dart']);

  // Written with String.raw so the regex reads as a regex, not as a wall of
  // doubled backslashes. Back-tick strings are left out on purpose: they'd
  // need escaping here, and slide code rarely uses them.
  const RE_COM = String.raw`#[^\n]*|//[^\n]*|/\*.*?\*/`;
  const RE_STR = String.raw`"(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?`;
  const RE_NUM = String.raw`0[xXbBoO][0-9a-fA-F_]+|\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?`;

  function tokenRe(lang) {
    const kw = CLIKE.has(lang) ? KW_C
             : (lang === 'python' || lang === 'py' || !lang) ? KW_PY
             : KW_PY + ' ' + KW_C;
    const alt = list => list.trim().split(/\s+/).join('|');
    return new RegExp(
      '(' + RE_COM + ')' +
      '|(' + RE_STR + ')' +
      '|\\b(' + alt(kw) + ')\\b' +
      '|\\b(' + alt(BI_PY) + ')\\b' +
      '|\\b(' + RE_NUM + ')\\b', 'g');
  }

  function highlightLine(line, re) {
    const sp = (c, t) => `<span class="pk-${c}">${escHtml(t)}</span>`;
    let out = '', last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(line))) {
      out += escHtml(line.slice(last, m.index));
      out += m[1] ? sp('com', m[1]) : m[2] ? sp('str', m[2]) : m[3] ? sp('kw', m[3])
           : m[4] ? sp('bi', m[4]) : sp('num', m[5]);
      last = re.lastIndex;
      if (m[0] === '') re.lastIndex++;
    }
    return out + escHtml(line.slice(last));
  }

  function decorateCode(root) {
    root.querySelectorAll('pre > code').forEach(code => {
      const lang = (code.className.match(/language-([\w+#]+)/) || ['', ''])[1].toLowerCase();
      const re   = tokenRe(lang);
      const src  = code.textContent.replace(/\n+$/, '');
      code.innerHTML = src.split('\n')
        .map((line, i) => `<span class="cl" data-n="${i + 1}">${highlightLine(line, re)}</span>`)
        .join('');
    });
  }

  // The token palette can't come from the host's tokens (they carry no hues),
  // so pick the light or dark set from how dark --bg actually is.
  function syncCodeTheme() {
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    let r = 255, g = 255, b = 255;
    if (bg.startsWith('#')) {
      const h = bg.slice(1);
      const p = h.length === 3 ? [...h].map(c => c + c) : [h.slice(0, 2), h.slice(2, 4), h.slice(4, 6)];
      [r, g, b] = p.map(x => parseInt(x, 16) || 0);
    } else {
      const n = bg.match(/[\d.]+/g);
      if (n && n.length >= 3) [r, g, b] = n.slice(0, 3).map(Number);
    }
    document.documentElement.classList.toggle('ar-dark', (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 < 0.45);
  }

  // ── Derived data ────────────────────────────────────────────────────────────
  function recompute() {
    S.total = S.responses.length;
    const texts = S.responses.map(r => String(r.text || '').trim());
    if (isChoiceLike(S.type)) {
      const v = {};
      for (const t of texts) { const k = t.toUpperCase(); if (k) v[k] = (v[k] || 0) + 1; }
      S.votes = v;
    } else if (S.type === 'rating') {
      const r = {};
      for (const t of texts) {
        const n = Math.round(Number(t));
        if (n >= S.scale.min && n <= S.scale.max) r[n] = (r[n] || 0) + 1;
      }
      S.ratings = r;
    } else if (S.type === 'numeric') {
      S.nums = texts.map(t => Number(t.replace(/[\s,_]/g, ''))).filter(Number.isFinite);
    } else if (S.type === 'fill') {
      // Each response is one JSON array — an answer per blank, in order. An
      // older or hand-typed response that isn't JSON counts as one answer.
      S.fills = texts.map(t => {
        try {
          const a = JSON.parse(t);
          return Array.isArray(a) ? a.map(x => String(x)) : [String(a)];
        } catch (_) { return [t]; }
      });
      S.fillIdx = Math.min(S.fillIdx, Math.max(0, S.fills.length - 1));
    } else if (S.type === 'wordcloud') {
      const m = new Map();
      for (const t of texts) {
        const p = toPhrase(t, S.words);
        if (p) m.set(p, (m.get(p) || 0) + 1);
      }
      S.cloud = [...m].map(([text, n]) => ({ text, n }));
    } else {
      // Identical answers ("yes", "Yes ") collapse into one card with a count,
      // so a room that agrees shows as agreement rather than as repetition.
      const m = new Map();
      for (const t of texts) {
        if (!t) continue;
        const k = t.toLowerCase().replace(/\s+/g, ' ');
        const g = m.get(k);
        if (g) g.n++; else m.set(k, { text: t, n: 1 });
      }
      S.groups = [...m.values()];
    }
  }

  // What's missing before this poll can run, or '' when it's ready.
  function missing() {
    if (S.type === 'fill') {
      if (!S.template) return 'Add a template in the settings to start.';
      if (!blankCount(S.template)) return 'Mark at least one blank in the template by writing BLANK.';
      return '';
    }
    if (!S.question) return 'Add a question in the settings to start.';
    if (S.type === 'choice' && S.options.length < 2) return 'Add at least two answer options in the settings.';
    return '';
  }

  function blankCount(tpl) {
    return (String(tpl).match(BLANK_RE) || []).length;
  }
  const ready = () => !missing();

  // ── Preview data ────────────────────────────────────────────────────────────
  // Shown faded, with a "Preview" tag, until the widget is configured — so an
  // unconfigured slide shows what it will become instead of a bare instruction.
  function sample(type) {
    const base = {
      type, phase: 'results', total: 24, revealed: false, view: 'wall',
      options: [], correct: null, votes: {}, ratings: {}, nums: [], cloud: [], groups: [],
      scale: S.scale, unit: '', answer: null, spotlight: -1, summaries: null,
      template: '', fills: [], fillIdx: 0,
      joinUrl: '',
    };
    const q = S.question;
    switch (type) {
      case 'truefalse': return { ...base, question: q || 'Every binary search tree is balanced.',
        options: ['True', 'False'], votes: { A: 7, B: 17 } };
      case 'rating': return { ...base, question: q || 'How confident do you feel about recursion?',
        scale: { ...S.scale, low: S.scale.low || 'Not at all', high: S.scale.high || 'Very' },
        ratings: S.scale.max === 10 ? { 2: 1, 4: 2, 5: 3, 6: 4, 7: 6, 8: 5, 9: 2, 10: 1 }
               : S.scale.max === 7 ? { 1: 1, 2: 2, 3: 3, 4: 5, 5: 7, 6: 4, 7: 2 }
               : { 1: 1, 2: 3, 3: 7, 4: 9, 5: 4 } };
      case 'numeric': return { ...base, question: q || 'How many comparisons does binary search need for 1,000,000 items?',
        unit: S.unit, nums: [5, 8, 10, 12, 15, 18, 20, 20, 20, 21, 22, 25, 30, 30, 40, 50, 64, 100, 20, 19, 24, 16, 20, 25] };
      case 'wordcloud': return { ...base, question: q || 'Describe today\'s lecture in one word.',
        cloud: [['interesting', 7], ['fast', 5], ['confusing', 4], ['useful', 4], ['fun', 3], ['dense', 3],
                ['clear', 2], ['recursion', 2], ['challenging', 2], ['long', 1], ['engaging', 1], ['abstract', 1],
                ['practical', 1], ['neat', 1]].map(([text, n]) => ({ text, n })) };
      case 'fill': return { ...base, question: q,
        template: S.template || '>>> is_sorted(BLANK)\nTrue\n>>> is_sorted(BLANK)\nFalse',
        fills: [['[1, 2, 3]', '[3, 1, 2]'], ['[]', '[2, 1]'], ['[1, 2, 3]', '[5, 4]']], fillIdx: 0 };
      case 'open': return { ...base, question: q || 'What is one thing from today you\'re still unsure about?',
        groups: [['Hash collisions', 3], ['When to use a tree vs a hash table', 1], ['Big-O of amortised operations', 1],
                 ['Recursion', 2], ['Why resizing doubles the array', 1], ['Proof on slide 14', 1]]
                 .map(([text, n]) => ({ text, n })) };
      default: return { ...base, question: q || 'Which data structure gives $O(1)$ average lookup?',
        options: S.options.length >= 2 ? S.options : ['Linked list', 'Hash table', 'Binary search tree', 'Sorted array'],
        votes: S.options.length >= 2 ? {} : { A: 3, B: 13, C: 6, D: 2 } };
    }
  }

  // ── Render ──────────────────────────────────────────────────────────────────
  function render() {
    document.body.classList.toggle('is-presenter', !IS_VIEWER);
    syncCodeTheme();

    // A viewer only knows what the presenter sent; with no question yet it
    // shows the preview of whatever type that is.
    const preview = IS_VIEWER ? !S.question : !ready();
    const D = preview ? sample(S.type) : S;
    const t = D.type;

    setMd(questionEl, D.question);
    const results  = D.phase === 'results';
    const collect  = D.phase === 'collect';
    const showData = results;

    const fallbackTitle = TYPES[t]?.title || 'Audience Response';
    titleEl.textContent = window.BeamerWidget?.name ? BeamerWidget.name(fallbackTitle) : fallbackTitle;
    // The only thing above the question is the count, and only once the room
    // has answered — the type is obvious from what's on the slide.
    // The count has one home, above the question, from the moment the poll
    // opens — so closing it doesn't shift a thing.
    const countText = D.phase === 'idle' ? '' : plural(D.total, 'response', 'responses');
    if (countText !== kickerEl.textContent) {
      kickerEl.textContent = countText;
      if (D.total > lastTally && !preview) {
        kickerEl.classList.remove('bump'); void kickerEl.offsetWidth; kickerEl.classList.add('bump');
      }
      lastTally = preview ? 0 : D.total;
    }

    // Layout. While a multiple-choice poll is open the slide splits — question
    // and options on the left, the QR on the right. From the moment it closes
    // the right column is gone for good and the slide is one column, so the
    // results arrive without anything moving. The preview shows the finished
    // slide (sample results), so it draws no stand-in QR.
    const withJoin = collect;
    const split    = isChoiceLike(t) && withJoin;
    stage.classList.toggle('is-split',   split);
    // A template (or a list of answers) is read from the top, not centred.
    stage.classList.toggle('is-top',     isChoiceLike(t) || t === 'fill');
    stage.classList.toggle('is-preview', preview);
    stage.classList.toggle('is-data',    showData);
    stage.classList.toggle('is-fill',    showData && !split);

    joinEl.style.display = withJoin ? 'flex' : 'none';
    sideEl.classList.toggle('is-empty', !withJoin);
    previewMsg.textContent = IS_VIEWER ? 'Waiting for the presenter to set up this question.'
                                       : 'Sample data — ' + missing().replace(/^A/, 'a');
    previewBtn.style.display = IS_VIEWER || !window.BeamerWidget?.openSettings ? 'none' : '';

    bannerEl.style.display = S.error && !preview ? 'flex' : 'none';
    bannerEl.textContent   = S.error;

    const show = (el, on, how) => { el.style.display = on ? (how || 'flex') : 'none'; };
    show(choicesEl, isChoiceLike(t), 'grid');
    show(statsEl,   showData && (t === 'rating' || t === 'numeric'));
    show(chartEl,   showData && (t === 'rating' || t === 'numeric'));
    show(cloudEl,   showData && t === 'wordcloud');
    show(fillEl,    t === 'fill' && !!D.template);
    const summary = t === 'open' && results && D.view === 'summary';
    show(wallEl,    showData && t === 'open' && !summary);
    show(summaryEl, summary);

    if (isChoiceLike(t))  renderChoices(D, showData);
    if (showData && t === 'rating')    renderRating(D);
    if (showData && t === 'numeric')   renderNumeric(D);
    if (showData && t === 'wordcloud') renderCloud(D);
    if (t === 'fill') renderFill(D, showData);
    if (t === 'open')     renderWall(D);
    if (summary)          renderSummary(D);

    renderJoin(D, preview);
    renderSpotlight(D);
    renderToolbar(preview);
  }

  // Three plain steps, always in the same order: close the poll, put the
  // results on the slide, reveal the answer. A button that isn't its turn yet
  // is visible but disabled, so the sequence is legible from the bar.
  function renderToolbar(preview) {
    const t = S.type, p = S.phase;
    viewerBadge.style.display = IS_VIEWER ? 'inline-flex' : 'none';
    const btns = [startBtn, closeBtn, showBtn, revealBtn];
    if (IS_VIEWER || preview) {
      [...btns, viewSeg].forEach(b => { b.style.display = 'none'; });
      return;
    }

    viewSeg.style.display = t === 'open' && p === 'results' && cfg.model ? 'inline-flex' : 'none';
    viewWall.classList.toggle('is-active', S.view === 'wall');
    viewSum .classList.toggle('is-active', S.view === 'summary');

    const canReveal = (isChoiceLike(t) && S.correct != null) || (t === 'numeric' && S.answer != null);
    const min       = parseInt(cfg.minResponses, 10) || 1;
    const tooFew    = t === 'open' && S.total < min;

    startBtn.style.display  = p === 'idle' ? 'inline-flex' : 'none';
    closeBtn.style.display  = p === 'idle' ? 'none' : 'inline-flex';
    showBtn.style.display   = p === 'idle' ? 'none' : 'inline-flex';
    revealBtn.style.display = canReveal ? 'inline-flex' : 'none';

    closeBtn.disabled = p !== 'collect' || tooFew;
    closeBtn.title    = tooFew ? `Needs ${plural(min, 'response', 'responses')}` : '';
    closeBtn.textContent = p === 'collect' ? 'Close' : 'Closed';

    showBtn.disabled    = p === 'collect';
    showBtn.textContent = p === 'results' ? 'Hide results' : 'Show results';

    revealBtn.disabled    = p !== 'results';
    revealBtn.textContent = S.revealed ? 'Hide answer' : 'Reveal answer';

    // Exactly one filled button: whatever comes next.
    const next = p === 'idle' ? startBtn
               : p === 'collect' ? closeBtn
               : p === 'closed' ? showBtn
               : canReveal && !S.revealed ? revealBtn : null;
    btns.forEach(b => b.classList.toggle('bw-btn--primary', b === next && !b.disabled));
  }

  // ── Choice / true-false rows ────────────────────────────────────────────────
  // Rows are built once per option list and then only updated, so the bars
  // animate from their last width instead of redrawing from zero.
  let choicesKey = null, choiceRows = [];
  function renderChoices(D, showData) {
    const key = JSON.stringify([D.type, D.options]);
    let fresh = false;
    if (key !== choicesKey) {
      choicesKey = key; fresh = true;
      choicesEl.textContent = '';
      choicesEl.classList.toggle('is-tf', D.type === 'truefalse');
      choiceRows = D.options.map((opt, i) => {
        const li    = document.createElement('li');   li.className = 'choice';
        const badge = document.createElement('span'); badge.className = 'badge';
        const body  = document.createElement('div');  body.className = 'choice-body';
        const label = document.createElement('div');  label.className = 'choice-label bw-md';
        const fig   = document.createElement('div');  fig.className = 'figure';
        const pct   = document.createElement('span'); pct.className = 'pct';
        const votes = document.createElement('span'); votes.className = 'votes';
        body.appendChild(label);
        fig.appendChild(pct); fig.appendChild(votes);
        li.appendChild(badge); li.appendChild(body); li.appendChild(fig);
        choicesEl.appendChild(li);
        pct.textContent = '0%'; pct._v = 0;
        return { li, badge, label, pct, votes, i };
      });
    }
    choiceRows.forEach(r => setMd(r.label, D.options[r.i]));   // cached; KaTeX may arrive late

    choicesEl.classList.toggle('show-results', showData);
    const share  = shares(D);
    const reveal = D.revealed && D.correct != null;

    layoutChoices(showData);

    choiceRows.forEach(r => {
      const n  = share.counts[r.i];
      const ok = reveal && D.correct === r.i;
      r.li.classList.toggle('is-lead',    showData && !reveal && share.total > 0 && n === share.max);
      r.li.classList.toggle('is-correct', ok);
      r.li.classList.toggle('is-dim',     reveal && !ok);
      if (ok) r.badge.innerHTML = CHECK_SVG; else r.badge.textContent = letter(r.i);
      // The badge doubles as the pie's key: same letter, same ink.
      r.badge.className = 'badge' + (showData ? ' s' + share.shade[r.i] : '');
      r.votes.textContent = plural(n, 'vote', 'votes');
      countTo(r.pct, showData ? share.pct[r.i] : 0, '%');
    });
  }

  // How many columns the answers should run in. Measured, not guessed: the
  // widest answer that still fits on one line decides it, and if the block is
  // then too tall for the space left under the question, it takes another
  // column and tries again. Re-run on resize and when the percentages appear,
  // since both change what fits.
  let _measure = null;
  function layoutChoices(showData) {
    const n = choiceRows.length;
    if (!n) return;
    const set = c => { choicesEl.style.gridTemplateColumns = `repeat(${c}, minmax(0, 1fr))`; };
    set(1);

    const avail = choicesEl.clientWidth;
    const gap   = parseFloat(getComputedStyle(choicesEl).columnGap) || 0;
    if (!avail) return;

    // What one answer needs beside its text: badge, padding, and the
    // percentage column once the results are up.
    const r0    = choiceRows[0];
    const chrome = Math.max(0, r0.li.getBoundingClientRect().width - r0.label.getBoundingClientRect().width);

    const cs   = getComputedStyle(r0.label);
    _measure   = _measure || document.createElement('canvas').getContext('2d');
    _measure.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const widest = Math.max(...choiceRows.map(r => _measure.measureText(r.label.textContent || '').width));

    // The most columns whose share of the width still fits the longest answer
    // on one line. `slack` above 1 accepts an answer that wraps, which is worth
    // it when it turns a four-deep stack into two rows.
    const fits = (c, slack) => (avail - gap * (c - 1)) / c >= widest / slack + chrome + 2;
    let cols = 1;
    for (let c = n; c >= 1; c--) if (fits(c, 1)) { cols = c; break; }
    if (Math.ceil(n / cols) > 2) {
      for (let c = n; c > cols; c--) {
        if (Math.ceil(n / c) <= 2 && fits(c, 1.3)) { cols = c; break; }
      }
    }
    // Even up the block: six answers that fit four across read better as 3 × 2
    // than as a row of four and a row of two.
    cols = Math.ceil(n / Math.ceil(n / cols));
    set(cols);

    // Still taller than the room left under the question? Trade line breaks
    // for rows until it fits, or until every answer has its own column.
    const room = promptEl.getBoundingClientRect().bottom - choicesEl.getBoundingClientRect().top;
    while (cols < n && choicesEl.scrollHeight > room + 1) { set(++cols); }
  }

  // Counts, percentages and the shade each option draws — the pie and the
  // answer rows both read from this, so they can't disagree.
  function shares(D) {
    const counts = D.options.map((_, i) => D.votes[letter(i)] || 0);
    const total  = counts.reduce((a, b) => a + b, 0);
    const max    = Math.max(0, ...counts);
    const pct    = counts.map(n => (total ? Math.round(n / total * 100) : 0));
    // Darkest ink to the most popular answer, ties broken by order.
    const rank   = counts.map((_, i) => i).sort((a, b) => counts[b] - counts[a] || a - b);
    const shade  = [];
    rank.forEach((i, k) => { shade[i] = Math.min(5, k); });
    return { counts, total, max, pct, shade };
  }

  // ── Headline numbers ────────────────────────────────────────────────────────
  function renderStats(items) {
    statsEl.textContent = '';
    for (const it of items) {
      const s = document.createElement('div');
      s.className = 'stat' + (it.minor ? ' is-minor' : '') + (it.answer ? ' is-answer' : '');
      const v = document.createElement('div'); v.className = 'stat-v';
      v.textContent = it.value;
      if (it.small) { const sm = document.createElement('small'); sm.textContent = it.small; v.appendChild(sm); }
      const l = document.createElement('div'); l.className = 'bw-hint'; l.textContent = it.label;
      s.appendChild(v); s.appendChild(l);
      statsEl.appendChild(s);
    }
  }

  // ── Column chart (rating + numeric) ─────────────────────────────────────────
  // Columns are keyed by their labels and reused while those stay the same, so
  // new votes grow the bars rather than rebuilding them.
  let histKey = null, histCols = [];
  function renderColumns(bins, ends) {
    const key = JSON.stringify(bins.map(b => b.label));
    let fresh = false;
    if (key !== histKey) {
      histKey = key; fresh = true;
      histCols.forEach(c => c.col.remove());
      axisEl.textContent = '';
      const every = bins.length > 10 ? 2 : 1;
      histCols = bins.map((b, i) => {
        const col = document.createElement('div'); col.className = 'hcol';
        const bar = document.createElement('div'); bar.className = 'hbar';
        const n   = document.createElement('div'); n.className = 'hn';
        col.appendChild(bar); col.appendChild(n);
        plotEl.insertBefore(col, markerEl);
        const lab = document.createElement('div'); lab.className = 'hlab';
        lab.textContent = i % every === 0 ? b.label : '';
        axisEl.appendChild(lab);
        return { col, bar, n };
      });
    }
    const max = Math.max(1, ...bins.map(b => b.n));
    bins.forEach((b, i) => {
      const c = histCols[i];
      const h = b.n ? Math.max(2, (b.n / max) * 84) : 0;   // headroom for the count
      const apply = () => { c.bar.style.height = h + '%'; c.n.style.bottom = `calc(${h}% + 4px)`; };
      if (fresh) requestAnimationFrame(() => requestAnimationFrame(apply)); else apply();
      c.n.textContent = b.n || '';
      c.col.classList.toggle('is-top', !!b.top);
      c.col.classList.toggle('is-hit', !!b.hit);
    });
    endsEl.textContent = '';
    if (ends && (ends[0] || ends[1])) {
      const a = document.createElement('span'); a.textContent = ends[0] || '';
      const z = document.createElement('span'); z.textContent = ends[1] || '';
      endsEl.appendChild(a); endsEl.appendChild(z);
    }
  }

  function renderRating(D) {
    const { min, max, low, high } = D.scale;
    let n = 0, sum = 0, top = 0;
    for (let v = min; v <= max; v++) {
      const c = D.ratings[v] || 0;
      n += c; sum += c * v; top = Math.max(top, c);
    }
    const avg  = n ? sum / n : null;
    const mode = [];
    for (let v = min; v <= max; v++) if (top && (D.ratings[v] || 0) === top) mode.push(v);
    renderStats([
      { value: avg == null ? '–' : avg.toFixed(1), small: `/ ${max}`, label: 'Average' },
      { value: mode.length ? mode.join(', ') : '–', label: mode.length > 1 ? 'Most common (tied)' : 'Most common', minor: true },
    ]);
    const bins = [];
    for (let v = min; v <= max; v++) {
      const c = D.ratings[v] || 0;
      bins.push({ label: String(v), n: c, top: top > 0 && c === top });
    }
    markerEl.style.display = 'none';
    chartEl.classList.remove('is-edges');
    renderColumns(bins, [low, high]);
  }

  function renderNumeric(D) {
    const xs = D.nums.slice().sort((a, b) => a - b);
    const u  = D.unit ? ' ' + D.unit : '';
    const reveal = D.revealed && D.answer != null;
    const stats = [
      { value: fmtNum(quantile(xs, 0.5)), small: D.unit, label: 'Median' },
      { value: xs.length ? fmtNum(xs.reduce((a, b) => a + b, 0) / xs.length) : '–', label: 'Mean', minor: true },
      { value: xs.length ? `${fmtNum(xs[0])} – ${fmtNum(xs[xs.length - 1])}` : '–', label: 'Range', minor: true },
    ];
    let closest = null;
    if (reveal && xs.length) {
      closest = xs.reduce((b, x) => Math.abs(x - D.answer) < Math.abs(b - D.answer) ? x : b, xs[0]);
      stats.unshift({ value: fmtNum(D.answer), small: D.unit, label: 'Actual', answer: true });
      stats.push({ value: fmtNum(closest), label: 'Closest guess', minor: true });
    }
    renderStats(stats);

    if (!xs.length) { renderColumns([], null); markerEl.style.display = 'none'; return; }

    // Bin inside Tukey's fences (1.5 × IQR past the quartiles), so one joke
    // answer of 10^9 doesn't squash everyone else into a single bar. Outliers
    // still count — they're clamped into the end bins, and the axis says so.
    const q1 = quantile(xs, 0.25), q3 = quantile(xs, 0.75), iqr = q3 - q1;
    let lo = xs.length >= 5 ? Math.max(xs[0], q1 - 1.5 * iqr) : xs[0];
    let hi = xs.length >= 5 ? Math.min(xs[xs.length - 1], q3 + 1.5 * iqr) : xs[xs.length - 1];
    if (reveal) { lo = Math.min(lo, D.answer); hi = Math.max(hi, D.answer); }
    if (hi === lo) { lo -= 1; hi += 1; }
    const step  = niceStep((hi - lo) / 10);
    const start = Math.floor(lo / step) * step;
    const count = Math.min(40, Math.floor((hi - start) / step + 1e-9) + 1);   // hi lands in the last bin
    const bins  = Array.from({ length: count }, (_, i) => ({ label: fmtNum(start + i * step), n: 0 }));
    for (const x of xs) bins[Math.min(count - 1, Math.max(0, Math.floor((x - start) / step)))].n++;
    const top = Math.max(...bins.map(b => b.n));
    bins.forEach(b => { b.top = !reveal && b.n === top; });
    if (reveal) bins[Math.min(count - 1, Math.max(0, Math.floor((D.answer - start) / step)))].hit = true;
    const below = xs.filter(x => x < start).length;
    const above = xs.filter(x => x >= start + count * step).length;
    chartEl.classList.add('is-edges');
    renderColumns(bins, [
      below ? `${plural(below, 'answer', 'answers')} below ${fmtNum(start)} counted in the first bar` : '',
      above ? `${plural(above, 'answer', 'answers')} above ${fmtNum(start + count * step)} counted in the last bar` : '',
    ]);

    markerEl.style.display = reveal ? 'block' : 'none';
    if (reveal) {
      const f = Math.min(1, Math.max(0, (D.answer - start) / (count * step)));
      markerEl.style.left = (f * 100) + '%';
      markerEl.classList.toggle('flip', f > 0.7);
      markerLabel.textContent = 'Actual ' + fmtNum(D.answer) + u;
    }
  }

  // ── Word cloud ──────────────────────────────────────────────────────────────
  // Laid out by the browser (flex-wrap, centred) rather than on a canvas, so
  // it's crisp at any size, takes the deck's font and theme, and new words
  // can animate in. The biggest words are dealt into the middle.
  let cloudEls = new Map();
  function renderCloud(D) {
    const list = D.cloud.slice().sort((a, b) => b.n - a.n || a.text.localeCompare(b.text)).slice(0, CAP.words);
    cloudEmpty.style.display = list.length ? 'none' : 'block';
    const max  = Math.max(1, ...list.map(w => w.n));
    const minPx = 16, maxPx = list.length > 40 ? 48 : 64;

    const order = [];
    list.forEach((w, i) => { if (i % 2) order.push(w); else order.unshift(w); });

    const keep = new Set(list.map(w => w.text));
    for (const [k, el] of cloudEls) if (!keep.has(k)) { el.remove(); cloudEls.delete(k); }

    order.forEach((w, rank) => {
      let el = cloudEls.get(w.text);
      if (!el) {
        el = document.createElement('span');
        el.className = 'word' + (D.phase === 'collect' || cloudEls.size ? ' is-new' : '');
        el.textContent = w.text;
        el.addEventListener('animationend', () => el.classList.remove('is-new'), { once: true });
        cloudEls.set(w.text, el);
      }
      // One-off words sit at the floor; size and ink climb with agreement.
      const k  = max > 1 ? Math.pow((w.n - 1) / (max - 1), 0.8) : 0.5;
      el.style.fontSize = `calc(${Math.round(minPx + (maxPx - minPx) * k)}px * var(--u) * var(--ck, 1))`;
      el.style.opacity  = (0.5 + 0.5 * k).toFixed(2);
      el.title = plural(w.n, 'response', 'responses');
      cloudInner.appendChild(el);    // re-appending moves it into order
    });
    fitCloud();
  }

  // Shrink the whole cloud until it fits the space it has, rather than
  // clipping the words that wrapped past the edge.
  function fitCloud() {
    let k = 1;
    cloudInner.style.setProperty('--ck', '1');
    const room = () => cloudEl.clientHeight - 8;
    if (!room()) return;
    for (let i = 0; i < 14 && cloudInner.offsetHeight > room(); i++) {
      k *= 0.9;
      cloudInner.style.setProperty('--ck', k.toFixed(3));
    }
  }
  window.addEventListener('resize', () => { if (cloudEl.style.display !== 'none') fitCloud(); });

  // ── Fill in the blanks ──────────────────────────────────────────────────────
  // While the room is answering, the template stands on the slide with its
  // blanks empty. Once the results are up, the same template replays one
  // student's answers at a time — the arrows step through the class.
  function renderFill(D, showData) {
    const parts   = String(D.template || '').split(BLANK_RE);
    const answers = showData ? (D.fills[D.fillIdx] || []) : [];
    fillTpl.textContent = '';
    parts.forEach((part, i) => {
      fillTpl.appendChild(document.createTextNode(part));
      if (i >= parts.length - 1) return;
      const b = document.createElement('span');
      const a = answers[i];
      b.className = 'blank' + (a ? ' is-filled' : '');
      b.textContent = a || '';
      fillTpl.appendChild(b);
    });

    const n = D.fills.length;
    $('fill-foot').style.display = showData ? 'flex' : 'none';
    if (!showData) return;
    fillPos.textContent = n ? `${D.fillIdx + 1} / ${n}` : '0 / 0';
    $('fill-prev').disabled = D.fillIdx <= 0;
    $('fill-next').disabled = D.fillIdx >= n - 1;
    ['fill-prev', 'fill-next'].forEach(id => { $(id).style.display = IS_VIEWER ? 'none' : ''; });

    // What the class settled on, blank by blank — the one thing a stepper
    // can't show on its own.
    const blanks = parts.length - 1;
    const bits = [];
    for (let k = 0; k < Math.min(blanks, 6); k++) {
      const tally = new Map();
      D.fills.forEach(f => {
        const v = (f[k] || '').trim();
        if (v) tally.set(v, (tally.get(v) || 0) + 1);
      });
      if (!tally.size) continue;
      const [best, count] = [...tally].sort((a, b) => b[1] - a[1])[0];
      bits.push(`${k + 1}: ${best} (${Math.round(count / n * 100)}%)`);
    }
    fillStats.textContent = bits.length ? 'most common — ' + bits.join('  ·  ') : '';
  }

  function stepFill(d) {
    if (IS_VIEWER || S.phase !== 'results') return;
    const i = Math.max(0, Math.min(S.fills.length - 1, S.fillIdx + d));
    if (i !== S.fillIdx) { S.fillIdx = i; render(); emitState(); }
  }

  // ── Response wall (open-ended) ──────────────────────────────────────────────
  // Cards are appended as responses arrive and never rebuilt, so only the new
  // ones animate in and a card being read doesn't jump.
  let wallCards = [];
  function renderWall(D) {
    const g = D.groups;
    if (g.length < wallCards.length ||
        (wallCards.length && wallCards[0].text !== g[0]?.text)) {
      wallCards.forEach(c => c.el.remove());
      wallCards = [];
    }
    const animate = wallCards.length > 0 || D.phase === 'collect';
    for (let i = 0; i < g.length; i++) {
      let c = wallCards[i];
      if (!c) {
        const el = document.createElement('div');
        el.className = 'resp' + (animate ? ' is-new' : '');
        const t  = document.createElement('span');
        const x  = document.createElement('span'); x.className = 'times';
        t.textContent = g[i].text;
        el.appendChild(t); el.appendChild(x);
        el.addEventListener('click', () => openSpotlight(i));
        el.addEventListener('animationend', () => el.classList.remove('is-new'), { once: true });
        wallEl.appendChild(el);
        c = wallCards[i] = { el, times: x, text: g[i].text, n: -1 };
      }
      if (c.n !== g[i].n) {
        c.n = g[i].n;
        c.times.textContent = '×' + c.n;
        c.times.style.display = c.n > 1 ? 'inline-block' : 'none';
        c.el.classList.toggle('is-many', c.n > 1);
      }
    }
    wallEmpty.style.display = g.length ? 'none' : 'block';
  }

  let lastTally = 0;
  function renderJoin(D, preview) {
    if (preview || S.phase !== 'collect') return;
    if (qrEl.dataset.url !== S.joinUrl) {
      qrEl.textContent = '';
      qrEl.dataset.url = S.joinUrl;
      if (S.joinUrl && typeof QRCode !== 'undefined') {
        new QRCode(qrEl, { text: S.joinUrl, width: 320, height: 320,
                           colorDark: '#1a1a18', colorLight: '#ffffff' });
      }
    }
  }

  function renderSpotlight(D) {
    const g  = D.groups[D.spotlight];
    const on = D.type === 'open' && !!g;
    spotEl.classList.toggle('is-open', on);
    if (!on) return;
    spotText.textContent  = g.text;
    spotCount.textContent = g.n > 1 ? `${g.n} people said this` : '';
    spotPos.textContent   = `${D.spotlight + 1} / ${D.groups.length}`;
    ['spot-prev', 'spot-next', 'spot-close'].forEach(id => { $(id).style.display = IS_VIEWER ? 'none' : ''; });
    $('spot-prev').disabled = D.spotlight === 0;
    $('spot-next').disabled = D.spotlight >= D.groups.length - 1;
  }

  function renderSummary(D) {
    const list = D.summaries?.summaries || [];
    sumBusy.style.display = S.sumBusy ? 'flex' : 'none';
    const show = !S.sumBusy && (list.length || S.sumError);
    sumCard.style.display = show ? 'block' : 'none';
    sumNav.style.display  = !S.sumBusy && list.length > 1 ? 'flex' : 'none';
    if (!show) return;

    if (S.sumError) {
      sumText.textContent = S.sumError;
      sumMeter.style.width = '0%';
      sumMeta.textContent = '';
      return;
    }
    const i   = Math.min(D.sIdx, list.length - 1);
    const s   = list[i];
    const tot = D.summaries.num_responses || D.total || 1;
    sumText.textContent  = s.summary;
    sumMeter.style.width = Math.round(Math.min(1, s.num_respondents / tot) * 100) + '%';
    sumMeta.textContent  = `${plural(s.num_respondents, 'respondent', 'respondents')} of ${tot}`;
    sumDots.textContent  = '';
    list.forEach((_, k) => {
      const d = document.createElement('span');
      if (k === i) d.className = 'is-on';
      sumDots.appendChild(d);
    });
    $('sum-prev').disabled = i === 0;
    $('sum-next').disabled = i === list.length - 1;
    $('sum-prev').style.visibility = $('sum-next').style.visibility = IS_VIEWER ? 'hidden' : '';
  }

  // ── Server ──────────────────────────────────────────────────────────────────
  function resetPoll() {
    stopPolling();
    Object.assign(S, {
      phase: 'idle', surveyId: null, joinUrl: '', responses: [], total: 0,
      votes: {}, ratings: {}, nums: [], cloud: [], groups: [], fills: [], fillIdx: 0,
      revealed: false, view: 'wall', summaries: null,
      sIdx: 0, sumBusy: false, sumError: '', spotlight: -1, error: '',
    });
    lastTally = 0;
  }

  function closeOnServer(sid) {
    if (sid) fetch(`${serverUrl()}/api/survey/${sid}/close`, { method: 'POST' }).catch(() => {});
  }

  // What the phone page needs to draw the right input for this type.
  function createBody() {
    // A fill-in-the-blanks question often has no prose at all — the template
    // is the question — so the phone gets something sensible to head it with.
    const body = { question: S.question || (S.type === 'fill' ? 'Fill in the blanks' : ''), kind: S.type, model: null };
    if (isChoiceLike(S.type)) body.options = S.options;
    if (S.type === 'rating')    body.meta = { ...S.scale };
    if (S.type === 'numeric')   body.meta = { unit: S.unit };
    if (S.type === 'wordcloud') body.meta = { words: S.words };
    if (S.type === 'fill')      body.meta = { template: S.template };
    if (S.type === 'open') {
      body.model         = cfg.model || null;
      body.num_summaries = parseInt(cfg.numSummaries, 10) || 3;
      if (cfg.apiKey) body.api_key = cfg.apiKey;
    }
    return body;
  }

  async function startPoll() {
    if (IS_VIEWER || !ready()) return;
    const token = ++startToken;
    stopPolling();
    try {
      const res  = await fetch(`${serverUrl()}/api/survey/create`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(createBody()),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      if (token !== startToken) { closeOnServer(data.survey_id); return; }   // superseded
      resetPoll();
      S.surveyId = data.survey_id;
      // data.url is root-relative (/s/<id>/mcq/<sid>); the audience needs the
      // public origin in front of it.
      S.joinUrl  = publicOrigin() + data.url;
      S.phase    = 'collect';
      pollTimer  = setInterval(fetchResponses, POLL_MS);
      render(); emitState();
    } catch (e) {
      if (token !== startToken) return;
      S.error = `Couldn't open the poll — ${e.message || 'server unreachable'}.`;
      render();
    }
  }

  function fetchResponses() {
    if (inflight) return inflight;
    const sid = S.surveyId;
    if (!sid) return Promise.resolve();
    inflight = (async () => {
      try {
        const res = await fetch(`${serverUrl()}/api/survey/${sid}/responses?after=${S.responses.length}`);
        if (!res.ok) return;
        const data = await res.json();
        if (sid !== S.surveyId) return;
        // The server restarted under us: its list is shorter than ours. Start over.
        if (typeof data.total === 'number' && data.total < S.responses.length) {
          S.responses = []; recompute(); render(); emitState();
          return;
        }
        if (data.responses?.length) {
          S.responses.push(...data.responses);
          recompute(); render(); emitState();
        }
      } catch (_) { /* transient — the next tick retries */ }
      finally { inflight = null; }
    })();
    return inflight;
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  async function closePoll() {
    if (IS_VIEWER || S.phase !== 'collect') return;
    stopPolling();
    await fetchResponses();
    await fetchResponses();   // the first may have been one already in flight
    closeOnServer(S.surveyId);
    // Closing only stops the answers coming in; the results go up when the
    // presenter asks for them.
    S.phase = 'closed'; S.view = 'wall'; S.spotlight = -1;
    render(); emitState();
  }

  async function loadSummary() {
    if (IS_VIEWER || S.sumBusy || S.summaries || !S.surveyId) return;
    S.sumBusy = true; S.sumError = ''; render();
    try {
      const res  = await fetch(`${serverUrl()}/api/survey/${S.surveyId}/analyze`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      S.summaries = data; S.sIdx = 0;
    } catch (e) {
      S.sumError = `Couldn't summarise: ${e.message}`;
    } finally {
      S.sumBusy = false; render(); emitState();
    }
  }

  // ── Actions ─────────────────────────────────────────────────────────────────
  function toggleResults() {
    if (IS_VIEWER || S.phase === 'idle' || S.phase === 'collect') return;
    S.phase = S.phase === 'results' ? 'closed' : 'results';
    S.spotlight = -1;
    render(); emitState();
  }

  function toggleReveal() {
    if (IS_VIEWER || S.phase !== 'results') return;
    S.revealed = !S.revealed;
    render(); emitState();
  }

  function setView(v) {
    if (IS_VIEWER || S.view === v) return;
    S.view = v; S.spotlight = -1;
    render(); emitState();
    if (v === 'summary') loadSummary();
  }

  function openSpotlight(i) {
    if (IS_VIEWER || !ready() || S.phase !== 'results') return;
    S.spotlight = i; render(); emitState();
  }
  function stepSpotlight(d) {
    if (IS_VIEWER || S.spotlight < 0) return;
    const n = Math.max(0, Math.min(S.groups.length - 1, S.spotlight + d));
    if (n !== S.spotlight) { S.spotlight = n; render(); emitState(); }
  }
  function closeSpotlight() {
    if (IS_VIEWER || S.spotlight < 0) return;
    S.spotlight = -1; render(); emitState();
  }

  function stepSummary(d) {
    const n = S.summaries?.summaries?.length || 0;
    if (IS_VIEWER || !n) return;
    const i = Math.max(0, Math.min(n - 1, S.sIdx + d));
    if (i !== S.sIdx) { S.sIdx = i; render(); emitState(); }
  }

  // Host reset: close the current poll and open a fresh one with a new QR code,
  // so old responses don't carry over.
  function restartPoll() {
    if (IS_VIEWER) return;
    closeOnServer(S.phase === 'collect' ? S.surveyId : null);
    resetPoll(); render(); emitState();
    startPoll();
  }

  // ── Socket.IO sync ──────────────────────────────────────────────────────────
  // Presenter emits, viewers apply. The presenter also joins the session room
  // to hear `survey_response` pushes, which make new answers land in well under
  // the 3s poll; the poll stays as the fallback.
  let socket = null, socketUrlInUse = null, syncTimer = null;

  function initSocket(url) {
    url = url || (window.BeamerWidget ? BeamerWidget.serverOrigin() : '');
    if (!url || url === socketUrlInUse) return;
    socketUrlInUse = url;
    if (typeof io === 'undefined') { socket = { emit() {}, on() {} }; return; }
    try {
      const prev = socket;
      socket = io(url, { transports: ['websocket', 'polling'] });
      if (prev && prev.disconnect) prev.disconnect();
      socket.on('connect', () => {
        if (!IS_VIEWER) socket.emit('join_presenter', { session_id: cfg.sessionId });
      });
      socket.on('widget_state', data => {
        if (!IS_VIEWER || data?.widgetId !== WIDGET_ID) return;
        applyState(data.state || {});
      });
      socket.on('survey_response', data => {
        if (IS_VIEWER || !S.surveyId || data?.survey_id !== S.surveyId) return;
        fetchResponses();
      });
    } catch (_) {
      socket = { emit() {}, on() {} };
    }
  }

  function emitState() {
    if (!socket || IS_VIEWER) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => {
      socket.emit('widget_state', { widgetId: WIDGET_ID, session_id: cfg.sessionId, state: getState() });
    }, 150);
  }

  // ── State serialisation ─────────────────────────────────────────────────────
  // One shape for live sync and for the host's park/restore, so a restored
  // slide looks exactly like a synced viewer.
  function getState() {
    return {
      type: S.type, question: S.question, options: S.options, correct: S.correct,
      scale: S.scale, unit: S.unit, answer: S.answer, words: S.words,
      template: S.template, fills: S.fills.slice(0, CAP.groups), fillIdx: S.fillIdx,
      phase: S.phase, surveyId: S.surveyId, joinUrl: S.joinUrl, total: S.total,
      votes: S.votes, ratings: S.ratings,
      nums: S.nums.slice(-CAP.nums),
      cloud: S.cloud.slice().sort((a, b) => b.n - a.n).slice(0, CAP.words),
      groups: S.groups.slice(0, CAP.groups),
      revealed: S.revealed, view: S.view,
      summaries: S.summaries, sIdx: S.sIdx, spotlight: S.spotlight,
    };
  }

  function pollIdentity(type, question, options, scale, unit, words, template) {
    return JSON.stringify([type, question, options || [], type === 'rating' ? scale : null,
                           type === 'numeric' ? unit : null, type === 'wordcloud' ? words : null,
                           type === 'fill' ? template || '' : null]);
  }

  function applyState(s) {
    if (!s || typeof s !== 'object') return;

    if (!IS_VIEWER) {
      // Presenter restore (the host re-sends saved state after a reload). Only
      // adopt a poll for the same question; a changed question means a new one.
      if (!s.surveyId || s.surveyId === S.surveyId) return;
      if (pollIdentity(s.type, s.question, s.options, s.scale, s.unit, s.words, s.template) !== pollKey) return;
      startToken++;            // drop the auto-start that's racing this restore
      stopPolling();
    }

    S.type      = TYPES[s.type] ? s.type : 'choice';
    S.question  = s.question || '';
    S.options   = Array.isArray(s.options) ? s.options : [];
    S.correct   = s.correct ?? null;
    S.scale     = s.scale && typeof s.scale === 'object' ? { ...S.scale, ...s.scale } : S.scale;
    S.unit      = s.unit || '';
    S.answer    = Number.isFinite(s.answer) ? s.answer : null;
    S.words     = s.words || 1;
    S.template  = s.template || '';
    S.fills     = Array.isArray(s.fills) ? s.fills : [];
    S.fillIdx   = s.fillIdx || 0;
    S.phase     = ['idle', 'collect', 'closed', 'results'].includes(s.phase) ? s.phase : 'idle';
    S.surveyId  = s.surveyId || null;
    S.joinUrl   = s.joinUrl || '';
    S.total     = s.total || 0;
    S.votes     = s.votes || {};
    S.ratings   = s.ratings || {};
    S.nums      = Array.isArray(s.nums) ? s.nums : [];
    S.cloud     = Array.isArray(s.cloud) ? s.cloud : [];
    S.groups    = Array.isArray(s.groups) ? s.groups : [];
    S.revealed  = !!s.revealed;
    S.view      = s.view === 'summary' ? 'summary' : 'wall';
    S.summaries = s.summaries || null;
    S.sIdx      = s.sIdx || 0;
    S.spotlight = Number.isInteger(s.spotlight) ? s.spotlight : -1;

    if (!IS_VIEWER && S.phase === 'collect') {
      // Resume the live poll: refetch everything, then keep polling.
      S.responses = [];
      fetchResponses();
      pollTimer = setInterval(fetchResponses, POLL_MS);
    }
    render();
  }

  // ── Config ──────────────────────────────────────────────────────────────────
  function applyConfig(c) {
    if (!c) return;
    cfg       = { ...cfg, ...c };
    WIDGET_ID = cfg.id || cfg.widgetId || WIDGET_ID;
    IS_VIEWER = cfg.role === 'viewer' || IS_VIEWER;

    initSocket(cfg.socketUrl);
    if (IS_VIEWER) { render(); return; }

    S.type     = TYPES[cfg.responseType] ? cfg.responseType : 'choice';
    S.question = String(cfg.question || '').trim();

    S.options = S.type === 'choice' ? normaliseOptions(cfg.options)
              : S.type === 'truefalse' ? ['True', 'False'] : [];
    if (S.type === 'choice') {
      const ca = parseInt(cfg.correctAnswer, 10);
      S.correct = ca >= 1 && ca <= S.options.length ? ca - 1 : null;
    } else if (S.type === 'truefalse') {
      S.correct = cfg.correctTF === 'true' ? 0 : cfg.correctTF === 'false' ? 1 : null;
    } else {
      S.correct = null;
    }

    const max = Math.min(10, Math.max(2, parseInt(cfg.ratingMax, 10) || 5));
    S.scale  = { min: 1, max, low: String(cfg.ratingLow || '').trim(), high: String(cfg.ratingHigh || '').trim() };
    const ans = cfg.numericAnswer === '' || cfg.numericAnswer == null ? NaN : Number(cfg.numericAnswer);
    S.answer = Number.isFinite(ans) ? ans : null;
    S.unit   = String(cfg.numericUnit || '').trim();
    S.words  = Math.min(3, Math.max(1, parseInt(cfg.wordsPerResponse, 10) || 1));
    S.template = S.type === 'fill' ? String(cfg.template || '') : '';

    const canReveal = S.correct != null || (S.type === 'numeric' && S.answer != null);
    if (!canReveal) S.revealed = false;

    const key = pollIdentity(S.type, S.question, S.options, S.scale, S.unit, S.words, S.template);
    if (key !== pollKey) {
      pollKey = key;
      startToken++;
      closeOnServer(S.phase === 'collect' ? S.surveyId : null);
      resetPoll();
      if (ready() && cfg.autoStart !== false) startPoll();
    } else if (S.phase !== 'idle') {
      recompute();   // e.g. the words-per-response setting changes the tallies
    }
    render(); emitState();
  }

  function destroy() {
    stopPolling();
    startToken++;
    clearTimeout(syncTimer);
    if (socket && socket.disconnect) socket.disconnect();
    socket = null; socketUrlInUse = null;
  }

  // ── Beamer+ message bridge ──────────────────────────────────────────────────
  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === 'widget-config')  applyConfig(d.config);
    if (d.type === 'widget-cleanup') destroy();
    if (d.type === 'widget-get-state') {
      window.parent.postMessage({ type: 'widget-state', widgetId: WIDGET_ID, state: getState() }, '*');
    }
    if (d.type === 'widget-set-state' && d.state) applyState(d.state);
  });

  // ── Event wiring ────────────────────────────────────────────────────────────
  startBtn  .addEventListener('click', () => startPoll());
  closeBtn  .addEventListener('click', closePoll);
  showBtn   .addEventListener('click', toggleResults);
  revealBtn .addEventListener('click', toggleReveal);
  viewWall  .addEventListener('click', () => setView('wall'));
  viewSum   .addEventListener('click', () => setView('summary'));
  previewBtn.addEventListener('click', () => window.BeamerWidget?.openSettings?.());
  $('fill-prev') .addEventListener('click', () => stepFill(-1));
  $('fill-next') .addEventListener('click', () => stepFill(1));
  $('spot-prev') .addEventListener('click', () => stepSpotlight(-1));
  $('spot-next') .addEventListener('click', () => stepSpotlight(1));
  $('spot-close').addEventListener('click', closeSpotlight);
  $('sum-prev')  .addEventListener('click', () => stepSummary(-1));
  $('sum-next')  .addEventListener('click', () => stepSummary(1));
  spotEl.addEventListener('click', e => { if (e.target === spotEl) closeSpotlight(); });

  document.addEventListener('keydown', e => {
    if (IS_VIEWER) return;
    if (S.spotlight >= 0) {
      if (e.key === 'ArrowLeft')  { e.preventDefault(); stepSpotlight(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); stepSpotlight(1); }
      if (e.key === 'Escape')     { e.preventDefault(); closeSpotlight(); }
    } else if (S.type === 'fill' && S.phase === 'results') {
      if (e.key === 'ArrowLeft')  { e.preventDefault(); stepFill(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); stepFill(1); }
    } else if (S.view === 'summary' && S.phase === 'results') {
      if (e.key === 'ArrowLeft')  { e.preventDefault(); stepSummary(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); stepSummary(1); }
    }
  });

  // KaTeX is deferred; re-render the maths once it has actually arrived.
  window.addEventListener('load', () => render());

  // The slide region can change size (the host's font-size control, a resized
  // widget); what fits in a row changes with it.
  window.addEventListener('resize', () => { if (isChoiceLike(S.type)) render(); });

  // Without this the host's Reset reloads the iframe, and a reloaded page only
  // restarts if the host happens to re-send its config.
  (function hookReset(tries) {
    const tb = window.BeamerWidget?.topbar;
    if (tb?.onReset) { tb.onReset(restartPoll); return; }
    if (tries > 0) setTimeout(() => hookReset(tries - 1), 200);
  })(15);

  // ── Boot ────────────────────────────────────────────────────────────────────
  applyConfig(CFG0);
  render();
})();
</script>
</body>
</html>
