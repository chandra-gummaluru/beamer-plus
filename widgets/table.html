<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style id="bw-base">
/* ============================================================================
   Beamer+ widget base — the shared design language for every widget.

   Injected into every widget iframe ahead of the widget's own <style>, so a
   widget can still override anything, but shouldn't need to: if two widgets
   both draw a toolbar, they should draw the same toolbar.

   What belongs here: tokens, the reset, and any furniture more than one
   widget needs — toolbars, buttons, status pills, inputs, banners, empty and
   loading states. What stays in a widget: whatever is genuinely its own
   (a keypad, a plot, a QR panel).

   ── Presentation scale ──────────────────────────────────────────────────
   These widgets are read from the back of a room, not from a desk. --u is
   the scale for everything the room has to READ; chrome (toolbars, small
   buttons, meta text) is deliberately fixed, so raising the scale makes the
   content bigger without inflating the furniture around it.

   A widget opts in by declaring a `scale` field in its schema — the settings
   kit applies the presenter's choice to --u automatically.
   ========================================================================= */

:root {
  /* Palette — light */
  --bg:         #ffffff;
  --bg-subtle:  #f9f9f8;
  --bg-output:  #fafaf9;
  --border:     #e9e9e6;
  --border-med: #d4d4cf;
  --text:       #1a1a18;
  --text-2:     #6b6b65;
  --text-3:     #aeaea5;
  --accent:     #52524e;
  --accent-bg:  #f0f0ee;
  --on-accent:  #ffffff;

  /* Status */
  --ok:     #15803d;
  --green:  #15803d;
  --warn:   #b45309;
  --amber:  #b45309;
  --err:    #c0392b;
  --red:    #dc2626;
  --err-bg: #fef2f2;

  /* Data colours — for anything a widget draws itself: word clouds, plots,
     result bars. Ordered so the first few carry the most weight, and defined
     for both themes so a canvas can read them instead of hardcoding ink. */
  --chart-1: #1a1a18;
  --chart-2: #3d3d3a;
  --chart-3: #52524e;
  --chart-4: #6b6b65;
  --chart-5: #85857d;
  --chart-6: #9c9c94;

  /* Shape & motion */
  --radius:    6px;
  --radius-lg: 10px;
  --dur:       0.12s;

  /* Type */
  --font-ui:   'DM Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;

  /* Presentation scale — see the note above. */
  --u: 1.4;

  /* Chrome: fixed, whatever --u is. */
  --fs-chrome:    12px;
  --fs-chrome-sm: 11px;
  --fs-title:     13px;

  /* Content: scales with the room. */
  --fs-body:  calc(14px * var(--u));
  --fs-lead:  calc(18px * var(--u));
  --fs-head:  calc(24px * var(--u));
  --fs-code:  calc(13px * var(--u));
  --fs-small: calc(11.5px * var(--u));

  /* Edit mode — yellow, so a widget being set up reads as "being edited",
     not as live content. Yellow is too light to carry text or a thin line on
     white, hence five tokens rather than three:
       --edit       fill (the chosen segment, Done)
       --on-edit    ink on that fill — dark, never white
       --edit-line  outlines and borders, a deeper yellow that still shows
       --edit-soft  wash behind something being typed into
       --edit-ink   text: hints, "+ Add", the type picker */
  --edit:      oklch(86% 0.16 92);
  --on-edit:   oklch(28% 0.05 80);
  --edit-line: oklch(74% 0.16 80);
  --edit-soft: oklch(97% 0.05 98);
  --edit-ink:  oklch(48% 0.11 70);

  /* Furniture metrics — shared so two widgets' toolbars line up. */
  --bar-h:  42px;
  --ctl-h:  28px;
  --pad-x:  14px;

  /* Aliases kept for widgets written against the older names. */
  --font:  var(--font-ui);
  --mono:  var(--font-mono);
  --r:     var(--radius);
  --ink-1: var(--text);
  --ink-2: var(--text-2);
  --ink-3: var(--text-3);
  --ink-4: var(--text-3);
}
/* ── Reset ────────────────────────────────────────────────────────────── */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: var(--fs-chrome);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* The usual widget shape: a fixed bar on top, everything else filling the rest. */
.bw-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* ── Toolbar ──────────────────────────────────────────────────────────── */

.bw-toolbar {
  flex: 0 0 auto;
  height: var(--bar-h);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 var(--pad-x);
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

.bw-toolbar-title {
  font-size: var(--fs-title);
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 240px;
  flex-shrink: 0;
}

.bw-sep {
  width: 1px;
  height: 18px;
  background: var(--border);
  margin: 0 3px;
  flex-shrink: 0;
}

.bw-spacer { flex: 1 1 auto; }

/* ── Buttons ──────────────────────────────────────────────────────────── */

.bw-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: var(--ctl-h);
  padding: 0 11px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: var(--fs-chrome);
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
  transition: background var(--dur), border-color var(--dur), color var(--dur);
}
.bw-btn:hover:not(:disabled) {
  background: var(--bg-subtle);
  border-color: var(--border-med);
}
.bw-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.bw-btn--primary {
  background: var(--text);
  border-color: var(--text);
  color: var(--bg);
}
.bw-btn--primary:hover:not(:disabled) {
  background: var(--text-2);
  border-color: var(--text-2);
}

.bw-btn--quiet {
  border-color: transparent;
  background: none;
  color: var(--text-2);
}
.bw-btn--quiet:hover:not(:disabled) { background: var(--accent-bg); color: var(--text); }

/* Selected member of a toggle group — view switchers, mode pickers. */
.bw-btn.is-active {
  background: var(--text);
  border-color: var(--text);
  color: var(--bg);
}
.bw-btn.is-active:hover:not(:disabled) { background: var(--text-2); border-color: var(--text-2); }

.bw-btn--icon { width: var(--ctl-h); padding: 0; }
.bw-btn svg   { width: 14px; height: 14px; flex-shrink: 0; }

/* ── Status pill ──────────────────────────────────────────────────────── */

.bw-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: var(--fs-chrome-sm);
  color: var(--text-2);
  flex-shrink: 0;
}
.bw-status strong { color: var(--text-2); font-weight: 500; }

.bw-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-3);
  flex-shrink: 0;
  transition: background 0.3s;
}
.bw-dot.is-ready { background: var(--ok); }
.bw-dot.is-warn  { background: var(--warn); }
.bw-dot.is-busy  { background: var(--err); animation: bw-blink 0.9s ease-in-out infinite; }
.bw-dot.is-idle  { background: var(--text-3); }

/* ── Content areas ────────────────────────────────────────────────────── */

.bw-main {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 0;
}

/* A readable measure that grows with the room rather than the viewport. */
.bw-stage {
  max-width: calc(760px * var(--u));
  margin: 0 auto;
  padding: 0 24px;
}

/* Centred single-focus content — a question, a timer, a result. */
.bw-center {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px 24px;
  text-align: center;
}

/* ── Typography helpers ───────────────────────────────────────────────── */

.bw-head  { font-size: var(--fs-head); font-weight: 500; line-height: 1.3; letter-spacing: -0.01em; }
.bw-lead  { font-size: var(--fs-lead); font-weight: 500; line-height: 1.35; }
.bw-body  { font-size: var(--fs-body); line-height: 1.55; }
.bw-small { font-size: var(--fs-small); color: var(--text-2); }
.bw-mono  { font-family: var(--font-mono); }

/* Micro caps label — "scan to respond", "waiting for responses". */
.bw-hint {
  font-size: var(--fs-chrome-sm);
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  user-select: none;
}

/* Markdown-rendered content shouldn't inherit the reset's stripped margins. */
.bw-md p { margin: 0; }
.bw-md p + p { margin-top: 0.6em; }
.bw-md code { font-family: var(--font-mono); font-size: 0.92em; }
.bw-md .katex { font-size: 1em; }

/* ── Form controls ────────────────────────────────────────────────────── */

.bw-input,
.bw-select,
.bw-textarea {
  width: 100%;
  padding: 6px 9px;
  font-family: var(--font-ui);
  font-size: var(--fs-chrome);
  color: var(--text);
  background: var(--bg-subtle);
  border: 1px solid var(--border-med);
  border-radius: var(--radius);
  transition: border-color var(--dur);
}
.bw-input:focus,
.bw-select:focus,
.bw-textarea:focus { outline: none; border-color: var(--accent); }
.bw-textarea { font-family: var(--font-mono); line-height: 1.45; resize: vertical; }

/* ── Card ─────────────────────────────────────────────────────────────── */
/* A block of content set off from the page: a summary, a response, a result. */

.bw-card {
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 15px;
}
.bw-card--lg { padding: 22px 26px; border-radius: var(--radius-lg); }
.bw-card-meta {
  font-family: var(--font-mono);
  font-size: var(--fs-chrome-sm);
  color: var(--text-3);
  margin-top: 8px;
}

/* ── Banner ───────────────────────────────────────────────────────────── */

.bw-banner {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 10px 8px 12px;
  border: 1px solid var(--border-med);
  border-left: 3px solid var(--text-3);
  border-radius: var(--radius);
  background: var(--bg-subtle);
  font-size: var(--fs-chrome);
  line-height: 1.5;
  color: var(--text-2);
}
.bw-banner--warn  { border-left-color: var(--warn); }
.bw-banner--error { border-left-color: var(--err); background: var(--err-bg); }
.bw-banner strong { color: var(--text); font-weight: 600; }
.bw-banner code   { font-family: var(--font-mono); font-size: 0.92em; color: var(--text); }

/* ── Loading & empty states ───────────────────────────────────────────── */

.bw-boot {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 64px 20px;
  color: var(--text-2);
  text-align: center;
}
.bw-boot-msg { font-size: var(--fs-body); }
.bw-boot-sub { font-size: var(--fs-chrome-sm); color: var(--text-3); }

.bw-spinner {
  width: 26px;
  height: 26px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: bw-spin 0.65s linear infinite;
}

.bw-empty {
  font-size: var(--fs-body);
  color: var(--text-2);
  line-height: 1.5;
  text-align: center;
}

/* ── Scrollbars ───────────────────────────────────────────────────────── */

.bw-main::-webkit-scrollbar { width: 10px; height: 10px; }
.bw-main::-webkit-scrollbar-thumb {
  background: var(--border-med);
  border: 3px solid var(--bg);
  border-radius: 5px;
}
.bw-main::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
.bw-main::-webkit-scrollbar-track { background: transparent; }

/* ── Motion ───────────────────────────────────────────────────────────── */

@keyframes bw-spin  { to { transform: rotate(360deg); } }
@keyframes bw-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

@media (prefers-reduced-motion: reduce) {
  .bw-spinner { animation-duration: 2s; }
  .bw-dot.is-busy { animation: none; }
}

/* ── Injected top bar ─────────────────────────────────────────────────────
   Built by the settings kit inside every widget iframe (see
   widget-settings-kit.js), so every widget carries the same bar without
   drawing one itself — title on the left, the widget's own controls next to
   it, shared utilities pinned right.

   The kit also wraps whatever the widget rendered into .bw-topbar-body, so
   the bar can never overlap it. Everything here is chrome: fixed size
   whatever --u is, so raising the presentation scale grows the content and
   leaves the furniture alone.
   ====================================================================== */

body.bw-has-topbar {
  display: flex;
  flex-direction: column;
  padding: 0;
}

.bw-topbar {
  flex: 0 0 auto;
  height: var(--bar-h);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 var(--pad-x);
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  font-size: var(--fs-chrome);
  user-select: none;
  /* A widget with more controls than its box is wide scrolls its bar
     sideways (trackpad, or the mouse wheel — the kit maps it) rather than
     squashing or clipping them. No scrollbar: it would eat the bar. */
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}
.bw-topbar::-webkit-scrollbar { display: none; }
.bw-topbar > * { flex-shrink: 0; }

.bw-topbar-title {
  font-size: var(--fs-title);
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 40%;
  flex-shrink: 0;
}

/* Where a widget's own buttons land (BeamerWidget.topbar.addButton). Takes the
   slack so the utilities stay pinned right however many buttons there are. */
.bw-topbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1 0 auto;
}
.bw-topbar-actions > * { flex-shrink: 0; }

/* Shared utilities — same controls, same place, in every widget. */
.bw-topbar-utils {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 0 0 auto;
}

/* Partial-slide mode (the widget is an inset on part of the slide, set by the
   kit as body.bw-partial): no title and no shared utilities — only the
   widget's own controls stay, as a strip, and with none there's no bar. */
body.bw-partial .bw-topbar-utils {
  display: none;
}

/* The pencil for a widget's own settings when there's no bar to hold it
   (an overlay, or an inset without the utilities): top-right corner, faint,
   and only while the pointer is over the widget, so a box on a content slide
   stays clean. In full view it lives in the bar, always shown. */
.bw-edit-float {
  position: fixed;
  top: 6px;
  right: 6px;
  z-index: 50;
  display: none;
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  opacity: 0;
  transition: opacity 0.15s;
}
body.bw-overlay .bw-edit-float,
body.bw-partial .bw-edit-float { display: inline-flex; }
body.bw-overlay:hover .bw-edit-float,
body.bw-partial:hover .bw-edit-float { opacity: 0.45; }
.bw-edit-float:hover,
.bw-edit-float:focus-visible { opacity: 1; }
.bw-edit-float.bw-btn:hover:not(:disabled) { background: transparent; border-color: transparent; }
@media (hover: none) { .bw-edit-float { opacity: 0.45; } }

/* Widgets no longer show a title in the top-left of their bar.
   The title node stays in the DOM (widgets and setTitle() still write to it)
   but is never drawn, and neither is the separator that used to follow it.
   Matched by class rather than removed in the kit so a widget's own
   .bw-toolbar-title is caught too, adopted or standalone. */
.bw-topbar-title,
.bw-toolbar-title,
.bw-toolbar-title + .bw-sep,
.bw-topbar-actions > .bw-sep:first-child,
.bw-adopted-bar > .bw-topbar-title + .bw-sep {
  display: none !important;
}
body.bw-partial .bw-topbar.bw-topbar--no-controls {
  display: none;
}

/* Overlay mode (body.bw-overlay — the widget's display is "overlay"): a
   small tool laid over part of a slide. No bar at all; the widget shows its
   own simplified view, straight on the slide: no frame around it. */
body.bw-overlay .bw-topbar { display: none !important; }

/* Show a piece of UI in one display only. */
body:not(.bw-overlay) .bw-overlay-only { display: none !important; }
body.bw-overlay .bw-full-only { display: none !important; }

/* Overlay controls: a small cluster of icon buttons, centred along the
   bottom, that appears while the
   pointer is over the widget (or one of them has focus), so the overlay is
   just its content the rest of the time. */
.bw-overlay-controls {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  z-index: 5;
  display: flex;
  gap: 4px;
  padding: 3px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
}
body.bw-overlay:hover .bw-overlay-controls,
.bw-overlay-controls:focus-within {
  opacity: 1;
  pointer-events: auto;
}
.bw-overlay-controls[hidden] { display: none !important; }
.bw-overlay-controls .bw-btn { height: 26px; min-width: 26px; padding: 0 6px; }
.bw-overlay-controls .bw-btn--icon { width: 26px; padding: 0; }
@media (hover: none) {
  .bw-overlay-controls { opacity: 1; pointer-events: auto; }
}

/* The widget's own content, below the bar. */
.bw-topbar-body {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  overflow: hidden;
}

/* ── Edit mode ────────────────────────────────────────────────────────────
   body.bw-editing, set by the kit while a widget is being set up on itself
   (BeamerWidget.edit). The widget's own content is the form: anything marked
   .bw-editable gets a dashed yellow outline, the bar turns yellow along its
   bottom edge, and Edit becomes Done.
   ====================================================================== */

/* Edit / Done: the last thing in the bar, the top-right corner. */
.bw-edit-btn { gap: 6px; }
body.bw-editing .bw-edit-btn.bw-btn--primary {
  background: var(--edit); border-color: var(--edit-line); color: var(--on-edit);
}
body.bw-editing .bw-edit-btn.bw-btn--primary:hover:not(:disabled) {
  background: var(--edit-line); border-color: var(--edit-line); color: var(--on-edit);
}
body.bw-editing .bw-topbar {
  border-bottom-color: var(--edit-line);
  box-shadow: inset 0 -1px 0 var(--edit-line);
}

/* Show a piece of UI only while editing, or only while not. */
body:not(.bw-editing) .bw-edit-only { display: none !important; }
body.bw-editing .bw-run-only { display: none !important; }

/* The Name: hidden in the bar normally, typed into at its left while editing. */
body.bw-editing .bw-topbar-title {
  display: block !important;
  min-width: 90px;
  max-width: 34%;
  padding: 4px 8px;
  border-radius: var(--radius);
  outline: 1px dashed var(--edit-line);
  outline-offset: -1px;
  cursor: text;
  text-overflow: clip;
}
body.bw-editing .bw-topbar-title:focus { outline-style: solid; background: var(--edit-soft); }
body.bw-editing .bw-topbar-title + .bw-sep,
body.bw-editing .bw-adopted-bar > .bw-topbar-title + .bw-sep { display: block !important; }

/* Anything set by clicking or typing on it. */
body.bw-editing .bw-editable {
  outline: 1.5px dashed color-mix(in oklab, var(--edit-line) 75%, transparent);
  outline-offset: 4px;
  border-radius: 4px;
  cursor: text;
  transition: outline-color var(--dur), background var(--dur);
}
body.bw-editing .bw-editable:hover { outline-color: var(--edit-line); }
body.bw-editing .bw-editable:focus,
body.bw-editing .bw-editable:focus-within {
  outline: 2px solid var(--edit-line);
  background: color-mix(in oklab, var(--edit-soft) 70%, transparent);
}
body.bw-editing button.bw-editable,
body.bw-editing .bw-editable[role="button"] { cursor: pointer; }

/* An empty editable shows what goes there. */
[data-bw-placeholder]:empty::before {
  content: attr(data-bw-placeholder);
  color: var(--text-3);
  pointer-events: none;
}

/* A quiet line saying what can be done here. */
.bw-edit-hint {
  font-size: var(--fs-chrome-sm);
  color: var(--edit-ink);
  white-space: nowrap;
}

/* Segmented choice: one of a few. Members are .bw-btn, the chosen one
   .is-active. Used for settings picked on the widget in edit mode. */
.bw-seg {
  display: inline-flex;
  flex: 0 0 auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.bw-seg > .bw-btn { border: 0; border-radius: 0; height: calc(var(--ctl-h) - 2px); }
.bw-seg > .bw-btn + .bw-btn { border-left: 1px solid var(--border); }
body.bw-editing .bw-seg > .bw-btn.is-active,
body.bw-editing .bw-toggle[aria-pressed="true"] {
  background: var(--edit); border-color: var(--edit); color: var(--on-edit);
}

/* On / off, with its state drawn as a tick box. */
.bw-toggle { gap: 7px; }
.bw-toggle::before {
  content: '';
  width: 12px; height: 12px;
  border: 1.5px solid currentColor;
  border-radius: 3px;
  opacity: 0.7;
  flex: 0 0 auto;
}
.bw-toggle[aria-pressed="true"]::before {
  opacity: 1;
  background: currentColor;
  box-shadow: inset 0 0 0 2px var(--edit);
}

/* A small number typed in place, inside a sentence or a control. */
.bw-inline-num {
  width: 5.5ch;
  height: calc(var(--ctl-h) - 4px);
  padding: 0 6px;
  border: 1px solid var(--border-med);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  font: inherit;
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.bw-inline-num:focus { outline: 2px solid var(--edit-line); outline-offset: -1px; border-color: var(--edit-line); }

/* "+ Add …" at the end of a list being edited. */
.bw-add {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border: 1.5px dashed color-mix(in oklab, var(--edit-line) 75%, transparent);
  border-radius: var(--radius);
  background: none;
  color: var(--edit-ink);
  font: inherit;
  cursor: pointer;
}
.bw-add:hover { border-color: var(--edit-line); background: var(--edit-soft); }

/* Font size stepper — drives --u, which every content-sized token is built on. */
.bw-fontsize {
  display: flex;
  align-items: center;
  gap: 2px;
}
.bw-fontsize .bw-btn { font-variant-numeric: tabular-nums; }
.bw-fontsize-a-sm { font-size: 10px; font-weight: 600; }
.bw-fontsize-a-lg { font-size: 14px; font-weight: 600; }

   Spinner arrows on number inputs and the chevron on a select are drawn by
   the browser at its own size and colour. Next to flat chrome on a projected
   slide they read as clutter, so they're removed everywhere rather than
   per widget.

  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  background-image: none;
}

input[type="number"] {

  appearance: textfield;
}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* The disclosure triangle on <details>, for the same reason. */
summary { list-style: none; cursor: pointer; }
summary::-webkit-details-marker { display: none; }

/* Search inputs get a cancel "x" and decoration in WebKit. */
input[type="search"]::-webkit-search-decoration,
input[type="search"]::-webkit-search-cancel-button,
input[type="search"]::-webkit-search-results-button { -webkit-appearance: none; }

   notes PDF. Captures read computed styles at one instant, so anything still
   mid-transition would be printed half-way; and a widget can mark chrome that
   means nothing on paper (a "view only" toast, a hover hint) to leave out. */

  animation: none !important;
}

            row.appendChild(input);

        } else if (field.type === 'file') {
            row.appendChild(labelFor(field));
            var fileRow = el('div', 'bws-file');
            input = el('input', 'bws-input');
            input.type = 'text';
            input.readOnly = true;
            input.placeholder = 'No file selected';
            input.value = eff == null ? '' : String(eff);
            input.title = input.value;
            var btn = el('button', 'bws-btn');
            btn.type = 'button';
            btn.textContent = 'Upload';
            btn.addEventListener('click', function () { pickAsset(field, input, btn, onChange); });
            fileRow.appendChild(input);
            fileRow.appendChild(btn);
            row.appendChild(fileRow);

        } else if (field.type === 'duration') {
            // Stored as whole seconds, typed as minutes and seconds. Keep in
            // step with the editor's copy in editor/widget-fields.js.
            row.appendChild(labelFor(field));
            var dur = el('div', 'bws-dur');
            var part = function (unit) {
                var pl = el('label', 'bws-dur-part');
                var pi = el('input', 'bws-input');
                pi.type = 'number'; pi.min = '0'; pi.step = '1'; pi.inputMode = 'numeric';
                pi.setAttribute('aria-label', (field.label || field.key) + ' — ' + (unit === 'min' ? 'minutes' : 'seconds'));
                var pu = el('span', 'bws-dur-unit');
                pu.textContent = unit;
                pl.appendChild(pi); pl.appendChild(pu);
                dur.appendChild(pl);
                return pi;
            };
            var dMin = part('min'), dSec = part('sec');
            var showDur = function (t) {
                t = Math.max(0, Math.round(Number(t)));
                dMin.value = String(Math.floor(t / 60));
                dSec.value = String(t % 60);
            };
            if (eff != null && eff !== '' && isFinite(Number(eff))) showDur(eff);
            else if (field.default != null && isFinite(Number(field.default))) {
                var dt = Math.round(Number(field.default));
                dMin.placeholder = String(Math.floor(dt / 60));
                dSec.placeholder = String(dt % 60);
            }
            dur.addEventListener('change', function () {
                var t = durationTotal(dMin, dSec);
                if (t != null) showDur(t);
            });
            row.appendChild(dur);
            input = { mins: dMin, secs: dSec,
                      addEventListener: function (ev, fn) {
                          dMin.addEventListener(ev, fn); dSec.addEventListener(ev, fn);
                      } };

        } else {
            row.appendChild(labelFor(field));
            input = el('input', 'bws-input');
            input.type = field.type === 'password' ? 'password'
                       : (field.type === 'number' || field.type === 'number-nullable') ? 'number'
                       : 'text';
            if (field.min !== undefined)  input.min  = field.min;
            if (field.max !== undefined)  input.max  = field.max;
            if (field.step !== undefined) input.step = field.step;
            if (field.placeholder) input.placeholder = field.placeholder;
            input.value = eff == null ? '' : String(eff);
            row.appendChild(input);
        }

        input.addEventListener('input',  onChange);
        input.addEventListener('change', onChange);

        return {
            key: field.key,
            node: row,
            read: function () {
                if (field.type === 'checkbox') return { value: input.checked };
                if (field.type === 'duration') {
                    var total = durationTotal(input.mins, input.secs);
                    if (total == null) return { remove: true };
                    var lo = field.min !== undefined ? Number(field.min) : 1;
                    return { value: Math.max(lo, total) };
                }
                if (field.type === 'number' || field.type === 'number-nullable') {
                    var raw = input.value.trim();
                    if (raw === '') return { remove: true };
                    var n = parseFloat(raw);
                    return isNaN(n) ? { remove: true } : { value: n };
                }
                if (field.type === 'textarea-lines') {
                    var lines = input.value.split('\n').map(function (s) { return s.trim(); })
                                     .filter(function (s) { return !!s; });
                    return lines.length ? { value: lines } : { remove: true };
                }
                return input.value === '' ? { remove: true } : { value: input.value };
            },
        };
    }

    // Minutes + seconds boxes → whole seconds, or null when both are empty.
    function durationTotal(mins, secs) {
        var m = mins.value.trim(), sv = secs.value.trim();
        if (m === '' && sv === '') return null;
        var t = (parseFloat(m) || 0) * 60 + (parseFloat(sv) || 0);
        return Math.max(0, Math.round(t));
    }

    /* ─── ai-model options ──────────────────────────────────────── */

    function loadModels(select, current) {
        var base = cfg().serverUrl;
        if (!base) return;
        fetch(base.replace(/\/+$/, '') + '/api/models')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var models = (data && data.models) || [];
                select.textContent = '';
                var none = el('option');
                none.value = '';
                none.textContent = '— no model —';
                select.appendChild(none);
                models.forEach(function (m) {
                    var opt = el('option');
                    opt.value = m;
                    opt.textContent = m;
                    if (current === m) opt.selected = true;
                    select.appendChild(opt);
                });
            })
            .catch(function () {
                var first = select.firstChild;
                if (first && first.textContent === '— loading… —') first.textContent = '— unavailable —';
            });
    }

    /* ─── file fields ───────────────────────────────────────────── */
    // The widget can't reach the editor's pending-files map, so the bytes go
    // to the parent, which stores them for the save ZIP, uploads them so the
    // widget can read the file before the deck is saved, and replies with the
    // path to record.

    // key → resolve callback for an upload in flight. One per key is plenty:
    // a second save of the same key supersedes the first.
    var _pendingAssets = {};

    /**
     * Save a file into the deck. The bytes go into the presentation ZIP under
     * <folder>/<name> and the path is written to this widget's config under
     * <key>, so the file is there again next time the deck is opened — which is
     * where a file belongs, rather than inlined into the widget's state.
     *
     * opts: { key, name, buffer, folder = 'files', serve = true }
     * serve:false skips the immediate upload, for a widget that already holds
     * the content and doesn't need to read it back over HTTP.
     * Resolves with the saved path.
     */
    function saveFile(opts) {
        opts = opts || {};
        if (!opts.key || !opts.buffer) return Promise.reject(new Error('saveFile needs a key and a buffer'));
        return new Promise(function (resolve, reject) {
            _pendingAssets[opts.key] = { resolve: resolve, reject: reject };
            post({
                type:     'widget-asset-upload',
                widgetId: cfg().id,
                key:      opts.key,
                folder:   opts.folder || 'files',
                name:     opts.name || 'file',
                serve:    opts.serve !== false,
                buffer:   opts.buffer,
            });
        });
    }

    function pickAsset(field, input, btn, onChange) {
        var picker = el('input');
        picker.type = 'file';
        if (field.accept) picker.accept = field.accept;
        picker.addEventListener('change', function () {
            var file = picker.files && picker.files[0];
            if (!file) return;
            btn.disabled = true;
            btn.textContent = 'Uploading…';
            file.arrayBuffer().then(function (buffer) {
                return saveFile({ key: field.key, name: file.name, folder: field.folder || 'files', buffer: buffer });
            }).then(function (path) {
                btn.disabled = false;
                btn.textContent = 'Upload';
                input.value = path;
                input.title = path;
                onChange();
            }).catch(function () {
                btn.disabled = false;
                btn.textContent = 'Upload';
            });
        });
        picker.click();
    }

    function onAssetSaved(msg) {
        var p = _pendingAssets[msg.key];
        if (!p) return;
        delete _pendingAssets[msg.key];
        // Keep our own config in step, so a re-read sees the new path.
        if (msg.path) cfg()[msg.key] = msg.path;
        p.resolve(msg.path || '');
    }

    // Widgets that own a file register here; Beamer+ asks just before it builds
    // the ZIP, so an edit made during the talk is written back rather than only
    // the version originally opened.
    var _flushHandler = null;

    function onFlushFiles(fn) { _flushHandler = typeof fn === 'function' ? fn : null; }

    /* ─── panel ─────────────────────────────────────────────────── */

    var root = null, rows = [], isOpen = false, commitTimer = null, selfDispatch = false;

    function commit() {
        var patch = {}, remove = [];
        rows.forEach(function (r) {
            var res = r.read();
            if (res.remove) remove.push(r.key);
            else patch[r.key] = res.value;
        });
        post({ type: 'widget-settings', widgetId: cfg().id, patch: patch, remove: remove });

        // Apply to our own config too, so a widget that re-reads on
        // `widget-config` updates while the panel is still open rather than
        // waiting for the next load.
        var c = cfg();
        remove.forEach(function (k) { delete c[k]; });
        Object.keys(patch).forEach(function (k) { c[k] = patch[k]; });
        applyScale();
        selfDispatch = true;
        try { window.dispatchEvent(new MessageEvent('message', { data: { type: 'widget-config', config: c } })); }
        catch (e) {}
        selfDispatch = false;
    }

    // `showIf: { otherKey: value | [values] }` on a field hides it unless
    // another field currently holds one of those values. Mirrors the editor's
    // properties panel so both surfaces show the same form.
    function syncVisibility() {
        var values = {};
        rows.forEach(function (r) {
            var res = r.read();
            values[r.key] = res.remove ? (r.field ? r.field['default'] : undefined) : res.value;
        });
        rows.forEach(function (r) {
            var cond = r.field && r.field.showIf, show = true;
            if (cond && typeof cond === 'object') {
                show = Object.keys(cond).every(function (k) {
                    var want = Array.isArray(cond[k]) ? cond[k] : [cond[k]];
                    return want.some(function (w) { return String(w) === String(values[k]); });
                });
            }
            r.node.style.display = show ? '' : 'none';
        });
    }

    function scheduleCommit() {
        if (commitTimer) clearTimeout(commitTimer);
        commitTimer = setTimeout(function () { commitTimer = null; commit(); }, 150);
    }

    function onKey(e) {
        if (e.key !== 'Escape') return;
        e.preventDefault();
        e.stopPropagation();
        closePanel();
    }

    function build() {
        injectStyles();
        rows = [];
        root = el('div', 'bws-root');

        var head  = el('div', 'bws-head');
        var title = el('span', 'bws-title');
        title.textContent = ((schema && schema.label) || 'Widget') + ' settings';
        var x = el('button', 'bws-x');
        x.type = 'button';
        x.title = 'Close settings';
        x.textContent = '×';
        x.addEventListener('click', function () { closePanel(); });
        head.appendChild(title);
        head.appendChild(x);

        var body = el('div', 'bws-body');
        if (!fields.length) {
            var empty = el('div', 'bws-empty');
            empty.textContent = 'This widget has no settings.';
            body.appendChild(empty);
        } else {
            var onFieldChange = function () { syncVisibility(); scheduleCommit(); };
            fields.forEach(function (f) {
                var row = buildRow(f, onFieldChange);
                row.field = f;
                rows.push(row);
                body.appendChild(row.node);
            });
            syncVisibility();
        }

        root.appendChild(head);
        root.appendChild(body);
    }

    function openPanel() {
        if (isOpen) return;
        isOpen = true;
        // Grow to the full slide first — most widgets are far too small to
        // hold a settings form at their placed size.
        post({ type: 'widget-expand', widgetId: cfg().id });
        build();
        document.body.appendChild(root);
        requestAnimationFrame(function () { if (root) root.classList.add('is-open'); });
        document.addEventListener('keydown', onKey, true);
    }

    // silent: the parent already knows (it asked us to close), so don't tell it again.
    function closePanel(silent) {
        if (!isOpen) return;
        isOpen = false;
        document.removeEventListener('keydown', onKey, true);
        if (commitTimer) { clearTimeout(commitTimer); commitTimer = null; commit(); }
        if (root && root.parentNode) root.parentNode.removeChild(root);
        root = null;
        rows = [];
        post({ type: 'widget-collapse', widgetId: cfg().id });
        if (!silent) post({ type: 'widget-settings-close', widgetId: cfg().id });
    }

    /* ─── edit mode (editing on the widget itself) ──────────────── */
    // A widget that declares "inlineEdit": true in its schema is set up on the
    // widget itself: the Edit button (top right of the bar, or the corner
    // pencil on an overlay) puts it into edit mode, body.bw-editing, where its
    // own content becomes the form — the question is typed where the question
    // shows, a timer's digits are the duration, a table's cells are its
    // starting data. Done (or Escape) leaves it.
    //
    // The widget does the drawing; the kit only:
    //   - toggles body.bw-editing and fires the window event 'bw-edit'
    //     { detail: { editing } } — the widget listens and redraws;
    //   - stores changes: BeamerWidget.edit.set(patch, remove) merges them into
    //     the config, sends them to Beamer+ (which saves them with the slide) and
    //     hands the widget its new config as an ordinary 'widget-config'
    //     message — unless { silent: true }, for a widget that already shows it;
    //   - grows an overlay or inset to the full slide while it is edited (there
    //     is no room to edit a corner clock in its corner) and puts it back after;
    //   - makes the Name (the bar's title, hidden otherwise) editable in place.
    //
    // Opened as a file, outside Beamer+, edit mode works the same; changes
    // simply stay with the page until it is reloaded.
    //
    // Widgets without "inlineEdit" keep the older route: Edit opens the host's
    // settings sheet, or, outside Beamer+, the kit's own form (openPanel).

    var editing = false, editGrew = false;

    function inlineEdit() { return readSchema() && !!(schema && schema.inlineEdit); }
    function hosted() {
        try { return window.parent !== window && cfg().id != null; } catch (e) { return false; }
    }
    function canEdit() {
        if (cfg().role === 'viewer' || window.BEAMER_PRINT || cfg().printMode) return false;
        try { if (new URLSearchParams(location.search).get('viewer') === '1') return false; } catch (e) {}
        return hasOwnSettings() || inlineEdit();
    }

    function editSet(patch, remove, opts) {
        if (remove && !Array.isArray(remove)) { opts = remove; remove = []; }
        patch = patch || {}; remove = remove || []; opts = opts || {};
        var c = cfg();
        remove.forEach(function (k) { delete c[k]; });
        Object.keys(patch).forEach(function (k) {
            if (RESERVED.indexOf(k) === -1) c[k] = patch[k];
        });
        if (hosted()) post({ type: 'widget-settings', widgetId: c.id, patch: patch, remove: remove });
        if ('title' in patch || remove.indexOf('title') >= 0) syncTitle();
        if ('scale' in patch) { applyScale(); syncScaleButtons(); }
        if (opts.silent) return;
        selfDispatch = true;
        try { window.dispatchEvent(new MessageEvent('message', { data: { type: 'widget-config', config: c, live: true } })); }
        catch (e) {}
        selfDispatch = false;
    }

    function syncTitle() {
        if (!titleEl) return;
        if (editing && document.activeElement === titleEl) return;   // being typed into
        titleEl.textContent = editing ? customName() : barTitle();
    }

    var editBtn = null, floatEdit = null;
    var PENCIL_SM = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';
    var CHECK_SM  = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

    function paintEditButtons() {
        if (editBtn) {
            editBtn.innerHTML = (editing ? CHECK_SM : PENCIL_SM) + '<span>' + (editing ? 'Done' : 'Edit') + '</span>';
            editBtn.classList.toggle('bw-btn--primary', editing);
            editBtn.title = editing ? 'Done editing (Esc)' : 'Edit this widget';
            editBtn.setAttribute('aria-pressed', editing ? 'true' : 'false');
        }
        if (floatEdit) floatEdit.title = editing ? 'Done editing' : 'Edit this widget';
    }

    function onEditButton() {
        if (editing) { exitEdit(); return; }
        if (inlineEdit()) { enterEdit(); return; }
        // Older widgets: a form, from the host or (opened as a file) our own.
        if (hosted()) editSettings();
        else { readSchema(); if (hasSettings) openPanel(); }
    }

    function enterEdit() {
        if (editing || !canEdit() || !inlineEdit()) return;
        editing = true;
        // An overlay or an inset is too small to edit in place: grow it to the
        // slide and show the full widget, with its bar, while it is edited.
        editGrew = displayMode() === 'overlay' || isPartial();
        if (editGrew) post({ type: 'widget-expand', widgetId: cfg().id });
        document.body.classList.add('bw-editing');
        if (titleEl) {
            titleEl.setAttribute('contenteditable', 'plaintext-only');
            if (titleEl.contentEditable !== 'plaintext-only') titleEl.setAttribute('contenteditable', 'true');
            titleEl.setAttribute('data-bw-placeholder', (schema && schema.label) || 'Name');
            titleEl.setAttribute('spellcheck', 'false');
            titleEl.title = 'Name';
        }
        syncTitle();
        syncLayoutMode();
        paintEditButtons();
        document.addEventListener('keydown', onEditKey, true);
        fire(true);
    }

    function exitEdit() {
        if (!editing) return;
        if (document.activeElement && document.activeElement !== document.body) {
            try { document.activeElement.blur(); } catch (e) {}
        }
        editing = false;
        document.body.classList.remove('bw-editing');
        if (titleEl) {
            titleEl.removeAttribute('contenteditable');
            titleEl.removeAttribute('title');
        }
        document.removeEventListener('keydown', onEditKey, true);
        if (editGrew) post({ type: 'widget-collapse', widgetId: cfg().id });
        editGrew = false;
        syncTitle();
        syncLayoutMode();
        paintEditButtons();
        fire(false);
    }

    function fire(on) {
        try { window.dispatchEvent(new CustomEvent('bw-edit', { detail: { editing: on } })); } catch (e) {}
    }

    // Escape first leaves whatever is being typed into, then edit mode. A
    // widget with a popup of its own open calls preventDefault() to keep it.
    function onEditKey(e) {
        if (e.key !== 'Escape' || e.defaultPrevented) return;
        var a = document.activeElement;
        setTimeout(function () {
            if (e.defaultPrevented || !editing) return;
            if (a && a !== document.body && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) {
                a.blur();
                return;
            }
            exitEdit();
        }, 0);
    }

    function wireTitleEditing() {
        if (!titleEl || titleEl.__bwWired) return;
        titleEl.__bwWired = true;
        titleEl.addEventListener('input', function () {
            if (!editing) return;
            var v = titleEl.textContent.replace(/\s+/g, ' ').trim();
            if (v) editSet({ title: v }, [], { silent: true });
            else editSet({}, ['title', 'downloadName'], { silent: true });
        });
        titleEl.addEventListener('keydown', function (e) {
            if (editing && e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
        });
        titleEl.addEventListener('blur', function () { if (editing) syncTitle(); });
    }

    var editApi = {
        /** Can this copy be edited at all (presenter, not a print copy)? */
        available: function () { return canEdit() && inlineEdit(); },
        /** Is the widget in edit mode now? */
        get active() { return editing; },
        isActive: function () { return editing; },
        enter: enterEdit,
        exit: exitEdit,
        /**
         * Change settings from the widget: set(patch, remove?, { silent? }).
         * Saved with the slide inside Beamer+, kept until reload outside it.
         */
        set: editSet,
    };

    /* ─── top bar ───────────────────────────────────────────────── */
    // Every widget carries the same bar, built here rather than in each widget:
    // the title, whatever controls the widget registers, and the shared
    // utilities. The widget's own markup is moved into .bw-topbar-body beneath
    // it, so a widget never has to leave room for the bar or know it exists.
    //
    // A widget opts out with "topbar": false in its schema (for one that is
    // nothing but an embedded frame), and hides the font stepper alone with
    // "fontSize": false (for one whose content it cannot reach — a remote page,
    // a video, a map).

    // Coarse enough that one press is visibly different from the back of a room.
    var SCALE_STEPS = [1, 1.2, 1.4, 1.7, 2, 2.4];

    var barEl = null, actionsEl = null, titleEl = null, resetHandler = null;

    /* ─── name ──────────────────────────────────────────────────── */
    // One Name per widget, used everywhere it shows up: the bar title, the
    // heading inside an exported PDF, and every file the widget downloads.
    // Blank means the widget's own default. `downloadName` is read as a
    // fallback for decks saved while that was a separate setting.

    function customName() {
        var c = cfg();
        if (typeof c.title === 'string' && c.title.trim()) return c.title.trim();
        if (typeof c.downloadName === 'string' && c.downloadName.trim()) return c.downloadName.trim();
        return '';
    }

    /** The widget's Name, or `fallback` (else its schema label) when none is set. */
    function name(fallback) {
        return customName() || (fallback != null ? String(fallback) : ((schema && schema.label) || ''));
    }

    /**
     * A safe download file name: the Name if set, else `fallback`, plus `ext`.
     * Only `ext` itself is stripped from a typed name, so "Lecture 3.2" keeps
     * its ".2" and "Notes.pdf" doesn't become "Notes.pdf.pdf".
     */
    function fileName(fallback, ext) {
        ext = ext ? '.' + String(ext).replace(/^\./, '') : '';
        var n = (customName() || String(fallback || 'download'))
            .replace(/[\\/:*?"<>|\x00-\x1f]+/g, '_').trim();
        if (ext && n.toLowerCase().slice(-ext.length) === ext.toLowerCase()) n = n.slice(0, -ext.length).trim();
        return (n || 'download') + ext;
    }

    function barTitle() {
        // A presenter-set title wins over the widget's generic name.
        return name();
    }

    function makeBtn(opts) {
        var b = el('button', 'bw-btn' + (opts.variant ? ' bw-btn--' + opts.variant : ''));
        b.type = 'button';
        if (opts.title) b.title = opts.title;
        if (opts.icon) b.innerHTML = opts.icon;
        if (opts.label) {
            var span = el('span');
            span.textContent = opts.label;
            b.appendChild(span);
        }
        if (opts.onClick) b.addEventListener('click', opts.onClick);
        return b;
    }

    function setScale(next) {
        var v = SCALE_STEPS[Math.max(0, Math.min(SCALE_STEPS.length - 1, next))];
        cfg().scale = v;
        applyScale();
        // Persist through the same path the settings panel uses, so the size
        // chosen for the room is still there next time the deck is opened.
        post({ type: 'widget-settings', widgetId: cfg().id, patch: { scale: v }, remove: [] });
        syncScaleButtons();
    }

    var scaleDown = null, scaleUp = null;

    function syncScaleButtons() {
        if (!scaleDown || !scaleUp) return;
        var i = nearestStep(currentScale());
        scaleDown.disabled = i <= 0;
        scaleUp.disabled = i >= SCALE_STEPS.length - 1;
    }

    function nearestStep(v) {
        var best = 0, bestD = Infinity;
        for (var i = 0; i < SCALE_STEPS.length; i++) {
            var d = Math.abs(SCALE_STEPS[i] - v);
            if (d < bestD) { bestD = d; best = i; }
        }
        return best;
    }

    function doReset() {
        if (typeof resetHandler === 'function') {
            try { resetHandler(); return; }
            catch (e) { console.warn('[widget] reset handler failed', e); }
        }
        // No handler: reloading the srcdoc document puts the widget back exactly
        // as the slide first rendered it, which is what reset means anyway.
        try { location.reload(); } catch (e) {}
    }

    var RESET_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>';

    function buildBar() {
        var bar = el('div', 'bw-topbar');
        bar.id = 'bw-topbar';
        // A bar wider than the widget scrolls sideways. A mouse wheel only
        // scrolls up and down, so turn that into sideways here.
        bar.addEventListener('wheel', function (e) {
            if (bar.scrollWidth <= bar.clientWidth + 1) return;
            if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
            bar.scrollLeft += e.deltaY;
            e.preventDefault();
        }, { passive: false });

        titleEl = el('div', 'bw-topbar-title');
        titleEl.textContent = barTitle();
        bar.appendChild(titleEl);

        actionsEl = el('div', 'bw-topbar-actions');
        actionsEl.id = 'bw-topbar-actions';
        bar.appendChild(actionsEl);

        // The audience view gets the widget's own controls but not the
        // presenter's furniture.
        if (cfg().role === 'viewer') return bar;

        var utils = el('div', 'bw-topbar-utils');

        if (!(schema && schema.fontSize === false)) {
            var group = el('div', 'bw-fontsize');
            scaleDown = makeBtn({
                variant: 'icon', title: 'Smaller text',
                onClick: function () { setScale(nearestStep(currentScale()) - 1); },
            });
            scaleDown.innerHTML = '<span class="bw-fontsize-a-sm">A</span>';
            scaleUp = makeBtn({
                variant: 'icon', title: 'Larger text',
                onClick: function () { setScale(nearestStep(currentScale()) + 1); },
            });
            scaleUp.innerHTML = '<span class="bw-fontsize-a-lg">A</span>';
            group.appendChild(scaleDown);
            group.appendChild(scaleUp);
            utils.appendChild(group);
            syncScaleButtons();
        }

        utils.appendChild(makeBtn({
            variant: 'icon', title: 'Reset widget', icon: RESET_ICON, onClick: doReset,
        }));

        // Edit sits last: the top-right corner of every widget.
        if (canEdit()) {
            editBtn = makeBtn({ onClick: onEditButton });
            editBtn.classList.add('bw-edit-btn');
            editBtn.setAttribute('data-bw-print-hide', '');
            utils.appendChild(editBtn);
            paintEditButtons();
        }

        bar.appendChild(utils);
        return bar;
    }

    function buildTopbar() {
        if (barEl || !document.body) return;
        if (!readSchema()) return;
        if (schema && schema.topbar === false) return;

        var body = document.body;

        // Take the widget's own body layout before changing it and hand it to
        // the wrapper: a widget that laid its children out with
        // `body { display: flex }` keeps that layout, one level down. Height and
        // overflow are deliberately not copied — the wrapper is a flex child and
        // sizes itself from whatever the bar leaves.
        var cs = window.getComputedStyle(body);
        var wrap = el('div', 'bw-topbar-body');
        wrap.id = 'bw-topbar-body';
        ['display', 'flexDirection', 'flexWrap', 'gap', 'alignItems', 'justifyContent',
         'gridTemplateColumns', 'gridTemplateRows', 'gridAutoRows', 'gridAutoColumns',
         'padding', 'background', 'color', 'textAlign'].forEach(function (prop) {
            try { wrap.style[prop] = cs[prop]; } catch (e) {}
        });

        while (body.firstChild) wrap.appendChild(body.firstChild);

        barEl = buildBar();
        body.appendChild(barEl);
        body.appendChild(wrap);
        body.classList.add('bw-has-topbar');

        // No bar to hold the pencil (an overlay, or an inset without the
        // utilities): a faint one in the corner, shown while the pointer is
        // over the widget (widget-base.css).
        if (canEdit()) {
            floatEdit = makeBtn({ variant: 'icon', title: 'Edit this widget', icon: PENCIL_ICON, onClick: onEditButton });
            floatEdit.classList.add('bw-edit-float');
            floatEdit.setAttribute('data-bw-print-hide', '');
            body.appendChild(floatEdit);
        }

        adoptOwnBar(wrap);
        wireTitleEditing();

        // A widget that appends to <body> after this ran would land beside the
        // wrapper instead of inside it, and show up under the content. Move late
        // arrivals in, so a widget written without knowing about the bar still
        // behaves.
        try {
            new MutationObserver(function (records) {
                for (var i = 0; i < records.length; i++) {
                    var added = records[i].addedNodes;
                    for (var j = 0; j < added.length; j++) {
                        var n = added[j];
                        if (n === barEl || n === wrap || n === floatEdit) continue;
                        // Never re-parent an iframe: moving one reloads it and
                        // throws away its document. html2canvas renders into a
                        // hidden iframe it appends to <body>; moving that emptied
                        // the clone mid-capture, and every computed style came
                        // back "" ("Error parsing CSS component value,
                        // unexpected EOF" on PDF export).
                        if (n.nodeName === 'IFRAME') continue;
                        if (n.parentNode === body) wrap.appendChild(n);
                    }
                }
            }).observe(body, { childList: true });
        } catch (e) {}
    }

    // A widget that already draws its own bar marks it with `data-bw-topbar`
    // (or uses .bw-toolbar) and that element is MOVED into the shared bar — the
    // element itself, not a copy of its contents, so every id, listener and
    // piece of widget logic pointing at it keeps working untouched.
    //
    // It is moved rather than emptied because a widget may fill its bar later,
    // from script (the browser widget's toolbar is empty markup that its own
    // code populates on load); emptying it would quietly delete controls that
    // had not been created yet.
    //
    // `display: contents` then drops its box so its children become items of
    // the shared bar's own flex row, picking up the same spacing as every other
    // widget's controls. Set inline because the widget styles it by id, which
    // would otherwise win.
    function adoptOwnBar(wrap) {
        var own = wrap.querySelector('[data-bw-topbar]') || wrap.querySelector('.bw-toolbar');
        if (!own || !actionsEl) return;

        // If the widget already writes a title, its element BECOMES the bar's
        // title — restyled in place and adopted as what setTitle() writes to —
        // and ours is dropped. Taking the element over rather than copying its
        // text and deleting it matters: a widget may keep writing to that node
        // (the notebook puts the open file's name there), and deleting it would
        // silently break those updates.
        var ownTitle = own.querySelector('.bw-toolbar-title, [data-bw-title], .toolbar-title, #toolbar-title');
        if (ownTitle) {
            ownTitle.classList.add('bw-topbar-title');
            if (customName()) ownTitle.textContent = customName();
            if (titleEl && titleEl.parentNode) titleEl.parentNode.removeChild(titleEl);
            titleEl = ownTitle;
        }

        own.classList.add('bw-adopted-bar');
        own.style.display = 'contents';
        // Keep the widget's name from running straight into its first control.
        var sep = document.createElement('div');
        sep.className = 'bw-sep';
        actionsEl.appendChild(sep);
        actionsEl.appendChild(own);
    }

    /* ─── display: full, overlay, inset ────────────────────────── */
    // A widget is shown one of two ways, and declares which it supports with
    // "modes" in its schema (first one is the default):
    //
    //   full     the slide's content: the whole slide, with the shared bar.
    //   overlay  a small tool laid over part of a slide (a timer in the
    //            corner, a calculator beside a worked example): no bar at
    //            all, just the widget's own simplified view (body.bw-overlay).
    //
    // "fullSlide": true is shorthand for ["full"]; no "modes" also means
    // ["full"]. Which one a placed widget uses is its config item's `display`.
    //
    // A full-only widget can still be placed on part of a slide (older decks
    // do this): that is an inset, not a window — it drops the title and the
    // shared utilities and keeps its own controls as a slim strip, or no bar
    // at all when it has none (body.bw-partial).

    function near(a, b) { return Math.abs((+a || 0) - b) < 0.005; }

    function boxIsFull() {
        var c = cfg();
        var w = c.width == null ? 1 : c.width, h = c.height == null ? 1 : c.height;
        return near(c.x, 0) && near(c.y, 0) && near(w, 1) && near(h, 1);
    }

    // Keep in step with widgetModes() / widgetDisplay() in editor/widget-schema.js.
    function declaredModes() {
        if (!readSchema() || !schema || schema.fullSlide === true) return ['full'];
        var m = Array.isArray(schema.modes)
            ? schema.modes.filter(function (x) { return x === 'full' || x === 'overlay'; })
            : [];
        return m.length ? m : ['full'];
    }

    function displayMode() {
        if (editing && editGrew) return 'full';   // grown to the slide while edited
        var m = declaredModes(), d = cfg().display;
        if (m.indexOf(d) >= 0) return d;
        if (m.length === 1) return m[0];
        // Saved before modes existed: a widget that could be an overlay and
        // was placed on part of the slide was being used as one.
        return boxIsFull() ? 'full' : 'overlay';
    }

    function isPartial() {
        if (!readSchema()) return false;
        if (schema && schema.fullSlide === true) return false;
        if (editing && editGrew) return false;
        return displayMode() === 'full' && !boxIsFull();
    }

    var CONTROL_SEL = 'button, input, select, textarea, a[href], [role="button"]';
    var controlsQueued = false;

    // Does the bar hold anything to operate? (A title or a status pill alone
    // isn't worth a bar in an inset.)
    function syncBarControls() {
        controlsQueued = false;
        if (!barEl || !actionsEl) return;
        var any = false, list = actionsEl.querySelectorAll(CONTROL_SEL);
        for (var i = 0; i < list.length && !any; i++) {
            var c = list[i];
            if (c.hidden) continue;
            try { if (window.getComputedStyle(c).display === 'none') continue; } catch (e) {}
            any = true;
        }
        barEl.classList.toggle('bw-topbar--no-controls', !any);
    }

    function queueBarControls() {
        if (controlsQueued) return;
        controlsQueued = true;
        (window.requestAnimationFrame || setTimeout)(syncBarControls);
    }

    var lastDisplay = null;
    function syncLayoutMode() {
        if (!document.body || !readSchema()) return;
        var d = displayMode();
        document.body.classList.toggle('bw-overlay', d === 'overlay');
        document.body.classList.toggle('bw-partial', isPartial());
        document.documentElement.setAttribute('data-bw-display', d);
        syncBarControls();
        // Most widgets restyle with CSS alone; one that has to re-measure or
        // re-render listens for this.
        // Also on the first sync: a widget may have drawn before the kit
        // could tell it how it's shown.
        if (d !== lastDisplay) {
            lastDisplay = d;
            try { window.dispatchEvent(new CustomEvent('bw-display', { detail: { display: d } })); } catch (e) {}
        }
    }

    var controlsWatched = false;
    function watchBarControls() {
        if (controlsWatched || !actionsEl) return;
        controlsWatched = true;
        try {
            new MutationObserver(queueBarControls).observe(actionsEl, {
                childList: true, subtree: true,
                attributes: true, attributeFilter: ['hidden', 'style', 'class'],
            });
        } catch (e) {}
    }

    // What a widget uses to put its own controls in the bar and say what
    // resetting it means.
    var topbarApi = {
        get el() { return barEl; },
        addButton: function (opts) {
            var b = makeBtn(opts || {});
            if (actionsEl) actionsEl.appendChild(b);
            return b;
        },
        addElement: function (node) {
            if (node && actionsEl) actionsEl.appendChild(node);
            return node;
        },
        addSeparator: function () {
            var sep = el('div', 'bw-sep');
            if (actionsEl) actionsEl.appendChild(sep);
            return sep;
        },
        setTitle: function (text) {
            if (titleEl) titleEl.textContent = text == null ? '' : String(text);
        },
        onReset: function (fn) { resetHandler = typeof fn === 'function' ? fn : null; },
    };

    /* ─── printing (notes PDF) ──────────────────────────────────── */
    // When the presenter downloads the notes version of a deck, each widget
    // is asked how it should look on paper. A widget opts in with
    //
    //   BeamerWidget.print.register(async ({ scale }) => ({
    //       image: await BeamerWidget.print.snapshot(),   // drawn in the widget's box
    //       pages: [ { title, blocks: [ … ] } ],           // optional, after the slide
    //   }));
    //
    // A widget that registers nothing is drawn as a labelled placeholder box.
    // The host asks a throwaway copy (role 'viewer', printMode true, sockets
    // stubbed), already set to the live widget's state — so a handler only
    // has to draw what's in front of it. Images may be data URLs or canvases.
    var _printHandler = null;
    // html2canvas-pro: a maintained html2canvas fork that understands modern
    // colour syntax (oklch, color(), color-mix) — the base stylesheet uses it,
    // and stock html2canvas 1.4 throws on the first such colour it meets.
    var H2C_SRC = '/static/vendor/html2canvas-pro.min.js';
    var _h2cReady = null;

    function loadHtml2Canvas() {
        if (window.html2canvas) return Promise.resolve(window.html2canvas);
        if (!_h2cReady) {
            _h2cReady = new Promise(function (ok, bad) {
                var s = document.createElement('script');
                s.src = H2C_SRC;
                s.onload = function () { window.html2canvas ? ok(window.html2canvas) : bad(new Error('html2canvas missing')); };
                s.onerror = function () { _h2cReady = null; bad(new Error('could not load html2canvas')); };
                document.head.appendChild(s);
            });
        }
        return _h2cReady;
    }

    function cssVar(name, fallback) {
        try {
            var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
            return v || fallback;
        } catch (e) { return fallback; }
    }

    // Two frames: enough for a re-render triggered by the printing class (or
    // by the handler itself) to reach layout and paint before it's captured.
    function nextFrames() {
        return new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });
    }

    /**
     * Rasterise part of the widget to a PNG data URL. `target` defaults to the
     * widget's content (everything under the host's top bar). Elements that
     * match `opts.ignore`, the top bar itself, and anything marked
     * data-bw-print-hide are left out.
     */
    function snapshot(target, opts) {
        opts = opts || {};
        var el = typeof target === 'string' ? document.querySelector(target)
               : target || document.getElementById('bw-topbar-body') || document.body;
        if (!el) return Promise.reject(new Error('nothing to snapshot'));
        var scale = opts.scale || _printScale || 2;
        var ignoreSel = '.bw-topbar, [data-bw-print-hide], .bws-root' + (opts.ignore ? ', ' + opts.ignore : '');
        return loadHtml2Canvas().then(function (h2c) {
            return h2c(el, {
                scale: scale,
                backgroundColor: opts.background || cssVar('--bg', '#ffffff'),
                logging: false,
                useCORS: true,
                ignoreElements: function (n) {
                    try { return n.matches && n.matches(ignoreSel); } catch (e) { return false; }
                },
            });
        }).then(function (canvas) { return canvas.toDataURL('image/png'); });
    }

    function toDataUrl(img) {
        if (!img) return null;
        if (typeof img === 'string') return img;
        if (img.toDataURL) return img.toDataURL('image/png');   // a canvas
        return null;
    }

    // Canvases inside page blocks are converted here, so a handler can hand
    // back whatever it drew without encoding it itself.
    function normalisePages(pages) {
        if (!Array.isArray(pages)) return [];
        return pages.map(function (p) {
            if (!p || typeof p !== 'object') return null;
            var blocks = Array.isArray(p.blocks) ? p.blocks.map(function (b) {
                if (!b || typeof b !== 'object') return null;
                if (b.type === 'image') {
                    var w = b.width, h = b.height;
                    if (b.src && b.src.width && !w) { w = b.src.width; h = b.src.height; }
                    var src = toDataUrl(b.src);
                    return src ? { type: 'image', src: src, width: w || null, height: h || null } : null;
                }
                return { type: b.type || 'text', text: String(b.text == null ? '' : b.text),
                         mono: !!b.mono, tone: b.tone || null };
            }).filter(Boolean) : [];
            return { title: p.title ? String(p.title) : '', blocks: blocks,
                     columnWidth: +p.columnWidth > 0 ? +p.columnWidth : null };
        }).filter(Boolean);
    }

    /* ─── magnifier ─────────────────────────────────────────────── */
    // The host's magnifying lens draws the slide from canvases, but it can't
    // read an iframe's pixels. While the lens is over a widget the host asks
    // for a picture of it every few hundred ms; this answers with one (the
    // whole widget, bar included, as seen) as an ImageBitmap.
    var _lensBusy = false;
    function handleLens(d, source) {
        if (_lensBusy || !document.body) return;
        _lensBusy = true;
        var scale = Math.max(1, Math.min(4, +d.scale || 2));
        loadHtml2Canvas().then(function (h2c) {
            return h2c(document.body, {
                scale: scale,
                backgroundColor: null,
                logging: false,
                useCORS: true,
                width: window.innerWidth,
                height: window.innerHeight,
                ignoreElements: function (n) {
                    try { return n.matches && n.matches('.bws-root'); } catch (e) { return false; }
                },
            });
        }).then(function (canvas) {
            return (window.createImageBitmap ? createImageBitmap(canvas) : Promise.resolve(null))
                .then(function (bmp) {
                    var msg = { type: 'widget-lens-shot', requestId: d.requestId, bitmap: bmp };
                    try { (source || parent).postMessage(msg, '*', bmp ? [bmp] : []); } catch (e) {}
                });
        }).catch(function () { /* nothing to show — the lens keeps the slide */ })
          .then(function () { _lensBusy = false; });
    }

    var _printScale = 2;
    // A print copy is asked as soon as its iframe loads, but a widget whose
    // scripts come from a slow CDN may not have run yet: its handler isn't
    // registered, its stylesheet may still be loading, and a state posted to
    // it would arrive before anything is listening and be lost. So the request
    // carries the state, and nothing happens until the document is complete,
    // every stylesheet has applied and the fonts are in; only then is the
    // state handed over (as the widget-set-state message it already handles)
    // and the widget asked to draw.
    var READY_LIMIT_MS = 30000;
    function whenLoaded() {
        return new Promise(function (ok) {
            if (document.readyState === 'complete') return ok();
            window.addEventListener('load', function () { ok(); }, { once: true });
            setTimeout(ok, READY_LIMIT_MS);
        });
    }
    function whenStyled() {
        var links = [].slice.call(document.querySelectorAll('link[rel="stylesheet"]'));
        return Promise.all(links.map(function (l) {
            if (l.sheet) return null;
            return new Promise(function (ok) {
                l.addEventListener('load', ok, { once: true });
                l.addEventListener('error', ok, { once: true });
                setTimeout(ok, 10000);
            });
        }));
    }
    function whenFonts() {
        try { return document.fonts && document.fonts.ready ? document.fonts.ready : null; }
        catch (e) { return null; }
    }
    var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

    var _printing = {};   // requestId → true: the host re-sends until it hears back
    function handlePrint(d) {
        var reply = function (msg) {
            msg.type = 'widget-print-result';
            msg.requestId = d.requestId;
            msg.widgetId = cfg().id;
            post(msg);
        };
        post({ type: 'widget-print-ack', requestId: d.requestId });
        if (_printing[d.requestId]) return;
        _printing[d.requestId] = true;
        _printScale = d.scale || 2;
        var root = document.documentElement;

        whenLoaded().then(whenStyled).then(whenFonts).then(function () {
            if (d.state !== undefined) {
                // To ourselves, so it reaches the widget's own listener like
                // any host message would.
                try { window.postMessage({ type: 'widget-set-state', state: d.state }, '*'); } catch (e) {}
            }
            // Let the state apply and any re-render it starts settle.
            return wait(350);
        }).then(nextFrames).then(function () {
            if (!_printHandler) { reply({ ok: false, reason: 'unsupported' }); return; }
            root.classList.add('bw-printing');
            return nextFrames().then(function () {
                return _printHandler({ scale: _printScale });
            }).then(function (res) {
                res = res || {};
                return Promise.resolve(res.image).then(function (image) {
                    reply({ ok: true, image: toDataUrl(image), pages: normalisePages(res.pages) });
                });
            });
        }).catch(function (err) {
            console.warn('[widget] print failed', err);
            reply({ ok: false, reason: (err && err.message) || 'print failed' });
        }).then(function () { root.classList.remove('bw-printing'); });
    }

    var printApi = {
        register: function (fn) { _printHandler = typeof fn === 'function' ? fn : null; },
        snapshot: snapshot,
        /** The vendored html2canvas, loaded on first use. */
        html2canvas: loadHtml2Canvas,
        /** True inside the copy the host makes for printing. */
        get active() { return !!(window.BEAMER_PRINT || cfg().printMode); },
    };

    /* ─── wiring ────────────────────────────────────────────────── */

    window.addEventListener('message', function (e) {
        if (selfDispatch) return;   // our own local re-broadcast of widget-config
        var d = e.data || {};
        if (d.type === 'widget-open-settings')  { readSchema(); if (hasSettings) openPanel(); return; }
        if (d.type === 'widget-close-settings') { closePanel(true); exitEdit(); return; }
        if (d.type === 'widget-cleanup')        { exitEdit(); return; }
        if (d.type === 'widget-asset-saved')    { onAssetSaved(d); return; }
        if (d.type === 'widget-print')          { handlePrint(d); return; }
        if (d.type === 'widget-lens')           { handleLens(d, e.source); return; }
        if (d.type === 'widget-flush-files') {
            if (_flushHandler) { try { _flushHandler(); } catch (err) { console.warn('[widget] flush failed', err); } }
            return;
        }
        if (d.type === 'widget-config' && d.config) {
            // A live settings change carries the config item, not what the
            // renderer adds at build time — keep the pre-loaded notebook.
            var prevNb = cfg().notebookContent;
            window.WIDGET_CONFIG = d.config;
            if (d.live && prevNb !== undefined && d.config.notebookContent === undefined) {
                window.WIDGET_CONFIG.notebookContent = prevNb;
            }
            applyScale();
            syncScaleButtons();
            syncTitle();
            if (editing && !canEdit()) exitEdit();
            syncLayoutMode();
            announce();  // the id may only have arrived with this message
            return;
        }
        // The host moved or resized the widget's box (edited in the editor
        // while the iframe stayed alive).
        if (d.type === 'widget-layout') {
            var c = cfg();
            ['x', 'y', 'width', 'height'].forEach(function (k) {
                if (typeof d[k] === 'number') c[k] = d[k];
            });
            if (typeof d.display === 'string') c.display = d.display;
            else if ('display' in d) delete c.display;
            syncLayoutMode();
        }
    });

    // Public API for the widget itself. Everything a widget needs from the
    // host goes through here rather than hand-rolled postMessage.
    window.BeamerWidget = {
        config:        cfg,
        serverOrigin:  serverOrigin,
        serverUrl:     serverUrl,
        saveFile:      saveFile,
        onFlushFiles:  onFlushFiles,
        openSettings:  onEditButton,
        // Editing on the widget itself — see "edit mode" above.
        edit:          editApi,
        closeSettings: function () { closePanel(); },
        hasSettings:   function () { readSchema(); return hasSettings; },
        topbar:        topbarApi,
        name:          function (fallback) { readSchema(); return name(fallback); },
        fileName:      function (fallback, ext) { readSchema(); return fileName(fallback, ext); },
        print:         printApi,
        // 'full' or 'overlay' — how this widget is being shown. Listen for
        // the window's 'bw-display' event to hear about a change.
        display:       function () { readSchema(); return displayMode(); },
    };

    function init() {
        applyScale(); announce(); buildTopbar(); syncScaleButtons();
        watchBarControls(); syncLayoutMode();
    }

    init();
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init, { once: true });
    }
})();
</script>
<!-- bw-kit:end -->

<!-- Vendored by the Beamer+ server. Never call io() bare. -->
<script src="/static/vendor/socket.io.min.js"></script>

<style>
/* Tokens, reset, toolbar, buttons and inputs come from the shared widget base
   (static/css/widget-base.css). What's left here is the grid: sticky headers,
   a selection you can see from the back of the room, highlight tints, cells
   covered for a reveal, and a bar chart beside it. */

html, body { height: 100%; overflow: hidden; }

/* Highlight tints. Mixed into transparency rather than fixed pastels, so a
   highlighted cell reads on the dark deck as well as the light one. */
:root {
  --hl-1: #f5c518; --hl-2: #30a46c; --hl-3: #e5484d; --hl-4: #3e63dd; --hl-5: #8e4ec6;
  /* Chart series. One series uses the house ink; several need telling apart. */
  --series-1: #3e63dd; --series-2: #f5a524; --series-3: #30a46c; --series-4: #e5484d; --series-5: #8e4ec6; --series-6: #12a594;
}

/* ── Edit mode ──────────────────────────────────────────── */
/* The grid is the starting data: framed in the edit colour, with a line
   under it saying so. */
body.bw-editing #grid { outline: 1.5px dashed var(--edit-line); outline-offset: 2px; }
#ed-cap {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
  max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis;
  padding: 4px 10px; background: var(--bg); border-radius: var(--radius);
  pointer-events: none;
}

/* ── Toolbar ────────────────────────────────────────────── */
#filter { width: 150px; height: var(--ctl-h); padding: 0 9px; }
.bw-btn .sw { width: 11px; height: 11px; border-radius: 3px; border: 1px solid var(--border-med); }
#reveal-group[hidden] { display: none; }
#reveal-group { display: contents; }

/* ── Body ───────────────────────────────────────────────── */
#app  { flex: 1 1 auto; min-height: 0; display: flex; position: relative; }
#wrap {
  flex: 1 1 auto; min-width: 0;
  overflow: auto;
  outline: none;
  position: relative;
}
#wrap::-webkit-scrollbar { width: 8px; height: 8px; }
#wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
#wrap::-webkit-scrollbar-thumb:hover { background: var(--border-med); }

/* Fixed layout: column widths come from the colgroup, so a long value can't
   shove its neighbours around and a 500-row table lays out at once. */
#grid {
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
  font-size: var(--fs-body);
  color: var(--text);
  user-select: none;
}
