<title>Karnaugh Map — Beamer+</title>

<!-- Vendored by the Beamer+ server. Never load socket.io from a CDN, and never
     call io() bare — inside the srcdoc iframe that resolves to
     http://about/socket.io/, which an HTTPS deck blocks as mixed content. -->
<script src="/static/vendor/socket.io.min.js"></script>

<style>
/* Tokens, reset, toolbar, buttons, inputs and banners come from the shared
   widget base (static/css/widget-base.css). What's left here is this widget's
   own furniture: the step-by-step stage, the truth table, the map grid, and
   the group outlines drawn over it. */

/* ── Group colours ────────────────────────────────────────────────────────
   The one place in this widget where hue carries meaning: a group's outline
   on the map and the term it produced in the bottom-right have to be
   recognisably the same thing from the back of a room. Six is enough — a
   4-variable map never needs more in a minimal cover — and they cycle after
   that. Mid-saturation so they hold up against both a white and a dark deck.
   ====================================================================== */
#shell {
  --kg-0: #2563eb;
  --kg-1: #c0392b;
  --kg-2: #15803d;
  --kg-3: #b45309;
  --kg-4: #7c3aed;
  --kg-5: #0e7490;

  /* ── One face for every variable ───────────────────────────────────────
     A, B, C and D, the 0s and 1s, and the terms of the answer are the same
     symbols wherever they appear — in the equation box, the truth table
     header, the map's axis labels, the squares, the simplified expression —
     so they are set in one family at one weight everywhere, and only the
     SIZE changes between quadrants. Emphasis (this is the value we are about
     to group; this row is revealed) is carried by ink colour alone, never by
     a heavier weight, because a bolder cut reads as a different typeface
     from the back of a room.
     =================================================================== */
  --font-var: var(--font-mono);
  --wt-var:   500;

  /* Map cell size: grows with the room, but never so far that a 4-variable
     map stops fitting in a quarter of the slide. */
  --km-cell: clamp(30px, calc(36px * var(--u)), 76px);
  /* Still a slower climb than the content tokens — sixteen rows have to keep
     fitting a quarter of the slide as the presenter raises the size — but
     near enough the answer's size that the two read as one piece of work. */
  --tt-fs:   clamp(12px, calc(16px * var(--u)), 40px);
}

/* ── The stage ────────────────────────────────────────────────────────────
   One screen at a time, in the order the method is taught: say what the
   function is, watch the truth table fill in, watch the map fill in, then
   circle the groups. Each screen is a grid of the panels it needs; the
   panels themselves never move between screens, they are only shown or
   hidden, so every renderer below still has one element to draw into.
   ====================================================================== */

#stage-view {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Where you are, and how far there is to go — sized to be read from the
   back of the room, like the content it introduces. */
#stepper {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(8px * var(--u));
  padding: calc(14px * var(--u)) 16px calc(6px * var(--u));
  user-select: none;
}
#shell[data-stage="start"] #stepper { visibility: hidden; }
.st-item {
  display: inline-flex;
  align-items: center;
  gap: calc(8px * var(--u));
  padding: 0;
  border: 0;
  background: none;
  color: var(--text-3);
  font: inherit;
  font-size: calc(12px * var(--u));
  font-weight: 500;
  white-space: nowrap;
  cursor: default;
  transition: color var(--dur);
}
.st-item .st-n {
  width: calc(22px * var(--u));
  height: calc(22px * var(--u));
  flex: 0 0 auto;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: calc(10.5px * var(--u));
  font-weight: 600;
  border: 1.5px solid var(--border-med);
  background: var(--bg);
  color: var(--text-3);
  transition: background var(--dur), color var(--dur), border-color var(--dur);
}
.st-item .st-n svg { width: 62%; height: 62%; }
.st-item.is-done { color: var(--text-2); cursor: pointer; }
.st-item.is-done .st-n { background: var(--text-2); border-color: var(--text-2); color: var(--bg); }
.st-item.is-done:hover { color: var(--text); }
.st-item.is-current { color: var(--text); font-weight: 600; }
.st-item.is-current .st-n { background: var(--text); border-color: var(--text); color: var(--bg); }
.st-line { width: calc(36px * var(--u)); height: 1.5px; background: var(--border-med); flex: 0 0 auto; }
.st-line.is-done { background: var(--text-2); }
#shell.is-viewer .st-item { cursor: default; }

#stage {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  gap: 14px 22px;
  padding: 8px 22px 18px;
}
.panel {
  display: none;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
/* Panel labels and counters are for building the slide, not for the room:
   the step bar already says what each screen is. */
.panel-head {
  flex: 0 0 auto;
  display: none;
  align-items: center;
  gap: 8px;
  padding: 2px 2px 6px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  user-select: none;
}
.panel-head .count {
  font-family: var(--font-mono);
  letter-spacing: 0;
  margin-left: auto;
}
.panel-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  scrollbar-width: thin;
}
.panel-body::-webkit-scrollbar { width: 6px; height: 6px; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.panel-body.is-centred { display: flex; flex-direction: column; align-items: center; justify-content: center; }

/* Screen by screen: which panels, and where. */
#shell[data-stage="start"] #stage { grid-template-areas: "start"; grid-template-rows: 1fr; }
#shell[data-stage="start"] #p-start { display: flex; }

#shell[data-stage="input"].src-formula #stage { grid-template-areas: "input"; grid-template-rows: 1fr; }
#shell[data-stage="input"].src-table   #stage { grid-template-areas: "input" "table"; grid-template-rows: auto 1fr; }
#shell[data-stage="input"] #p-input { display: flex; }
#shell[data-stage="input"].src-table #p-table { display: flex; }

#shell[data-stage="table"] #stage { grid-template-areas: "echo" "table"; grid-template-rows: auto 1fr; }
#shell[data-stage="table"] #p-echo,
#shell[data-stage="table"] #p-table { display: flex; }

#shell[data-stage="kmap"] #stage { grid-template-areas: "table map"; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.25fr); }
#shell[data-stage="kmap"] #p-table,
#shell[data-stage="kmap"] #p-map { display: flex; }

#shell[data-stage="groups"] #stage { grid-template-areas: "map" "answer"; grid-template-rows: 1fr auto; }
#shell[data-stage="groups"] #p-map,
#shell[data-stage="groups"] #p-answer { display: flex; }

#p-start  { grid-area: start; }
#p-input  { grid-area: input; }
#p-echo   { grid-area: echo; }
#p-table  { grid-area: table; }
#p-map    { grid-area: map; }
#p-answer { grid-area: answer; }

/* Each new screen eases in rather than snapping. */
@keyframes panel-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}
#stage.is-entering .panel { animation: panel-in 0.38s cubic-bezier(.2,.7,.2,1) both; }
#stage.is-entering .panel:nth-of-type(2) { animation-delay: 0.06s; }
#stage.is-entering .panel:nth-of-type(3) { animation-delay: 0.12s; }
#stage.is-entering .panel:nth-of-type(4) { animation-delay: 0.18s; }

/* ── Start: two ways in ─────────────────────────────────────────────── */
#p-start { align-items: center; justify-content: center; padding-bottom: 6%; }
.start-cards {
  display: flex;
  gap: calc(16px * var(--u));
  flex-wrap: wrap;
  justify-content: center;
}
@keyframes card-in {
  from { opacity: 0; transform: translateY(22px) scale(0.96); }
  to   { opacity: 1; transform: none; }
}
.start-card {
  width: calc(190px * var(--u));
  max-width: 44vw;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: calc(20px * var(--u)) calc(16px * var(--u)) calc(18px * var(--u));
  border: 1px solid var(--border);
  border-radius: var(--radius-lg, 10px);
  background: var(--bg);
  color: var(--text);
  font: inherit;
  cursor: pointer;
  animation: card-in 0.5s cubic-bezier(.2,.8,.2,1) backwards;
  animation-delay: calc(0.12s + var(--i) * 0.09s);
  transition: border-color 0.12s ease;
}
/* The card stays put under the pointer; only its edge darkens. */
.start-card:hover { border-color: var(--text); }
.start-card:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.start-card svg {
  width: calc(64px * var(--u));
  height: calc(64px * var(--u));
  margin-bottom: 6px;
}
.sc-title { font-size: calc(12.5px * var(--u)); font-weight: 600; }

/* The icons hold still: the card itself answers the hover. */
.ic-ink   { stroke: var(--text); }
.ic-soft  { fill: var(--bg-subtle); stroke: var(--border-med); }
.ic-caret { stroke: var(--text); }
.ic-hot   { fill: var(--text); opacity: 0.85; }
.ic-dot   { fill: var(--text-3); }
.ic-dot.on { fill: var(--bg); }

/* ── Input ──────────────────────────────────────────────────────────── */
#p-input .panel-body { padding-bottom: 4%; }
#shell.src-table #p-input .panel-body { padding-bottom: 0; flex-direction: row; gap: 14px; }
/* The table below already carries the heading. */
#shell.src-table #p-input .panel-head { display: none; }
#expr-block { width: min(100%, 760px); }
#shell.src-formula #table-block,
#shell.src-table   #expr-block { display: none; }


/* ── The formula, echoed while its rows are found ───────────────────── */
#echo {
  width: 100%;
  text-align: center;
  font-family: var(--font-var);
  font-weight: var(--wt-var);
  font-size: calc(17px * var(--u));
  line-height: 1.5;
}
#echo .lhs  { color: var(--text-2); }
#echo .plus { color: var(--text-3); padding: 0 0.25em; }
#echo .eterm {
  color: var(--text-3);
  padding: 1px 4px;
  border-radius: 4px;
  transition: color 0.2s, background 0.2s;
}
#echo .eterm.is-done    { color: var(--text); }
#echo .eterm.is-current { color: var(--text); background: var(--accent-bg); box-shadow: inset 0 -2px 0 var(--text); }

/* ── The formula box ──────────────────────────────────────────────────────
   One box, and the one thing that has to be said back: whether it parsed.
   ====================================================================== */

#table-block { width: 100%; }

/* The "F =" belongs to the equation, not to a label beside it, so it lives
   inside the box and the input is drawn without a frame of its own. */
#eq-box {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: calc(10px * var(--u)) calc(14px * var(--u));
  background: var(--bg-subtle);
  border: 1px solid var(--border-med);
  border-radius: var(--radius);
  transition: border-color var(--dur);
}
#eq-box:focus-within { border-color: var(--accent); }


#expr-input {
  flex: 1 1 auto;
  min-width: 0;
  padding: 0;
  border: none;
  background: none;
  color: var(--text);
  font-family: var(--font-var);
  font-weight: var(--wt-var);
  font-size: calc(21px * var(--u));
}
/* Only a hint of what to type: it must never read as a formula already there. */
#expr-input::placeholder { color: var(--text-3); opacity: 0.55; }
#expr-input:focus { outline: none; }

/* Truth-table input: the width of the table, and how to clear it. The table
   itself, just below, is the rest of the control. */
#vars-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
.mini-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  white-space: nowrap;
  margin-right: 2px;
}
#vars-row .bw-btn { font-family: var(--font-var); min-width: var(--ctl-h); }

/* SOP / POS: a two-position switch whose dark thumb slides to the form in
   use. */
.mode-switch {
  position: relative;
  flex: 0 0 auto;
  display: inline-grid;
  grid-template-columns: 1fr 1fr;
  height: var(--ctl-h);
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: calc(var(--ctl-h) / 2);
  background: var(--bg-subtle);
  font: inherit;
  cursor: pointer;
}
.mode-switch:disabled { cursor: default; }
.ms-opt {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 42px;
  padding: 0 8px;
  font-size: var(--fs-chrome);
  font-weight: 600;
  color: var(--text-3);
  transition: color 0.2s ease;
}
.ms-thumb {
  position: absolute;
  top: 2px; bottom: 2px; left: 2px;
  width: calc(50% - 2px);
  border-radius: calc(var(--ctl-h) / 2 - 2px);
  background: var(--text);
  transition: transform 0.22s cubic-bezier(.3,.7,.3,1);
}
.mode-switch[aria-checked="true"] .ms-thumb { transform: translateX(100%); }
.mode-switch[aria-checked="false"] .ms-opt:first-of-type,
.mode-switch[aria-checked="true"]  .ms-opt:last-of-type { color: var(--bg); }
@media (prefers-reduced-motion: reduce) { .ms-thumb, .ms-opt { transition: none; } }

/* .bw-banner is display:flex, which outranks the browser's own rule for
   [hidden] — so say it here, or an empty error bar sits there permanently. */
#parse-error { margin-top: 12px; width: 100%; }
#parse-error[hidden] { display: none; }

.op { color: var(--text-3); padding: 0 1px; }

/* Overbar complement — the textbook look, when the presenter prefers it. */
/* Variable indices (a0 → a₀). Zero line-height so a subscript never pushes
   its row taller than its neighbours. */
sub { font-size: 0.68em; line-height: 0; vertical-align: -0.28em; }
.ovl { text-decoration: overline; text-decoration-thickness: 1px; text-underline-offset: 2px; }

/* ── The truth table ──────────────────────────────────────────────────── */

#q-table-body { display: flex; flex-direction: column; }
/* Auto margins centre the table like the map beside it, and still let it
   scroll from the top when it's taller than the panel. */
#tt-wrap { display: flex; gap: 14px; align-items: flex-start; justify-content: center; margin: auto 0; }

.tt {
  border-collapse: collapse;
  font-family: var(--font-var);
  font-weight: var(--wt-var);
  font-size: var(--tt-fs);
  font-variant-numeric: tabular-nums;
}
.tt th, .tt td {
  padding: 0 0.45em;
  text-align: center;
  border-bottom: 1px solid var(--border);
  line-height: 1.3;
  font-weight: var(--wt-var);
}
.tt th {
  color: var(--text-3);
  border-bottom: 1px solid var(--border-med);
}
.tt .c-idx { color: var(--text-3); text-align: right; padding-right: 0.6em; font-size: 0.8em; }
.tt .c-out { border-left: 1px solid var(--border); padding-left: 0.6em; }

/* Column names are typed over in place while the table is being entered. */
.tt.is-editable th.th-name {
  cursor: text;
  min-width: 1.1em;
  border-radius: 4px 4px 0 0;
  color: var(--text-2);
  transition: background var(--dur);
}
.tt.is-editable th.th-name:hover { background: var(--bg-subtle); }
.tt.is-editable th.th-name:focus {
  outline: none;
  color: var(--text);
  background: var(--accent-bg);
  box-shadow: inset 0 -2px 0 var(--accent);
}

/* With truth-table input, the F column is the control: click it to cycle. */
.tt.is-editable .c-out { cursor: pointer; }
.tt.is-editable tbody .c-out:hover { background: var(--accent-bg); }

/* A row not reached yet keeps its shape but says nothing.
   Once revealed, full ink marks the value the map is about to group — the 1s
   of a sum of products, the 0s of a product of sums — and everything else
   stays quiet. */
.tt tr.row { color: var(--text-3); }
.tt tr.row .c-out { color: var(--text-3); }
.tt tr.row.is-on { color: var(--text); }
.tt tr.row.is-on .c-out       { color: var(--text-3); }
.tt tr.row.is-on .c-out.v-hot { color: var(--text); }
.tt tr.row.is-on .c-out.vx    { color: var(--warn); }
.tt td { transition: background 0.2s, color 0.2s; }
.tt tr.row.is-current td { background: var(--accent-bg); }
@keyframes val-in { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }
.tt tr.row.is-current .c-out { animation: val-in 0.28s cubic-bezier(.2,.9,.3,1.3); }
.tt tr.row.is-source td  { background: var(--accent-bg); }

/* ── The map ──────────────────────────────────────────────────────────── */

#km-wrap {
  display: inline-grid;
  gap: 0;
  font-family: var(--font-var);
  font-weight: var(--wt-var);
}

.km-corner, .km-lbl {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(12px * var(--u));
  color: var(--text-3);
  padding: 2px 5px;
}
.km-corner { font-size: calc(10px * var(--u)); gap: 2px; }
.km-lbl.col { align-items: flex-end; padding-bottom: 4px; }
.km-lbl.row { justify-content: flex-end; padding-right: 6px; }

.km-cell {
  position: relative;
  width: var(--km-cell);
  height: var(--km-cell);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(18px * var(--u));
  font-weight: var(--wt-var);
  color: var(--text-3);
  background: var(--bg);
  transition: background var(--dur), color var(--dur), border-color var(--dur);
}
.km-cell .v { opacity: 0; transition: opacity 0.18s; }
.km-cell.is-on .v { opacity: 1; }
.km-cell.is-on       { color: var(--text-3); }
.km-cell.is-on.v-hot { color: var(--text); }
.km-cell.is-on.vx    { color: var(--warn); }
.km-cell.is-target  { background: var(--accent-bg); border-color: var(--border-med); }
@keyframes cell-in { from { transform: scale(0.3); opacity: 0; } to { transform: none; opacity: 1; } }
.km-cell.is-target .v { animation: cell-in 0.32s cubic-bezier(.2,.9,.3,1.35); }
@keyframes ring-in { from { opacity: 0; transform: scale(1.12); } to { opacity: 1; transform: none; } }
.grp.is-new { animation: ring-in 0.4s cubic-bezier(.2,.8,.2,1); }

/* m-number in the corner: which truth-table row this square is. */
#shell:not(.show-m) .km-cell .m,
#shell:not(.show-m) .tt .c-idx { display: none; }
#status { display: none; }
.km-cell .m {
  position: absolute;
  top: 1px; left: 3px;
  font-size: calc(8px * var(--u));
  color: var(--text-3);
  opacity: 0.75;
  pointer-events: none;
}

/* Manual grouping: the cells become the control. */
#km-wrap.is-picking .km-cell { cursor: pointer; }
#km-wrap.is-picking .km-cell:hover { background: var(--bg-subtle); }
/* Dashed, so a square picked by hand never reads as a group that has already
   been drawn — those outlines are solid and coloured. */
.km-cell.is-picked {
  background: var(--accent-bg);
  outline: 2px dashed var(--text);
  outline-offset: -2px;
}

/* One outline per group per cell, inset by how many groups already overlap
   this square so two groups over the same 1 stay separately readable. Borders
   are drawn only on the sides where the neighbouring square is NOT in the
   group, which is what makes a group that wraps round the edge of the map
   appear as two pieces — exactly how it is drawn by hand. */
.grp {
  position: absolute;
  border: 0 solid var(--c);
  border-top-width: 0; border-right-width: 0; border-bottom-width: 0; border-left-width: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
}
.grp.is-shown { opacity: 1; }
.grp.g-t { border-top-width: 2.5px; }
.grp.g-r { border-right-width: 2.5px; }
.grp.g-b { border-bottom-width: 2.5px; }
.grp.g-l { border-left-width: 2.5px; }
.grp.is-faded { opacity: 0.22; }

/* ── The simplified expression ────────────────────────────────────────────
   Just the equation. Each term carries the colour of the group it came from,
   so the link back to the map is the term itself rather than a row of
   bookkeeping beside it.
   ====================================================================== */

#q-terms-body { padding: 6px 0 4px; }

#equation {
  width: 100%;
  font-family: var(--font-var);
  font-weight: var(--wt-var);
  font-size: calc(22px * var(--u));
  line-height: 1.45;
  text-align: center;
  word-break: break-word;
  hyphens: none;
}
#equation .lhs  { color: var(--text-2); font-weight: 400; }
#equation .plus { color: var(--text-3); font-weight: 400; padding: 0 0.3em; }

/* The one thing in this widget where hue is load-bearing: this term is that
   ring on the map. Clicking one dims every other ring so a single group can
   be talked about on its own. */
@keyframes term-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#equation .gterm.is-new { display: inline-block; animation: term-in 0.35s ease both; }
#equation .gterm {
  color: var(--c);
  cursor: pointer;
  border-radius: 3px;
  padding: 0 2px;
  transition: background var(--dur);
}
#equation .gterm:hover     { background: var(--bg-subtle); }
#equation .gterm.is-focus  { background: var(--accent-bg); }
#shell.is-viewer #equation .gterm { cursor: default; }

/* Terms the presenter built by hand, kept visibly apart from the solution. */
#equation .mine {
  display: block;
  margin-top: 10px;
  font-size: calc(14px * var(--u));
}
#equation .mine .tag {
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-right: 8px;
  vertical-align: middle;
}

/* Manual grouping readout */
#manual-box { width: 100%; margin-top: 10px; display: none; }
#manual-box.is-live { display: block; }
#manual-line {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  font-family: var(--font-var);
  font-weight: var(--wt-var);
  font-size: calc(11px * var(--u));
  color: var(--text-2);
}
#manual-line strong { font-weight: var(--wt-var); color: var(--text); }
#manual-line .ok  { color: var(--ok); }
#manual-line .bad { color: var(--err); }
#manual-line .grow { flex: 1 1 auto; }

#shell { position: relative; }

@media (prefers-reduced-motion: reduce) {
  .km-cell .v, .grp { transition: none; }
  #stage.is-entering .panel, .start-card,
  .km-cell.is-target .v, .grp.is-new, .tt tr.row.is-current .c-out,
  #equation .gterm.is-new { animation: none; }
}
</style>
</head>
<body>
