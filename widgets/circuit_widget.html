.pal-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.pal-item {
  position:relative; background:var(--bg); border:1px solid var(--border); border-radius:var(--r);
  padding:6px 3px 4px; display:flex; flex-direction:column; align-items:center; gap:2px;
  cursor:grab; font:inherit; color:inherit;
  transition:background .1s, border-color .1s, transform .1s, box-shadow .1s;
}
.pal-item:hover { background:#fff; border-color:var(--border-hi); transform:translateY(-1px); box-shadow:var(--shadow); }
.pal-item:active { cursor:grabbing; transform:none; box-shadow:none; }
.pal-label { font-size:9.5px; font-family:var(--mono); color:var(--ink-2); letter-spacing:-.01em; }
.pal-empty { font-size:11px; color:var(--ink-3); padding:4px 2px 2px; }
.pal-del-btn {
  position:absolute; top:-5px; right:-5px; z-index:1;
  width:15px; height:15px; border-radius:50%; padding:0;
  background:var(--bg); border:1px solid var(--border-md); color:var(--ink-2);
  display:flex; align-items:center; justify-content:center; cursor:pointer; line-height:1;
  opacity:0; transition:opacity .12s, background .1s, border-color .1s, color .1s;
}
.pal-item:hover .pal-del-btn { opacity:1; }
.pal-del-btn:hover { background:var(--danger); border-color:var(--danger); color:#fff; }
.pal-del-btn svg { display:block; pointer-events:none; }

/* ───────────────────────── canvas ───────────────────────── */
/* Board above, timing diagram (when open) below. */
.stage { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
.canvas-wrap { flex:1; position:relative; min-width:0; min-height:0; background:var(--bg); }
.canvas-wrap::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(26,26,24,.05), inset 0 0 60px rgba(26,26,24,.02);
}
.canvas { display:block; }
.wiring-badge {
  position:absolute; left:50%; transform:translateX(-50%); top:10px; z-index:22;
  display:flex; align-items:center; gap:8px; pointer-events:none;
  background:rgba(26,26,24,.9); color:#fff; padding:5px 11px; border-radius:999px;
  font-size:11.5px; font-weight:500; box-shadow:var(--shadow-lg);
}
.wiring-badge kbd {
  font-family:var(--mono); font-size:9.5px; background:rgba(255,255,255,.16);
  padding:1px 4px; border-radius:3px; border:1px solid rgba(255,255,255,.18);
}
/* With no status bar to narrate into, a refused connection says its piece
   right where the eye is — over the board, then fades out. */
.wiring-badge.warn { background:var(--danger); top:46px; animation:toastIn .14s ease-out; }
@keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(-5px); } }
.empty-hint {
  position:absolute; inset:0; display:grid; place-items:center; pointer-events:none;
}
.empty-card {
  text-align:center; color:var(--ink-3); max-width:280px;
}
.empty-card h3 { margin:0 0 4px; font-size:13.5px; font-weight:600; color:var(--ink-2); }
.empty-card p  { margin:0; font-size:11.5px; line-height:1.5; }

/* ───────────────────── selection panel ─────────────────────
   Settings for whatever's selected live in the toolbar, not a card over
   the board — so nothing on the canvas ever gets covered, and the eye
   doesn't have to jump between the selection and its controls. Every part
   has at most one thing worth editing, so the panel is always a single
   compact row: a label field, a bit width, or a rate slider. */
.sel-close {
  width:19px; height:19px; border-radius:5px; padding:0; flex:0 0 auto;
  display:grid; place-items:center; background:transparent; border:1px solid transparent;
  color:var(--ink-3); cursor:pointer; transition:background .1s, color .1s, border-color .1s;
}
.sel-close:hover { background:var(--panel-2); border-color:var(--border); color:var(--ink); }
.sel-key {
  font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); flex:0 0 auto;
}
.sel-note { font-size:10.5px; color:var(--ink-3); line-height:1.4; margin:8px 0 0; }
.prop-input {
  width:118px; height:26px; padding:0 8px; border-radius:var(--r); border:1px solid var(--border);
  font:inherit; font-size:12px; background:var(--bg); color:var(--ink); outline:none;
  transition:border-color .12s, box-shadow .12s;
}
.prop-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.mini-btn {
  height:24px; padding:0 8px; border:1px solid var(--border); background:var(--bg);
  border-radius:var(--r-sm); color:var(--ink-2); cursor:pointer; font-size:11px;
  display:inline-flex; align-items:center; gap:5px;
  transition:background .12s, border-color .12s, color .12s;
}
.mini-btn:hover { background:var(--panel-2); border-color:var(--border-hi); color:var(--ink); }
.mini-btn.warn:hover { background:var(--danger-soft); border-color:#fecaca; color:var(--danger); }
.hint-list { margin:0; padding:0; list-style:none; }
.hint-list li { display:flex; align-items:baseline; gap:8px; padding:4px 0; font-size:12px; color:var(--ink-2); line-height:1.45; }
.hint-cols { display:grid; grid-template-columns:1fr 1fr; gap:0 22px; }
kbd.key {
  font-family:var(--mono); font-size:9.5px; font-weight:500; color:var(--ink);
  background:linear-gradient(#fff,#f2f2ef); border:1px solid var(--border-md);
  border-bottom-width:2px; border-radius:4px; padding:1px 4px; flex:0 0 auto;
  min-width:16px; text-align:center; white-space:nowrap;
}
.st-mono { font-family:var(--mono); font-size:10.5px; color:var(--ink-2); white-space:nowrap; }
/* ── selection panel, now living in the toolbar itself ──────────────────
   Same fields the floating card used to show, just laid out as another
   toolbar group so the eye doesn't have to jump down to the canvas — and
   nothing on the board gets covered while it's open. */
.tb-selpanel { display:flex; align-items:center; gap:6px; padding:2px 8px 2px 9px; flex:0 0 auto;
  background:var(--panel-2); border:1px solid var(--border); border-radius:var(--r); }
.tb-selpanel .sel-key:first-child { color:var(--ink); opacity:.7; }
.tb-clock {
  font-family:var(--mono); font-size:11px; color:var(--ink-2);
  background:var(--bg); border:1px solid var(--border); border-radius:var(--r);
  height:var(--ctl-h); padding:0 10px; flex:0 0 auto; display:inline-flex; align-items:center; gap:6px;
  cursor:pointer; transition:background .12s, border-color .12s, color .12s;
}
.tb-clock:hover { background:var(--bg); border-color:var(--border-hi); color:var(--ink); }
.tb-clock.paused { background:var(--high-soft); border-color:#f3d590; color:#7c4a03; }
.tb-clock b { font-weight:500; color:inherit; font-variant-numeric:tabular-nums; }
/* Neutral while it ticks, amber when it's stopped — so amber always means
   "something is happening here", on the board and in the chrome alike. */
.tb-clock i { width:5px; height:5px; border-radius:50%; background:var(--ink-3); flex:0 0 auto; }
.tb-clock.paused i { background:var(--high); }
/* Amber while halted, same as the clock read-out: "time is stopped here". */
.bw-btn.tb-run.paused { background:var(--high-soft); border-color:#f3d590; color:#7c4a03; }

/* ───────────────────────── modal ───────────────────────── */
.modal-bg { position:fixed; inset:0; background:rgba(26,26,24,.34); backdrop-filter:blur(3px); display:grid; place-items:center; z-index:100; }
.modal { background:var(--bg); border-radius:var(--r-xl); padding:18px 20px 20px; width:420px; max-width:calc(100vw - 32px); box-shadow:var(--shadow-lg); border:1px solid var(--border-md); }
.modal-title { font-size:15px; font-weight:600; margin-bottom:3px; }
.modal-sub { font-size:11.5px; color:var(--ink-2); margin-bottom:14px; }
.dialog-section-title { font-size:9.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin:14px 0 6px; }
.dialog-section-title:first-of-type { margin-top:0; }
.file-btn { display:inline-flex; align-items:center; justify-content:center; width:100%; margin-top:8px; }
.import-error { font-size:11.5px; color:var(--danger); margin-top:9px; white-space:pre-line; background:var(--danger-soft); border:1px solid #fecaca; border-radius:var(--r); padding:7px 9px; }
.text-input { width:100%; padding:8px 10px; border-radius:var(--r); border:1px solid var(--border); font:inherit; font-size:13px; background:var(--bg); color:var(--ink); outline:none; transition:border-color .12s, box-shadow .12s; }
.text-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.json-input { font-family:var(--mono); font-size:12px; resize:vertical; }
.dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.btn { font-family:var(--ui); font-size:12.5px; font-weight:500; height:30px; padding:0 13px; border-radius:var(--r); border:1px solid var(--border-md); cursor:pointer; transition:background .12s, border-color .12s, color .12s; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.btn:disabled { opacity:.35; cursor:not-allowed; }
.btn.ghost   { background:var(--bg); color:var(--ink); }
.btn.ghost:hover:not(:disabled) { background:var(--panel-2); border-color:var(--border-hi); }
.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn.primary:hover:not(:disabled) { background:var(--accent-2); border-color:var(--accent-2); }
.btn.subtle  { background:var(--bg); color:var(--ink-2); flex:1; }
.btn.subtle:hover { background:var(--panel-2); color:var(--ink); border-color:var(--border-hi); }
.btn.warn    { background:var(--bg); color:var(--danger); border-color:#fecaca; flex:1; }
.btn.warn:hover { background:var(--danger-soft); border-color:var(--danger); }
.bw-btn.tb-toggle.on { background:var(--panel-2); border-color:var(--border-hi); color:var(--ink); }

.import-choices { display:flex; flex-direction:column; gap:8px; }
.import-choice {
  text-align:left; background:var(--bg); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:12px 14px; cursor:pointer; font:inherit; color:inherit;
  transition:background .12s, border-color .12s, transform .12s, box-shadow .12s;
}
.import-choice:hover { background:var(--panel); border-color:var(--border-hi); transform:translateY(-1px); box-shadow:var(--shadow); }
.import-choice-title { font-weight:600; font-size:13px; }
.import-choice-sub { font-size:11.5px; color:var(--ink-2); margin-top:2px; }

/* ───────────────────────── timing diagram ─────────────────────────
   A strip under the board. The header is DOM (signal picker, window,
   close); the traces are one canvas redrawn every frame so they scroll
   with simulation time and stop dead when the sim is halted. */
.timing {
  flex:0 0 auto; max-height:46%; min-height:0;
  display:flex; flex-direction:column;
  background:var(--bg); border-top:1px solid var(--border-md);
}
.tm-head {
  flex:0 0 auto; display:flex; align-items:center; gap:6px;
  padding:5px 8px 5px 10px; border-bottom:1px solid var(--border);
  overflow-x:auto; scrollbar-width:none;
}
.tm-head::-webkit-scrollbar { display:none; }
.timing.is-closed {
  flex-direction:row; align-items:center; gap:8px; padding:4px 9px;
  cursor:pointer; background:var(--panel);
}
.timing.is-closed:hover { background:var(--bg-subtle); }
.tm-title { font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); flex:0 0 auto; margin-right:4px; }
.tm-group { display:flex; align-items:center; gap:4px; flex:0 0 auto; }
.tm-group-key { font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-right:1px; }
.tm-chip {
  height:22px; padding:0 8px; border-radius:999px; cursor:pointer; flex:0 0 auto;
  font-family:var(--font-mono); font-size:11px; color:var(--ink-3);
  background:transparent; border:1px solid var(--border);
  display:inline-flex; align-items:center; gap:5px;
  transition:background .1s, border-color .1s, color .1s;
}
.tm-chip:hover { border-color:var(--border-hi); color:var(--ink-2); }
.tm-chip i { width:6px; height:6px; border-radius:50%; border:1px solid currentColor; flex:0 0 auto; }
.tm-chip.on { background:var(--panel-2); border-color:var(--border-hi); color:var(--ink); }
.tm-chip.on i { background:var(--high); border-color:var(--high-2); }
.tm-link {
  background:none; border:none; padding:0 3px; cursor:pointer; flex:0 0 auto;
  font-size:10.5px; color:var(--ink-3); text-decoration:underline; text-underline-offset:2px;
}
.tm-link:hover { color:var(--ink); }
.tm-body { flex:1 1 auto; min-height:0; overflow-y:auto; position:relative;
  scrollbar-width:thin; scrollbar-color:var(--border-md) transparent; }
.tm-body::-webkit-scrollbar { width:5px; }
.tm-body::-webkit-scrollbar-thumb { background:var(--border-md); border-radius:4px; }
.tm-body canvas { display:block; cursor:crosshair; }
.tm-empty { padding:14px 12px 16px; font-size:11.5px; color:var(--ink-3); }

/* ───────────────────────── narrow layouts ─────────────────────────
   Widgets get embedded at all sorts of sizes, so the chrome sheds its
   least essential parts before anything starts overlapping. */
@media (max-width: 1080px) {
  .tb-clock { display:none; }
}
@media (max-width: 920px) {
  .bw-btn .bl { display:none; }
  .bw-btn:has(.bl) { width:var(--ctl-h); padding:0; }
  .palette { width:168px; }
}
@media (max-width: 760px) {
  .palette { width:150px; }
  .pal-grid { grid-template-columns:1fr; }
}

/* ───────────────────────── canvas handles ───────────────────────── */
.rotate-handle circle { fill:var(--bg); stroke:var(--border-hi); transition:fill .1s, stroke .1s; }
.rotate-handle:hover circle { fill:var(--ink); stroke:var(--ink); }
.rotate-handle path { stroke:var(--ink-2); transition:stroke .1s; }
.rotate-handle:hover path { stroke:#fff; }
.kill-handle circle { fill:var(--bg); stroke:var(--border-hi); transition:fill .1s, stroke .1s; }
.kill-handle:hover circle { fill:var(--danger); stroke:var(--danger); }
.kill-handle path { stroke:var(--ink-2); transition:stroke .1s; }
.kill-handle:hover path { stroke:#fff; }

/* ───────────────────────── slide-native look ─────────────────────────
   On the slide the board reads like a circuitikz figure: ink outlines on
   pale fills, typewriter labels, no app chrome around it. Signal state is
   the one colour: a HIGH wire is an ink line run over with the deck's
   highlighter yellow, a LOW wire is grey; switches, lamps and pins that are
   on are filled in the highlighter with an ink edge.
   These tokens are set on the board, the parts panel and the timing strip
   only, so the bar above (which shares some of the names) is untouched. */
.canvas-wrap, .palette, .timing {
  --gate-fill:  var(--sn-node);
  --gate-edge:  var(--sn-ink);
  --high:       var(--sn-hl);
  --high-2:     var(--sn-ink);
  --high-soft:  var(--sn-hl);
  --wire-hl:    var(--sn-hl);
  --wire-on:    var(--sn-on-hl);   /* the line on top of the highlighter */
  --low:        var(--sn-cap);
  --low-p:      var(--sn-cap);
  --border-hi:  var(--sn-cap);
  --panel-2:    var(--sn-node);
  --grid:       color-mix(in srgb, var(--sn-ink) 5%, var(--bg));
  --grid-major: color-mix(in srgb, var(--sn-ink) 9%, var(--bg));
}
.canvas-wrap::after { box-shadow: none; }

/* Parts panel: the same nodes as on the board, captions in grey. */
.palette { background: var(--bg); border-right: 1px solid var(--sn-faint); }
.palette.is-closed:hover { background: var(--sn-node); }
.pal-item { background: var(--bg); border: 1.5px solid var(--sn-faint); border-radius: var(--sn-r); }
.pal-item:hover { background: var(--sn-node); border-color: var(--sn-ink); box-shadow: none; }
.pal-label { color: var(--sn-ink); font-size: 11px; }
.pal-group-head, .pal-rail-label { color: var(--sn-cap); letter-spacing: .04em; }
.pal-group-head:hover { color: var(--sn-ink); }
.pal-search input { border: 1.5px solid var(--sn-faint); border-radius: var(--sn-r); }
.pal-search input:focus { border-color: var(--sn-ink); box-shadow: none; }
.pal-empty, .empty-card { color: var(--sn-cap); }
.empty-card h3 { color: var(--sn-ink); }

/* Timing strip: a pgfplots-like trace under the board. */
.timing { border-top: 1px solid var(--sn-faint); }
.timing.is-closed { background: var(--bg); }
.timing.is-closed:hover { background: var(--sn-node); }
.tm-head { border-bottom-color: color-mix(in srgb, var(--sn-ink) 10%, transparent); }
.tm-title, .tm-group-key, .tm-link, .tm-empty { color: var(--sn-cap); }
.tm-chip { border: 1.5px solid var(--sn-faint); color: var(--sn-cap); }
.tm-chip.on { background: var(--bg); border-color: var(--sn-ink); color: var(--sn-ink); }
.tm-chip.on i { background: var(--sn-hl); border-color: var(--sn-ink); }

/* On-board badges and handles. */
.rotate-handle circle, .kill-handle circle { stroke: var(--sn-cap); }

/* The top bar, live: its own segmented controls and clock drawn like the
   kit's live bar buttons (light outline, ink text, the chosen one bold on a
   pale fill), so every widget's bar reads the same. */
body:not(.bw-editing) .bw-topbar .seg { border-color: var(--border-med); }
body:not(.bw-editing) .bw-topbar .seg-btn { color: var(--text); }
body:not(.bw-editing) .bw-topbar .seg-btn + .seg-btn { border-left-color: var(--border-med); }
body:not(.bw-editing) .bw-topbar .seg-btn:hover:not(:disabled) { background: var(--sn-node); color: var(--text); }
body:not(.bw-editing) .bw-topbar .seg-btn.on,
body:not(.bw-editing) .bw-topbar .seg-btn.on:disabled:hover { background: var(--sn-node); color: var(--text); font-weight: 700; box-shadow: inset 0 0 0 1px var(--text); }
body:not(.bw-editing) .bw-topbar .tb-clock:not(.paused) { border-color: var(--border-med); color: var(--text); }
</style>

<script>
/* ═══ MESSAGE BUFFER ════════════════════════════════════════════════════════
   Beamer+ posts widget-config and widget-set-state the instant the iframe
   fires `load`. This widget renders through ReactDOM.createRoot(), which
   commits asynchronously — so at that moment the app's own message listener
   usually doesn't exist yet, and a saved circuit would be dropped on the
   floor. Worse, the now-empty board is what the *next* save reports back,
   quietly overwriting the good state in the deck.

   So this tiny listener is registered during parse, long before React, and
   parks any protocol message it sees. App drains the queue on mount, in
   order, and then takes over. Nothing else in the widget depends on it, so
   there's no load-order requirement beyond "before the app". */
(function () {
  var KINDS = { 'widget-config':1, 'widget-set-state':1, 'widget-get-state':1 };
  window.__widgetInbox = [];
  window.__widgetAppReady = false;
  window.addEventListener('message', function (e) {
    if (!e.data || !KINDS[e.data.type]) return;
    if (window.__widgetAppReady) return;   // the app is listening for itself now
    window.__widgetInbox.push(e.data);
  });
})();
</script>

<body>
<!-- Static so Beamer+ can adopt it into its shared bar on load; React
     renders the controls into #tb-slot through a portal. -->
<div id="toolbar" class="bw-toolbar" data-bw-topbar>
  <span class="bw-toolbar-title">Circuit Simulator</span>
  <div class="bw-sep"></div>
  <span id="tb-slot"></span>
</div>
<div id="root"></div>

<script>
/* ═══ THE BOARD AS AN IMAGE ═══════════════════════════════════════════════
   For Beamer+'s notes PDF (the deck's Download -> Notes): the board cropped
   to what is on it, gates, wires and labels exactly as they look, on white.
   The live SVG is cloned with its computed styles written in, rasterised at
   print resolution, and handed to the host as a canvas. */
window.CircuitPrint = (function () {
  'use strict';

  const PROPS = ['fill', 'fill-opacity', 'stroke', 'stroke-width', 'stroke-opacity',
    'stroke-linecap', 'stroke-linejoin', 'stroke-dasharray', 'opacity',
    'font-family', 'font-size', 'font-weight', 'font-style', 'text-anchor', 'dominant-baseline'];

  // A serialised SVG travels without the stylesheet that coloured it (every
  // colour here is a var()), so each element carries its computed values.
  function inlineStyles(live, clone) {
    const a = [live, ...live.querySelectorAll('*')];
    const b = [clone, ...clone.querySelectorAll('*')];
    for (let i = 0; i < a.length && i < b.length; i++) {
      const cs = getComputedStyle(a[i]);
      for (const p of PROPS) {
        const v = cs.getPropertyValue(p);
        if (v) b[i].setAttribute(p, v.trim());
      }
      b[i].removeAttribute('class');
      b[i].removeAttribute('style');
    }
  }

  function snapshot(svg) {
    const world = svg.querySelector(':scope > g');
    if (!world) throw new Error('nothing to draw');
    const bb = world.getBBox();
    const pad = 28;
    const vb = { x: bb.x - pad, y: bb.y - pad, w: Math.max(80, bb.width + 2 * pad), h: Math.max(60, bb.height + 2 * pad) };
    const clone = svg.cloneNode(true);
    inlineStyles(svg, clone);
    // Interface, not circuit: the grid, selection, handles, hover halos,
    // hit targets and anything half-drawn.
    clone.querySelectorAll('[data-x]').forEach(el => el.remove());
    const g = clone.querySelector(':scope > g');
    g.removeAttribute('transform');
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    return { svg: clone, w: vb.w, h: vb.h };
  }

  async function image(svg, maxPx = 2400) {
    const world = svg.querySelector(':scope > g');
    if (!world) return null;
    const bb = world.getBBox();
    if (!bb.width && !bb.height) return null;   // an empty board
    const snap = snapshot(svg);
    const k = Math.min(maxPx / snap.w, maxPx / snap.h, 4);
    const pxW = Math.max(1, Math.round(snap.w * k)), pxH = Math.max(1, Math.round(snap.h * k));
    snap.svg.setAttribute('width', pxW);
    snap.svg.setAttribute('height', pxH);
    const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(snap.svg));
    const img = await new Promise((ok, bad) => {
      const im = new Image();
      im.onload = () => ok(im);
      im.onerror = () => bad(new Error('the circuit could not be rasterised'));
      im.src = src;
    });
    const cv = document.createElement('canvas');
    cv.width = pxW; cv.height = pxH;
    const cx = cv.getContext('2d');
    cx.fillStyle = '#FFFFFF';
    cx.fillRect(0, 0, pxW, pxH);
    cx.drawImage(img, 0, 0, pxW, pxH);
    return cv;
  }

  return { image };
})();
</script>

<script>
/* ═══ MODULES ═══════════════════════════════════════════════════════════════
   Minimal in-browser module registry. Each section calls
   defineModule(name, deps, factory) exactly once; deps are resolved eagerly
   against modules that already registered, so a missing/out-of-order
   <script> tag fails loudly instead of silently handing back `undefined`. */
window.Modules = {};
window.defineModule = function defineModule(name, deps, factory) {
  const resolved = deps.map(dep => {
    if (!(dep in window.Modules)) {
      throw new Error(`module "${name}" depends on "${dep}", which hasn't loaded yet`);
    }
    return window.Modules[dep];
  });
  window.Modules[name] = factory(...resolved);
};
</script>

<script>
/* ═══ STATE ════════════════════════════════════════════════════════════════
   Central cross-section state. `now` is *simulation* time, not wall time:
   the App's rAF loop only advances it while the sim is running, so pausing
   freezes propagation, clocks and every wire animation together instead of
   letting the visuals drift out of step with the logic. */
defineModule('state', [], () => {
  const widgetState = {
    hopMs: 1000,          // fixed propagation time for one gate-to-gate hop
    particleDensity: 3,
    running: true,
    now: 0,               // simulation clock (ms)
    circuit: null,
    numFormat: 'bin',     // how multi-bit bus values are displayed: bin | dec | hex
    numSigned: false,     // DEC only: read the bits as two's complement instead of unsigned
  };
  return { widgetState };
});
</script>

<script>
/* ═══ ENGINE ═══════════════════════════════════════════════════════════════

   TIMING MODEL — "one hop, one delay"
   ───────────────────────────────────
   A signal's travel time depends only on how many gate-to-gate hops it
   takes, never on how the wires happen to be drawn. The unit of delay is
   the *net*: one driving output pin plus every wire and branch fed from it.
   Whatever shape that tree has — one straight wire, five branches, a
   detour around the canvas — every sink on it sees the new value exactly
   `hopMs` after the value left the driving pin.

       S ── G1 ── O           2 nets  → 2 × hopMs
       S ── G1 ── G2 ── O     3 nets  → 3 × hopMs
       S ── G1 ── G2 ── G3 ── O  4 nets → 4 × hopMs

   Every timestamp handed downstream is the *exact scheduled* instant
   (cause + delay), never "the animation frame that happened to notice".
   Discovery-time timestamps would compound: each hop would silently add
   up to a frame of lag, and a 4-hop path would land visibly later than
   4 × hopMs. The only genuinely fresh timestamps in the whole chain are a
   CLOCK's analytically-computed phase start and a manual INPUT toggle. */
defineModule('engine', ['state'], (state) => {
  'use strict';

  // Kinds whose pins can be widened past 1 bit. Every pin on one of these
  // components (other than a MUX's select line, which is always a single
  // control bit) shares one width — set on the component itself and
  // enforced at wiring time — rather than each pin negotiating its own.
  const BIT_CAPABLE = { INPUT:1, OUTPUT:1, AND:1, OR:1, NOT:1, NAND:1, NOR:1, XOR:1, XNOR:1, MUX:1, REG:1, SHIFT:1, LOAD:1 };
  const MAX_BITS = 16;
  const clampBits = (n) => Math.max(1, Math.min(MAX_BITS, Math.round(Number(n)) || 1));
  // COMBINE/SPLIT don't share one width across every pin the way the gates
  // above do — instead their *pin count* on one side depends on the width.
  // Each width gets its own concrete kind ("COMBINE:4", "SPLIT:8", …),
  // registered on demand by the gates module, so this just recognizes one.
  function busBaseOf(kind) {
    if (typeof kind !== 'string') return null;
    const i = kind.indexOf(':');
    if (i < 0) return null;
    const base = kind.slice(0, i);
    return (base === 'COMBINE' || base === 'SPLIT') ? base : null;
  }
  // AND/OR/NAND/NOR/XOR/XNOR/MUX can also be widened past their default
  // input count — same "each arity is its own concrete kind" trick, e.g.
  // "AND:4". kindBase strips that (or a bus-kind, or nothing) back to the
  // family identity, so BIT_CAPABLE and friends still recognize a widened
  // gate as the gate it is.
  function kindBase(kind) {
    if (typeof kind !== 'string') return kind;
    const i = kind.indexOf(':');
    return i < 0 ? kind : kind.slice(0, i);
  }
  // How many data inputs a MUX instance has (its select line is however
  // many bits are needed to index them, and isn't counted here).
  function muxDataCount(kind) {
    if (kind === 'MUX') return 2;
    const m = /^MUX:(\d+)$/.exec(kind);
    return m ? Number(m[1]) : 2;
  }
  // Which input counts each adjustable-arity gate offers. NOT is strictly
  // unary (inverting more than one signal at once isn't a single gate) so
  // it's deliberately absent — its card only ever shows a width control.
  const GATE_INPUT_CHOICES = {
    AND:[2,3,4,5,6,8], OR:[2,3,4,5,6,8], NAND:[2,3,4,5,6,8],
    NOR:[2,3,4,5,6,8], XOR:[2,3,4,5,6,8], XNOR:[2,3,4,5,6,8],
    MUX:[2,4,8,16],
  };
  // `-1 & mask` reliably wraps to `mask` under JS's 32-bit bitwise ops, which
  // is exactly the "decrement past 0" behaviour a bus should have.
  const bitMask = (bits) => (1 << clampBits(bits)) - 1;

  // `signed` only changes DEC. BIN and HEX show the raw bit pattern, which is
  // the same whichever way you choose to read it.
  function formatBits(value, bits, fmt, signed) {
    bits = clampBits(bits);
    const v = (value || 0) & bitMask(bits);
    if (fmt === 'dec') return String(signed ? toSigned(v, bits) : v);
    if (fmt === 'hex') return '0x' + v.toString(16).toUpperCase().padStart(Math.ceil(bits / 4), '0');
    return v.toString(2).padStart(bits, '0');
  }
  // Inverse of formatBits — used by the value editor on a multi-bit INPUT.
  // Returns null for text that doesn't parse as the current format so the
  // caller can leave the field alone rather than clobber it with 0.
  // Two's-complement reading of an already-masked value: the top bit weighs -2^(n-1).
  function toSigned(v, bits) {
    return (v & (1 << (bits - 1))) ? v - (1 << bits) : v;
  }
  function parseBits(str, bits, fmt, signed) {
    if (str == null) return null;
    str = String(str).trim();
    if (!str) return 0;
    let n;
    if (fmt === 'hex') { const s = str.replace(/^0x/i, ''); if (!/^[0-9a-f]+$/i.test(s)) return null; n = parseInt(s, 16); }
    else if (fmt === 'dec') {
      // In signed mode a leading minus is allowed; `& mask` below turns it into
      // the matching two's-complement pattern (-1 on 4 bits → 1111).
      if (!(signed ? /^-?\d+$/ : /^\d+$/).test(str)) return null;
      n = parseInt(str, 10);
    }
    else { if (!/^[01]+$/.test(str)) return null; n = parseInt(str, 2); }
    return Number.isNaN(n) ? null : (n & bitMask(bits));
  }

  const GATE_DEFS = {
    INPUT:  { kind:'INPUT',  label:'IN',    inputs:0, outputs:1, family:'io',
              compute:(i,s,bits) => [(s.value||0) & bitMask(bits)] },
    OUTPUT: { kind:'OUTPUT', label:'OUT',   inputs:1, outputs:0, family:'io',
              compute:()=>[] },
    CLOCK:  { kind:'CLOCK',  label:'CLK',   inputs:0, outputs:1, family:'io',
              compute:(i,s) => [s.value?1:0] },
    SEVEN:  { kind:'SEVEN',  label:'7SEG',  inputs:7, outputs:0, family:'io',
              compute:()=>[] },
    AND:    { kind:'AND',  label:'AND',   inputs:2, outputs:1, family:'and',
              compute:(iv,s,bits)=>{ let v=iv[0]||0; for(let i=1;i<iv.length;i++) v&=iv[i]; return [v&bitMask(bits)]; } },
    OR:     { kind:'OR',   label:'OR',    inputs:2, outputs:1, family:'or',
              compute:(iv,s,bits)=>{ let v=iv[0]||0; for(let i=1;i<iv.length;i++) v|=iv[i]; return [v&bitMask(bits)]; } },
    NOT:    { kind:'NOT',  label:'NOT',   inputs:1, outputs:1, family:'not',  compute:([a],s,bits)=>[(~a)&bitMask(bits)] },
    NAND:   { kind:'NAND', label:'NAND',  inputs:2, outputs:1, family:'and',
              compute:(iv,s,bits)=>{ let v=iv[0]||0; for(let i=1;i<iv.length;i++) v&=iv[i]; return [(~v)&bitMask(bits)]; } },
    NOR:    { kind:'NOR',  label:'NOR',   inputs:2, outputs:1, family:'or',
              compute:(iv,s,bits)=>{ let v=iv[0]||0; for(let i=1;i<iv.length;i++) v|=iv[i]; return [(~v)&bitMask(bits)]; } },
    XOR:    { kind:'XOR',  label:'XOR',   inputs:2, outputs:1, family:'xor',
              compute:(iv,s,bits)=>{ let v=iv[0]||0; for(let i=1;i<iv.length;i++) v^=iv[i]; return [v&bitMask(bits)]; } },
    XNOR:   { kind:'XNOR', label:'XNOR',  inputs:2, outputs:1, family:'xor',
              compute:(iv,s,bits)=>{ let v=iv[0]||0; for(let i=1;i<iv.length;i++) v^=iv[i]; return [(~v)&bitMask(bits)]; } },
    // Data inputs are pins 0..n-1; the select line is always the *last*
    // input pin, however many data pins there are (see pinBits below for
    // why its own width is derived rather than following `bits`).
    MUX:    { kind:'MUX',  label:'MUX',   inputs:3, outputs:1, family:'mux',
              compute:(iv,s,bits)=>{ const n=iv.length-1; const sel=(iv[n]||0)&(n-1); return [(iv[sel]||0)&bitMask(bits)]; } },
    DFF:    { kind:'DFF',  label:'D-FF',  inputs:2, outputs:1, family:'seq',
              compute:([d,clk],s)=>{ const r=clk&&!s.lastClk; s.lastClk=clk; if(r)s.q=d?1:0; return[s.q||0]; } },
    TFF:    { kind:'TFF',  label:'T-FF',  inputs:2, outputs:1, family:'seq',
              compute:([t,clk],s)=>{ const r=clk&&!s.lastClk; s.lastClk=clk; if(r&&t)s.q=s.q?0:1; return[s.q||0]; } },
    JKFF:   { kind:'JKFF', label:'JK-FF', inputs:3, outputs:1, family:'seq',
              compute:([j,k,clk],s)=>{ const r=clk&&!s.lastClk; s.lastClk=clk; if(r){if(j&&k)s.q=s.q?0:1; else if(j)s.q=1; else if(k)s.q=0;} return[s.q||0]; } },
    SRFF:   { kind:'SRFF', label:'SR-FF', inputs:2, outputs:1, family:'seq',
              compute:([s2,r],s)=>{ if(s2&&!r)s.q=1; else if(r&&!s2)s.q=0; return[s.q||0]; } },
    // The n-bit generalization of a D flip-flop: captures the whole D bus
    // on every rising clock edge. CLK stays a single control bit (see
    // pinBits) no matter how wide the register itself is set.
    REG:    { kind:'REG',   label:'REG',  inputs:2, outputs:1, family:'seq',
              compute:([d,clk],s,bits)=>{ const r=clk&&!s.lastClk; s.lastClk=clk; if(r)s.q=(d||0)&bitMask(bits); return[s.q||0]; } },
    // Shifts one new bit in from SI on every rising edge, toward the MSB;
    // the bit that falls off the top comes out on SO the same cycle, so
    // shift registers can be chained serially.
    SHIFT:  { kind:'SHIFT', label:'SHIFT', inputs:2, outputs:2, family:'seq',
              compute:([si,clk],s,bits)=>{
                const r=clk&&!s.lastClk; s.lastClk=clk;
                if (r) { const old=s.q||0; s.sout=(old>>(bits-1))&1; s.q=((old<<1)|(si?1:0))&bitMask(bits); }
                return [s.q||0, s.sout||0];
              } },
    // A D register with an enable line: only latches D on a rising edge
    // where LD is also asserted, otherwise holds whatever it already had.
    LOAD:   { kind:'LOAD',  label:'LOAD', inputs:3, outputs:1, family:'seq',
              compute:([d,ld,clk],s,bits)=>{ const r=clk&&!s.lastClk; s.lastClk=clk; if(r&&ld)s.q=(d||0)&bitMask(bits); return[s.q||0]; } },
  };

  const GRID = 20;
  const snapGridVal = (v) => Math.round(v/GRID)*GRID;

  /* ── A shared timing grid ────────────────────────────────────────────────
     Every "root" event (anything not derived by adding a fixed delay to an
     already-exact time) snaps to this, so an ad-hoc user toggle lands on the
     same grid as a running clock instead of marching to its own arbitrary
     offset. 6.25ms is the GCD of every fixed interval in the app: the
     fastest clock half-period (1/16s → 31.25ms) and every selectable hop
     time (1000/2000/4000/8000ms). Anything built by adding those intervals to
     an already-snapped time lands back on the grid automatically. */
  const GLOBAL_TICK_MS = 6.25;
  // The 1× hop. Every other hop choice slows the whole circuit down by
  // hopMs / BASE_HOP_MS — clocks included (see tickClocks).
  const BASE_HOP_MS = 1000;
  const snapToGlobalTick = (t) => Math.round(t / GLOBAL_TICK_MS) * GLOBAL_TICK_MS;

  /* ── Pin geometry ────────────────────────────────────────────────────── */
  const FACE_ROT = { right:0, down:90, left:180, up:270 };

  // Rotate a unit direction into the component's frame. 'left' is a
  // horizontal mirror (not a 180° turn) so gate art stays right-side up,
  // which matches how GateBody draws itself.
  function rotDir(d, facing) {
    if (facing === 'left') return { x:-d.x, y:d.y };
    if (facing === 'up')   return { x:d.y,  y:-d.x };
    if (facing === 'down') return { x:-d.y, y:d.x };
    return { x:d.x, y:d.y };
  }
  const PIN_DIR_VEC = { left:{x:-1,y:0}, right:{x:1,y:0}, up:{x:0,y:-1}, down:{x:0,y:1} };

  function visOf(kind) { return window.Modules.gates.GATE_VIS[kind]; }

  // `flip` mirrors a part top-to-bottom in its own frame, before `facing`
  // turns it. Rotation alone can't reorder the pins down a side (and 'left'
  // is itself a mirror, so four facings × flip reaches all eight
  // orientations), which is what a flip is for: bit 0 at the bottom of a
  // SPLIT, a MUX select pointing down, a flip-flop's clock on top.
  //
  // The mirror line is the box's mid-height snapped to the grid, not its
  // exact middle: a few boxes (REG, LOAD, SHIFT) aren't a whole number of
  // grid cells tall, and mirroring about their true middle would knock
  // every pin 10px off the grid. The body is drawn about the same line.
  function flipAxis(vis) { return Math.round(vis.h/GRID)*GRID; }
  function flipPin(p, vis, comp) {
    return comp.flip ? { ...p, y: flipAxis(vis) - p.y } : p;
  }
  // cos/sin of 90°/270° aren't exactly 0 in floating point, which leaves a
  // rotated pin at 380.00000000000006 — enough to fail the exact x===x /
  // y===y tests the wire router relies on for straight runs.
  const tidy = (v) => Math.round(v*1000)/1000;

  function pinAbs(comp, kind, idx) {
    const vis = visOf(comp.kind);
    const p = flipPin((kind === 'in' ? vis.inputs[idx] : vis.outputs[idx]) || {x:0,y:0}, vis, comp);
    const cx = vis.w/2, cy = vis.h/2;
    if (comp.facing === 'left') return { x: comp.x + (vis.w - p.x), y: comp.y + p.y };
    const rad = (FACE_ROT[comp.facing] || 0) * Math.PI/180;
    const dx = p.x - cx, dy = p.y - cy;
    return {
      x: tidy(comp.x + cx + (dx*Math.cos(rad) - dy*Math.sin(rad))),
      y: tidy(comp.y + cy + (dx*Math.sin(rad) + dy*Math.cos(rad))),
    };
  }

  // Unit vector pointing *out* of the component at this pin — the direction
  // a wire should leave (outputs) or arrive from (inputs). Auto-routing uses
  // it so wires always meet a pin head-on instead of clipping the body.
  function pinOutDir(comp, kind, idx) {
    const vis = visOf(comp.kind);
    const p = (kind === 'in' ? vis.inputs[idx] : vis.outputs[idx]) || {};
    const d = PIN_DIR_VEC[p.dir || (kind === 'in' ? 'left' : 'right')];
    const base = comp.flip ? { x:d.x, y:-d.y } : d;
    return rotDir(base, comp.facing || 'right');
  }

  /* ── Polyline helpers ───────────────────────────────────────────────── */
  function resolveWire(x1,y1,x2,y2,pts=[]) {
    const knots = [{x:x1,y:y1},...pts,{x:x2,y:y2}];
    const out = [knots[0]];
    for (let i=1;i<knots.length;i++) {
      const a = out[out.length-1], b = knots[i];
      if (a.x===b.x || a.y===b.y) out.push(b);
      else out.push({x:b.x,y:a.y}, b);
    }
    // Collapse zero-length steps (so arc-length maths never divides by 0)
    // and merge collinear runs, which keeps hit-testing, midpoint labels and
    // pulse sampling working off the simplest possible polyline.
    const dedup = out.filter((p,i)=> i===0 || p.x!==out[i-1].x || p.y!==out[i-1].y);
    const simple = [];
    for (let i=0;i<dedup.length;i++) {
      const prev = simple[simple.length-1], next = dedup[i+1];
      if (prev && next &&
          ((prev.x===dedup[i].x && dedup[i].x===next.x) ||
           (prev.y===dedup[i].y && dedup[i].y===next.y))) continue;
      simple.push(dedup[i]);
    }
    return simple;
  }
  function pathD(p) { return p.map((v,i)=>(i?'L ':'M ')+v.x+' '+v.y).join(''); }
  function polyLength(p) {
    let t=0; for (let i=1;i<p.length;i++) t += Math.hypot(p[i].x-p[i-1].x, p[i].y-p[i-1].y);
    return t;
  }
  function samplePoly(p, t) {
    if (p.length===1) return [p[0].x,p[0].y];
    const total = polyLength(p);
    let d = Math.max(0,Math.min(1,t)) * total;
    for (let i=1;i<p.length;i++) {
      const l = Math.hypot(p[i].x-p[i-1].x, p[i].y-p[i-1].y);
      if (d <= l || i===p.length-1) {
        const f = l>0 ? Math.min(1,d/l) : 0;
        return [p[i-1].x+(p[i].x-p[i-1].x)*f, p[i-1].y+(p[i].y-p[i-1].y)*f];
      }
      d -= l;
    }
    return [p[p.length-1].x, p[p.length-1].y];
  }
  function distToSeg(px,py,ax,ay,bx,by) {
    const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
    if (l2===0) return Math.hypot(px-ax,py-ay);
    const t = Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2));
    return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
  }
  // Nearest point on a polyline, plus how far along it that point sits.
  function projectOnPoly(p, x, y) {
    let best = { d:Infinity, point:p[0]||{x,y}, index:0, along:0 };
    let acc = 0;
    for (let i=1;i<p.length;i++) {
      const a=p[i-1], b=p[i];
      const dx=b.x-a.x, dy=b.y-a.y, l2=dx*dx+dy*dy, len=Math.hypot(dx,dy);
      const t = l2===0 ? 0 : Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/l2));
      const q = { x:a.x+t*dx, y:a.y+t*dy };
      const d = Math.hypot(q.x-x, q.y-y);
      if (d < best.d) best = { d, point:q, index:i-1, along:acc + t*len };
      acc += len;
    }
    return best;
  }
  // Where a branch should join a wire near (x, y): the nearest point on it,
  // then slid along that segment to the closest grid line (never past the
  // segment's ends). Wire corners and pins all sit on the grid, so the
  // branch then leaves on a grid line too instead of a few pixels off one.
  function snapOntoPoly(p, x, y) {
    const pr = projectOnPoly(p, x, y);
    const a = p[pr.index], b = p[pr.index+1];
    if (!a || !b) return pr;
    let q = pr.point;
    if (a.y === b.y) {
      const lo = Math.min(a.x,b.x), hi = Math.max(a.x,b.x);
      q = { x: Math.min(hi, Math.max(lo, snapGridVal(q.x))), y: a.y };
    } else if (a.x === b.x) {
      const lo = Math.min(a.y,b.y), hi = Math.max(a.y,b.y);
      q = { x: a.x, y: Math.min(hi, Math.max(lo, snapGridVal(q.y))) };
    }
    return { ...pr, point: q };
  }

  /* ── Auto-routing ────────────────────────────────────────────────────────
     Wires with no manual bends route themselves: leave the source pin along
     its outward direction, approach the target pin head-on, and elbow
     between the two. Because this is recomputed from live pin positions,
     dragging a component keeps every attached wire tidy instead of leaving
     the diagonal spaghetti a stored-points-only model produces. */
  const STUB = 20;
  function autoRoute(a, adir, b, bdir) {
    const a1 = { x: snapGridVal(a.x + adir.x*STUB), y: snapGridVal(a.y + adir.y*STUB) };
    const b1 = { x: snapGridVal(b.x + bdir.x*STUB), y: snapGridVal(b.y + bdir.y*STUB) };
    const pts = [];
    const aH = adir.y === 0, bH = bdir.y === 0;
    if (Math.abs(a1.x-a.x) > 0.5 || Math.abs(a1.y-a.y) > 0.5) pts.push(a1);
    if (aH && bH) {
      if (Math.abs(a1.y - b1.y) > 0.5) {
        const mid = snapGridVal((a1.x + b1.x)/2);
        // Target sits behind the source: hop out and around rather than
        // doubling back through the gate body.
        const x = (b1.x - a1.x) * adir.x > 0 ? mid : a1.x;
        pts.push({x, y:a1.y}, {x, y:b1.y});
      }
    } else if (!aH && !bH) {
      if (Math.abs(a1.x - b1.x) > 0.5) {
        const mid = snapGridVal((a1.y + b1.y)/2);
        const y = (b1.y - a1.y) * adir.y > 0 ? mid : a1.y;
        pts.push({x:a1.x, y}, {x:b1.x, y});
      }
    } else if (aH) {
      pts.push({x:b1.x, y:a1.y});
    } else {
      pts.push({x:a1.x, y:b1.y});
    }
    if (Math.abs(b1.x-b.x) > 0.5 || Math.abs(b1.y-b.y) > 0.5) pts.push(b1);
    return pts;
  }

  /* ══ CIRCUIT ═══════════════════════════════════════════════════════════ */
  function createCircuit() {
    let nextId = 1, nextIoId = 1;
    const components = new Map();
    const ioComponents = new Map();
    const wires = new Map();
    // One entry per driving output pin that has at least one wire on it.
    // Key: "compId:pin". This is the unit of propagation delay.
    const signals = new Map();

    const isPin = (t) => !!t && typeof t.compId === 'string' && typeof t.pin === 'number';
    const isTap = (t) => !!t && typeof t.wireId === 'string';
    const sigKey = (compId, pin) => compId + ':' + pin;

    /* ── geometry ─────────────────────────────────────────────────────── */
    // Absolute coordinates of a wire endpoint. A tap keeps its stored point
    // projected back onto its parent's *current* path, so branches stay
    // welded to the wire they tap even as components move around.
    function terminalCoords(term, depth = 0) {
      if (!term) return { x:0, y:0 };
      if (isPin(term)) {
        const comp = components.get(term.compId);
        if (!comp) return { x:term.x||0, y:term.y||0 };
        return pinAbs(comp, term.type === 'in' ? 'in' : 'out', term.pin);
      }
      if (isTap(term) && depth < 12) {
        const parent = wires.get(term.wireId);
        if (parent) {
          const p = wirePoints(parent, depth+1);
          if (p.length) return projectOnPoly(p, term.x, term.y).point;
        }
      }
      return { x:term.x||0, y:term.y||0 };
    }
    function terminalDir(term, depth = 0) {
      if (isPin(term)) {
        const comp = components.get(term.compId);
        if (comp) return pinOutDir(comp, term.type === 'in' ? 'in' : 'out', term.pin);
      }
      if (isTap(term)) {
        // Leave a tap perpendicular to the wire it branches off.
        const parent = wires.get(term.wireId);
        if (parent && depth < 12) {
          const p = wirePoints(parent, depth+1);
          const pr = projectOnPoly(p, term.x, term.y);
          const a = p[pr.index], b = p[pr.index+1] || a;
          if (a && b) {
            const horiz = Math.abs(b.x-a.x) >= Math.abs(b.y-a.y);
            return horiz ? {x:0,y:1} : {x:1,y:0};
          }
        }
      }
      return { x:1, y:0 };
    }
    // Full resolved polyline for a wire: manual bends if it has any,
    // otherwise a freshly auto-routed path.
    // A tap leaves its wire at right angles, but on whichever side the far
    // end actually is — always going down/right made a branch to something
    // above a wire dip under it and double back through it.
    function terminalDirToward(term, target, depth = 0) {
      const d = terminalDir(term, depth);
      if (!isTap(term) || !target) return d;
      const a = terminalCoords(term, depth);
      if (d.y && (target.y - a.y) * d.y < 0) return { x:0, y:-d.y };
      if (d.x && (target.x - a.x) * d.x < 0) return { x:-d.x, y:0 };
      return d;
    }
    function wirePoints(wire, depth = 0) {
      const a = terminalCoords(wire.from, depth);
      const b = terminalCoords(wire.to, depth);
      const mids = (wire.points && wire.points.length)
        ? wire.points
        : autoRoute(a, terminalDirToward(wire.from, b, depth), b, terminalDir(wire.to, depth));
      return resolveWire(a.x, a.y, b.x, b.y, mids);
    }

    /* ── bit width ────────────────────────────────────────────────────────
       Every pin on a BIT_CAPABLE component shares that component's `bits`
       (a MUX's select line is the one exception — it's always a single
       control bit regardless of how wide the data path is). Anything else
       is fixed at 1 bit. A tap has no width of its own: it inherits
       whatever its parent wire carries, chasing back to a real pin. */
    function pinBits(comp, type, idx) {
      if (!comp) return 1;
      const base = kindBase(comp.kind);
      if (base === 'MUX') {
        const n = muxDataCount(comp.kind);
        // The select line is the last input pin, however many data pins
        // there are, and needs exactly enough bits to index them.
        if (type === 'in' && idx === n) return Math.round(Math.log2(n));
        return comp.bits || 1; // data inputs 0..n-1, and the output
      }
      if (base === 'REG') return (type === 'in' && idx === 1) ? 1 /* CLK */ : (comp.bits || 1);
      if (base === 'LOAD') return (type === 'in' && idx !== 0) ? 1 /* LD, CLK */ : (comp.bits || 1);
      if (base === 'SHIFT') {
        if (type === 'in') return 1;                 // SI, CLK
        return idx === 1 ? 1 : (comp.bits || 1);      // SO is 1 bit; Q is the register width
      }
      if (BIT_CAPABLE[base]) return comp.bits || 1;
      // Custom modules carry a fixed width per pin, taken from the IN/OUT
      // components inside them when they were registered.
      const def = GATE_DEFS[comp.kind];
      if (def && def.family === 'custom') {
        const arr = type === 'in' ? def.inBits : def.outBits;
        return (arr && arr[idx]) || 1;
      }
      const bb = busBaseOf(comp.kind);
      // COMBINE's inputs and SPLIT's outputs are each a single bit; the
      // *other* side is the one wide bus pin.
      if (bb === 'COMBINE' && type === 'out') return comp.bits || 1;
      if (bb === 'SPLIT' && type === 'in') return comp.bits || 1;
      return 1;
    }
    function pinBitsAt(term, depth = 0) {
      if (!term || depth > 24) return 1;
      if (isPin(term)) return pinBits(components.get(term.compId), term.type === 'in' ? 'in' : 'out', term.pin);
      if (isTap(term)) {
        const parent = wires.get(term.wireId);
        if (parent) return pinBitsAt(parent.from, depth + 1);
      }
      return 1;
    }
    function wireBits(wire) { return wire ? pinBitsAt(wire.from) : 1; }
    // Does this component have any wire touching it at all — directly, not
    // counting taps further downstream? Used to lock bit width once a part
    // is wired up, so widening it can't silently orphan a connection.
    function hasConnections(compId) {
      for (const w of wires.values()) {
        if ((isPin(w.from) && w.from.compId === compId) || (isPin(w.to) && w.to.compId === compId)) return true;
      }
      return false;
    }
    // Re-sizes a component's pin-indexed arrays to match a (just-switched-to)
    // def's pin counts. Only ever called on a component with zero wires
    // attached, so there's nothing live to preserve.
    function rebuildPinArrays(c, def) {
      c.inputVals = new Array(def.inputs).fill(0);
      c.outputVals = new Array(def.outputs).fill(0);
      c.outputChangeTime = new Array(def.outputs).fill(0);
      c.pendingOutputVals = []; c.pendingOutputStart = [];
    }

    /* ── topology ─────────────────────────────────────────────────────── */
    // Which signal (driving output pin) does this wire ultimately belong to?
    // Taps chain back through their parents until a real output pin is hit.
    function rootSignalOf(wire, depth = 0) {
      if (!wire || depth > 24) return null;
      if (isPin(wire.from)) return sigKey(wire.from.compId, wire.from.pin);
      if (isTap(wire.from)) return rootSignalOf(wires.get(wire.from.wireId), depth+1);
      return null;
    }
    // Rebuilt every step (cheap; topology is small) and shared by the
    // compute / propagate / refresh stages below.
    function topology() {
      const rootOf = new Map();            // wireId  -> signal key
      const members = new Map();           // signal key -> [wire, …]
      const driversOf = new Map();         // compId -> [signal key per input pin]
      for (const w of wires.values()) {
        const root = rootSignalOf(w);
        if (!root) continue;
        rootOf.set(w.id, root);
        if (!members.has(root)) members.set(root, []);
        members.get(root).push(w);
      }
      for (const w of wires.values()) {
        const root = rootOf.get(w.id);
        if (!root || !isPin(w.to)) continue;
        const def = GATE_DEFS[components.get(w.to.compId)?.kind];
        if (!def) continue;
        if (!driversOf.has(w.to.compId)) driversOf.set(w.to.compId, new Array(def.inputs).fill(null));
        const arr = driversOf.get(w.to.compId);
        if (w.to.pin < arr.length) arr[w.to.pin] = root;
      }
      // Keep the signal table in sync with live topology.
      for (const key of members.keys()) {
        if (!signals.has(key)) signals.set(key, { value:0, lastChange:0, queue:[] });
      }
      for (const key of [...signals.keys()]) if (!members.has(key)) signals.delete(key);
      return { rootOf, members, driversOf };
    }

    /* ── mutation ─────────────────────────────────────────────────────── */
    function addComponent(kind, x, y, facing = 'right', delay = 0, label = 'none') {
      const def = GATE_DEFS[kind];
      if (!def) throw new Error('unknown component kind: ' + kind);
      const id = 'c' + (nextId++);
      const ioId = (kind==='INPUT' || kind==='OUTPUT') ? 'io'+(nextIoId++) : '';
      const comp = {
        id, ioId, kind, x, y,
        bits: BIT_CAPABLE[kindBase(kind)] ? 1 : (busBaseOf(kind) ? Number(kind.slice(kind.indexOf(':')+1)) || 1 : undefined),
        state: kind==='INPUT' ? { value:0 }
             : kind==='CLOCK' ? { value:0, period:1000, paused:false }
             : kind==='DFF'   ? { q:0, lastClk:0 } : {},
        inputVals:  new Array(def.inputs).fill(0),
        outputVals: new Array(def.outputs).fill(0),
        outputChangeTime: new Array(def.outputs).fill(0),
        pendingOutputVals: [], pendingOutputStart: [],
        label: label === 'none'
          ? (ioId ? String.fromCharCode(Number(ioId.slice(2)) + 64) : def.label)
          : label,
        // Gates switch instantly: the only delay is the hop on each net.
        // (Older saves carried a per-gate `delay`; it's ignored on load.)
        lastChange: 0, facing, delay: 0,
      };
      components.set(id, comp);
      if (ioId) ioComponents.set(ioId, comp);
      return comp;
    }

    function removeComponent(id) {
      const comp = components.get(id);
      if (!comp) return;
      components.delete(id);
      if (comp.ioId) ioComponents.delete(comp.ioId);
      for (const [wid,w] of [...wires]) {
        if (w.from.compId === id || w.to.compId === id) removeWire(wid);
      }
    }

    // Is this still something a wire can be driven from?
    function sourceAlive(term) {
      if (isPin(term)) {
        const c = components.get(term.compId), def = c && GATE_DEFS[c.kind];
        return !!def && term.pin >= 0 && term.pin < def.outputs;
      }
      return isTap(term) && wires.has(term.wireId);
    }

    // Removing a wire only disconnects the input *it* runs to. Branches that
    // tapped it were fed by the same source, so they're re-attached to that
    // source (the output pin, or the junction the wire itself started from)
    // instead of vanishing along with it — which used to happen whenever an
    // input was re-wired or the part at the far end was deleted. Only when
    // the source itself is gone do the branches go too.
    function removeWire(id) {
      const gone = wires.get(id);
      if (!gone) return;
      wires.delete(id);
      const keep = sourceAlive(gone.from);
      for (const [wid,w] of [...wires]) {
        if (!isTap(w.from) || w.from.wireId !== id) continue;
        if (keep) w.from = { ...gone.from };
        else removeWire(wid);
      }
      // The signal table itself is reconciled against live topology on the
      // next step(), so there's nothing to clean up here.
    }

    // What an input pin is currently driven by, if anything.
    function wireIntoInput(compId, pin) {
      for (const w of wires.values()) {
        if (isPin(w.to) && w.to.compId === compId && w.to.pin === pin) return w;
      }
      return null;
    }

    // Is this a legal connection? Returns a reason string when it isn't, so
    // the canvas can say *why* a target is rejected rather than just
    // refusing to snap to it.
    function connectionProblem(from, to) {
      if (!from || !to) return 'incomplete';
      if (!isPin(to) || to.type !== 'in') return 'a wire has to end on an input pin';
      if (isPin(from)) {
        if (from.type !== 'out') return 'a wire has to start at an output pin';
        if (from.compId === to.compId) return "can't wire a component to itself";
        for (const w of wires.values()) {
          if (isPin(w.from) && w.from.compId===from.compId && w.from.pin===from.pin &&
              isPin(w.to) && w.to.compId===to.compId && w.to.pin===to.pin) return 'already connected';
        }
      } else if (isTap(from)) {
        const parent = wires.get(from.wireId);
        if (!parent) return 'that wire no longer exists';
        if (isPin(parent.to) && parent.to.compId === to.compId && parent.to.pin === to.pin) return 'already connected';
      } else return 'unsupported source';
      const dstBits = pinBits(components.get(to.compId), 'in', to.pin);
      const srcBits = pinBitsAt(from);
      if (dstBits !== srcBits) return `bit width mismatch — this input is ${dstBits}-bit, source is ${srcBits}-bit`;
      return null;
    }

    function addWire(from, to, points) {
      if (connectionProblem(from, to)) return null;
      // One driver per input: a new connection replaces the old one rather
      // than silently OR-ing two sources together.
      const existing = wireIntoInput(to.compId, to.pin);
      if (existing) removeWire(existing.id);
      const id = 'w' + (nextId++);
      const wire = { id, from, to, points: points || [], label:'' };
      wires.set(id, wire);
      return wire;
    }

    /* ── simulation ───────────────────────────────────────────────────── */
    // `scale` is the global slow-down: the hop setting over its 1s base. A
    // clock's period is its rate at 1×, so at 8s a hop a 1s clock ticks every
    // 8s — otherwise it flips faster than a signal can cross one net and its
    // pulses never arrive.
    function tickClocks(now, scale = 1) {
      // Computed from absolute time, not incrementally, so every clock is
      // phase-locked to the same origin regardless of when it was placed or
      // how long it sat paused. phaseStart is the *exact* instant the phase
      // began — the seed that makes everything downstream exact.
      for (const c of components.values()) {
        if (c.kind === 'CLOCK' && !c.state.paused) {
          const half = Math.max(1, c.state.period * scale / 2);
          const phase = Math.floor(now / half) % 2;
          if (c.state.value !== phase) {
            c.state.value = phase;
            c.state.phaseStart = snapToGlobalTick(Math.floor(now / half) * half);
          }
        }
      }
    }

    function computeOutputs(now, driversOf, instant) {
      let changed = false;
      for (const c of components.values()) {
        const def = GATE_DEFS[c.kind];
        if (!def) continue;
        const outs = def.compute(c.inputVals, c.state, c.bits || 1) || [];
        for (let i=0;i<outs.length;i++) {
          if (outs[i] !== c.pendingOutputVals[i]) {
            if (outs[i] === c.outputVals[i]) {
              // Input reverted before the pending change landed — drop the
              // in-flight change instead of letting it commit as a stale
              // glitch when the old timer expires.
              c.pendingOutputVals[i] = undefined;
              c.pendingOutputStart[i] = undefined;
            } else {
              let cause = snapToGlobalTick(now);
              if (c.kind === 'CLOCK') {
                if (typeof c.state.phaseStart === 'number') cause = c.state.phaseStart;
              } else {
                const drv = driversOf.get(c.id);
                if (drv) {
                  // The most recent input arrival is what triggered this new
                  // result, so that's the exact instant to count from.
                  let t = null;
                  for (const key of drv) {
                    if (!key) continue;
                    const s = signals.get(key);
                    if (s && (t === null || s.lastChange > t)) t = s.lastChange;
                  }
                  if (t !== null) cause = t;
                }
              }
              c.pendingOutputVals[i] = outs[i];
              c.pendingOutputStart[i] = cause;
            }
          }
          const pend = c.pendingOutputVals[i];
          if (pend !== undefined && (instant || now - (c.pendingOutputStart[i]||0) >= (c.delay||0))) {
            if (c.outputVals[i] !== pend) {
              c.outputVals[i] = pend;
              c.lastChange = now;
              // Exact scheduled commit time (cause + delay), never `now`.
              c.outputChangeTime[i] = instant ? now : (c.pendingOutputStart[i]||0) + (c.delay||0);
              changed = true;
            }
            c.pendingOutputVals[i] = undefined;
            c.pendingOutputStart[i] = undefined;
          }
        }
      }
      return changed;
    }

    // Queue every distinct transition (compared against the last value
    // already queued, not the committed one) so a source that flips faster
    // than one hop puts a train of pulses on the net instead of losing the
    // reverting edge. Each still commits exactly hopMs after it departed, so
    // the output frequency always matches the source's — just phase-shifted.
    function pumpSignals(now, hopMs, instant) {
      let changed = false;
      for (const [key, sig] of signals) {
        const [cid, pinStr] = key.split(':');
        const comp = components.get(cid);
        if (!comp) continue;
        const pin = Number(pinStr);
        const val = comp.outputVals[pin] || 0;
        const lastQueued = sig.queue.length ? sig.queue[sig.queue.length-1].value : sig.value;
        if (val !== lastQueued) {
          const t = comp.outputChangeTime[pin];
          sig.queue.push({ value: val, time: typeof t === 'number' ? t : snapToGlobalTick(now) });
          changed = true;
        }
      }
      for (const sig of signals.values()) {
        while (sig.queue.length && (instant || now - sig.queue[0].time >= hopMs)) {
          const ev = sig.queue.shift();
          if (sig.value !== ev.value) {
            sig.value = ev.value;
            // Exact scheduled arrival, not the frame that noticed it.
            sig.lastChange = instant ? now : ev.time + hopMs;
            changed = true;
          }
        }
      }
      return changed;
    }

    function refreshInputs(rootOf) {
      const acc = new Map();
      for (const c of components.values()) {
        const def = GATE_DEFS[c.kind];
        acc.set(c.id, new Array(def ? def.inputs : 0).fill(0));
      }
      for (const w of wires.values()) {
        if (!isPin(w.to)) continue;
        const a = acc.get(w.to.compId);
        const sig = signals.get(rootOf.get(w.id));
        if (a && sig && w.to.pin < a.length) a[w.to.pin] = a[w.to.pin] || (sig.value || 0);
      }
      let changed = false;
      for (const c of components.values()) {
        const next = acc.get(c.id);
        if (c.inputVals.length !== next.length || next.some((v,i)=>v!==c.inputVals[i])) changed = true;
        c.inputVals = next;
      }
      return changed;
    }

    // Looping the whole cycle a bounded number of times per instant lets a
    // chain settle within one frame where possible. Signal commits stay
    // gated on elapsed time, so extra passes can never make a value arrive
    // before its hop is up.
    const SETTLE_PASSES = 8;
    function step(now, hopMs, instant) {
      tickClocks(now, (hopMs || BASE_HOP_MS) / BASE_HOP_MS);
      const { rootOf, driversOf } = topology();
      for (let pass=0; pass<SETTLE_PASSES; pass++) {
        const a = computeOutputs(now, driversOf, instant);
        const b = pumpSignals(now, hopMs, instant);
        const c = refreshInputs(rootOf);
        if (!a && !b && !c) break;
      }
    }

    // Wipe every in-flight signal and latch back to a cold start, keeping
    // the layout. Used by the toolbar's Reset.
    function resetSim() {
      for (const c of components.values()) {
        const def = GATE_DEFS[c.kind];
        c.inputVals = new Array(def.inputs).fill(0);
        c.outputVals = new Array(def.outputs).fill(0);
        c.outputChangeTime = new Array(def.outputs).fill(0);
        c.pendingOutputVals = []; c.pendingOutputStart = [];
        if (c.kind === 'CLOCK') { c.state.value = 0; delete c.state.phaseStart; }
        if ('q' in c.state) c.state.q = 0;
        if ('lastClk' in c.state) c.state.lastClk = 0;
        if (c.state.sub) delete c.state.sub;
      }
      signals.clear();
    }

    /* ── persistence ──────────────────────────────────────────────────── */
    function serialize() {
      return {
        version: 2,
        components: [...components.values()].map(c=>({
          id:c.id, ioId:c.ioId, kind:c.kind, x:c.x, y:c.y, facing:c.facing, flip:c.flip || undefined, label:c.label,
          bits: BIT_CAPABLE[kindBase(c.kind)] ? (c.bits || 1) : undefined,
          state: c.kind==='INPUT' ? { value:c.state.value }
               : c.kind==='CLOCK' ? { period:c.state.period, paused:c.state.paused } : {},
        })),
        wires: [...wires.values()].map(w=>({ id:w.id, from:w.from, to:w.to, points:w.points||[], label:w.label||'' })),
        nextId, nextIoId,
      };
    }

    // v1 files could contain wires with free-floating endpoints and a
    // separate junction registry. Those are converted to taps where a
    // matching junction exists, and dropped otherwise — the current model
    // has no representation for a wire that ends in mid-air.
    function migrateWires(data) {
      const junctions = data.junctions || [];
      const near = (a,b) => Math.abs(a-b) < 1e-6;
      const out = [];
      for (const wd of data.wires || []) {
        let from = wd.from, to = wd.to;
        if (from && typeof from.x === 'number' && !from.compId && !from.wireId) {
          const j = junctions.find(j => near(j.x, from.x) && near(j.y, from.y));
          if (!j) continue;
          from = { wireId: j.sourceWireId, x: j.x, y: j.y };
        }
        if (!to || typeof to.pin !== 'number' || typeof to.compId !== 'string') continue;
        out.push({ ...wd, from, to:{ ...to, type:'in' } });
      }
      return out;
    }

    function load(data) {
      components.clear(); ioComponents.clear(); wires.clear(); signals.clear();
      if (!data) return;
      // Two passes: addComponent mints throwaway sequential ids as a side
      // effect, and those can collide with another entry's *saved* id when
      // the original circuit had gaps from deletions. Mint everything first,
      // then assign the real ids and populate the maps once.
      const built = [];
      for (const cd of data.components || []) {
        const m = typeof cd.kind === 'string'
          && /^(COMBINE|SPLIT|AND|OR|NAND|NOR|XOR|XNOR|MUX):(\d+)$/.exec(cd.kind);
        if (m && !GATE_DEFS[cd.kind] && window.Modules.gates) {
          if (m[1] === 'COMBINE' || m[1] === 'SPLIT') window.Modules.gates.ensureBusKind(m[1], Number(m[2]));
          else window.Modules.gates.ensureGateKind(m[1], Number(m[2]));
        }
        if (!GATE_DEFS[cd.kind]) continue;
        const c = addComponent(cd.kind, cd.x, cd.y, cd.facing, cd.delay);
        components.delete(c.id); if (c.ioId) ioComponents.delete(c.ioId);
        if (cd.label !== undefined) c.label = cd.label;
        if (cd.flip) c.flip = true;
        if (BIT_CAPABLE[kindBase(c.kind)] && cd.bits) c.bits = clampBits(cd.bits);
        if (cd.state) Object.assign(c.state, cd.state);
        built.push({ c, cd });
      }
      for (const { c, cd } of built) {
        c.id = cd.id || c.id; c.ioId = cd.ioId || '';
        components.set(c.id, c);
        if (c.ioId) ioComponents.set(c.ioId, c);
      }
      // Never mint an id that's already taken: a hand-edited or pasted
      // circuit can carry a stale (or no) nextId.
      const idNum = (k) => Number(String(k).replace(/^\D+/, '')) || 0;
      const maxWireId = Math.max(0, ...(data.wires || []).map(w => idNum(w && w.id)));
      nextId   = Math.max(data.nextId || 1, nextId, maxWireId + 1,
                          ...[...components.keys()].map(k => idNum(k) + 1));
      nextIoId = Math.max(data.nextIoId || 1, nextIoId,
                          ...[...ioComponents.keys()].map(k => idNum(k) + 1));
      for (const wd of migrateWires(data)) {
        const from = wd.from && wd.from.compId ? { ...wd.from, type:'out' } : wd.from;
        const id = wd.id && !wires.has(wd.id) ? wd.id : 'w' + (nextId++);
        wires.set(id, { id, from, to:wd.to, points:Array.isArray(wd.points) ? wd.points : [], label:wd.label||'' });
      }
      sanitizeWires();
    }

    // Loaded circuits come from files, slide config and old versions, so
    // don't trust their wiring: drop wires whose ends point at parts or pins
    // that don't exist, branches off wires that don't exist, and branch
    // loops (A taps B taps A — they have no source and would otherwise send
    // the geometry code round in circles). Then enforce one driver per
    // input, keeping the last one listed, as addWire would have.

      const pinOk = (t, side) => {
        if (!isPin(t)) return false;

        const seen = new Set([w.id]);

        }

      };
      let changed = true;

        changed = false;
        for (const [id, w] of [...wires]) {
          if (!pinOk(w.to, 'in') || !rooted(w)) { wires.delete(id); changed = true; }
        }
      }
      const driverOf = new Map();
      for (const w of [...wires.values()]) {
        const k = w.to.compId + ':' + w.to.pin;
        if (driverOf.has(k)) removeWire(driverOf.get(k));
        driverOf.set(k, w.id);
      }
    }

    return {
      components, wires, ioComponents, signals,
      isPin, isTap, sigKey, terminalDirToward,
      terminalCoords, terminalDir, wirePoints, rootSignalOf, topology, wireIntoInput,
      connectionProblem,
      addComponent, removeComponent, addWire, removeWire,
      step, resetSim, serialize, load,
      signalOfWire(wire) { return signals.get(rootSignalOf(wire)); },
      toggleInput(id){ const c=components.get(id); if(c&&c.kind==='INPUT') c.state.value=c.state.value?0:1; },
      setInput(id,v){ const c=components.get(id); if(c&&c.kind==='INPUT') c.state.value=v?1:0; },

      // either direction — negative deltas rely on JS's 32-bit bitwise ops
      // turning -1 into "all ones", which lands exactly on the mask.
      setInputValue(id,v){ const c=components.get(id); if(c&&c.kind==='INPUT') c.state.value=(v|0)&bitMask(c.bits||1); },
      stepInput(id,delta){ const c=components.get(id); if(c&&c.kind==='INPUT') c.state.value=((c.state.value||0)+delta)&bitMask(c.bits||1); },
      pinBits, wireBits, hasConnections,
      // Widening/narrowing a wired-up part could silently strand a
      // connection at the old width, so it's refused once anything is
      // attached — the person has to disconnect first.
      setBits(id, n){
        const c = components.get(id);
        if (!c || hasConnections(id)) return false;

          c.bits = clampBits(n);

          c.bits = clampBits(n);

        }
        return false;
      },
      // How many inputs an adjustable-arity gate (AND/OR/NAND/NOR/XOR/XNOR,
      // or a MUX's data lines) has. Changing this swaps in a differently-
      // sized concrete kind, same idea as widening a bus part, and is
      // likewise refused once anything is wired to it.
      setInputCount(id, n){
        const c = components.get(id);
        if (!c || hasConnections(id)) return false;
        const base = kindBase(c.kind);
        if (!GATE_INPUT_CHOICES[base] || !window.Modules.gates) return false;
        const newKind = window.Modules.gates.ensureGateKind(base, n);
        rebuildPinArrays(c, GATE_DEFS[newKind]);
        c.kind = newKind;
        return true;
      },
      toggleClock(id){ const c=components.get(id); if(c&&c.kind==='CLOCK') c.state.paused=!c.state.paused; },
      setClockPeriod(id,p){ const c=components.get(id); if(c&&c.kind==='CLOCK') c.state.period=p; },
      setLabel(id,l){ const c=components.get(id); if(c) c.label=l; },
      setFacing(id,f){ const c=components.get(id); if(c) c.facing=f; },
      toggleFlip(id){ const c=components.get(id); if(c) c.flip=!c.flip; },
      setWireLabel(id,l){ const w=wires.get(id); if(w) w.label=l; },
    };
  }

  return {
    GATE_DEFS, GRID, snapGridVal, GLOBAL_TICK_MS, snapToGlobalTick,
    pinAbs, pinOutDir, rotDir, FACE_ROT, flipAxis, snapOntoPoly,
    resolveWire, pathD, polyLength, samplePoly, distToSeg, projectOnPoly, autoRoute,
    createCircuit,
    BIT_CAPABLE, MAX_BITS, clampBits, bitMask, formatBits, parseBits, busBaseOf,
    kindBase, muxDataCount, GATE_INPUT_CHOICES,
  };
});
</script>

<script type="text/babel">
/* ═══ GATES ════════════════════════════════════════════════════════════════ */
defineModule('gates', ['state', 'engine'], (state, engine) => {
  'use strict';
  const { GATE_DEFS } = engine;

  // Drawn like circuitikz: every family in the same pale fill and ink
  // outline (the --gate-* tokens, set in the stylesheet), so the only colour
  // on the board is the signal state.
  const FAMILY_FILL = {
    and:'var(--gate-fill)', or:'var(--gate-fill)', not:'var(--gate-fill)', xor:'var(--gate-fill)',
    mux:'var(--gate-fill)', seq:'var(--gate-fill)', io:'var(--gate-fill)', custom:'var(--gate-fill)', bus:'var(--gate-fill)',
  };
  const FAMILY_EDGE = {
    and:'var(--gate-edge)', or:'var(--gate-edge)', not:'var(--gate-edge)', xor:'var(--gate-edge)',
    mux:'var(--gate-edge)', seq:'var(--gate-edge)', io:'var(--gate-edge)', custom:'var(--gate-edge)', bus:'var(--gate-edge)',
  };
  const VIS = {};
  const W=80,H=80,BX=12,YT=20,YB=60,YO=40,BT=8,BB=72;
  const STROKE = 2;

  // Shared pin-stacking layout: evenly space n pins over a box of height h,
  // snapped to a 20px grid. Used by custom gates, COMBINE/SPLIT, and any
  // gate widened past its default input count. n<=1 just centers the pin.
  const PIN_MARGIN = 20, PIN_GAP = 30;
  const snap20 = (v)=>Math.round(v/20)*20;
  function pinYs(n, h) {
    if (n <= 1) return [snap20(h/2)];
    const usable = h - PIN_MARGIN*2;
    return Array.from({length:n}, (_,i)=>snap20(PIN_MARGIN + usable*i/(n-1)));
  }

  // grid cells each (h = 40n), which makes pinYs space them a clean, even
  // 40px apart — the old 30px target, snapped to the 20px grid, left an
  // 8-input gate with a lumpy mix of 20px and 40px gaps. Past 8 (16-bit
  // buses, a 16-way MUX) that would get unwieldy, so those keep the tighter
  // packing.
  const PIN_PITCH = 40;
  function boxHeightFor(n) {
    n = Math.max(n, 1);
    if (n <= 8) return Math.max(H, n*PIN_PITCH);

  // "loads"; kept as a no-op so the gate bodies that call it stay simple.
  function pendingBar() { return null; }
  // Every gate body shares the same ink: a soft inner highlight for a bit of
  // dimensionality, then the family fill and a family-tinted outline.

    return <g>
      <path d={d} fill={f} stroke={edge} strokeWidth={STROKE} strokeLinejoin="round"/>
      {extra}
    </g>;
  }

  // Parametrized by box height so a widened gate (more inputs stacked down
  // the left edge) gets a proportionally taller symbol rather than the same
  // 2-input curve stretched or, worse, pins crammed into a fixed box.
  // AND/NAND's bulge radius is fixed at what it was for the default 2-input
  // box (32px) — only the *vertical* radius of the ellipse grows with h, so
  // a wide gate gets a taller bulge, not one that swells past the box and
  // away from its own output pin.
  const BULGE_RX = 32;
  const dAND  = (h)=>`M ${BX} 8 H ${W*.5} A ${BULGE_RX} ${(h-16)/2} 0 0 1 ${W*.5} ${h-8} H ${BX} Z`;
  const dNAND = (h)=>`M ${BX} 8 H ${W*.45} A ${BULGE_RX} ${(h-16)/2} 0 0 1 ${W*.45} ${h-8} H ${BX} Z`;
  const dOR   = (h)=>`M ${BX} 8 Q ${BX+15} ${h/2}, ${BX} ${h-8} Q ${W*.5} ${h-8}, ${W-3} ${h/2} Q ${W*.5} 8, ${BX} 8 Z`;
  const dNOR  = (h)=>`M ${BX} 8 Q ${BX+15} ${h/2}, ${BX} ${h-8} Q ${W*.45} ${h-8}, ${W-13} ${h/2} Q ${W*.45} 8, ${BX} 8 Z`;
  const xorArc= (h)=>`M ${BX-6} 8 Q ${BX+9} ${h/2}, ${BX-6} ${h-8}`;
  // The two corner diagonals keep the exact vertical rise (18px) they had
  // at the default 2-input size, so the angle never changes as more data
  // pins are added — a wider MUX gets a longer straight run between the
  // corners, the same trapezoid stretched, not a steeper-looking wedge.
  const MUX_DIAG = 18;
  const dMUX  = (h)=>`M ${BX} 8 L ${W-BX} ${8+MUX_DIAG} V ${h-8-MUX_DIAG} L ${BX} ${h-8} Z`;
  const bubble= (cx,cy,edge,f)=><circle cx={cx} cy={cy} r="5" fill={f} stroke={edge} strokeWidth={STROKE}/>;
  // How far in from the box edge the curved back of an OR-family gate sits
  // at height y. Both back curves above are quadratics whose control point
  // is at mid-height, so y runs linearly with t and x = x0 + 30·t(1−t).
  // Input stubs are run in to meet it: at a fixed 12px they stopped short
  // of the curve on every pin but the outermost two, which is most of them
  // on a 4- or 8-input gate.
  const backX = (x0, y, h)=>{ const t = Math.min(1, Math.max(0, (y-8)/(h-16))); return x0 + 30*t*(1-t); };

  // for MUX. Called once per default arity below, and again lazily whenever
  // ensureGateKind meets a width it hasn't registered yet.
  function buildGateVis(base, n) {

    const ys = pinYs(n, h);
    const yo = h/2;
    const bodies = {
      AND:  (f,comp,edge)=><g>{pendingBar(comp)}{shape(dAND(h),f,edge)}</g>,
      OR:   (f,comp,edge)=><g>{pendingBar(comp)}{shape(dOR(h),f,edge)}</g>,
      NAND: (f,comp,edge)=><g>{pendingBar(comp)}{shape(dNAND(h),f,edge)}{bubble(W-7,yo,edge,f)}</g>,
      NOR:  (f,comp,edge)=><g>{pendingBar(comp)}{shape(dNOR(h),f,edge)}{bubble(W-7,yo,edge,f)}</g>,
      XOR:  (f,comp,edge)=><g>{pendingBar(comp)}

              <path d={xorArc(h)} fill="none" stroke={edge} strokeWidth={STROKE}/>{shape(dNOR(h),f,edge)}{bubble(W-7,yo,edge,f)}</g>,

    // outline, which is drawn over the stub); XOR/XNOR stop on the separate
    // input arc in front of it, as the symbol is conventionally drawn.
    const reach = (y)=>
      (base === 'OR' || base === 'NOR')    ? backX(BX, y, h) + 1 :
      (base === 'XOR' || base === 'XNOR')  ? backX(BX-6, y, h) :

    return { w:W, h, inputs, outputs:[{x:W,y:yo}], body: bodies[base] };
  }

  ['AND','OR','NAND','NOR','XOR','XNOR'].forEach(base => { VIS[base] = buildGateVis(base, 2); });

  // (pin counts, save/load, the "Nb"/width badge) just works unmodified.

     Some components carry a control that's worth clicking on its own: a
     switch's knob, a clock's run/halt pad. Those get their own hit region so
     operating the part and selecting the part are different gestures. The

      const bits = comp.bits || 1;

        action:'input', title:'Click the left half to step down, the right half to step up',
        shape:{ type:'rect', x:4, y:4, w:72, h:32, rx:16 },

    body:(f,comp)=>{
      const bits = comp.bits || 1;
      const label = <text x="-13" y="26" fontFamily="var(--mono)" fontSize="15" fontWeight="600"
              textAnchor="end" fill="var(--ink)" opacity=".85">{comp.label}</text>;

          <rect x="4" y="4" width="72" height="32" rx="16"
                fill={on?'var(--high-soft)':'var(--panel-2)'} stroke={on?'var(--high-2)':'var(--border-hi)'} strokeWidth="2"/>
          <circle cx={on?60:20} cy="20" r="11.5" fill="var(--bg)" stroke={on?'var(--high-2)':'var(--border-hi)'} strokeWidth="1.5"/>
          <text x={on?60:20} y="24" fontFamily="var(--mono)" fontSize="11" fontWeight="600"

          {label}
        </g>;
      }
      // Multi-bit: a numeric read-out (in the shared display format) with a
      // left/right split for step-down / step-up, same in-place-control
      // feel as the single-bit switch.

      const text = engine.formatBits(val, bits, state.widgetState.numFormat, state.widgetState.numSigned);

      return <g>
        <rect x="4" y="4" width="72" height="32" rx="9"
              fill={val?'var(--high-soft)':'var(--panel-2)'} stroke={val?'var(--high-2)':'var(--border-hi)'} strokeWidth="2"/>
        <path d="M14 15 L9 20 L14 25" fill="none" stroke="var(--ink-3)" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>

              textAnchor="middle" fill={val?'var(--high-2)':'var(--ink-2)'}>{text}</text>

    } };

  // shows the action it will perform, not the state it's in — the waveform

    body:(f,comp)=>{
      const on = comp.state.value, paused = comp.state.paused;
      const edge = paused ? 'var(--border-hi)' : 'var(--high-2)';

        <rect x="4" y="4" width="72" height="32" rx="9"

              stroke={paused ? 'var(--border-hi)' : (on ? 'var(--high)' : 'var(--low)')}/>
