  // follows: w and h both multiples of 20 and differing by a multiple of 40,
  // which is what keeps every pin on the grid once the part is turned about
  // its centre. The artwork is unchanged; the extra width just takes in the
  // label that already sat there.
  VIS.OUTPUT = { w:80, h:40, inputs:[{x:0,y:20}], outputs:[],
    body:(f,comp)=>{
      const bits = comp.bits || 1;
      const on = comp.inputVals[0];
      const label = <text x={bits<=1?52:60} y="26" fontFamily="var(--mono)" fontSize="15" fontWeight="600"
              textAnchor="start" fill="var(--ink)" opacity=".85">{comp.label}</text>;
      if (bits <= 1) {
        return <g>
          {on ? <circle cx="22" cy="20" r="19" fill="var(--high)" opacity=".16"/> : null}
          <circle cx="22" cy="20" r="13" fill={on?'var(--high-soft)':'var(--panel-2)'}
                  stroke={on?'var(--high-2)':'var(--border-hi)'} strokeWidth="2"/>
          <path d="M 17 25.5 L 17 30 L 27 30 L 27 25.5" fill="none" stroke="var(--ink-2)" strokeWidth="1.5" strokeLinecap="round"/>
          {label}
          {on ? <g stroke="var(--high-2)" strokeWidth="1.6" strokeLinecap="round">
            <line x1="22" y1="2" x2="22" y2="5.5"/><line x1="38" y1="20" x2="41.5" y2="20"/>
            <line x1="2.5" y1="20" x2="6" y2="20"/><line x1="33.5" y1="8.5" x2="36" y2="6"/>
            <line x1="10.5" y1="8.5" x2="8" y2="6"/>
          </g> : null}
        </g>;
      }
      // Multi-bit: a read-only numeric pill, same amber-when-nonzero cue as
      // every other signal on the board.
      const text = engine.formatBits(on, bits, state.widgetState.numFormat, state.widgetState.numSigned);
      const fontSize = text.length > 10 ? 7 : text.length > 6 ? 9 : 11;
      return <g>
        {on ? <rect x="0" y="3" width="56" height="34" rx="8" fill="var(--high)" opacity=".14"/> : null}
        <rect x="2" y="5" width="52" height="30" rx="7" fill={on?'var(--high-soft)':'var(--panel-2)'}
              stroke={on?'var(--high-2)':'var(--border-hi)'} strokeWidth="2"/>
        <text x="28" y="24" fontFamily="var(--mono)" fontSize={fontSize} fontWeight="700"
              textAnchor="middle" fill={on?'var(--high-2)':'var(--ink-2)'}>{text}</text>
        {label}
      </g>;
    } };

  /* Seven-segment display. Light-themed like the rest of the board, and lit
     in the same amber as every other high signal rather than a red LED — the
     colour means "high" here exactly as it does on a wire. Pin *indices* keep
     their historical segment mapping (0=g, 1=f, 2=a, 3=b, 4=e, 5=d, 6=c) and
     their slot positions, so circuits saved against the old artwork still
     light up the segments they used to. */
  //
  // 100×140 (was 60×80): at the old size the pins sat 12px apart, off the
  // grid. At this width the same slots (20/40/60/80% across) land exactly
  // on grid lines 20px apart, and the height keeps the box turnable on the
  // grid (see VIS.OUTPUT). The digit is laid out from the box rather than
  // hard-coded, in the same proportions as before.
  const S7 = { w:100, h:140 };
  VIS.SEVEN = { w:S7.w, h:S7.h,
    // Slot k of 5 across the top/bottom edge. Built as (w/5)·k, not w·0.2k:
    // 100*0.6 is 60.00000000000001 in floating point, which would put the
    // pin a hair off the grid and break exact-match wire routing.
    inputs:[1,2,3,4].map(k=>({x:S7.w/5*k, y:0, dir:'up'}))
      .concat([1,2,3].map(k=>({x:S7.w/5*k, y:S7.h, dir:'down'}))),
    outputs:[],
    body:(f,comp)=>{
      const lit = (i)=>!!comp.inputVals[i];
      const T = 7.5, R = T/2;                       // segment thickness, radius
      const L = S7.w*0.307, Rt = S7.w*0.693;        // left / right
      const Mid = S7.h/2, Top = S7.h*0.24, Bot = S7.h*0.76;
      const bar = (i, x, y, w, h)=><rect key={i} x={x} y={y} width={w} height={h} rx={R}
        fill={lit(i) ? 'var(--high)' : 'var(--border-md)'} opacity={lit(i) ? 1 : .5}/>;
      const hBar = (i, y)=>bar(i, L + T*0.6, y - T/2, (Rt - L) - T*1.2, T);
      const vBar = (i, y0, y1)=>bar(i, L - T/2, y0 + T*0.6, T, (y1 - y0) - T*1.2);
      const vBarR = (i, y0, y1)=>bar(i, Rt - T/2, y0 + T*0.6, T, (y1 - y0) - T*1.2);
      return <g>
        <rect x="3" y="9" width={S7.w-6} height={S7.h-18} rx="12"
              fill="var(--panel-2)" stroke="var(--border-hi)" strokeWidth="2"/>
        {hBar(2, Top)}{hBar(0, Mid)}{hBar(5, Bot)}
        {vBar(1, Top, Mid)}{vBar(4, Mid, Bot)}
        {vBarR(3, Top, Mid)}{vBarR(6, Mid, Bot)}
      </g>;
    } };

  function ffRect(f,h,edge,w=80){
    return <rect x="6" y="6" width={w-12} height={h-12} rx="8" fill={f} stroke={edge} strokeWidth="2"/>;
  }
  const ffTxt = (x,y,t)=><text x={x} y={y} fontFamily="var(--mono)" fontSize="12" fontWeight="500" fill="var(--ink)" opacity=".8">{t}</text>;
  const ffTxtR = (x,y,t)=><text x={x} y={y} textAnchor="end" fontFamily="var(--mono)" fontSize="12" fontWeight="500" fill="var(--ink)" opacity=".8">{t}</text>;
  const ffSub = (t,y)=><text x="40" y={y} fontFamily="var(--ui)" fontSize="9" fontWeight="600" textAnchor="middle" fill="var(--ink)" opacity=".3">{t}</text>;
  // Type + width together, centered: "REG" alone at the default 1 bit, or
  // "REG · 8b" once it's been widened — sitting just above the value pill
  // rather than tucked in a corner, since together they're the two things
  // that actually describe what this box is doing.
  const ffCap = (label, bits, y, w)=><text x={w/2} y={y} textAnchor="middle" fontFamily="var(--ui)"
    fontSize="9" fontWeight="700" letterSpacing=".02em" fill="var(--ink)" opacity=".4">
    {bits > 1 ? `${label} · ${bits}b` : label}</text>;
  // What a register is actually holding, front and center — the whole
  // point of the box. Auto-shrinks past a handful of characters so a wide
  // register in binary doesn't spill out of it.
  function ffVal(comp, cy, w) {
    const bits = comp.bits || 1;
    const val = comp.state.q || 0;
    const text = engine.formatBits(val, bits, state.widgetState.numFormat, state.widgetState.numSigned);
    const fontSize = text.length > 12 ? 6.5 : text.length > 8 ? 8 : text.length > 5 ? 10 : 12;
    // Capped well short of the box edge so it can never grow into the D/▷/Q
    // pin labels flanking it, no matter how long the text gets.
    const pw = Math.min(w - 46, Math.max(30, 10 + text.length * fontSize * 0.64));
    return <g>
      <rect x={w/2-pw/2} y={cy-11} width={pw} height="22" rx="7"
            fill={val ? 'var(--high-soft)' : 'var(--panel-2)'} stroke={val ? 'var(--high-2)' : 'var(--border-hi)'} strokeWidth="1.5"/>
      <text x={w/2} y={cy+4} textAnchor="middle" fontFamily="var(--mono)" fontSize={fontSize} fontWeight="700"
            fill={val ? 'var(--high-2)' : 'var(--ink-2)'}>{text}</text>
    </g>;
  }

  VIS.DFF  = { w:80,h:80, inputs:[{x:0,y:20},{x:0,y:60}], outputs:[{x:80,y:40}],
    body:(f,comp,e)=><g>{pendingBar(comp)}{ffRect(f,80,e)}{ffTxt(14,25,'D')}{ffTxt(14,65,'▷')}{ffTxt(64,45,'Q')}{ffSub('D',44)}</g> };
  VIS.TFF  = { w:80,h:80, inputs:[{x:0,y:20},{x:0,y:60}], outputs:[{x:80,y:40}],
    body:(f,comp,e)=><g>{pendingBar(comp)}{ffRect(f,80,e)}{ffTxt(14,25,'T')}{ffTxt(14,65,'▷')}{ffTxt(64,45,'Q')}{ffSub('T',44)}</g> };
  VIS.SRFF = { w:80,h:80, inputs:[{x:0,y:20},{x:0,y:60}], outputs:[{x:80,y:40}],
    body:(f,comp,e)=><g>{pendingBar(comp)}{ffRect(f,80,e)}{ffTxt(14,25,'S')}{ffTxt(14,65,'R')}{ffTxt(64,45,'Q')}{ffSub('SR',44)}</g> };
  VIS.JKFF = { w:80,h:120, inputs:[{x:0,y:20},{x:0,y:60},{x:0,y:100}], outputs:[{x:80,y:40}],
    body:(f,comp,e)=><g>{pendingBar(comp)}{ffRect(f,120,e)}{ffTxt(14,25,'J')}{ffTxt(14,65,'K')}{ffTxt(14,105,'▷')}{ffTxt(64,45,'Q')}{ffSub('JK',64)}</g> };

  // The multi-bit family: wider than the 1-bit flip-flops above, and tall
  // enough to fit a type/width caption and a value pill below the pins
  // without crowding either — the whole reason someone reaches for a
  // register instead of a flip-flop is to watch a bus's worth of state, so
  // that value (and what it's measured in) belongs front and center.
  //
  // Heights are 140/180 (were 130/170): with a 100px width, w − h has to be
  // a multiple of 40 for the pins to stay on the grid when the part is
  // turned up or down (see VIS.OUTPUT). SHIFT's outputs move from y 25/65 —
  // off the grid even unturned — to 20/60, level with SI and ▷.
  const REG_W = 100;
  VIS.REG  = { w:REG_W,h:140, inputs:[{x:0,y:20},{x:0,y:60}], outputs:[{x:REG_W,y:40}],
    body:(f,comp,e)=><g>{pendingBar(comp)}{ffRect(f,140,e,REG_W)}
      {ffTxt(14,25,'D')}{ffTxt(14,65,'▷')}{ffTxtR(REG_W-14,45,'Q')}
      {ffCap('REG',comp.bits||1,94,REG_W)}{ffVal(comp,114,REG_W)}</g> };
  VIS.LOAD = { w:REG_W,h:180, inputs:[{x:0,y:20},{x:0,y:60},{x:0,y:100}], outputs:[{x:REG_W,y:40}],
    body:(f,comp,e)=><g>{pendingBar(comp)}{ffRect(f,180,e,REG_W)}
      {ffTxt(14,25,'D')}{ffTxt(14,65,'LD')}{ffTxt(14,105,'▷')}{ffTxtR(REG_W-14,45,'Q')}
      {ffCap('LOAD',comp.bits||1,132,REG_W)}{ffVal(comp,152,REG_W)}</g> };
  VIS.SHIFT = { w:REG_W,h:140, inputs:[{x:0,y:20},{x:0,y:60}], outputs:[{x:REG_W,y:20},{x:REG_W,y:60}],
    body:(f,comp,e)=><g>{pendingBar(comp)}{ffRect(f,140,e,REG_W)}
      {ffTxt(14,25,'SI')}{ffTxt(14,65,'▷')}{ffTxtR(REG_W-14,25,'Q')}{ffTxtR(REG_W-14,65,'SO')}
      {ffCap('SHIFT',comp.bits||1,94,REG_W)}{ffVal(comp,114,REG_W)}</g> };

  /* ── pin stubs ─────────────────────────────────────────────────────────
     Each stub normally points 'left' (inputs) or 'right' (outputs) toward
     the body, but a pin can override with its own `dir` to poke out another
     side — e.g. a mux select facing 'up' — independent of gate facing. */
  const PIN_DIR_VEC = { left:[-1,0], right:[1,0], up:[0,-1], down:[0,1] };
  // `reach` lets a pin run its stub further in than the usual 12px, to meet
  // a body edge that isn't straight (see backX).
  function pinStub(p, defaultDir) {
    const [dx,dy] = PIN_DIR_VEC[p.dir || defaultDir];
    const len = p.reach || 12;
    return { x1:p.x-dx*len, y1:p.y-dy*len, x2:p.x, y2:p.y };
  }

  /* ── orientation ───────────────────────────────────────────────────────
     One transform for everything drawn in a part's own frame (body,
     selection outline, in-place control): the optional top↔bottom flip is
     applied first, then the facing. Must agree with engine.pinAbs. */
  function orientT(comp, vis) {
    const f = comp.facing === 'left'
      ? `translate(${vis.w} 0) scale(-1 1)`
      : `rotate(${comp.facing==='up'?270:comp.facing==='down'?90:0} ${vis.w/2} ${vis.h/2})`;
    return comp.flip ? `${f} translate(0 ${engine.flipAxis(vis)}) scale(1 -1)` : f;
  }

  // A mirrored part would otherwise mirror its lettering too. Rather than
  // hand-correct every <text> in every body, un-mirror each one in place
  // about its own centre once it's laid out. Written as a plain `transform`
  // attribute, not CSS, so the PDF export (which strips classes and styles)
  // keeps it.
  function useReadableText(ref, mx, my) {
    React.useLayoutEffect(()=>{
      const g = ref.current; if (!g) return;
      g.querySelectorAll('text').forEach(t=>{
        if (!mx && !my) {
          if (t.hasAttribute('data-cf')) { t.removeAttribute('transform'); t.removeAttribute('data-cf'); }
          return;
        }
        let b; try { b = t.getBBox(); } catch (_) { return; }  // not rendered yet
        const cx = b.x + b.width/2, cy = b.y + b.height/2;
        t.setAttribute('transform', `translate(${cx} ${cy}) scale(${mx?-1:1} ${my?-1:1}) translate(${-cx} ${-cy})`);
        t.setAttribute('data-cf', '1');
      });
    });
  }

  function GateBody({ comp, ghost }) {
    const ref = React.useRef(null);
    useReadableText(ref, comp.facing === 'left', !!comp.flip);
    const def = GATE_DEFS[comp.kind], vis = VIS[comp.kind];
    if (!vis || !def) return null;
    const fill = FAMILY_FILL[def.family] || '#fff';
    const edge = ghost ? 'var(--border-hi)' : (FAMILY_EDGE[def.family] || 'var(--ink)');
    const label = def.label;
    return <g ref={ref} transform={orientT(comp, vis)}>
      {vis.inputs.map((p,i)=>{ const s=pinStub(p,'left');
        return <line key={'i'+i} {...s} stroke="var(--gate-edge)" strokeWidth="2" strokeLinecap="round"/>; })}
      {vis.outputs.map((p,i)=>{ const s=pinStub(p,'right');
        return <line key={'o'+i} {...s} stroke="var(--gate-edge)" strokeWidth="2" strokeLinecap="round"/>; })}
      {vis.body(fill, comp, edge)}
      {['AND','OR','NAND','NOR','XOR','XNOR','MUX'].includes(engine.kindBase(comp.kind)) &&
        <text x={vis.w/2+2} y={vis.h/2+4} textAnchor="middle" fontFamily="var(--mono)"
              fontSize="9.5" fontWeight="600" fill="var(--ink)" opacity=".38" pointerEvents="none">{label}</text>}
      {['AND','OR','NOT','NAND','NOR','XOR','XNOR','MUX'].includes(engine.kindBase(comp.kind)) && (comp.bits||1) > 1 &&
        <text x={vis.w-3} y="10" textAnchor="end" fontFamily="var(--mono)"
              fontSize="8" fontWeight="700" fill="var(--ink-2)" opacity=".55" pointerEvents="none">{(comp.bits||1)+'b'}</text>}
    </g>;
  }

  /* ── custom gates ──────────────────────────────────────────────────────
     Registers a saved circuit as a placeable component: a white box sized to
     fit its inputs (left) / outputs (right), simulated as a black box by
     settling a private nested circuit on every compute(). */
  // Greedy word-wrap for the box label at ~6px/char, hard-breaking any single
  // word too long for the line so it can't overflow the box.
  function wrapLabel(text, maxChars) {
    const words = String(text).split(/\s+/).filter(Boolean);
    const lines = []; let cur = '';
    for (const w of words) {
      const test = cur ? cur+' '+w : w;
      if (test.length > maxChars && cur) { lines.push(cur); cur = w; } else cur = test;
    }
    if (cur) lines.push(cur);
    return lines.flatMap(line => {
      if (line.length <= maxChars) return [line];
      const chunks = [];
      for (let i=0;i<line.length;i+=maxChars) chunks.push(line.slice(i,i+maxChars));
      return chunks;
    });
  }
  function registerCustomGate(name, data) {
    const kindKey = 'CUSTOM:' + name;
    const tmp = engine.createCircuit();
    tmp.load(data);
    // Ordered by y so the box's pin stack matches how the IO was laid out
    // top-to-bottom in the saved circuit, not creation order.
    const ins  = [...tmp.ioComponents.values()].filter(c=>c.kind==='INPUT').sort((a,b)=>a.y-b.y);
    const outs = [...tmp.ioComponents.values()].filter(c=>c.kind==='OUTPUT').sort((a,b)=>a.y-b.y);
    const inIds=ins.map(c=>c.ioId), outIds=outs.map(c=>c.ioId);
    const inLabels=ins.map(c=>c.label), outLabels=outs.map(c=>c.label);
    // Each outside pin is as wide as the INPUT/OUTPUT it stands for, so a
    // 4-bit IN inside the module becomes a 4-bit pin on the box.
    const inBits  = ins.map(c=>engine.clampBits(c.bits||1));
    const outBits = outs.map(c=>engine.clampBits(c.bits||1));

    const h = boxHeightFor(Math.max(inIds.length, outIds.length, 1));
    const inYs = pinYs(inIds.length, h), outYs = pinYs(outIds.length, h);
    const nameLines = wrapLabel(name, Math.max(3, Math.floor((W-18)/6)));
    const nameLineH = 12;
    const nameStartY = h/2 - (nameLines.length-1)*nameLineH/2 + 4;

    GATE_DEFS[kindKey] = {
      kind:kindKey, label:name, inputs:inIds.length, outputs:outIds.length, family:'custom',
      inBits, outBits,
      compute(inputVals, st) {
        if (!st.sub) { st.sub = engine.createCircuit(); st.sub.load(data); }
        const sub = st.sub;
        inIds.forEach((ioId,i)=>{ const c=sub.ioComponents.get(ioId); if (c) c.state.value = (inputVals[i]||0) & engine.bitMask(inBits[i]); });
        // A custom gate is one hop from the outside, so its interior settles
        // instantly rather than adding its own internal hop count.
        for (let i=0;i<8;i++) sub.step(state.widgetState.now, 0, true);
        return outIds.map((ioId,i)=>{ const c=sub.ioComponents.get(ioId); return c ? ((c.inputVals[0]||0) & engine.bitMask(outBits[i])) : 0; });
      },
    };

    VIS[kindKey] = {
      w:W, h,
      inputs: inYs.map(y=>({x:0,y})),
      outputs: outYs.map(y=>({x:W,y})),
      body:(f,comp,edge)=><g>
        <rect x="0" y="0" width={W} height={h} rx="8" fill="var(--bg)" stroke={edge} strokeWidth="2"/>
        <text x={W/2} textAnchor="middle" fontFamily="var(--mono)" fontSize="10" fontWeight="600" fill="var(--ink)" opacity=".7">
          {nameLines.map((line,i)=><tspan key={i} x={W/2} y={nameStartY+i*nameLineH}>{line}</tspan>)}
        </text>
        {inLabels.map((lbl,i)=><text key={'i'+i} x="8" y={inYs[i]+3.5} fontFamily="var(--mono)" fontSize="9" fill="var(--ink)" opacity=".6">{lbl}</text>)}
        {outLabels.map((lbl,i)=><text key={'o'+i} x={W-8} y={outYs[i]+3.5} textAnchor="end" fontFamily="var(--mono)" fontSize="9" fill="var(--ink)" opacity=".6">{lbl}</text>)}
      </g>,
    };
    return kindKey;
  }

  /* ── bus combine / split ──────────────────────────────────────────────
     Two structural parts rather than one bidirectional "splitter": COMBINE
     takes n separate 1-bit inputs and packs them into a single n-bit
     output (input pin i becomes bit i); SPLIT takes one n-bit input and
     unpacks it back into n separate 1-bit outputs the same way. Each width
     is its own registered kind ("COMBINE:4", "SPLIT:8", …) exactly like a
     custom gate gets its own kind — that way every bit of existing
     machinery that keys off a component's `kind` (pin counts, save/load,
     the palette thumbnail) just works with no special-casing. */
  // A multiple of 2×GRID, like every gate box: pins sit on x=0 and x=BUS_W,
  // and a 90° turn pivots about (w/2, h/2), so both edges and the centre
  // have to land on grid lines for the pins to stay on the grid in every
  // orientation. (It was 64 — 4px off the grid on the output side, and up
  // to 12px off once rotated.)
  const BUS_W = 40;
  function ensureBusKind(base, n) {
    n = engine.clampBits(n);
    const kind = base + ':' + n;
    if (GATE_DEFS[kind]) return kind;
    const h = boxHeightFor(n);
    const ys = pinYs(n, h);
    const isCombine = base === 'COMBINE';
    GATE_DEFS[kind] = isCombine
      ? { kind, label:'COMBINE', inputs:n, outputs:1, family:'bus',
          compute(inputVals){ let v=0; for (let i=0;i<n;i++) if (inputVals[i]) v |= (1<<i); return [v & engine.bitMask(n)]; } }
      : { kind, label:'SPLIT', inputs:1, outputs:n, family:'bus',
          compute([v]){ v = v||0; const out=[]; for (let i=0;i<n;i++) out.push((v>>i)&1); return out; } };
    // Drawn as a comb, not a funnel: every 1-bit pin ties into a spine with
    // a short stub, and the spine joins the one wide-bus pin through a stub
    // of its own. A funnel that has to reach every pin gets more lopsided
    // and wedge-like the taller it is; a spine just gets longer — the part
    // still reads cleanly at 16 bits, not just 2 or 4.
    const SPINE = 8, ARM = 8, SPINE_PAD = 10;
    const yTop = ys[0], yBot = ys[ys.length-1], yMid = h/2;
    const defaultLabel = isCombine ? 'COMBINE' : 'SPLIT';
    const hasSpine = ys.length > 1;
    // Every pin already gets a 12px wire-stub drawn for free (same as any
    // other gate); the spine sits flush against exactly where those end,
    // so a wire visibly runs straight into the device with no dead air
    // between the two — rather than the pin looking unconnected.
    const spineX  = isCombine ? 12 + SPINE/2 : BUS_W - 12 - SPINE/2;
    // Without a spine (a single pin on the many-bits side) the arm just
    // runs straight across, same as any other pass-through.
    const armFrom = isCombine ? (hasSpine ? spineX : 12) : 12;
    const armTo   = isCombine ? BUS_W-12 : (hasSpine ? spineX : BUS_W-12);
    VIS[kind] = {
      w: BUS_W, h,
      inputs:  isCombine ? ys.map(y=>({x:0,y}))   : [{x:0, y:yMid}],
      outputs: isCombine ? [{x:BUS_W, y:yMid}]    : ys.map(y=>({x:BUS_W,y})),
      body:(f,comp,edge)=><g>
        {/* Runs a bit past the first and last pin rather than stopping
            exactly on them, so it reads as one continuous spine those pins
            tie into, not a bar that just barely reaches the outermost two. */}
        {hasSpine && <rect x={spineX-SPINE/2} y={yTop-SPINE_PAD} width={SPINE} height={(yBot-yTop)+SPINE_PAD*2} rx={SPINE/2}
                           fill={f} stroke={edge} strokeWidth={STROKE}/>}
        <rect x={armFrom} y={yMid-ARM/2} width={Math.max(armTo-armFrom, ARM)} height={ARM} rx={ARM/2}
              fill={f} stroke={edge} strokeWidth={STROKE}/>
        {/* Covers the seam where the spine and arm overlap, and doubles as
            an "everything merges here" marker. */}
        {hasSpine && <circle cx={spineX} cy={yMid} r="4.5" fill={edge}/>}
        {/* Tucked just above each pin's own stub rather than off to the
            side of it, so there's no need to fight the spine for space —
            the stub (and now the spine flush against it) stay uncluttered. */}
        {isCombine
          ? ys.map((y,i)=><text key={i} x="6" y={y-5} textAnchor="middle" fontFamily="var(--mono)" fontSize="7.5" fill="var(--ink)" opacity=".6">{i}</text>)
          : ys.map((y,i)=><text key={i} x={BUS_W-6} y={y-5} textAnchor="middle" fontFamily="var(--mono)" fontSize="7.5" fill="var(--ink)" opacity=".6">{i}</text>)}
        {/* Only show the name once it's been customized — a default
            "COMBINE"/"SPLIT" caption on every instance would just be noise. */}
        {comp.label && comp.label !== defaultLabel && (isCombine
          ? <text x={BUS_W+8} y={yMid+4} fontFamily="var(--mono)" fontSize="12" fontWeight="600" fill="var(--ink)" opacity=".8">{comp.label}</text>
          : <text x="-8" y={yMid+4} textAnchor="end" fontFamily="var(--mono)" fontSize="12" fontWeight="600" fill="var(--ink)" opacity=".8">{comp.label}</text>)}
      </g>,
    };
    return kind;
  }
  // The palette needs something concrete to show before any instance
  // exists; everyone else (custom sizes included) registers lazily.
  ensureBusKind('COMBINE', 4);
  ensureBusKind('SPLIT', 4);

  return { GATE_VIS: VIS, FAMILY_FILL, FAMILY_EDGE, GateBody, orientT, registerCustomGate, toggleHit, ensureBusKind, ensureGateKind };
});
</script>

<script type="text/babel">
/* ═══ CANVAS ═══════════════════════════════════════════════════════════════

   WIRING MODEL
   ────────────
   One gesture, two ways to perform it — press-drag-release for a quick
   connection, or click-move-click for a considered one. Both run through the
   same state machine, so there's no mode to learn and no way to end up
   holding the mouse button wrong.

     · Press or click any pin       → start a wire (either end works; the
                                      engine sorts out which is the driver)
     · Click empty canvas           → drop a corner and keep going
     · Click / release on a pin     → connect
     · Backspace                    → undo the last corner
     · Esc or right-click           → cancel
     · Drag off an existing wire    → branch from it (a junction tap);
       or click it once to select it,   click it again to start the branch there
     · Click a wire while drawing from an input pin
                                    → connect that input to the wire

   Wires can't be left dangling in mid-air: every wire runs pin-to-pin, which
   is what makes "one net = one hop" a well-defined unit of delay. */
defineModule('canvas', ['state', 'engine', 'gates'], (state, engine, gates) => {
'use strict';
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const { GATE_VIS, GateBody, orientT, toggleHit } = gates;
const {
  GATE_DEFS, GRID, resolveWire, pathD, polyLength, samplePoly,
  projectOnPoly, snapOntoPoly, autoRoute, pinAbs, pinOutDir,
} = engine;

const snap = (v, on=true) => on ? Math.round(v/GRID)*GRID : v;
const DRAG_SLOP = 4;

// Clock periods are powers of two in seconds, slowest → fastest.
const CLOCK_PERIODS = [8000,4000,2000,1000,500,250,125,62.5];
const CLOCK_PERIOD_LABELS = ['8s','4s','2s','1s','1/2s','1/4s','1/8s','1/16s'];
function nearestClockPeriodIndex(ms) {
  let best=0, bestDiff=Infinity;
  CLOCK_PERIODS.forEach((p,i)=>{ const d=Math.abs(p-ms); if (d<bestDiff) { bestDiff=d; best=i; } });
  return best;
}

/* ── net geometry ────────────────────────────────────────────────────────
   A net's pulse animation is laid out by *distance travelled through the
   tree*, not per wire: every wire knows how far along the net it starts
   (`d0`) and how long it is. A branch lights up when the pulse reaches its
   junction, and every sink on the net lands at exactly one hop.

   The pulse's pace isn't one speed for the whole net, though — that let it
   reach a short branch's end early and sit there until the longest branch
   finished, so a nearby output looked stuck. Instead it travels each stretch
   at the pace that would reach the farthest end still ahead of it exactly
   at one hop. Where a branch splits off toward a nearer end, that branch
   (and the rest of the trunk, once the farthest end is behind it) slows to
   arrive on time. Every end is reached exactly when its sink updates.

   Each wire gets `sched`: [distance along the wire, fraction of the hop]
   knots, piecewise linear from where the pulse enters it to 1 at its end. */
function buildNetGeometry(circuit) {
  const paths = new Map();   // wireId -> resolved polyline
  const geom  = new Map();   // wireId -> {d0, len, root}
  const nets  = new Map();   // signal key -> {total, wireIds:[]}
  const wires = [...circuit.wires.values()];
  for (const w of wires) paths.set(w.id, circuit.wirePoints(w));

  const childrenOf = new Map();
  const roots = [];
  for (const w of wires) {
    if (circuit.isTap(w.from)) {
      if (!childrenOf.has(w.from.wireId)) childrenOf.set(w.from.wireId, []);
      childrenOf.get(w.from.wireId).push(w);
    } else if (circuit.isPin(w.from)) roots.push(w);
  }
  // Where each branch leaves its parent, and the longest run from a wire's
  // start to any end beyond it.
  const lenOf = new Map(), tapsOf = new Map(), remMemo = new Map();
  const wireLen = (w) => {
    if (!lenOf.has(w.id)) lenOf.set(w.id, polyLength(paths.get(w.id) || []));
    return lenOf.get(w.id);
  };
  const taps = (w) => {
    if (!tapsOf.has(w.id)) {
      tapsOf.set(w.id, (childrenOf.get(w.id) || []).map(c => ({
        c, at: projectOnPoly(paths.get(w.id) || [], c.from.x, c.from.y).along,
      })).sort((a, b) => a.at - b.at));
    }
    return tapsOf.get(w.id);
  };
  const remFrom = (w, depth = 0) => {
    if (remMemo.has(w.id)) return remMemo.get(w.id);
    remMemo.set(w.id, wireLen(w));             // guards a (malformed) loop
    let r = wireLen(w);
    if (depth < 24) for (const t of taps(w)) r = Math.max(r, t.at + remFrom(t.c, depth + 1));
    remMemo.set(w.id, r);
    return r;
  };
  // Farthest end ahead of distance `s` on wire w (branches at `s` included
  // when `incl`).
  const remAt = (w, s, incl) => {
    let r = wireLen(w) - s;
    for (const t of taps(w)) if (incl ? t.at >= s : t.at > s) r = Math.max(r, t.at - s + remFrom(t.c));
    return r;
  };

  const walk = (w, d0, f0, rootKey, net, depth) => {
    if (geom.has(w.id) || depth > 24) return;
    const len = wireLen(w);
    // The pulse's schedule along this wire, from fraction f0 at its start.
    const sched = [[0, f0]];
    const childAt = [];
    let s = 0, f = f0;
    const stops = [...new Set([...taps(w).map(t => t.at), len])].filter(x => x >= 0 && x <= len).sort((a, b) => a - b);
    for (const b of stops) {
      const rem = remAt(w, s, s === 0);
      const slope = rem > 0 ? (1 - f) / rem : 0;
      f = Math.min(1, f + slope * (b - s));
      s = b;
      sched.push([s, f]);
      for (const t of taps(w)) if (t.at === b) childAt.push([t.c, t.at, f]);
    }
    geom.set(w.id, { d0, len, root: rootKey, sched });
    net.wireIds.push(w.id);
    net.total = Math.max(net.total, d0 + len);
    for (const [child, along, fc] of childAt) walk(child, d0 + along, fc, rootKey, net, depth+1);
  };
  for (const w of roots) {
    const key = circuit.sigKey(w.from.compId, w.from.pin);
    if (!nets.has(key)) nets.set(key, { total:0, wireIds:[] });
    walk(w, 0, 0, key, nets.get(key), 0);
  }
  return { paths, geom, nets };
}

// How far along a wire (0–1) the pulse is, `frac` of the way through its hop.
function pulseAlong(g, frac) {
  const k = g.sched;
  if (!k || !g.len) return 0;
  if (frac <= k[0][1]) return 0;
  for (let i = 1; i < k.length; i++) {
    const [s1, f1] = k[i], [s0, f0] = k[i - 1];
    if (frac <= f1) return (f1 > f0 ? s0 + (s1 - s0) * (frac - f0) / (f1 - f0) : s1) / g.len;
  }
  return 1;
}

function Canvas({
  circuit, selection, onSelect, paletteDrag, onClearPaletteDrag,
  onChange, onCommit, viewApi, onViewChange,
}) {
  const svgRef = useRef(null);
  const [view, setView] = useState({x:40,y:40,zoom:1});
  const [wiring, setWiring] = useState(null);   // {from, bends:[], hoverKey}
  const [cursor, setCursor] = useState({x:0,y:0});
  const [hover, setHover] = useState({ pin:null, wire:null, comp:null, knob:null });
  const [isPanning, setIsPanning] = useState(false);
  const [flash, setFlash] = useState(null);     // transient rejection reason

  // Drag state lives in refs so the global listeners never see a stale closure.
  const panRef      = useRef(null);
  const compDragRef = useRef(null);
  const bendDragRef = useRef(null);
  const tapPendRef  = useRef(null);
  const wiringRef   = useRef(null);
  const viewRef     = useRef(view);
  const hoverRef    = useRef(hover);
  const cbRef       = useRef({});
  cbRef.current = { onChange, onCommit, onSelect, onClearPaletteDrag, paletteDrag };
  useEffect(()=>{ viewRef.current = view; onViewChange?.(view); },[view]);
  useEffect(()=>{ wiringRef.current = wiring; },[wiring]);
  useEffect(()=>{ hoverRef.current = hover; },[hover]);

  // One repaint per frame keeps the simulation display live.
  const [, tick] = useState(0);
  useEffect(()=>{
    let r; const loop=()=>{ tick(n=>(n+1)%1e6); r=requestAnimationFrame(loop); };
    r=requestAnimationFrame(loop); return ()=>cancelAnimationFrame(r);
  },[]);

  const screenToWorld = useCallback((sx,sy)=>{
    const r = svgRef.current.getBoundingClientRect(), v = viewRef.current;
    return { x:(sx-r.left)/v.zoom - v.x, y:(sy-r.top)/v.zoom - v.y };
  },[]);

  /* ── imperative view controls for the toolbar ───────────────────────── */
  useEffect(()=>{
    if (!viewApi) return;
    viewApi.current = {
      zoomBy(f) {
        const el = svgRef.current; if (!el) return;
        const r = el.getBoundingClientRect(), v = viewRef.current;
        const cx = r.width/2/v.zoom - v.x, cy = r.height/2/v.zoom - v.y;
        const nz = Math.max(.25, Math.min(3, v.zoom*f));
        setView({ x:r.width/2/nz - cx, y:r.height/2/nz - cy, zoom:nz });
      },
      reset() { setView({x:40,y:40,zoom:1}); },
      // The live board, for the PDF export.
      svg() { return svgRef.current; },
      // Where to drop something the user clicked (rather than dragged) in.
      centerWorld() {
        const el = svgRef.current, v = viewRef.current;
        if (!el) return { x:120, y:120 };
        const r = el.getBoundingClientRect();
        return { x: r.width/2/v.zoom - v.x, y: r.height/2/v.zoom - v.y };
      },
      fit() {
        const el = svgRef.current; if (!el) return;
        const comps = [...circuit.components.values()];
        if (!comps.length) { setView({x:40,y:40,zoom:1}); return; }
        let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
        for (const c of comps) {
          const vis = GATE_VIS[c.kind]; if (!vis) continue;
          const rot = c.facing==='up'||c.facing==='down';
          const w = rot?vis.h:vis.w, h = rot?vis.w:vis.h;
          const cx = c.x+vis.w/2, cy = c.y+vis.h/2;
          x0=Math.min(x0,cx-w/2); y0=Math.min(y0,cy-h/2);
          x1=Math.max(x1,cx+w/2); y1=Math.max(y1,cy+h/2);
        }
        const pad = 60;
        const r = el.getBoundingClientRect();
        const nz = Math.max(.25, Math.min(2, Math.min(r.width/(x1-x0+pad*2), r.height/(y1-y0+pad*2))));
        setView({ x: -x0 + (r.width/nz-(x1-x0))/2, y: -y0 + (r.height/nz-(y1-y0))/2, zoom:nz });
      },
    };
  },[circuit, viewApi]);

  /* ── wiring helpers ─────────────────────────────────────────────────── */
  const pinKey = (compId, kind, idx) => compId+'/'+kind+'/'+idx;
  const termOf = (comp, kind, idx) => ({ compId:comp.id, pin:idx, type: kind==='in'?'in':'out' });

  // Would connecting the in-progress wire to this pin work? Returns null when
  // it would, or the reason it wouldn't — the canvas dims rejected pins and
  // the status bar explains why on a failed click.
  const problemWith = useCallback((from, term) => {
    if (!from) return 'no wire in progress';
    if (circuit.isPin(from) && from.type === 'in') {
      // Ending on a wire means "feed this input from whatever drives that".
      if (circuit.isTap(term)) return circuit.connectionProblem(term, from);
      if (term.type !== 'out') return 'that end needs an output pin or a wire';
      return circuit.connectionProblem(term, from);
    }
    if (circuit.isTap(term)) return 'a wire has to end on an input pin';
    return circuit.connectionProblem(from, term);
  },[circuit]);

  const cancelWiring = useCallback(()=>{ wiringRef.current=null; setWiring(null); },[]);

  const reject = useCallback((reason)=>{
    setFlash({ reason, at: performance.now() });
  },[]);
  useEffect(()=>{
    if (!flash) return;
    const t = setTimeout(()=>setFlash(null), 2200);
    return ()=>clearTimeout(t);
  },[flash]);

  const finishWire = useCallback((term)=>{
    const wf = wiringRef.current;
    if (!wf) return false;
    const problem = problemWith(wf.from, term);
    if (problem) { reject(problem); return false; }
    const reversed = circuit.isPin(wf.from) && wf.from.type === 'in';
    const from = reversed ? term : wf.from;
    const to   = reversed ? wf.from : term;
    const bends = reversed ? [...wf.bends].reverse() : wf.bends;
    // No manual corners → leave `points` empty so the wire keeps
    // auto-routing itself as components move.
    const w = circuit.addWire(from, to, bends.length ? bends.map(p=>({...p})) : []);
    cancelWiring();
    if (w) { cbRef.current.onCommit?.('connect'); cbRef.current.onSelect?.(w.id); }
    return !!w;
  },[circuit, problemWith, reject, cancelWiring]);

  /* ── global mouse handling ──────────────────────────────────────────── */
  useEffect(()=>{
    const onMove = (e)=>{
      const w = screenToWorld(e.clientX, e.clientY);
      setCursor(w);
      if (panRef.current) {
        const p = panRef.current;
        setView(v=>({ ...v, x:p.vx+(e.clientX-p.sx)/v.zoom, y:p.vy+(e.clientY-p.sy)/v.zoom }));
      }
      if (compDragRef.current) {
        const d = compDragRef.current;
        if (Math.hypot(e.clientX-d.sx, e.clientY-d.sy) > DRAG_SLOP) {
          d.moved = true;
          const c = circuit.components.get(d.id);
          if (c) { c.x = snap(w.x-d.ox); c.y = snap(w.y-d.oy); cbRef.current.onChange?.(); }
        }
      }
      if (bendDragRef.current) {
        const d = bendDragRef.current, wire = circuit.wires.get(d.wireId);
        if (wire?.points?.[d.idx]) {
          d.moved = true;
          wire.points[d.idx] = { x:snap(w.x+d.ox), y:snap(w.y+d.oy) };
          cbRef.current.onChange?.();
        }
      }
      // A press on a wire only becomes a branch once it actually moves;
      // otherwise it's just a click that selects the wire.
      if (tapPendRef.current && Math.hypot(e.clientX-tapPendRef.current.sx, e.clientY-tapPendRef.current.sy) > DRAG_SLOP) {
        const t = tapPendRef.current; tapPendRef.current = null;
        const wf = { from:{ wireId:t.wireId, x:t.x, y:t.y }, bends:[], live:true };
        wiringRef.current = wf; setWiring(wf);
      }
    };

    const onUp = (e)=>{
      // A palette part only lands if the gesture actually finished over the
      // board. Releasing back on the palette is a plain click, which the
      // palette itself turns into a drop at the centre of the view — doing
      // both here would place two copies.
      const overBoard = !!(e.target && e.target.closest && e.target.closest('.canvas-wrap'));
      if (cbRef.current.paletteDrag && overBoard) {
        const pd = cbRef.current.paletteDrag;
        const wp = screenToWorld(e.clientX, e.clientY);
        const vis = GATE_VIS[pd.kind];
        if (vis) {
          const c = circuit.addComponent(pd.kind, snap(wp.x-vis.w/2), snap(wp.y-vis.h/2));
          cbRef.current.onCommit?.('add '+pd.kind);
          cbRef.current.onSelect?.(c.id);
        }
      }
      if (cbRef.current.paletteDrag) cbRef.current.onClearPaletteDrag?.();
      if (compDragRef.current) {
        const d = compDragRef.current;
        if (!d.moved) {
          // Operating a control is a transient act, not an edit — it doesn't
          // push an undo snapshot, the way flipping a real switch wouldn't
          // change the wiring diagram.
          if (d.action === 'input') {
            const c = circuit.components.get(d.id);
            const bits = c ? (c.bits||1) : 1;
            if (bits > 1) {
              const vis = GATE_VIS[c.kind];
              let leftHalf = d.ox < (vis?.w||80)/2;
              if (c.facing === 'left') leftHalf = !leftHalf;
              circuit.stepInput(d.id, leftHalf ? -1 : 1);
            } else {
              circuit.toggleInput(d.id);
            }
            cbRef.current.onChange?.();
          }
          if (d.action === 'clock') { circuit.toggleClock(d.id); cbRef.current.onChange?.(); }
        } else cbRef.current.onCommit?.('move');
        compDragRef.current = null;
      }
      if (bendDragRef.current) {
        if (bendDragRef.current.moved) cbRef.current.onCommit?.('reshape wire');
        bendDragRef.current = null;
      }
      if (tapPendRef.current) {
        const t = tapPendRef.current; tapPendRef.current = null;
        // Same click-to-start rhythm as a pin, but the first click on a wire
        // still just selects it (it has to — that's how you label or delete
        // one); a second click on the selected wire starts the branch.
        if (t.wasSelected && circuit.wires.has(t.wireId)) {
          const wf = { from:{ wireId:t.wireId, x:t.x, y:t.y }, bends:[] };
          wiringRef.current = wf; setWiring(wf);
        } else cbRef.current.onSelect?.(t.wireId);
      }
      panRef.current = null;
      setIsPanning(false);
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return ()=>{ window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  },[circuit, screenToWorld]);

  /* ── keyboard ──────────────────────────────────────────────────────── */
  useEffect(()=>{
    const onKey = (e)=>{
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      const wf = wiringRef.current;
      if (e.key === 'Escape') {
        if (wf) cancelWiring(); else cbRef.current.onSelect?.(null);
        return;
      }
      if (wf && (e.key === 'Backspace' || e.key === 'Delete')) {
        // Consume it here: mid-wire, Backspace means "drop that last corner",
        // not "delete whatever happens to be selected".
        e.preventDefault(); e.stopImmediatePropagation();
        if (wf.bends.length) {
          const next = { ...wf, bends: wf.bends.slice(0,-1) };
          wiringRef.current = next; setWiring(next);
        } else cancelWiring();
      }
    };
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  },[cancelWiring]);

  /* ── canvas background ───────────────────────────────────────────────
     Wheel-to-zoom is bound natively with {passive:false}: React registers
     wheel handlers as passive, so preventDefault() there is ignored and the
     page (or the embedding frame) scrolls out from under the canvas. */
  useEffect(()=>{
    const el = svgRef.current;
    if (!el) return;
    const onWheel = (e)=>{
      e.preventDefault();
      const r = el.getBoundingClientRect(), v = viewRef.current;
      const cx = (e.clientX-r.left)/v.zoom - v.x, cy = (e.clientY-r.top)/v.zoom - v.y;
      const nz = Math.max(.25, Math.min(3, v.zoom*Math.exp(-e.deltaY*.0015)));
      setView({ x:(e.clientX-r.left)/nz - cx, y:(e.clientY-r.top)/nz - cy, zoom:nz });
    };
    el.addEventListener('wheel', onWheel, { passive:false });
    return ()=>el.removeEventListener('wheel', onWheel);
  },[]);

  // Drop a corner on the in-progress wire and keep going.
  const addBend = (w)=>{
    const wf = wiringRef.current;
    if (!wf) return;
    const p = { x:snap(w.x), y:snap(w.y) };
    const last = wf.bends[wf.bends.length-1];
    if (!last || last.x !== p.x || last.y !== p.y) {
      const next = { ...wf, bends:[...wf.bends, p] };
      wiringRef.current = next; setWiring(next);
    }
  };
  const drawingFromInput = (wf)=> !!wf && circuit.isPin(wf.from) && wf.from.type === 'in';

  const onBgMouseDown = (e)=>{
    if (e.button === 2) { if (wiringRef.current) cancelWiring(); return; }
    const isBg = e.target === svgRef.current || e.target.classList?.contains('canvas-bg');
    if (!isBg) return;
    const wf = wiringRef.current;
    if (wf && e.button === 0) { addBend(screenToWorld(e.clientX, e.clientY)); return; }
    if (e.button !== 0 && e.button !== 1) return;
    panRef.current = { sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y };
    setIsPanning(true);
    cbRef.current.onSelect?.(null);
  };

  /* ── components ────────────────────────────────────────────────────── */
  // `action` distinguishes the two things a component can be clicked for.
  // When set, the pointer went down on an in-place control (a switch knob, a
  // clock's run/halt pad): it operates the part and deliberately leaves the
  // selection alone — otherwise the properties card would pop up every time
  // someone flicks a switch. A plain press anywhere else selects. Either way
  // a drag moves the component, so a control doubles as a handle.
  const onCompMouseDown = (e, comp, action)=>{
    e.stopPropagation();
    if (e.button === 2) return;
    if (wiringRef.current) return;      // don't grab gates mid-wire
    const w = screenToWorld(e.clientX, e.clientY);
    compDragRef.current = {
      id:comp.id, action, moved:false,
      ox:w.x-comp.x, oy:w.y-comp.y, sx:e.clientX, sy:e.clientY,
    };
    if (!action) onSelect(comp.id);
  };
  const onCompContext = (e, comp)=>{
    e.preventDefault(); e.stopPropagation();
    if (wiringRef.current) { cancelWiring(); return; }
    circuit.removeComponent(comp.id);
    onCommit?.('delete component');
    if (selection === comp.id) onSelect(null);
  };
  const ROTATE_ORDER = ['right','down','left','up'];
  const rotateComp = (e, comp)=>{
    e.stopPropagation();
    circuit.setFacing(comp.id, ROTATE_ORDER[(ROTATE_ORDER.indexOf(comp.facing||'right')+1)%4]);
    onCommit?.('rotate');
  };
  const flipComp = (e, comp)=>{
    e.stopPropagation();
    circuit.toggleFlip(comp.id);
    onCommit?.('flip');
  };

  /* ── pins ──────────────────────────────────────────────────────────── */
  const onPinMouseDown = (e, comp, kind, idx)=>{
    e.stopPropagation();
    if (e.button === 2) { if (wiringRef.current) cancelWiring(); return; }
    const term = termOf(comp, kind, idx);
    const wf = wiringRef.current;
    if (wf) {
      const sameOrigin = circuit.isPin(wf.from) && wf.from.compId === term.compId && wf.from.pin === term.pin
                         && wf.from.type === term.type;
      if (sameOrigin) return;
      if (finishWire(term)) return;
      // Rejected: rather than leaving the user stuck, start over from the
      // pin they just clicked.
      const fresh = { from:term, bends:[], startS:{x:e.clientX,y:e.clientY} };
      wiringRef.current = fresh; setWiring(fresh);
      return;
    }
    const fresh = { from:term, bends:[], startS:{x:e.clientX,y:e.clientY} };
    wiringRef.current = fresh; setWiring(fresh);
  };
  const onPinMouseUp = (e, comp, kind, idx)=>{
    const wf = wiringRef.current;
    if (!wf) return;
    const term = termOf(comp, kind, idx);
    const sameOrigin = circuit.isPin(wf.from) && wf.from.compId === term.compId && wf.from.pin === term.pin
                       && wf.from.type === term.type;
    if (sameOrigin) return;             // press-and-release on the origin: stay armed
    e.stopPropagation();
    finishWire(term);
  };

  /* ── wires ─────────────────────────────────────────────────────────── */
  const onWireMouseDown = (e, wire, path)=>{
    if (e.button === 2) return;
    e.stopPropagation();
    const w = screenToWorld(e.clientX, e.clientY);
    const pt = snapOntoPoly(path, w.x, w.y).point;
    const wf = wiringRef.current;
    if (wf) {
      // Drawing from an input: the wire is a legitimate place to finish —
      // the input joins that wire's net. Drawing from an output (or off
      // another wire) it can't be, since that would give the wire two
      // drivers; a click there just drops a corner, like empty board would,
      // rather than refusing — wires are often simply in the way.
      if (drawingFromInput(wf)) finishWire({ wireId:wire.id, x:pt.x, y:pt.y });
      else addBend(w);
      return;
    }
    tapPendRef.current = { wireId:wire.id, x:pt.x, y:pt.y, sx:e.clientX, sy:e.clientY,
                           wasSelected: selection === wire.id };
  };
  // Press on an input pin, drag, let go over a wire: same as clicking it.
  const onWireMouseUp = (e, wire, path)=>{
    const wf = wiringRef.current;
    if (!drawingFromInput(wf) || !wf.startS) return;
    if (Math.hypot(e.clientX-wf.startS.x, e.clientY-wf.startS.y) <= DRAG_SLOP) return;
    e.stopPropagation();
    const w = screenToWorld(e.clientX, e.clientY);
    const pt = snapOntoPoly(path, w.x, w.y).point;
    finishWire({ wireId:wire.id, x:pt.x, y:pt.y });
  };
  const onWireContext = (e, wireId)=>{
    e.preventDefault(); e.stopPropagation();
    if (wiringRef.current) { cancelWiring(); return; }
    circuit.removeWire(wireId);
    onCommit?.('delete wire');
    if (selection === wireId) onSelect(null);
  };
  const onBendMouseDown = (e, wire, idx, pt)=>{
    e.stopPropagation();
    if (e.button === 2) return;
    const w = screenToWorld(e.clientX, e.clientY);
    bendDragRef.current = { wireId:wire.id, idx, ox:pt.x-w.x, oy:pt.y-w.y, moved:false };
    onSelect(wire.id);
  };
  const onBendContext = (e, wire, idx)=>{
    e.preventDefault(); e.stopPropagation();
    wire.points.splice(idx,1);
    onCommit?.('remove corner');
  };

  /* ── derived render data ───────────────────────────────────────────── */
  const now = state.widgetState.now;
  const hopMs = state.widgetState.hopMs;
  // Rebuilt every frame on purpose: components move, wires re-route
  // themselves, and this is cheap next to the SVG repaint it feeds.
  const { paths, geom, nets } = buildNetGeometry(circuit);

  const components = [...circuit.components.values()];
  const wires = [...circuit.wires.values()];
  const tx = view.x*view.zoom, ty = view.y*view.zoom;

  // Where the in-progress wire's loose end sits: snapped to the grid, or
  // locked onto a compatible pin when one is under the cursor.
  let wiringTail = cursor, wiringTailValid = null;
  if (wiring) {
    const h = hover.pin;
    if (h) {
      const comp = circuit.components.get(h.compId);
      if (comp) {
        const term = termOf(comp, h.kind, h.idx);
        const problem = problemWith(wiring.from, term);
        const p = pinAbs(comp, h.kind, h.idx);
        wiringTail = p;
        wiringTailValid = !problem;
      }
    } else if (hover.wire && drawingFromInput(wiring) && paths.get(hover.wire)) {
      // Show exactly where the input would join the wire under the cursor.
      const pt = snapOntoPoly(paths.get(hover.wire), cursor.x, cursor.y).point;
      wiringTail = pt;
      wiringTailValid = !problemWith(wiring.from, { wireId:hover.wire, x:pt.x, y:pt.y });
    } else wiringTail = { x:snap(cursor.x), y:snap(cursor.y) };
  }

  const wiringPreview = (()=>{
    if (!wiring) return null;
    const a = circuit.terminalCoords(wiring.from);
    const dir = circuit.terminalDirToward(wiring.from, wiringTail);
    const mids = wiring.bends.length
      ? wiring.bends
      : [{ x:snap(a.x+dir.x*GRID), y:snap(a.y+dir.y*GRID) }];
    return resolveWire(a.x, a.y, wiringTail.x, wiringTail.y, mids);
  })();

  return <>
    <svg ref={svgRef} className="canvas"
         style={{ width:'100%', height:'100%',
                  cursor: isPanning ? 'grabbing' : wiring ? 'crosshair' : 'default' }}
         onMouseDown={onBgMouseDown}
         onContextMenu={e=>e.preventDefault()}>
      <defs>
        <pattern id="grid-minor" width={GRID} height={GRID} patternUnits="userSpaceOnUse">
          <path d={`M ${GRID} 0 L 0 0 0 ${GRID}`} fill="none" stroke="var(--grid)" strokeWidth="1"/>
        </pattern>
        <pattern id="grid-major" width={GRID*5} height={GRID*5} patternUnits="userSpaceOnUse">
          <rect width={GRID*5} height={GRID*5} fill="url(#grid-minor)"/>
          <path d={`M ${GRID*5} 0 L 0 0 0 ${GRID*5}`} fill="none" stroke="var(--grid-major)" strokeWidth="1.2"/>
        </pattern>
        <filter id="pulse-glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <rect className="canvas-bg" data-x="1" x="-6000" y="-6000" width="12000" height="12000"
            fill="url(#grid-major)"
            transform={`translate(${tx},${ty}) scale(${view.zoom})`}/>

      <g transform={`translate(${tx},${ty}) scale(${view.zoom})`}>
        {/* ── wires ── */}
        {wires.map(w=>{
          const path = paths.get(w.id) || [];
          if (path.length < 2) return null;
          const d = pathD(path);
          const g = geom.get(w.id);
          const sig = g ? circuit.signals.get(g.root) : null;
          const net = g ? nets.get(g.root) : null;
          const high = !!(sig && sig.value);
          const isSel = selection === w.id;
          const isHov = hover.wire === w.id;

          // Each transition still in flight paints the stretch of this wire
          // it has already crossed, in its own value's colour. Several can be
          // airborne at once when the source flips faster than one hop —
          // drawn oldest first so newer pulses overwrite from the source end,
          // which reads as a train of pulses rather than one smeared dot.
          const inFlight = [];
          if (sig && net && g && g.len > 0 && net.total > 0) {
            for (const ev of sig.queue) {
              const local = pulseAlong(g, (now - ev.time)/hopMs);
              if (local > 0) inFlight.push({ value:ev.value, t:Math.min(1,local) });
            }
          }
          const head = inFlight.length ? inFlight[inFlight.length-1] : null;
          const headPt = head && head.t < 1 ? samplePoly(path, head.t) : null;

          return <g key={w.id}>
            <path d={d} fill="none" stroke="var(--ink)" strokeWidth="5"
                  strokeLinejoin="round" strokeLinecap="round" opacity=".05"/>
            {/* A grey accent needs a touch more weight than a coloured one to
                register as "selected" behind a grey wire. */}
            {(isSel||isHov) && <path data-x="1" d={d} fill="none" stroke="var(--accent)" strokeWidth="8"
                  strokeLinejoin="round" strokeLinecap="round" opacity={isSel?.3:.15}/>}
            {/* HIGH is an ink line run over with the highlighter; LOW is a
                grey line. A transition in flight paints (or wipes) the
                highlighter along the stretch it has crossed. */}
            {high && <path d={d} fill="none" stroke="var(--wire-hl)"
                  strokeWidth="8" strokeLinejoin="round" strokeLinecap="round"/>}
            {inFlight.map((p,i)=>
              <path key={'u'+i} d={d} fill="none" pathLength="1"
                    stroke={p.value?'var(--wire-hl)':'var(--bg)'}
                    strokeWidth="8" strokeLinejoin="round" strokeLinecap="butt"
                    strokeDasharray={`${p.t} ${1-p.t}`}/>)}
            <path d={d} fill="none" stroke={high?'var(--wire-on)':'var(--low)'}
                  strokeWidth="2.4" strokeLinejoin="round" strokeLinecap="round"/>
            {inFlight.map((p,i)=>
              <path key={'f'+i} d={d} fill="none" pathLength="1"
                    stroke={p.value?'var(--wire-on)':'var(--low-p)'}
                    strokeWidth="2.4" strokeLinejoin="round" strokeLinecap="round"
                    strokeDasharray={`${p.t} ${1-p.t}`}/>)}
            {high && !inFlight.length && <ParticleStream path={path}/>}
            {headPt && <g pointerEvents="none" filter="url(#pulse-glow)">
              <circle cx={headPt[0]} cy={headPt[1]} r="7" fill={head.value?'var(--high)':'var(--low-p)'} opacity=".35"/>
              <circle cx={headPt[0]} cy={headPt[1]} r="3.4" fill={head.value?'var(--high-2)':'var(--low-p)'}/>
            </g>}
            {/* fat invisible hit target */}
            <path data-x="1" d={d} fill="none" stroke="transparent" strokeWidth="14"
                  style={{ cursor: wiring ? 'crosshair' : 'cell' }}
                  onMouseDown={e=>onWireMouseDown(e,w,path)}
                  onMouseUp={e=>onWireMouseUp(e,w,path)}
                  onMouseEnter={()=>setHover(h=>({...h, wire:w.id}))}
                  onMouseLeave={()=>setHover(h=>(h.wire===w.id?{...h, wire:null}:h))}
                  onContextMenu={e=>onWireContext(e,w.id)}/>
            {w.label && (()=>{
              const [lx,ly] = samplePoly(path, .5);
              const wd = 10 + w.label.length*6.4;
              return <g transform={`translate(${lx},${ly})`} pointerEvents="none">
                <rect x={-wd/2} y="-9" width={wd} height="18" rx="5"
                      fill="var(--bg)" stroke="var(--border-md)" strokeWidth="1"/>
                <text y="4" textAnchor="middle" fontFamily="var(--mono)" fontSize="10.5"
                      fontWeight="600" fill="var(--ink)">{w.label}</text>
              </g>;
            })()}
            {/* Multi-bit bus: the live value, in whatever base the toolbar
                is set to, floating just above the wire — stacked above a
                custom label when the wire has one of those too. */}
            {(()=>{
              const bits = circuit.wireBits(w);
              if (bits <= 1) return null;
              const [lx,ly] = samplePoly(path, .5);
              const val = sig ? (sig.value||0) : 0;
              const text = engine.formatBits(val, bits, state.widgetState.numFormat, state.widgetState.numSigned);
              const wd = 12 + text.length*6.6;
              const dy = w.label ? -27 : -13;
              return <g transform={`translate(${lx},${ly+dy})`} pointerEvents="none">
                <rect x={-wd/2} y="-9" width={wd} height="18" rx="5"
                      fill="var(--bg)" stroke="var(--border-md)" strokeWidth="1"/>
                <text y="4" textAnchor="middle" fontFamily="var(--mono)" fontSize="10.5"
                      fontWeight="700" fill={val ? 'var(--high-2)' : 'var(--ink-2)'}>{text}</text>
              </g>;
            })()}
            {isSel && (w.points||[]).map((pt,idx)=>(
              <circle data-x="1" key={'b'+idx} cx={pt.x} cy={pt.y} r="4.5"
                      fill="var(--bg)" stroke="var(--accent)" strokeWidth="1.8"
                      style={{cursor:'move'}}
                      onMouseDown={e=>onBendMouseDown(e,w,idx,pt)}
                      onContextMenu={e=>onBendContext(e,w,idx)}/>
            ))}
          </g>;
        })}

        {/* ── junction dots, drawn over the wires they join ── */}
        {wires.filter(w=>circuit.isTap(w.from)).map(w=>{
          const p = circuit.terminalCoords(w.from);
          const g = geom.get(w.id);
          const sig = g ? circuit.signals.get(g.root) : null;
          return <circle key={'j'+w.id} cx={p.x} cy={p.y} r="4"
                         fill={sig?.value ? 'var(--wire-on)' : 'var(--low-p)'}
                         stroke={sig?.value ? 'var(--wire-hl)' : 'var(--bg)'} strokeWidth="1.4" pointerEvents="none"/>;
        })}

        {/* ── components ── */}
        {components.map(comp=>{
          const vis = GATE_VIS[comp.kind];
          if (!vis) return null;
          const isSel = selection === comp.id;
          const rotT = orientT(comp, vis);
          return <g key={comp.id} transform={`translate(${comp.x},${comp.y})`}>
            <g onMouseDown={e=>onCompMouseDown(e,comp)}
               onContextMenu={e=>onCompContext(e,comp)}
               onMouseEnter={()=>setHover(h=>({...h, comp:comp.id}))}
               onMouseLeave={()=>setHover(h=>(h.comp===comp.id?{...h, comp:null}:h))}
               style={{ cursor: wiring ? 'crosshair' : 'move' }}>
              {isSel && <rect data-x="1" x="-7" y="-7" width={vis.w+14} height={vis.h+14} rx="11"
                              fill="var(--accent)" opacity=".06" transform={rotT}/>}
              {isSel && <rect data-x="1" x="-7" y="-7" width={vis.w+14} height={vis.h+14} rx="11"
                              fill="none" stroke="var(--accent)" strokeWidth="1.5"
                              strokeDasharray="5 4" opacity=".75" transform={rotT}/>}
              <GateBody comp={comp}/>
            </g>
            {/* In-place control (switch knob, clock run/halt pad) — its own
                hit region, sitting over the body */}
            {!wiring && (()=>{
              const hit = toggleHit(comp);
              if (!hit) return null;
              const s = hit.shape;
              const hot = hover.knob === comp.id;
              const handlers = {
                fill:'transparent', style:{cursor:'pointer'},
                onMouseDown:e=>onCompMouseDown(e, comp, hit.action),
                onMouseEnter:()=>setHover(h=>({...h, knob:comp.id})),
                onMouseLeave:()=>setHover(h=>(h.knob===comp.id?{...h, knob:null}:h)),
                onContextMenu:e=>onCompContext(e,comp),
              };
              const pad = 2.5;
              return <g data-x="1" transform={rotT}>
                {hot && (s.type === 'circle'
                  ? <circle cx={s.cx} cy={s.cy} r={s.r+pad} fill="var(--accent)" opacity=".14"/>
                  : <rect x={s.x-pad} y={s.y-pad} width={s.w+pad*2} height={s.h+pad*2}
                          rx={(s.rx||4)+pad} fill="var(--accent)" opacity=".14"/>)}
                {s.type === 'circle'
                  ? <circle cx={s.cx} cy={s.cy} r={s.r} {...handlers}><title>{hit.title}</title></circle>
                  : <rect x={s.x} y={s.y} width={s.w} height={s.h} rx={s.rx} {...handlers}>
                      <title>{hit.title}</title>
                    </rect>}
              </g>;
            })()}
            {isSel && !wiring && <>
              <g className="rotate-handle" data-x="1" transform={`translate(${vis.w+11},-11)`} style={{cursor:'pointer'}}
                 onMouseDown={e=>e.stopPropagation()} onClick={e=>rotateComp(e,comp)}>
                <title>Rotate 90° (R)</title>
                <circle r="9.5" strokeWidth="1.5"/>
                <path d="M4.4 1.5a4.6 4.6 0 1 1 -1.1 -4.8L5.7 -1" fill="none" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                <path d="M5.7 -4.1L5.7 -1L2.6 -1" fill="none" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
              </g>
              <g className="rotate-handle" data-x="1" transform={`translate(${vis.w+11},13)`} style={{cursor:'pointer'}}
                 onMouseDown={e=>e.stopPropagation()} onClick={e=>flipComp(e,comp)}>
                <title>Flip (F)</title>
                <circle r="9.5" strokeWidth="1.5"/>
                {/* Two arrowheads either side of a dashed mirror line */}
                <path d="M-4.6 0H4.6" fill="none" strokeWidth="1.2" strokeDasharray="1.6 1.6" strokeLinecap="round"/>
                <path d="M0 -2.6V-5.4M-2 -3.6L0 -5.6L2 -3.6M0 2.6V5.4M-2 3.6L0 5.6L2 3.6" fill="none" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
              </g>
              <g className="kill-handle" data-x="1" transform={`translate(${vis.w+11},${vis.h+11})`} style={{cursor:'pointer'}}
                 onMouseDown={e=>e.stopPropagation()}
                 onClick={e=>{ e.stopPropagation(); circuit.removeComponent(comp.id); onCommit?.('delete component'); onSelect(null); }}>
                <title>Delete (Del)</title>
                <circle r="9.5" strokeWidth="1.5"/>
                <path d="M -3.2 -3.2 L 3.2 3.2 M 3.2 -3.2 L -3.2 3.2" fill="none" strokeWidth="1.7" strokeLinecap="round"/>
              </g>
            </>}
            <Pins comp={comp} vis={vis} circuit={circuit} wiring={wiring} hover={hover}
                  problemWith={problemWith} termOf={termOf} pinKey={pinKey}
                  setHover={setHover} onDown={onPinMouseDown} onUp={onPinMouseUp}/>
          </g>;
        })}

        {/* ── in-progress wire ── */}
        {wiringPreview && <g data-x="1" pointerEvents="none">
          <path d={pathD(wiringPreview)} fill="none"
                stroke={wiringTailValid === false ? 'var(--danger)' : 'var(--accent)'}
                strokeWidth="2.4" strokeDasharray="7 5" opacity=".85"
                strokeLinejoin="round" strokeLinecap="round"/>
          {wiring.bends.map((p,i)=>
            <circle key={i} cx={p.x} cy={p.y} r="3.4" fill="var(--accent)" opacity=".85"/>)}
          <circle cx={wiringTail.x} cy={wiringTail.y} r={wiringTailValid ? 6.5 : 4}
                  fill="none" stroke={wiringTailValid === false ? 'var(--danger)' : 'var(--accent)'}
                  strokeWidth="2" opacity=".9"/>
        </g>}

        {/* ── palette drag ghost ── */}
        {paletteDrag && (()=>{
          const vis = GATE_VIS[paletteDrag.kind], def = GATE_DEFS[paletteDrag.kind];
          if (!vis || !def) return null;
          const gx = snap(cursor.x-vis.w/2), gy = snap(cursor.y-vis.h/2);
          return <g data-x="1" transform={`translate(${gx},${gy})`} opacity=".55" pointerEvents="none">
            <rect x="-6" y="-6" width={vis.w+12} height={vis.h+12} rx="10"
                  fill="var(--accent)" opacity=".06" stroke="var(--accent)" strokeWidth="1.2" strokeDasharray="4 4"/>
            <GateBody ghost comp={{ kind:paletteDrag.kind, facing:'right', delay:0,
              inputVals:new Array(def.inputs).fill(0), outputVals:new Array(def.outputs).fill(0), state:{value:0} }}/>
          </g>;
        })()}
      </g>
    </svg>

    {wiring && <div className="wiring-badge">
      <span>{circuit.isTap(wiring.from) ? 'Branching from wire' : 'Drawing wire'}</span>
      <kbd>{drawingFromInput(wiring) ? 'click pin or wire' : 'click pin'}</kbd><span style={{opacity:.5}}>connect</span>
      <kbd>Esc</kbd><span style={{opacity:.5}}>cancel</span>
    </div>}

    {flash && <div className="wiring-badge warn" style={wiring ? undefined : { top:10 }}>
      <span>Can’t connect — {flash.reason}</span>
    </div>}
  </>;
}

/* ── pins ───────────────────────────────────────────────────────────────
   Pins are quiet until they matter: small dots normally, but the moment a
   wire is in progress every compatible pin grows a halo and incompatible
   ones fade back, so the legal targets are obvious without reading anything. */
function Pins({ comp, vis, circuit, wiring, hover, problemWith, termOf, pinKey, setHover, onDown, onUp }) {
  const render = (kind, list, values)=> list.map((_,i)=>{
    const abs = pinAbs(comp, kind, i);
    const px = abs.x-comp.x, py = abs.y-comp.y;
    const key = pinKey(comp.id, kind, i);
    const hovered = hover.pin && hover.pin.compId===comp.id && hover.pin.kind===kind && hover.pin.idx===i;
    const on = !!values[i];
    let mode = 'idle';
    if (wiring) {
      const isOrigin = circuit.isPin(wiring.from) && wiring.from.compId===comp.id
        && wiring.from.pin===i && wiring.from.type===(kind==='in'?'in':'out');
      mode = isOrigin ? 'origin' : (problemWith(wiring.from, termOf(comp,kind,i)) ? 'bad' : 'good');
    }
    const r = mode==='good' || hovered ? 6.5 : 5;
    return <g key={kind+i} opacity={mode==='bad' ? .32 : 1}>
      {(mode==='good' || mode==='origin') &&
        <circle data-x="1" cx={px} cy={py} r="11" fill="var(--accent)" opacity={mode==='origin'?.26:.17}/>}
      {mode==='good' && <circle data-x="1" cx={px} cy={py} r="9" fill="none" stroke="var(--accent)" strokeWidth="1.4" opacity=".7"/>}
      <circle cx={px} cy={py} r={r}
              fill={on ? 'var(--high)' : 'var(--bg)'}
              stroke={hovered||mode==='good' ? 'var(--accent)' : on ? 'var(--high-2)' : 'var(--border-hi)'}
              strokeWidth={hovered||mode==='good' ? 2 : 1.5}/>
      <circle data-x="1" cx={px} cy={py} r="13" fill="transparent" style={{cursor:'crosshair'}}
              onMouseEnter={()=>setHover(h=>({ ...h, pin:{ compId:comp.id, kind, idx:i, key } }))}
              onMouseLeave={()=>setHover(h=>(h.pin?.key===key ? { ...h, pin:null } : h))}
              onMouseDown={e=>onDown(e, comp, kind, i)}
              onMouseUp={e=>onUp(e, comp, kind, i)}/>
    </g>;
  });
  return <g>
    {render('in',  vis.inputs,  comp.inputVals)}
    {render('out', vis.outputs, comp.outputVals)}
  </g>;
}

/* ── selection card ─────────────────────────────────────────────────────
   The only properties UI: a small card anchored under whatever is selected.
   It carries just the settings that can't be expressed on the canvas itself
   (labels, clock rate, exact orientation) — moving, rotating and deleting
   stay direct manipulation. */
const CloseIcon = ()=><svg width="9" height="9" viewBox="0 0 9 9">
  <path d="M1.5 1.5l6 6M7.5 1.5l-6 6" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>;

// Which selections have anything worth a card? Wires and I/O get a name
// field; a clock gets its rate. Plain gates get nothing — moving, rotating
// and deleting them all happen on the canvas already, so a card would just
// restate what the handles do.
function cardKindFor(circuit, selection) {
  if (circuit.wires.has(selection)) return 'wire';
  const comp = circuit.components.get(selection);
  if (!comp) return null;
  if (comp.kind === 'INPUT' || comp.kind === 'OUTPUT') return 'io';
  if (comp.kind === 'CLOCK') return 'clock';
  if (engine.BIT_CAPABLE[engine.kindBase(comp.kind)]) return 'gate';
  if (engine.busBaseOf(comp.kind)) return 'bus';
  return null;
}
const BIT_CHOICES = [1,2,3,4,6,8,12,16];

// The settings panel for whatever's selected, meant to sit inline in the
// toolbar rather than float over the board. Same fields as before — a
// name, a bit width, a clock rate — just laid out as one more toolbar
// group instead of a card anchored to the selection's position.
function SelectionPanel({ circuit, selection, onChange, onCommit, onSelect }) {
  const kind = cardKindFor(circuit, selection);
  if (!kind) return null;
  const comp = circuit.components.get(selection);
  const wire = comp ? null : circuit.wires.get(selection);
  if (!comp && !wire) return null;

  // A wire, or an IN / OUT: a name, and — for IN/OUT — the bit width.
  if (kind === 'wire' || kind === 'io') {
    const value = wire ? (wire.label || '') : comp.label;
    const commitLabel = (v)=>{
      if (wire) circuit.setWireLabel(wire.id, v); else circuit.setLabel(comp.id, v);
      onChange?.();
    };
    const isInput = comp && comp.kind === 'INPUT';
    const bits = comp ? (comp.bits || 1) : 1;
    const locked = comp ? circuit.hasConnections(comp.id) : false;
    const fmt = state.widgetState.numFormat;
    const signed = state.widgetState.numSigned;
    return <div className="tb-selpanel">
      <span className="sel-key">{wire ? 'Wire' : comp.kind === 'INPUT' ? 'Input' : 'Output'}</span>
      <input className="prop-input" style={{width:comp?76:118}} value={value} autoFocus={!comp}
             placeholder={wire ? 'CLK, RESET…' : 'name'}
             onChange={e=>commitLabel(e.target.value)}
             onBlur={()=>onCommit?.('label')}
             onKeyDown={e=>{ if (e.key === 'Enter') e.currentTarget.blur(); }}/>
      {comp && <>
        <span className="sel-key">Bits</span>
        <select className="prop-input" style={{width:50,padding:'0 4px'}} value={bits} disabled={locked}
                title={locked ? 'Disconnect its wire first to change bit width' : 'Bit width of this pin'}
                onChange={e=>{ circuit.setBits(comp.id, Number(e.target.value)); onChange?.(); onCommit?.('bit width'); }}>
          {BIT_CHOICES.map(n=><option key={n} value={n}>{n}</option>)}
        </select>
      </>}
      {isInput && bits > 1 && <input className="prop-input" style={{width:72,fontFamily:'var(--mono)'}}
             value={engine.formatBits(comp.state.value||0, bits, fmt, signed)}
             title={`Value in ${fmt === 'hex' ? 'hex' : fmt === 'dec' ? (signed ? 'signed decimal' : 'unsigned decimal') : 'binary'}`}
             onChange={e=>{
               const n = engine.parseBits(e.target.value, bits, fmt, signed);
               if (n !== null) { circuit.setInputValue(comp.id, n); onChange?.(); }
             }}
             onBlur={()=>onCommit?.('input value')}
             onKeyDown={e=>{ if (e.key === 'Enter') e.currentTarget.blur(); }}/>}
      <button className="sel-close" title="Deselect (Esc)" onClick={()=>onSelect(null)}><CloseIcon/></button>
    </div>;
  }

  // A gate that can be widened past its default arity and/or past 1 bit.
  // AND/OR/NAND/NOR/XOR/XNOR/MUX get an Inputs control; anything
  // BIT_CAPABLE (those plus NOT and the registers) gets a Bits control.
  // Locking one locks both — either change could strand an existing wire.
  if (kind === 'gate') {
    const base = engine.kindBase(comp.kind);
    const arity = engine.GATE_INPUT_CHOICES[base];
    const curInputs = base === 'MUX' ? engine.muxDataCount(comp.kind) : (GATE_DEFS[comp.kind]?.inputs || 2);
    const bits = comp.bits || 1;
    const locked = circuit.hasConnections(comp.id);
    return <div className="tb-selpanel">
      <span className="sel-key">{base}</span>
      {arity && <>
        <span className="sel-key">Inputs</span>
        <select className="prop-input" style={{width:48,padding:'0 4px'}} value={curInputs} disabled={locked}
                title={locked ? 'Disconnect its wires first to change input count' : 'How many inputs this gate has'}
                onChange={e=>{ circuit.setInputCount(comp.id, Number(e.target.value)); onChange?.(); onCommit?.('input count'); }}>
          {arity.map(n=><option key={n} value={n}>{n}</option>)}
        </select>
      </>}
      <span className="sel-key">Bits</span>
      <select className="prop-input" style={{width:56,padding:'0 4px'}} value={bits} disabled={locked}
              title={locked ? 'Disconnect its wires first to change bit width' : 'Every pin on this gate shares this width'}
              onChange={e=>{ circuit.setBits(comp.id, Number(e.target.value)); onChange?.(); onCommit?.('bit width'); }}>
        {BIT_CHOICES.map(n=><option key={n} value={n}>{n}</option>)}
      </select>
      <button className="sel-close" title="Deselect (Esc)" onClick={()=>onSelect(null)}><CloseIcon/></button>
    </div>;
  }

  // COMBINE / SPLIT: a name, and how many 1-bit lines it packs or unpacks.
  if (kind === 'bus') {
    const base = engine.busBaseOf(comp.kind);
    const bits = comp.bits || 1;
    const locked = circuit.hasConnections(comp.id);
    return <div className="tb-selpanel">
      <span className="sel-key">{base === 'COMBINE' ? 'Combine' : 'Split'}</span>
      <input className="prop-input" style={{width:74}} value={comp.label}
             placeholder="name"
             onChange={e=>{ circuit.setLabel(comp.id, e.target.value); onChange?.(); }}
             onBlur={()=>onCommit?.('label')}
             onKeyDown={e=>{ if (e.key === 'Enter') e.currentTarget.blur(); }}/>
      <span className="sel-key">Bits</span>
      <select className="prop-input" style={{width:56,padding:'0 4px'}} value={bits} disabled={locked}
              title={locked ? 'Disconnect its wires first to resize'
                     : base === 'COMBINE' ? 'How many 1-bit inputs to pack into the output'
                     : 'How many 1-bit outputs to unpack the input into'}
              onChange={e=>{ circuit.setBits(comp.id, Number(e.target.value)); onChange?.(); onCommit?.('bit width'); }}>
        {BIT_CHOICES.map(n=><option key={n} value={n}>{n}</option>)}
      </select>
      <button className="sel-close" title="Deselect (Esc)" onClick={()=>onSelect(null)}><CloseIcon/></button>
    </div>;
  }

  // A clock: just its rate. Running and halting is the pad on the component
  // itself, so the panel doesn't restate it.
  const clkIdx = nearestClockPeriodIndex(comp.state.period);
  return <div className="tb-selpanel">
    <span className="sel-key">Clock</span>
    <span className="sel-key">Rate</span>
    <input type="range" min="0" max={CLOCK_PERIODS.length-1} step="1" value={clkIdx}
           style={{width:100,accentColor:'var(--accent)'}}
           onChange={e=>{ circuit.setClockPeriod(comp.id, CLOCK_PERIODS[Number(e.target.value)]); onChange?.(); }}
           onMouseUp={()=>onCommit?.('clock period')}/>
    <span className="st-mono" style={{width:30,textAlign:'right'}}>{CLOCK_PERIOD_LABELS[clkIdx]}</span>
    <button className="sel-close" title="Deselect (Esc)" onClick={()=>onSelect(null)}><CloseIcon/></button>
  </div>;
}

/* ── idle flow dots on a settled HIGH wire ───────────────────────────── */
function ParticleStream({ path }) {
  const N = state.widgetState.particleDensity ?? 3;
  if (!N) return null;
  const t = (state.widgetState.now * 0.00035) % 1;
  return <g pointerEvents="none">{Array.from({length:N},(_,i)=>{
    const [x,y] = samplePoly(path, (t + i/N) % 1);
    return <circle key={i} cx={x} cy={y} r="1.9" fill="var(--wire-hl)"/>;
  })}</g>;
}

return { Canvas, CLOCK_PERIODS, CLOCK_PERIOD_LABELS, nearestClockPeriodIndex, SelectionPanel, cardKindFor };
});
</script>

<script type="text/babel">
/* ═══ PALETTE ══════════════════════════════════════════════════════════════ */
defineModule('palette', ['engine', 'gates'], (engine, gates) => {
'use strict';
const { useState } = React;
const { GATE_DEFS } = engine;
const { GATE_VIS, GateBody } = gates;

const GROUPS = [
  { title:'Sources',    kinds:['INPUT','CLOCK'] },
  { title:'Sinks',      kinds:['OUTPUT','SEVEN'] },
  { title:'Logic',      kinds:['AND','OR','NOT','NAND','NOR','XOR','XNOR','MUX'] },
  { title:'Bus',        kinds:['COMBINE:4','SPLIT:4'] },
  { title:'Flip-flops', kinds:['DFF','TFF','JKFF','SRFF'] },
  { title:'Registers',  kinds:['REG','SHIFT','LOAD'] },
  { title:'Custom',     kinds:[], custom:true },
];
// Extra search terms so "invert" finds NOT, "select" finds MUX, and so on.
const ALIASES = {
  INPUT:'source switch toggle bit', CLOCK:'oscillator square pulse timer',
  OUTPUT:'lamp led probe sink', SEVEN:'seven segment display digit',
  NOT:'invert inverter complement', MUX:'multiplexer select 2to1',
  DFF:'data flip flop register latch', TFF:'toggle flip flop',
  JKFF:'jk flip flop', SRFF:'set reset latch',
  'COMBINE:4':'combine merge pack bus bundle join wires',
  'SPLIT:4':'split unpack bus bundle unbundle break out wires',
  REG:'register d-register n-bit storage bus latch',
  SHIFT:'shift register serial in out siso sipo',
  LOAD:'load register enable parallel load latch',
};

function Thumb({ kind }) {
  const vis = GATE_VIS[kind], def = GATE_DEFS[kind];
  if (!vis || !def) return null;
  const tw=60, th=42, sc=Math.min(tw/(vis.w+26), th/(vis.h+10));
  const tx=(tw-(vis.w+14)*sc)/2, ty=(th-vis.h*sc)/2;
  return <svg width={tw} height={th}><g transform={`translate(${tx},${ty}) scale(${sc})`}>
    <GateBody comp={{ kind, facing:'right', delay:0, label:'',

}

const Chev = ()=><svg className="chev" width="9" height="9" viewBox="0 0 9 9">
  <path d="M1.5 3L4.5 6L7.5 3" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>;

const SideChev = ({ dir })=><svg width="10" height="10" viewBox="0 0 10 10">
  <path d={dir==='left' ? 'M6.5 1.5L3 5l3.5 3.5' : 'M3.5 1.5L7 5 3.5 8.5'} fill="none" stroke="currentColor"

function Palette({ open=true, onToggle, onDragStart, onPlace, onImportClick, onDeleteCustom, customKinds=[] }) {
  const [query, setQuery] = useState('');
  const [closed, setClosed] = useState({});
  const q = query.trim().toLowerCase();
  const matches = (kind)=>{
    if (!q) return true;

    const hay = (kind+' '+(def?.label||'')+' '+(ALIASES[kind]||'')).toLowerCase();

  // Closed: the whole rail is the "open" button, so it's an easy target.
  if (!open) return <div className="palette is-closed" onClick={onToggle} title="Show parts (P)">
    <button className="pal-toggle" onClick={e=>{ e.stopPropagation(); onToggle?.(); }} title="Show parts (P)">
      <SideChev dir="right"/>

  return <div className="palette">
    <div className="pal-search">
      <svg width="11" height="11" viewBox="0 0 12 12">
        <circle cx="5" cy="5" r="3.6" fill="none" stroke="currentColor" strokeWidth="1.5"/>
        <line x1="7.8" y1="7.8" x2="11" y2="11" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
      </svg>
      <input value={query} placeholder="Search parts…" onChange={e=>setQuery(e.target.value)}
             onKeyDown={e=>{ if (e.key==='Escape') setQuery(''); }}/>
      {onToggle && <button className="pal-toggle" onClick={onToggle} title="Hide parts (P)">
        <SideChev dir="left"/>
      </button>}
    </div>
    <div className="pal-scroll">
      {GROUPS.map(g=>{
        const all = g.custom ? customKinds : g.kinds;
        const kinds = all.filter(matches);
        const isClosed = !!closed[g.title] && !q;
