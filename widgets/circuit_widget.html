        return <div className="pal-group" key={g.title}>
          <button className={'pal-group-head'+(isClosed?' closed':'')}
                  onClick={()=>setClosed(c=>({ ...c, [g.title]: !c[g.title] }))}>
            <Chev/>{g.title}<span className="pal-group-count">{kinds.length}</span>
          </button>
          {!isClosed && <div className="pal-grid">
            {kinds.map(k=>(
              <div key={k} className="pal-item" title={(GATE_DEFS[k]?.label||k)+' — drag onto the canvas, or click to drop it in'}
                   onMouseDown={e=>{ if (e.button!==0) return; e.preventDefault(); onDragStart(k); }}
                   onClick={()=>onPlace?.(k)}>
                {g.custom && <button className="pal-del-btn" title="Remove from palette"
                        onMouseDown={e=>e.stopPropagation()}
                        onClick={e=>{ e.stopPropagation(); onDeleteCustom(k); }}>
                  <svg width="7" height="7" viewBox="0 0 8 8">
                    <line x1="1" y1="1" x2="7" y2="7" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
                    <line x1="7" y1="1" x2="1" y2="7" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
                  </svg>
                </button>}
                <Thumb kind={k}/>
                <div className="pal-label">{GATE_DEFS[k]?.label || k}</div>
              </div>
            ))}
            {g.custom && !q && <button className="pal-item" onClick={onImportClick} title="Build a new part">
              <svg width="60" height="42">
                <rect x="12" y="6" width="36" height="30" rx="7" fill="none" stroke="var(--border-hi)" strokeWidth="1.6" strokeDasharray="4 3"/>
                <path d="M 27 14 H 33 V 18 H 37 V 24 H 33 V 28 H 27 V 24 H 23 V 18 H 27 Z" fill="var(--border-hi)"/>
              </svg>
              <div className="pal-label">New part</div>
            </button>}
          </div>}
          {g.custom && !isClosed && !customKinds.length && !q &&
            <div className="pal-empty">Bundle a circuit into a reusable part.</div>}
        </div>;
      })}
    </div>
  </div>;
}

return { Palette };
});
</script>

<script type="text/babel">
/* ═══ TIMING DIAGRAM ═══════════════════════════════════════════════════════
   Waveforms for the board's INs, CLKs and OUTs against simulation time.

   The recorder runs every frame whether or not the panel is open, so
   opening it mid-lecture shows what already happened rather than starting
   blank. It stores transitions only, never per-frame samples, and stamps
   each one with the engine's exact scheduled instant where it has one —
   so an OUT three hops behind its IN lands exactly 3 × hopMs to the right
   on the diagram, not three frames' worth of jitter later. */
defineModule('timing', ['state', 'engine'], (state, engine) => {
'use strict';
const { useEffect, useRef } = React;
const { formatBits } = engine;

const TRACE_KINDS = { INPUT:'in', CLOCK:'in', OUTPUT:'out' };
const KIND_TAG    = { INPUT:'IN', CLOCK:'CLK', OUTPUT:'OUT' };
const KEEP_MS     = 180000;  // a little past the widest window
const MAX_PTS     = 12000;   // per trace — a 1/16s clock for 180s is ~5800 edges
// Wide enough to hold a few 8s hops.
const WINDOW_CHOICES = [
  { ms:10000, label:'10s' },
  { ms:20000, label:'20s' },
  { ms:40000, label:'40s' },
  { ms:80000, label:'80s' },
];

// Lane geometry, in CSS px.
const LABEL_W = 74, LANE_H = 32, PAD_T = 6, AXIS_H = 20, PAD_R = 14;

function traceable(circuit) {
  const ins = [], outs = [];
  for (const c of circuit.components.values()) {
    const side = TRACE_KINDS[c.kind];
    if (side === 'in') ins.push(c); else if (side === 'out') outs.push(c);
  }
  // Clocks first (they're the reference everything else is read against),
  // then by label so A, B, C come out in the order students expect.
  const order = (a, b) => (a.kind === 'CLOCK' ? 0 : 1) - (b.kind === 'CLOCK' ? 0 : 1)
    || String(a.label || '').localeCompare(String(b.label || ''), undefined, { numeric:true })
    || a.id.localeCompare(b.id);
  ins.sort(order); outs.sort(order);
  return { ins, outs };
}
const nameOf = (c) => (c.label && String(c.label).trim()) || KIND_TAG[c.kind] || c.kind;

// What the part shows, plus the engine's exact time it became that value.
function readNow(circuit, c) {
  if (c.kind === 'OUTPUT') {
    const w = circuit.wireIntoInput(c.id, 0);
    const sig = w && circuit.signalOfWire(w);
    return { v: c.inputVals[0] || 0, t: sig ? sig.lastChange : null };
  }
  return { v: c.outputVals[0] || 0, t: c.outputChangeTime ? c.outputChangeTime[0] : null };
}

function createRecorder() {
  const traces = new Map();   // compId → [{ t, v }]  (transitions, oldest first)
  let lastNow = -1;

  function sample(circuit, now) {
    // Time only runs backwards on a reset — the old history is meaningless.
    if (now < lastNow) traces.clear();
    lastNow = now;
    for (const c of circuit.components.values()) {
      if (!TRACE_KINDS[c.kind]) continue;
      const { v, t } = readNow(circuit, c);
      const pts = traces.get(c.id);
      if (!pts) { traces.set(c.id, [{ t: now, v }]); continue; }
      const last = pts[pts.length - 1];
      if (last.v === v) continue;
      const at = (typeof t === 'number' && t <= now && t >= last.t) ? t : now;
      pts.push({ t: at, v });
      if (pts.length > MAX_PTS) pts.splice(0, pts.length - MAX_PTS);
    }
    const cut = now - KEEP_MS;
    for (const [id, pts] of traces) {
      if (!circuit.components.has(id)) { traces.delete(id); continue; }
      // Keep the last point before the cut: it's the value the window opens on.
      let k = 0;
      while (k < pts.length - 1 && pts[k + 1].t <= cut) k++;
      if (k) pts.splice(0, k);
    }
  }
  function clear() { traces.clear(); lastNow = -1; }
  return { sample, clear, get: (id) => traces.get(id) };
}

// Round-number tick spacing that leaves at least ~60px between labels.
function tickStep(windowMs, plotW) {
  for (const s of [125, 250, 500, 1000, 2000, 5000, 10000, 20000, 40000]) {
    if (s / windowMs * plotW >= 60) return s;
  }
  return 40000;
}
const fmtSec = (ms) => (+(ms / 1000).toFixed(3)) + 's';

const XIcon = ()=><svg width="9" height="9" viewBox="0 0 9 9">
  <path d="M1.5 1.5l6 6M7.5 1.5l-6 6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>;

// Up / down chevron for the timing strip's open / close toggle.
const VChev = ({ dir })=><svg width="10" height="10" viewBox="0 0 10 10">
  <path d={dir==='up' ? 'M1.5 6.5L5 3l3.5 3.5' : 'M1.5 3.5L5 7l3.5-3.5'} fill="none" stroke="currentColor"
        strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>;

// Closed, the timing diagram shrinks to a strip along the bottom that still
// says what it is — the same as the parts panel's rail on the left. The
// whole strip opens it.
function TimingPanel(props) {
  if (!props.open) return <div className="timing is-closed" onClick={props.onToggle} title="Show the timing diagram (T)">
    <button className="pal-toggle" onClick={e=>{ e.stopPropagation(); props.onToggle?.(); }} title="Show the timing diagram (T)">
      <VChev dir="up"/>
    </button>
    <span className="tm-title">Timing</span>
  </div>;
  return <TimingOpen {...props}/>;
}

function TimingOpen({ circuit, recorder, hidden, windowMs, onToggleSignal, onShowAll, onHideAll, onWindow, onToggle }) {
  const bodyRef = useRef(null);
  const cvRef   = useRef(null);
  const hoverX  = useRef(null);
  const { ins, outs } = traceable(circuit);
  const all   = [...ins, ...outs];
  const shown = all.filter(c => !hidden[c.id]);

  // The canvas repaints from a rAF loop of its own; it reads the latest
  // props through this ref rather than restarting the loop on every render.
  const live = useRef(null);
  live.current = { shown, windowMs };

  useEffect(()=>{
    let raf;
    const paint = ()=>{
      raf = requestAnimationFrame(paint);
      const cv = cvRef.current, body = bodyRef.current;
      if (!cv || !body) return;
      const { shown, windowMs } = live.current;
      const W = body.clientWidth, H = PAD_T + shown.length * LANE_H + AXIS_H;
      const dpr = window.devicePixelRatio || 1;
      if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        cv.style.width = W + 'px'; cv.style.height = H + 'px';
      }
      const ctx = cv.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);

      // Tokens are read at draw time so the canvas follows the deck's theme.
      const css  = getComputedStyle(cv);   // the strip's own tokens (see .timing)
      const tok  = (n, fb) => css.getPropertyValue(n).trim() || fb;
      const ink  = tok('--text', '#1a1a18'), ink2 = tok('--text-2', '#5f5e5a'), ink3 = tok('--text-3', '#8a897f');
      const line = tok('--border', '#e4e3df'), grid = tok('--grid', '#e6e6e1');
      const high = tok('--high', '#f59e0b'), high2 = tok('--high-2', '#d97706');
      const bg   = tok('--bg', '#ffffff'), panel = tok('--bg-subtle', '#fafaf8');
      const mono = tok('--font-mono', 'ui-monospace, Menlo, Consolas, monospace');
      const fmt  = state.widgetState.numFormat, signed = state.widgetState.numSigned;

      const now = state.widgetState.now;
      const t0 = Math.max(0, now - windowMs);
      const X0 = LABEL_W, X1 = W - PAD_R, PW = Math.max(10, X1 - X0);
      const xOf = (t) => X0 + (t - t0) / windowMs * PW;
      const yB  = H - AXIS_H;

      // Label column
      ctx.fillStyle = panel; ctx.fillRect(0, 0, LABEL_W, H);
      ctx.fillStyle = line;  ctx.fillRect(LABEL_W - 1, 0, 1, H);

      // Time grid + axis
      const step = tickStep(windowMs, PW);
      ctx.font = `10px ${mono}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let t = Math.ceil(t0 / step) * step; t <= t0 + windowMs + 1e-6; t += step) {
        const x = Math.round(xOf(t)) + .5;
        ctx.fillStyle = grid; ctx.fillRect(x - .5, PAD_T, 1, yB - PAD_T);
        ctx.fillStyle = ink3; ctx.fillText(fmtSec(t), x, yB + AXIS_H / 2);
      }
      ctx.fillStyle = line; ctx.fillRect(LABEL_W, yB, W - LABEL_W, 1);

      // Lanes
      shown.forEach((c, i) => {
        const y = PAD_T + i * LANE_H, hi = y + 7, lo = y + LANE_H - 7, mid = (hi + lo) / 2;
        const bits = c.bits || 1;
        if (i) { ctx.fillStyle = line; ctx.globalAlpha = .6; ctx.fillRect(0, y, W, 1); ctx.globalAlpha = 1; }

        ctx.textBaseline = 'middle';
        ctx.font = `600 12px ${mono}`; ctx.textAlign = 'left'; ctx.fillStyle = ink;
        let name = nameOf(c);
        while (name.length > 1 && ctx.measureText(name).width > LABEL_W - 40) name = name.slice(0, -1);
        ctx.fillText(name, 10, mid);
        ctx.font = `9px ${mono}`; ctx.textAlign = 'right'; ctx.fillStyle = ink3;
        ctx.fillText(bits > 1 ? `${KIND_TAG[c.kind]}·${bits}` : KIND_TAG[c.kind], LABEL_W - 8, mid);

        const pts = recorder.get(c.id);
        if (!pts || !pts.length) return;
        ctx.save();
        ctx.beginPath(); ctx.rect(X0, y, PW + 2, LANE_H); ctx.clip();

        // First segment that's still on screen.
        let k = 0;
        while (k < pts.length - 1 && pts[k + 1].t <= t0) k++;

        if (bits <= 1) {
          const yv = (v) => v ? hi : lo;
          ctx.fillStyle = high; ctx.globalAlpha = .18;
          for (let j = k; j < pts.length; j++) {
            if (!pts[j].v) continue;
            const a = xOf(Math.max(t0, pts[j].t)), b = xOf(j + 1 < pts.length ? pts[j + 1].t : now);
            ctx.fillRect(a, hi, b - a, lo - hi);
          }
          ctx.globalAlpha = 1;
          ctx.beginPath();
          ctx.moveTo(xOf(Math.max(t0, pts[k].t)), yv(pts[k].v));
          for (let j = k + 1; j < pts.length; j++) {
            const x = xOf(pts[j].t);
            ctx.lineTo(x, yv(pts[j - 1].v));
            ctx.lineTo(x, yv(pts[j].v));
          }
          ctx.lineTo(xOf(now), yv(pts[pts.length - 1].v));
          ctx.strokeStyle = high2; ctx.lineWidth = 1.6; ctx.lineJoin = 'miter';
          ctx.stroke();
        } else {
          // Bus lane: the classic hexagon per value, with the value written in.
          ctx.font = `10.5px ${mono}`; ctx.textAlign = 'center';
          for (let j = k; j < pts.length; j++) {
            const isLast = j === pts.length - 1;
            const ta = pts[j].t, tb = isLast ? now : pts[j + 1].t;
            const xa = xOf(ta), xb = xOf(tb);
            const s  = Math.min(4, Math.max(0, (xb - xa) / 2));
            const sr = isLast ? 0 : s;
            // The segment still being written has a flat, open right end.
            ctx.beginPath();
            ctx.moveTo(xa, mid); ctx.lineTo(xa + s, hi); ctx.lineTo(xb - sr, hi);
            if (isLast) ctx.lineTo(xb, lo); else ctx.lineTo(xb, mid);
            ctx.lineTo(xb - sr, lo); ctx.lineTo(xa + s, lo); ctx.closePath();
            if (pts[j].v) { ctx.fillStyle = high; ctx.globalAlpha = .12; ctx.fill(); ctx.globalAlpha = 1; }
            if (isLast) {
              ctx.beginPath();
              ctx.moveTo(xb, hi); ctx.lineTo(xa + s, hi); ctx.lineTo(xa, mid); ctx.lineTo(xa + s, lo); ctx.lineTo(xb, lo);
            }
            ctx.strokeStyle = ink2; ctx.lineWidth = 1.2; ctx.stroke();
            const va = Math.max(xa, X0) + s, vb = Math.min(xb, X1) - sr;
            const txt = formatBits(pts[j].v, bits, fmt, signed);
            if (vb - va > ctx.measureText(txt).width + 6) {
              ctx.fillStyle = ink; ctx.fillText(txt, (va + vb) / 2, mid + .5);
            }
          }
        }
        ctx.restore();
      });

      // "Now" — where the traces are being written.
      const xn = Math.round(xOf(now)) + .5;
      ctx.strokeStyle = ink3; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(xn, PAD_T); ctx.lineTo(xn, yB); ctx.stroke();
      ctx.setLineDash([]);

      // Hover cursor: read every lane at one instant, which is how you
      // measure a delay off the diagram.
      const hx = hoverX.current;
      if (hx != null && hx >= X0 && hx <= X1) {
        const t = t0 + (hx - X0) / PW * windowMs;
        if (t <= now) {
          const x = Math.round(hx) + .5;
          ctx.strokeStyle = ink2; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(x, PAD_T); ctx.lineTo(x, yB); ctx.stroke();
          ctx.font = `600 10px ${mono}`; ctx.textBaseline = 'middle';
          const flip = x > X1 - 70;
          shown.forEach((c, i) => {
            const pts = recorder.get(c.id);
            if (!pts || !pts.length || t < pts[0].t) return;
            let j = pts.length - 1;
            while (j > 0 && pts[j].t > t) j--;
            const txt = (c.bits || 1) > 1 ? formatBits(pts[j].v, c.bits, fmt, signed) : String(pts[j].v ? 1 : 0);
            const w = ctx.measureText(txt).width + 8, y = PAD_T + i * LANE_H + LANE_H / 2;
            const bx = flip ? x - 5 - w : x + 5;
            ctx.fillStyle = bg; ctx.strokeStyle = line;
            ctx.fillRect(bx, y - 8, w, 16); ctx.strokeRect(bx + .5, y - 7.5, w - 1, 15);
            ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.fillText(txt, bx + w / 2, y + .5);
          });
          const tl = fmtSec(Math.round(t / 6.25) * 6.25);
          ctx.font = `600 10px ${mono}`;
          const tw = ctx.measureText(tl).width + 10;
          const tx = Math.min(Math.max(x - tw / 2, X0), X1 - tw);
          ctx.fillStyle = ink; ctx.fillRect(tx, yB + 2, tw, AXIS_H - 4);
          ctx.fillStyle = bg; ctx.textAlign = 'center'; ctx.fillText(tl, tx + tw / 2, yB + AXIS_H / 2);
        }
      }
    };
    raf = requestAnimationFrame(paint);
    return ()=>cancelAnimationFrame(raf);
  },[recorder]);

  const chip = (c)=>{
    const on = !hidden[c.id];
    return <button key={c.id} className={'tm-chip'+(on?' on':'')} onClick={()=>onToggleSignal(c.id)}
                   title={(on ? 'Hide ' : 'Show ') + nameOf(c) + ' on the timing diagram'}>
      <i/>{nameOf(c)}
    </button>;
  };

  return <div className="timing">
    <div className="tm-head">
      <span className="tm-title">Timing</span>
      {ins.length > 0 && <div className="tm-group"><span className="tm-group-key">In</span>{ins.map(chip)}</div>}
      {ins.length > 0 && outs.length > 0 && <div className="bw-sep"/>}
      {outs.length > 0 && <div className="tm-group"><span className="tm-group-key">Out</span>{outs.map(chip)}</div>}
      {all.length > 1 && <>
        <button className="tm-link" onClick={onShowAll}>all</button>
        <button className="tm-link" onClick={onHideAll}>none</button>
      </>}
      <div className="bw-spacer"/>
      <div className="seg" title="How much time the diagram spans">
        {WINDOW_CHOICES.map(w=>(
          <button key={w.ms} className={'seg-btn'+(windowMs===w.ms?' on':'')} onClick={()=>onWindow(w.ms)}>{w.label}</button>
        ))}
      </div>
      <button className="pal-toggle" onClick={onToggle} title="Hide the timing diagram (T)"><VChev dir="down"/></button>
    </div>
    <div className="tm-body" ref={bodyRef}>
      {!all.length
        ? <div className="tm-empty">Place an IN, CLK or OUT on the board to trace it here.</div>
        : !shown.length
          ? <div className="tm-empty">Pick a signal above to trace it.</div>
          : <canvas ref={cvRef}
                    onMouseMove={e=>{ hoverX.current = e.nativeEvent.offsetX; }}
                    onMouseLeave={()=>{ hoverX.current = null; }}/>}
    </div>
  </div>;
}

return { TimingPanel, createRecorder, WINDOW_CHOICES };
});
</script>

<script type="text/babel">
/* ═══ APP ══════════════════════════════════════════════════════════════════ */
defineModule('app', ['state','engine','gates','canvas','palette','timing'],
             (state, engine, gates, canvas, palette, timing) => {
'use strict';
const { useState, useEffect, useRef, useCallback } = React;
const { createCircuit } = engine;
const { Canvas, SelectionPanel } = canvas;
const { Palette } = palette;
const { TimingPanel, createRecorder } = timing;

// Slow on purpose: on a slide the point is to watch a signal travel, so
// the choices run from 1s a hop up to 8s.
const HOP_CHOICES = [
  { ms:1000, label:'1s' },
  { ms:2000, label:'2s' },
  { ms:4000, label:'4s' },
  { ms:8000, label:'8s' },
];

/* ── custom-gate registry ──────────────────────────────────────────────────
   registerCustomGate() only lives in memory, so a saved circuit referencing
   a custom kind used to crash on load in a later session. This registry
   makes imports durable. */
const LS_KEY = 'dss_customs_v1';
function loadCustomRegistry() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { return []; }
}
function upsertCustomRegistry(name, data) {
  const entries = loadCustomRegistry().filter(e=>e.name!==name);
  entries.push({ name, data });
  try { localStorage.setItem(LS_KEY, JSON.stringify(entries)); } catch {}
}
function removeFromCustomRegistry(name) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(loadCustomRegistry().filter(e=>e.name!==name))); } catch {}
}
function extractCustomDeps(data) {
  const names = new Set();
  for (const c of (data.components||[])) {
    if (typeof c.kind === 'string' && c.kind.startsWith('CUSTOM:')) names.add(c.kind.slice(7));
  }
  return names;
}
// Would defining custom gate `name` as `data` make its dependency chain loop
// back to itself? Checked against every other gate's current definition with
// `name`'s entry swapped for the proposal — that's the only one changing.
function findCustomCycle(name, data) {
  const map = new Map(loadCustomRegistry().map(e=>[e.name, e.data]));
  map.set(name, data);
  const onPath = new Set(), path = [];
  const dfs = (node)=>{
    if (onPath.has(node)) { path.push(node); return true; }
    onPath.add(node); path.push(node);
    for (const dep of extractCustomDeps(map.get(node) || {})) if (dfs(dep)) return true;
    onPath.delete(node); path.pop();
    return false;
  };
  return dfs(name) ? path : null;
}
// A custom gate's sub-circuit can itself contain another custom gate and the
// registry has no guaranteed order, so retry whatever fails (unregistered
// dependency) until a whole pass makes no more progress.
function hydrateCustomGates() {
  let pending = loadCustomRegistry();
  const kinds = [];
  let progressed = true;
  while (pending.length && progressed) {
    progressed = false;
    const still = [];
    for (const entry of pending) {
      try { kinds.push(gates.registerCustomGate(entry.name, entry.data)); progressed = true; }
      catch { still.push(entry); }
    }
    pending = still;
  }
  if (pending.length) console.warn('custom gate(s) missing a dependency:', pending.map(e=>e.name));
  return kinds;
}

/* ── completeness check ────────────────────────────────────────────────────
   A part is sealed up and handed out as a black box, so an unconnected input
   inside it is a silent bug: it reads as a constant 0 forever, with nothing
   on the outside to hint at why. Refuse to build one, and name the offenders
   rather than just saying no. */
function findDanglingInputs(circuit) {
  const loose = [];
  for (const comp of circuit.components.values()) {
    const def = engine.GATE_DEFS[comp.kind];
    if (!def) continue;
    for (let pin = 0; pin < def.inputs; pin++) {
      if (!circuit.wireIntoInput(comp.id, pin)) loose.push({ comp, pin, def });
    }
  }
  return loose;
}
function describeDanglingInputs(circuit) {
  const loose = findDanglingInputs(circuit);
  if (!loose.length) return null;
  const named = loose.slice(0, 5).map(({comp, def, pin}) => {
    const who = comp.label && comp.label !== def.label ? `${def.label} “${comp.label}”` : def.label;
    return def.inputs > 1 ? `${who} · input ${pin}` : who;
  });
  const more = loose.length - named.length;
  return `${loose.length} input${loose.length>1?'s':''} still unconnected:\n`
       + named.join('\n') + (more > 0 ? `\n…and ${more} more` : '')
       + '\n\nWire every input before turning this into a part.';
}

/* ── toolbar icons ─────────────────────────────────────────────────────── */
const I = {
  reset: <svg width="13" height="13" viewBox="0 0 14 14"><path d="M11.5 7a4.5 4.5 0 1 1-1.6-3.45" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/><path d="M11.6 1.2v3h-3" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  pause: <svg width="13" height="13" viewBox="0 0 14 14"><rect x="3.2" y="2.5" width="2.6" height="9" rx=".8" fill="currentColor"/><rect x="8.2" y="2.5" width="2.6" height="9" rx=".8" fill="currentColor"/></svg>,
  play:  <svg width="13" height="13" viewBox="0 0 14 14"><path d="M4 2.6v8.8a.6.6 0 0 0 .9.5l7-4.4a.6.6 0 0 0 0-1L4.9 2.1a.6.6 0 0 0-.9.5z" fill="currentColor"/></svg>,
  wave:  <svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 9.5h2.5V4.5h3.5v5h3V4.5H13" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  fit:   <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 5V2.6h3M12 5V2.6H9M2 9v2.4h3M12 9v2.4H9" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  save:  <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1.8v6.4M4.4 6l2.6 2.6L9.6 6" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/><path d="M2.4 10.4v1.2h9.2v-1.2" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>,
  load:  <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 8.2V1.8M4.4 4l2.6-2.6L9.6 4" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/><path d="M2.4 10.4v1.2h9.2v-1.2" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>,
};

function App() {
  const [circuit] = useState(()=>createCircuit());
  state.widgetState.circuit = circuit;
  const [, tick] = useState(0);
  const refresh = useCallback(()=>tick(n=>(n+1)%1e6),[]);

  const [selection, setSelection] = useState(null);
  const [palDrag, setPalDrag] = useState(null);
  const [customKinds, setCustomKinds] = useState(()=>hydrateCustomGates());
  const [running, setRunning] = useState(true);
  const [hopMs, setHopMs] = useState(1000);
  const [simTime, setSimTime] = useState(0);
  const [numFormat, setNumFormat] = useState('bin');
  const [numSigned, setNumSigned] = useState(false);

  // Panels. Which ones start open is the slide config's call; which signals
  // the diagram traces, and over what span, travel with the saved state.
  const [partsOpen, setPartsOpen]   = useState(true);
  const [timingOpen, setTimingOpen] = useState(false);
  const [hiddenSig, setHiddenSig]   = useState({});      // compId → true when left off the diagram
  const [timingWin, setTimingWin]   = useState(20000);
  const [recorder] = useState(()=>createRecorder());
  const viewSave = useRef({});
  viewSave.current = { hidden: hiddenSig, windowMs: timingWin };

  const [showHelp, setShowHelp] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [importStep, setImportStep] = useState('choose');
  const [importName, setImportName] = useState('');
  const [importEquation, setImportEquation] = useState('');
  const [importJsonText, setImportJsonText] = useState('');
  const [importErr, setImportErr] = useState('');

  const viewApi = useRef(null);
  const runningRef = useRef(running);
  const hopRef = useRef(hopMs);
  useEffect(()=>{ runningRef.current = running; state.widgetState.running = running; },[running]);
  useEffect(()=>{ hopRef.current = hopMs; state.widgetState.hopMs = hopMs; },[hopMs]);
  useEffect(()=>{ state.widgetState.numFormat = numFormat; },[numFormat]);
  useEffect(()=>{ state.widgetState.numSigned = numSigned; },[numSigned]);

  /* ── history ────────────────────────────────────────────────────────────
     Snapshots of serialize(), pushed on discrete edits (a drag commits once
     on release, not per frame). Layout only — simulation state is derived.
     Keyboard-only: ⌘Z / ⇧⌘Z, with no toolbar buttons to feed. */
  const hist = useRef({ stack:[], idx:-1 });
  const commit = useCallback((label)=>{
    const snap = JSON.stringify(circuit.serialize());
    const h = hist.current;
    if (h.stack[h.idx] === snap) { refresh(); return; }
    h.stack = h.stack.slice(0, h.idx+1);
    h.stack.push(snap);
    if (h.stack.length > 80) h.stack.shift();
    h.idx = h.stack.length-1;
    refresh();
  },[circuit, refresh]);
  const travel = useCallback((delta)=>{
    const h = hist.current;
    const next = h.idx + delta;
    if (next < 0 || next >= h.stack.length) return;
    h.idx = next;
    circuit.load(JSON.parse(h.stack[next]));
    circuit.resetSim();
    setSelection(null);
    refresh();
  },[circuit, refresh]);
  useEffect(()=>{ commit('init'); },[]);

  /* ── simulation clock ───────────────────────────────────────────────────
     Advances only while running, so pausing freezes logic, clocks and every
     wire animation in lockstep instead of letting the picture drift away
     from the state. */
  useEffect(()=>{
    let r, last = performance.now();
    const loop = ()=>{
      const t = performance.now();
      const dt = Math.min(80, t - last);
      last = t;
      if (runningRef.current) state.widgetState.now += dt;
      circuit.step(state.widgetState.now, hopRef.current);
      recorder.sample(circuit, state.widgetState.now);
      r = requestAnimationFrame(loop);
    };
    r = requestAnimationFrame(loop);
    return ()=>cancelAnimationFrame(r);
  },[circuit]);
  // The clock read-out only needs a few updates a second.
  useEffect(()=>{
    const id = setInterval(()=>setSimTime(state.widgetState.now), 100);
    return ()=>clearInterval(id);
  },[]);

  const stepOnce = useCallback(()=>{
    // Nudge time forward by exactly one hop so a paused circuit can be
    // walked through gate by gate.
    state.widgetState.now += hopRef.current;
    circuit.step(state.widgetState.now, hopRef.current);
    recorder.sample(circuit, state.widgetState.now);
    refresh();
  },[circuit, refresh]);
  const resetSim = useCallback(()=>{
    circuit.resetSim();
    recorder.clear();
    state.widgetState.now = 0;
    setSimTime(0); refresh();
  },[circuit, refresh]);

  /* ── keyboard ─────────────────────────────────────────────────────────── */
  useEffect(()=>{
    const onKey = (e)=>{
      const typing = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';
      // Esc closes a dialog first, even from inside one of its fields.
      if (e.key === 'Escape' && (showHelp || showImport)) {
        e.stopImmediatePropagation();
        if (showHelp) setShowHelp(false); else closeImport();
        return;
      }
      const mod = e.metaKey || e.ctrlKey;
      if (mod && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        travel(e.shiftKey ? 1 : -1);
        return;
      }
      if (mod && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); travel(1); return; }
      if (typing) return;
      if (e.key === ' ') { e.preventDefault(); setRunning(v=>!v); return; }
      if (e.key === '.') { e.preventDefault(); stepOnce(); return; }
      // The shortcut reference has no button any more; "?" still summons it.
      if (e.key === '?') { e.preventDefault(); setShowHelp(true); return; }
      if (!mod && !e.altKey && (e.key === 'p' || e.key === 'P')) { setPartsOpen(v=>!v); return; }
      if (!mod && !e.altKey && (e.key === 't' || e.key === 'T')) { setTimingOpen(v=>!v); return; }
      if ((e.key === 'r' || e.key === 'R') && selection) {
        const c = circuit.components.get(selection);
        if (c) {
          const order = ['right','down','left','up'];
          circuit.setFacing(c.id, order[(order.indexOf(c.facing||'right')+1)%4]);
          commit('rotate');
        }
        return;
      }
      if ((e.key === 'f' || e.key === 'F') && selection && circuit.components.has(selection)) {
        circuit.toggleFlip(selection);
        commit('flip');
        return;
      }
      if ((e.key === 'Delete' || e.key === 'Backspace') && selection) {
        e.preventDefault();
        if (circuit.components.has(selection)) circuit.removeComponent(selection);
        else if (circuit.wires.has(selection)) circuit.removeWire(selection);
        setSelection(null); commit('delete');
      }
    };
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  },[selection, circuit, commit, travel, stepOnce, showHelp, showImport]);

  /* ── Beamer+ slide config ───────────────────────────────────────────────
     Beamer+ spreads the widget's node from the slide's config JSON onto
     window.WIDGET_CONFIG (and re-sends it as a 'widget-config' message), so
     any key an author writes there arrives here. Supported keys:

       parts    [{name, equation}] or [{name, data}]  → palette parts
       circuit  serialized circuit                    → what's on the board
       hop      seconds per gate-to-gate hop          → 1 | 2 | 4 | 8
       running  false to start halted

     Objects may also be given as JSON strings, so the same keys work whether
     they're authored by hand or typed into the editor's text fields.

     Parts land in the palette for this deck only — they're deliberately not
     written to the browser's saved-parts registry, so a slide can't quietly
     add clutter to someone's local palette. They're registered *before* the
     board circuit loads, since that circuit may place them. */
  // Settings apply live (the schema's liveSettings): the host re-sends the
  // whole config on every edit and never rebuilds this iframe for one, so
  // each call compares against what was last applied and touches only the
  // keys that changed. Re-sending an unchanged config is a no-op — which is
  // what keeps a saved or hand-built board from being wiped by the starting
  // circuit every time the presenter nudges some other setting.
  const appliedRef = useRef(null);      // key → JSON of the value last applied
  const configKindsRef = useRef([]);    // palette kinds that came from `parts`
  const applyConfig = useCallback((cfg)=>{
    if (!cfg) return;
    const asObject = (v)=>{
      if (!v) return null;
      if (typeof v === 'object') return v;
      try { return JSON.parse(String(v)); } catch { return null; }
    };
    const first = appliedRef.current === null;
    const prev = appliedRef.current || {};
    const next = {};
    const changed = (k)=>{
      let j; try { j = JSON.stringify(cfg[k] ?? null); } catch { j = String(cfg[k]); }
      next[k] = j;
      return first || prev[k] !== j;
    };
    const KEYS = ['running', 'showParts', 'showTiming', 'hop', 'hopMs', 'parts', 'circuit'];
    const dirty = Object.fromEntries(KEYS.map(k=>[k, changed(k)]));
    appliedRef.current = next;

    const flag = (v)=> v === true || v === 'true' ? true : v === false || v === 'false' ? false : null;
    // On load only an explicit false halts it (the default is running); a
    // live edit sets it either way, so ticking the box starts the clock.
    if (dirty.running) {
      if (first) { if (flag(cfg.running) === false) setRunning(false); }
      else if (flag(cfg.running) !== null) setRunning(flag(cfg.running));
    }
    if (dirty.showParts  && flag(cfg.showParts)  !== null) setPartsOpen(flag(cfg.showParts));
    if (dirty.showTiming && flag(cfg.showTiming) !== null) setTimingOpen(flag(cfg.showTiming));
    if (dirty.hop || dirty.hopMs) {
      const hopSec = typeof cfg.hop === 'string' ? parseFloat(cfg.hop) : cfg.hop;
      const wanted = typeof cfg.hopMs === 'number' ? cfg.hopMs
                   : (Number.isFinite(hopSec) ? hopSec*1000 : null);
      if (wanted) {
        // Snap to an offered rate so the toolbar's segmented control still
        // shows which one is active.
        const best = HOP_CHOICES.reduce((a,b)=>Math.abs(b.ms-wanted)<Math.abs(a.ms-wanted)?b:a);
        setHopMs(best.ms);
      }
    }

    if (dirty.parts) {
      const parts = asObject(cfg.parts) || [];
      const added = [];
      for (const p of (Array.isArray(parts) ? parts : [])) {
        try {
          let name = p.name, data = asObject(p.data || p.circuit);
          if (!data && p.equation) {
            const built = buildEquationCircuit(p.equation);
            if (built.error) throw new Error(built.error);
            data = built.data;
            name = name || built.outputLabel;
          }
          if (!data || !name) throw new Error('needs a name plus either data or equation');
          added.push(gates.registerCustomGate(name, data));
        } catch (err) {
          console.warn('[circuit] slide config: skipping part', p && p.name, '—', err.message);
        }
      }
      // Swap the config's parts for the new list. A dropped part leaves the
      // palette, but its gate stays registered, so copies already placed on
      // the board keep working.
      const old = configKindsRef.current;
      configKindsRef.current = added;
      if (added.length || old.length) {
        setCustomKinds(prevKinds=>[...new Set([...prevKinds.filter(k=>!old.includes(k)), ...added])]);
      }
    }

    // A new starting circuit replaces what's on the board: pasting one is an
    // explicit "show this instead". Unchanged, it's left alone, so the live
    // board (and the saved state that overrode it on load) survives.
    if (dirty.circuit) {
      const board = asObject(cfg.circuit);
      if (board && Array.isArray(board.components)) {
        circuit.load(board);
        circuit.resetSim();
        hist.current = { stack:[JSON.stringify(circuit.serialize())], idx:0 };
      }
    }
    refresh();
  },[circuit, refresh]);
  useEffect(()=>{ applyConfig(window.WIDGET_CONFIG); },[applyConfig]);

  /* ── Beamer+ state protocol ─────────────────────────────────────────────
     widget-set-state arrives after widget-config, so a circuit the presenter
     saved into the deck's widget-states.json wins over the config's starting
     circuit — the live state is the newer truth. */
  useEffect(()=>{
    const wid = (window.WIDGET_CONFIG || {}).id || 'circuit-sim';
    const handler = (e)=>{
      if (!e.data) return;
      if (e.data.type === 'widget-config') {
        applyConfig(e.data.config);
      } else if (e.data.type === 'widget-get-state') {
        // `timing` rides alongside the circuit; load() ignores keys it
        // doesn't know, and Export still writes the bare circuit.
        const v = viewSave.current;
        const hidden = Object.keys(v.hidden).filter(id => v.hidden[id] && circuit.components.has(id));
        window.parent.postMessage({ type:'widget-state', widgetId:wid,
          state:{ ...circuit.serialize(), timing:{ hidden, windowMs:v.windowMs } } }, '*');
      } else if (e.data.type === 'widget-set-state' && e.data.state) {
        const tm = e.data.state.timing;
        if (tm && typeof tm === 'object') {
          if (Array.isArray(tm.hidden)) setHiddenSig(Object.fromEntries(tm.hidden.slice(0, 200).map(id=>[String(id), true])));
          if (timing.WINDOW_CHOICES.some(w=>w.ms === tm.windowMs)) setTimingWin(tm.windowMs);
        }
        circuit.load(e.data.state);
        circuit.resetSim();
        hist.current = { stack:[JSON.stringify(circuit.serialize())], idx:0 };
        refresh();
      }
    };
    window.addEventListener('message', handler);
    // Take over from the early buffer, then replay whatever it caught while
    // React was still committing — in arrival order, so a saved state still
    // lands after the config it should override.
    window.__widgetAppReady = true;
    const queued = window.__widgetInbox || [];
    window.__widgetInbox = [];
    for (const data of queued) handler({ data });
    return ()=>{
      window.removeEventListener('message', handler);
      window.__widgetAppReady = false;
    };
  },[circuit, refresh, applyConfig]);

  /* ── custom gates ─────────────────────────────────────────────────────── */
  const onDeleteCustom = (kind)=>{
    if (!confirm('Remove this part from the palette? Copies already on the canvas keep working.')) return;
    removeFromCustomRegistry(kind.slice(7));
    setCustomKinds(prev=>prev.filter(k=>k!==kind));
  };
  const registerCustom = (name, data)=>{
    if (customKinds.includes('CUSTOM:'+name)) {
      const cycle = findCustomCycle(name, data);
      if (cycle) {
        setImportErr(`"${name}" already exists and would depend on itself:\n${cycle.join(' → ')}`);
        return false;
      }
    }
    let kind;
    try { kind = gates.registerCustomGate(name, data); }
    catch (err) { setImportErr('Could not build that part: ' + err.message); return false; }
    upsertCustomRegistry(name, data);
    setCustomKinds(prev=>prev.includes(kind) ? prev : [...prev, kind]);
    return true;
  };

  // Builds a small circuit from a "Y = A·B + C'" style equation in a private
  // off-canvas instance, so it can be registered directly as a part.
  const buildEquationCircuit = (eqStr)=>{
    const eq = eqStr.trim();
    const match = /^([A-Za-z])\s*=\s*(.+)$/.exec(eq);
    if (!match) return { error:"Enter an equation like  Y = A B + C'" };
    const outputLabel = match[1], rhs = match[2];
    const literalLabels = [...new Set(rhs.match(/[A-Za-z]/g) || [])].filter(l=>l!==outputLabel);
    if (!literalLabels.length) return { error:'No input variables found on the right-hand side' };

    const temp = createCircuit();
    const labelsToComps = new Map();
    literalLabels.forEach((label,idx)=>{
      labelsToComps.set(label, temp.addComponent('INPUT', 0, idx*60, 'right', 0, label));
    });
    const outputComp = temp.addComponent('OUTPUT', 400, 0, 'right', 0, outputLabel);
    let numAnds=0, numNots=0;
    const pinRef = (comp,pin=0)=>({ compId:comp.id, pin, type:'out' });
    const inRef  = (comp,pin=0)=>({ compId:comp.id, pin, type:'in' });
    const parseLiteral = (literal)=>{
      const comp = labelsToComps.get(literal[0]);
      if (!comp) throw new Error('Unknown input ' + literal[0]);
      if (literal.endsWith("'")) {
        const n = temp.addComponent('NOT', 100, (numNots++)*70);
        temp.addWire(pinRef(comp), inRef(n));
        return pinRef(n);
      }
      return pinRef(comp);
    };
    const andTerm = (term)=>{
      const literals = term.match(/[A-Za-z]'?/g) || [];
      if (!literals.length) return null;
      let cur = parseLiteral(literals[0]);
      for (let i=1;i<literals.length;i++) {
        const next = parseLiteral(literals[i]);
        const a = temp.addComponent('AND', 200, (numAnds++)*70);
        temp.addWire(cur, inRef(a,0));
        temp.addWire(next, inRef(a,1));
        cur = pinRef(a);
      }
      return cur;
    };
    const orTerms = rhs.split('+').map(t=>t.trim()).filter(Boolean);
    if (!orTerms.length) return { error:'No terms found in the equation' };
    try {
      let src = andTerm(orTerms[0]);
      for (let i=1;i<orTerms.length;i++) {
        const next = andTerm(orTerms[i]);
        const o = temp.addComponent('OR', 300, i*70);
        temp.addWire(src, inRef(o,0));
        temp.addWire(next, inRef(o,1));
        src = pinRef(o);
      }
      temp.addWire(src, inRef(outputComp,0));
    } catch (err) { return { error: err.message }; }
    return { outputLabel, data: temp.serialize() };
  };

  const closeImport = ()=>{
    setShowImport(false); setImportStep('choose');
    setImportName(''); setImportEquation(''); setImportJsonText(''); setImportErr('');
  };
  const createFromEquation = ()=>{
    setImportErr('');
    const built = buildEquationCircuit(importEquation);
    if (built.error) { setImportErr(built.error); return; }
    if (registerCustom(importName.trim() || built.outputLabel, built.data)) closeImport();
  };
  const createFromJson = ()=>{
    setImportErr('');
    let parsed;
    try { parsed = JSON.parse(importJsonText); }
    catch { setImportErr("That doesn't look like valid JSON."); return; }
    const data = parsed.data || parsed;
    if (!data || !Array.isArray(data.components)) { setImportErr("That JSON doesn't look like a circuit."); return; }
    // Same rule as building from the canvas — check it on a throwaway copy.
    const probe = createCircuit();
    try { probe.load(data); } catch { setImportErr("That circuit couldn't be loaded."); return; }
    const loose = describeDanglingInputs(probe);
    if (loose) { setImportErr(loose); return; }
    const name = importName.trim() || parsed.name || `Part ${customKinds.length+1}`;
    if (registerCustom(name, data)) closeImport();
  };
  const createFromCanvas = ()=>{
    setImportErr('');
    const data = circuit.serialize();
    const ios = data.components.filter(c=>c.kind==='INPUT'||c.kind==='OUTPUT');
    if (!ios.some(c=>c.kind==='INPUT') || !ios.some(c=>c.kind==='OUTPUT')) {
      setImportErr('The canvas needs at least one IN and one OUT to become a part —\nthose are what turn into its pins.');
      return;
    }
    const loose = describeDanglingInputs(circuit);
    if (loose) { setImportErr(loose); return; }
    const name = importName.trim();
    if (!name) { setImportErr('Give the part a name.'); return; }
    if (registerCustom(name, data)) closeImport();
  };
  const onJsonFile = (e)=>{
    const file = e.target.files?.[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      setImportJsonText(String(reader.result));
      try {
        const parsed = JSON.parse(String(reader.result));
        if (parsed.name && !importName.trim()) setImportName(parsed.name);
      } catch {}
    };
    reader.readAsText(file);
  };


  /* The widget's Name setting (every widget has one — the settings kit adds it)
     is its title everywhere: the bar, the heading inside an exported PDF, and
     the downloaded file's name. Blank falls back to the widget's own default. */
  function wName(fallback){
    return (window.BeamerWidget && BeamerWidget.name) ? BeamerWidget.name(fallback) : fallback;
  }
  function wFile(fallback, ext){
    return (window.BeamerWidget && BeamerWidget.fileName) ? BeamerWidget.fileName(fallback, ext) : fallback + ext;
  }

  const exportJson = ()=>{
    const blob = new Blob([JSON.stringify(circuit.serialize(), null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = wFile('circuit', '.json');
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  };
  // Beamer+'s notes PDF: the board, cropped to what's on it, in the
  // widget's box on its slide. Registered once; it reads the live SVG
  // through the ref, so it always prints the board as it is now.
  useEffect(()=>{
    window.BeamerWidget?.print?.register(async ()=>{
      const svg = viewApi.current?.svg?.();
      return { image: svg ? await window.CircuitPrint.image(svg) : null };
    });
  },[]);
  const importFileRef = useRef(null);
  const importCircuitFile = (e)=>{
    const file = e.target.files?.[0];
    e.target.value = ''; // so picking the same file twice still fires onChange
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      let parsed;
      try { parsed = JSON.parse(String(reader.result)); }
      catch { alert("That doesn't look like valid JSON."); return; }
      // Exported files are the raw serialize() shape; tolerate a stray
      // {name, data} wrapper too, since that's what a custom-part JSON
      // (the other place this app writes JSON) looks like.
      const data = Array.isArray(parsed?.components) ? parsed : parsed?.data;
      if (!data || !Array.isArray(data.components)) { alert("That JSON doesn't look like a circuit export."); return; }
      const probe = createCircuit();
      try { probe.load(data); } catch { alert("That circuit couldn't be loaded."); return; }
      if (circuit.components.size > 0 &&
          !confirm('Importing replaces everything currently on the canvas. Continue?')) return;
      circuit.load(data);
      circuit.resetSim();
      setSelection(null);
      commit('import');
      viewApi.current?.fit?.();
    };
    reader.readAsText(file);
  };
  const placeFromPalette = (kind)=>{
    const vis = gates.GATE_VIS[kind];
    const c0 = viewApi.current?.centerWorld?.() || { x:120, y:120 };
    const g = (v)=>Math.round(v/engine.GRID)*engine.GRID;
    const c = circuit.addComponent(kind, g(c0.x - (vis?.w||80)/2), g(c0.y - (vis?.h||80)/2));
    setSelection(c.id);
    commit('add '+kind);
  };

  const compCount = circuit.components.size;
  // Surfaced live in the "new part" dialog so the block is refused before the
  // click, not after it.
  const danglingReport = (showImport && importStep === 'canvas') ? describeDanglingInputs(circuit) : null;

  return <div className="app">
    {/* ── toolbar ── rendered into the static bar above the root */}
    {ReactDOM.createPortal(<>
      <div className="tb-group" title="Propagation time for one gate-to-gate hop">
        <div className="seg">
          {HOP_CHOICES.map(h=>(
            <button key={h.ms} className={'seg-btn'+(hopMs===h.ms?' on':'')}
                    onClick={()=>setHopMs(h.ms)}>{h.label}</button>
          ))}
        </div>
      </div>
      {/* A dedicated pause/run button that never hides; the clock read-out
          beside it still toggles too, but it drops out on narrow slides. */}
      <button className={'bw-btn bw-btn--icon tb-run'+(running?'':' paused')} onClick={()=>setRunning(v=>!v)}
              title={running ? 'Pause (Space)' : 'Run (Space)'} aria-label={running ? 'Pause' : 'Run'}>
        {running ? I.pause : I.play}
      </button>
      <button className={'tb-clock'+(running?'':' paused')} onClick={()=>setRunning(v=>!v)}
              title={running ? 'Halt (Space) · time advances while running' : 'Run (Space) · halted'}>
        <i/><span>t</span><b>{(simTime/1000).toFixed(2)}s</b>
      </button>
      <button className="bw-btn bw-btn--icon" onClick={resetSim} title="Reset signals to cold start">{I.reset}</button>
      {selection && canvas.cardKindFor(circuit, selection) && <><div className="bw-sep"/>
        <SelectionPanel circuit={circuit} selection={selection}
                        onChange={refresh} onCommit={commit} onSelect={setSelection}/>
      </>}
      <div className="bw-spacer"/>
      <div className="tb-group">
        <button className="bw-btn bw-btn--icon" onClick={()=>viewApi.current?.fit()} title="Fit circuit to view">{I.fit}</button>
      </div>
      <div className="bw-sep"/>
      <div className="tb-group" title="How multi-bit bus values are displayed">
        <div className="seg">
          {[['bin','BIN'],['dec','DEC'],['hex','HEX']].map(([v,l])=>(
            <button key={v} className={'seg-btn'+(numFormat===v?' on':'')}
                    onClick={()=>setNumFormat(v)}>{l}</button>
          ))}
        </div>
      </div>
      <div className="tb-group" title={numFormat === 'dec'
             ? 'Read bus values as unsigned or as two\'s-complement signed'
             : 'Only affects DEC — BIN and HEX show the raw bits'}>
        <div className="seg">
          {[[false,'UNSIGNED'],[true,'SIGNED']].map(([v,l])=>(
            <button key={l} className={'seg-btn'+(numSigned===v?' on':'')}
                    disabled={numFormat !== 'dec'}
                    onClick={()=>setNumSigned(v)}>{l}</button>
          ))}
        </div>
      </div>
      <div className="bw-sep"/>
      <div className="tb-group">
        <button className="bw-btn" onClick={()=>importFileRef.current?.click()} title="Load a circuit from a JSON file">{I.load}<span className="bl">Import</span></button>
        <button className="bw-btn" onClick={exportJson} title="Download this circuit as JSON">{I.save}<span className="bl">Export</span></button>
        <input ref={importFileRef} type="file" accept="application/json,.json" onChange={importCircuitFile} hidden/>
      </div>
    </>, document.getElementById('tb-slot'))}

    {/* ── body ── */}
    <div className="main">
      <Palette open={partsOpen}
               onToggle={()=>setPartsOpen(v=>!v)}
               onDragStart={kind=>setPalDrag({kind})}
               onPlace={placeFromPalette}
               onImportClick={()=>setShowImport(true)}
               onDeleteCustom={onDeleteCustom}
               customKinds={customKinds}/>
      <div className="stage">
      <div className="canvas-wrap">
        <Canvas circuit={circuit}
                selection={selection}
                onSelect={setSelection}
                paletteDrag={palDrag}
                onClearPaletteDrag={()=>setPalDrag(null)}
                onChange={refresh}
                onCommit={commit}
                viewApi={viewApi}/>
        {!compCount && !palDrag && <div className="empty-hint"><div className="empty-card">
          <h3>Empty board</h3>
          <p>Drag a part in from the left — or click it to drop one in the middle.
             Then click one pin and the next to wire them together.</p>
        </div></div>}
      </div>
      <TimingPanel open={timingOpen} onToggle={()=>setTimingOpen(v=>!v)}
          circuit={circuit} recorder={recorder}
          hidden={hiddenSig} windowMs={timingWin}
          onToggleSignal={id=>setHiddenSig(h=>({ ...h, [id]: !h[id] }))}
          onShowAll={()=>setHiddenSig({})}
          onHideAll={()=>setHiddenSig(Object.fromEntries([...circuit.components.values()]
            .filter(c=>c.kind==='INPUT'||c.kind==='CLOCK'||c.kind==='OUTPUT').map(c=>[c.id, true])))}
          onWindow={setTimingWin}/>
      </div>
    </div>

    {showHelp && <Dialog title="Wiring & shortcuts"
        sub={`Every gate-to-gate hop costs the same ${hopMs/1000}s, however the wires are drawn — a three-gate chain lands three hops after its source.`}
        onClose={()=>setShowHelp(false)}>
      <div className="dialog-section-title">Drawing wires</div>
      <ul className="hint-list">
        <li><kbd className="key">click</kbd><span>a pin to start — either end works</span></li>
        <li><kbd className="key">click</kbd><span>empty space to drop a corner</span></li>
        <li><kbd className="key">drag</kbd><span>off an existing wire to branch from it</span></li>
        <li><kbd className="key">⌫</kbd><span>undo the last corner</span></li>
        <li><kbd className="key">Esc</kbd><span>cancel the wire in progress</span></li>
      </ul>
      <div className="dialog-section-title">Keys</div>
      <div className="hint-cols">
        <ul className="hint-list">
          <li><kbd className="key">Space</kbd><span>run / halt</span></li>
          <li><kbd className="key">.</kbd><span>one hop</span></li>
          <li><kbd className="key">R</kbd><span>rotate</span></li>
          <li><kbd className="key">F</kbd><span>flip</span></li>
        </ul>
        <ul className="hint-list">
          <li><kbd className="key">Del</kbd><span>delete</span></li>
          <li><kbd className="key">⌘Z</kbd><span>undo</span></li>
          <li><kbd className="key">P</kbd><span>parts panel</span></li>
          <li><kbd className="key">T</kbd><span>timing diagram</span></li>
          <li><kbd className="key">?</kbd><span>this list</span></li>
        </ul>
      </div>
      <div className="dialog-section-title">Board</div>
      <ul className="hint-list">
        <li><kbd className="key">knob</kbd><span>click a switch’s knob to flip it, a clock’s pad to run or halt it</span></li>
        <li><kbd className="key">body</kbd><span>click the rest of a part to select and configure it</span></li>
        <li><kbd className="key">wire</kbd><span>drag off a wire, or click a selected wire, to branch from that point · draw from an input and click a wire to join it</span></li>
        <li><kbd className="key">scroll</kbd><span>zoom · drag empty space to pan</span></li>
        <li><kbd className="key">right-click</kbd><span>delete a part or a wire outright</span></li>
      </ul>
      <div className="dialog-actions">
        <button className="btn primary" onClick={()=>setShowHelp(false)}>Got it</button>
      </div>
    </Dialog>}

    {showImport && <Dialog title="New part"
        sub="Bundle logic into a reusable block that behaves as a single hop."
        onClose={closeImport}>
      {importStep === 'choose' && <>
        <div className="import-choices">
          <button className="import-choice" onClick={()=>setImportStep('canvas')}>
            <div className="import-choice-title">From what’s on the canvas</div>
            <div className="import-choice-sub">Its IN and OUT components become the part’s pins</div>
          </button>
          <button className="import-choice" onClick={()=>setImportStep('equation')}>
            <div className="import-choice-title">From a Boolean equation</div>
            <div className="import-choice-sub">Something like  Y = A B + C'</div>
          </button>
          <button className="import-choice" onClick={()=>setImportStep('json')}>
            <div className="import-choice-title">From a saved circuit</div>
            <div className="import-choice-sub">Paste or upload exported JSON</div>
          </button>
        </div>
        <div className="dialog-actions"><button className="btn ghost" onClick={closeImport}>Cancel</button></div>
      </>}

      {importStep === 'canvas' && <>
        <div className="dialog-section-title">Part name</div>
        <input className="text-input" placeholder="e.g. Half adder" value={importName} autoFocus
               onChange={e=>setImportName(e.target.value)}
               onKeyDown={e=>e.key==='Enter'&&createFromCanvas()}/>
        <p className="sel-note" style={{marginTop:9,fontSize:11.5}}>
          {circuit.components.size} components will be captured. The canvas itself is left alone.
        </p>
        {danglingReport && <div className="import-error">{danglingReport}</div>}
        {importErr && importErr !== danglingReport && <div className="import-error">{importErr}</div>}
        <div className="dialog-actions">
          <button className="btn ghost" onClick={()=>{ setImportStep('choose'); setImportErr(''); }}>Back</button>
          <button className="btn primary" disabled={!!danglingReport} onClick={createFromCanvas}>Create part</button>
        </div>
      </>}

      {importStep === 'equation' && <>
        <div className="dialog-section-title">Equation</div>
        <input className="text-input" placeholder="Y = A B + C'" value={importEquation} autoFocus
               onChange={e=>setImportEquation(e.target.value)}
               onKeyDown={e=>e.key==='Enter'&&createFromEquation()}/>
        <div className="dialog-section-title">Name (optional)</div>
        <input className="text-input" placeholder="defaults to the output label" value={importName}
               onChange={e=>setImportName(e.target.value)}
               onKeyDown={e=>e.key==='Enter'&&createFromEquation()}/>
        {importErr && <div className="import-error">{importErr}</div>}
        <div className="dialog-actions">
          <button className="btn ghost" onClick={()=>{ setImportStep('choose'); setImportErr(''); }}>Back</button>
          <button className="btn primary" onClick={createFromEquation}>Create part</button>
        </div>
      </>}

      {importStep === 'json' && <>
        <div className="dialog-section-title">Circuit JSON</div>
        <textarea className="text-input json-input" rows={6} placeholder='{"components":[…],"wires":[…]}'
                  value={importJsonText} onChange={e=>setImportJsonText(e.target.value)}/>
        <label className="btn ghost file-btn">
          Choose a .json file…
          <input type="file" accept="application/json,.json" onChange={onJsonFile} hidden/>
        </label>
        <div className="dialog-section-title">Name (optional)</div>
        <input className="text-input" placeholder="defaults to the file’s name" value={importName}
               onChange={e=>setImportName(e.target.value)}/>
        {importErr && <div className="import-error">{importErr}</div>}
        <div className="dialog-actions">
          <button className="btn ghost" onClick={()=>{ setImportStep('choose'); setImportErr(''); }}>Back</button>
          <button className="btn primary" onClick={createFromJson}>Create part</button>
        </div>
      </>}
    </Dialog>}
  </div>;
}

function Dialog({ title, sub, children, onClose }) {
  return <div className="modal-bg" onMouseDown={onClose}>
    <div className="modal" onMouseDown={e=>e.stopPropagation()}>
      <div className="modal-title">{title}</div>
      {sub && <div className="modal-sub">{sub}</div>}
      {children}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script>
</body>
</html>
