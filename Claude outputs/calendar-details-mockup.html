<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar Details Mockup</title>
<style>
  :root { --bg:#faf9f6; --card:#fff; --strip:#f4f3ef; --line:#e6e3dc; --line-2:#d9d6cf; --ink:#1f2328; --ink-2:#4a4f57; --ink-3:#80848b; --accent:#b58a00; --accent-bg:#fbf0d2; --accent-line:#e8cf7c;
    --serif: "Times New Roman", Georgia, serif; --ui: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font: 15px/1.5 var(--ui); color: var(--ink); }
  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 60px; }
  .note { margin: 0 0 18px; padding: 10px 14px; border-radius: 8px; background: #eef3fb; color: #2c4a70; font-size: 13.5px; }
  .path { font-size: 14px; color: var(--ink-2); margin-bottom: 14px; } .path b { color: var(--ink); }
  h1 { margin: 0; font: 500 38px/1.15 var(--serif); } .sub { margin: 6px 0 22px; color: var(--ink-2); }
  .card { position: relative; padding: 20px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--card); overflow: hidden; }
  .cal { display: grid; grid-template-columns: 52px repeat(5, 1fr); transition: opacity .15s; }
  .h { padding-bottom: 8px; text-align: center; font: 700 11.5px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .times { position: relative; } .times span { position: absolute; right: 8px; transform: translateY(-50%); font-size: 11.5px; color: var(--ink-3); } .times span:first-child { transform: none; }
  .day { position: relative; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); } .day:last-child { border-right: 1px solid var(--line); }
  .day i { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
  .ev { position: absolute; left: 2px; right: 2px; display: grid; align-content: start; gap: 1px; padding: 5px 7px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--strip); text-align: left; font: 12px/1.3 var(--ui); color: var(--ink-2); cursor: pointer; overflow: hidden; }
  .ev b { display: flex; gap: 4px; align-items: center; color: var(--ink); font-weight: 700; white-space: nowrap; }
  .ev.mine { background: var(--accent-bg); border-color: var(--accent-line); }
  .ev:hover { filter: brightness(.97); }
  .ev svg, .ic svg { width: 12px; height: 12px; color: var(--ink-3); }
  /* The details: over the calendar, the same size, with Back */
  .det { position: absolute; inset: 0; padding: 20px 24px; background: var(--card); display: none; flex-direction: column; }
  .card.open .det { display: flex; } .card.open .cal { opacity: 0; }
  .back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--card); font: 600 13.5px var(--ui); color: var(--ink); cursor: pointer; }
  .back:hover { background: var(--accent-bg); border-color: var(--accent-line); }
  .back svg { width: 15px; height: 15px; }
  .kick { margin: 22px 0 1px; display: flex; align-items: center; gap: 6px; font: 700 11px/1.3 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .kick svg { width: 14px; height: 14px; }
  .det h2 { margin: 0; font: 500 32px/1.1 var(--serif); }
  .who { margin: 2px 0 0; color: var(--ink-2); font-size: 15px; }
  .facts { margin-top: 16px; display: grid; gap: 8px; }
  .fact { display: flex; align-items: center; gap: 10px; font-size: 15px; } .fact svg { width: 17px; height: 17px; color: var(--ink-3); flex: none; }
  .fact a { color: var(--accent); }
  .yours { margin-top: auto; align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent-line); font: 600 12px var(--ui); color: #7a5d00; }
  .also { margin-top: 18px; font-size: 13.5px; color: var(--ink-3); }
  .also b { color: var(--ink-2); font-weight: 600; }
</style></head>
<body><main>
  <p class="note"><b>Mockup</b> (nothing saved). Click a meeting: its details cover the calendar, the same size, with a Back button. Click Back (or press Esc) to return.</p>
  <div class="path">Home › <b>About the Course</b></div>
  <h1>About the Course</h1><p class="sub">Winter 2027 · University of Toronto</p>
  <div class="card" id="card">
    <div class="cal" id="cal"></div>
    <div class="det" id="det"></div>
  </div>
</main>
<script>
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC = { lecture: svg('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'), tutorial: svg('<path d="M4 5h12v8H8l-4 3z"/><path d="M20 9v8l-3-2h-6"/>'),
  lab: svg('<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/>'), office: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>') };
const CLOCK = svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'), PIN = svg('<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'),
  CAL = svg('<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'), BACK = svg('<path d="m15 6-6 6 6 6"/>');
const E = [
  { k: "lecture", n: "LEC0101", d: 1, a: 11, b: 12, w: "GB302, Galbraith Building", who: "Chandra Gummaluru", mine: true, days: "Mon 11:00–12:00 (GB302), Wed 11:00–12:00 (MP102), Fri 11:00–12:00 (BA1160)" },
  { k: "lecture", n: "LEC0101", d: 3, a: 11, b: 12, w: "MP102, McLennan Physics Building", who: "Chandra Gummaluru", mine: true, days: "Mon 11:00–12:00 (GB302), Wed 11:00–12:00 (MP102), Fri 11:00–12:00 (BA1160)" },
  { k: "lecture", n: "LEC0101", d: 5, a: 11, b: 12, w: "BA1160, Bahen Centre", who: "Chandra Gummaluru", mine: true, days: "Mon 11:00–12:00 (GB302), Wed 11:00–12:00 (MP102), Fri 11:00–12:00 (BA1160)" },
  { k: "lecture", n: "LEC0102", d: 1, a: 13, b: 14, w: "GB345, Galbraith Building", who: "Chandra Gummaluru", days: "Mon, Wed, Fri 13:00–14:00 (GB345)" },
  { k: "lecture", n: "LEC0102", d: 3, a: 13, b: 14, w: "GB345, Galbraith Building", who: "Chandra Gummaluru", days: "Mon, Wed, Fri 13:00–14:00 (GB345)" },
  { k: "lecture", n: "LEC0102", d: 5, a: 13, b: 14, w: "GB345, Galbraith Building", who: "Chandra Gummaluru", days: "Mon, Wed, Fri 13:00–14:00 (GB345)" },
  { k: "office", n: "Office Hours · CG", d: 2, a: 14, b: 16, w: "BA 4010", who: "Chandra Gummaluru", mine: true },
  { k: "tutorial", n: "TUT0101", d: 4, a: 15, b: 16, w: "BA 2135", who: "Alex Chen (TA)", mine: true, days: "Thu 15:00–16:00 (BA 2135)" },
  { k: "tutorial", n: "TUT0102", d: 4, a: 16, b: 17, w: "BA 2155", who: "Sam Patel (TA)", days: "Thu 16:00–17:00 (BA 2155)" },
];
const D3 = ["", "Mon", "Tue", "Wed", "Thu", "Fri"], lo = 11, hi = 17, H = 54, px = h => (h - lo) * H;
const KIND = { lecture: "Lecture Section", tutorial: "Tutorial Section", lab: "Lab Section", office: "Office Hours" };
const cal = document.getElementById("cal");
let h = `<div class="h"></div>${[1,2,3,4,5].map(d => `<div class="h">${D3[d]}</div>`).join("")}<div class="times" style="height:${px(hi)}px">${Array.from({length: hi - lo}, (_, i) => `<span style="top:${i * H}px">${lo + i}:00</span>`).join("")}</div>`;
for (let d = 1; d <= 5; d++) h += `<div class="day" style="height:${px(hi)}px">${Array.from({length: hi - lo}, (_, i) => `<i style="top:${i * H}px"></i>`).join("")}${E.map((e, i) => e.d === d ? `<button class="ev${e.mine ? " mine" : ""}" data-i="${i}" style="top:${px(e.a)}px;height:${(e.b - e.a) * H - 3}px"><b>${IC[e.k]}${e.n}</b><span>${e.a}:00–${e.b}:00</span><span>${e.w}</span></button>` : "").join("")}</div>`;
cal.innerHTML = h;
const card = document.getElementById("card"), det = document.getElementById("det");
cal.onclick = ev => { const b = ev.target.closest(".ev"); if (!b) return; const e = E[+b.dataset.i];
  det.innerHTML = `<button class="back" id="back">${BACK}Back to the Week</button>
    <p class="kick">${IC[e.k]}${KIND[e.k]}</p><h2>${e.k === "office" ? "Chandra Gummaluru" : e.n}</h2>${e.k !== "office" ? `<p class="who">${e.who}</p>` : ""}
    <div class="facts"><div class="fact">${CAL}${D3[e.d]}, ${e.a}:00–${e.b}:00</div><div class="fact">${PIN}<a href="#">${e.w}</a></div></div>
    ${e.days ? `<p class="also">This section meets: <b>${e.days}</b></p>` : ""}
    ${e.mine ? `<span class="yours">${e.k === "office" ? "Your instructor" : "Your section"}</span>` : ""}`;
  card.classList.add("open"); document.getElementById("back").onclick = () => card.classList.remove("open"); document.getElementById("back").focus(); };
addEventListener("keydown", e => { if (e.key === "Escape") card.classList.remove("open"); });
</script>
</main></body></html>
