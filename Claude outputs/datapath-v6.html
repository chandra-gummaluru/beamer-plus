<!DOCTYPE html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "Multi-cycle Datapath",
  "category": "Computer Science",
  "fields": [
    { "key": "instruction", "label": "First instruction", "type": "text", "placeholder": "addi r8, r9, 5" },
    { "key": "registers", "label": "Starting registers", "type": "text", "placeholder": "r9=10" },
    { "key": "memory", "label": "Starting data words (address=value)", "type": "text", "placeholder": "4=0" },
    { "key": "pc", "label": "Starting PC", "type": "number", "min": 0, "step": 4, "default": 64 },
    { "key": "showValues", "label": "Show values on the wires", "type": "checkbox", "default": true },
    { "key": "scale", "label": "Text size", "type": "select", "options": ["1", "1.4", "1.8", "2.2"], "default": "1" }
  ]
}
</script>
<meta charset="UTF-8">

<!-- Vendored by the Beamer+ server. Never call io() bare — inside the srcdoc
     iframe that resolves to http://about/socket.io/, which an HTTPS deck blocks. -->

<style>
/* Tokens, reset, toolbar, buttons, the slide fonts and the slide-native
   colours (--sn-*) come from the shared widget base (widget-base.css). What's
   left here is the instruction line, the datapath figure, its caption and the
   register file. The figure itself is drawn in SVG with resolved colours (see
   inks()), so it prints the same as it shows. */

html, body { height: 100%; overflow: hidden; }

:root { --dp-hl: #f8c445; }            /* the deck's hl = rgb(248,196,69) */

/* ── Toolbar ─────────────────────────────────────────────── */
#cycles { font-family: var(--font-mono); }
.bw-btn svg { width: 13px; height: 13px; flex: none; }
.bw-btn.ico { display: inline-flex; align-items: center; gap: 5px; }

/* ── Layout ──────────────────────────────────────────────── */
#main { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }

/* ── Instruction line: dropdowns, and its 32 bits below ── */
#top { flex: none; padding: calc(10px * var(--u, 1)) 16px 0; display: flex; flex-direction: column; align-items: center; }
#ins-row {
  display: flex; align-items: center; gap: 2px;
  font-family: var(--font-mono); font-size: calc(17px * var(--u, 1)); color: var(--text);
}
#ins-row .p { white-space: pre; }
#ins-row select {
  font: inherit; color: var(--text); background: var(--bg);
  padding: 2px calc(18px * var(--u, 1)) 2px 6px; border: 1.5px solid var(--sn-faint, var(--border-med)); border-radius: var(--sn-r, 6px);
  cursor: pointer; outline: none;
  appearance: none; -webkit-appearance: none;
  /* a small caret, so each box reads as a dropdown */
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 10px) 55%, calc(100% - 6px) 55%;
  background-size: 4px 4px, 4px 4px; background-repeat: no-repeat;
}
#ins-row select:hover, #ins-row select:focus { border-color: var(--text); }
#ins-row select:disabled { border-color: transparent; background-image: none; cursor: default; padding: 2px 1px; opacity: 1; }
#ins-row select.op { font-weight: 700; }
#fields { display: flex; margin-top: calc(22px * var(--u, 1)); min-height: calc(30px * var(--u, 1)); padding-bottom: calc(8px * var(--u, 1)); }
.fld { display: flex; flex-direction: column; align-items: center; min-width: 0; position: relative; }
.fld + .fld { margin-left: -1.5px; }
.fld .t  { position: absolute; top: calc(-15px * var(--u, 1)); font-family: var(--font-mono); font-size: calc(10px * var(--u, 1)); color: var(--text); white-space: nowrap; }
.fld .b  {
  font-family: var(--font-mono); font-size: calc(13px * var(--u, 1)); letter-spacing: .02em;
  padding: 3px 6px; border: 1.5px solid var(--text); background: var(--sn-node, var(--bg-subtle)); white-space: nowrap;
}
.fld.w5 .b, .fld.w6 .b { min-width: calc(70px * var(--u, 1)); text-align: center; }
.fld .m  { position: absolute; top: 100%; margin-top: 2px; font-size: calc(11px * var(--u, 1)); color: var(--sn-cap, var(--text-3)); white-space: nowrap; }
.fld .m code { font-family: var(--font-mono); }

/* ── Figure and caption ──────────────────────────────────── */
#fig-wrap { flex: 1; min-height: 0; position: relative; }
#fig { position: absolute; inset: 2px 12px 2px; width: calc(100% - 24px); height: calc(100% - 4px); display: block; }
#caption {
  flex: none; text-align: center; padding: 2px 24px calc(8px * var(--u, 1));
  font-size: calc(15px * var(--u, 1)); line-height: 1.3; color: var(--text); min-height: 1.3em;
}
#caption .st { color: var(--sn-cap, var(--text-3)); margin-right: .5em; }
#caption code { font-family: var(--font-mono); }
#caption.err .tx { color: var(--err); }

/* ── Register file ───────────────────────────────────────── */
#panel { flex: none; padding: 6px 16px 10px; border-top: 1px solid var(--border); }
.col-h {
  display: flex; margin-bottom: 4px;
  font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3);
}
#regs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px 10px; }
.rc {
  display: flex; align-items: baseline; gap: 6px;
  font-family: var(--font-mono); font-size: calc(12.5px * var(--u, 1)); line-height: 1.5;
  padding: 0 6px; border-radius: 4px; white-space: nowrap; color: var(--text);
}
.rc .n { color: var(--sn-cap, var(--text-3)); }
.rc .v { margin-left: auto; overflow: hidden; text-overflow: ellipsis; }
.rc.zero .v { color: var(--sn-cap, var(--text-3)); }
.rc.hot { background: var(--dp-hl); color: #111; }
.rc.hot .n, .rc.hot .v { color: #111; }
.rc.read { font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--text); }

.toast { position: absolute; right: 12px; bottom: 6px; font-size: 11px; color: var(--text-3); display: none; }
.toast.show { display: block; }
</style>

<body>
<div id="shell" class="bw-shell">

  <div id="toolbar" class="bw-toolbar" data-bw-topbar>
    <span class="bw-toolbar-title" id="wtitle">Datapath</span>
    <div class="bw-sep"></div>
    <span id="ctl" style="display:contents">
      <button class="bw-btn ico" id="back-btn" title="Back one clock cycle (←)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"/></svg>Back</button>
      <button class="bw-btn bw-btn--primary ico" id="step-btn" title="One clock cycle (→ or Space)">Step
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></button>
    </span>
    <div class="bw-spacer"></div>
    <span id="cycles" class="bw-status">cycle 0</span>
  </div>

  <div id="main">
    <div id="top">
      <div id="ins-row" aria-label="Instruction"></div>
      <div id="fields"></div>
    </div>
    <div id="fig-wrap">
      <svg id="fig" viewBox="-0.48 -3.63 12.76 6.01" preserveAspectRatio="xMidYMid meet" aria-label="multi-cycle datapath"></svg>
      <div class="toast" id="toast">View-only · synced with presenter</div>
    </div>
    <div id="caption"><span class="st"></span><span class="tx"></span></div>
    <div id="panel">
      <div class="col-h"><span>Register file</span></div>
      <div id="regs"></div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ── Config ──────────────────────────────────────────────────────────────────
  const _qs       = new URLSearchParams(location.search);
  const CFG0      = window.WIDGET_CONFIG || {};
  let   cfg       = CFG0;
  let   WIDGET_ID = CFG0.id || CFG0.widgetId || 'datapath';
  let   role      = CFG0.role || 'presenter';
  let   IS_VIEWER = role === 'viewer' || _qs.get('viewer') === '1';

  const DEFAULT_INSTRUCTION = 'addi r8, r9, 5';

  // ── DOM ─────────────────────────────────────────────────────────────────────
  const $        = id => document.getElementById(id);
  const fig      = $('fig');
  const insRow   = $('ins-row');
  const capEl    = $('caption');
  const panel    = $('panel');
  const SVGNS    = 'http://www.w3.org/2000/svg';
  // ══════════════════════════════════════════════════════════════════════════
  //  Instructions: assembly ⇄ 32-bit words
  // ══════════════════════════════════════════════════════════════════════════

  const OPS = {
    add:  { fmt: 'R', funct: 0x20, alu: 'add' },
    sub:  { fmt: 'R', funct: 0x22, alu: 'sub' },
    and:  { fmt: 'R', funct: 0x24, alu: 'and' },
    or:   { fmt: 'R', funct: 0x25, alu: 'or'  },
    slt:  { fmt: 'R', funct: 0x2a, alu: 'slt' },
    addi: { fmt: 'I', opcode: 0x08 },
    lw:   { fmt: 'L', opcode: 0x23 },
    sw:   { fmt: 'S', opcode: 0x2b },
    beq:  { fmt: 'B', opcode: 0x04 },
    j:    { fmt: 'J', opcode: 0x02 },
  };

  // The course's 3-bit ALU codes. add and subtract are from the course table;
  // and / or / slt are placeholders until they are checked against it.
  const ALU = {
    add: { code: '001', sym: '+', f: (a, b) => (a + b) | 0 },
    sub: { code: '010', sym: '−', f: (a, b) => (a - b) | 0 },
    and: { code: '011', sym: 'AND', f: (a, b) => a & b },
    or:  { code: '100', sym: 'OR',  f: (a, b) => a | b },
    slt: { code: '101', sym: '<',   f: (a, b) => (a < b ? 1 : 0) },
  };
  const aluLabel = op => `${ALU[op].code} (${op})`;

  function parseNum(s) {
    s = String(s).trim();
    if (!/^-?(0x[0-9a-f]+|\d+)$/i.test(s)) return NaN;
    const neg = s.startsWith('-');
    const v = parseInt(neg ? s.slice(1) : s, /^-?0x/i.test(s) ? 16 : 10);
    return neg ? -v : v;
  }
  function parseReg(s) {
    const m = /^[r$](\d{1,2})$/i.exec(String(s).trim());
    if (!m || +m[1] > 31) throw new Error(`"${s}" is not a register (r0–r31)`);
    return +m[1];
  }
  function parseImm(s, lo = -32768, hi = 32767) {
    const v = parseNum(s);
    if (Number.isNaN(v)) throw new Error(`"${s}" is not a number`);
    if (v < lo || v > hi) throw new Error(`${v} does not fit in 16 bits`);
    return v;
  }

  /** "addi r8, r9, 5" → { op, rs, rt, rd, imm, target }. Throws a readable error. */
  function parseAsm(line) {
    const src = String(line).replace(/#.*$/, '').replace(/^\s*\d+\s*[.)]\s+/, '').trim();
    const m = /^([a-z]+)\s*(.*)$/i.exec(src);
    if (!m) throw new Error('empty line');
    const op = m[1].toLowerCase(), def = OPS[op];
    if (!def) throw new Error(`unknown instruction "${m[1]}"`);
    const args = m[2].split(',').map(s => s.trim()).filter(Boolean);
    const want = n => { if (args.length !== n) throw new Error(`${op} takes ${n} operand${n > 1 ? 's' : ''}`); };
    const ins = { op, rs: 0, rt: 0, rd: 0, imm: 0, target: 0 };
    switch (def.fmt) {
      case 'R': want(3); ins.rd = parseReg(args[0]); ins.rs = parseReg(args[1]); ins.rt = parseReg(args[2]); break;
      case 'I': want(3); ins.rt = parseReg(args[0]); ins.rs = parseReg(args[1]); ins.imm = parseImm(args[2]); break;
      case 'B': want(3); ins.rs = parseReg(args[0]); ins.rt = parseReg(args[1]); ins.imm = parseImm(args[2]); break;
      case 'L': case 'S': {
        want(2); ins.rt = parseReg(args[0]);
        const mm = /^(.*)\(\s*([^)]+)\s*\)$/.exec(args[1]);
        if (!mm) throw new Error(`${op} wants offset(register), e.g. 4(r0)`);
        ins.imm = mm[1].trim() === '' ? 0 : parseImm(mm[1]); ins.rs = parseReg(mm[2]); break;
      }
      case 'J': {
        want(1); const t = parseNum(args[0]);
        if (Number.isNaN(t) || t < 0 || t % 4 || t >= 2 ** 28) throw new Error('j wants a word address (a multiple of 4)');
        ins.target = t >>> 2; break;
      }
    }
    return ins;
  }

  function encode(ins) {
    const d = OPS[ins.op];
    if (d.fmt === 'R') return ((ins.rs << 21) | (ins.rt << 16) | (ins.rd << 11) | d.funct) >>> 0;
    if (d.fmt === 'J') return ((d.opcode << 26) | ins.target) >>> 0;
    return ((d.opcode << 26) | (ins.rs << 21) | (ins.rt << 16) | (ins.imm & 0xffff)) >>> 0;
  }

  /** A memory word back to an instruction, or null if it isn't one we run. */
  function decodeWord(w) {
    if (w == null) return null;
    w = w >>> 0;
    const opcode = w >>> 26, rs = (w >>> 21) & 31, rt = (w >>> 16) & 31, rd = (w >>> 11) & 31;
    const imm = (w << 16) >> 16, funct = w & 63;
    if (opcode === 0) {
      if ((w >>> 6) & 31) return null;
      const op = Object.keys(OPS).find(k => OPS[k].fmt === 'R' && OPS[k].funct === funct);
      return op ? { op, rs, rt, rd, imm, target: 0 } : null;
    }
    const op = Object.keys(OPS).find(k => OPS[k].opcode === opcode);
    if (!op) return null;
    return { op, rs, rt, rd, imm, target: w & 0x3ffffff };
  }

  function asmText(ins) {
    if (!ins) return '—';
    const r = n => 'r' + n;
    switch (OPS[ins.op].fmt) {
      case 'R': return `${ins.op} ${r(ins.rd)}, ${r(ins.rs)}, ${r(ins.rt)}`;
      case 'I': return `${ins.op} ${r(ins.rt)}, ${r(ins.rs)}, ${ins.imm}`;
      case 'B': return `${ins.op} ${r(ins.rs)}, ${r(ins.rt)}, ${ins.imm}`;
      case 'L': case 'S': return `${ins.op} ${r(ins.rt)}, ${ins.imm}(${r(ins.rs)})`;
      case 'J': return `j ${ins.target << 2}`;
    }
    return ins.op;
  }

  const bin = (v, n) => ((v >>> 0) & (2 ** n - 1)).toString(2).padStart(n, '0');

  // ══════════════════════════════════════════════════════════════════════════
  //  The control unit: one state per clock cycle
  // ══════════════════════════════════════════════════════════════════════════

  const STATE_NAME = {
    fetch: 'fetch', decode: 'decode',
    rcomp: 'execute: compute', icomp: 'execute: compute', maddr: 'execute: address',
    rwb: 'execute: write back', iwb: 'execute: write back', lwwb: 'execute: write back',
    lwread: 'execute: memory read', swwrite: 'execute: memory write',
    btarget: 'execute: branch target', bcomp: 'execute: compare',
    jump: 'execute: jump', next: 'execute: next instruction',
  };

  function pathFor(ins) {
    if (!ins) return null;
    switch (OPS[ins.op].fmt) {
      case 'R': return ['fetch', 'decode', 'rcomp', 'rwb', 'next'];
      case 'I': return ['fetch', 'decode', 'icomp', 'iwb', 'next'];
      case 'L': return ['fetch', 'decode', 'maddr', 'lwread', 'lwwb', 'next'];
      case 'S': return ['fetch', 'decode', 'maddr', 'swwrite', 'next'];
      case 'B': return ['fetch', 'decode', 'btarget', 'bcomp', 'next'];
      case 'J': return ['fetch', 'decode', 'jump'];
    }
    return null;
  }

  // ── Machine state ───────────────────────────────────────────────────────────
  // M is everything a viewer or a saved deck needs; `last` is the view of the
  // cycle just run (parts, wires, signals, value tags), recorded when it ran so
  // a viewer only ever draws it and never re-simulates.
  let M = null;
  const history = [];        // snapshots of M for Back
  const HISTORY_CAP = 300;

  const clone = o => JSON.parse(JSON.stringify(o));
  const cur   = () => decodeWord(M.mem[M.ipc]);
  const done  = () => M.k >= M.end;

  function startMachine() {
    const pc = Math.max(0, (Number(cfg.pc ?? 64) | 0) & ~3);
    const m = {
      pc, ipc: pc, regs: new Array(32).fill(0), mem: {}, code: [],
      ir: 0, a: 0, b: 0, ar: 0, mdr: 0,
      path: [], k: 0, end: 0, taken: null, cycles: 0, halt: null, last: null,
    };
    parsePairs(cfg.registers ?? 'r9=10', /[r$](\d{1,2})\s*=\s*(-?(?:0x[0-9a-f]+|\d+))/gi)
      .forEach(([r, v]) => { if (r > 0 && r < 32) m.regs[r] = v | 0; });
    parsePairs(cfg.memory ?? '4=0', /(0x[0-9a-f]+|\d+)\s*=\s*(-?(?:0x[0-9a-f]+|\d+))/gi)
      .forEach(([a, v]) => { if (a % 4 === 0) m.mem[a] = v | 0; });
    M = m;
    let ins = null;
    try { ins = parseAsm(String(cfg.instruction || '').trim() || DEFAULT_INSTRUCTION); }
    catch (_) { ins = parseAsm(DEFAULT_INSTRUCTION); }
    place(ins);
  }

  function parsePairs(text, re) {
    const out = [];
    let m;
    re.lastIndex = 0;
    while ((m = re.exec(String(text)))) out.push([parseNum(m[1]), parseNum(m[2])]);
    return out;
  }

  /** Put an instruction into memory at the PC and get ready to fetch it. */
  function place(ins) {
    M.mem[M.pc] = encode(ins) | 0;
    if (!M.code.includes(M.pc)) M.code.push(M.pc);
    beginInstruction();
  }

  function beginInstruction() {
    M.ipc = M.pc; M.k = 0; M.taken = null; M.last = null; M.halt = null;
    const path = pathFor(cur());
    if (!path) {
      M.path = []; M.end = 0;
      M.halt = M.mem[M.pc] == null ? `There is no instruction at address ${M.pc} yet: type one above.`
                                    : `The word at address ${M.pc} is not an instruction this processor runs.`;
      return;
    }
    M.path = path; M.end = path.length;
  }
  // ── One clock cycle ─────────────────────────────────────────────────────────
  const sext = v => (v << 16) >> 16;
  const setReg = (r, v) => { if (r !== 0) M.regs[r] = v | 0; };

  function execute(id) {
    const ins = cur(), I = ins, R = n => 'r' + n;
    const v = { id, on: [], sig: {}, tags: [], read: [], wrote: [], mread: null, mwrite: null, text: '' };
    const tag = (spot, t) => v.tags.push([spot, String(t)]);
    const imm = sext(M.ir & 0xffff);

    switch (id) {
      case 'fetch': {
        M.ir = (M.mem[M.pc] ?? 0) | 0;
        v.on = ['pc', 'iord', 'mem', 'ir', 'pc-iord', 'iord-mem', 'mem-ir'];
        v.sig = { IorD: 0, MemR: 1, IRW: 1 };
        v.mread = M.pc;
        tag('pc', M.pc);
        v.text = `Memory reads the instruction at address ${M.pc} into the <code>IR</code>.`;
        break;
      }
      case 'decode': {
        M.a = M.regs[I.rs]; M.b = M.regs[I.rt];
        const fmt = OPS[I.op].fmt, usesB = fmt === 'R' || fmt === 'S' || fmt === 'B';
        const usesImm = fmt === 'I' || fmt === 'L' || fmt === 'S' || fmt === 'B';
        v.on = ['ir', 'control', 'regs', 'a', 'b', 'ir-control', 'ir-rr1', 'ir-rr2', 'rd1-a', 'rd2-b'];
        if (usesImm) v.on.push('signext', 'ir-ext');
        v.read = fmt === 'J' ? [] : usesB ? [I.rs, I.rt] : [I.rs];
        tag('op', bin(M.ir >>> 26, 6));
        if (fmt !== 'J') { tag('rr1', I.rs); tag('a', M.a); }
        if (usesB) { tag('rr2', I.rt); tag('b', M.b); }
        if (usesImm) tag('ext', imm);
        const opc = `<code>${bin(M.ir >>> 26, 6)}</code> (${fmt === 'R' ? 'R-type; the funct field says ' + I.op : I.op})`;
        v.text = fmt === 'J'
          ? `The control unit reads the opcode, ${opc}. The registers are read too, but j does not use them.`
          : `The control unit reads the opcode, ${opc}, and the registers are read: <code>A</code> gets ${R(I.rs)} = ${M.a}` +
            (usesB ? `, <code>B</code> gets ${R(I.rt)} = ${M.b}.` : '.');
        break;
      }
      case 'rcomp': {
        const op = OPS[I.op].alu;
        M.ar = ALU[op].f(M.a, M.b);
        v.on = ['a', 'b', 'srca', 'srcb', 'alu', 'aluout', 'a-srca', 'b-srcb', 'srca-alu', 'srcb-alu', 'alu-ar'];
        v.sig = { SrcA: 1, SrcB: 0, ALUOp: aluLabel(op) };
        tag('a', M.a); tag('b', M.b); tag('ar', M.ar);
        v.text = op === 'slt'
          ? `The ALU checks whether <code>A</code> &lt; <code>B</code>: ${M.a} &lt; ${M.b} is ${M.ar ? 'true' : 'false'}, so <code>AR</code> gets ${M.ar}.`
          : `The ALU computes <code>A</code> ${ALU[op].sym} <code>B</code> = ${M.a} ${ALU[op].sym} ${M.b} = ${M.ar}, kept in <code>AR</code>.`;
        break;
      }
      case 'rwb': {
        setReg(I.rd, M.ar);
        v.on = ['ir', 'regdst', 'aluout', 'memtoreg', 'regs', 'ir-regdst1', 'regdst-wr', 'ar-mtor', 'mtor-wd'];
        v.sig = { RegDst: 1, MtoR: 0, RegW: 1 };
        v.wrote = [I.rd];
        tag('wr', I.rd); tag('ar', M.ar);
        v.text = `The result, ${M.ar}, is written to ${R(I.rd)}` + (I.rd === 0 ? ' (r0 always stays 0).' : '.');
        break;
      }
      case 'icomp': case 'maddr': {
        M.ar = (M.a + imm) | 0;
        v.on = ['ir', 'a', 'signext', 'srca', 'srcb', 'alu', 'aluout', 'ir-ext', 'a-srca', 'ext-srcb', 'srca-alu', 'srcb-alu', 'alu-ar'];
        v.sig = { SrcA: 1, SrcB: 2, ALUOp: aluLabel('add') };
        tag('a', M.a); tag('ext', imm); tag('ar', M.ar);
        v.text = id === 'icomp'
          ? `The ALU adds the constant to <code>A</code>: ${M.a} + ${imm} = ${M.ar}, kept in <code>AR</code>.`
          : `The ALU adds the offset to <code>A</code> to get the address: ${M.a} + ${imm} = ${M.ar}.`;
        break;
      }
      case 'iwb': {
        setReg(I.rt, M.ar);
        v.on = ['ir', 'regdst', 'aluout', 'memtoreg', 'regs', 'ir-regdst0', 'regdst-wr', 'ar-mtor', 'mtor-wd'];
        v.sig = { RegDst: 0, MtoR: 0, RegW: 1 };
        v.wrote = [I.rt];
        tag('wr', I.rt); tag('ar', M.ar);
        v.text = `The result, ${M.ar}, is written to ${R(I.rt)}` + (I.rt === 0 ? ' (r0 always stays 0).' : '.');
        break;
      }
      case 'lwread': {
        if (M.ar & 3) return haltAt(`Address ${M.ar} is not a multiple of 4, so there is no word there.`);
        M.mdr = (M.mem[M.ar] ?? 0) | 0;
        v.on = ['aluout', 'iord', 'mem', 'mdr', 'ar-iord', 'iord-mem', 'mem-mdr'];
        v.sig = { IorD: 1, MemR: 1 };
        v.mread = M.ar;
        tag('ar', M.ar); tag('mdr', M.mdr);
        v.text = `Memory reads the word at address ${M.ar} into the <code>MDR</code>: ${M.mdr}.`;
        break;
      }
      case 'lwwb': {
        setReg(I.rt, M.mdr);
        v.on = ['ir', 'regdst', 'mdr', 'memtoreg', 'regs', 'ir-regdst0', 'regdst-wr', 'mdr-mtor', 'mtor-wd'];
        v.sig = { RegDst: 0, MtoR: 1, RegW: 1 };
        v.wrote = [I.rt];
        tag('wr', I.rt); tag('mdr', M.mdr);
        v.text = `The word, ${M.mdr}, is written to ${R(I.rt)}` + (I.rt === 0 ? ' (r0 always stays 0).' : '.');
        break;
      }
      case 'swwrite': {
        if (M.ar & 3) return haltAt(`Address ${M.ar} is not a multiple of 4, so there is no word there.`);
        M.mem[M.ar] = M.b | 0;
        M.code = M.code.filter(a => a !== M.ar);
        v.on = ['aluout', 'b', 'iord', 'mem', 'ar-iord', 'iord-mem', 'b-mem'];
        v.sig = { IorD: 1, MemW: 1 };
        v.mwrite = M.ar;
        tag('ar', M.ar); tag('b', M.b);
        v.text = `Memory stores <code>B</code> = ${M.b} at address ${M.ar}.`;
        break;
      }
      case 'btarget': {
        M.ar = (M.pc + (imm << 2)) | 0;
        v.on = ['pc', 'ir', 'signext', 'shift', 'srca', 'srcb', 'alu', 'aluout', 'pc-srca', 'ir-ext', 'ext-shift',
                'shift-srcb', 'srca-alu', 'srcb-alu', 'alu-ar'];
        v.sig = { SrcA: 0, SrcB: 3, ALUOp: aluLabel('add') };
        tag('pc', M.pc); tag('ext', imm); tag('sh', imm << 2); tag('ar', M.ar);
        v.text = `The ALU works out where to branch: <code>PC</code> + ${imm} × 4 = ${M.pc} + ${imm << 2} = ${M.ar}, kept in <code>AR</code>.`;
        break;
      }
      case 'bcomp': {
        const diff = ALU.sub.f(M.a, M.b), zero = diff === 0 ? 1 : 0;
        M.taken = !!zero;
        v.on = ['a', 'b', 'srca', 'srcb', 'alu', 'pcsrc', 'pcwrite', 'a-srca', 'b-srcb', 'srca-alu', 'srcb-alu',
                'zero', 'aluout', 'ar-pcsrc'];
        v.sig = { SrcA: 1, SrcB: 0, ALUOp: aluLabel('sub'), PCWC: 1, PCSrc: 1 };
        tag('a', M.a); tag('b', M.b); tag('zero', zero); tag('ar', M.ar);
        if (zero) {
          M.pc = M.ar; M.end = M.k + 1;
          v.on.push('pc', 'pcsrc-pc');
          v.text = `The ALU compares: ${M.a} − ${M.b} = 0, so <code>zero</code> = 1 and the <code>PC</code> is loaded with ${M.ar}. The branch is taken; next is fetch.`;
        } else {
          v.text = `The ALU compares: ${M.a} − ${M.b} = ${diff}, so <code>zero</code> = 0 and the <code>PC</code> is not loaded. The branch is not taken.`;
        }
        break;
      }
      case 'jump': {
        const target = ((M.pc & 0xf0000000) | ((M.ir & 0x3ffffff) << 2)) | 0;
        M.pc = target;
        v.on = ['ir', 'jump', 'pcsrc', 'pc', 'pcwrite', 'ir-jump', 'jump-pcsrc', 'pcsrc-pc'];
        v.sig = { PCW: 1, PCSrc: 2 };
        tag('jump', target);
        v.text = `The <code>PC</code> is loaded with the jump address, <code>IR[25:0]</code> &lt;&lt; 2 = ${target}. Next is fetch.`;
        break;
      }
      case 'next': {
        const old = M.pc;
        M.pc = (M.pc + 4) | 0;
        v.on = ['pc', 'pcwrite', 'srca', 'srcb', 'alu', 'pcsrc', 'pc-srca', 'four-srcb', 'srca-alu', 'srcb-alu',
                'alu-pcsrc', 'pcsrc-pc'];
        v.sig = { SrcA: 0, SrcB: 1, ALUOp: aluLabel('add'), PCSrc: 0, PCW: 1 };
        tag('pc', old); tag('alu', M.pc);
        v.text = `The <code>PC</code> moves on to the next word: ${old} + 4 = ${M.pc}.`;
        break;
      }
    }
    M.last = v; M.k++; M.cycles++;
    return true;
  }

  function haltAt(msg) { M.halt = msg; M.end = M.k; return false; }

  // ── Actions ─────────────────────────────────────────────────────────────────
  // After an instruction finishes, Step carries on only if the word now at the
  // PC is an instruction (after j 64, say); otherwise the next one is typed.
  function canStep() {
    if (!M || M.halt) return false;
    return !done() || !!pathFor(decodeWord(M.mem[M.pc]));
  }

  function pushHistory() {
    history.push(clone(M));
    if (history.length > HISTORY_CAP) history.shift();
  }

  /** One clock cycle. Returns false when there is nothing to do. */
  function stepOnce() {
    if (!canStep()) return false;
    pushHistory();
    if (done()) {                         // on to the instruction now at the PC
      beginInstruction();
      if (M.halt) return true;
    }
    execute(M.path[M.k]);
    return true;
  }

  function step() {
    if (IS_VIEWER) return false;
    const ok = stepOnce();
    if (ok) { animateNext = true; changed(); }
    return ok;
  }

  function back() {
    if (IS_VIEWER || !history.length) return false;
    M = history.pop();
    changed();
    return true;
  }

  function reset() {
    if (IS_VIEWER) return;
    history.length = 0;
    startMachine();
    changed();
  }

  /** A newly chosen instruction, placed at the PC; it starts again from fetch.
   *  Half-way through one, the new one replaces it where it began. */
  function loadIns(ins) {
    if (IS_VIEWER) return;
    pushHistory();
    if (M.k > 0 && !done()) M.pc = M.ipc;
    place(ins);
    changed();
  }

  function changed() { render(); emitState(); }

  // ── Drawing helpers ─────────────────────────────────────────────────────────
  const P = ([x, y]) => [x, -y];
  function el(tag, attrs, parent) {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;

  // Colours are resolved once per draw from the deck's tokens, then written
  // as plain attributes: an SVG styled through CSS variables loses them when
  // the notes export rasterises it.
  let INK = null;
  function inks() {
    const probe = document.createElement('span');
    probe.style.display = 'none';
    document.body.appendChild(probe);
    const read = (v, fb) => { probe.style.color = fb; probe.style.color = v; return getComputedStyle(probe).color || fb; };
    const cs = getComputedStyle(document.documentElement);
    const font = (k, fb) => (cs.getPropertyValue(k) || '').trim() || fb;
    const out = {
      ink:   read('var(--text)', '#111'),
      bg:    read('var(--bg)', '#fff'),
      faint: read('var(--sn-faint)', '#dbdbdb'),
      lbl:   read('color-mix(in srgb, var(--text) 65%, var(--bg))', '#595959'),
      hl:    '#f8c445', onHl: '#111111',
      sans:  font('--font-ui', 'sans-serif'), mono: font('--font-mono', 'monospace'),
    };
    probe.remove();
    return out;
  }

  /** A Stealth-like tip at the end of a polyline, and the line shortened to meet it. */
  function arrowTip(pts, L, W) {
    const n = pts.length, [x2, y2] = pts[n - 1], [x1, y1] = pts[n - 2];
    const len = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / len, uy = (y2 - y1) / len;
    const bx = x2 - ux * L, by = y2 - uy * L, nx = -uy * W / 2, ny = ux * W / 2;
    const ix = x2 - ux * L * 0.72, iy = y2 - uy * L * 0.72;
    const short = pts.slice(); short[n - 1] = [x2 - ux * L * 0.6, y2 - uy * L * 0.6];
    return { line: short, tip: polyD([[x2, y2], [bx + nx, by + ny], [ix, iy], [bx - nx, by - ny]]) + 'Z' };
  }
  const polyD = pts => pts.map((p, i) => (i ? 'L' : 'M') + P(p).join(' ')).join('');
  const flipD = d => d.replace(/(-?[\d.]+) (-?[\d.]+)/g, (_, x, y) => `${x} ${-y}`);

  function text(parent, x, y, s, anchor, size, mono, color, weight) {
    const a = { e: 'end', w: 'start', n: 'middle', s: 'middle', c: 'middle', nw: 'start' }[anchor] || 'middle';
    const dy = anchor === 'n' || anchor === 'nw' ? '0.78em' : anchor === 's' ? '-0.22em' : '0.34em';
    const t = el('text', {
      x, y: -y, dy, 'text-anchor': a, 'font-size': size.toFixed(4),
      'font-family': mono ? INK.mono : INK.sans, fill: color, 'font-weight': weight,
    }, parent);
    t.textContent = s;
    return t;
  }

  // ── Draw ────────────────────────────────────────────────────────────────────
  function drawFigure(view, animate = false) {
    INK = inks();
    stopAnim();
    animate = animate && MOTION;
    const on = new Set(view.on);
    const isOn = keys => [].concat(keys).some(k => on.has(k));
    fig.textContent = '';
    const defs = el('defs', {}, fig);
    const glow = el('filter', { id: 'dp-glow', x: '-200%', y: '-200%', width: '500%', height: '500%' }, defs);
    el('feGaussianBlur', { stdDeviation: 0.025 }, glow);
    const g = el('g', {}, fig);
    const lit = [];                       // active wires: what the pulse and the particles run along

    // Wires, faded ones first, so an active wire is never painted over where
    // it shares a stretch with a faded one. An active wire is an ink line on a
    // highlighter band, as in the circuit simulator; while it animates, its
    // faded line shows where the pulse has not reached yet.
    for (const pass of [0, 1]) {
      for (const [k, pts, arrow] of WIRES) {
        const active = on.has(k);
        if (pass === 0 && active && !animate) continue;
        if (pass === 1 && !active) continue;
        const col = pass ? INK.ink : INK.faint;
        const line = arrow === false ? pts : arrowTip(pts, 2.6 * PT, 2.2 * PT).line;
        const d = polyD(line);
        let band = null;
        if (pass) band = el('path', { d, fill: 'none', stroke: INK.hl, 'stroke-width': SZ.wire * 3.4,
                                       'stroke-linejoin': 'round', 'stroke-linecap': 'round', pathLength: 1 }, g);
        const ln = el('path', { d, fill: 'none', stroke: col, 'stroke-width': SZ.wire, pathLength: 1,
                                'stroke-linejoin': arrow === false ? 'miter' : null }, g);
        const tip = arrow === false ? null : el('path', { d: arrowTip(pts, 2.6 * PT, 2.2 * PT).tip, fill: col }, g);
        if (pass) lit.push({ key: k, pts, band, ln, tip, flows: arrow !== false });
      }
      for (const [keys, at] of DOTS) {
        if (isOn(keys) !== !!pass) continue;
        const [cx, cy] = P(at);
        el('circle', { cx, cy, r: 1.1 * PT, fill: pass ? INK.ink : INK.faint }, g);
      }
    }
    for (const [k, x, y, s, an] of LABELS.slice(0, 3)) text(g, x + (an === 'w' ? 0.02 : an === 'e' ? -0.02 : 0), y, s, an, SZ.lbl, true, on.has(k) ? INK.lbl : INK.faint);

    // Parts
    const part = (k, shape, attrs) => el(shape, Object.assign({
      fill: on.has(k) ? INK.hl : INK.bg, stroke: on.has(k) ? INK.ink : INK.faint,
      'stroke-width': SZ.part, 'stroke-linejoin': 'round',
    }, attrs), g);
    const nameCol = k => on.has(k) ? INK.onHl : INK.faint;

    // control unit and its state register
    part('control', 'rect', { x: -0.4, y: -CU_TOP, width: 12.6, height: CU_TOP - 2.85, rx: 2 * PT });
    text(g, 5.9, 3.33, 'control unit', 'c', SZ.name, false, nameCol('control'));
    part('state', 'rect', { x: 11.3, y: -3.47, width: 0.55, height: 0.26, rx: PT });
    text(g, 11.575, 3.34, 'SR', 'c', SZ.name * 0.9, true, nameCol('state'));

    // PC write logic: AND (zero, PCWC), then OR (with PCW)
    part('pcwrite', 'path', { d: flipD('M0.17 2.21L0.53 2.21L0.53 2.05') + 'A0.18 0.18 0 0 1 0.17 -2.05Z' });
    part('pcwrite', 'path', { d: flipD('M0.47 1.61C0.6 1.53 0.7 1.53 0.83 1.61C0.83 1.45 0.75 1.3 0.65 1.25C0.55 1.3 0.47 1.45 0.47 1.61Z') });

    for (const [k, a, b, s, at, mono] of BOXES) {
      part(k, 'rect', { x: a[0], y: -b[1], width: b[0] - a[0], height: b[1] - a[1], rx: 1.5 * PT });
      const c = at || [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      text(g, c[0], c[1], s, 'c', SZ.name, mono, nameCol(k));
    }
    for (const [k, x, y, h, nums] of MUXES) {
      part(k, 'polygon', { points: [[x - 0.17, y + h], [x + 0.17, y + h - 0.1], [x + 0.17, y - h + 0.1], [x - 0.17, y - h]].map(p => P(p).join(',')).join(' ') });
      for (const [nx, ny, n] of nums) text(g, nx, ny, String(n), 'c', SZ.num, true, on.has(k) ? INK.lbl : INK.faint);
    }
    part('alu', 'polygon', { points: [[9.6, 1.05], [10.4, 0.55], [10.4, -0.25], [9.6, -0.75], [9.6, -0.05], [9.72, 0.15], [9.6, 0.35]].map(p => P(p).join(',')).join(' ') });
    text(g, 10.05, 0.15, 'ALU', 'c', SZ.name, true, nameCol('alu'));

    for (const [k, x, y, s, an, sz] of LABELS.slice(3)) {
      text(g, x + (an === 'w' ? 0.02 : -0.02), y, s, an, SZ[sz], true, on.has(k) ? INK.lbl : INK.faint);
    }

    // Control signals: faded first, then the ones in use with their values,
    // each value label on a backing so it reads over a faded neighbour.
    const sigs = view.sig || {};
    const sigValues = [];
    for (const pass of [0, 1]) {
      for (const [name, x, yEnd, nudge] of SIGNALS) {
        const active = name in sigs;
        if (active !== !!pass) continue;
        const col = active ? INK.ink : INK.faint;
        const t = arrowTip([[x, 2.85], [x, yEnd]], 3.2 * PT, 2.6 * PT);
        const band = active ? el('path', { d: polyD(t.line), stroke: INK.hl, 'stroke-width': SZ.wire * 3.4, fill: 'none', pathLength: 1 }, g) : null;
        el('path', { d: polyD(t.line), stroke: col, 'stroke-width': SZ.sig, 'stroke-dasharray': `${3 * PT} ${3 * PT}`, fill: 'none' }, g);
        el('path', { d: t.tip, fill: col }, g);
        if (band) lit.push({ key: name, pts: [[x, 2.85], [x, yEnd]], band, ln: null, tip: null, flows: false, signal: true });
        // the name, inside the unit; on the yellow unit (decode) it keeps ink
        const nameInk = active || on.has('control') ? (on.has('control') ? INK.onHl : INK.ink) : INK.faint;
        text(g, x + nudge, 3.0, name, 'c', SZ.lbl, true, nameInk, active ? 700 : null);
        if (active) sigValues.push([x, String(sigs[name])]);
      }
    }
    // values on the lines, drawn after every line so none is painted over
    for (const [x, v] of sigValues) {
      const box = el('rect', { fill: INK.bg, stroke: INK.ink, 'stroke-width': SZ.tagLine, rx: PT, ry: PT }, g);
      const t = text(g, 0, 0, v, 'c', SZ.lbl, true, INK.ink, 700);
      const { w, h } = measure(t, v, SZ.lbl);
      const bw = w + 2 * PT, bh = h * 0.9 + PT, cy = 2.62;
      box.setAttribute('x', x - bw / 2); box.setAttribute('y', -cy - bh / 2);
      box.setAttribute('width', bw); box.setAttribute('height', bh);
      t.setAttribute('x', x); t.setAttribute('y', -cy); t.setAttribute('dy', '0.35em');
    }

    // Pulses and particles ride above the wires but under the value tags.
    const fx = el('g', { 'pointer-events': 'none' }, g);

    // Value tags
    const tagG = el('g', {}, g);
    if (cfg.showValues !== false) {
      for (const [spot, s] of view.tags || []) {
        const sp = SPOTS[spot];
        if (!sp) continue;
        const box = el('rect', { fill: INK.bg, stroke: INK.ink, 'stroke-width': SZ.tagLine, rx: PT, ry: PT }, tagG);
        const t = text(tagG, 0, 0, s, 'c', SZ.tag, true, INK.ink, 700);
        placeTag(box, t, sp, s);
      }
    }

    startAnim(lit, fx, tagG, animate);
  }

  // ══════════════════════════════════════════════════════════════════════════
  //  Signal animation, after the circuit simulator
  // ══════════════════════════════════════════════════════════════════════════
  // On a step, the cycle's values travel the datapath: each active wire's
  // highlighter is painted from its source end by a glowing pulse, in the
  // order the signal actually flows (a wire leaving a mux, the ALU, memory or
  // the register file waits for the wires going in; registers that are
  // clocked — PC, IR, MDR, A, B, AR — send their stored value at once). The
  // value tags appear when the pulses land. After that, small dots keep
  // drifting along the active wires.

  const MOTION = !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const HOP_MS = 420;                                  // one stage of the pulse
  const CLOCKED = new Set(['pc', 'ir', 'mdr', 'a', 'b', 'aluout']);

  // Where each part sits, to tell which part a wire leaves and which it enters.
  const PART_BOXES = (() => {
    const out = BOXES.map(([k, a, b]) => [k, a[0], a[1], b[0], b[1]]);
    for (const [k, x, y, h] of MUXES) out.push([k, x - 0.17, y - h, x + 0.17, y + h]);
    out.push(['alu', 9.6, -0.75, 10.4, 1.05], ['pcwrite', 0.17, 1.87, 0.53, 2.21],
             ['pcwrite', 0.47, 1.25, 0.83, 1.61], ['control', -0.4, 2.85, 12.2, CU_TOP]);
    return out;
  })();
  function partAt([x, y]) {
    const e = 0.035;
    const hit = PART_BOXES.find(([, x1, y1, x2, y2]) => x >= x1 - e && x <= x2 + e && y >= y1 - e && y <= y2 + e);
    return hit ? hit[0] : null;
  }

  /** The stage at which each lit wire starts, by following the flow. */
  function stages(lit) {
    const near = (p, q) => Math.abs(p[0] - q[0]) < 0.01 && Math.abs(p[1] - q[1]) < 0.01;
    const wires = lit.filter(w => !w.signal);
    for (const w of wires) { w.from = partAt(w.pts[0]); w.to = partAt(w.pts[w.pts.length - 1]); w.stage = null; }
    const stageOf = (w, seen) => {
      if (w.stage != null) return w.stage;
      if (seen.has(w)) return 0;
      seen.add(w);
      let st = 0;
      for (const u of wires) {
        if (u === w) continue;
        const feeds = (w.from && !CLOCKED.has(w.from) && u.to === w.from) ||
                      (!w.from && near(u.pts[u.pts.length - 1], w.pts[0]));
        if (feeds) st = Math.max(st, stageOf(u, seen) + 1);
      }
      return (w.stage = st);
    };
    for (const w of wires) stageOf(w, new Set());
    for (const w of lit) if (w.signal) w.stage = 0;
    return Math.max(0, ...lit.map(w => w.stage)) + 1;
  }

  let animRaf = 0;
  function stopAnim() { cancelAnimationFrame(animRaf); animRaf = 0; }

  function startAnim(lit, fx, tagG, animate) {
    const printing = !!cfg.printMode || document.documentElement.classList.contains('bw-printing');
    for (const w of lit) {
      try { w.len = (w.ln || w.band).getTotalLength(); } catch (_) { w.len = 0; }
      w.geom = w.ln || w.band;
    }
    const nStages = stages(lit);
    const total = nStages * HOP_MS;
    const t0 = performance.now();
    if (animate) {
      tagG.style.opacity = '0';
      for (const w of lit) {
        w.band.setAttribute('stroke-dasharray', '0 1');
        if (w.ln) w.ln.setAttribute('stroke-dasharray', '0 1');
        if (w.tip) w.tip.style.opacity = '0';
        if (w.flows || w.signal) {
          w.head = el('circle', { r: 0.034, fill: INK.hl, filter: 'url(#dp-glow)', opacity: 0 }, fx);
          w.core = el('circle', { r: 0.016, fill: INK.ink, opacity: 0 }, fx);
        }
      }
    }
    if (printing || (!animate && !MOTION)) return;

    // Particles: a dot every ~0.55 units along each flowing wire.
    const dots = [];
    for (const w of lit) {
      if (!w.flows || !w.len) continue;
      const n = Math.max(1, Math.round(w.len / 0.55));
      for (let i = 0; i < n; i++) dots.push({ w, off: i / n, c: el('circle', { r: 0.017, fill: INK.hl, opacity: 0 }, fx) });
    }

    const frame = now => {
      const el_ = now - t0;
      let settled = !animate || el_ >= total;
      if (animate) {
        for (const w of lit) {
          const f = Math.max(0, Math.min(1, (el_ - w.stage * HOP_MS) / HOP_MS));
          const eased = f * f * (3 - 2 * f);
          const dash = f >= 1 ? 'none' : `${eased} ${1 - eased + 0.001}`;
          w.band.setAttribute('stroke-dasharray', dash);
          if (w.ln) w.ln.setAttribute('stroke-dasharray', dash);
          if (w.tip) w.tip.style.opacity = f >= 1 ? '1' : '0';
          if (w.head) {
            const show = f > 0 && f < 1;
            w.head.setAttribute('opacity', show ? 0.9 : 0);
            w.core.setAttribute('opacity', show ? 1 : 0);
            if (show) {
              const pt = w.geom.getPointAtLength(eased * w.len);
              w.head.setAttribute('cx', pt.x); w.head.setAttribute('cy', pt.y);
              w.core.setAttribute('cx', pt.x); w.core.setAttribute('cy', pt.y);
            }
          }
        }
        if (settled) { tagG.style.transition = 'opacity .25s'; tagG.style.opacity = '1'; animate = false; }
      }
      if (settled && MOTION) {
        // Drift at a steady speed, so a long wire carries more dots, not faster ones.
        const pos = now / 1000 * 0.45;
        for (const d of dots) {
          const u = ((pos / d.w.len) + d.off) % 1;
          const pt = d.w.geom.getPointAtLength(u * d.w.len);
          d.c.setAttribute('cx', pt.x); d.c.setAttribute('cy', pt.y);
          d.c.setAttribute('opacity', 1);
        }
      }
      if (!dots.length && settled) { animRaf = 0; return; }
      animRaf = requestAnimationFrame(frame);
    };
    animRaf = requestAnimationFrame(frame);
  }

  function measure(t, s, size) {
    let w = 0, h = 0;
    try { const bb = t.getBBox(); w = bb.width; h = bb.height; } catch (_) { /* not laid out */ }
    if (!w) { w = s.length * size * 0.53; h = size * 1.15; }
    return { w, h: Math.max(h, size * 1.05) };
  }
  function fitBox(rect, t, padX, padY) {
    let bb;
    try { bb = t.getBBox(); } catch (_) { bb = null; }
    if (!bb || !bb.width) { rect.remove(); return; }
    rect.setAttribute('x', bb.x - padX); rect.setAttribute('y', bb.y - padY);
    rect.setAttribute('width', bb.width + 2 * padX); rect.setAttribute('height', bb.height + 2 * padY);
  }
  function placeTag(box, t, [x, y, an], s) {
    const pad = 1 * PT;
    const { w, h } = measure(t, s, SZ.tag);
    const bw = w + 2 * pad, bh = h * 0.92 + 2 * pad * 0.6;
    let cx = x, cy = y;                         // tikz coords of the box centre
    if (an === 'n') cy = y - bh / 2;
    if (an === 's') cy = y + bh / 2;
    if (an === 'e') cx = x - bw / 2;
    if (an === 'w') cx = x + bw / 2;
    box.setAttribute('x', cx - bw / 2); box.setAttribute('y', -cy - bh / 2);
    box.setAttribute('width', bw); box.setAttribute('height', bh);
    t.setAttribute('x', cx); t.setAttribute('y', -cy); t.setAttribute('dy', '0.35em');
  }

  // ══════════════════════════════════════════════════════════════════════════
  //  Render
  // ══════════════════════════════════════════════════════════════════════════

  function currentView() {
    if (M.last) return M.last;
    // Before the first cycle: the instruction in memory, the PC pointing at it.
    const ins = cur();
    return {
      on: ['pc', 'mem', 'regs'], sig: {},
      tags: ins ? [['pc', M.pc], ['mem', `${M.pc}: ${ins.op}`]] : [['pc', M.pc]],
      read: [], wrote: [], mread: null, mwrite: null,
    };
  }

  // The line under the figure is only for when the machine has to stop (an
  // address that is not a word, say); a normal step needs no words.
  function renderCaption() {
    const st = capEl.querySelector('.st'), tx = capEl.querySelector('.tx');
    const stopped = M.halt && (!M.last || M.k === M.end);
    capEl.style.display = stopped ? '' : 'none';
    capEl.classList.toggle('err', !!stopped);
    st.textContent = '';
    tx.innerHTML = stopped ? escHtml(M.halt) : '';
  }

  function fieldBox(label, bits, meaning) {
    const f = document.createElement('div'); f.className = 'fld w' + bits.length;
    // No line of meanings under the bits: the dropdowns above already say it.
    f.innerHTML = `<span class="t">${escHtml(label)}</span><span class="b">${bits}</span>`;
    return f;
  }

  function renderFields(ins) {
    const fields = $('fields');
    fields.textContent = '';
    if (!ins) return;
    const w = encode(ins), fmt = OPS[ins.op].fmt, r = n => `<code>r${n}</code>`;
    fields.appendChild(fieldBox('IR[31:26]', bin(w >>> 26, 6), fmt === 'R' ? 'R-type' : ins.op));
    if (fmt === 'J') { fields.appendChild(fieldBox('IR[25:0]', bin(w, 26), `${ins.target} (× 4 = ${ins.target << 2})`)); return; }
    fields.appendChild(fieldBox('IR[25:21]', bin(w >>> 21, 5), r(ins.rs)));
    fields.appendChild(fieldBox('IR[20:16]', bin(w >>> 16, 5), r(ins.rt)));
    fields.appendChild(fieldBox('IR[15:0]', bin(w, 16),
      fmt === 'R' ? `${r(ins.rd)}, ${ins.op}` : String(ins.imm)));
  }

  // ── The instruction line ────────────────────────────────────────────────────
  // Built from dropdowns, so it is always a valid instruction: the operation,
  // then each operand. Any change goes into memory at the PC straight away.
  const OP_ORDER = ['addi', 'add', 'sub', 'and', 'or', 'slt', 'lw', 'sw', 'beq', 'j'];
  const range = (a, b, st = 1) => { const o = []; for (let v = a; v <= b; v += st) o.push(v); return o; };
  const REG_OPTS = range(0, 31);
  // Value lists per operand kind; the current value is always added if missing.
  const IMM_OPTS = { imm: range(-32, 32), off: range(-32, 64, 4), br: range(-8, 8), tgt: range(0, 256, 4) };

  function operandsOf(ins) {
    switch (OPS[ins.op].fmt) {
      case 'R': return [['rd', 'reg'], ', ', ['rs', 'reg'], ', ', ['rt', 'reg']];
      case 'I': return [['rt', 'reg'], ', ', ['rs', 'reg'], ', ', ['imm', 'imm']];
      case 'B': return [['rs', 'reg'], ', ', ['rt', 'reg'], ', ', ['imm', 'br']];
      case 'L': case 'S': return [['rt', 'reg'], ', ', ['imm', 'off'], '(', ['rs', 'reg'], ')'];
      case 'J': return [['target', 'tgt']];
    }
    return [];
  }

  function makeSelect(values, cur, label, fmt) {
    const sel = document.createElement('select');
    const vals = values.includes(cur) ? values : values.concat([cur]).sort((a, b) => a - b);
    for (const v of vals) {
      const o = document.createElement('option');
      o.value = String(v); o.textContent = fmt ? fmt(v) : String(v);
      if (v === cur) o.selected = true;
      sel.appendChild(o);
    }
    sel.setAttribute('aria-label', label);
    sel.disabled = IS_VIEWER;
    return sel;
  }

  /** Switching operation keeps the registers and number already chosen where they fit. */
  function withOp(ins, op) {
    const n = { ...ins, op };
    const fmt = OPS[op].fmt;
    if (fmt === 'L' || fmt === 'S') n.imm = Math.max(-32, Math.min(64, Math.round(n.imm / 4) * 4));
    if (fmt === 'B') n.imm = Math.max(-8, Math.min(8, n.imm));
    if (fmt === 'J' && OPS[ins.op].fmt !== 'J') n.target = M.pc >>> 2;
    return n;
  }

  function renderInstructionLine() {
    const ins = cur() || parseAsm(DEFAULT_INSTRUCTION);
    insRow.textContent = '';
    const opSel = makeSelect(OP_ORDER.map((_, i) => i), OP_ORDER.indexOf(ins.op), 'operation', i => OP_ORDER[i]);
    opSel.classList.add('op');
    opSel.addEventListener('change', () => loadIns(withOp(ins, OP_ORDER[+opSel.value])));
    insRow.appendChild(opSel);
    insRow.appendChild(Object.assign(document.createElement('span'), { className: 'p', textContent: ' ' }));
    for (const part of operandsOf(ins)) {
      if (typeof part === 'string') {
        insRow.appendChild(Object.assign(document.createElement('span'), { className: 'p', textContent: part }));
        continue;
      }
      const [key, kind] = part;
      let sel;
      if (kind === 'reg') {
        sel = makeSelect(REG_OPTS, ins[key], key, v => 'r' + v);
        sel.addEventListener('change', () => loadIns({ ...ins, [key]: +sel.value }));
      } else if (kind === 'tgt') {
        sel = makeSelect(IMM_OPTS.tgt, ins.target << 2, 'jump address');
        sel.addEventListener('change', () => loadIns({ ...ins, target: +sel.value >>> 2 }));
      } else {
        sel = makeSelect(IMM_OPTS[kind], ins.imm, kind === 'br' ? 'branch offset' : kind === 'off' ? 'offset' : 'constant');
        sel.addEventListener('change', () => loadIns({ ...ins, imm: +sel.value }));
      }
      insRow.appendChild(sel);
    }
    renderFields(cur());
  }

  function renderRegisters() {
    const view = currentView();
    const regsEl = $('regs');
    regsEl.textContent = '';
    for (let r = 0; r < 32; r++) {
      const d = document.createElement('div');
      const cls = view.wrote.includes(r) ? ' hot' : view.read.includes(r) ? ' read' : '';
      d.className = 'rc' + (M.regs[r] ? '' : ' zero') + cls;
      const n = document.createElement('span'); n.className = 'n'; n.textContent = 'r' + r;
      const v = document.createElement('span'); v.className = 'v'; v.textContent = String(M.regs[r]);
      d.append(n, v);
      regsEl.appendChild(d);
    }
  }

  function renderToolbar() {
    if (!M) return;
    $('cycles').textContent = IS_VIEWER ? `cycle ${M.cycles} · view-only` : `cycle ${M.cycles}`;
    $('ctl').style.display = IS_VIEWER ? 'none' : 'contents';
    $('step-btn').disabled = !canStep();
    $('back-btn').disabled = !history.length;
    $('toast').classList.toggle('show', IS_VIEWER);
  }

  // Set by a forward step; the next draw plays the cycle instead of showing it settled.
  let animateNext = false;

  function render() {
    if (!M) return;
    renderInstructionLine();
    renderCaption();
    renderRegisters();
    renderToolbar();
    drawFigure(currentView(), animateNext && !!M.last);
    animateNext = false;
  }

  // ── Events ──────────────────────────────────────────────────────────────────
  $('step-btn').addEventListener('click', step);
  $('back-btn').addEventListener('click', back);
  // The host bar's ↻ puts the starting state back.
  (function hookReset(tries) {
    if (window.BeamerWidget?.topbar?.onReset) { BeamerWidget.topbar.onReset(reset); return; }
    if (tries > 0) setTimeout(() => hookReset(tries - 1), 200);
  })(25);

  // → / Space step and ← goes back; when there is nothing to step (or undo)
  // the key is left alone, so the deck's own arrow navigation takes over.
  document.addEventListener('keydown', e => {
    if (IS_VIEWER || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.closest?.('input, textarea')) return;
    // A focused dropdown would change its value on an arrow key; take the key
    // for stepping instead and let the dropdown go.
    if (e.target.tagName === 'SELECT') {
      if (!['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
      e.preventDefault();
      e.target.blur();
    }
    if (e.key === 'ArrowRight' || e.key === ' ') {
      if (canStep()) { e.preventDefault(); step(); }
    } else if (e.key === 'ArrowLeft') {
      if (history.length) { e.preventDefault(); back(); }
    }
  });

  // Text measured in the SVG depends on its laid-out size; redraw when it changes.
  let resizeRaf = 0;
  new ResizeObserver(() => {
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => { if (M) drawFigure(currentView()); });
  }).observe($('fig-wrap'));
  // ── Socket.IO sync ──────────────────────────────────────────────────────────
  let socket = null, syncTimer = null, socketUrlUsed = null;

  function initSocket(url) {
    if (typeof io === 'undefined') { socket = { emit() {}, on() {} }; return; }
    if (socket && url && url === socketUrlUsed) return;
    try {
      const prev = socket;
      socketUrlUsed = url;
      socket = io(url || (window.BeamerWidget ? BeamerWidget.serverOrigin() : ''),
                  { transports: ['websocket', 'polling'] });
      if (prev && prev.disconnect) prev.disconnect();
      socket.on('widget_state', data => {
        if (!IS_VIEWER || data?.widgetId !== WIDGET_ID) return;
        applyState(data.state || {});
      });
    } catch (_) {
      socket = { emit() {}, on() {} };
    }
  }

  function emitState() {
    if (!socket || IS_VIEWER) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => {
      socket.emit('widget_state', { widgetId: WIDGET_ID, state: getState() });
    }, 100);
  }

  // ── State serialisation ─────────────────────────────────────────────────────
  // Same shape for live sync and for saving with the deck. Back history stays
  // with the presenter: it is not part of what the room sees.
  function getState() {
    return { v: 1, sig: configSig(), m: clone(M) };
  }

  const int = (x, d = 0) => (Number.isFinite(+x) ? (+x | 0) : d);
  function cleanMachine(m) {
    if (!m || typeof m !== 'object' || !Array.isArray(m.regs)) return null;
    const mem = {};
    let count = 0;
    for (const k in m.mem || {}) {
      if (count++ > 512) break;
      const a = int(k, -1);
      if (a >= 0 && a % 4 === 0) mem[a] = int(m.mem[k]);
    }
    const path = Array.isArray(m.path) ? m.path.filter(id => STATE_NAME[id]).slice(0, 8) : [];
    const last = m.last && typeof m.last === 'object' ? {
      id: String(m.last.id || ''),
      on: Array.isArray(m.last.on) ? m.last.on.map(String).slice(0, 40) : [],
      sig: Object.fromEntries(Object.entries(m.last.sig || {}).filter(([k]) => SIGNALS.some(s => s[0] === k))
                                   .map(([k, v]) => [k, String(v).slice(0, 16)])),
      tags: Array.isArray(m.last.tags) ? m.last.tags.filter(t => Array.isArray(t) && SPOTS[t[0]])
                                         .map(t => [t[0], String(t[1]).slice(0, 24)]).slice(0, 12) : [],
      read: Array.isArray(m.last.read) ? m.last.read.map(r => int(r)) : [],
      wrote: Array.isArray(m.last.wrote) ? m.last.wrote.map(r => int(r)) : [],
      mread: m.last.mread == null ? null : int(m.last.mread),
      mwrite: m.last.mwrite == null ? null : int(m.last.mwrite),
      // Our own sentence, made from numbers and fixed words; escaped anyway
      // except for the <code> marks it uses.
      text: escHtml(String(m.last.text || '')).replace(/&lt;(\/?)code&gt;/g, '<$1code>').replace(/&amp;lt;/g, '&lt;'),
    } : null;
    return {
      pc: int(m.pc), ipc: int(m.ipc), regs: Array.from({ length: 32 }, (_, i) => (i ? int(m.regs[i]) : 0)),
      mem, code: Array.isArray(m.code) ? m.code.map(a => int(a)).filter(a => a in mem).slice(0, 256) : [],
      ir: int(m.ir), a: int(m.a), b: int(m.b), ar: int(m.ar), mdr: int(m.mdr),
      path, k: Math.min(int(m.k), path.length), end: Math.min(int(m.end), path.length),
      taken: m.taken == null ? null : !!m.taken, cycles: int(m.cycles),
      halt: m.halt ? String(m.halt).slice(0, 200) : null, last,
    };
  }

  function applyState(s) {
    if (!s || typeof s !== 'object') return;
    const m = cleanMachine(s.m);
    if (!m) return;
    // A viewer replays the cycle the presenter just stepped into.
    animateNext = IS_VIEWER && !!M && m.cycles === M.cycles + 1 && !!m.last;
    M = m;
    if (!IS_VIEWER) history.length = 0;
    stateSig = s.sig || stateSig;
    render();
  }

  // ── Config ──────────────────────────────────────────────────────────────────
  // What the starting state is made from. A saved state built from a different
  // config is stale once the presenter edits the settings, so it is replaced.
  function configSig() {
    return JSON.stringify([cfg.instruction ?? null, cfg.registers ?? null, cfg.memory ?? null, cfg.pc ?? null]);
  }
  let stateSig = null;

  function applyConfig(c) {
    if (!c) return;
    cfg       = { ...cfg, ...c };
    WIDGET_ID = cfg.id || cfg.widgetId || WIDGET_ID;
    role      = cfg.role || role;
    IS_VIEWER = role === 'viewer' || _qs.get('viewer') === '1' || !!cfg.printMode;

    if (cfg.socketUrl) initSocket(cfg.socketUrl);

    const sig = configSig();
    if (!M || sig !== stateSig) {
      stateSig = sig;
      history.length = 0;
      startMachine();
      render();
      emitState();
      return;
    }
    render();
  }
  function destroy() {
    clearTimeout(syncTimer);
    stopAnim();
    if (socket && socket.disconnect) socket.disconnect();
    socket = null; socketUrlUsed = null;
  }

  // ── Beamer+ message bridge ──────────────────────────────────────────────────
  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === 'widget-config')  applyConfig(d.config);
    if (d.type === 'widget-cleanup') destroy();
    if (d.type === 'widget-get-state') {
      window.parent.postMessage({ type: 'widget-state', widgetId: WIDGET_ID, state: getState() }, '*');
    }
    if (d.type === 'widget-set-state' && d.state) applyState(d.state);
  });

  // ── Notes PDF ───────────────────────────────────────────────────────────────
  // The instruction line, the figure, its caption and the register file as they stand; the host hands the
  // print copy the live state first.
  // html2canvas redraws inline SVG text itself and spaces the typewriter face
  // wrongly, so the figure goes in as a picture: the SVG serialised with the
  // slide fonts embedded, shown as an <img> over the live one while the
  // snapshot is taken.
  function fontFaceCss() {
    let css = '';
    for (const sheet of document.styleSheets) {
      let rules;
      try { rules = sheet.cssRules; } catch (_) { continue; }   // cross-origin sheet
      for (const r of rules || []) if (r.type === CSSRule.FONT_FACE_RULE && /BW CM/.test(r.cssText)) css += r.cssText + '\n';
    }
    return css;
  }

  async function figureAsImage() {
    const box = fig.getBoundingClientRect();
    const svg = fig.cloneNode(true);
    svg.setAttribute('xmlns', SVGNS);
    svg.setAttribute('width', box.width); svg.setAttribute('height', box.height);
    const css = fontFaceCss();
    if (css) { const st = document.createElementNS(SVGNS, 'style'); st.textContent = css; svg.insertBefore(st, svg.firstChild); }
    const src = new Image();
    src.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svg));
    try { await src.decode(); } catch (_) { /* drawn below anyway */ }
    // The fonts inside an SVG image load a moment after it decodes; draw it
    // to a PNG once they have, so html2canvas gets plain pixels.
    await new Promise(r => setTimeout(r, 250));
    const k = 2, c = document.createElement('canvas');
    c.width = Math.round(box.width * k); c.height = Math.round(box.height * k);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    const img = new Image();
    img.src = c.toDataURL('image/png');
    img.style.cssText = `position:absolute;left:${fig.offsetLeft}px;top:${fig.offsetTop}px;width:${box.width}px;height:${box.height}px`;
    try { await img.decode(); } catch (_) { /* drawn on load anyway */ }
    return img;
  }

  if (window.BeamerWidget?.print) {
    BeamerWidget.print.register(async () => {
      render();
      const img = await figureAsImage();
      fig.style.visibility = 'hidden';
      $('fig-wrap').appendChild(img);
      try {
        return { image: await BeamerWidget.print.snapshot('#main', { ignore: '#toast, #fig' }) };
      } finally {
        img.remove();
        fig.style.visibility = '';
      }
    });
  }

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // A test hook: the machine, the assembler and the step functions, for the
  // acceptance checks. Nothing in Beamer+ calls it.
  window.__datapath = { get M() { return M; }, render, figureAsImage, step: stepOnce, back, reset, loadIns, parseAsm, encode, decodeWord, asmText };

  // ── Boot ────────────────────────────────────────────────────────────────────
  initSocket(CFG0.socketUrl);
  applyConfig(CFG0);
})();
</script>
</body>
</html>
