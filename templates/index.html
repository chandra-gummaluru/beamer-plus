<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beamer+</title>
    <meta name="theme-color" content="#333333">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="/static/icons/icon-32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/static/icons/icon-16x16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">
    <link rel="stylesheet" href="/static/css/app.css">

    <!-- Vendored libraries (static/vendor) — no CDN dependency, works offline.
         Widgets load their own copies of socket.io / marked / qrcode inside
         their iframes; only the libraries the presenter shell itself uses are
         included here. -->
    <script src="/static/vendor/jszip.min.js"></script>
    <script type="module">
        // pdf.js 4.x ships as an ES module; expose it as the window.pdfjsLib
        // global the rest of the app expects. Module scripts execute in
        // document order, so this runs before main.js below.
        import * as pdfjsLib from '/static/vendor/pdfjs/pdf.min.mjs';
        pdfjsLib.GlobalWorkerOptions.workerSrc = '/static/vendor/pdfjs/pdf.worker.min.mjs';
        window.pdfjsLib = pdfjsLib;
    </script>
    <script type="module" src="/static/vendor/model-viewer.min.js"></script>
    {% if session_id %}
    <script>window.BEAMER_SESSION_ID = {{ session_id|tojson }};</script>
    {% endif %}
</head>
<body>
    <!-- Hidden file inputs for upload -->
    <input type="file" id="upload-presentation" accept=".pdf,.zip,application/pdf,application/zip">
    <!-- Hidden file input for editor media upload -->
    <input type="file" id="edit-media-input">

    <!-- Loading splash (presenter view) -->
    <div id="splash-screen">
        <svg class="splash-squiggle" viewBox="0 0 120 40">
            <path d="M5 20 Q 15 5, 25 20 T 45 20 T 65 20 T 85 20 T 105 20" />
        </svg>
        <div class="splash-title">Beamer+</div>
        <div class="splash-subtitle">Loading presentation…</div>
    </div>

    <!-- Slide navigator -->
    <aside id="slide-navigator">
        <div id="slide-nav-top-actions">
            <button class="btn" id="split-toggle" title="Split view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg></button>
        </div>
        <div id="bookmark-pins"></div>
        <div id="slide-nav-slides"></div>
        <div id="slide-nav-bottom-actions">
            <!-- Split button: left half inserts a blank slide, right half
                 duplicates the slide on stage (slides/structure.js). -->
            <div class="btn-split" id="add-slide-group" role="group" aria-label="Add slide">
                <button class="btn" id="add-blank-btn" title="Add page…"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></button>
                <button class="btn" id="duplicate-slide-btn" title="Duplicate this slide"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V5a2 2 0 0 1 2-2h11"/></svg></button>
            </div>
            <button class="btn" id="bookmark-btn" title="Bookmark slide"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
        </div>
    </aside>

    <!-- Drawer hinge — slides the navigator out of view and back
         (slides/drawer.js). Sits on the navigator's right edge. -->
    <button type="button" id="nav-drawer-hinge" aria-controls="slide-navigator" aria-expanded="true" title="Hide slides">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>

    <!-- Drag-and-drop target — shown while a file is dragged over the window
         (app/uploader.js). -->
    <div id="drop-overlay" aria-hidden="true">
        <div class="drop-overlay-card">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <div class="drop-overlay-title">Drop to open</div>
            <div class="drop-overlay-sub">A PDF slide deck or a saved Beamer+ ZIP</div>
        </div>
    </div>

    <!-- Main stage -->
    <main id="main-content">
        <div id="main-menu" class="hidden"></div>
        <div id="pdf-container">
            <div id="pdf-canvas"></div>
            <div id="ann-canvas"></div>
            <!-- Empty-stage placeholder — shown while the deck has no slides at all
                 (fresh session, nothing uploaded yet). Sized to the slide card by
                 sizeSlideCanvases(); toggled by updateStageEmptyState() in main.js. -->
            <div id="stage-empty" class="stage-empty" hidden>
                <svg class="stage-empty-icon" viewBox="0 0 72 52" fill="none" aria-hidden="true">
                    <path class="stage-empty-squiggle" d="M18 26 Q 27 13, 36 26 T 54 26"/>
                </svg>
                <p class="stage-empty-title">Nothing here yet…</p>
                <p class="stage-empty-hint">Start by opening a presentation (top right) or adding a page (bottom left).</p>
            </div>
            <div class="slide-loading-overlay">
                <svg class="slide-squiggle" viewBox="0 0 120 40">
                    <path d="M5 20 Q 15 5, 25 20 T 45 20 T 65 20 T 85 20 T 105 20" />
                </svg>
            </div>
        </div>
        <div id="split-view-divider"></div>
        <!-- Covers the whole stage while the slide is muted. -->
        <div id="mute-overlay" aria-hidden="true"></div>
        <div id="pdf-container-2">
            <div id="pdf-canvas-2"></div>
            <div id="ann-canvas-2"></div>
            <div class="slide-loading-overlay">
                <svg class="slide-squiggle" viewBox="0 0 120 40">
                    <path d="M5 20 Q 15 5, 25 20 T 45 20 T 65 20 T 85 20 T 105 20" />
                </svg>
            </div>
        </div>
    </main>

    <!-- Edit mode button — bottom-right, just right of the hide-slide button
         (top-right while editing, where it closes the editor). -->
    <div id="edit-mode-container">
        <button class="btn" id="edit-mode-btn" title="Edit mode">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
        </button>
    </div>

    <!-- Top-right: the session's buttons — Open, Edit, Save, Close session
         (app/session-buttons.js). Open and Save use folders on this computer
         (library/ui.js); Edit and Save need an open presentation. Dropping a
         file on the window opens it too. -->
    <div id="top-right-controls">
        <button class="btn" id="session-open-btn" title="Open a presentation" aria-label="Open a presentation"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg></button>
        <button class="btn" id="session-edit-btn" title="Edit presentation" aria-label="Edit presentation" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="btn" id="session-save-btn" title="Save presentation" aria-label="Save presentation" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
        <button class="btn" id="session-close-btn" title="Close session" aria-label="Close session"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l5-5-5-5M15 12H4"/></svg></button>
    </div>

    <!-- Record + Mute — bottom-right corner. Record opens the recorder
         (app/recorder.js); Mute blanks the stage until pressed again
         (shortcut "."; main.js toggleMute). -->
    <div id="mute-container">
        <button class="btn" id="record-btn" title="Record this tab"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/></svg></button>
        <!-- Recording bar — takes the record button's place while a take
             is in progress (app/recorder.js). Stays up in edit and focus mode. -->
        <div id="recorder-bar" role="group" aria-label="Recording" hidden>
            <span class="recorder-dot" aria-hidden="true"></span>
            <span class="recorder-state visually-hidden">Recording</span>
            <span class="recorder-time" aria-live="off">0:00</span>
            <button class="btn" id="recorder-pause-btn" title="Pause recording" aria-label="Pause recording">
                <svg class="recorder-icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
                <svg class="recorder-icon-resume" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="6"/></svg>
            </button>
            <button class="btn" id="recorder-stop-btn" title="Stop recording" aria-label="Stop recording">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
        </div>
        <button class="btn" id="mute-btn" title="Hide slide (.)" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button>
    </div>

    <!-- Annotation toolbar -->
    <div id="floating-annotation-toolbar">
        <div id="tool-container">
            <button class="btn tool-btn" data-tool="hand" id="hand-btn" title="Hand / pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"/><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></button>
            <button class="btn tool-btn" data-tool="spotlight" id="spotlight-btn" title="Spotlight"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></button>
            <button class="btn tool-btn" data-tool="magnify" id="magnify-btn" title="Magnifier (scroll to zoom)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16" y2="16"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
            <div id="pen-slots"></div>
            <button class="btn tool-btn" data-tool="text" id="text-btn" title="Text box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg></button>
            <button class="btn tool-btn" data-tool="eraser" title="Eraser"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21h10"/><path d="m5 11 9-9 6 6-9 9H5z"/></svg></button>
        </div>
        <div id="annotation-undo-redo">
            <button class="btn" id="annotation-undo" title="Undo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
            <button class="btn" id="annotation-redo" title="Redo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
        </div>
        <div id="annotation-clear">
            <button class="btn" id="annotation-clear-btn" title="Clear all"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>
        </div>
    </div>

    <!-- Text-size flyout — a sibling of the toolbar (not nested inside it), so its
         position:fixed resolves against the viewport rather than against the
         toolbar's own box (the toolbar has `transform`, which would otherwise make
         it the containing block for a fixed-position descendant). -->
    <div id="text-size-sidebar">
        <button class="btn" type="button" data-size="small" title="Small text"><span class="text-size-dot text-size-dot--small"></span></button>
        <button class="btn" type="button" data-size="regular" title="Regular text"><span class="text-size-dot text-size-dot--regular"></span></button>
        <button class="btn" type="button" data-size="large" title="Large text"><span class="text-size-dot text-size-dot--large"></span></button>
        <button class="btn" type="button" data-size="xlarge" title="Extra-large text"><span class="text-size-dot text-size-dot--xlarge"></span></button>
        <hr class="text-flyout-sep">
        <div class="text-color-row" role="group" aria-label="Text color">
            <button class="text-color-swatch" type="button" data-color="#242424" title="Black" style="--c:#242424"></button>
            <button class="text-color-swatch" type="button" data-color="#e74c3c" title="Red" style="--c:#e74c3c"></button>
            <button class="text-color-swatch" type="button" data-color="#f1c40f" title="Yellow" style="--c:#f1c40f"></button>
            <button class="text-color-swatch" type="button" data-color="#2ecc71" title="Green" style="--c:#2ecc71"></button>
            <button class="text-color-swatch" type="button" data-color="#3498db" title="Blue" style="--c:#3498db"></button>
            <button class="text-color-swatch" type="button" data-color="#9b59b6" title="Purple" style="--c:#9b59b6"></button>
            <button class="text-color-swatch" type="button" data-color="#eeeeee" title="White" style="--c:#eeeeee"></button>
            <label class="text-color-swatch text-color-custom" title="Pick any color">
                <input type="color" id="text-color-custom" value="#242424" aria-label="Pick any color">
            </label>
        </div>
    </div>

    <script>
        // Beamer+ does no caching — see the note at the top of service-worker.js.
        // Registering that file is what REMOVES any caching worker a browser is
        // still carrying from before: it deletes every cache, unregisters itself
        // and reloads the page. Registration is also retried on each load so a
        // browser that never picked it up still gets cleaned out.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    if (regs.length) {
                        // Something is registered: hand it the tombstone, which
                        // supersedes it and then tears itself down.
                        await navigator.serviceWorker.register('/service-worker.js', {
                            scope: '/', updateViaCache: 'none',
                        });
                    }
                    // Nothing should ever be cached; clear anything that is,
                    // including caches left by a worker that has already gone.
                    if (window.caches) {
                        const names = await caches.keys();
                        await Promise.all(names.map(n => caches.delete(n)));
                    }
                } catch (_) { /* private mode, or workers unavailable */ }
            });
        }
    </script>
    <script type="module" src="/static/js/main.js"></script>

    <!-- Editor panel (right sidebar, visible in edit mode) -->
    <aside id="editor-panel" data-mode="slide">
        <div id="editor-panel-header">
            <button class="editor-props-back" id="editor-props-back" type="button" title="Back to slide properties" aria-label="Back to slide properties">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <span id="editor-panel-title">Slide Properties</span>
        </div>
        <div id="editor-panel-body">
            <!-- The slide's own tools are on the edit rail (#editor-slide-tools);
                 this panel only opens for something selected on the slide. -->
            <div id="editor-slide-settings"></div>
            <div id="editor-properties">
                <div id="editor-properties-body"></div>
            </div>
            <div id="editor-view">
                <div id="editor-view-body"></div>
            </div>
            <!-- The selected widget's settings (editor/widget-panel.js). -->
            <div id="editor-widget">
                <div id="editor-widget-body"></div>
            </div>
        </div>
    </aside>
    <!-- Edit rail — where the annotation toolbar sits while presenting (it's
         hidden in edit mode); beside the panel when one is open. Inserts
         first, then this slide's own tools. -->
    <div id="editor-add-row" role="toolbar" aria-label="Edit tools" aria-orientation="vertical">
        <button class="btn editor-icon-btn" id="add-view-btn" title="Insert split view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="3" width="8" height="18" rx="1.5"/><rect x="15" y="3" width="8" height="18" rx="1.5"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="9" y1="12" x2="15" y2="12"/></svg></button>
        <button class="btn editor-icon-btn" id="edit-add-video-btn" title="Add video">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        </button>
        <button class="btn editor-icon-btn" id="edit-add-audio-btn" title="Add audio">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </button>
        <button class="btn editor-icon-btn" id="edit-add-model-btn" title="Add 3D model (.glb / .gltf)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        </button>
        <button class="btn editor-icon-btn" id="edit-add-reveal-btn" title="Add reveal step (hide part of the slide until a key press)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3"/><path d="M8 12h8"/><path d="M13 9l3 3-3 3"/></svg>
        </button>
        <div class="editor-rail-sep" aria-hidden="true"></div>
        <button class="btn editor-icon-btn" id="edit-add-widget-btn" title="Add widget">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        </button>
        <!-- This slide: paper (blank slides), hide from the presentation, delete
             (editor.js). Not shown while a split view is being configured. -->
        <div class="editor-rail-sep editor-rail-slide" aria-hidden="true"></div>
        <div class="editor-rail-group editor-rail-slide" id="editor-slide-tools">
            <!-- Blank slides only: lined / grid / dotted paper (slides/paper.js). -->
            <div class="editor-rail-paper" id="slide-paper-wrap" hidden>
                <button type="button" class="btn editor-icon-btn" id="slide-paper-btn" title="Paper" aria-label="Paper" aria-haspopup="true" aria-expanded="false">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
                </button>
                <div id="slide-paper-settings" class="slide-paper-pop" hidden>
                    <label class="slide-setting">
                        <span class="slide-setting-name">Background</span>
                        <select class="slide-setting-select" id="paper-style"></select>
                    </label>
                    <div id="paper-options">
                        <label class="slide-setting">
                            <span class="slide-setting-name">Spacing</span>
                            <select class="slide-setting-select" id="paper-spacing"></select>
                        </label>
                        <label class="slide-setting">
                            <span class="slide-setting-name" id="paper-thickness-label">Line weight</span>
                            <select class="slide-setting-select" id="paper-thickness"></select>
                        </label>
                        <label class="slide-setting">
                            <span class="slide-setting-name">Colour</span>
                            <select class="slide-setting-select" id="paper-color"></select>
                        </label>
                    </div>
                </div>
            </div>
            <button type="button" class="btn editor-icon-btn" id="slide-hidden-toggle" aria-pressed="false" title="Shown in presentation — click to hide">
                <svg class="i-eye" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="i-eye-off" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1"/><path d="M6.6 6.6A17.3 17.3 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
            <!-- Two clicks: the first arms it, since there's no undo (editor.js). -->
            <button type="button" class="btn editor-icon-btn editor-rail-delete" id="slide-delete" title="Delete slide" aria-label="Delete slide">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>
                <span class="editor-rail-delete-label">Delete slide?</span>
            </button>
        </div>
    </div>

</body>
</html>
