<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beamer+</title>
    <meta name="theme-color" content="#333333">
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="/static/icons/icon-32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/static/icons/icon-16x16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">
    <link rel="stylesheet" href="/static/css/app.css">

    <!-- Vendored libraries (static/vendor) — no CDN dependency, works offline.
         Widgets load their own copies of socket.io / marked / qrcode inside
         their iframes; only the libraries the presenter shell itself uses are
         included here. -->
    <script src="/static/vendor/jszip.min.js"></script>
    <script type="module">
        // pdf.js 4.x ships as an ES module; expose it as the window.pdfjsLib
        // global the rest of the app expects. Module scripts execute in
        // document order, so this runs before main.js below.
        import * as pdfjsLib from '/static/vendor/pdfjs/pdf.min.mjs';
        pdfjsLib.GlobalWorkerOptions.workerSrc = '/static/vendor/pdfjs/pdf.worker.min.mjs';
        window.pdfjsLib = pdfjsLib;
    </script>
    <script type="module" src="/static/vendor/model-viewer.min.js"></script>
    {% if session_id %}
    <script>window.BEAMER_SESSION_ID = {{ session_id|tojson }};</script>
    {% endif %}
</head>
<body>
    <!-- Hidden file inputs for upload -->
    <input type="file" id="upload-zip" accept=".zip">
    <input type="file" id="upload-folder" webkitdirectory directory multiple>
    <input type="file" id="upload-pdf" accept=".pdf">
    <!-- Hidden file input for editor media upload -->
    <input type="file" id="edit-media-input">

    <!-- Loading splash (presenter view) -->
    <div id="splash-screen">
        <svg class="splash-squiggle" viewBox="0 0 120 40">
            <path d="M5 20 Q 15 5, 25 20 T 45 20 T 65 20 T 85 20 T 105 20" />
        </svg>
        <div class="splash-title">Beamer+</div>
        <div class="splash-subtitle">Loading presentation…</div>
    </div>

    <!-- Slide navigator -->
    <aside id="slide-navigator">
        <div id="slide-nav-top-actions">
            <button class="btn" id="split-toggle" title="Split view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg></button>
        </div>
        <div id="bookmark-pins"></div>
        <div id="slide-nav-slides"></div>
        <div id="slide-nav-bottom-actions">
            <button class="btn" id="add-blank-btn" title="Insert blank slide"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></button>
            <button class="btn" id="delete-blank-btn" title="Delete blank slide" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            <button class="btn" id="bookmark-btn" title="Bookmark slide"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
        </div>
    </aside>

    <!-- Main stage -->
    <main id="main-content">
        <div id="main-menu" class="hidden"></div>
        <div id="pdf-container">
            <div id="pdf-canvas"></div>
            <div id="ann-canvas"></div>
            <!-- Empty-stage placeholder — shown while the deck has no slides at all
                 (fresh session, nothing uploaded yet). Sized to the slide card by
                 sizeSlideCanvases(); toggled by updateStageEmptyState() in main.js. -->
            <div id="stage-empty" class="stage-empty" hidden>
                <svg class="stage-empty-icon" viewBox="0 0 72 52" fill="none" aria-hidden="true">
                    <path class="stage-empty-squiggle" d="M18 26 Q 27 13, 36 26 T 54 26"/>
                </svg>
                <p class="stage-empty-title">Nothing here yet…</p>
                <p class="stage-empty-hint">Upload content or add a slide to get started.</p>
            </div>
            <div class="slide-loading-overlay">
                <svg class="slide-squiggle" viewBox="0 0 120 40">
                    <path d="M5 20 Q 15 5, 25 20 T 45 20 T 65 20 T 85 20 T 105 20" />
                </svg>
            </div>
        </div>
        <div id="split-view-divider"></div>
        <div id="pdf-container-2">
            <div id="pdf-canvas-2"></div>
            <div id="ann-canvas-2"></div>
            <div class="slide-loading-overlay">
                <svg class="slide-squiggle" viewBox="0 0 120 40">
                    <path d="M5 20 Q 15 5, 25 20 T 45 20 T 65 20 T 85 20 T 105 20" />
                </svg>
            </div>
        </div>
    </main>

    <!-- Edit mode button — standalone pill, always visible at top-right -->
    <div id="edit-mode-container">
        <button class="btn" id="edit-mode-btn" title="Edit mode">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
        </button>
    </div>

    <!-- Top-right cluster -->
    <div id="top-right-controls">
        <div id="upload-container">
            <button class="btn" id="upload-presentation-btn" title="Upload presentation"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>
        </div>
        <div id="save-container">
            <button class="btn" id="edit-save-btn" title="Save &amp; download edited presentation"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
        </div>
    </div>

    <!-- Annotation toolbar -->
    <div id="floating-annotation-toolbar">
        <div id="annotation-toolbar-grip" role="button" tabindex="0" aria-label="Move toolbar" title="Drag to move · double-click to reset"><svg width="16" height="8" viewBox="0 0 16 8" fill="currentColor" aria-hidden="true"><circle cx="3" cy="2" r="1.2"/><circle cx="8" cy="2" r="1.2"/><circle cx="13" cy="2" r="1.2"/><circle cx="3" cy="6" r="1.2"/><circle cx="8" cy="6" r="1.2"/><circle cx="13" cy="6" r="1.2"/></svg></div>
        <div id="tool-container">
            <button class="btn tool-btn" data-tool="hand" id="hand-btn" title="Hand / pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"/><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></button>
            <button class="btn tool-btn" data-tool="spotlight" id="spotlight-btn" title="Spotlight"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></button>
            <div id="pen-slots"></div>
            <button class="btn tool-btn" data-tool="text" id="text-btn" title="Text box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg></button>
            <button class="btn tool-btn" data-tool="eraser" title="Eraser"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21h10"/><path d="m5 11 9-9 6 6-9 9H5z"/></svg></button>
        </div>
        <div id="annotation-undo-redo">
            <button class="btn" id="annotation-undo" title="Undo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
            <button class="btn" id="annotation-redo" title="Redo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
        </div>
        <div id="annotation-clear">
            <button class="btn" id="annotation-clear-btn" title="Clear all"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>
        </div>
    </div>

    <!-- Text-size flyout — a sibling of the toolbar (not nested inside it), so its
         position:fixed resolves against the viewport rather than against the
         toolbar's own box (the toolbar has `transform`, which would otherwise make
         it the containing block for a fixed-position descendant). -->
    <div id="text-size-sidebar">
        <button class="btn" type="button" data-size="small" title="Small text"><span class="text-size-dot text-size-dot--small"></span></button>
        <button class="btn" type="button" data-size="regular" title="Regular text"><span class="text-size-dot text-size-dot--regular"></span></button>
        <button class="btn" type="button" data-size="large" title="Large text"><span class="text-size-dot text-size-dot--large"></span></button>
    </div>

    <script>
        // Beamer+ does no caching — see the note at the top of service-worker.js.
        // Registering that file is what REMOVES any caching worker a browser is
        // still carrying from before: it deletes every cache, unregisters itself
        // and reloads the page. Registration is also retried on each load so a
        // browser that never picked it up still gets cleaned out.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    if (regs.length) {
                        // Something is registered: hand it the tombstone, which
                        // supersedes it and then tears itself down.
                        await navigator.serviceWorker.register('/service-worker.js', {
                            scope: '/', updateViaCache: 'none',
                        });
                    }
                    // Nothing should ever be cached; clear anything that is,
                    // including caches left by a worker that has already gone.
                    if (window.caches) {
                        const names = await caches.keys();
                        await Promise.all(names.map(n => caches.delete(n)));
                    }
                } catch (_) { /* private mode, or workers unavailable */ }
            });
        }
    </script>
    <script type="module" src="/static/js/main.js"></script>

    <!-- Editor panel (right sidebar, visible in edit mode) -->
    <aside id="editor-panel" data-mode="slide">
        <div id="editor-panel-header">
            <button class="editor-props-back" id="editor-props-back" type="button" title="Back to slide properties" aria-label="Back to slide properties">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <span id="editor-panel-title">Slide Properties</span>
        </div>
        <div id="editor-panel-body">
            <div id="editor-slide-settings">
                <label class="slide-setting">
                    <span class="slide-setting-text">
                        <span class="slide-setting-name">Hide in presentation</span>
                        <span class="slide-setting-desc">Skipped when presenting</span>
                    </span>
                    <input type="checkbox" class="editor-switch" role="switch" id="slide-hidden-toggle">
                </label>
                <!-- Everything on the slide, each with Edit and Delete
                     (refreshSlideItems in editor/properties.js). -->
                <div id="editor-slide-items"></div>
            </div>
            <div id="editor-properties">
                <div id="editor-properties-body"></div>
            </div>
            <div id="editor-view">
                <div id="editor-view-body"></div>
            </div>
        </div>
        <!-- Add-media footer — icon-only buttons, annotation-bar style -->
        <div id="editor-add-row">
            <button class="btn editor-icon-btn" id="add-view-btn" title="Insert split view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="3" width="8" height="18" rx="1.5"/><rect x="15" y="3" width="8" height="18" rx="1.5"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="9" y1="12" x2="15" y2="12"/></svg></button>
            <button class="btn editor-icon-btn" id="edit-add-video-btn" title="Add video">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            </button>
            <button class="btn editor-icon-btn" id="edit-add-audio-btn" title="Add audio">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </button>
            <button class="btn editor-icon-btn" id="edit-add-model-btn" title="Add 3D model (.glb / .gltf)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            </button>
            <button class="btn editor-icon-btn" id="edit-add-widget-btn" title="Add widget">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
            </button>
        </div>
    </aside>

    <!-- Bottom controls cluster — single combined Help &amp; Settings menu -->
    <div id="bottom-controls">
        <button class="btn" id="menu-btn" title="Help &amp; Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
    </div>
</body>
</html>
