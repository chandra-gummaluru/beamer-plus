<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vote — Beamer+</title>
<script src="/static/vendor/socket.io.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');

:root {
  --bg:         #ffffff;
  --bg-subtle:  #f9f9f8;
  --border:     #e9e9e6;
  --border-med: #d4d4cf;
  --text:       #1a1a18;
  --text-2:     #6b6b65;
  --text-3:     #aeaea5;
  --accent:     #52524e;
  --accent-bg:  #f0f0ee;
  --green:      #15803d;
  --red:        #dc2626;
  --radius:     8px;
  --font-mono:  'JetBrains Mono', ui-monospace, monospace;
  --font-ui:    'DM Sans', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  min-height: 100%; background: var(--bg);
  color: var(--text); font-family: var(--font-ui); font-size: 15px;
  display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}


/* ── Loading ─────────────────────────────────────────── */
#loading-area {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
}
.spinner {
  width: 24px; height: 24px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--text-3); }

/* ── Poll area ───────────────────────────────────────── */
#poll-area {
  flex: 1; display: none;
  flex-direction: column; overflow-y: auto;
}

/* Question */
#question-block {
  flex-shrink: 0;
  padding: 28px 20px 20px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}
.question-text {
  font-size: 1.35rem; font-weight: 500; line-height: 1.4; color: var(--text);
}

/* Options */
#options-container {
  flex: 1;
  display: flex; flex-direction: column;
  gap: 10px; padding: 20px 20px 32px;
  max-width: 520px; width: 100%; margin: 0 auto;
}

.option-btn {
  width: 100%;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
  background: var(--bg-subtle); border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--font-ui); font-size: 15px;
  color: var(--text); text-align: left;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
  -webkit-tap-highlight-color: transparent;
  line-height: 1.35;
}
.option-btn:active:not(:disabled) { background: var(--accent-bg); border-color: var(--border-med); }
.option-btn:disabled { cursor: not-allowed; }

.option-btn.selected {
  background: var(--accent-bg);
  border-color: var(--accent);
}

.option-letter {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 12px; font-weight: 600;
  color: var(--text-2); flex-shrink: 0;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.option-btn.selected .option-letter {
  background: var(--text); border-color: var(--text); color: #fff;
}

.option-label { flex: 1; }

/* ── Status cards ────────────────────────────────────── */
.status-card {
  flex: 1; display: none; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 24px; gap: 8px; text-align: center;
}
.status-card.visible { display: flex; }
.status-title {
  font-size: 1.3rem; font-weight: 600; color: var(--text); line-height: 1.3;
}
.status-sub { font-size: 14px; color: var(--text-3); line-height: 1.5; margin-top: 2px; }
.status-card.ok  .status-title { color: var(--green); }
.status-card.err .status-title { color: var(--red); }
</style>
</head>
<body>


<div id="loading-area">
  <div class="spinner"></div>
  <div class="loading-text">Loading…</div>
</div>

<div id="poll-area">
  <div id="question-block">
    <div class="question-text" id="question-text"></div>
  </div>
  <div id="options-container"></div>
</div>

<div class="status-card ok" id="thanks-card">
  <div class="status-title">Thank you!</div>
  <div class="status-sub">Your response has been recorded.</div>
</div>

<div class="status-card" id="already-card">
  <div class="status-title">Already submitted</div>
  <div class="status-sub">This device has already responded to this poll.</div>
</div>

<div class="status-card" id="closed-card">
  <div class="status-title">Poll closed</div>
  <div class="status-sub">This poll is no longer accepting responses.</div>
</div>

<div class="status-card err" id="error-card">
  <div class="status-title">Unavailable</div>
  <div class="status-sub" id="error-detail">This poll could not be loaded.</div>
</div>

<script>
const SURVEY_ID   = "{{ survey_id }}";
const SESSION_ID  = "{{ session_id }}";
const API_PREFIX  = `/s/${SESSION_ID}/api/survey`;
const LETTERS     = ['A','B','C','D','E','F','G','H','I','J'];
const SESSION_KEY = 'voted_' + SESSION_ID + '_' + SURVEY_ID;
const CARDS = ['thanks-card', 'already-card', 'closed-card', 'error-card'];

let socket   = null;
let hasVoted = false;

function showCard(id) {
  document.getElementById('loading-area').style.display = 'none';
  document.getElementById('poll-area').style.display    = 'none';
  CARDS.forEach(c => document.getElementById(c).classList.toggle('visible', c === id));
}

function disableAll() {
  document.querySelectorAll('.option-btn').forEach(b => { b.disabled = true; });
}

function renderOptions(options) {
  const container = document.getElementById('options-container');
  container.innerHTML = '';
  options.forEach((text, i) => {
    const letter = LETTERS[i] || String(i + 1);
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `
      <span class="option-letter">${letter}</span>
      <span class="option-label">${escHtml(text)}</span>
    `;
    btn.addEventListener('click', () => submitVote(letter, btn));
    container.appendChild(btn);
  });
}

async function submitVote(letter, btnEl) {
  if (hasVoted) return;
  hasVoted = true;
  disableAll();
  btnEl.classList.add('selected');
  try {
    const res = await fetch(`${API_PREFIX}/${SURVEY_ID}/respond`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ response: letter }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      if ((d.error || '').toLowerCase().includes('closed')) { showCard('closed-card'); return; }
      throw new Error(d.error || 'Failed');
    }
    sessionStorage.setItem(SESSION_KEY, '1');
    showCard('thanks-card');
  } catch (e) {
    hasVoted = false;
    btnEl.classList.remove('selected');
    document.querySelectorAll('.option-btn').forEach(b => { b.disabled = false; });
  }
}

async function load() {
  if (sessionStorage.getItem(SESSION_KEY)) { showCard('already-card'); return; }
  try {
    const res = await fetch(`${API_PREFIX}/${SURVEY_ID}`);
    if (!res.ok) {
      if (res.status === 404) document.getElementById('error-detail').textContent = 'This poll does not exist.';
      showCard('error-card'); return;
    }
    const data = await res.json();
    if (data.active === false) { showCard('closed-card'); return; }
    document.getElementById('question-text').textContent = data.question || 'Please select an option:';
    renderOptions(data.options || []);
    document.getElementById('loading-area').style.display = 'none';
    document.getElementById('poll-area').style.display = 'flex';
    try {
      socket = io();
      socket.emit('join_survey', { session_id: SESSION_ID, survey_id: SURVEY_ID });
      socket.on('survey_closed', d => {
        if (d && d.survey_id && d.survey_id !== SURVEY_ID) return;
        if (!hasVoted) { disableAll(); showCard('closed-card'); }
      });
    } catch (_) {}
  } catch (_) {
    showCard('error-card');
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

load();
</script>
</body>
</html>
