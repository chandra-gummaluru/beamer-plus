<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Respond — Beamer+</title>
<script src="/static/vendor/socket.io.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');

:root {
  --bg:         #ffffff;
  --bg-subtle:  #f9f9f8;
  --border:     #e9e9e6;
  --border-med: #d4d4cf;
  --text:       #1a1a18;
  --text-2:     #6b6b65;
  --text-3:     #aeaea5;
  --accent:     #52524e;
  --accent-bg:  #f0f0ee;
  --green:      #15803d;
  --red:        #dc2626;
  --radius:     8px;
  --font-mono:  'JetBrains Mono', ui-monospace, monospace;
  --font-ui:    'DM Sans', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  min-height: 100%; background: var(--bg);
  color: var(--text); font-family: var(--font-ui); font-size: 15px;
  display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}


/* ── Loading ─────────────────────────────────────────── */
#loading-area {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
}
.spinner {
  width: 24px; height: 24px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--text-3); }

/* ── Main form area ──────────────────────────────────── */
#main-area {
  flex: 1; display: none; flex-direction: column;
  padding: 28px 20px 32px;
  gap: 20px; max-width: 520px; width: 100%; margin: 0 auto;
}

.question-text {
  font-size: 1.35rem; font-weight: 500; line-height: 1.4;
  color: var(--text); text-align: center;
}

textarea {
  width: 100%; min-height: 110px;
  padding: 12px 14px;
  font-family: var(--font-ui); font-size: 15px; line-height: 1.55;
  color: var(--text); background: var(--bg-subtle);
  border: 1px solid var(--border); border-radius: var(--radius);
  outline: none; resize: vertical;
  transition: border-color 0.15s, background 0.15s;
  -webkit-appearance: none;
}
textarea:focus { border-color: var(--border-med); background: var(--bg); }
textarea:disabled { opacity: 0.5; }
textarea::placeholder { color: var(--text-3); }

.submit-btn {
  width: 100%; height: 48px;
  border: none; border-radius: var(--radius);
  background: var(--text); color: #fff;
  font-family: var(--font-ui); font-size: 15px; font-weight: 500;
  cursor: pointer; transition: background 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.submit-btn:hover:not(:disabled) { background: #2d2d2a; }
.submit-btn:disabled { opacity: 0.4; cursor: default; }

/* One-line answers: a word for the cloud, a number for an estimate. */
.line-input {
  width: 100%; height: 52px; padding: 0 14px;
  font-family: var(--font-ui); font-size: 18px; color: var(--text);
  background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius);
  outline: none; -webkit-appearance: none; text-align: center;
  transition: border-color 0.15s, background 0.15s;
}
.line-input:focus { border-color: var(--border-med); background: var(--bg); }
.line-input::placeholder { color: var(--text-3); }
.line-input:disabled { opacity: 0.5; }
.line-wrap { position: relative; }
.line-unit {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-mono); font-size: 14px; color: var(--text-3); pointer-events: none;
}
.field-error { min-height: 16px; font-size: 13px; color: var(--red); text-align: center; }

/* Rating scale: one button per point, the scale's end labels underneath. */
.scale { display: grid; gap: 8px; }
.scale-btn {
  height: 52px; border-radius: var(--radius);
  background: var(--bg-subtle); border: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 17px; font-weight: 600; color: var(--text-2);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.scale-btn.selected { background: var(--text); border-color: var(--text); color: #fff; }
.scale-btn:disabled { cursor: default; }
.scale-ends {
  display: flex; justify-content: space-between; gap: 16px;
  font-size: 12px; color: var(--text-2); margin-top: 8px;
}
.scale-ends span:last-child { text-align: right; }

.hint-text {
  font-size: 12px; color: var(--text-3);
  text-align: center; font-family: var(--font-mono);
}

/* ── Status cards ────────────────────────────────────── */
.status-card {
  flex: 1; display: none; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 24px; gap: 8px; text-align: center;
}
.status-card.visible { display: flex; }

.status-title {
  font-size: 1.3rem; font-weight: 600; color: var(--text);
  line-height: 1.3;
}
.status-sub {
  font-size: 14px; color: var(--text-3); line-height: 1.5; margin-top: 2px;
}
.status-card.ok .status-title { color: var(--green); }
.status-card.err .status-title { color: var(--red); }
</style>
</head>
<body>


<div id="loading-area">
  <div class="spinner"></div>
  <div class="loading-text">Loading…</div>
</div>

<div id="main-area">
  <div class="question-text" id="question-text"></div>
  <div id="input-slot"></div>
  <div class="field-error" id="field-error"></div>
  <button class="submit-btn" id="submit-btn" onclick="submit()">Submit</button>
  <div class="hint-text" id="hint-text">Ctrl + Enter to submit</div>
</div>

<div class="status-card ok" id="thanks-card">
  <div class="status-title">Thank you!</div>
  <div class="status-sub">Your response has been recorded.</div>
</div>

<div class="status-card" id="already-card">
  <div class="status-title">Already submitted</div>
  <div class="status-sub">You have already responded to this survey.</div>
</div>

<div class="status-card" id="closed-card">
  <div class="status-title">Survey closed</div>
  <div class="status-sub">This survey is no longer accepting responses.</div>
</div>

<div class="status-card err" id="error-card">
  <div class="status-title">Unavailable</div>
  <div class="status-sub" id="error-detail">This survey could not be loaded.</div>
</div>

<script>
const SURVEY_ID  = "{{ survey_id }}";
const SESSION_ID = "{{ session_id }}";
const API_PREFIX = `/s/${SESSION_ID}/api/survey`;
const SESSION_KEY = 'responded_' + SESSION_ID + '_' + SURVEY_ID;
const CARDS = ['thanks-card', 'already-card', 'closed-card', 'error-card'];

function showCard(id) {
  document.getElementById('loading-area').style.display = 'none';
  document.getElementById('main-area').style.display   = 'none';
  CARDS.forEach(c => document.getElementById(c).classList.toggle('visible', c === id));
}

// ── Answer input, by survey kind ─────────────────────────────────────────
// Every kind posts plain text; the presenter's widget interprets it.
let kind = 'open', rating = null, inputEl = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function buildInput(data) {
  kind = data.kind || 'open';
  const meta = data.meta || {};
  const slot = document.getElementById('input-slot');
  const hint = document.getElementById('hint-text');
  const btn  = document.getElementById('submit-btn');
  slot.textContent = '';

  if (kind === 'rating') {
    const lo = Number.isFinite(+meta.min) ? +meta.min : 1;
    const hi = Number.isFinite(+meta.max) ? Math.min(+meta.max, lo + 10) : 5;
    const grid = el('div', 'scale');
    const pts = hi - lo + 1;
    grid.style.gridTemplateColumns = `repeat(${pts > 7 ? Math.ceil(pts / 2) : pts}, 1fr)`;
    for (let v = lo; v <= hi; v++) {
      const b = el('button', 'scale-btn', String(v));
      b.type = 'button';
      b.addEventListener('click', () => {
        rating = v;
        grid.querySelectorAll('.scale-btn').forEach(x => x.classList.toggle('selected', x === b));
        btn.disabled = false;
      });
      grid.appendChild(b);
    }
    slot.appendChild(grid);
    if (meta.low || meta.high) {
      const ends = el('div', 'scale-ends');
      ends.appendChild(el('span', '', `${lo} · ${meta.low || ''}`));
      ends.appendChild(el('span', '', `${meta.high || ''} · ${hi}`));
      slot.appendChild(ends);
    }
    btn.disabled = true;
    hint.textContent = 'Tap a number, then submit';
    return;
  }

  if (kind === 'numeric' || kind === 'wordcloud') {
    const wrap = el('div', 'line-wrap');
    inputEl = el('input', 'line-input');
    inputEl.type = 'text';
    inputEl.autocomplete = 'off';
    if (kind === 'numeric') {
      inputEl.inputMode = 'decimal';
      inputEl.placeholder = 'Your estimate';
      if (meta.unit) wrap.appendChild(el('span', 'line-unit', meta.unit));
    } else {
      inputEl.maxLength = 60;
      inputEl.placeholder = (+meta.words || 1) > 1 ? 'A short phrase' : 'One word';
      inputEl.autocapitalize = 'none';
    }
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    wrap.insertBefore(inputEl, wrap.firstChild);
    slot.appendChild(wrap);
    hint.textContent = 'Enter to submit';
    setTimeout(() => inputEl.focus(), 50);
    return;
  }

  inputEl = el('textarea');
  inputEl.id = 'response-input';
  inputEl.placeholder = 'Type your response…';
  inputEl.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submit();
  });
  slot.appendChild(inputEl);
  hint.textContent = 'Ctrl + Enter to submit';
}

// The answer to send, or null (with the reason shown) if there isn't one yet.
function readAnswer() {
  const err = document.getElementById('field-error');
  err.textContent = '';
  if (kind === 'rating') return rating == null ? null : String(rating);
  const text = (inputEl?.value || '').trim();
  if (!text) { inputEl?.focus(); return null; }
  if (kind === 'numeric') {
    const n = Number(text.replace(/[\s,_]/g, ''));
    if (!Number.isFinite(n)) { err.textContent = 'Please enter a number.'; inputEl.focus(); return null; }
    return String(n);
  }
  return text;
}

function setInputsDisabled(off) {
  document.getElementById('submit-btn').disabled = off;
  if (inputEl) inputEl.disabled = off;
  document.querySelectorAll('.scale-btn').forEach(b => { b.disabled = off; });
}

async function submit() {
  const text = readAnswer();
  if (text == null) return;
  const btn = document.getElementById('submit-btn');
  setInputsDisabled(true);
  try {
    const res = await fetch(`${API_PREFIX}/${SURVEY_ID}/respond`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ response: text }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      if ((d.error || '').toLowerCase().includes('closed')) { showCard('closed-card'); return; }
      throw new Error(d.error || 'Failed');
    }
    sessionStorage.setItem(SESSION_KEY, '1');
    showCard('thanks-card');
  } catch (e) {
    setInputsDisabled(false);
  }
}

async function load() {
  if (sessionStorage.getItem(SESSION_KEY)) { showCard('already-card'); return; }
  try {
    const res = await fetch(`${API_PREFIX}/${SURVEY_ID}`);
    if (!res.ok) { showCard('error-card'); return; }
    const data = await res.json();
    if (!data.active) { showCard('closed-card'); return; }
    document.getElementById('question-text').textContent = data.question || 'Share your thoughts';
    buildInput(data);
    document.getElementById('loading-area').style.display = 'none';
    document.getElementById('main-area').style.display = 'flex';
    try {
      const socket = io();
      socket.emit('join_survey', { session_id: SESSION_ID, survey_id: SURVEY_ID });
      socket.on('survey_closed', d => { if (!d?.survey_id || d.survey_id === SURVEY_ID) showCard('closed-card'); });
    } catch (_) {}
  } catch (_) {
    document.getElementById('error-detail').textContent = 'Could not connect to the server.';
    showCard('error-card');
  }
}

load();
</script>
</body>
</html>
