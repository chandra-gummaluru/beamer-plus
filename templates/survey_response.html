<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Respond — Beamer+</title>
<script src="/static/vendor/socket.io.min.js"></script>
<!-- The presenter can write Markdown, $LaTeX$ and ```code``` blocks in a
     question; the phone has to show the same thing the slide does. Both are
     pinned to the versions the widgets use, so a deck fetches them once. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/js/respond-code.js"></script>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/fonts-cm.css">
<style>
:root {
  /* Local names for the app's tokens (static/css/tokens.css). */
  --bg:        var(--surface-paper);
  --bg-subtle: var(--surface-cream);
  --border:    var(--line-1);
  --border-med: var(--line-2);
  --text:      var(--ink-1);
  --text-2:    var(--ink-2);
  --text-3:    var(--ink-3);
  --accent-bg: var(--accent-soft);
  --green:     var(--success);
  --red:       var(--danger);
  --radius:    var(--r-md);
  --font-ui:   var(--font-sans);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  min-height: 100%; background: var(--bg);
  color: var(--text); font-family: var(--font-ui); font-size: 15px;
  display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}


/* ── Loading ─────────────────────────────────────────── */
#loading-area {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
}
.spinner {
  width: 24px; height: 24px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--text-3); }

/* ── Main form area ──────────────────────────────────── */
#main-area {
  flex: 1; display: none; flex-direction: column;
  padding: 28px 20px 32px;
  gap: 20px; max-width: 520px; width: 100%; margin: 0 auto;
}

.question-text {
  font-size: 1.35rem; font-weight: 500; line-height: 1.4;
  color: var(--text); text-align: center;
}

textarea {
  width: 100%; min-height: 110px;
  padding: 12px 14px;
  font-family: var(--font-ui); font-size: 15px; line-height: 1.55;
  color: var(--text); background: var(--bg-subtle);
  border: 1px solid var(--border); border-radius: var(--radius);
  outline: none; resize: vertical;
  transition: border-color 0.15s, background 0.15s;
  -webkit-appearance: none;
}
textarea:focus { border-color: var(--border-med); background: var(--bg); }
textarea:disabled { opacity: 0.5; }
textarea::placeholder { color: var(--text-3); }

.submit-btn {
  width: 100%; height: 48px;
  border: none; border-radius: var(--radius);
  background: var(--text); color: #fff;
  font-family: var(--font-ui); font-size: 15px; font-weight: 500;
  cursor: pointer; transition: background 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.submit-btn:hover:not(:disabled) { background: #2d2d2a; }
.submit-btn:disabled { opacity: 0.4; cursor: default; }

/* One-line answers: a word for the cloud, a number for an estimate. */
.line-input {
  width: 100%; height: 52px; padding: 0 14px;
  font-family: var(--font-ui); font-size: 18px; color: var(--text);
  background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius);
  outline: none; -webkit-appearance: none; text-align: center;
  transition: border-color 0.15s, background 0.15s;
}
.line-input:focus { border-color: var(--border-med); background: var(--bg); }
.line-input::placeholder { color: var(--text-3); }
.line-input:disabled { opacity: 0.5; }
.line-wrap { position: relative; }
/* iOS's decimal keypad has no minus key, so a numeric answer gets its own. */
.line-sign {
  position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
  width: 40px; height: 40px; border: 0; border-radius: calc(var(--radius) - 2px);
  background: transparent; color: var(--text-2, var(--text-3));
  font-family: var(--font-mono); font-size: 20px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.line-sign:active { background: var(--bg); }
.line-sign:disabled { opacity: 0.5; }
.line-wrap.has-sign .line-input { padding-left: 52px; padding-right: 52px; }
.line-unit {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-mono); font-size: 14px; color: var(--text-3); pointer-events: none;
}
.field-error { min-height: 16px; font-size: 13px; color: var(--red); text-align: center; }

/* Fill in the blanks: the presenter's template drawn as the slide draws it
   (Markdown, code listings — it is also .question-text, for their styles),
   with an input where each BLANK was. */
.fill-template p { margin: 0 0 0.6em; line-height: 1.5; }
.fill-template p:has(.blank-input, .pick-group) { line-height: 2.4; }   /* room for the boxes */
.fill-template p:last-child { margin-bottom: 0; }
.fill-template pre code { line-height: 2; }
.fill-para { display: flex; flex-direction: column; gap: 14px; margin: 0 0 0.6em; }
.fill-para:last-child { margin-bottom: 0; }
.fill-line { line-height: 2.4; }
.fill-field { display: flex; flex-direction: column; gap: 6px; }
.fill-label { line-height: 1.35; }
.fill-field .blank-input.is-full { width: 100%; margin: 0; height: 46px; }
.fill-field .pick-group { margin: 0; }
.blank-input {
  max-width: 100%;
  height: 40px;
  padding: 0 10px;
  margin: 2px 0;
  font-family: var(--font-mono);
  font-size: 16px;   /* under 16px, iOS zooms the page in on focus */
  vertical-align: middle;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border-med);
  border-radius: 5px;
  outline: none;
  text-align: left;
  -webkit-appearance: none;
  transition: border-color 0.15s;
}
.blank-input.in-code { height: 34px; }
.blank-input:focus { border-color: var(--text); }
/* A choice blank: chips in the line, round to pick one, square to pick any. */
.pick-group { display: inline-flex; flex-wrap: wrap; gap: 6px; vertical-align: middle; margin: 2px 0; }
.pick-btn {
  min-height: 40px; padding: 0 14px;
  font-family: var(--font-mono); font-size: 16px;
  color: var(--rs-ink, var(--text)); background: #fff;
  border: 2px solid var(--rs-ink, var(--text)); border-radius: 999px;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.pick-group.is-any .pick-btn { border-radius: 7px; }
.pick-group.is-any .pick-btn::before { content: '\2610\00a0'; }
.pick-group.is-any .pick-btn.is-on::before { content: '\2611\00a0'; }
.pick-btn.is-on { background: var(--rs-hl, #f7c548); }
.pick-btn:disabled { opacity: 0.55; }
.blank-input:disabled { opacity: 0.55; }

/* Rating scale: one button per point, the scale's end labels underneath. */
.scale { display: grid; gap: 8px; }
.scale-btn {
  height: 52px; border-radius: var(--radius);
  background: var(--bg-subtle); border: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 17px; font-weight: 600; color: var(--text-2);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.scale-btn.selected { background: var(--text); border-color: var(--text); color: #fff; }
.scale-btn:disabled { cursor: default; }
.scale-ends {
  display: flex; justify-content: space-between; gap: 16px;
  font-size: 12px; color: var(--text-2); margin-top: 8px;
}
.scale-ends span:last-child { text-align: right; }

/* 2D plot: a square to tap anywhere in, axis names along two edges and the
   ends' labels at the corners, the way the slide draws it. */
.plot { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; }
.plot-ylab {
  writing-mode: vertical-rl; transform: rotate(180deg);
  text-align: center; font-size: 13px; color: var(--text-2);
}
.plot-box {
  position: relative; aspect-ratio: 1; width: 100%;
  border-left: 2px solid var(--text, #1a1a18); border-bottom: 2px solid var(--text, #1a1a18);
  background: var(--bg-subtle, #f7f6f2);
  touch-action: none; cursor: crosshair; -webkit-tap-highlight-color: transparent;
}
.plot-box.is-off { pointer-events: none; opacity: 0.6; }
.plot-dot {
  position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px;
  border-radius: 50%; background: var(--text, #1a1a18); display: none;
}
.plot-corner { position: absolute; font-size: 11px; color: var(--text-3); pointer-events: none; }
.plot-xlab { grid-column: 2; display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--text-3); }
.plot-xname { font-size: 13px; color: var(--text-2); }

.hint-text {
  font-size: 12px; color: var(--text-3);
  text-align: center; font-family: var(--font-mono);
}

/* ── Status cards ────────────────────────────────────── */
.status-card {
  flex: 1; display: none; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 24px; gap: 8px; text-align: center;
}
.status-card.visible { display: flex; }

.status-title {
  font-size: 1.3rem; font-weight: 600; color: var(--text);
  line-height: 1.3;
}
.status-sub {
  font-size: 14px; color: var(--text-3); line-height: 1.5; margin-top: 2px;
}
.status-card.ok .status-title { color: var(--green); }
.status-card.err .status-title { color: var(--red); }

/* ── Rich question text ──────────────────────────────── */
.question-text p { margin: 0; }
.question-text p + p { margin-top: 0.6em; }
.question-text pre {
  margin: 14px 0;
  padding: 12px 14px;
  text-align: left;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border-med);
  border-radius: var(--radius);
  overflow-x: auto;
}
.question-text pre code {
  display: block;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 400;
  line-height: 1.5;
  white-space: pre;
  tab-size: 4;
  color: var(--text);
}
.question-text :not(pre) > code {
  padding: 0.1em 0.35em;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 0.88em;
}
.question-text ul, .question-text ol { margin: 8px 0 8px 1.2em; text-align: left; }
.question-text blockquote {
  margin: 8px 0; padding-left: 12px;
  border-left: 2px solid var(--border-med); color: var(--text-2); text-align: left;
}
.question-text img { max-width: 100%; }
.question-text.has-block { font-size: 1.1rem; text-align: left; }
</style>
<link rel="stylesheet" href="/static/css/respond.css">
</head>
<body>


<div id="loading-area">
  <div class="spinner"></div>
  <div class="loading-text">Loading…</div>
</div>

<div id="main-area">
  <div class="question-text" id="question-text"></div>
  <div id="input-slot"></div>
  <div class="field-error" id="field-error"></div>
  <button class="submit-btn" id="submit-btn" onclick="submit()">Submit</button>
  <div class="hint-text" id="hint-text"></div>
</div>

<div class="status-card ok" id="thanks-card">
  <div class="status-title">Thank you!</div>
  <div class="status-sub">Your response has been recorded.</div>
</div>

<div class="status-card" id="already-card">
  <div class="status-title">Already submitted</div>
  <div class="status-sub">You have already responded to this survey.</div>
</div>

<div class="status-card" id="closed-card">
  <div class="status-title">Survey closed</div>
  <div class="status-sub">This survey is no longer accepting responses.</div>
</div>

<div class="status-card err" id="error-card">
  <div class="status-title">Unavailable</div>
  <div class="status-sub" id="error-detail">This survey could not be loaded.</div>
</div>

<script>
const SURVEY_ID  = "{{ survey_id }}";
const SESSION_ID = "{{ session_id }}";
const API_PREFIX = `/s/${SESSION_ID}/api/survey`;
const SESSION_KEY = 'responded_' + SESSION_ID + '_' + SURVEY_ID;
const CARDS = ['thanks-card', 'already-card', 'closed-card', 'error-card'];

function showCard(id) {
  document.getElementById('loading-area').style.display = 'none';
  document.getElementById('main-area').style.display   = 'none';
  CARDS.forEach(c => document.getElementById(c).classList.toggle('visible', c === id));
}

// ── Answer input, by survey kind ─────────────────────────────────────────
// Every kind posts plain text; the presenter's widget interprets it.
let kind = 'open', rating = null, inputEl = null, point = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function buildInput(data) {
  kind = data.kind || 'open';
  const meta = data.meta || {};
  const slot = document.getElementById('input-slot');
  const hint = document.getElementById('hint-text');
  const btn  = document.getElementById('submit-btn');
  slot.textContent = '';

  if (kind === 'rating') {
    const lo = Number.isFinite(+meta.min) ? +meta.min : 1;
    const hi = Number.isFinite(+meta.max) ? Math.min(+meta.max, lo + 10) : 5;
    const grid = el('div', 'scale');
    const pts = hi - lo + 1;
    grid.style.gridTemplateColumns = `repeat(${pts > 7 ? Math.ceil(pts / 2) : pts}, 1fr)`;
    for (let v = lo; v <= hi; v++) {
      const b = el('button', 'scale-btn', String(v));
      b.type = 'button';
      b.addEventListener('click', () => {
        rating = v;
        grid.querySelectorAll('.scale-btn').forEach(x => x.classList.toggle('selected', x === b));
        btn.disabled = false;
      });
      grid.appendChild(b);
    }
    slot.appendChild(grid);
    if (meta.low || meta.high) {
      const ends = el('div', 'scale-ends');
      ends.appendChild(el('span', '', `${lo} · ${meta.low || ''}`));
      ends.appendChild(el('span', '', `${meta.high || ''} · ${hi}`));
      slot.appendChild(ends);
    }
    btn.disabled = true;
    hint.textContent = 'Tap a number, then submit';
    return;
  }

  if (kind === 'plot') {
    // Tap (or drag) anywhere in the square; the answer is where the dot is,
    // 0–1 across and 0–1 up.
    const wrap = el('div', 'plot');
    const box  = el('div', 'plot-box');
    const dot  = el('div', 'plot-dot');
    box.appendChild(dot);
    const corner = (text, css) => { if (!text) return; const c = el('span', 'plot-corner', text); Object.assign(c.style, css); box.appendChild(c); };
    corner(meta.yHigh, { top: '4px', left: '6px' });
    corner(meta.yLow,  { bottom: '4px', left: '6px' });
    wrap.appendChild(el('div', 'plot-ylab', meta.yLabel || ''));
    wrap.appendChild(box);
    const xl = el('div', 'plot-xlab');
    xl.appendChild(el('span', '', meta.xLow || ''));
    xl.appendChild(el('span', 'plot-xname', meta.xLabel || ''));
    xl.appendChild(el('span', '', meta.xHigh || ''));
    wrap.appendChild(xl);
    const place = e => {
      const r = box.getBoundingClientRect();
      const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      const y = Math.min(1, Math.max(0, 1 - (e.clientY - r.top) / r.height));
      point = [Math.round(x * 1000) / 1000, Math.round(y * 1000) / 1000];
      dot.style.display = 'block';
      dot.style.left = (x * 100) + '%';
      dot.style.top  = ((1 - y) * 100) + '%';
      btn.disabled = false;
    };
    box.addEventListener('pointerdown', e => { box.setPointerCapture(e.pointerId); place(e); });
    box.addEventListener('pointermove', e => { if (e.buttons) place(e); });
    slot.appendChild(wrap);
    btn.disabled = true;
    hint.textContent = 'Tap to place your dot, then submit';
    return;
  }

  if (kind === 'fill') {
    // The template is Markdown, like the question, and drawn the same way.
    // Each blank goes through as one private-use character (U+E100 + its
    // number) that Markdown and the code colouring leave alone, and is
    // swapped for its input afterwards.
    const tpl = String(meta.template || '');
    blanks = blankSpecs(tpl);
    let n = 0;
    const box = el('div', 'fill-template question-text has-block');
    // Its lines as typed, as on the slide ("Description: ___" over "passwd: ___").
    renderRich(box, tpl.replace(BLANK_RE, () => String.fromCharCode(BLANK_CH + n++)), true);
    const isMark = c => c >= BLANK_CH && c < BLANK_CH + 0x0F00;
    const nodes = [];
    const walk = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
    while (walk.nextNode()) if ([...walk.currentNode.data].some(ch => isMark(ch.charCodeAt(0)))) nodes.push(walk.currentNode);
    nodes.forEach(node => {
      const inCode = !!node.parentElement?.closest('pre');
      const frag = document.createDocumentFragment();
      let text = '';
      for (const ch of node.data) {
        const c = ch.charCodeAt(0);
        if (!isMark(c)) { text += ch; continue; }
        if (text) { frag.appendChild(document.createTextNode(text)); text = ''; }
        const k = c - BLANK_CH;
        frag.appendChild(blankInput(blanks[k] || { kind: 'text', width: 0 }, k, inCode));
      }
      if (text) frag.appendChild(document.createTextNode(text));
      node.replaceWith(frag);
    });
    formFields(box);
    slot.appendChild(box);
    hint.textContent = '';   // the keys still work; a phone has none to show
    setTimeout(() => slot.querySelector('.blank-input')?.focus(), 50);
    return;
  }

  if (kind === 'numeric' || kind === 'wordcloud') {
    const wrap = el('div', 'line-wrap');
    inputEl = el('input', 'line-input');
    inputEl.type = 'text';
    inputEl.autocomplete = 'off';
    if (kind === 'numeric') {
      inputEl.inputMode = 'decimal';
      inputEl.placeholder = meta.prompt || 'Your estimate';
      if (meta.unit) wrap.appendChild(el('span', 'line-unit', meta.unit));
      const sign = el('button', 'line-sign', '±');
      sign.type = 'button';
      sign.setAttribute('aria-label', 'Make negative or positive');
      sign.addEventListener('pointerdown', e => e.preventDefault());   // keep the keypad up
      sign.addEventListener('click', () => {
        const v = inputEl.value.replace(/^\s+/, '');
        inputEl.value = /^[-\u2212\u2013\u2014]/.test(v) ? v.slice(1) : '-' + v;
        inputEl.focus();
        const end = inputEl.value.length;
        try { inputEl.setSelectionRange(end, end); } catch (_) {}
      });
      wrap.appendChild(sign);
      wrap.classList.add('has-sign');
    } else {
      inputEl.maxLength = 60;
      inputEl.placeholder = (+meta.words || 1) > 1 ? 'A short phrase' : 'One word';
      inputEl.autocapitalize = 'none';
    }
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    wrap.insertBefore(inputEl, wrap.firstChild);
    slot.appendChild(wrap);
    hint.textContent = '';   // the keys still work; a phone has none to show
    setTimeout(() => inputEl.focus(), 50);
    return;
  }

  inputEl = el('textarea');
  inputEl.id = 'response-input';
  inputEl.placeholder = 'Type your response…';
  inputEl.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submit();
  });
  slot.appendChild(inputEl);
  hint.textContent = '';   // the keys still work; a phone has none to show
}

// The answer to send, or null (with the reason shown) if there isn't one yet.
function readAnswer() {
  const err = document.getElementById('field-error');
  err.textContent = '';
  if (kind === 'rating') return rating == null ? null : String(rating);
  if (kind === 'plot')   return point == null ? null : JSON.stringify(point);
  if (kind === 'fill') {
    // One answer per blank, in order — the slide replays them into the
    // question as the presenter steps through the responses. Pick-any gives
    // a list (possibly empty: "none of these" is an answer).
    const vals = blanks.map((b, k) => {
      const box = document.querySelector(`[data-blank="${k}"]`);
      if (!box) return '';
      if (b.kind === 'text') return box.value.trim();
      const on = [...box.querySelectorAll('.pick-btn.is-on')].map(x => x.dataset.v);
      return b.kind === 'any' ? on : (on[0] || '');
    });
    const empty = blanks.findIndex((b, k) => b.kind !== 'any' && !vals[k]);
    if (empty >= 0) {
      err.textContent = blanks[empty].kind === 'one' ? `Pick an answer for blank ${empty + 1}.` : `Fill in blank ${empty + 1}.`;
      const box = document.querySelector(`[data-blank="${empty}"]`);
      (box?.matches('input') ? box : box?.querySelector('button'))?.focus();
      box?.scrollIntoView({ block: 'center', behavior: 'smooth' });
      return null;
    }
    return JSON.stringify(vals);
  }
  const text = (inputEl?.value || '').trim();
  if (!text) { inputEl?.focus(); return null; }
  if (kind === 'numeric') {
    const n = Number(text.replace(/[\s,_]/g, '').replace(/^[\u2212\u2013\u2014]/, '-'));
    if (!Number.isFinite(n)) { err.textContent = 'Please enter a number.'; inputEl.focus(); return null; }
    return String(n);
  }
  return text;
}

function setInputsDisabled(off) {
  document.getElementById('submit-btn').disabled = off;
  if (inputEl) inputEl.disabled = off;
  document.querySelectorAll('.line-sign').forEach(b => { b.disabled = off; });
  document.querySelectorAll('.scale-btn, .blank-input, .pick-btn').forEach(b => { b.disabled = off; });
  document.querySelectorAll('.plot-box').forEach(b => b.classList.toggle('is-off', off));
}

async function submit() {
  const text = readAnswer();
  if (text == null) return;
  const btn = document.getElementById('submit-btn');
  setInputsDisabled(true);
  try {
    const res = await fetch(`${API_PREFIX}/${SURVEY_ID}/respond`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ response: text }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      if ((d.error || '').toLowerCase().includes('closed')) { showCard('closed-card'); return; }
      if (d.rejected) {
        // The content filter turned it down: say so, keep what they typed
        // so they can rephrase it.
        setInputsDisabled(false);
        document.getElementById('field-error').textContent = d.error;
        (inputEl || document.querySelector('.blank-input'))?.focus();
        return;
      }
      throw new Error(d.error || 'Failed');
    }
    sessionStorage.setItem(SESSION_KEY, '1');
    showCard('thanks-card');
  } catch (e) {
    setInputsDisabled(false);
    document.getElementById('field-error').textContent = "Couldn't send your answer. Please try again.";
  }
}

// ── Fill in the blanks ───────────────────────────────────────────────────────
// The grammar the widget writes (see blankSpec in
// widgets/audience-response.html — keep the two in step):
//   BLANK or ___        a text box; written as underscores, as wide as they are
//   BLANK(a ^ b)        pick exactly one   (XOR too)
//   BLANK(a | b)        pick any number    (OR too)
// A * marks a right option; the phone doesn't show which.
const BLANK_RE = /\bBLANK\((?=[^()\n]*(?:\^|\||\sX?OR\s))[^()\n]*\)|\bBLANK\b|_{3,}/g;
const BLANK_CH = 0xE100;
let blanks = [];
function blankSpec(tok) {
  const m = /^BLANK\((.*)\)$/.exec(tok);
  if (!m) return { kind: 'text', width: tok[0] === '_' ? Math.min(40, Math.max(4, tok.length)) : 0 };
  const body = ' ' + m[1] + ' ';
  const one = /\^|\sXOR\s/.test(body), any = /\||\sOR\s/.test(body);
  const options = m[1].split(/\s*[\^|]\s*|\s+X?OR\s+/).map(o => o.trim().replace(/^\*\s*/, '')).filter(Boolean);
  return { kind: one && !any ? 'one' : any && !one ? 'any' : 'one', options };
}
const blankSpecs = src => [...String(src || '').matchAll(BLANK_RE)].map(m => blankSpec(m[0]));

// "Description: ___" on a line of its own reads as a form field, so it is
// laid out as one: the label on top, the box the full width under it, every
// box lined up with the next. A blank inside a sentence ("returns ___ because
// ___") stays in the sentence, and blanks in code stay in the code.
function formFields(box) {
  const isBlank = n => n.nodeType === 1 && (n.classList.contains('blank-input') || n.classList.contains('pick-group'));
  const isEmpty = n => n.nodeType === 3 ? !n.data.trim() : n.nodeName === 'BR';
  box.querySelectorAll('p').forEach(p => {
    if (p.closest('pre') || !p.querySelector('.blank-input, .pick-group')) return;
    // The paragraph's lines (single line breaks are kept, see renderRich).
    const lines = [[]];
    [...p.childNodes].forEach(n => { if (n.nodeName === 'BR') lines.push([]); else lines[lines.length - 1].push(n); });
    const out = document.createElement('div');
    out.className = 'fill-para';
    lines.forEach(line => {
      const blanks = line.filter(isBlank);
      const at = line.indexOf(blanks[0]);
      const field = blanks.length === 1 && at > 0 && line.slice(at + 1).every(isEmpty)
                 && line.slice(0, at).some(n => !isEmpty(n));
      if (field) {
        const f = document.createElement('label');
        f.className = 'fill-field';
        const lab = document.createElement('span');
        lab.className = 'fill-label';
        line.slice(0, at).forEach(n => lab.appendChild(n));
        // "Description: " → "Description:" — the space was for the inline box.
        const last = lab.lastChild;
        if (last?.nodeType === 3) last.data = last.data.replace(/\s+$/, '');
        f.appendChild(lab);
        const b = blanks[0];
        if (b.matches('.blank-input')) { b.classList.add('is-full'); b.style.width = ''; }
        f.appendChild(b);
        out.appendChild(f);
      } else if (line.some(n => !isEmpty(n))) {
        const l = document.createElement('div');
        l.className = 'fill-line';
        line.forEach(n => l.appendChild(n));
        out.appendChild(l);
      }
    });
    p.replaceWith(out);
  });
}

// A blank's input. A text box starts at a useful size — its underscores'
// width if it was written as ___, else wider in prose than in code — and
// grows (never shrinks below that) as it's typed in. A choice blank is a row
// of chips: round to pick one, square to pick any.
function blankInput(spec, k, inCode) {
  if (spec.kind === 'text') {
    const inp = el('input', 'blank-input' + (inCode ? ' in-code' : ''));
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.autocapitalize = 'none';
    inp.spellcheck = false;
    inp.dataset.blank = k;
    inp.setAttribute('aria-label', `Blank ${k + 1}`);
    const base = spec.width || (inCode ? 10 : 14);
    inp.style.width = base + 'ch';
    inp.addEventListener('input', () => {
      if (inp.classList.contains('is-full')) return;   // a form field is already the full width
      inp.style.width = Math.max(base, Math.min(40, inp.value.length + 2)) + 'ch';
    });
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const all = [...document.querySelectorAll('.blank-input')];
      const next = all[all.indexOf(inp) + 1];
      if (next) next.focus(); else submit();
    });
    return inp;
  }
  const group = el('span', 'pick-group' + (spec.kind === 'any' ? ' is-any' : ''));
  group.dataset.blank = k;
  group.setAttribute('role', spec.kind === 'any' ? 'group' : 'radiogroup');
  group.setAttribute('aria-label', `Blank ${k + 1}` + (spec.kind === 'any' ? ' (pick any)' : ''));
  spec.options.forEach(o => {
    const b = el('button', 'pick-btn', o);
    b.type = 'button';
    b.dataset.v = o;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      const on = !b.classList.contains('is-on');
      if (spec.kind === 'one') group.querySelectorAll('.pick-btn').forEach(x => { x.classList.remove('is-on'); x.setAttribute('aria-pressed', 'false'); });
      b.classList.toggle('is-on', spec.kind === 'one' ? true : on);
      b.setAttribute('aria-pressed', b.classList.contains('is-on') ? 'true' : 'false');
      document.getElementById('field-error').textContent = '';
    });
    group.appendChild(b);
  });
  return group;
}

// The question as the presenter wrote it: Markdown, $LaTeX$ and code blocks.
// Falls back to plain text when the CDN can't be reached, so a phone on a
// captive network still sees the question.
function setQuestion(src) {
  const el = document.getElementById('question-text');
  el._src = src = src || '';
  renderRich(el, src);
  el.classList.toggle('has-block', !!el.querySelector('pre, ul, ol, blockquote'));
}
// Markdown, code listings and maths into `el`. Plain text without marked.
function renderRich(el, src, breaks = false) {
  if (!window.marked) { el.textContent = src; return; }
  el.innerHTML = marked.parse(src, { breaks });
  if (window.decorateCode) decorateCode(el);
  if (window.renderMathInElement) {
    renderMathInElement(el, {
      delimiters: [
        { left: '$$',  right: '$$',  display: true  },
        { left: '$',   right: '$',   display: false },
        { left: '\\(', right: '\\)', display: false },
        { left: '\\[', right: '\\]', display: true  },
      ], throwOnError: false,
    });
  }
}
// KaTeX is deferred, so the maths may only be ready after the first paint.
window.addEventListener('load', () => {
  const el = document.getElementById('question-text');
  if (el && el._src) setQuestion(el._src);
  // The fill-in template has its inputs in it by now, so only its maths is
  // redone (auto-render leaves the inputs alone), not the whole thing.
  const fill = document.querySelector('.fill-template');
  if (fill && window.renderMathInElement) {
    renderMathInElement(fill, { delimiters: [
      { left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false },
      { left: '\\(', right: '\\)', display: false }, { left: '\\[', right: '\\]', display: true },
    ], throwOnError: false });
  }
});

async function load() {
  if (sessionStorage.getItem(SESSION_KEY)) { showCard('already-card'); return; }
  try {
    const res = await fetch(`${API_PREFIX}/${SURVEY_ID}`);
    if (!res.ok) { showCard('error-card'); return; }
    const data = await res.json();
    if (!data.active) { showCard('closed-card'); return; }
    setQuestion(data.question || 'Share your thoughts');
    buildInput(data);
    document.getElementById('loading-area').style.display = 'none';
    document.getElementById('main-area').style.display = 'flex';
    try {
      const socket = io();
      socket.emit('join_survey', { session_id: SESSION_ID, survey_id: SURVEY_ID });
      socket.on('survey_closed', d => { if (!d?.survey_id || d.survey_id === SURVEY_ID) showCard('closed-card'); });
    } catch (_) {}
  } catch (_) {
    document.getElementById('error-detail').textContent = 'Could not connect to the server.';
    showCard('error-card');
  }
}

load();
</script>
